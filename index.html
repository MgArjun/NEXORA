<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10"><meta name="author" content="Suraj Kumar">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#070a10;--ln:rgba(255,255,255,.09);--mu:#8b97ab;--a:#7c8cff;--b:#b07cff;--g:#3fd68f;--r:#ff6377;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#f4f6fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;font-size:16px;color:inherit}button{border:0;background:none;cursor:pointer}
.h{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column}
.grad{background:linear-gradient(135deg,#fff,#8e9cff,#c18cff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:gs 5s linear infinite}
@keyframes gs{to{background-position:200% center}}
.pw{font-size:11px;color:var(--mu);text-align:center}.pw b{color:#aab3ff}
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(circle at 50% 40%,#1a2140,#070a10 70%);transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
.scene{width:90px;height:90px;perspective:500px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 3s var(--e) both}
.cube i{position:absolute;inset:0;border-radius:16px;border:2px solid rgba(160,172,255,.7);background:linear-gradient(135deg,rgba(124,140,255,.5),rgba(176,124,255,.35));box-shadow:inset 0 0 22px rgba(255,255,255,.2)}
.cube i:nth-child(1){transform:translateZ(45px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(45px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(45px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
@keyframes spin{from{transform:rotateX(-80deg) rotateY(-200deg) scale(.3);opacity:0}to{transform:rotateX(-25deg) rotateY(335deg) scale(1);opacity:1}}
#splash h1{margin:0;font-size:44px;letter-spacing:-2px;font-weight:900}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
#splash h1,#splash .pw{animation:rise 1s .4s var(--e) both}
#auth{flex:1;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,rgba(124,140,255,.16),transparent 40%),radial-gradient(circle at 85% 85%,rgba(176,124,255,.14),transparent 40%)}
.acard{width:min(420px,100%);padding:30px;border-radius:28px;border:1px solid var(--ln);background:rgba(15,22,35,.9);box-shadow:0 24px 70px rgba(0,0,0,.45);animation:pop .6s var(--e) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
.acard h1{margin:0;font-size:30px;letter-spacing:-1px}.acard p{color:var(--mu);margin:6px 0 20px}
input{width:100%;height:52px;padding:0 16px;margin-bottom:12px;border-radius:15px;border:1px solid var(--ln);background:#0a101b;outline:none}
input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(124,140,255,.14)}
.btn{position:relative;overflow:hidden;min-height:48px;padding:0 18px;border-radius:14px;background:#182234;border:1px solid var(--ln);font-weight:700;transition:transform .15s var(--e);box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4);filter:brightness(1.25)}.btn:disabled{opacity:.5}
.pri{background:linear-gradient(135deg,#7889ff,#9a78ff);border-color:transparent}
.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sh 3.5s infinite}
@keyframes sh{60%,100%{transform:translateX(120%)}}
.red{color:#ff8797;background:rgba(255,99,119,.12)}.wide{width:100%}
#amsg{min-height:20px;font-size:13px;text-align:center;margin:10px 0 0;color:var(--mu)}
.sw{text-align:center;margin-top:14px;font-size:14px;color:var(--mu)}.sw button{color:#a8b0ff;font-weight:700;font-size:14px}
#shell{flex:1;min-height:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--ln);background:rgba(7,10,16,.85);backdrop-filter:blur(18px)}
.top b{font-size:19px;font-weight:900}
.ib{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#1a2540,#0f1626);border:1px solid var(--ln);display:grid;place-items:center;position:relative;flex:none;color:#b9c2ff;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .15s var(--e),box-shadow .15s}
.ib:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.ib.ed{color:#a8b0ff}.ib.ok{color:#8ff0bd}.ib.del{color:#ff8797;background:linear-gradient(145deg,#3a1822,#220e15)}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--r);box-shadow:0 0 10px var(--r)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:linear-gradient(135deg,#697cff,#a26cff);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 8px 18px -4px rgba(104,124,255,.6),inset 0 2px 0 rgba(255,255,255,.35)}
main{flex:1;min-height:0;position:relative;perspective:1200px}
.pg{height:100%;overflow:auto;padding:20px 18px 28px;animation:pgin .45s var(--e) both;transform-origin:50% 0}
@keyframes pgin{from{opacity:0;transform:translateY(14px) rotateX(5deg)}}
/* games redraw the page on every move: never replay the fade (this was the black flash) */
.pg:has(.bd,.uh,#ldCv){animation:none}
.pg:has(.bd,.uh,#ldCv) .grid>*,.pg:has(.bd,.uh,#ldCv) .card{animation:none}
.nav{flex:none;height:66px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ln);background:rgba(8,11,17,.95);box-sizing:content-box;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{display:grid;place-content:center;justify-items:center;gap:2px;color:#778398;font-size:11px;position:relative}
.nav span{display:grid;place-items:center}
.nav svg{width:24px;height:24px;transition:transform .3s var(--e)}
.nav .on{color:#a8b0ff}.nav .on svg{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 8px var(--a))}
.nav .on::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--a),var(--b))}
h2{font-size:27px;margin:2px 0 6px;letter-spacing:-.8px;text-shadow:0 2px 0 rgba(0,0,0,.35)}.sub{color:var(--mu);margin:0 0 16px}
.card{border:1px solid var(--ln);border-radius:22px;background:linear-gradient(145deg,rgba(30,41,66,.72),rgba(13,19,31,.78));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 38px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qc{padding:18px;min-height:116px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s var(--e)}
.qc:active{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(.96)}.qc b{display:block}.qc small{color:var(--mu)}
.gi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 6px 0 -1px rgba(0,0,0,.35),0 14px 24px -8px var(--g1),inset 0 2px 0 rgba(255,255,255,.35)}
.gi svg{width:26px;height:26px;stroke-width:2.2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.live{display:inline-flex;gap:8px;align-items:center;color:#7ce3ae;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.row{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:10px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px;text-align:center;color:var(--mu)}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.pr .t{flex:1}.pr small{display:block;color:var(--mu);font-size:12px}
.tg2{width:50px;height:30px;border-radius:15px;background:#26324a;position:relative;flex:none;transition:.25s}
.tg2 i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
.tg2.on{background:linear-gradient(135deg,var(--a),var(--b))}.tg2.on i{transform:translateX(20px)}
.ov{position:fixed;inset:0;z-index:8500;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px}
.md{width:min(480px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(160deg,rgba(24,34,56,.96),rgba(12,18,30,.97));border:1px solid var(--ln);border-radius:26px;padding:22px;animation:pop .3s var(--e) both;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.md h3{margin:0 0 4px;font-size:21px}
#toast{position:fixed;left:50%;bottom:96px;z-index:9000;transform:translate(-50%,14px);padding:12px 16px;border-radius:14px;background:#121925;border:1px solid var(--ln);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#net{position:fixed;top:0;left:0;right:0;z-index:9500;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;text-align:center;font-size:13px;font-weight:800;color:#fff;background:#ff4d63;transform:translateY(-110%);transition:transform .3s var(--e)}
#net.show{transform:none}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:orb 26s ease-in-out infinite alternate}
.orbs i:nth-child(1){background:#5b6dff;left:-20vmax;top:-20vmax}
.orbs i:nth-child(2){background:#b05cff;right:-25vmax;top:30vh;animation-delay:-8s}
.orbs i:nth-child(3){background:#2fd6a0;left:10vmax;bottom:-30vmax;opacity:.15;animation-delay:-15s}
@keyframes orb{to{transform:translate(8vmax,6vmax) scale(1.2)}}
#app{position:relative;z-index:1}
/* chat */
.chat{padding:0!important;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);background:rgba(12,17,25,.8)}
.cb{flex:1;min-height:0;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:5px}
.m{max-width:80%;padding:9px 13px 6px;border-radius:19px;line-height:1.4;word-break:break-word;animation:mi .3s var(--e) both}
@keyframes mi{from{opacity:0;transform:translateY(12px) scale(.94)}}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#6f82ff,#9a74f0);border-bottom-right-radius:6px;box-shadow:0 6px 14px -4px rgba(111,130,255,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.m.th{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:6px;box-shadow:0 4px 12px -6px #000,inset 0 1px 0 rgba(255,255,255,.08)}
.m small{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:2px}
.cp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.cp input{margin:0;border-radius:26px;flex:1}
.snd{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7889ff,#a077ff);flex:none;display:grid;place-items:center;color:#fff}
/* tic-tac-toe */
.bd{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:420px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:13px;background:#162033;border:1px solid var(--ln);font-size:clamp(24px,8vw,42px);font-weight:900;transition:transform .15s var(--e);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.cell:active{transform:scale(.9)}
.cell.n{animation:cp .35s var(--e)}@keyframes cp{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.cell.w{background:linear-gradient(135deg,#2b3c78,#5a3a96);box-shadow:0 0 22px rgba(124,140,255,.6);animation:wn .8s ease-in-out infinite alternate}
@keyframes wn{to{transform:scale(1.07)}}
.X{color:#9aa7ff}.O{color:#ff8999}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ic.rot{transform:rotate(135deg)}
/* call screen + draggable pill */
#call{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);background:radial-gradient(circle at 50% 0,#2b3470,transparent 60%),radial-gradient(circle at 85% 100%,#5b2e8a,transparent 55%),#070a14}
.ctop{align-self:stretch;display:flex;justify-content:space-between;align-items:center;color:#8e9cff;font-size:12px;letter-spacing:3px}
.cmid{display:flex;flex-direction:column;align-items:center;text-align:center}
.cav{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:900;background:linear-gradient(135deg,#687cff,#a36eff);box-shadow:0 20px 56px rgba(104,124,255,.6)}
.cav::before,.cav::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(150,165,255,.6);animation:rip 2.4s ease-out infinite}.cav::after{animation-delay:1.2s}
@keyframes rip{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.cnm{font-size:30px;font-weight:900;margin-top:22px}.cst{color:var(--mu);margin-top:6px}
.ctm{font-size:26px;font-variant-numeric:tabular-nums;margin-top:14px;opacity:0}#call.on .ctm{opacity:1}
.eq{display:none;gap:4px;height:28px;align-items:flex-end;margin-top:12px}#call.on .eq{display:flex}
.eq i{width:5px;height:100%;border-radius:3px;background:linear-gradient(#8e9cff,#c18cff);transform-origin:bottom;animation:eqa 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eqa{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.cbs{display:flex;gap:18px;justify-content:center}
.cb2{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff}
.cb2 .ic{width:28px;height:28px}.cb2.r{background:linear-gradient(145deg,#ff5468,#c21f35);border-color:transparent}
.cb2.gn{background:linear-gradient(145deg,#38d98b,#1a9e5f);border-color:transparent;animation:shk 1s ease-in-out infinite}.cb2.on{background:#fff;color:#000}
@keyframes shk{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(0)}}
#cGame{display:none}#call.on #cGame{display:grid}
#call.mn{inset:auto;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);padding:6px 8px;flex-direction:row;gap:10px;border-radius:40px;border:1px solid var(--ln);box-shadow:0 14px 40px rgba(0,0,0,.6);background:#101a2c;touch-action:none;cursor:grab;user-select:none}
#call.mn .cmid{flex-direction:row;gap:8px}#call.mn .cav{width:38px;height:38px;font-size:14px;box-shadow:none}
#call.mn .cav::before,#call.mn .cav::after,#call.mn .cnm,#call.mn .cst,#call.mn .eq,#call.mn .ctop,#call.mn #cAcc,#call.mn #cGame{display:none!important}
#call.mn .ctm{margin:0;font-size:15px}#call.mn .cb2{width:38px;height:38px}#call.mn .cb2 .ic{width:18px;height:18px}
/* ludo */
.dice{width:78px;height:78px;border-radius:20px;background:linear-gradient(145deg,#fffdf6,#d9d2bd);color:#2b0a0a;font-size:58px;line-height:1;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 -5px 8px rgba(0,0,0,.15);flex:none;opacity:.55;transition:opacity .2s;position:relative}
#ldBan{margin-bottom:12px;padding:11px 16px;border-radius:16px;font-weight:850;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--tb) 28%,#101722),#101722);border:1px solid color-mix(in srgb,var(--tb) 55%,transparent)}
#ldBan i{width:12px;height:12px;border-radius:50%;background:var(--tb);box-shadow:0 0 12px var(--tb)}
.lp{padding:10px 12px;border-radius:14px;background:#111925;border:1px solid var(--ln);display:flex;align-items:center;gap:10px;transition:.3s}.lp.on{border-color:var(--gc);box-shadow:0 0 20px -6px var(--gc)}.lp em{width:14px;height:14px;border-radius:50%;background:var(--gc)}
.wo{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,10,16,.78);backdrop-filter:blur(4px);border-radius:22px;text-align:center;font-size:26px;font-weight:900;animation:fade .5s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.grid>*,.pg>.card,.row{animation:rs .5s var(--e) backwards}
.grid>*:nth-child(2){animation-delay:.06s}.grid>*:nth-child(3){animation-delay:.12s}.grid>*:nth-child(4){animation-delay:.18s}.grid>*:nth-child(5){animation-delay:.24s}
@keyframes rs{from{opacity:0;transform:translateY(14px) scale(.97)}}
.fe{position:fixed;z-index:9800;font-size:44px;pointer-events:none;animation:fl 2.2s ease-out forwards}
@keyframes fl{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.2)}100%{transform:translateY(-240px) scale(1);opacity:0}}
.ep{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ep button{font-size:34px;height:64px;border-radius:16px;background:#162033;transition:transform .15s}.ep button:active{transform:scale(1.2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dice.d3{background:none;box-shadow:none;perspective:420px;font-size:0;display:grid;place-items:center;transition:opacity .2s}
.d3 .c{width:52px;height:52px;position:relative;transform-style:preserve-3d;transition:transform .6s var(--e)}
.d3 .c.tm{transition:none;animation:tmb .6s linear infinite}
@keyframes tmb{0%{transform:translateY(0) rotateX(0) rotateY(0)}50%{transform:translateY(-16px) rotateX(360deg) rotateY(270deg) rotateZ(90deg)}100%{transform:translateY(0) rotateX(720deg) rotateY(540deg) rotateZ(180deg)}}
.d3 .f{position:absolute;inset:0;border-radius:10px;background:radial-gradient(circle at 30% 25%,#fffef8,#e9e1cb 70%,#cfc5a8);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(120,100,60,.35),inset 0 -3px 6px rgba(0,0,0,.14)}
.d3 s{place-self:center;width:9px;height:9px;border-radius:50%}.d3 s.p{background:radial-gradient(circle at 35% 30%,#555,#0d0d0d);box-shadow:inset 0 2px 3px rgba(0,0,0,.8)}
.dice.d3::after{content:"";position:absolute;bottom:2px;left:16px;right:16px;height:10px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(5px);z-index:-1}
#ldCv{width:min(100%,calc(100dvh - 290px))!important;margin:0 auto}
@media (min-width:720px) and (orientation:landscape){.pg>div[style*="max-width:560px"]{max-width:920px!important}
#ldCard.lw{display:grid;grid-template-columns:auto minmax(230px,1fr);gap:18px;align-items:center}
#ldCard .lctl>div:first-child{flex-direction:column;align-items:flex-start;margin-top:0;gap:14px}

async function matchmake(kind){stopRM();if(S.room)closeRoom(true);
 if(kind==="call"){if(C)return toast("End your current call first");try{(await mic()).getTracks().forEach(t=>t.stop())}catch(e){return toast(e.message)}}

 ch.on("presence",{event:"sync"},()=>{if(RM!==R||R.done)return;const seen={};Object.values(ch.presenceState()).flat().forEach(x=>{if(x?.id)seen[x.id]=x});
  const l=Object.values(seen).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1)),i=l.findIndex(x=>x.id===me.id);if(i<0)return;const j=i%2?i-1:i+1;if(j>=l.length)return;
  R.done=true;const o=l[j];sfx("match");vib([60,40,60]);$("rmN")&&($("rmN").textContent="Match found!");
  setTimeout(()=>{if(RM!==R)return;const host=i<j;
   if(kind==="chat"){stopRM();closeModal();openChat("",o.id,o.un,o.name)}
   else if(kind==="call"){if(host){stopRM();closeModal();startCall(o.id,o.name,true)}else R.wt=setTimeout(()=>{if(RM===R){stopRM();closeModal();toast("The match did not connect. Try again")}},20000)}
   else if(kind==="ludo"){const code=hash("L"+[me.id,o.id].sort().join(""));stopRM();closeModal();host?hostLudo(code,o):openLR(code,false,o)}
   else if(kind==="uno"){const code=hash("U"+[me.id,o.id].sort().join(""));stopRM();closeModal();host?hostUno(code,o):uOpen(code,false,o)}
   else{const code=hash([me.id,o.id].sort().join(""));stopRM();closeModal();host?hostTTT(code,o):openRoom(code,false,o)}},700)});
 await new Promise(r=>{ch.subscribe(s=>{if(s==="SUBSCRIBED")r()});setTimeout(r,6000)});try{await ch.track(me)}catch(_){}
 R.to=setTimeout(()=>{if(RM===R&&!R.done){stopRM();openModal(`<h3>No one found 😕</h3><p class="sub">Nobody else is searching right now.</p>${kind==="ttt"?`<button class="btn pri wide" style="margin-bottom:10px" onclick="startG('bot')">🤖 Play against the robot</button>`:""}<button class="btn wide" style="margin-bottom:10px" onclick="closeModal();matchmake('${kind}')">🔄 Search again</button><button class="btn wide" onclick="closeModal()">Close</button>`)}},60000)}

async function iceServers(){if(ICE_C&&Date.now()-ICE_T<3e5)return ICE_C;let l=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];

 ICE_C=l;ICE_T=Date.now();return l}
async function mkPc(c){const pc=c.pc=new RTCPeerConnection({iceServers:await iceServers(),iceCandidatePoolSize:4});
 c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
 pc.onicecandidate=e=>{if(e.candidate)sig({type:"ice",to:c.uid,id:c.id,c:e.candidate})};
 pc.ontrack=e=>{let a=$("ra");if(!a){a=document.createElement("audio");a.id="ra";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
 pc.oniceconnectionstatechange=()=>{if(C!==c)return;const s=pc.iceConnectionState;
  if(s==="connected"||s==="completed"){if(c.st!=="on"){c.st="on";c.t0=Date.now();clearTimeout(c.ct);sfx("up");wake(true)}c.net=null;clearInterval(c.rec);c.rec=0;clearTimeout(c.dead);paintCall()}
  else if(s==="disconnected"||s==="failed")recover(c)}}

let V=null,VS=null,vcOn=false;const VQ={};
const oppUid=()=>(S.room?.started&&S.room.oppId)||(LR?.started&&LR.oppId)||(UR?.started&&UR.oppId)||null;
async function vcPc(uid){const pc=new RTCPeerConnection({iceServers:await iceServers()}),v={uid,pc,q:[],init:false};
 v.tr=pc.addTransceiver("audio",{direction:"sendrecv"});
 pc.onicecandidate=e=>e.candidate&&sig({type:"vi",to:uid,c:e.candidate});
 pc.ontrack=e=>{let a=$("va");if(!a){a=document.createElement("audio");a.id="va";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>{})};
 pc.oniceconnectionstatechange=()=>{if(V===v&&["failed","closed"].includes(pc.iceConnectionState)){vcClose();toast("Voice disconnected")}};
 return v}
const flushV=()=>{while(V?.q.length)V.pc.addIceCandidate(V.q.shift()).catch(()=>{})};
function vcClose(){if(V){try{V.pc.close()}catch(_){}V=null}$("va")?.remove()}
function vcStop(notify){if(notify&&V)sig({type:"vx",to:V.uid});vcClose();try{VS?.getTracks().forEach(t=>t.stop())}catch(_){}VS=null;vcOn=false;paintVc()}

async function vcToggle(uid){if(!uid)return;
 if(vcOn){vcOn=false;VS?.getAudioTracks().forEach(t=>t.enabled=false);return paintVc()}
 if(!VS){try{VS=await mic()}catch(e){return toast(e.message)}}
 VS.getAudioTracks().forEach(t=>t.enabled=true);vcOn=true;
 if(!V){V=await vcPc(uid);V.init=true;
  try{await V.tr.sender.replaceTrack(VS.getAudioTracks()[0]);await V.pc.setLocalDescription(await V.pc.createOffer());if(!await sig({type:"vo",to:uid,sdp:V.pc.localDescription}))toast("Check your internet")}catch(_){toast("Voice could not start");vcClose()}}
 else V.tr.sender.replaceTrack(VS.getAudioTracks()[0]).catch(()=>{});

async function vcSig(p){const t=p.type;
 if(t==="vo"){if(oppUid()!==p.from)return;if(V?.init&&S.user.id<p.from)return;vcClose();V=await vcPc(p.from);V.q=VQ[p.from]||[];VQ[p.from]=[];

function tttMenu(){const s=t=>`<div class="pw" style="text-align:left;margin:14px 0 6px 4px">${t}</div>`;
 openModal(`<h3>❌ Tic-Tac-Toe</h3><p class="sub">5×5 board. Line up four to win.</p>${s("🌐 Random online")}<button class="btn pri wide" onclick="closeModal();matchmake('ttt')">Find player</button>

function lineWin(b,L=4,N=5){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=b[r*N+c];if(!v)continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;for(;k<L;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=N||x<0||x>=N||b[y*N+x]!==v)break}if(k===L)return{v,cells:Array.from({length:L},(_,i)=>(r+dr*i)*N+c+dc*i)}}}return null}
function startG(mode){closeModal();minCall(true);S.page="ttt";S.g={mode,b:Array(25).fill(""),t:"X",over:false,last:-1,msg:mode==="bot"?"Your turn (X)":"X's turn"};draw()}
function draw(){const g=S.g;if(!g||S.page!=="ttt")return;const on=g.mode==="online",w=lineWin(g.b);
 const foot=on?(g.over?`<div class="grid" style="max-width:420px;margin:18px auto 0"><button class="btn pri" ${S.room?.left?"disabled":""} onclick="rematch()">${g.rem?"⏳ Waiting…":"🔁 Rematch"}</button><button class="btn" onclick="leaveG();matchmake('ttt')">⚡ New match</button></div>`:""):`<button class="btn pri wide" style="margin:18px auto 0;display:block;max-width:420px" onclick="startG('${g.mode}')">Restart</button>`;
 $("main").innerHTML=`<section class="pg"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn" onclick="leaveG()">‹ Games</button><span style="flex:1"></span>${on?`<button class="ib" onclick="emoPop()" aria-label="Reactions">😀</button>`:""}${on&&S.room?.oppId?`<button class="ib" aria-label="Voice" onclick="voiceBtn('${S.room.oppId}','${esc(S.room.oppName).replace(/'/g,"")}')">${I.mic}</button>`:""}</div><h2>Tic-Tac-Toe</h2><p class="sub">${esc(g.msg)}</p>
 <div class="bd">${g.b.map((v,i)=>`<button class="cell ${v}${i===g.last?" n":""}${w?.cells.includes(i)?" w":""}" onclick="tap(${i})" aria-label="Cell ${i+1}">${v}</button>`).join("")}</div>${foot}</section>`;paintVc()}
function leaveG(){closeRoom(true);S.g=null;go("games")}
function place(i){const g=S.g;g.b[i]=g.t;g.last=i;sfx("move");const w=lineWin(g.b);
 if(w){g.over=true;g.msg=g.mode==="bot"?(w.v==="X"?"You won! 🏆":"Robot won 🤖"):w.v+" won! 🏆";sfx(g.mode==="bot"&&w.v==="O"?"lose":"win");vib([60,40,60])}
 else if(g.b.every(Boolean)){g.over=true;g.msg="Draw"}else{g.t=g.t==="X"?"O":"X";g.msg=g.mode==="bot"?(g.t==="X"?"Your turn (X)":"Robot is thinking…"):g.t+"'s turn"}draw()}
let tapT=0;function tap(i){const g=S.g;if(!g||g.over||g.b[i])return;
 if(g.mode==="online"){const R=S.room,G=R?.G;if(!G||G.over||R.left||G.t!==g.me||Date.now()-tapT<400)return;tapT=Date.now();vib(10);sfx("move");R.host?hostMove(R,i,G.seq,g.me):R.tx({t:"mv",i,s:G.seq});return}
 if(g.mode==="bot"&&g.t!=="X")return;place(i);if(g.mode==="bot"&&!g.over)setTimeout(bot,650)}
function score(b,i,sym){const r=Math.floor(i/5),c=i%5,opp=sym==="X"?"O":"X";let s=0;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]])for(let k=0;k<4;k++){let own=0,bad=false;for(let j=0;j<4;j++){const y=r+dr*(j-k),x=c+dc*(j-k);if(y<0||y>4||x<0||x>4){bad=true;break}const v=b[y*5+x];if(v===opp){bad=true;break}if(v===sym)own++}if(!bad)s+=[1,3,9,40][own]}return s}
function bot(){const g=S.g;if(!g||g.over||g.mode!=="bot"||g.t!=="O")return;const b=g.b,emp=b.map((v,i)=>v?-1:i).filter(i=>i>=0),wins=(s,i)=>{b[i]=s;const w=lineWin(b)?.v===s;b[i]="";return w};
 let p=emp.find(i=>wins("O",i));if(p===undefined)p=emp.find(i=>wins("X",i));if(p===undefined){let best=-1;emp.forEach(i=>{const s=score(b,i,"O")*1.1+score(b,i,"X")+Math.random()*.8-(Math.abs(i%5-2)+Math.abs(Math.floor(i/5)-2))*.3;if(s>best){best=s;p=i}})}place(p)}

 sym=v=>v==="S"?"⦸":v==="R"?"⇄":v==="W"?"★":v,cd=(c,cls,oc,st)=>{const v=sym(c.v);return`<button class="uc ${c.c===4?"w ":""}${cls}" style="--c:${UC[c.c]};${st||""}" ${oc||""}><i class="cn tl">${v}</i><span class="cov"><b>${v}</b></span><i class="cn br">${v}</i></button>`},fly=U.fly?" fly":"";U.fly=0;

 <div id="ldBan" style="--tb:${UC[U.col]}"><i></i><span>${esc(msg)}</span></div><div class="card felt" style="padding:14px;position:relative">${U.fresh?`<div class="go"><b>Let's play!</b></div>`:""}

 <div style="display:flex;justify-content:center;gap:22px;align-items:center;margin:22px 0 10px"><button class="uc back" onclick="takeU()"><span class="cov"><b>UNO</b></span></button>${cd(t,"pile"+fly,"",`--pr:${(U.seq*37)%17-8}deg`)}</div>

 ${mine.length<=2&&!U.over?`<button class="btn pri wide" style="margin-top:6px" onclick="sayUno()">UNO!</button>`:""}

const gcLog=[];

function gcOpen(){openModal(`<h3>💬 Game chat</h3><div id="gcl" class="cb" style="height:240px;border:1px solid var(--ln);border-radius:16px;margin:10px 0"></div><div style="display:flex;gap:8px"><input id="gci" style="margin:0;flex:1" placeholder="Message" autocomplete="off"><button class="btn pri" onclick="gcSend()">Send</button></div><button class="btn wide" style="margin-top:10px" onclick="closeModal()">Close</button>`);gcPaint();$("gci").addEventListener("keydown",e=>{if(e.key==="Enter")gcSend()})}
function gcSend(){const i=$("gci"),x=i?.value.trim(),R=gcRoom();if(!x||!R)return;i.value="";R.tx({t:"txt",x});gcLog.push({me:1,x});sfx("send");gcPaint()}
