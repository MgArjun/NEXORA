<style>
:root{color-scheme:dark;--bg:#070a10;--ln:rgba(255,255,255,.09);--mu:#8b97ab;--a:#7c8cff;--b:#b07cff;--g:#3fd68f;--r:#ff6377;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button,input{font:inherit;font-size:16px;color:inherit}button{border:0;background:none;cursor:pointer}
.h{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column}

h2{font-size:27px;margin:2px 0 6px;letter-spacing:-.8px}.sub{color:var(--mu);margin:0 0 16px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.live{display:inline-flex;gap:8px;align-items:center;color:#7ce3ae;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.row{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:10px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px;text-align:center;color:var(--mu)}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.pr .t{flex:1}.pr small{display:block;color:var(--mu);font-size:12px}
.tg2{width:50px;height:30px;border-radius:15px;background:#26324a;position:relative;flex:none;transition:.25s}
.tg2 i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
.tg2.on{background:linear-gradient(135deg,var(--a),var(--b))}.tg2.on i{transform:translateX(20px)}
.ov{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px}
.md{width:min(480px,100%);max-height:88dvh;overflow:auto;background:#101722;border:1px solid var(--ln);border-radius:26px;padding:22px;animation:pop .3s var(--e) both}
.md h3{margin:0 0 4px;font-size:21px}

#net{position:fixed;top:0;left:0;right:0;z-index:9500;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;text-align:center;font-size:13px;font-weight:800;color:#fff;background:#ff4d63;transform:translateY(-110%);transition:transform .3s var(--e)}

.chat{padding:0!important;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);background:rgba(12,17,25,.8)}
.cb{flex:1;min-height:0;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:5px}
.m{max-width:80%;padding:9px 13px 6px;border-radius:19px;line-height:1.4;word-break:break-word;animation:mi .3s var(--e) both}
@keyframes mi{from{opacity:0;transform:translateY(12px) scale(.94)}}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#6f82ff,#9a74f0);border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:6px}
.m.fail{box-shadow:0 0 0 1px #ff8797}
.m small{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:2px}.m u{cursor:pointer;font-weight:800}
.cp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.cp input{margin:0;border-radius:26px;flex:1}
.snd{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7889ff,#a077ff);flex:none;display:grid;place-items:center;color:#fff}
.bd{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:420px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:13px;background:#162033;border:1px solid var(--ln);font-size:clamp(24px,8vw,42px);font-weight:900;transition:transform .15s var(--e)}
.cell:active{transform:scale(.9)}
.cell.n{animation:cp .35s var(--e)}@keyframes cp{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.cell.w{background:linear-gradient(135deg,#2b3c78,#5a3a96);box-shadow:0 0 22px rgba(124,140,255,.6);animation:wn .8s ease-in-out infinite alternate}
@keyframes wn{to{transform:scale(1.07)}}
.X{color:#9aa7ff}.O{color:#ff8999}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ic.rot{transform:rotate(135deg)}

#call{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);background:radial-gradient(circle at 50% 30%,#1a2140,#070a10 70%)}
#call.h{display:none}
.ctop{width:100%;display:flex;align-items:center;justify-content:space-between}
.cmid{text-align:center}.cav{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#697cff,#a26cff);font-size:34px;font-weight:900}
.cnm{font-size:25px;font-weight:900;margin-top:20px}.cst{color:var(--mu);margin-top:5px}.ctm{font-size:13px;color:var(--mu);margin-top:8px}
.eq{height:40px;display:flex;align-items:center;gap:5px;justify-content:center;margin-top:22px}.eq i{width:5px;height:12px;border-radius:4px;background:var(--g);animation:eq 1s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:.1s}.eq i:nth-child(3){animation-delay:.2s}.eq i:nth-child(4){animation-delay:.3s}.eq i:nth-child(5){animation-delay:.4s}
@keyframes eq{to{height:34px}}
.cbs{display:flex;gap:12px}.cb2{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#1b2434;border:1px solid var(--ln)}.cb2.gn{background:#1f8e5c}.cb2.r{background:#b8334b}.cb2.on{background:#b8334b}

.ludo-board{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:12px auto;border-radius:24px;overflow:hidden;border:1px solid var(--ln);background:#0d131e;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.ludo-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}
.ludo-cell{border:1px solid rgba(255,255,255,.045);background:#111925}
.ludo-home{position:absolute;width:40%;height:40%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:7%;gap:5%;z-index:2}
.redh{left:0;top:0;background:rgba(255,99,119,.18)}.greenh{right:0;top:0;background:rgba(63,214,143,.18)}
.yellowh{left:0;bottom:0;background:rgba(244,199,82,.18)}.blueh{right:0;bottom:0;background:rgba(93,140,255,.18)}
.ludo-home .ludo-token{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;aspect-ratio:1}
.ludo-token{border-radius:50%;border:2px solid rgba(255,255,255,.72);box-shadow:0 5px 12px rgba(0,0,0,.35);min-width:10px;min-height:10px}
.player-pills{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.player-pill{padding:7px 10px;border-radius:14px;border:1px solid var(--ln);background:#111925;font-size:11px}
.player-pill.on{box-shadow:0 0 16px rgba(124,140,255,.22)}
.dice{width:78px;height:78px;border-radius:20px;background:linear-gradient(145deg,#fff,#d9dde7);color:#111;box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 -5px 8px rgba(0,0,0,.15);font-size:34px}
.dice.rl{animation:tumble .5s linear infinite}.dice.rd{animation:ready 1s ease-in-out infinite alternate}
@keyframes ready{to{transform:translateY(-4px);box-shadow:0 16px 30px rgba(124,140,255,.55),inset 0 -5px 8px rgba(0,0,0,.15)}}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.wo{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,10,16,.75);backdrop-filter:blur(5px);z-index:30;text-align:center;font-size:28px;font-weight:900}
.game-toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ludo-cell.rh{background:rgba(255,99,119,.13)}.ludo-cell.gh{background:rgba(63,214,143,.13)}.ludo-cell.yh{background:rgba(244,199,82,.13)}.ludo-cell.bh{background:rgba(93,140,255,.13)}
.ludo-token{cursor:pointer}.ludo-token.hop{animation:lhop .18s var(--e)}.ludo-token.cut{animation:lcut .4s ease}
@keyframes lhop{50%{transform:scale(1.25) translateY(-5px)}}@keyframes lcut{0%{transform:scale(1)}50%{transform:scale(1.5) rotate(20deg)}100%{transform:scale(0)}}
.confetti{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:rgba(7,10,16,.76);backdrop-filter:blur(4px);text-align:center;font-size:30px;font-weight:900}.confetti>div{animation:pop .5s var(--e) both}

.u-page{position:relative;height:100%;min-height:100%;display:flex;flex-direction:column;padding:10px 10px 16px;background:radial-gradient(circle at 50% 40%,rgba(63,214,143,.07),transparent 35%),radial-gradient(circle at 50% 100%,rgba(124,140,255,.08),transparent 45%);overflow:auto}
.u-top{display:flex;align-items:center;gap:8px;min-height:44px}.u-top .u-msg{flex:1;min-width:0;text-align:center;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-opps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 0}
.u-op{position:relative;min-width:100px;padding:7px;border-radius:15px;background:#101722;border:1px solid var(--ln);text-align:center;transition:.25s}.u-op.on{border-color:#8cffbf;box-shadow:0 0 22px rgba(63,214,143,.2)}
.u-fan{height:18px;margin-top:4px;display:flex;justify-content:center}.u-fan s{display:block;width:14px;height:18px;margin-left:-5px;border-radius:5px;background:#293449;border:1px solid rgba(255,255,255,.2);transform:rotate(-8deg)}.u-fan s:nth-child(2n){transform:rotate(8deg)}
.u-n{font-size:11px;color:var(--mu);margin-top:3px}.u-n.red{color:#ff7e8d;font-weight:900}
.u-mid{flex:1;min-height:250px;display:flex;align-items:center;justify-content:center;gap:16px;position:relative}
.u-deck,.u-disc{border:0;background:none;display:grid;place-items:center;position:relative}.u-deck small{color:var(--mu);font-size:11px;margin-top:6px}
.uc{width:58px;height:82px;flex:none;position:relative;display:grid;place-items:center;border-radius:11px;border:3px solid rgba(255,255,255,.88);background:var(--cc);color:#fff;box-shadow:0 7px 16px rgba(0,0,0,.4);font-weight:900;user-select:none;transition:transform .18s var(--e),filter .18s}
.uc::before{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(255,255,255,.16);transform:rotate(-28deg) skewX(-8deg)}.uc i{position:absolute;top:3px;left:5px;font-style:normal;font-size:12px;z-index:2}.uc b{position:relative;z-index:2;font-size:25px;text-shadow:0 2px 2px rgba(0,0,0,.25)}.uc i.br{top:auto;left:auto;right:5px;bottom:3px;transform:rotate(180deg)}
.uc.uw{background:conic-gradient(#e5384f 0 25%,#2f7fe0 25% 50%,#2fb36a 50% 75%,#f3b92b 75%)}
.uc.ub{background:radial-gradient(circle at 30% 30%,#444 0 12%,transparent 13%),#151922;border-color:#fff;transform:rotate(-6deg)}.uc.ub::after{content:"";position:absolute;width:80%;height:40%;border-radius:50%;background:#e5384f;transform:rotate(-25deg)}.uc.ub b{color:#fff;font-size:19px;z-index:4;transform:rotate(-10deg)}
.u-hand{display:flex;justify-content:center;gap:4px;overflow-x:auto;overflow-y:visible;padding:16px 4px 8px;min-height:108px;scrollbar-width:none}.u-hand::-webkit-scrollbar{display:none}
.u-hand .uc{width:52px;height:74px;margin-left:-8px;transform:translateY(4px) rotate(var(--r,0deg))}.u-hand .uc:first-child{margin-left:0}
.u-hand.mine .uc.ok{cursor:pointer;box-shadow:0 0 0 2px #fff,0 10px 24px rgba(63,214,143,.35);transform:translateY(-5px)}.u-hand.mine .uc.ok:active{transform:translateY(-16px) scale(1.05)}
.u-hand.mine .uc.no{filter:grayscale(.35) brightness(.55);opacity:.68}
.u-disc .uc.land{animation:ucLand .45s var(--e)}@keyframes ucLand{0%{transform:translateY(-40px) rotate(-18deg) scale(.7);opacity:0}70%{transform:translateY(5px) rotate(4deg) scale(1.04)}100%{transform:none;opacity:1}}
.u-dir{font-size:32px;color:var(--mu);animation:udir 1.2s linear infinite}@keyframes udir{to{transform:rotate(360deg)}}
.u-turn{text-align:center;font-weight:900;min-height:22px}.u-act{min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.uno-btn{min-width:110px;height:46px;border-radius:23px;color:#fff;font-weight:1000;font-size:17px;letter-spacing:1px;background:linear-gradient(135deg,#ff4458,#f59c27);box-shadow:0 8px 24px rgba(255,68,88,.3);border:2px solid rgba(255,255,255,.5)}
.cpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cpick button{height:60px;border-radius:16px;border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.4)}
@media(max-width:390px){.u-op{min-width:86px}.uc{width:50px;height:72px}.u-hand .uc{width:47px;height:68px}.u-mid{gap:8px}}

.confetti{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,10,16,.72);backdrop-filter:blur(4px);z-index:9;font-size:26px;font-weight:900;animation:fadeIn .5s both;text-align:center}

/* ---------- second-code auth design ---------- */
.auth-screen{position:relative;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,rgba(124,140,255,.14),transparent 35%),radial-gradient(circle at 80% 70%,rgba(154,124,255,.12),transparent 35%),var(--bg)}
.auth-screen::before,.auth-screen::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;animation:authdrift 14s ease-in-out infinite alternate}
.auth-screen::before{background:#6b7cff;top:-80px;left:-80px}.auth-screen::after{background:#b36bff;bottom:-100px;right:-80px;animation-delay:-6s}
@keyframes authdrift{to{transform:translate(60px,40px) scale(1.15)}}
.auth-card{position:relative;z-index:1;width:min(440px,100%);padding:32px;border:1px solid var(--ln);border-radius:28px;background:rgba(14,19,28,.88);backdrop-filter:blur(24px);box-shadow:0 20px 70px rgba(0,0,0,.38);animation:authrise .7s var(--e) both}
@keyframes authrise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px}.logo span{background:linear-gradient(135deg,#fff,#8e9cff,#c18cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-sub{color:var(--mu);margin:8px 0 28px;line-height:1.5}.field{margin-bottom:13px}.field input{width:100%;height:52px;padding:0 16px;border-radius:15px;border:1px solid var(--ln);outline:none;background:#0a0f17;color:#fff}.field input:focus{border-color:rgba(124,140,255,.65);box-shadow:0 0 0 4px rgba(124,140,255,.1)}
.primary{width:100%;min-height:52px;border-radius:15px;background:linear-gradient(135deg,#7889ff,#9879ff);color:#fff;font-weight:800;margin-top:5px}.secondary{width:100%;min-height:50px;border-radius:15px;background:#151d29;color:#fff;border:1px solid var(--ln)}
.auth-switch{text-align:center;color:var(--mu);margin-top:18px;font-size:14px}.auth-switch button{background:none;color:#9ca8ff;font-weight:700;font-size:14px}.auth-message{min-height:22px;margin:12px 0 0;font-size:13px;color:var(--mu);text-align:center}.auth-message.error{color:#ff8190}.auth-message.ok{color:#65dda1}
.quick-card{transform-style:preserve-3d;will-change:transform}.quick-icon{font-size:28px}.quick-name{font-weight:800}.quick-desc{color:var(--mu);font-size:12px;margin-top:3px}.grid2{grid-template-columns:1fr 1fr}
</style></head><body>

</section>

async function loadChat(){
 if(!CHAT)return;

 const box=$("cb");
 try{
  const{data,error}=await sb
   .from("messages")
   .select("*")
   .or(
    `and(sender_id.eq.${S.user.id},receiver_id.eq.${CHAT.uid}),and(sender_id.eq.${CHAT.uid},receiver_id.eq.${S.user.id})`
   )
   .order("created_at",{ascending:true})
   .limit(200);

  if(error)throw error;

  if(!data?.length){
   box.innerHTML=`<div class="empty">No messages yet.<br>Start the conversation 👋</div>`;
  }else{
   box.innerHTML=data.map(renderMessage).join("");
   box.scrollTop=box.scrollHeight;
  }

  $("chatStatus").textContent="Online chat";
 }catch(_){
  box.innerHTML=`<div class="empty">Messages load nahi ho paaye.</div>`;
  $("chatStatus").textContent="Offline";
 }
}

function renderMessage(m){
 const mine=m.sender_id===S.user.id;
 return`
  <div class="m ${mine?"me":"th"} ${m.failed?"fail":""}" data-mid="${esc(m.id)}">
   ${esc(m.content||"")}
   <small>${tm(m.created_at)}</small>
  </div>
 `;
}

function subscribeChat(){
 if(!CHAT)return;

 CCH=sb.channel("chat-"+CHAT.key);

 CCH.on(
  "postgres_changes",
  {
   event:"INSERT",
   schema:"public",
   table:"messages"
  },
  payload=>{
   const m=payload.new;
   if(!m)return;

   const related=
    (m.sender_id===S.user.id&&m.receiver_id===CHAT.uid)||
    (m.sender_id===CHAT.uid&&m.receiver_id===S.user.id);

   if(!related)return;

   const box=$("cb");
   if(!box)return;

   if(box.querySelector(".empty"))box.innerHTML="";

   box.insertAdjacentHTML("beforeend",renderMessage(m));
   box.scrollTop=box.scrollHeight;

   if(m.sender_id!==S.user.id){
    sfx("recv");
    checkNotes();
   }
  }
 );

 CCH.subscribe();
}

function tttMove(i){
 if(!TTT||TTT.winner||TTT.board[i])return;

 TTT.board[i]=TTT.turn;

 const w=checkTTT(TTT.board);

 if(w){
  TTT.winner=w;

 }else if(TTT.board.every(Boolean)){
  TTT.winner="Draw";
 }else{
  TTT.turn=TTT.turn==="X"?"O":"X";
 }

 renderTTT();

function checkTTT(b){
 const lines=[
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
 ];

 for(const [a,b1,c] of lines){
  if(b[a]&&b[a]===b[b1]&&b[a]===b[c])
   return b[a]+" wins!";
 }

 return null;
}

function rnd6(){

function canMove2(pos,d){
 return pos===-1?d===6:pos+d<=FINISH;
}

function tokenPos2(color,pos){
 if(pos<0)return null;

 if(pos>=51){
  const end=[
   [7,6],[7,7],[7,8],[6,7],
   [6,6],[8,7],[7,5]
  ];

  return end[Math.min(pos-51,end.length-1)];
 }

 const start=LUDO2_COLORS[color].start;

 const idx=(start+pos)%52;

 const path=[
  [6,1],[6,2],[6,3],[6,4],[6,5],
  [5,6],[4,6],[3,6],[2,6],[1,6],
  [0,6],[0,7],[0,8],[1,8],[2,8],
  [3,8],[4,8],[5,8],[6,9],[6,10],
  [6,11],[6,12],[7,12],[8,12],[8,11],
  [8,10],[8,9],[9,8],[10,8],[11,8],
  [12,8],[12,7],[12,6],[11,6],[10,6],
  [9,6],[8,5],[8,4],[8,3],[8,2],
  [8,1],[8,0],[7,0],[6,0],[5,0],
  [4,0],[3,0],[2,0],[1,0],[0,0],
  [0,1],[0,2]
 ];

 return path[idx]||[7,7];
}

async function animateRoll(force){
 if(!LUDO2||
    LUDO2.winner||
    LUDO2.rolling||
    LUDO2.dice!==null)return;

 if(!isMine2())return;

 LUDO2.rolling=true;
 updateLudo();

 const d=force||rnd6();

 for(let i=0;i<8;i++){
  const x=rnd6();

  LUDO2.dice=x;

  updateLudo();

  tone(
   220+i*20,
   .05,
   "square",
   .025
  );

  await sleep(70);
 }

 LUDO2.dice=d;
 LUDO2.rolling=false;

 sfx("dice");

 if(LUDO2.mode==="online")
  lsend2({t:"roll",d});

 updateLudo();

 const pl=cur2();

 const mv=pl.tokens
  .map((x,i)=>canMove2(x,d)?i:-1)
  .filter(x=>x>=0);

 if(!mv.length){
  await sleep(500);

  LUDO2.dice=null;

  endTurn();

  return;
 }

 if(LUDO2.mode==="robot"&&LUDO2.turn===1){
  await sleep(650);

  return playMove(
   robotPick(pl,mv,d)
  );
 }

 if(mv.length===1){
  await sleep(450);

  playMove(mv[0]);
 }
}

function updateLudo(){
 renderLudo();
}

function selectLudoToken(color,index){
 const g=LUDO2;

 if(!g||g.winner||g.dice===null)return;

 const p=cur2();

 if(p.color!==color)return;

 const idx=p.tokens[index];

 if(!canMove2(idx,g.dice))return;

 playMove(index);
}

function robotPick(pl,moves,d){
 const finish=moves.find(i=>pl.tokens[i]===FINISH-d);

 if(finish!==undefined)return finish;

 const six=moves.find(i=>pl.tokens[i]===-1);

 if(d===6&&six!==undefined)return six;

 return moves[Math.floor(Math.random()*moves.length)];
}

async function playMove(i){
 const g=LUDO2;

 if(!g||g.busy||g.winner)return;

 const p=cur2();

 if(!canMove2(p.tokens[i],g.dice))return;

 g.busy=true;

 const d=g.dice;
 const old=p.tokens[i];

 p.tokens[i]=old===-1?0:old+d;

 sfx("move");
 vib(35);

 updateLudo();

 await sleep(300);

 const hit=checkLudoCapture(p,i);

 if(hit){
  sfx("up");
  await sleep(150);
 }

 if(p.tokens.every(x=>x===FINISH)){
  g.winner=p.name;

  sfx("win");

  updateLudo();

  try{
   await incWin("ludo");
  }catch(_){}

  return;
 }

 const extra=d===6||hit;

 g.dice=null;
 g.busy=false;

 if(extra){
  g.sixes=d===6?g.sixes+1:0;
  g.message=p.name+" ki baari — again";
  updateLudo();
 }else{
  g.sixes=0;
  endTurn();
 }
}

function checkLudoCapture(player,index){
 const pos=player.tokens[index];

 if(pos<0||pos>=51)return false;

 const global=(LUDO2_COLORS[player.color].start+pos)%52;

 if(SAFE2.has(global))return false;

 let hit=false;

 LUDO2.players.forEach(other=>{
  if(other===player)return;

  other.tokens.forEach((x,i)=>{
   if(x<0||x>=51)return;

   const og=(LUDO2_COLORS[other.color].start+x)%52;

   if(og===global){
    other.tokens[i]=-1;
    hit=true;
   }
  });
 });

 return hit;
}

function endTurn(){
 const g=LUDO2;

 if(!g)return;

 g.dice=null;
 g.busy=false;

 g.turn=(g.turn+1)%g.players.length;

 g.message=g.players[g.turn].name+" ki baari";

 updateLudo();
}

async function botTurn(){
 const g=LUDO2;

 if(!g||
    g.mode!=="robot"||
    g.turn!==1||
    g.winner||
    g.busy||
    g.rolling||
    g.dice!==null)return;

 await sleep(550);

 if(
  LUDO2===g&&
  !g.winner&&
  g.dice===null
 ){
  animateRoll();
 }
}

function leaveLudo(){
 LUDO2=null;

 closeLudoRoom(true);

 go("games");
}

function ludoJoinModal(){
 openModal(`
  <h3>Join Ludo room 🎲</h3>
  <p class="sub">Friend ka room code enter karo.</p>

  <input id="lcode"
   maxlength="6"
   style="text-transform:uppercase"
   placeholder="ROOM CODE">

  <button class="btn pri wide"
   onclick="joinLudo($('lcode').value.trim().toUpperCase())">
   Join room
  </button>

  <button class="btn wide"
   style="margin-top:8px"
   onclick="closeModal()">
   Cancel
  </button>
 `);
}
