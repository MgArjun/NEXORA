}

 return"Last seen "+day+" at "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}

(()=>{

 const kvGet=async k=>{const d=await db();return new Promise((res,rej)=>{const q=d.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
 const kvSet=async(k,v)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
 const devKey=()=>dkp||(dkp=(async()=>{let k=await kvGet("dev");if(!k){k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);await kvSet("dev",k)}return k})().catch(e=>{dkp=null;throw e}));
 async function seal(uid,text){const k=await devKey(),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(text));await kvSet("pk:"+uid,{v:1,iv,ct})}
 async function unseal(uid){const rec=await kvGet("pk:"+uid);if(!rec)return null;const k=await devKey();return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:rec.iv},k,rec.ct))}
 /* before login: make the key available to the app (migrate old key, or restore from IndexedDB) */
 async function prep(uid){try{const key=SKEY(uid),ls=localStorage.getItem(key);let rec=null;try{rec=await unseal(uid)}catch(_){}
  if(ls){if(rec!==ls)await seal(uid,ls)}else if(rec)localStorage.setItem(key,rec)}catch(_){}}
 /* after login: confirm the encrypted copy is good, then remove the plain copy from localStorage */
 async function after(uid){try{const key=SKEY(uid),ls=localStorage.getItem(key);if(!ls)return;await seal(uid,ls);const back=await unseal(uid);

const A={tab:"24",q:"",ps:[],log:[],bn:new Set(),view:null,u24:null,uall:null};
async function pageAll(mk){let out=[];for(let i=0;i<20;i++){const r=await mk(i*1000,i*1000+999);if(!r||r.error||!r.data)break;out=out.concat(r.data);if(r.data.length<1000)break}return out}
async function load(){
 let ps=[],log=[];const bn=new Set();
 await Promise.all([
  tf(async()=>{ps=await pageAll((a,b)=>sb.from("profiles").select("id,uid,username,display_name,online,last_seen,avatar_url,can_status").order("id").range(a,b));
   if(!ps.length)ps=await pageAll((a,b)=>sb.from("profiles").select("id,username,display_name,online,last_seen").order("id").range(a,b))})||0,
  tf(async()=>{log=await pageAll((a,b)=>sb.from("login_log").select("user_id,name,username,device,at").order("at",{ascending:false}).range(a,b))})||0,
  tf(async()=>{((await sb.from("app_ban").select("user_id")).data||[]).forEach(x=>bn.add(x.user_id))})||0
 ]);
 A.ps=ps;A.log=log;A.bn=bn;
}
function build(){
 const m={},get=id=>m[id]||(m[id]={id,uid:"",username:"",name:"",avatar:"",online:false,ls:0,ev:[],ev24:[],can:false,last:0});
 A.ps.forEach(p=>{const u=get(p.id);u.uid=p.uid||"";u.username=p.username||"";u.name=p.display_name||p.username||"";u.avatar=p.avatar_url||"";u.can=!!p.can_status;u.ls=p.last_seen?+new Date(p.last_seen):0;u.online=!!(p.online&&u.ls&&Date.now()-u.ls<9e4)});
 A.log.forEach(x=>{if(!x.user_id)return;const t=+new Date(x.at);if(!t)return;const u=get(x.user_id);u.ev.push({t,d:x.device||""});if(!u.username)u.username=x.username||"";if(!u.name)u.name=x.name||x.username||""});
 const cut=Date.now()-DAY,all=Object.values(m);
 all.forEach(u=>{u.ev.sort((a,b)=>b.t-a.t);u.ev24=u.ev.filter(e=>e.t>cut);u.last=Math.max(u.ls,u.ev.length?u.ev[0].t:0)});
 A.uall=all.sort((a,b)=>b.last-a.last);
 A.u24=all.filter(u=>u.ev24.length).sort((a,b)=>b.last-a.last);
}
const tmS=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dayLbl=t=>{const d=new Date(t),n=new Date(),y=new Date(n-DAY);return d.toDateString()===n.toDateString()?"Today":d.toDateString()===y.toDateString()?"Yesterday":d.toLocaleDateString([],{weekday:"short",day:"numeric",month:"short",year:"numeric"})};
const seenTxt=u=>u.online?"Online now":!u.last?"Never":dayLbl(u.last)+" at "+tmS(u.last);
const hit=u=>{const q=A.q.trim().toLowerCase();return!q||[u.uid,u.username,u.name].join(" ").toLowerCase().includes(q)};
const avStyle=u=>u.avatar?' style="background-image:url(&quot;'+E(u.avatar)+'&quot;)"':"";
function item(u,sc){return'<button class="a2u" data-a="open" data-id="'+E(u.id)+'" data-s="'+sc+'"><span class="a2v'+(u.avatar?" hd":"")+'"'+avStyle(u)+'>'+E(IN(u.name||u.username))+(u.online?"<i></i>":"")+'</span><span class="a2i"><b>'+E(u.name||u.username||"User")+'</b><small>UID '+E(u.uid||"none")+' \u00b7 @'+E(u.username||"-")+'</small><small>'+(sc==="24"?"Last online: ":"Last seen: ")+E(seenTxt(u))+'</small></span><span class="a2n">'+(sc==="24"?u.ev24.length:u.ev.length)+' logins</span><i class="a2c">&rsaquo;</i></button>'}
function list(){const src=(A.tab==="24"?A.u24:A.uall)||[],l=src.filter(hit);return l.length?l.map(u=>item(u,A.tab)).join(""):'<div class="a2e">No users found</div>'}
function evHtml(ev){if(!ev.length)return'<div class="a2e">No login events</div>';let h="",last="";ev.forEach(e=>{const k=new Date(e.t).toDateString();if(k!==last){last=k;h+='<div class="a2g">'+E(dayLbl(e.t))+'</div>'}h+='<div class="a2ev"><b>'+E(tmS(e.t))+'</b><small>'+E(e.d||"")+'</small></div>'});return h}
function paint(){
 const el=$$("nxadm2");if(!el)return;
 if(!A.u24){el.innerHTML='<div class="a2h"><button class="ib" data-a="close" aria-label="Back">'+BACK+'</button><h2>Admin panel</h2></div><div class="a2b"><div class="a2e">Loading\u2026</div></div>';return}
 if(A.view){
  const v=A.view,u=(A.uall||[]).find(x=>x.id===v.id);
  if(!u){A.view=null;return paint()}
  const ev=v.scope==="24"?u.ev24:u.ev,b=A.bn.has(u.id);
  el.innerHTML='<div class="a2h"><button class="ib" data-a="back" aria-label="Back">'+BACK+'</button><h2>'+E(u.name||u.username||"User")+'</h2></div><div class="a2b"><div class="card a2d"><div class="a2u"><span class="a2v'+(u.avatar?" hd":"")+'"'+avStyle(u)+'>'+E(IN(u.name||u.username))+(u.online?"<i></i>":"")+'</span><span class="a2i"><b>'+E(u.name||u.username||"User")+'</b><small>UID '+E(u.uid||"none")+' \u00b7 @'+E(u.username||"-")+'</small><small>'+(v.scope==="24"?"Last online: ":"Last seen: ")+E(seenTxt(u))+'</small></span></div><div class="a2ac"><button class="btn '+(b?"":"red")+'" data-a="blk">'+(b?"Unblock":"Block")+'</button><button class="btn" data-a="st">Status posting: '+(u.can?"ON":"OFF")+'</button></div></div><div class="a2cnt">'+(v.scope==="24"?"Logins in the last 24 hours":"All login history")+' \u00b7 '+ev.length+'</div>'+evHtml(ev)+'</div>';
  return;
 }
 el.innerHTML='<div class="a2h"><button class="ib" data-a="close" aria-label="Back">'+BACK+'</button><h2>Admin panel</h2><button class="ib" data-a="ctl" aria-label="Controls">'+SLD+'</button><button class="ib" data-a="ref" aria-label="Refresh">'+REF+'</button></div><div class="a2b"><div class="seg a2t"><button class="'+(A.tab==="24"?"on":"")+'" data-a="tab" data-t="24">Last 24 Hours ('+A.u24.length+')</button><button class="'+(A.tab==="all"?"on":"")+'" data-a="tab" data-t="all">All Users ('+A.uall.length+')</button></div><div class="a2q"><input id="a2s" placeholder="Search name, username or UID" autocomplete="off" value="'+E(A.q)+'"></div><div id="a2l">'+list()+'</div></div>';
}
async function blk(id){
 if(!id)return;if(tf(()=>S.user.id)===id)return T("You cannot block yourself");
 const u=(A.uall||[]).find(x=>x.id===id);if(!u)return;const on=!A.bn.has(id);
 try{const r=on?await sb.from("app_ban").upsert({user_id:id,name:u.name||u.username||""}):await sb.from("app_ban").delete().eq("user_id",id);
  if(r.error)return T("Not saved: "+String(r.error.message||"").slice(0,50));
  on?A.bn.add(id):A.bn.delete(id);if(on)tf(()=>sig({type:"kick",to:id}));T(on?"User blocked":"User unblocked");paint()}catch(_){T("Could not update")}
}
async function stt(id){
 const u=(A.uall||[]).find(x=>x.id===id);if(!u)return;const on=!u.can;
 try{const r=await sb.from("profiles").update({can_status:on}).eq("id",id);if(r.error)return T("Not saved. Run the SQL first");u.can=on;T(on?"Status posting allowed":"Status posting off");paint()}catch(_){T("Could not update")}
}
async function reload(){await load();build();paint()}
function close(){const e=$$("nxadm2");if(e)e.remove();A.view=null;A.q=""}
function open(){
 if(!isA())return;
 let el=$$("nxadm2");
 if(!el){
  el=D.createElement("div");el.id="nxadm2";D.body.appendChild(el);
  el.addEventListener("click",e=>{
   const b=e.target.closest&&e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
   if(a==="close")return close();
   if(a==="ref")return reload();
   if(a==="ctl"){if(typeof prevAdm==="function")tf(prevAdm);return}
   if(a==="tab"){A.tab=b.dataset.t;A.q="";return paint()}
   if(a==="open"){A.view={id:b.dataset.id,scope:b.dataset.s};return paint()}
   if(a==="back"){A.view=null;return paint()}
   if(a==="blk")return blk(A.view&&A.view.id);
   if(a==="st")return stt(A.view&&A.view.id);
  });
  el.addEventListener("input",e=>{if(e.target&&e.target.id==="a2s"){A.q=e.target.value;const l=$$("a2l");if(l)l.innerHTML=list()}});
 }
 A.view=null;A.q="";paint();reload();
}
open._a2=1;open._old=prevAdm;W.nxAdm=open;
W.addEventListener("popstate",e=>{
 if(!$$("nxadm2"))return;
 e.stopImmediatePropagation();tf(()=>history.pushState({n:1},""));
 if(A.view){A.view=null;paint()}else close();
},true);
})();

<script>
/* NX-WATCH-AUDIO-V1: Watch Together - separate call/media volume, Fit/Fill/Zoom, speaker + Bluetooth fix */
(()=>{
const D=document,W=window,tf=f=>{try{return f()}catch(e){try{console.warn("nx-wa",e)}catch(_){}}};
const $$=i=>D.getElementById(i);
const E=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=m=>tf(()=>toast(m));
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
const K="nx_wta";
let saved={};try{saved=JSON.parse(localStorage.getItem(K))||{}}catch(_){}
const ST=Object.assign({cv:100,mv:100,mode:"fit",z:150,sink:""},saved);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(ST))}catch(_){}};
const canSink=("setSinkId" in HTMLMediaElement.prototype);

D.head.appendChild(Object.assign(D.createElement("style"),{id:"nx-wa-css",textContent:`
#nxwa{padding:14px 16px;margin-top:12px;border-radius:22px}
#nxwa .nxwr{display:flex;justify-content:space-between;align-items:center;margin:12px 0 2px}
#nxwa .nxwr:first-child{margin-top:0}
#nxwa .nxwr span{color:#aab3ff;font-weight:800;font-size:13px}
#nxwa input[type=range]{padding:0;height:30px;margin:0}
#nxwa .seg{margin-top:6px}
#nxwa .nxwn{color:var(--mu);font-size:12px;line-height:1.45;margin-top:10px;min-height:16px}
#nxwa .nxwg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#nxwa .nxwg .btn{min-height:44px;font-size:13px}
`}));

function ytMsg(ifr,vol){tf(()=>ifr.contentWindow.postMessage(JSON.stringify({event:"command",func:"setVolume",args:[vol]}),"*"))}
function sinkTo(e,id){if(e&&canSink)tf(()=>e.setSinkId(id||"").catch(()=>{}))}
function elsSink(){[$$("ra"),$$("rv")].concat([].slice.call(D.querySelectorAll("#wtV video"))).forEach(e=>sinkTo(e,ST.sink))}

/* ---- apply all settings (runs often, only writes when something changed) ---- */
function apply(){
 const a=$$("ra");
 if(a){if(a._cv!==ST.cv){a._cv=ST.cv;tf(()=>{a.volume=ST.cv/100})}
  if(ST.sink&&canSink&&a.sinkId!==ST.sink)sinkTo(a,ST.sink)}
 const rv=$$("rv");if(rv&&ST.sink&&canSink&&rv.sinkId!==ST.sink)sinkTo(rv,ST.sink);
 const box=$$("wtV"),Wt=tf(()=>WT);if(!box||!Wt)return;
 const vid=box.querySelector("video"),ifr=box.querySelector("iframe"),m=vid||ifr;if(!m)return;
 const yt=!!(ifr&&!vid&&Wt.src&&tf(()=>ytId(Wt.src)));
 if(vid){if(vid._mv!==ST.mv){vid._mv=ST.mv;tf(()=>{vid.volume=ST.mv/100})}
  if(ST.sink&&canSink&&vid.sinkId!==ST.sink)sinkTo(vid,ST.sink)}
 if(yt&&ifr._mv!==ST.mv){ifr._mv=ST.mv;ytMsg(ifr,ST.mv);setTimeout(()=>ytMsg(ifr,ST.mv),1500);setTimeout(()=>ytMsg(ifr,ST.mv),3500)}
 let z=1,fit="contain";
 if(ST.mode==="fill"){fit="cover";z=(yt||!vid)?1.33:1}
 else if(ST.mode==="zoom")z=ST.z/100;
 if(vid)vid.style.setProperty("object-fit",fit,"important");
 const tr=z===1?"":"scale("+z+")";
 if(m.style.transform!==tr){m.style.transform=tr;m.style.transformOrigin="center center"}
}

/* ---- panel under the video ---- */
function note(){const box=$$("wtV"),n=$$("nxwn");if(!n)return;
 const vid=box&&box.querySelector("video"),ifr=box&&box.querySelector("iframe"),Wt=tf(()=>WT),yt=!!(ifr&&!vid&&Wt&&Wt.src&&tf(()=>ytId(Wt.src)));
 let t;
 if(IOS)t="iPhone par awaaz sirf phone ke volume button se badalti hai (Apple ki limit). Fit/Fill/Zoom kaam karega. Bluetooth/AirPlay Control Centre se chuno.";
 else if(!vid&&!ifr)t="Pehle video ka link load karo.";
 else if(!vid&&!yt)t="Ye website hai, isliye iski awaaz yahan se control nahi ho sakti. Zoom kaam karega.";
 else if(yt)t="YouTube ki awaaz yahan se alag control hoti hai. YouTube ka output phone ke default speaker/Bluetooth par chalta hai.";
 else t="";
 if(n.textContent!==t)n.textContent=t}
function sync(){
 const g=i=>$$(i);
 if(g("nxwcv")){g("nxwcv").value=ST.cv;g("nxwcl").textContent=ST.cv+"%"}
 if(g("nxwmv")){g("nxwmv").value=ST.mv;g("nxwml").textContent=ST.mv+"%"}
 if(g("nxwzv")){g("nxwzv").value=ST.z;g("nxwzl").textContent=(ST.z/100).toFixed(1)+"x";g("nxwzr").style.display=ST.mode==="zoom"?"block":"none"}
 D.querySelectorAll("#nxwseg button").forEach(b=>b.classList.toggle("on",b.dataset.m===ST.mode))}
function panel(){
 if(tf(()=>S.page)!=="watch"||!$$("wtS")||$$("nxwa"))return;
 const p=D.createElement("div");p.id="nxwa";p.className="card";
 p.innerHTML='<div class="nxwr"><b>Call volume</b><span id="nxwcl"></span></div><input id="nxwcv" type="range" min="0" max="100" aria-label="Call volume">'
 +'<div class="nxwr"><b>Media volume</b><span id="nxwml"></span></div><input id="nxwmv" type="range" min="0" max="100" aria-label="Media volume">'
 +'<div class="nxwr"><b>Video size</b></div><div class="seg" id="nxwseg"><button data-m="fit">Fit</button><button data-m="fill">Fill</button><button data-m="zoom">Zoom</button></div>'
 +'<div id="nxwzr" style="display:none"><div class="nxwr"><b>Zoom</b><span id="nxwzl"></span></div><input id="nxwzv" type="range" min="100" max="300" step="5" aria-label="Zoom"></div>'
 +'<div class="nxwg"><button class="btn" id="nxwout">Speaker / Bluetooth</button><button class="btn" id="nxwfix">Fix audio</button></div><div class="nxwn" id="nxwn"></div>';
 $$("wtS").after(p);
 $$("nxwcv").oninput=e=>{ST.cv=+e.target.value;save();sync();apply()};
 $$("nxwmv").oninput=e=>{ST.mv=+e.target.value;save();sync();apply()};
 $$("nxwzv").oninput=e=>{ST.z=+e.target.value;save();sync();apply()};
 $$("nxwseg").onclick=e=>{const b=e.target.closest("button");if(!b)return;ST.mode=b.dataset.m;save();sync();apply()};
 $$("nxwout").onclick=outPick;$$("nxwfix").onclick=()=>fix(false);
 sync();note();apply();
}

/* ---- speaker / Bluetooth ---- */
async function outPick(){
 const md=navigator.mediaDevices;
 if(!canSink){T("Is browser me app se output nahi badal sakte. Phone ke Control Centre / Bluetooth settings se chuno.");return}
 if(md&&md.selectAudioOutput){try{const d=await md.selectAudioOutput();setSink(d.deviceId);return}catch(e){if(e&&e.name==="NotAllowedError")return}}
 let l=[];try{l=(await md.enumerateDevices()).filter(x=>x.kind==="audiooutput")}catch(_){}
 if(!l.length){T("Koi output device nahi mila. Pehle phone me Bluetooth connect karo.");return}
 W.__wal=l;
 openModal('<h3>Audio output</h3><p class="sub">Awaaz kahan se aaye?</p><div style="display:grid;gap:8px">'+l.map((x,i)=>'<button class="btn wide'+((x.deviceId===ST.sink||(!ST.sink&&x.deviceId==="default"))?" pri":"")+'" onclick="nxWaSink('+i+')">'+E(x.label||("Output "+(i+1)))+'</button>').join("")+'</div><button class="btn wide" style="margin-top:12px" onclick="closeModal()">Close</button>');
}
W.nxWaSink=i=>{const x=(W.__wal||[])[i];tf(()=>closeModal());if(x)setSink(x.deviceId)};
function setSink(id){ST.sink=id||"";save();elsSink();T("Output badal diya")}
function fix(silent){
 tf(()=>{if(AC&&AC.state==="suspended")AC.resume()});
 tf(()=>{if(VA)VA.resume()});
 const a=$$("ra");if(a){a.muted=false;tf(()=>a.play().catch(()=>{}))}
 elsSink();apply();
 if(!silent)T("Audio refresh ho gaya. Bluetooth pehle phone me connect hona chahiye.");
}
tf(()=>{const md=navigator.mediaDevices;if(!md||!md.addEventListener)return;let t=0;
 md.addEventListener("devicechange",()=>{clearTimeout(t);t=setTimeout(async()=>{
  if(ST.sink&&canSink){let l=[];try{l=(await md.enumerateDevices()).filter(x=>x.kind==="audiooutput")}catch(_){}
   if(l.length&&!l.some(x=>x.deviceId===ST.sink)){ST.sink="";save()}}
  fix(true);if(tf(()=>S.page)==="watch"||tf(()=>!!C))T("Audio device badla, awaaz dobara set ki")},700)})});

setInterval(()=>{panel();apply();note()},500);
})();

</script>

(()=>{

D.head.appendChild(Object.assign(D.createElement("style"),{textContent:`

const box=()=>$("wtV"),wrap=()=>box()&&box().parentElement;

/* ---- everyone shown together ---- */
function bar(){

function tidy(){

 D.querySelectorAll("#main .pg span.pw").forEach(s=>{if(/^Room\b/.test(s.textContent)&&s.querySelector("b"))s.style.display="none"});
 const t=D.querySelector('#nxpn [data-p="r"]');
 if(t){const c=t.querySelector(".card");if(c&&!c.dataset.v48&&/Room code/i.test(c.textContent)){c.dataset.v48=1;c.innerHTML='<span>In the room <b id="m5n"></b></span><button class="btn" onclick="wtAddUI()">Invite</button>'}

.vsw::before{content:"";position:absolute;right:-9px;top:-9px;width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa4c8);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.vsw::after{content:"";position:absolute;left:-10px;top:-3px;width:16px;height:11px;border-radius:3px;background:#d9ddf0;box-shadow:0 3px 8px rgba(0,0,0,.6)}
#xart:has(.mpcd.on) .vsw{transform:rotate(-22deg)}
@media(prefers-reduced-motion:reduce){.vsw{transition:none}}
</style>
<script>
/* NX-INNER-V2 */
(()=>{
const m=document.getElementById("main");if(!m)return;
const add=()=>{const a=document.getElementById("xart");if(a&&!a.querySelector(".vsw"))a.insertAdjacentHTML("afterbegin",'<i class="vsw"></i>')};
new MutationObserver(add).observe(m,{childList:true,subtree:true});add();
})();
</script>
</body></html>
