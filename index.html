<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#070a10;--line:rgba(255,255,255,.08);--text:#f5f7fb;--muted:#8e9aac;--green:#42d392;--shadow:0 20px 70px rgba(0,0,0,.38);--ease:cubic-bezier(.22,1,.36,1)}
html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;font-size:16px}
button{border:0;cursor:pointer}
.hidden{display:none!important}
#app,.shell,.auth-screen{width:100%;height:var(--vh,100dvh);overflow:hidden}
#app,.shell{display:flex;flex-direction:column}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #0a0f17 inset!important;-webkit-text-fill-color:#fff!important;caret-color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* auth */
.auth-screen{position:relative;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,rgba(124,140,255,.14),transparent 35%),radial-gradient(circle at 80% 70%,rgba(154,124,255,.12),transparent 35%),var(--bg)}
.auth-screen::before,.auth-screen::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 14s ease-in-out infinite alternate}
.auth-screen::before{background:#6b7cff;top:-80px;left:-80px}
.auth-screen::after{background:#b36bff;bottom:-100px;right:-80px;animation-delay:-6s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
.auth-card{position:relative;z-index:1;width:min(440px,100%);padding:32px;border:1px solid var(--line);border-radius:28px;background:rgba(14,19,28,.88);backdrop-filter:blur(24px);box-shadow:var(--shadow);animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px}
.logo span{background:linear-gradient(135deg,#fff,#8e9cff,#c18cff);-webkit-background-clip:text;color:transparent}
.auth-sub{color:var(--muted);margin:8px 0 28px;line-height:1.5}
.field{margin-bottom:13px}
.field input,.pf-input{width:100%;height:52px;padding:0 16px;border-radius:15px;border:1px solid var(--line);outline:none;background:#0a0f17;color:var(--text)}
.field input:focus,.pf-input:focus{border-color:rgba(124,140,255,.65);box-shadow:0 0 0 4px rgba(124,140,255,.1)}
.primary{width:100%;min-height:52px;border-radius:15px;background:linear-gradient(135deg,#7889ff,#9879ff);color:#fff;font-weight:800;margin-top:5px}
.secondary{width:100%;min-height:50px;border-radius:15px;background:#151d29;color:#fff;border:1px solid var(--line)}
.auth-switch{text-align:center;color:var(--muted);margin-top:18px;font-size:14px}
.auth-switch button{background:none;color:#9ca8ff;font-weight:700;font-size:14px}
.auth-message{min-height:22px;margin:12px 0 0;font-size:13px;color:var(--muted);text-align:center}
.auth-message.error{color:#ff8190}.auth-message.ok{color:#65dda1}

/* shell */
.topbar{flex:0 0 auto;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,10,16,.84);backdrop-filter:blur(20px)}
.brand{font-weight:900;font-size:20px}.brand span{color:#929cff}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:13px;background:#111824;color:#fff;border:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#697cff,#a26cff);color:#fff;font-weight:900;overflow:hidden;font-size:15px}
.main{flex:1;min-height:0;overflow:hidden;position:relative}
.page{height:100%;overflow:auto;padding:20px 20px 28px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:fadeIn .45s var(--ease) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
.page::-webkit-scrollbar,.chat-body::-webkit-scrollbar{width:5px}
.page::-webkit-scrollbar-thumb,.chat-body::-webkit-scrollbar-thumb{background:#293345;border-radius:10px}
.bottom-nav{flex:0 0 auto;height:72px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:rgba(8,11,17,.94);backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-item{position:relative;background:none;color:#788497;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav-item.active{color:#a8b0ff}
.nav-icon{font-size:21px;transition:transform .3s var(--ease)}
.nav-item.active .nav-icon{transform:translateY(-2px) scale(1.15);text-shadow:0 0 16px rgba(140,155,255,.8)}
.nav-item.active::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#7889ff,#a37cff)}
.nav-dot{position:absolute;top:12px;margin-left:24px;width:8px;height:8px;border-radius:50%;background:#ff6377;box-shadow:0 0 12px #ff6377}
.section-title{font-size:28px;font-weight:900;letter-spacing:-.8px;margin:4px 0 7px}
.section-sub{color:var(--muted);margin-bottom:20px}
.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(20,27,39,.94),rgba(12,17,25,.94));border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.16)}
.hero{padding:24px;margin-bottom:16px}
.live{display:inline-flex;align-items:center;gap:8px;color:#7ce3ae;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:#46d88e;box-shadow:0 0 14px #46d88e}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.quick-card{min-height:125px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left}
.quick-icon{font-size:28px}.quick-name{font-weight:800}.quick-desc{color:var(--muted);font-size:12px}
.btn,.primary,.secondary,.quick-card,.icon-btn{transition:transform .18s var(--ease),box-shadow .25s,filter .25s}
.btn:active,.primary:active,.secondary:active,.quick-card:active,.icon-btn:active{transform:scale(.96)}
@media(hover:hover){.quick-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(110,125,255,.18)}.primary:hover,.primary-btn:hover{filter:brightness(1.12)}}

/* toast, modal, buttons */
.toast{position:fixed;z-index:9999;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);min-width:220px;max-width:calc(100vw - 30px);padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#121925;box-shadow:var(--shadow);color:#fff;text-align:center;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(500px,100%);max-height:90dvh;overflow:auto;background:#101722;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:var(--shadow);animation:pop .35s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
.modal-title{font-size:22px;font-weight:900;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:48px;padding:0 17px;border-radius:14px;color:#fff;background:#171f2d;border:1px solid var(--line);font-weight:750}
.btn.primary-btn,.primary-btn{background:linear-gradient(135deg,#7789ff,#9978ff);box-shadow:0 10px 28px rgba(120,137,255,.28)}
.btn.danger{background:rgba(255,85,105,.13);color:#ff8797}
.btn.success{background:rgba(65,211,146,.13);color:#65dfa3}
.pf-input{margin-bottom:12px}
.pf-label{font-size:12px;color:var(--muted);margin:0 0 6px 4px;display:block}
.pf-avatar{width:84px;height:84px;margin:0 auto 18px;font-size:28px;box-shadow:0 0 0 4px rgba(124,140,255,.18),0 14px 40px rgba(124,140,255,.35)}

/* call */
.call-card{width:min(410px,100%);padding:28px;text-align:center;border-radius:30px;background:radial-gradient(circle at 50% 0,rgba(124,140,255,.18),transparent 45%),#101722;border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .4s var(--ease) both}
.call-avatar{width:92px;height:92px;border-radius:50%;margin:5px auto 18px;display:grid;place-items:center;font-size:30px;font-weight:900;background:linear-gradient(135deg,#687cff,#a36eff);box-shadow:0 0 0 0 rgba(124,140,255,.5);animation:ring 1.8s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 26px rgba(124,140,255,0)}}
.call-name{font-size:23px;font-weight:900}
.call-state{color:var(--muted);margin:7px 0 22px}
.call-timer{font-size:28px;font-variant-numeric:tabular-nums;margin-bottom:22px}
.call-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.call-actions .wide{grid-column:1/-1}

/* chat */
.chat-page{padding:0!important;display:flex;flex-direction:column;overflow:hidden!important;background:radial-gradient(circle at 85% 0,rgba(124,140,255,.10),transparent 40%),radial-gradient(circle at 0 100%,rgba(163,124,255,.08),transparent 40%),var(--bg)}
.chat-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(12,17,25,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.chat-head .nm{font-weight:850;font-size:16px}.chat-head .un{color:var(--muted);font-size:12px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.msg{display:flex;animation:msgIn .38s var(--ease) both}.msg.mine{justify-content:flex-end}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.94)}}
.bubble{max-width:80%;padding:9px 13px 7px;font-size:15px;line-height:1.45;word-break:break-word;border-radius:20px}
.mine .bubble{background:linear-gradient(135deg,#6f82ff,#9a74f0);border-bottom-right-radius:6px;box-shadow:0 8px 22px rgba(124,140,255,.28)}
.theirs .bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:6px}
.bubble .mt{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:3px}
.chat-empty{margin:auto;text-align:center;color:var(--muted);font-size:14px}
.composer{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,14,21,.85);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.composer-in{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 18px;border-radius:30px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);transition:border-color .25s,box-shadow .25s}
.composer-in:focus-within{border-color:rgba(124,140,255,.6);box-shadow:0 0 0 4px rgba(124,140,255,.1)}
.composer-in input{flex:1;min-width:0;height:42px;border:0;outline:0;background:transparent;color:#fff;-webkit-appearance:none;appearance:none;border-radius:0}
.composer-in input::placeholder{color:#6f7b8d}
.send{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:linear-gradient(135deg,#7889ff,#a077ff);color:#fff;box-shadow:0 8px 20px rgba(124,140,255,.4)}
.send svg{width:20px;height:20px;transform:translateX(1px)}
.send.fire{animation:fire .45s var(--ease)}
@keyframes fire{40%{transform:scale(.8) rotate(-20deg)}}
.row-card{width:100%;padding:15px;display:flex;align-items:center;gap:12px;text-align:left;color:#fff;margin-bottom:10px}

/* tic-tac-toe / four in a row */
.cell{aspect-ratio:1;border-radius:12px;background:#151e2c;border:1px solid var(--line);font-size:clamp(25px,8vw,45px);font-weight:900;transition:transform .15s var(--ease),background .2s}
.cell:active{transform:scale(.92)}
.cell.pop{animation:pop .3s var(--ease)}
.disc{aspect-ratio:1;border-radius:50%;border:0;transition:background .2s}

/* ludo */
.ludo-wrap{max-width:560px;margin:auto}
.ludo-frame{padding:10px;border-radius:26px;background:linear-gradient(145deg,#1b2436,#0c111a);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5)}
#ludoBoard{position:relative;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);aspect-ratio:1;border-radius:16px;overflow:hidden;background:#f4f1ea;box-shadow:inset 0 0 0 3px #2a3347}
#ludoBoard>.c{border:.5px solid rgba(40,50,70,.22);display:grid;place-items:center;font-size:clamp(8px,2.6vw,15px);color:rgba(30,40,60,.5)}
.q-red{background:#ef5368}.q-green{background:#3fc984}.q-yellow{background:#ffc93c}.q-blue{background:#4a9dff}
.yard{position:absolute;background:#fff;border-radius:18%;box-shadow:inset 0 4px 14px rgba(0,0,0,.18);pointer-events:none}
.yard i{position:absolute;width:26%;height:26%;border-radius:50%;box-shadow:inset 0 3px 7px rgba(0,0,0,.28)}
.yard.glow{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:inset 0 4px 14px rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.9),0 0 26px 6px var(--gc)}}
.tk{position:absolute;width:6.6667%;aspect-ratio:1;z-index:3;border-radius:50%;padding:0;background:none;transition:left .16s linear,top .16s linear,transform .25s var(--ease);will-change:left,top}
.tk b{position:absolute;inset:12%;border-radius:50%;border:2.5px solid #fff;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),transparent 38%),var(--tc);box-shadow:0 5px 8px rgba(0,0,0,.4),inset 0 -4px 6px rgba(0,0,0,.25)}
.tk.hop b{animation:hop .16s ease-out}
@keyframes hop{50%{transform:translateY(-38%) scale(1.15)}}
.tk.can{z-index:5}
.tk.can b{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateY(-14%) scale(1.14);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 10px 14px rgba(0,0,0,.4)}}
.tk.cut b{animation:cut .4s ease-out}
@keyframes cut{50%{transform:scale(1.7);opacity:.5}}
.ludo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.dice{width:78px;height:78px;border-radius:20px;background:linear-gradient(145deg,#fff,#d9dde7);box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 -5px 8px rgba(0,0,0,.15);padding:11px;flex:0 0 auto}
.dice[disabled]{opacity:.55}
.dice.ready{animation:ready 1s ease-in-out infinite alternate}
@keyframes ready{to{transform:translateY(-4px);box-shadow:0 16px 30px rgba(124,140,255,.55),inset 0 -5px 8px rgba(0,0,0,.15)}}
.dice.rolling{animation:tumble .5s linear infinite}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.pips{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:100%;height:100%}
.pips i{place-self:center;width:72%;height:72%;border-radius:50%}
.pips i.on{background:radial-gradient(circle at 35% 30%,#555,#111)}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pcard{padding:11px 13px;border-radius:14px;background:#111925;border:1px solid var(--line);display:flex;align-items:center;gap:10px;transition:.3s}
.pcard.on{border-color:var(--gc);box-shadow:0 0 22px -6px var(--gc)}
.pcard em{width:14px;height:14px;border-radius:50%;background:var(--gc);display:block}
.confetti{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,10,16,.72);backdrop-filter:blur(4px);z-index:9;font-size:26px;font-weight:900;animation:fadeIn .5s both;text-align:center}
</style>
</head>

<body>
<div id="app">

<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="logo"><span>NEXORA</span></div>
    <div class="auth-sub">Connect, chat, call and play — all in one place.</div>

    <div id="loginFields">
      <div class="field"><input id="email" type="email" autocomplete="email" placeholder="Email"></div>
      <div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div>
      <button id="loginBtn" class="primary">Log in</button>
      <div style="height:10px"></div>
      <button id="guestBtn" class="secondary">Continue as Guest</button>
    </div>

    <div id="signupFields" class="hidden">
      <div class="field"><input id="signupName" type="text" maxlength="40" placeholder="Display name"></div>
      <div class="field"><input id="signupEmail" type="email" autocomplete="email" placeholder="Email"></div>
      <div class="field"><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Password"></div>
      <button id="signupBtn" class="primary">Create account</button>
    </div>

    <div id="authMessage" class="auth-message"></div>
    <div class="auth-switch"><span id="switchText">New here?</span> <button id="switchAuth">Create account</button></div>
  </div>
</section>

<section id="appShell" class="shell hidden">
  <header class="topbar">
    <div class="brand">NEX<span>ORA</span></div>
    <div class="top-actions">
      <button id="notificationBtn" class="icon-btn">🔔</button>
      <button id="profileBtn" class="avatar">N</button>
    </div>
  </header>
  <main id="main" class="main"></main>
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button class="nav-item" data-page="recent"><span class="nav-icon">◷</span><span>Recent</span><i id="recentDot" class="nav-dot hidden"></i></button>
    <button class="nav-item" data-page="connect"><span class="nav-icon">◎</span><span>Connect</span></button>
    <button class="nav-item" data-page="games"><span class="nav-icon">♟</span><span>Games</span></button>
  </nav>
</section>

<div id="toast" class="toast"></div>

<div id="callOverlay" class="overlay hidden">
  <div class="call-card">
    <div id="callAvatar" class="call-avatar">N</div>
    <div id="callName" class="call-name">Calling…</div>
    <div id="callState" class="call-state">Connecting</div>
    <div id="callTimer" class="call-timer">00:00</div>
    <div class="call-actions">
      <button id="callAccept" class="btn success">Accept</button>
      <button id="callDecline" class="btn danger">Decline</button>
      <button id="callMute" class="btn hidden">🎙 Mute</button>
      <button id="callEnd" class="btn danger wide">End Call</button>
    </div>
  </div>
</div>

<div id="modalOverlay" class="overlay hidden"><div id="modalContent" class="modal"></div></div>

</div>


  <script>
const SUPABASE_URL="https://ktwluvpmzisonmootdqc.supabase.co";
const SUPABASE_KEY="sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const IDLE_CALL=()=>({id:null,mode:null,state:"idle",peer:null,stream:null,remoteStream:null,targetId:null,targetName:"",pendingOffer:null,muted:false,startedAt:null,timer:null,timeout:null});
const NEXORA={user:null,profile:null,isGuest:false,page:"home",channel:null,call:IDLE_CALL()};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- helpers ---------- */
function toast(m,t=""){const e=$("toast");e.textContent=m;e.className="toast show";if(t==="error")e.style.borderColor="rgba(255,90,110,.45)";setTimeout(()=>{e.className="toast";e.style.borderColor=""},2800)}
function authMessage(m,t=""){const e=$("authMessage");e.textContent=m||"";e.className="auth-message "+t}
function initials(n){return(n||"N").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"N"}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(v){return String(v??"").replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0")}
function duration(a,b){return formatTime(Math.max(0,Math.floor((new Date(b)-new Date(a))/1000)))}
function timeAgo(date){if(!date)return"";const d=new Date(date),s=Math.floor(Math.max(0,Date.now()-d)/1000);if(s<60)return"now";const m=Math.floor(s/60);if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";const dy=Math.floor(h/24);return dy<7?dy+"d":d.toLocaleDateString()}
function closeModal(){$("modalOverlay").classList.add("hidden")}
function openModal(html){$("modalContent").innerHTML=html;$("modalOverlay").classList.remove("hidden")}
$("modalOverlay").addEventListener("click",e=>{if(e.target===$("modalOverlay"))closeModal()});

/* stable viewport: keyboard khulne par page upar-niche nahi hilega */
(function(){const set=()=>document.documentElement.style.setProperty("--vh",(window.visualViewport?.height||innerHeight)+"px");set();
window.visualViewport?.addEventListener("resize",()=>{set();scrollTo(0,0)});addEventListener("resize",set);
addEventListener("orientationchange",()=>setTimeout(set,250));document.addEventListener("focusout",()=>setTimeout(()=>scrollTo(0,0),60))})();

/* ---------- auth ---------- */
function showLogin(){$("loginFields").classList.remove("hidden");$("signupFields").classList.add("hidden");$("switchText").textContent="New here?";$("switchAuth").textContent="Create account";authMessage("")}
function showSignup(){$("loginFields").classList.add("hidden");$("signupFields").classList.remove("hidden");$("switchText").textContent="Already have an account?";$("switchAuth").textContent="Log in";authMessage("")}
function setAuthBusy(b){["loginBtn","guestBtn","signupBtn"].forEach(i=>{const e=$(i);if(e)e.disabled=b})}

async function createProfileBestEffort(user){
  if(!user)return null;
  try{
    const{data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
    if(data)return data;
    const meta=user.user_metadata||{};
    const base=meta.display_name||meta.full_name||(user.email?user.email.split("@")[0]:"guest");
    let username=(""+base).toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,16);
    if(username.length<3)username="user";
    username+="_"+user.id.replace(/-/g,"").slice(0,5);
    const{data:created,error}=await sb.from("profiles").insert({id:user.id,username,display_name:meta.display_name||meta.full_name||(user.email?user.email.split("@")[0]:"Guest"),is_guest:!!user.is_anonymous,online:true,last_seen:new Date().toISOString()}).select("*").maybeSingle();
    return error?null:created;
  }catch(e){console.warn(e);return null}
}
async function enterApp(user){
  if(!user)throw new Error("Authentication session was not created.");
  NEXORA.user=user;NEXORA.isGuest=!!user.is_anonymous;
  $("authScreen").classList.add("hidden");$("appShell").classList.remove("hidden");
  createProfileBestEffort(user).then(p=>{if(p){NEXORA.profile=p;updateProfileUI();if(NEXORA.page==="home")renderHome()}});
  updateProfileUI();setPage("home");startRealtime();
  try{await sb.from("profiles").update({online:true,last_seen:new Date().toISOString()}).eq("id",user.id)}catch(_){}
}
function updateProfileUI(){
  const p=NEXORA.profile,b=$("profileBtn");if(!b)return;
  b.textContent=p?initials(p.display_name||p.username):(NEXORA.isGuest?"G":"N");
  b.title=p?(p.username||"Profile"):(NEXORA.isGuest?"Guest":"Profile");
}
async function login(){
  const email=$("email").value.trim(),password=$("password").value;
  if(!email||!password)return authMessage("Enter your email and password.","error");
  setAuthBusy(true);authMessage("Signing in…");
  try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.user)throw new Error("Login session was not created.");authMessage("Logged in.","ok");await enterApp(data.user)}
  catch(e){authMessage(e.message||"Login failed.","error")}finally{setAuthBusy(false)}
}
async function guestLogin(){
  setAuthBusy(true);authMessage("Opening Guest mode…");
  try{const{data,error}=await sb.auth.signInAnonymously();if(error)throw error;if(!data?.user)throw new Error("Guest session was not created.");await enterApp(data.user);authMessage("")}
  catch(e){let m=e.message||"Guest login failed.";if(/anonymous/i.test(m)&&/disabled|not enabled/i.test(m))m="Guest mode is disabled in Supabase Auth.";authMessage(m,"error")}
  finally{setAuthBusy(false)}
}
async function signup(){
  const name=$("signupName").value.trim(),email=$("signupEmail").value.trim(),password=$("signupPassword").value;
  if(!name||!email||!password)return authMessage("Fill all fields.","error");
  if(password.length<6)return authMessage("Password must be at least 6 characters.","error");
  setAuthBusy(true);authMessage("Creating account…");
  try{const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)throw error;
    if(data.session&&data.user)await enterApp(data.user);else{authMessage("Account created. Check your email if confirmation is required.","ok");showLogin()}}
  catch(e){authMessage(e.message||"Could not create account.","error")}finally{setAuthBusy(false)}
}
async function logout(){
  try{await endCall("cancelled",true)}catch(_){}
  try{if(NEXORA.user)await sb.from("profiles").update({online:false,last_seen:new Date().toISOString()}).eq("id",NEXORA.user.id)}catch(_){}
  try{if(NEXORA.channel)await sb.removeChannel(NEXORA.channel)}catch(_){}
  await sb.auth.signOut();
  NEXORA.user=null;NEXORA.profile=null;NEXORA.channel=null;
  $("appShell").classList.add("hidden");$("authScreen").classList.remove("hidden");
  showLogin();$("email").value="";$("password").value="";
}
$("loginBtn").onclick=login;$("guestBtn").onclick=guestLogin;$("signupBtn").onclick=signup;
$("switchAuth").onclick=()=>$("signupFields").classList.contains("hidden")?showSignup():showLogin();
["email","password"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")login()}));
["signupName","signupEmail","signupPassword"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")signup()}));

/* ---------- realtime ---------- */
async function startRealtime(){
  if(!NEXORA.user)return;
  try{if(NEXORA.channel)await sb.removeChannel(NEXORA.channel)}catch(_){}
  const ch=sb.channel("nexora-global-signal",{config:{broadcast:{ack:true}}});
  ch.on("broadcast",{event:"signal"},async({payload})=>{if(!payload)return;if(payload.to&&payload.to!==NEXORA.user?.id)return;await handleSignal(payload)});
  ["sync","join","leave"].forEach(ev=>ch.on("presence",{event:ev},()=>updateLiveCount(ch)));
  ch.subscribe(async s=>{if(s==="SUBSCRIBED"){try{await ch.track({user_id:NEXORA.user.id,online:true,at:Date.now()})}catch(_){}}});
  NEXORA.channel=ch;
}
function updateLiveCount(ch){try{let n=0;Object.values(ch.presenceState()).forEach(a=>{if(Array.isArray(a)&&a.length)n++});window.NEXORA_LIVE_COUNT=Math.max(1,n)}catch(_){}}
async function sendSignal(p){
  if(!NEXORA.channel)await startRealtime();
  if(!NEXORA.channel)throw new Error("Realtime connection unavailable.");
  await NEXORA.channel.send({type:"broadcast",event:"signal",payload:{...p,from:NEXORA.user.id}});
}

/* ---------- voice call engine ---------- */
const callShow=()=>$("callOverlay").classList.remove("hidden");
const callHide=()=>$("callOverlay").classList.add("hidden");
const callSet=(n,s)=>{$("callName").textContent=n||"Unknown";$("callState").textContent=s||""};
function callUI(a,d,m,e){[["callAccept",a],["callDecline",d],["callMute",m],["callEnd",e]].forEach(([i,s])=>$(i).classList.toggle("hidden",!s))}
function startCallTimer(){stopCallTimer();NEXORA.call.startedAt=Date.now();const t=()=>{$("callTimer").textContent=formatTime((Date.now()-NEXORA.call.startedAt)/1000)};t();NEXORA.call.timer=setInterval(t,1000)}
function stopCallTimer(){if(NEXORA.call.timer){clearInterval(NEXORA.call.timer);NEXORA.call.timer=null}$("callTimer").textContent="00:00"}
function stopCallTimeout(){if(NEXORA.call.timeout){clearTimeout(NEXORA.call.timeout);NEXORA.call.timeout=null}}

function createPeer(){
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});
  pc.onicecandidate=async e=>{if(e.candidate&&NEXORA.call.targetId){try{await sendSignal({type:"call-ice",to:NEXORA.call.targetId,callId:NEXORA.call.id,candidate:e.candidate})}catch(_){}}};
  pc.ontrack=e=>{let a=$("nexoraRemoteAudio");if(!a){a=document.createElement("audio");a.id="nexoraRemoteAudio";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
  pc.onconnectionstatechange=async()=>{
    const s=pc.connectionState;
    if(s==="connected"){NEXORA.call.state="connected";callSet(NEXORA.call.targetName,"Connected");callUI(0,0,1,1);startCallTimer()}
    if(["failed","disconnected","closed"].includes(s)&&NEXORA.call.state!=="idle")await endCall("ended");
  };
  NEXORA.call.peer=pc;return pc;
}
async function getMic(){
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Microphone is not available in this browser.");
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
}
async function startCallByUser(targetId,targetName){
  if(!NEXORA.user)return toast("Please log in first.","error");
  if(NEXORA.call.state!=="idle")return toast("A call is already active.");
  try{
    const stream=await getMic();
    NEXORA.call={...IDLE_CALL(),id:crypto.randomUUID(),mode:"outgoing",state:"calling",stream,targetId,targetName:targetName||"User"};
    $("callAvatar").textContent=initials(targetName);
    callShow();callSet(targetName,"Calling…");callUI(0,0,0,1);
    const pc=createPeer();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    await pc.setLocalDescription(await pc.createOffer());
    try{const{data,error}=await sb.rpc("nexora_start_call",{target_username:targetName,call_kind:"voice"});if(!error&&data?.call_id)NEXORA.call.id=data.call_id}catch(_){}
    await sendSignal({type:"call-offer",to:targetId,callId:NEXORA.call.id,fromName:NEXORA.profile?.display_name||NEXORA.user.email||"User",offer:pc.localDescription});
    stopCallTimeout();
    NEXORA.call.timeout=setTimeout(async()=>{
      if(NEXORA.call.state==="calling"){try{await sendSignal({type:"call-timeout",to:NEXORA.call.targetId,callId:NEXORA.call.id})}catch(_){}await endCall("missed")}
    },30000);
  }catch(e){console.error(e);toast(e.message||"Could not start call.","error");await endCall("cancelled",true)}
}
async function receiveCallOffer(p){
  if(!NEXORA.user)return;
  if(NEXORA.call.state!=="idle"){try{await sendSignal({type:"call-busy",to:p.from,callId:p.callId})}catch(_){}return}
  NEXORA.call={...IDLE_CALL(),id:p.callId,mode:"incoming",state:"ringing",targetId:p.from,targetName:p.fromName||"Incoming call",pendingOffer:p.offer};
  callShow();callSet(NEXORA.call.targetName,"Incoming voice call");
  $("callAvatar").textContent=initials(NEXORA.call.targetName);callUI(1,1,0,0);
  NEXORA.call.timeout=setTimeout(async()=>{
    if(NEXORA.call.state==="ringing"){try{await sendSignal({type:"call-missed",to:NEXORA.call.targetId,callId:NEXORA.call.id})}catch(_){}await endCall("missed",true)}
  },30000);
}
async function acceptCall(){
  if(NEXORA.call.mode!=="incoming"||!NEXORA.call.pendingOffer)return;
  try{
    stopCallTimeout();
    const stream=await getMic();NEXORA.call.stream=stream;NEXORA.call.state="connecting";
    callSet(NEXORA.call.targetName,"Connecting…");callUI(0,0,1,1);
    const pc=createPeer();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    await pc.setRemoteDescription(new RTCSessionDescription(NEXORA.call.pendingOffer));
    await pc.setLocalDescription(await pc.createAnswer());
    await sendSignal({type:"call-answer",to:NEXORA.call.targetId,callId:NEXORA.call.id,answer:pc.localDescription});
    try{await sb.from("calls").update({status:"accepted",started_at:new Date().toISOString()}).eq("id",NEXORA.call.id)}catch(_){}
  }catch(e){toast(e.message||"Microphone permission failed.","error");await endCall("cancelled",true)}
}
async function declineCall(){
  if(!NEXORA.call.targetId)return;
  try{await sendSignal({type:"call-declined",to:NEXORA.call.targetId,callId:NEXORA.call.id})}catch(_){}
  try{await sb.from("calls").update({status:"declined",ended_at:new Date().toISOString()}).eq("id",NEXORA.call.id)}catch(_){}
  await cleanupCall();
}
async function endCall(status="ended",silent=false){
  const c=NEXORA.call;
  if(c.state==="idle"){callHide();return}
  stopCallTimeout();
  if(c.targetId&&!silent){try{await sendSignal({type:"call-ended",to:c.targetId,callId:c.id,status})}catch(_){}}
  if(c.id){try{await sb.from("calls").update({status,ended_at:new Date().toISOString()}).eq("id",c.id)}catch(_){}}
  await cleanupCall();
}
async function cleanupCall(){
  stopCallTimer();stopCallTimeout();
  try{NEXORA.call.stream?.getTracks().forEach(t=>t.stop())}catch(_){}
  try{NEXORA.call.peer?.close()}catch(_){}
  const a=$("nexoraRemoteAudio");if(a){try{a.srcObject=null}catch(_){}a.remove()}
  NEXORA.call=IDLE_CALL();callHide();callUI(1,1,0,0);$("callMute").textContent="🎙 Mute";
}
async function toggleMute(){
  const s=NEXORA.call.stream;if(!s)return;
  NEXORA.call.muted=!NEXORA.call.muted;
  s.getAudioTracks().forEach(t=>t.enabled=!NEXORA.call.muted);
  $("callMute").textContent=NEXORA.call.muted?"🔇 Unmute":"🎙 Mute";
}
async function handleSignal(p){
  if(!p||p.from===NEXORA.user?.id)return;
  const c=NEXORA.call;
  switch(p.type){
    case"call-offer":await receiveCallOffer(p);break;
    case"call-answer":
      if(c.state!=="idle"&&p.callId===c.id&&c.peer){
        try{await c.peer.setRemoteDescription(new RTCSessionDescription(p.answer));c.state="connecting";callSet(c.targetName,"Connecting…")}
        catch(e){await endCall("ended",true)}
      }break;
    case"call-ice":
      if(c.peer&&p.callId===c.id&&p.candidate){try{await c.peer.addIceCandidate(p.candidate)}catch(_){}}break;
    case"call-declined":case"call-ended":case"call-timeout":case"call-missed":case"call-busy":
      if(p.callId===c.id){await cleanupCall();toast(p.type==="call-busy"?"User is busy.":"Call ended.")}break;
  }
}
$("callAccept").onclick=acceptCall;$("callDecline").onclick=declineCall;
$("callEnd").onclick=()=>endCall(NEXORA.call.state==="calling"?"cancelled":"ended");
$("callMute").onclick=toggleMute;
addEventListener("pagehide",()=>{try{if(NEXORA.user)sb.from("profiles").update({online:false,last_seen:new Date().toISOString()}).eq("id",NEXORA.user.id)}catch(_){}});
window.NEXORA=NEXORA;window.sb=sb;

document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));

}

/* ---------- recent ---------- */
async function loadCalls(){
  if(!NEXORA.user)return[];
  try{const id=NEXORA.user.id;const{data,error}=await sb.from("calls").select("*").or(`caller_id.eq.${id},receiver_id.eq.${id}`).order("created_at",{ascending:false}).limit(30);if(error)throw error;return data||[]}catch(_){return[]}
}
async function loadNotifications(){
  if(!NEXORA.user)return[];
  try{const{data,error}=await sb.from("notifications").select("*").eq("user_id",NEXORA.user.id).order("created_at",{ascending:false}).limit(30);if(error)throw error;
    $("recentDot").classList.toggle("hidden",!(data||[]).some(x=>!x.is_read));return data||[]}catch(_){return[]}
}
async function loadConversations(){try{const{data,error}=await sb.rpc("nexora_my_conversations");if(error)throw error;return data||[]}catch(_){return[]}}

async function renderRecent(){
  $("main").innerHTML=`<section class="page"><h1 class="section-title">Recent</h1><div class="section-sub">Your latest activity</div><div id="recentContent"><div class="card" style="padding:22px;color:var(--muted)">Loading…</div></div></section>`;
  const[calls,notes,convs]=await Promise.all([loadCalls(),loadNotifications(),loadConversations()]);
  if(NEXORA.page!=="recent")return;
  const row=(icon,title,sub,time,oc)=>`<button class="card row-card" onclick="${oc}"><div class="avatar">${icon}</div><div style="min-width:0;flex:1"><div style="font-weight:800">${title}</div><div style="color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div></div><div style="color:var(--muted);font-size:12px">${timeAgo(time)}</div></button>`;
  const items=[];
  convs.forEach(c=>items.push({t:c.created_at||c.last_message_at,h:row(escapeHtml(initials(c.other_display_name||c.other_username)),escapeHtml(c.other_display_name||c.other_username),escapeHtml(c.last_message||"Start a conversation"),c.created_at,`openChat('${escapeAttr(c.conversation_id)}','${escapeAttr(c.other_id)}','${escapeAttr(c.other_username)}','${escapeAttr(c.other_display_name)}')`)}));
  calls.forEach(c=>{
    const inc=c.receiver_id===NEXORA.user.id,other=inc?c.caller_id:c.receiver_id;
    let st=inc?"Incoming":"Outgoing",ic=inc?"📥":"📞";
    const m={missed:["Missed","❌"],accepted:["Connected","✓"],declined:["Declined","↙️"],cancelled:["Cancelled","✕"]}[c.status];
    if(m)[st,ic]=m;
    items.push({t:c.created_at,h:row("☎",`${ic} ${st} call`,c.status==="accepted"&&c.started_at&&c.ended_at?"Duration "+duration(c.started_at,c.ended_at):"Tap to call back",c.created_at,`callbackUser('${escapeAttr(other)}')`)});
  });
  notes.forEach(n=>items.push({t:n.created_at,h:row("🔔",escapeHtml(n.title),escapeHtml(n.body||""),n.created_at,`openNotificationItem('${escapeAttr(n.id)}')`)}));
  items.sort((a,b)=>new Date(b.t||0)-new Date(a.t||0));
  $("recentContent").innerHTML=items.length?items.map(x=>x.h).join(""):`<div class="card" style="padding:30px;text-align:center;color:var(--muted)">Nothing here yet.</div>`;
}
async function callbackUser(id){
  try{const{data,error}=await sb.from("profiles").select("id,username,display_name").eq("id",id).maybeSingle();
    if(error||!data)return toast("User is unavailable.","error");
    await startCallByUser(data.id,data.display_name||data.username)}catch(e){toast(e.message||"Could not call.","error")}
}
async function openNotificationItem(id){try{await sb.from("notifications").update({is_read:true}).eq("id",id).eq("user_id",NEXORA.user.id)}catch(_){}openNotifications()}
async function openNotifications(){
  const{data}=await sb.from("notifications").select("*").eq("user_id",NEXORA.user.id).order("created_at",{ascending:false}).limit(50);
  const l=data||[];
  openModal(`<div class="modal-title">Notifications</div><div class="modal-sub">Your latest updates</div>
    ${l.length?l.map(n=>`<div class="card" style="padding:15px;margin-bottom:10px"><div style="font-weight:800">${escapeHtml(n.title)}</div><div style="color:var(--muted);font-size:13px;margin-top:5px">${escapeHtml(n.body||"")}</div></div>`).join(""):`<div style="color:var(--muted);text-align:center;padding:20px">No notifications.</div>`}
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Close</button>`);
  try{await sb.from("notifications").update({is_read:true}).eq("user_id",NEXORA.user.id).eq("is_read",false);$("recentDot").classList.add("hidden")}catch(_){}
}
$("notificationBtn").onclick=openNotifications;

    <div class="card" style="padding:18px;margin-bottom:14px"><div style="font-weight:850;margin-bottom:10px">Username</div>
      <div style="display:flex;gap:8px"><input id="userSearch" class="pf-input" style="margin:0;flex:1;min-width:0" placeholder="@username" autocapitalize="off" autocomplete="off"><button class="btn primary-btn" onclick="searchUser()">Search</button></div></div>
    <div id="searchResult"></div>
    <div class="grid grid2">
      <button class="card quick-card" onclick="randomPeople()"><div class="quick-icon">🎲</div><div><div class="quick-name">Random Chat</div><div class="quick-desc">Find someone available</div></div></button>
      <button class="card quick-card" onclick="randomCall()"><div class="quick-icon">📞</div><div><div class="quick-name">Random Call</div><div class="quick-desc">Find someone for a call</div></div></button>
    </div></section>`;
  $("userSearch").addEventListener("keydown",e=>{if(e.key==="Enter")searchUser()});
}
async function searchUser(){
  const u=$("userSearch").value.trim().replace(/^@/,"");
  if(u.length<3)return toast("Enter a username.","error");
  const box=$("searchResult"),note=t=>`<div class="card" style="padding:20px;margin-bottom:14px;text-align:center;color:var(--muted)">${t}</div>`;
  box.innerHTML=note("Searching…");
  try{
    const{data,error}=await sb.from("profiles").select("id,username,display_name,online,last_seen").ilike("username",u).limit(1).maybeSingle();
    if(error)throw error;
    if(!data)return box.innerHTML=note("No user found.");
    const nm=data.display_name||data.username;
    box.innerHTML=`<div class="card" style="padding:18px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:12px">
      <div class="avatar">${escapeHtml(initials(nm))}</div><div style="min-width:0;flex:1"><div style="font-weight:850">${escapeHtml(nm)}</div><div style="color:var(--muted);font-size:13px">@${escapeHtml(data.username)} · ${data.online?"Online":"Offline"}</div></div></div>
      <div class="grid grid2" style="margin-top:14px">

function messageHtml(m){

function addMsg(m){const b=$("chatMessages");if(!b)return;$("chatEmpty")?.remove();b.insertAdjacentHTML("beforeend",messageHtml(m));b.scrollTop=b.scrollHeight}
async function loadChatMessages(){
  const b=$("chatMessages");if(!b||!ACTIVE_CHAT)return;
  const{data,error}=await sb.from("messages").select("*").eq("conversation_id",ACTIVE_CHAT.conversationId).order("created_at",{ascending:true}).limit(300);

async function sendChatMessage(){
  if(!ACTIVE_CHAT)return;
  const inp=$("chatInput"),msg=inp.value.trim();if(!msg)return;inp.value="";

async function subscribeChat(){
  if(CHAT_CHANNEL){try{await sb.removeChannel(CHAT_CHANNEL)}catch(_){}}
  if(!ACTIVE_CHAT)return;
  CHAT_CHANNEL=sb.channel("chat-"+ACTIVE_CHAT.conversationId).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+ACTIVE_CHAT.conversationId},p=>{if(p.new.sender_id!==NEXORA.user.id)addMsg(p.new)}).subscribe();

function lineWin(b,R,C,L){
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const v=b[r*C+c];if(!v)continue;
    for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;for(;k<L;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>=R||nc<0||nc>=C||b[nr*C+nc]!==v)break}if(k===L)return v}}
  return null;
}

  if(w){TTT.over=true;TTT.msg=w+" jeet gaya! 🏆";sfx(880,.4)}else if(TTT.b.every(Boolean)){TTT.over=true;TTT.msg="Draw"}else{TTT.t=TTT.t==="X"?"O":"X";TTT.msg=TTT.t+" ki baari"}renderTTT()}

function buildBoard(){
  const lane={},start={};
  Object.entries(LUDO_COLORS).forEach(([k,v])=>{v.homeCells.forEach(([r,c])=>lane[r+"_"+c]=k);const[r,c]=TRACK2[v.start];start[r+"_"+c]=k});
  let h="";
  for(let r=0;r<15;r++)for(let c=0;c<15;c++){
    if(r>=6&&r<=8&&c>=6&&c<=8)continue;
    let cls="c",txt="";const k=r+"_"+c;
    if(r<6&&c<6)cls+=" q-red";else if(r<6&&c>8)cls+=" q-green";else if(r>8&&c>8)cls+=" q-yellow";else if(r>8&&c<6)cls+=" q-blue";
    else{if(lane[k])cls+=" q-"+lane[k];else if(start[k])cls+=" q-"+start[k];
      const idx=TRACK2.findIndex(([a,b])=>a===r&&b===c);if(idx>=0&&SAFE.has(idx)&&!start[k])txt="★";if(start[k])txt="➤"}
    h+=`<div class="${cls}" style="grid-row:${r+1};grid-column:${c+1}">${txt}</div>`;
  }
  h+=`<div style="grid-area:7/7/10/10;background:conic-gradient(from -45deg,#3fc984 0 25%,#ffc93c 0 50%,#4a9dff 0 75%,#ef5368 0);border:1px solid rgba(0,0,0,.2)"></div>`;
  const u=100/15;
  Object.entries(YARD).forEach(([k,[r,c]])=>{h+=`<div class="yard" id="yard-${k}" style="--gc:${LUDO_COLORS[k].color};left:${(c+1)*u}%;top:${(r+1)*u}%;width:${4*u}%;height:${4*u}%">${[[12,12],[62,12],[12,62],[62,62]].map(([x,y])=>`<i style="left:${x}%;top:${y}%;background:${LUDO_COLORS[k].color}33"></i>`).join("")}</div>`});
  LUDO.players.forEach(pl=>pl.tokens.forEach((_,i)=>{h+=`<button class="tk" id="tk-${pl.color}-${i}" style="--tc:${LUDO_COLORS[pl.color].color}" onclick="selectLudoToken('${pl.color}',${i})"><b></b></button>`}));
  return h;
}
function renderLudo(){
  $("main").innerHTML=`<section class="page" style="padding-bottom:20px"><div class="ludo-wrap">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><button class="btn" onclick="leaveLudo()">‹ Games</button>
    ${LUDO.mode==="online"?`<div class="btn" style="display:grid;place-items:center">🌐 Online · ${LROOM?.code||""}</div>`:`<button class="btn" onclick="startLudo(LUDO.mode)">↻ Restart</button>`}</div>
   <div class="ludo-frame"><div id="ludoBoard">${buildBoard()}</div>
    <div class="ludo-bar"><div style="min-width:0"><div id="lMsg" style="font-weight:850"></div><div id="lHint" style="color:var(--muted);font-size:12px;margin-top:3px"></div></div>
     <button id="ludoDice" class="cubewrap" onclick="rollLudoDice()"><div class="cube" id="cube">${[1,2,3,4,5,6].map(n=>`<div class="face f${n}">${pipsHtml(n)}</div>`).join("")}</div></button></div>
    <div class="pcards">${LUDO.players.map((p,i)=>`<div class="pcard" id="pc-${i}" style="--gc:${LUDO_COLORS[p.color].color}"><em></em><div style="min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name)}${LUDO.me===i?" (You)":""}</div><div id="pcs-${i}" style="color:var(--muted);font-size:12px"></div></div></div>`).join("")}</div>
   </div></div></section>`;
  updateLudo();
}
function updateLudo(){
  if(!$("ludoBoard")||!LUDO)return;
  const pl=cur(),groups={},u=100/15,offs=[[0,0],[-.2,-.2],[.2,-.2],[-.2,.2],[.2,.2]];
  LUDO.players.forEach(p=>p.tokens.forEach((_,i)=>{const xy=ludoXY(p,i);(groups[xy.join("_")]=groups[xy.join("_")]||[]).push([p,i,xy])}));
  Object.values(groups).forEach(g=>g.forEach(([p,i,xy],n)=>{
    const el=$(`tk-${p.color}-${i}`);if(!el)return;
    const o=g.length>1?offs[Math.min(n+1,4)]:offs[0],s=g.length>1?.72:1;
    el.style.left=xy[1]*u+"%";el.style.top=xy[0]*u+"%";el.style.transform=`translate(${o[0]*100}%,${o[1]*100}%) scale(${s})`;
    el.classList.toggle("can",!LUDO.busy&&!LUDO.rolling&&isHuman()&&p===pl&&!!LUDO.dice&&canMove(p.tokens[i],LUDO.dice));
  }));
  Object.keys(YARD).forEach(k=>$("yard-"+k)?.classList.toggle("glow",!LUDO.winner&&pl.color===k));
  LUDO.players.forEach((p,i)=>{$("pc-"+i).classList.toggle("on",i===LUDO.turn&&!LUDO.winner);$("pcs-"+i).textContent=p.tokens.filter(x=>x===FINISH).length+"/4 home"});
  const can=!LUDO.rolling&&!LUDO.busy&&!LUDO.dice&&!LUDO.winner&&isHuman();
  $("ludoDice").classList.toggle("ready",can);$("ludoDice").classList.toggle("off",!can&&!LUDO.rolling);
  $("lMsg").textContent=LUDO.message;
  $("lHint").textContent=LUDO.winner?"Game khatam":LUDO.rolling?"Rolling…":!isHuman()?pl.name+" ki baari…":LUDO.dice?"Chamakta hua token chuno":"Dice par tap karo";
}
function spinCube(d){const[x,y]=ORI[d];LUDO.cubeN++;const c=$("cube");if(c)c.style.transform=`rotateX(${x+720*LUDO.cubeN}deg) rotateY(${y+720*LUDO.cubeN}deg)`}
const rnd6=()=>1+Math.floor(Math.random()*6);

function rollLudoDice(){
  if(!LUDO||LUDO.winner||LUDO.rolling||LUDO.busy||LUDO.dice||!isHuman())return;
  const d=rnd6();lsend({t:"roll",d});animateRoll(d);
}
async function animateRoll(d){
  LUDO.rolling=true;LUDO.dice=null;updateLudo();spinCube(d);sfx(180,.8,"triangle",.04);
  await sleep(950);if(!LUDO)return;
  LUDO.rolling=false;LUDO.dice=d;const pl=cur();
  LUDO.sixes=d===6?LUDO.sixes+1:0;LUDO.message=`${pl.name} ne ${d} roll kiya`;sfx(d===6?760:420,.12);
  if(LUDO.sixes>=3){LUDO.sixes=0;LUDO.dice=null;LUDO.message=pl.name+": teen 6, turn gaya";updateLudo();await sleep(900);return endTurn()}
  const mv=getMovable();updateLudo();
  if(!mv.length){await sleep(800);LUDO.dice=null;return d===6?again(pl):endTurn()}
  if(!isMine())return;
  if(LUDO.mode==="robot"&&LUDO.turn===1){await sleep(650);return playMove(robotPick(pl,mv,d))}
  if(mv.length===1){await sleep(450);playMove(mv[0])}
}
function robotPick(pl,mv,d){
  const foe=LUDO.players[0];let best=mv[0],bs=-1;
  mv.forEach(i=>{const p=pl.tokens[i],n=p===-1?0:p+d;let s=n;
    if(p===-1)s+=60;if(n===FINISH)s+=90;
    if(n<=50){const a=(LUDO_COLORS[pl.color].start+n)%52;
      if(SAFE.has(a))s+=25;else if(foe.tokens.some(q=>q>=0&&q<=50&&(LUDO_COLORS[foe.color].start+q)%52===a))s+=120}
    if(s>bs){bs=s;best=i}});
  return best;
}
function selectLudoToken(color,i){
  if(!LUDO||LUDO.winner||LUDO.busy||LUDO.rolling||!LUDO.dice||!isHuman())return;
  const pl=cur();if(pl.color!==color||!canMove(pl.tokens[i],LUDO.dice))return;
  playMove(i);
}
function playMove(i){lsend({t:"move",i});return commit(cur(),i)}
async function commit(pl,i){
  LUDO.busy=true;const d=LUDO.dice,old=pl.tokens[i];
  const hop=()=>{const e=$(`tk-${pl.color}-${i}`);if(e){e.classList.remove("hop");void e.offsetWidth;e.classList.add("hop")}sfx(300+Math.random()*80,.05,"square",.03)};
  if(old===-1){pl.tokens[i]=0;hop();updateLudo();await sleep(280)}
  else for(let p=old+1;p<=old+d;p++){pl.tokens[i]=p;hop();updateLudo();await sleep(190)}
  let cut=false;const p=pl.tokens[i];
  if(p>=0&&p<=50){const a=(LUDO_COLORS[pl.color].start+p)%52;
    if(!SAFE.has(a))LUDO.players.forEach(o=>{if(o===pl)return;o.tokens=o.tokens.map((q,qi)=>{
      if(q>=0&&q<=50&&(LUDO_COLORS[o.color].start+q)%52===a){cut=true;const e=$(`tk-${o.color}-${qi}`);e?.classList.add("cut");setTimeout(()=>e?.classList.remove("cut"),420);return -1}return q})})}
  if(cut){toast("Token capture! 💥");sfx(120,.4,"sawtooth",.07);await sleep(380)}
  updateLudo();LUDO.dice=null;LUDO.busy=false;
  if(pl.tokens.every(x=>x===FINISH)){
    LUDO.winner=pl.name;LUDO.message=pl.name+" jeet gaya! 🏆";updateLudo();[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.3),k*140));
    $("ludoBoard").insertAdjacentHTML("beforeend",`<div class="confetti"><div>🏆<br>${escapeHtml(pl.name)} won!</div></div>`);return;
  }
  (d===6||cut||p===FINISH)?again(pl):endTurn();
}
function botTurn(){if(LUDO&&LUDO.mode==="robot"&&LUDO.turn===1&&!LUDO.winner)setTimeout(()=>LUDO&&animateRoll(rnd6()),850)}
function again(pl){LUDO.dice=null;LUDO.message=pl.name+" ko dobara chance";updateLudo();botTurn()}
function endTurn(){LUDO.sixes=0;LUDO.turn=(LUDO.turn+1)%LUDO.players.length;LUDO.dice=null;LUDO.message=cur().name+" ki baari";updateLudo();botTurn()}

/* ----- online room (Supabase realtime broadcast) ----- */
function lsend(m){if(LROOM&&LUDO?.mode==="online"||(LROOM&&m.t==="join"))LROOM.send({type:"broadcast",event:"g",payload:{...m,from:NEXORA.user.id}})}
async function openRoom(code,host){
  closeRoom();
  const ch=sb.channel("ludo-"+code);
  ch.on("broadcast",{event:"g"},({payload:m})=>onLudoMsg(m,host));
  LROOM=ch;ch.code=code;
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
}
function closeRoom(){if(LROOM){try{sb.removeChannel(LROOM)}catch(_){}LROOM=null}}
async function onLudoMsg(m,host){
  if(m.from===NEXORA.user.id)return;
  if(m.t==="join"&&host&&LROOM){LROOM.send({type:"broadcast",event:"g",payload:{t:"start",host:myName(),from:NEXORA.user.id}});startLudo("online",[myName(),m.name],0);return}
  if(m.t==="start"&&!host){startLudo("online",[m.host,myName()],1);return}
  if(!LUDO||LUDO.mode!=="online")return;
  if(m.t==="roll"&&!isMine()&&!LUDO.rolling&&!LUDO.dice)animateRoll(m.d);
  if(m.t==="move"&&!isMine()){while(LUDO.rolling)await sleep(50);if(LUDO.dice&&!LUDO.busy)commit(cur(),m.i)}
  if(m.t==="leave"){toast("Dost ne game chhod diya.");LUDO.winner=LUDO.winner||"—";LUDO.message="Dost chala gaya";updateLudo()}
}
async function hostLudo(code){
  code=code||Math.random().toString(36).slice(2,8).toUpperCase();
  await openRoom(code,true);
  openModal(`<div class="modal-title">Room ready 🎲</div><div class="modal-sub">Dost ka wait ho raha hai…</div>
   <div class="card" style="padding:22px;text-align:center;font-size:34px;font-weight:900;letter-spacing:6px;margin-bottom:14px">${code}</div>
   <div style="color:var(--muted);font-size:13px;text-align:center;margin-bottom:14px">Ye code dost ko bhejo, ya Connect se invite karo.</div>
   <button class="btn danger" style="width:100%" onclick="closeRoom();closeModal()">Cancel</button>`);
}
async function joinLudo(code){
  if(!code||code.length<4)return toast("Room code daalo.","error");
  await openRoom(code,false);closeModal();toast("Join ho raha hai…");
  let n=0;const iv=setInterval(()=>{if(LUDO?.mode==="online"||++n>8)return clearInterval(iv);LROOM?.send({type:"broadcast",event:"g",payload:{t:"join",name:myName(),from:NEXORA.user.id}})},1500);
  LROOM.send({type:"broadcast",event:"g",payload:{t:"join",name:myName(),from:NEXORA.user.id}});
}
async function sendGameInvite(tid){
  if(tid===NEXORA.user.id)return;
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  await hostLudo(code);
  try{await sendSignal({type:"game-invite",to:tid,code,fromName:myName()})}catch(_){}
  try{await sb.from("notifications").insert({user_id:tid,type:"game_invite",title:"Ludo invitation",body:myName()+" ne Ludo ke liye bulaya. Code: "+code,data:{code}})}catch(_){}
}
const _hs=handleSignal;
handleSignal=async p=>{
  if(p&&p.type==="game-invite"){sfx(660,.25);
    openModal(`<div class="modal-title">🎲 Ludo invite</div><div class="modal-sub">${escapeHtml(p.fromName||"Dost")} aapke saath Ludo khelna chahta hai</div>
     <div class="modal-actions"><button class="btn" onclick="closeModal()">Baad me</button><button class="btn primary-btn" onclick="joinLudo('${escapeAttr(p.code)}')">Accept</button></div>`);return}
  return _hs(p);
};
function leaveLudo(){lsend({t:"leave"});closeRoom();LUDO=null;setPage("games")}

/* ===== boot ===== */
async function boot(){
  try{const{data,error}=await sb.auth.getSession();if(error)throw error;
    if(data?.session?.user)await enterApp(data.session.user);else{$("authScreen").classList.remove("hidden");$("appShell").classList.add("hidden")}}
  catch(e){console.error("Boot:",e);$("authScreen").classList.remove("hidden");$("appShell").classList.add("hidden")}
  sb.auth.onAuthStateChange(async(ev,s)=>{
    if(ev==="SIGNED_OUT"){$("appShell").classList.add("hidden");$("authScreen").classList.remove("hidden");return}
    if(ev==="SIGNED_IN"&&s?.user&&!NEXORA.user)await enterApp(s.user);
  });
}
setInterval(async()=>{
  if(!NEXORA.user)return;
  try{await sb.from("profiles").update({online:true,last_seen:new Date().toISOString()}).eq("id",NEXORA.user.id)}catch(_){}
  const el=$("liveCountText");if(NEXORA.page==="home"&&el)el.textContent=(window.NEXORA_LIVE_COUNT||1)+" people live";
},60000);
boot();
</script>

<style>

#ludoBoard>.c[class*="q-"]{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}

#ludoBoard>div[style*="grid-area"]::after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9dcc0 60%,#b89a5a);box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 2px #d8a94a}

/* pawn */
.tk b{inset:-42% 14% 6% 14%;border:0;background:none;box-shadow:none;border-radius:0;transition:transform .2s}
.tk b::before{content:"";position:absolute;left:21%;right:21%;top:0;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0,rgba(255,255,255,.35) 22%,transparent 40%),radial-gradient(circle at 50% 55%,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));box-shadow:0 2px 3px rgba(0,0,0,.35)}
.tk b::after{content:"";position:absolute;left:0;right:0;top:34%;bottom:0;clip-path:polygon(38% 0,62% 0,70% 38%,100% 86%,100% 100%,0 100%,0 86%,30% 38%);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,#000),var(--tc) 38%,#fff3 50%,var(--tc) 62%,color-mix(in srgb,var(--tc) 50%,#000))}
.tk::after{left:10%;right:10%;bottom:4%;height:16%;background:rgba(0,0,0,.45);filter:blur(2.5px)}
.tk::before{content:"";position:absolute;left:-8%;right:-8%;bottom:-6%;height:34%;border-radius:50%;border:2.5px solid transparent;opacity:0;transition:opacity .2s}
.tk.can::before{opacity:1;border-color:#fff;box-shadow:0 0 14px 2px var(--tc);animation:ringp .9s ease-in-out infinite alternate}
@keyframes ringp{to{transform:scale(1.25);opacity:.45}}
.tk.can b{animation:lift .9s ease-in-out infinite alternate}
@keyframes lift{to{transform:translateY(-12%)}}
@keyframes hop{50%{transform:translateY(-34%)}}
.tk.hop b{animation:hop .19s ease-out}

/* hud */
#turnBanner{margin-bottom:12px;padding:11px 16px;border-radius:16px;font-weight:850;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--tb) 28%,#101722),#101722);border:1px solid color-mix(in srgb,var(--tb) 55%,transparent);box-shadow:0 10px 30px -12px var(--tb)}
#turnBanner.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(-26px)}}
#turnBanner i{width:12px;height:12px;border-radius:50%;background:var(--tb);box-shadow:0 0 12px var(--tb)}
.hdots{display:flex;gap:5px;margin-top:5px}

.hdots s.on{background:var(--gc);border-color:#fff;box-shadow:0 0 8px var(--gc)}
.cubewrap{filter:drop-shadow(0 12px 10px rgba(0,0,0,.55))}
.face{background:linear-gradient(145deg,#fffdf6,#e3dac4)}
.pips i.on{background:radial-gradient(circle at 35% 30%,#7a2a2a,#2b0a0a)}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:8;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.cf{position:absolute;top:-10px;width:8px;height:14px;z-index:10;pointer-events:none;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(520px) rotate(720deg);opacity:.2}}
</style>

<script>
(function(){
  /* haptics: kat-ne / jeet par halka vibration */
  const _s=sfx;sfx=function(f,d,t,v){_s(f,d,t,v);if(navigator.vibrate&&(f===120||f===1047))navigator.vibrate(f===120?[40,30,60]:[60,40,60,40,120])};

  const burst=(el,color)=>{
    const b=$("ludoBoard");if(!b||!el)return;const br=b.getBoundingClientRect(),r=el.getBoundingClientRect();
    const x=r.left-br.left+r.width/2,y=r.top-br.top+r.height/2;
    for(let i=0;i<16;i++){const p=document.createElement("i");p.className="pt";const a=Math.random()*6.28,d=24+Math.random()*34;
      p.style.cssText=`left:${x}px;top:${y}px;background:${color};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;b.appendChild(p);setTimeout(()=>p.remove(),750)}
  };
  const confetti=()=>{
    const b=$("ludoBoard");if(!b)return;const cols=["#ef5368","#3fc984","#ffc93c","#4a9dff","#fff"];
    for(let i=0;i<46;i++){const c=document.createElement("i");c.className="cf";
      c.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${Math.random()*.9}s;border-radius:${i%3?"2px":"50%"}`;b.appendChild(c)}
  };

  function decorate(){
    const board=$("ludoBoard");if(!board)return;
    board.querySelectorAll(":scope>.c").forEach(c=>{
      const r=+c.style.gridRow-1,k=+c.style.gridColumn-1;
      if((r<6||r>8)&&(k<6||k>8))c.classList.add("qd");
    });
    if(!$("turnBanner"))board.parentElement.insertAdjacentHTML("beforebegin",`<div id="turnBanner"><i></i><span></span></div>`);
    new MutationObserver(ms=>ms.forEach(m=>{
      if(m.type==="attributes"&&m.target.classList?.contains("cut")&&m.target.classList.contains("tk")){
        burst(m.target,getComputedStyle(m.target).getPropertyValue("--tc"))}
      m.addedNodes?.forEach(n=>{if(n.classList?.contains("confetti"))confetti()});
    })).observe(board,{subtree:true,attributes:true,attributeFilter:["class"],childList:true});
  }

  const _rl=renderLudo;renderLudo=function(){_rl();decorate()};

  let lastTurn=null;
  const _ul=updateLudo;updateLudo=function(){
    _ul();if(!LUDO||!$("turnBanner"))return;
    const pl=cur(),tb=$("turnBanner"),key=LUDO.winner?"w":LUDO.turn;
    tb.style.setProperty("--tb",LUDO_COLORS[pl.color].color);
    tb.querySelector("span").textContent=LUDO.winner?"🏆 "+LUDO.winner+" jeet gaya!":(isHuman()&&LUDO.mode!=="local"?"Aapki baari — ":"")+pl.name+(isHuman()&&LUDO.mode!=="local"?"":" ki baari");
    if(key!==lastTurn){lastTurn=key;tb.classList.remove("swap");void tb.offsetWidth;tb.classList.add("swap")}
    LUDO.players.forEach((p,i)=>{const n=p.tokens.filter(x=>x===FINISH).length,e=$("pcs-"+i);
      if(e)e.innerHTML=`<div class="hdots">${[0,1,2,3].map(k=>`<s class="${k<n?"on":""}"></s>`).join("")}</div>`});
  };
})();
</script>

<script>
/* ============ PART A: group call + game arc ============ */
const IDLE2=()=>({...IDLE_CALL(),peers:{},solo:null,deaf:false,members:[]});
const CC=()=>NEXORA.call;
NEXORA.call=IDLE2();
let SHEET=false,RING=null,ARC=null,PENDING=null,INREQ=null,PICK=[],TCH=null;
const GN={ludo:"🎲 Ludo",ttt:"❌ Tic-Tac-Toe"};
$("callMute").textContent="🎙";
$("callMute").insertAdjacentHTML("afterend",`<button id="callPeople" class="btn hidden">👥</button><button id="callChat" class="btn hidden">💬</button><button id="callGame" class="btn hidden">🎮</button>`);
const _cuA=callUI;callUI=function(a,d,m,e){_cuA(a,d,m,e);["callPeople","callChat","callGame"].forEach(i=>$(i)?.classList.toggle("hidden",!(m&&e)))};
const _cmA=closeModal;closeModal=function(){SHEET=false;_cmA()};

/* ---- ringtone ---- */
function startRing(){stopRing();RING=setInterval(()=>{sfx(520,.18,"sine",.08);setTimeout(()=>sfx(660,.18,"sine",.08),220);navigator.vibrate?.(200)},1700)}
function stopRing(){if(RING){clearInterval(RING);RING=null}}

/* ---- mesh peers ---- */
const callTitle=()=>{const n=Object.values(CC().peers);return n.length>1?"Group · "+(n.length+1):(n[0]?.name||CC().targetName||"Call")};
function applyAudio(){const c=CC();Object.entries(c.peers).forEach(([u,P])=>{if(P.audio)P.audio.muted=c.deaf||P.muted||(!!c.solo&&c.solo!==u)})}
function refreshCall(){const c=CC();if(c.state==="idle")return;applyAudio();if(c.state==="connected")$("callName").textContent=callTitle();if(SHEET)renderPeople()}
async function setRemote(P,d){await P.pc.setRemoteDescription(new RTCSessionDescription(d));while(P.queue.length)P.pc.addIceCandidate(P.queue.shift()).catch(()=>{})}
function mkPeer(uid,name){
  const c=CC();if(c.peers[uid])return c.peers[uid];
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});
  const P={pc,name,muted:false,state:"connecting",audio:null,queue:[]};c.peers[uid]=P;
  c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
  pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:"call-ice",to:uid,callId:c.id,candidate:e.candidate}).catch(()=>{})};
  pc.ontrack=e=>{if(!P.audio){const a=document.createElement("audio");a.autoplay=true;a.playsInline=true;document.body.appendChild(a);P.audio=a}P.audio.srcObject=e.streams[0];P.audio.play().catch(()=>{});applyAudio()};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;
    if(s==="connected"){P.state="connected";if(c.state!=="connected"&&CC()===c){c.state="connected";callSet(callTitle(),"Connected");callUI(0,0,1,1);startCallTimer()}refreshCall()}
    if(s==="failed"||s==="closed")dropPeer(uid)};
  return P;
}
function dropPeer(uid){
  const c=CC(),P=c.peers[uid];if(!P)return;
  try{P.pc.close()}catch(_){}if(P.audio){try{P.audio.srcObject=null}catch(_){}P.audio.remove()}
  delete c.peers[uid];if(c.solo===uid)c.solo=null;
  if(!Object.keys(c.peers).length&&c.state!=="ringing")endCall("ended",true);else refreshCall();
}
async function dial(uid,name){
  const c=CC(),P=mkPeer(uid,name);
  await P.pc.setLocalDescription(await P.pc.createOffer());
  await sendSignal({type:"call-offer",to:uid,callId:c.id,fromName:myName(),members:Object.keys(c.peers).filter(k=>k!==uid).map(k=>({id:k,name:c.peers[k].name})),offer:P.pc.localDescription});
}
async function inviteToCall(uid,name){
  const c=CC();
  if(c.state!=="connected")return toast("Pehle call connect hone do.");
  if(c.peers[uid])return toast("Ye pehle se call me hai.");
  if(Object.keys(c.peers).length>=3)return toast("Ek call me max 4 log.");
  try{await dial(uid,name);toast(name+" ko ring ja rahi hai…");refreshCall();
    setTimeout(()=>{const P=CC().peers[uid];if(P&&P.state!=="connected"&&CC().id===c.id){sendSignal({type:"call-ended",to:uid,callId:c.id}).catch(()=>{});dropPeer(uid);toast(name+" ne uthaya nahi")}},30000)}
  catch(e){toast(e.message||"Add nahi hua","error")}
}

/* ---- call lifecycle (overrides) ---- */
async function startCallByUser(tid,tname){
  if(!NEXORA.user)return toast("Please log in first.","error");
  if(CC().state!=="idle")return inviteToCall(tid,tname||"User");
  try{
    const stream=await getMic();
    NEXORA.call={...IDLE2(),id:crypto.randomUUID(),mode:"outgoing",state:"calling",stream,targetId:tid,targetName:tname||"User"};
    $("callAvatar").textContent=initials(tname);callShow();callSet(tname,"Calling…");callUI(0,0,0,1);
    try{const{data,error}=await sb.rpc("nexora_start_call",{target_username:tname,call_kind:"voice"});if(!error&&data?.call_id)NEXORA.call.id=data.call_id}catch(_){}
    await dial(tid,tname||"User");
    stopCallTimeout();
    NEXORA.call.timeout=setTimeout(()=>{if(CC().state==="calling")endCall("missed")},30000);
  }catch(e){console.error(e);toast(e.message||"Could not start call.","error");await endCall("cancelled",true)}
}
async function gcOffer(p){
  const c=CC();
  if(c.state!=="idle"&&p.callId===c.id){
    if(c.state==="ringing")return;
    try{const P=mkPeer(p.from,p.fromName||"User");await setRemote(P,p.offer);await P.pc.setLocalDescription(await P.pc.createAnswer());
      await sendSignal({type:"call-answer",to:p.from,callId:c.id,answer:P.pc.localDescription});refreshCall()}catch(e){console.warn(e)}
    return;
  }
  if(c.state!=="idle"){try{await sendSignal({type:"call-busy",to:p.from,callId:p.callId})}catch(_){}return}
  NEXORA.call={...IDLE2(),id:p.callId,mode:"incoming",state:"ringing",targetId:p.from,targetName:p.fromName||"Incoming call",pendingOffer:p.offer,members:p.members||[]};
  callShow();callSet(NEXORA.call.targetName,(p.members?.length?"Group call · ":"")+"Incoming voice call");
  $("callAvatar").textContent=initials(NEXORA.call.targetName);callUI(1,1,0,0);startRing();
  NEXORA.call.timeout=setTimeout(async()=>{if(CC().state==="ringing"){try{await sendSignal({type:"call-missed",to:CC().targetId,callId:CC().id})}catch(_){}await endCall("missed",true)}},30000);
}
async function acceptCall(){
  const c=CC();if(c.mode!=="incoming"||c.state!=="ringing")return;
  stopRing();stopCallTimeout();
  try{
    c.stream=await getMic();c.state="connecting";callSet(c.targetName,"Connecting…");callUI(0,0,1,1);
    const P=mkPeer(c.targetId,c.targetName);await setRemote(P,c.pendingOffer);
    await P.pc.setLocalDescription(await P.pc.createAnswer());
    await sendSignal({type:"call-answer",to:c.targetId,callId:c.id,answer:P.pc.localDescription});
    for(const m of c.members)await dial(m.id,m.name);
    try{await sb.from("calls").update({status:"accepted",started_at:new Date().toISOString()}).eq("id",c.id)}catch(_){}
  }catch(e){toast(e.message||"Microphone permission failed.","error");await endCall("cancelled",true)}
}
async function declineCall(){
  const c=CC();stopRing();
  if(c.targetId){try{await sendSignal({type:"call-declined",to:c.targetId,callId:c.id})}catch(_){}
    try{await sb.from("calls").update({status:"declined",ended_at:new Date().toISOString()}).eq("id",c.id)}catch(_){}}
  await cleanupCall();
}
async function endCall(status="ended",silent=false){
  const c=CC();if(c.state==="idle"){callHide();return}
  stopCallTimeout();
  if(!silent){for(const u of Object.keys(c.peers)){try{await sendSignal({type:"call-ended",to:u,callId:c.id})}catch(_){}}
    if(c.state==="ringing"&&c.targetId){try{await sendSignal({type:"call-declined",to:c.targetId,callId:c.id})}catch(_){}}}
  if(c.id){try{await sb.from("calls").update({status,ended_at:new Date().toISOString()}).eq("id",c.id)}catch(_){}}
  await cleanupCall();
}
async function cleanupCall(){
  const c=CC();stopRing();stopCallTimer();stopCallTimeout();
  try{c.stream?.getTracks().forEach(t=>t.stop())}catch(_){}
  Object.values(c.peers||{}).forEach(P=>{try{P.pc.close()}catch(_){}if(P.audio){try{P.audio.srcObject=null}catch(_){}P.audio.remove()}});
  NEXORA.call=IDLE2();callHide();callUI(1,1,0,0);
  $("callMute").textContent="🎙";$("callMute").classList.remove("danger");
  if(SHEET)closeModal();
}
async function toggleMute(){
  const c=CC();if(!c.stream)return;c.muted=!c.muted;
  c.stream.getAudioTracks().forEach(t=>t.enabled=!c.muted);
  $("callMute").textContent=c.muted?"🔇":"🎙";$("callMute").classList.toggle("danger",c.muted);
  navigator.vibrate?.(20);refreshCall();
}
function gcGone(p){
  const c=CC();if(p.callId!==c.id)return;
  const P=c.peers[p.from];
  if(P){const n=P.name;dropPeer(p.from);toast(p.type==="call-busy"?n+" busy hai":p.type==="call-declined"?n+" ne call cut kar di":n+" call se chala gaya")}
  else if(c.state==="ringing"&&p.from===c.targetId){cleanupCall();toast("Missed call")}
}
$("callAccept").onclick=acceptCall;$("callDecline").onclick=declineCall;
$("callEnd").onclick=()=>endCall(CC().state==="calling"?"cancelled":"ended");
$("callMute").onclick=toggleMute;$("callPeople").onclick=()=>{SHEET=true;renderPeople()};
$("callChat").onclick=chatWithPeer;$("callGame").onclick=gameFromCall;

/* ---- participants sheet ---- */
function renderPeople(){
  const c=CC();if(c.state==="idle")return;
  const keep=$("addU")?.value||"",ids=Object.keys(c.peers);
  const row=(id,P)=>`<div class="pr"><div class="avatar">${escapeHtml(initials(P.name))}</div><div class="nm">${escapeHtml(P.name)}<small>${P.state==="connected"?"Connected":"Connecting…"}${P.muted?" · muted":""}${c.solo===id?" · sirf yehi sunai de raha":""}</small></div>
    <button class="pb ${P.muted?"on":""}" onclick="peerMute('${escapeAttr(id)}')">${P.muted?"🔇":"🔊"}</button><button class="pb ${c.solo===id?"on":""}" onclick="peerSolo('${escapeAttr(id)}')">🎧</button></div>`;
  openModal(`<div class="modal-title">Call · <span id="shTime">${c.startedAt?formatTime((Date.now()-c.startedAt)/1000):"00:00"}</span></div><div class="modal-sub">${ids.length+1} log call me</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">
    <button class="btn ${c.muted?"danger":""}" onclick="toggleMute()">${c.muted?"🔇 Mic band":"🎙 Mic on"}</button>
    <button class="btn ${c.deaf?"danger":""}" onclick="muteAll()">${c.deaf?"🔈 Sabko sunao":"🔇 Sabko mute"}</button></div>
   <div class="pr"><div class="avatar">${escapeHtml(initials(myName()))}</div><div class="nm">Aap<small>${c.muted?"mic band":"mic on"}</small></div></div>
   ${ids.map(i=>row(i,c.peers[i])).join("")}
   <div style="display:flex;gap:8px;margin:14px 0 10px"><input id="addU" class="pf-input" style="margin:0;flex:1;min-width:0" placeholder="@username jodo" value="${escapeHtml(keep)}" autocapitalize="off" autocomplete="off"><button class="btn primary-btn" onclick="addToCall()">➕ Add</button></div>
   <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn danger" onclick="endCall()">End call</button></div>`);
  SHEET=true;
}
setInterval(()=>{if(SHEET&&CC().startedAt){const e=$("shTime");if(e)e.textContent=formatTime((Date.now()-CC().startedAt)/1000)}},1000);
function peerMute(id){const P=CC().peers[id];if(!P)return;P.muted=!P.muted;if(P.muted&&CC().solo===id)CC().solo=null;refreshCall()}
function peerSolo(id){const c=CC(),P=c.peers[id];if(!P)return;c.solo=c.solo===id?null:id;if(c.solo)P.muted=false;refreshCall()}
function muteAll(){CC().deaf=!CC().deaf;refreshCall()}
async function addToCall(){
  const u=$("addU").value.trim().replace(/^@/,"").toLowerCase();if(u.length<3)return toast("Username daalo.","error");
  const{data}=await sb.from("profiles").select("id,username,display_name").ilike("username",u).limit(1).maybeSingle();
  if(!data)return toast("User nahi mila.","error");
  if(data.id===NEXORA.user.id)return toast("Khud ko add nahi kar sakte.");
  $("addU").value="";inviteToCall(data.id,data.display_name||data.username);
}
async function chatWithPeer(){
  const ids=Object.keys(CC().peers);if(ids.length!==1)return toast("Chat ke liye 👥 se ek insaan chuno.");
  const{data}=await sb.from("profiles").select("username,display_name").eq("id",ids[0]).maybeSingle();
  if(!data)return toast("User nahi mila.","error");
  openChat("",ids[0],data.username,data.display_name||data.username);
}
function gameFromCall(){
  const ids=Object.keys(CC().peers);if(!ids.length)return toast("Pehle call connect hone do.");
  if(ids.length===1)return openArc({uid:ids[0],name:CC().peers[ids[0]].name});
  PICK=ids.map(i=>({uid:i,name:CC().peers[i].name}));
  openModal(`<div class="modal-title">Kisse khelna hai?</div><div class="modal-sub">Ek insaan chuno</div>${PICK.map((p,i)=>`<button class="btn" style="width:100%;margin-bottom:8px" onclick="closeModal();openArc(PICK[${i}])">${escapeHtml(p.name)}</button>`).join("")}`);
}

/* ---- game arc ---- */
function buildArc(){
  if($("arcWrap"))return;
  const G=[["ludo","🎲","Ludo",1],["ttt","❌","Tic-Tac-Toe",1],["uno","🃏","UNO",0]],ang=[140,90,40];
  document.body.insertAdjacentHTML("beforeend",`<div id="arcWrap" class="arc-wrap"><div class="arc-back"></div><div class="arc"><div class="arc-t">Kaunsa game khelna hai?</div>
   ${G.map(([k,i,n,on],j)=>{const a=ang[j]*Math.PI/180;return `<button class="arc-g ${on?"":"soon"}" data-g="${k}" style="left:${165+112*Math.cos(a)-31}px;top:${112*Math.sin(a)-31}px;--d:${.08+j*.07}s">${i}<small>${n}</small></button>`}).join("")}
   <div class="arc-grab"></div></div></div>`);
  const w=$("arcWrap"),arc=w.querySelector(".arc");let y0=null;
  w.querySelector(".arc-back").onclick=closeArc;
  w.querySelectorAll(".arc-g").forEach(b=>b.onclick=()=>{const c=ARC;closeArc();if(c)requestGame(c.uid,c.name,b.dataset.g)});
  arc.addEventListener("pointerdown",e=>y0=e.clientY);arc.addEventListener("pointerup",e=>{if(y0!==null&&y0-e.clientY>30)closeArc();y0=null});
}
function openArc(ctx){buildArc();ARC=ctx;navigator.vibrate?.(15);requestAnimationFrame(()=>$("arcWrap").classList.add("open"))}
function closeArc(){$("arcWrap")?.classList.remove("open")}
function sendGameInvite(tid){openArc({uid:tid,name:"Dost"})}

const _rcA=renderChat;renderChat=function(){
  _rcA();const c=ACTIVE_CHAT,h=document.querySelector(".chat-head");if(!h)return;
  const g=h.querySelector(".icon-btn[title]");if(g){g.textContent="🎮";g.onclick=()=>openArc({uid:c.otherId,name:c.displayName})}
  h.insertAdjacentHTML("afterend",`<div class="grab" id="chatGrab"><i></i></div>`);
  const gr=$("chatGrab");let y0=null;
  gr.addEventListener("pointerdown",e=>{y0=e.clientY});
  gr.addEventListener("pointermove",e=>{if(y0!==null&&e.clientY-y0>18){y0=null;openArc({uid:c.otherId,name:c.displayName})}});
  gr.addEventListener("pointerup",()=>{if(y0!==null)openArc({uid:c.otherId,name:c.displayName});y0=null});
};

/* ---- game request -> accept -> both enter ---- */
async function requestGame(uid,name,game){
  if(game==="uno")return toast("UNO jaldi aa raha hai 🃏");
  if(uid===NEXORA.user.id)return;
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  try{
    if(game==="ludo")await openRoom(code,true);else await openTTTRoom(code,true);
    PENDING={code,game,uid,name};
    await sendSignal({type:"game-req",to:uid,game,code,fromName:myName()});
    openModal(`<div class="modal-title">Request bhej di 🎮</div><div class="modal-sub">${escapeHtml(name)} ke accept karne ka wait…</div><div class="card" style="padding:18px;text-align:center;font-weight:850;margin-bottom:14px">${GN[game]}</div><button class="btn danger" style="width:100%" onclick="cancelGame()">Cancel</button>`);
    setTimeout(()=>{if(PENDING?.code===code)cancelGame(true)},45000);
  }catch(e){toast(e.message||"Request nahi gayi","error")}
}
function cancelGame(timeout){
  const p=PENDING;PENDING=null;
  if(p){closeRoom();closeTTT();sendSignal({type:"game-cancel",to:p.uid,code:p.code}).catch(()=>{})}
  closeModal();if(timeout)toast("Koi jawab nahi aaya");
}
async function acceptGame(){
  const r=INREQ;INREQ=null;if(!r)return;closeModal();
  try{await sendSignal({type:"game-accept",to:r.from,code:r.code})}catch(_){}
  if(r.game==="ludo")joinLudo(r.code);else openTTTRoom(r.code,false);
}
function declineGame(){const r=INREQ;INREQ=null;closeModal();if(r)sendSignal({type:"game-declined",to:r.from,code:r.code}).catch(()=>{})}
const _hsA=handleSignal;
handleSignal=async function(p){
  if(!p||p.from===NEXORA.user?.id)return;
  switch(p.type){
    case"call-offer":return gcOffer(p);
    case"call-answer":{const P=CC().peers[p.from];if(P&&p.callId===CC().id){try{await setRemote(P,p.answer);if(CC().state==="calling")CC().state="connecting";callSet(callTitle(),"Connecting…")}catch(_){dropPeer(p.from)}}return}
    case"call-ice":{const P=CC().peers[p.from];if(P&&p.callId===CC().id&&p.candidate){if(P.pc.remoteDescription)P.pc.addIceCandidate(p.candidate).catch(()=>{});else P.queue.push(p.candidate)}return}
    case"call-declined":case"call-ended":case"call-timeout":case"call-missed":case"call-busy":return gcGone(p);
    case"game-req":
      INREQ={from:p.from,code:p.code,game:p.game};sfx(660,.25);navigator.vibrate?.([80,40,80]);
      openModal(`<div class="modal-title">${GN[p.game]||"Game"} invite</div><div class="modal-sub">${escapeHtml(p.fromName||"Dost")} aapke saath khelna chahta hai</div><div class="modal-actions"><button class="btn" onclick="declineGame()">Mana karo</button><button class="btn primary-btn" onclick="acceptGame()">Accept ✓</button></div>`);return;
    case"game-accept":if(PENDING&&PENDING.code===p.code){PENDING=null;closeModal();toast("Accept ho gaya, game shuru…")}return;
    case"game-declined":if(PENDING&&PENDING.code===p.code){PENDING=null;closeRoom();closeTTT();closeModal();toast("Dost ne game se mana kiya")}return;
    case"game-cancel":if(INREQ&&INREQ.code===p.code){INREQ=null;closeModal();toast("Request cancel ho gayi")}return;
  }
  return _hsA(p);
};

/* ---- Tic-Tac-Toe online ---- */
function closeTTT(){if(TCH){try{sb.removeChannel(TCH)}catch(_){}TCH=null}}
async function openTTTRoom(code,host){
  closeTTT();const ch=sb.channel("ttt-"+code);TCH=ch;
  const tx=m=>ch.send({type:"broadcast",event:"g",payload:{...m,from:NEXORA.user.id}});ch.tx=tx;
  ch.on("broadcast",{event:"g"},({payload:m})=>{
    if(m.from===NEXORA.user.id)return;
    if(m.t==="join"&&host&&!TTT?.online){tx({t:"start"});startTTT("X")}
    if(m.t==="start"&&!host)startTTT("O");
    if(m.t==="mv"&&TTT?.online&&!TTT.over&&TTT.t!==TTT.mine&&!TTT.b[m.i])applyTTT(m.i);
    if(m.t==="leave")toast("Dost ne game chhod diya");
  });
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
  if(!host){let n=0;const iv=setInterval(()=>{if(TTT?.online||++n>8)return clearInterval(iv);tx({t:"join"})},1200);tx({t:"join"})}
}
function startTTT(me){closeModal();TTT={b:Array(25).fill(""),t:"X",over:false,online:true,mine:me,msg:me==="X"?"Aapki baari (X)":"Dost ki baari (X)"};NEXORA.page="games";renderTTT()}
function applyTTT(i){
  TTT.b[i]=TTT.t;sfx(520,.07);const w=lineWin(TTT.b,5,5,4),me=TTT.mine;
  if(w){TTT.over=true;TTT.msg=TTT.online?(w===me?"Aap jeet gaye! 🏆":"Dost jeet gaya"):w+" jeet gaya! 🏆";sfx(880,.4)}
  else if(TTT.b.every(Boolean)){TTT.over=true;TTT.msg="Draw"}
  else{TTT.t=TTT.t==="X"?"O":"X";TTT.msg=TTT.online?(TTT.t===me?"Aapki baari ("+me+")":"Dost ki baari"):TTT.t+" ki baari"}
  renderTTT();
}
function tttMove(i){if(TTT.over||TTT.b[i])return;if(TTT.online&&TTT.t!==TTT.mine)return;applyTTT(i);if(TTT.online)TCH?.tx({t:"mv",i})}
const _spA=setPage;setPage=function(p){if(TTT?.online&&p==="games"){TCH?.tx({t:"leave"});closeTTT();TTT.online=false}return _spA(p)};
