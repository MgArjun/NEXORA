<!-- NEXORA PART 1/2 — CHAT + CONNECT + GAMES UI + REALTIME LUDO ENGINE -->
<style>
:root{
  --nx-bg:#07090d;
  --nx-card:#10141b;
  --nx-card2:#151a23;
  --nx-line:rgba(255,255,255,.08);
  --nx-text:#f7f8fa;
  --nx-muted:#8f98a8;
  --nx-accent:#6d7cff;
  --nx-green:#32d583;
  --nx-red:#ff5c70;
  --nx-yellow:#f5c84b;
  --nx-blue:#4d8dff;
  --nx-shadow:0 20px 70px rgba(0,0,0,.42);
}

.nx3-wrap{max-width:1180px;margin:auto;padding:22px}
.nx3-title{font-size:28px;font-weight:800;letter-spacing:-.7px}
.nx3-sub{color:var(--nx-muted);font-size:14px;margin-top:5px}
.nx3-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}
.nx3-card{
  background:linear-gradient(145deg,#121720,#0d1118);
  border:1px solid var(--nx-line);
  border-radius:24px;
  padding:20px;
  box-shadow:var(--nx-shadow);
}
.nx3-card h3{margin:0 0 7px;font-size:18px}
.nx3-card p{margin:0;color:var(--nx-muted);font-size:13px;line-height:1.55}
.nx3-icon{
  width:48px;height:48px;border-radius:16px;
  display:grid;place-items:center;
  background:rgba(109,124,255,.12);
  font-size:23px;margin-bottom:18px
}
.nx3-btn{
  border:0;border-radius:14px;padding:11px 15px;
  background:#1b2230;color:white;font-weight:700;
  cursor:pointer;margin-top:16px;
}
.nx3-btn.primary{background:var(--nx-accent)}
.nx3-btn.green{background:#168957}
.nx3-btn.danger{background:#8e2434}
.nx3-btn.ghost{background:transparent;border:1px solid var(--nx-line)}
.nx3-input{
  width:100%;box-sizing:border-box;
  border:1px solid var(--nx-line);
  background:#0b0f15;color:#fff;
  padding:13px 14px;border-radius:14px;
  outline:none;margin-top:10px
}
.nx3-list{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.nx3-row{
  display:flex;align-items:center;gap:12px;
  padding:12px;border:1px solid var(--nx-line);
  border-radius:16px;background:#0c1017
}
.nx3-avatar{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#6778ff,#8f52ff);
  font-weight:800;flex:none
}
.nx3-row-main{flex:1;min-width:0}
.nx3-row-main b{display:block;font-size:14px}
.nx3-row-main span{display:block;color:var(--nx-muted);font-size:12px;margin-top:3px}
.nx3-actions{display:flex;gap:6px}
.nx3-mini{
  border:0;background:#1b2230;color:#fff;
  border-radius:10px;padding:8px 10px;cursor:pointer
}
.nx3-online{width:8px;height:8px;border-radius:50%;background:#36d77d;display:inline-block;margin-right:5px}

.nx3-chat{
  display:grid;grid-template-columns:310px 1fr;
  min-height:610px;
  border:1px solid var(--nx-line);
  border-radius:24px;
  overflow:hidden;background:#0b0f15;
  box-shadow:var(--nx-shadow)
}
.nx3-chat-list{border-right:1px solid var(--nx-line);overflow:auto}
.nx3-chat-head{padding:18px;border-bottom:1px solid var(--nx-line);font-weight:800}
.nx3-chat-item{
  padding:14px 16px;display:flex;gap:11px;
  cursor:pointer;border-bottom:1px solid rgba(255,255,255,.035)
}
.nx3-chat-item:hover,.nx3-chat-item.active{background:#141a23}
.nx3-chat-body{display:flex;flex-direction:column;min-width:0}
.nx3-chat-top{padding:16px 18px;border-bottom:1px solid var(--nx-line);font-weight:800}
.nx3-messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:9px}
.nx3-msg{
  max-width:min(72%,520px);
  padding:10px 13px;border-radius:16px;
  background:#181e28;align-self:flex-start;
  font-size:14px;line-height:1.4
}
.nx3-msg.mine{align-self:flex-end;background:#5868ec}
.nx3-send{
  padding:13px;border-top:1px solid var(--nx-line);
  display:flex;gap:8px
}
.nx3-send input{margin:0;flex:1}

.nx3-game-tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-top:20px
}
.nx3-game-tab{
  padding:15px;border:1px solid var(--nx-line);
  border-radius:18px;background:#0e131b;color:white;
  cursor:pointer;text-align:left
}
.nx3-game-tab.active{border-color:#6676ff;background:#161c2b}
.nx3-coming{opacity:.65}

.nx3-ludo-wrap{
  margin-top:18px;
  display:grid;grid-template-columns:minmax(300px,760px) 300px;
  gap:16px;align-items:start
}
.nx3-board-shell{
  background:linear-gradient(145deg,#171c25,#0b0f15);
  border:1px solid var(--nx-line);
  border-radius:25px;padding:16px;
  box-shadow:var(--nx-shadow)
}
.nx3-board{
  position:relative;
  width:min(100%,650px);
  aspect-ratio:1;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  background:#e9e5dc;
  border-radius:12px;
  overflow:hidden;
  border:8px solid #211f1c;
  box-sizing:border-box
}
.nx3-cell{
  position:relative;
  border:1px solid rgba(0,0,0,.10);
  background:#f7f4ed;
}
.nx3-home{
  grid-column:1/7;grid-row:1/7;
  background:#e74d59;
  border:0;position:relative
}
.nx3-home.green{grid-column:10/16;grid-row:1/7;background:#42b96b}
.nx3-home.yellow{grid-column:10/16;grid-row:10/16;background:#f1c94a}
.nx3-home.blue{grid-column:1/7;grid-row:10/16;background:#4e86df}

.nx3-home-inner{
  position:absolute;inset:16%;
  background:#fff;border-radius:10px;
  display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:12px;padding:15px
}
.nx3-yard-token{
  border-radius:50%;
  background:var(--c);
  border:4px solid rgba(0,0,0,.12);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.35),0 3px 7px rgba(0,0,0,.2)
}
.nx3-track{
  grid-column:7/10;grid-row:1/16;
  background:#f7f4ed;
  display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(15,1fr);
}
.nx3-track-h{
  grid-column:1/16;grid-row:7/10;
  display:grid;grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(3,1fr);
  background:#f7f4ed
}
.nx3-center{
  grid-column:7/10;grid-row:7/10;
  background:conic-gradient(
    #42b96b 0 25%,
    #f1c94a 25% 50%,
    #4e86df 50% 75%,
    #e74d59 75% 100%
  );
  clip-path:polygon(50% 50%,0 0,100% 0,50% 50%,100% 100%,50% 50%,0 100%,50% 50%);
}
.nx3-path-red{background:#f7b4ba}
.nx3-path-green{background:#aee4bf}
.nx3-path-yellow{background:#f7e39b}
.nx3-path-blue{background:#b8cef4}
.nx3-start-red{background:#e74d59!important}
.nx3-start-green{background:#42b96b!important}
.nx3-start-yellow{background:#f1c94a!important}
.nx3-start-blue{background:#4e86df!important}

.nx3-piece{
  position:absolute;
  width:5.3%;
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  border:3px solid rgba(255,255,255,.85);
  box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.35);
  cursor:pointer;
  transition:left .35s ease,top .35s ease,transform .2s ease
}
.nx3-piece:hover{transform:translate(-50%,-50%) scale(1.12)}
.nx3-piece.selected{outline:3px solid white;outline-offset:3px}
.nx3-piece.red{background:#e74d59}
.nx3-piece.green{background:#42b96b}
.nx3-piece.yellow{background:#f1c94a}
.nx3-piece.blue{background:#4e86df}

.nx3-side{
  background:#10151d;border:1px solid var(--nx-line);
  border-radius:22px;padding:16px
}
.nx3-dice{
  width:76px;height:76px;border-radius:18px;
  background:#fff;color:#171717;
  display:grid;place-items:center;
  font-size:40px;font-weight:900;
  margin:12px auto
}
.nx3-turn{text-align:center;font-weight:800}
.nx3-player{
  padding:11px;border:1px solid var(--nx-line);
  border-radius:14px;margin-top:8px;
  display:flex;align-items:center;gap:9px
}
.nx3-player.you{border-color:#6676ff}
.nx3-chatbox{margin-top:14px;border-top:1px solid var(--nx-line);padding-top:13px}
.nx3-game-messages{height:130px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-size:12px}
.nx3-game-msg{background:#181e28;border-radius:9px;padding:7px 9px}
.nx3-voice{
  margin-top:12px;padding:12px;border:1px solid var(--nx-line);
  border-radius:15px;background:#0c1017
}
.nx3-voice-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:12px}

.nx3-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
  z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px
}
.nx3-modal-card{
  width:min(520px,100%);
  background:#10151d;border:1px solid var(--nx-line);
  border-radius:25px;padding:22px;box-shadow:0 30px 100px #000
}
.nx3-modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.nx3-close{float:right;background:transparent;border:0;color:#fff;font-size:23px;cursor:pointer}

@media(max-width:900px){
 .nx3-grid{grid-template-columns:1fr}
 .nx3-ludo-wrap{grid-template-columns:1fr}
 .nx3-chat{grid-template-columns:1fr}
 .nx3-chat-list{max-height:230px;border-right:0;border-bottom:1px solid var(--nx-line)}
}
@media(max-width:520px){
 .nx3-wrap{padding:12px}
 .nx3-game-tabs{grid-template-columns:1fr}
 .nx3-board-shell{padding:7px}
 .nx3-side{padding:12px}
}
</style>

<script>
(() => {
  const N = window.N = window.N || {};
  N.nx3 = N.nx3 || {};

  const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));

  const root = () => document.querySelector('#app') || document.body;

  function mount(html){
    let old=document.getElementById('nx3-root');
    if(old) old.remove();
    const el=document.createElement('div');
    el.id='nx3-root';
    el.innerHTML=html;
    root().appendChild(el);
    return el;
  }

  function modal(html){
    document.querySelector('.nx3-modal')?.remove();
    const m=document.createElement('div');
    m.className='nx3-modal';
    m.innerHTML=`<div class="nx3-modal-card">${html}</div>`;
    document.body.appendChild(m);
    m.addEventListener('click',e=>{
      if(e.target===m)m.remove();
    });
    return m;
  }

  function currentUser(){
    return N.user || N.currentUser || null;
  }

  async function supa(){
    return window.supabase || N.supabase || null;
  }

  N.nx3.chat = {
    conversations:[],
    current:null,
    channel:null
  };

  N.nx3.getConversations = async function(){
    try{
      if(typeof N.nexora_my_conversations === 'function')
        return await N.nexora_my_conversations();

      const sb=await supa();
      if(!sb) return [];
      const {data,error}=await sb.rpc('nexora_my_conversations');
      if(error) throw error;
      return data || [];
    }catch(e){
      console.error(e);
      return [];
    }
  };

  N.nx3.openChat = async function(){
    const el=mount(`
      <div class="nx3-wrap">
        <div class="nx3-title">Chat</div>
        <div class="nx3-sub">Messages, friends and activity in one place.</div>
        <div style="margin-top:18px" id="nx3-chat-root">
          <div class="nx3-chat">
            <div class="nx3-chat-list">
              <div class="nx3-chat-head">Chats</div>
              <div id="nx3-conversation-list"></div>
            </div>
            <div class="nx3-chat-body">
              <div class="nx3-chat-top" id="nx3-chat-title">Select a chat</div>
              <div class="nx3-messages" id="nx3-message-list">
                <div style="margin:auto;color:#7e8795">Choose a conversation to start chatting.</div>
              </div>
              <div class="nx3-send">
                <input id="nx3-message-input" class="nx3-input" placeholder="Write a message..." />
                <button class="nx3-btn primary" id="nx3-send-btn" style="margin:0">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `);

    await N.nx3.loadConversationList();

    el.querySelector('#nx3-send-btn').onclick=N.nx3.sendMessage;
    el.querySelector('#nx3-message-input').onkeydown=e=>{
      if(e.key==='Enter')N.nx3.sendMessage();
    };
  };

  N.nx3.loadConversationList = async function(){
    const list=document.getElementById('nx3-conversation-list');
    if(!list)return;

    const data=await N.nx3.getConversations();
    N.nx3.chat.conversations=data;

    if(!data.length){
      list.innerHTML=`
        <div style="padding:20px;color:#8f98a8;font-size:13px">
          No chats yet.<br><br>
          Use Connect to find someone.
        </div>`;
      return;
    }

    list.innerHTML=data.map((x,i)=>`
      <div class="nx3-chat-item" data-i="${i}">
        <div class="nx3-avatar">${esc((x.other_display_name||x.other_username||'?')[0].toUpperCase())}</div>
        <div class="nx3-row-main">
          <b>${esc(x.other_display_name||x.other_username)}</b>
          <span>
            ${x.other_online?'<i class="nx3-online"></i>Online':'Offline'}
            ${x.last_message?' · '+esc(x.last_message.slice(0,35)):''}
          </span>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.nx3-chat-item').forEach(row=>{
      row.onclick=()=>{
        const x=data[Number(row.dataset.i)];
        N.nx3.selectChat(x);
      };
    });
  };

  N.nx3.selectChat = async function(x){
    N.nx3.chat.current=x;
    const title=document.getElementById('nx3-chat-title');
    if(title)title.innerHTML=`
      ${esc(x.other_display_name||x.other_username)}
      <span style="color:${x.other_online?'#32d583':'#8f98a8'};font-size:11px">
        · ${x.other_online?'online':'offline'}
      </span>
    `;

    await N.nx3.loadMessages(x.conversation_id);

    const sb=await supa();
    if(sb){
      N.nx3.chat.channel?.unsubscribe?.();
      N.nx3.chat.channel=sb.channel('nx3-chat-'+x.conversation_id)
        .on('postgres_changes',{
          event:'INSERT',
          schema:'public',
          table:'messages',
          filter:`conversation_id=eq.${x.conversation_id}`
        }, payload=>{
          if(N.nx3.chat.current?.conversation_id===x.conversation_id)
            N.nx3.appendMessage(payload.new);
        }).subscribe();
    }
  };

  N.nx3.loadMessages = async function(conversationId){
    const box=document.getElementById('nx3-message-list');
    if(!box)return;

    try{
      const sb=await supa();
      if(!sb){box.innerHTML='';return}

      const {data,error}=await sb.from('messages')
        .select('*')
        .eq('conversation_id',conversationId)
        .order('created_at',{ascending:true});

      if(error)throw error;
      box.innerHTML='';
      (data||[]).forEach(N.nx3.appendMessage);
      box.scrollTop=box.scrollHeight;
    }catch(e){
      console.error(e);
      box.innerHTML='<div style="color:#8f98a8">Unable to load messages.</div>';
    }
  };

  N.nx3.appendMessage=function(m){
    const box=document.getElementById('nx3-message-list');
    if(!box)return;
    const me=currentUser();
    const myid=me?.id || me?.user?.id;
    const mine=m.sender_id===myid;
    const div=document.createElement('div');
    div.className='nx3-msg'+(mine?' mine':'');
    div.textContent=m.message;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
  };

  N.nx3.sendMessage = async function(){
    const input=document.getElementById('nx3-message-input');
    const text=input?.value.trim();
    const c=N.nx3.chat.current;
    if(!text||!c)return;

    try{
      const sb=await supa();
      const me=currentUser();
      const uid=me?.id || me?.user?.id;
      if(!sb||!uid)return;

      let conversationId=c.conversation_id;

      const {error}=await sb.from('messages').insert({
        conversation_id:conversationId,
        sender_id:uid,
        message:text,
        message_type:'text'
      });
      if(error)throw error;

      input.value='';
    }catch(e){
      console.error(e);
    }
  };

  N.nx3.openConnect = function(){
    mount(`
      <div class="nx3-wrap">
        <div class="nx3-title">Connect</div>
        <div class="nx3-sub">Talk to friends or meet someone new.</div>

        <div class="nx3-grid">
          <div class="nx3-card">
            <div class="nx3-icon">🎲</div>
            <h3>Connect with Random</h3>
            <p>Find an available person and choose chat or voice call.</p>
            <button class="nx3-btn primary" onclick="N.nx3.randomConnect('chat')">Chat</button>
            <button class="nx3-btn ghost" onclick="N.nx3.randomConnect('call')">Voice Call</button>
          </div>

          <div class="nx3-card">
            <div class="nx3-icon">🔎</div>
            <h3>Connect by Username</h3>
            <p>Search directly using an exact NEXORA username.</p>
            <input id="nx3-user-search" class="nx3-input" placeholder="@username">
            <button class="nx3-btn primary" onclick="N.nx3.searchUser()">Search</button>
            <div id="nx3-user-results"></div>
          </div>

          <div class="nx3-card">
            <div class="nx3-icon">👥</div>
            <h3>Friends</h3>
            <p>Friend requests, accepted friends and recent activity.</p>
            <button class="nx3-btn" onclick="N.nx3.openFriends()">Open Friends</button>
          </div>
        </div>
      </div>
    `);
  };

  N.nx3.searchUser=async function(){
    const input=document.getElementById('nx3-user-search');
    const box=document.getElementById('nx3-user-results');
    const q=input?.value.trim();
    if(!q)return;
    box.innerHTML='<div style="color:#8f98a8;padding-top:12px">Searching...</div>';

    try{
      const sb=await supa();
      const {data,error}=await sb.from('profiles')
        .select('id,username,display_name,avatar_url,online,last_seen')
        .ilike('username',q)
        .limit(8);
      if(error)throw error;

      if(!data?.length){
        box.innerHTML='<div style="color:#8f98a8;padding-top:12px">No user found.</div>';
        return;
      }

      box.innerHTML='<div class="nx3-list">'+data.map(u=>`
        <div class="nx3-row">
          <div class="nx3-avatar">${esc((u.display_name||u.username)[0].toUpperCase())}</div>
          <div class="nx3-row-main">
            <b>${esc(u.display_name||u.username)}</b>
            <span>@${esc(u.username)} · ${u.online?'Online':'Offline'}</span>
          </div>
          <div class="nx3-actions">
            <button class="nx3-mini" onclick="N.nx3.userAction('${esc(u.username)}','chat')">Chat</button>
            <button class="nx3-mini" onclick="N.nx3.userAction('${esc(u.username)}','call')">Call</button>
            <button class="nx3-mini" onclick="N.nx3.userAction('${esc(u.username)}','friend')">+</button>
          </div>
        </div>
      `).join('')+'</div>';
    }catch(e){
      console.error(e);
      box.innerHTML='<div style="color:#ff6d7d;padding-top:12px">Search failed.</div>';
    }
  };

  N.nx3.userAction=async function(username,type){
    try{
      if(type==='chat'){
        const sb=await supa();
        const {data,error}=await sb.rpc('nexora_get_or_create_dm',{
          target_username:username
        });
        if(error)throw error;
        await N.nx3.openChat();
        const list=N.nx3.chat.conversations||[];
        const found=list.find(x=>x.other_username?.toLowerCase()===username.toLowerCase());
        if(found)N.nx3.selectChat(found);
        return;
      }

      if(type==='call'){
        if(typeof N.callUser==='function')return N.callUser(username);
        const sb=await supa();
        await sb.rpc('nexora_start_call',{
          target_username:username,
          call_kind:'voice'
        });
        return;
      }

      if(type==='friend'){
        const sb=await supa();
        const me=currentUser();
        const uid=me?.id||me?.user?.id;
        const {data:target}=await sb.from('profiles')
          .select('id')
          .eq('username',username)
          .single();
        if(!target||!uid)return;
        await sb.from('friendships').insert({
          requester_id:uid,
          addressee_id:target.id,
          status:'pending'
        });
      }
    }catch(e){
      console.error(e);
    }
  };

  N.nx3.randomConnect=async function(mode){
    try{
      const sb=await supa();
      const me=currentUser();
      const uid=me?.id||me?.user?.id;
      if(!sb||!uid)return;

      const {data}=await sb.from('profiles')
        .select('username,display_name,online')
        .eq('online',true)
        .neq('id',uid)
        .limit(20);

      const candidates=data||[];
      if(!candidates.length){
        modal(`
          <button class="nx3-close" onclick="this.closest('.nx3-modal').remove()">×</button>
          <h3>No one available right now</h3>
          <p style="color:#8f98a8">Try again in a moment.</p>
        `);
        return;
      }

      const target=candidates[Math.floor(Math.random()*candidates.length)];

  N.nx3.startLudoLocal=function(mode='local',robotLevel=1){
    N.nx3.ludo={
      mode,
      robotLevel,
      players:[
        {color:'red',name:'You'},
        ...(mode==='robot'?[{color:'green',name:'Computer'}]:[])
      ],
      current:0,
      dice:0,
      pieces:{
        red:[-1,-1,-1,-1],
        green:[-1,-1,-1,-1],
        yellow:[-1,-1,-1,-1],
        blue:[-1,-1,-1,-1]
      },
      finished:{red:0,green:0,yellow:0,blue:0},
      selected:null,
      rolling:false
    };
    N.nx3.renderLudo();
  };

  N.nx3.ludoPath=[
    [6,1],[6,2],[6,3],[6,4],[6,5],[5,6],
    [4,6],[3,6],[2,6],[1,6],[0,6],
    [0,7],[0,8],[1,8],[2,8],[3,8],[4,8],
    [5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
    [7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],
    [9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
    [14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],
    [8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
    [7,0],[6,0]
  ];

  const safeCells=new Set([0,8,13,21,26,34,39,47]);

  function piecePos(color,index,step){
    const starts={red:0,green:13,yellow:26,blue:39};
    if(step<0){
      const homes={
        red:[[20,20],[80,20],[20,80],[80,80]],
        green:[[20,20],[80,20],[20,80],[80,80]],
        yellow:[[20,20],[80,20],[20,80],[80,80]],
        blue:[[20,20],[80,20],[20,80],[80,80]]
      };
      const pos=homes[color][index];
      const base={
        red:[16,16],green:[84,16],yellow:[84,84],blue:[16,84]
      }[color];
      return {
        left:base[0]+(pos[0]-50)*.28,
        top:base[1]+(pos[1]-50)*.28
      };
    }

    if(step>=56)return {left:50,top:50};

    const pathIndex=(starts[color]+step)%52;
    const p=N.nx3.ludoPath[pathIndex];
    return {
      left:(p[1]+.5)/15*100,
      top:(p[0]+.5)/15*100
    };
  }

  N.nx3.rollLudoDice=function(){
    const g=N.nx3.ludo;
    if(!g||g.rolling)return;

    g.rolling=true;
    let ticks=0;

    const timer=setInterval(()=>{
      g.dice=1+Math.floor(Math.random()*6);
      const d=document.getElementById('nx3-dice');
      if(d)d.textContent=g.dice;
      ticks++;
      if(ticks>=9){
        clearInterval(timer);
        g.rolling=false;
        N.nx3.renderLudo();
        N.nx3.handleAvailableMoves();
      }
    },70);
  };

  N.nx3.handleAvailableMoves=function(){
    const g=N.nx3.ludo;
    const color=g.players[g.current].color;
    const d=g.dice;

    const movable=g.pieces[color].map((s,i)=>{
      if(s<0)return d===6;
      return s+d<=57;
    }).map((x,i)=>x?i:-1).filter(x=>x>=0);

    if(!movable.length){
      setTimeout(()=>{
        g.dice=0;
        g.current=(g.current+1)%g.players.length;
        N.nx3.renderLudo();
        if(g.mode==='robot'&&g.current===1)setTimeout(N.nx3.robotTurn,500);
      },650);
      return;
    }

    if(g.mode==='robot'&&g.current===1){
      setTimeout(()=>N.nx3.robotMove(movable),450);
    }else if(movable.length===1){
      setTimeout(()=>N.nx3.moveLudoPiece(color,movable[0]),250);
    }else{
      movable.forEach(i=>{
        const selector=`#nx3-ludo-board .nx3-piece.${color}:nth-of-type(${i+1})`;
      });
    }
  };

  N.nx3.selectLudoPiece=function(color,index){
    const g=N.nx3.ludo;
    if(!g||g.rolling)return;
    if(g.players[g.current].color!==color)return;
    if(!g.dice)return;

    const step=g.pieces[color][index];
    if(step<0 && g.dice!==6)return;
    if(step>=0 && step+g.dice>57)return;

    N.nx3.moveLudoPiece(color,index);
  };

  N.nx3.moveLudoPiece=function(color,index){
    const g=N.nx3.ludo;
    const dice=g.dice;
    let step=g.pieces[color][index];

    if(step<0){
      if(dice!==6)return;
      step=0;
    }else{
      step+=dice;
    }

    g.pieces[color][index]=step;

    if(step>=57){
      g.finished[color]=(g.finished[color]||0)+1;
    }

    N.nx3.captureLudo(color,index);
    g.dice=0;

    if(g.finished[color]>=4){
      setTimeout(()=>{
        modal(`
          <h2>${esc(g.players[g.current].name)} wins! 🏆</h2>
          <p style="color:#8f98a8">All four tokens reached home.</p>
          <button class="nx3-btn primary" onclick="this.closest('.nx3-modal').remove();N.nx3.openGames()">Back to Games</button>
        `);
      },250);
      return;
    }

    if(dice!==6)g.current=(g.current+1)%g.players.length;

    N.nx3.renderLudo();

    if(g.mode==='robot'&&g.current===1)
      setTimeout(N.nx3.robotTurn,500);
  };

  N.nx3.captureLudo=function(color,index){
    const g=N.nx3.ludo;
    const step=g.pieces[color][index];
    if(step<0||step>=52)return;

    const starts={red:0,green:13,yellow:26,blue:39};
    const landing=(starts[color]+step)%52;

    if(safeCells.has(landing))return;

    Object.entries(g.pieces).forEach(([other,arr])=>{
      if(other===color)return;

      arr.forEach((s,i)=>{
        if(s<0||s>=52)return;
        const otherLanding=(starts[other]+s)%52;
        if(otherLanding===landing){
          g.pieces[other][i]=-1;
        }
      });
    });
  };

  N.nx3.robotTurn=function(){
    const g=N.nx3.ludo;
    if(!g||g.players[g.current]?.color!=='green')return;
    N.nx3.rollLudoDice();
  };

  N.nx3.robotMove=function(movable){
    const g=N.nx3.ludo;
    const color='green';
    let best=movable[0];

    const scores=movable.map(i=>{
      const s=g.pieces[color][i];
      let score=0;

      if(g.dice===6)score+=30;
      if(s<0)score+=18;
      if(s+g.dice>=57)score+=100;
      if(s>=0)score+=s*.8;

      Object.entries(g.pieces).forEach(([other,arr])=>{
        if(other===color)return;
        arr.forEach(os=>{
          if(os<0)return;
          const a=(13+s+g.dice)%52;
          const b=(({red:0,green:13,yellow:26,blue:39})[other]+os)%52;
          if(a===b&&!safeCells.has(a))score+=45;
        });
      });

      if(g.robotLevel>=4)score+=Math.random()*18;
      if(g.robotLevel>=6)score+=Math.random()*35;

      return {i,score};
    });

    scores.sort((a,b)=>b.score-a.score);
    best=scores[0].i;

    setTimeout(()=>N.nx3.moveLudoPiece(color,best),300);
  };

    b.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9000;border-radius:18px;box-shadow:0 10px 35px #0008';
    b.textContent='💬 Chat';

})();

<!-- NEXORA PART 2/2 — REALTIME ONLINE LUDO + MATCHMAKING + INVITES + CALL PRIORITY + ADVANCED ROBOT -->

<script>
(() => {
  const N=window.N=window.N||{};
  N.nx4=N.nx4||{};

  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));

  const sb=()=>window.supabase||N.supabase||null;
  const me=()=>N.user||N.currentUser||null;
  const uid=()=>me()?.id||me()?.user?.id||null;

  N.nx4.room=null;
  N.nx4.channel=null;
  N.nx4.matchChannel=null;
  N.nx4.callChannel=null;

  /*
    ROOM CREATION
  */

  N.nx4.createRoom=async function(gameType='ludo',maxPlayers=2){
    try{
      const s=sb(), id=uid();
      if(!s||!id)throw new Error('Not authenticated');

      const code='NX-'+Math.random().toString(36).slice(2,7).toUpperCase();

      const {data,error}=await s.from('game_rooms').insert({
        game_type:gameType,
        room_code:code,
        host_id:id,
        status:'waiting',
        max_players:maxPlayers
      }).select().single();

      if(error)throw error;

      await s.from('game_players').insert({
        room_id:data.id,
        user_id:id,
        player_number:1
      });

      N.nx4.room=data;
      await N.nx4.openOnlineRoom(data.id);
    }catch(e){
      console.error(e);
    }
  };

  N.nx4.openOnlineRoom=async function(roomId){
    const s=sb();
    if(!s)return;

    const {data:room,error}=await s.from('game_rooms')
      .select('*')
      .eq('id',roomId)
      .single();

    if(error)throw error;

    N.nx4.room=room;

    const {data:players}=await s.from('game_players')
      .select(`
        *,
        profiles:user_id(
          username,
          display_name,
          online
        )
      `)
      .eq('room_id',roomId)
      .order('player_number');

    N.nx4.players=players||[];

    N.nx4.renderRoom();

    N.nx4.channel?.unsubscribe?.();

    N.nx4.channel=s.channel('nx4-room-'+roomId)
      .on('postgres_changes',{
        event:'*',
        schema:'public',
        table:'game_players',
        filter:`room_id=eq.${roomId}`
      },()=>N.nx4.refreshRoom())
      .on('postgres_changes',{
        event:'UPDATE',
        schema:'public',
        table:'game_rooms',
        filter:`id=eq.${roomId}`
      },payload=>{
        N.nx4.room=payload.new;
        N.nx4.refreshRoom();
      })
      .subscribe();
  };

  N.nx4.refreshRoom=async function(){
    const s=sb();
    if(!s||!N.nx4.room)return;

    const {data}=await s.from('game_players')
      .select(`
        *,
        profiles:user_id(
          username,
          display_name,
          online
        )
      `)
      .eq('room_id',N.nx4.room.id)
      .order('player_number');

    N.nx4.players=data||[];
    N.nx4.renderRoom();
  };

  N.nx4.renderRoom=function(){
    const room=N.nx4.room;
    if(!room)return;

    const players=N.nx4.players||[];
    const started=room.status==='playing';

    const existing=document.getElementById('nx4-room-view');
    if(existing)existing.remove();

    const el=document.createElement('div');
    el.id='nx4-room-view';

    el.innerHTML=`
      <div class="nx3-wrap">
        <div class="nx3-title">${room.game_type==='ludo'?'Ludo':'Game Room'}</div>
        <div class="nx3-sub">Invite players and start when everyone is ready.</div>

        <div class="nx3-card" style="margin-top:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
            <div>
              <span style="color:#8f98a8;font-size:12px">Room code</span>
              <div style="font-size:25px;font-weight:900;letter-spacing:2px">
                ${esc(room.room_code)}
              </div>
            </div>
            <button class="nx3-btn ghost" style="margin:0"
              onclick="navigator.clipboard?.writeText('${esc(room.room_code)}')">
              Copy
            </button>
          </div>

          <div class="nx3-list">
            ${players.map((p,i)=>`
              <div class="nx3-row">
                <div class="nx3-avatar">
                  ${esc((p.profiles?.display_name||p.profiles?.username||'?')[0])}
                </div>
                <div class="nx3-row-main">
                  <b>${esc(p.profiles?.display_name||p.profiles?.username||'Player')}</b>
                  <span>${p.user_id===uid()?'You · ':''}${p.profiles?.online?'Online':'Offline'}</span>
                </div>
                <span style="color:#8f98a8">Player ${i+1}</span>
              </div>
            `).join('')}
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:17px">
            <button class="nx3-btn primary" style="margin:0"
              onclick="N.nx4.inviteRoomPlayers()">
              Invite
            </button>

            <button class="nx3-btn" style="margin:0"
              onclick="N.nx4.startOnlineRoom()"
              ${room.host_id!==uid()||players.length<2||started?'disabled':''}>
              ${started?'Match Started':'Start Match'}
            </button>

            <button class="nx3-btn ghost" style="margin:0"
              onclick="N.nx4.leaveRoom()">
              Leave
            </button>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(el);
  };

  N.nx4.joinRoom=async function(code){
    try{
      const s=sb(), id=uid();
      if(!s||!id)return;

      const {data:room,error}=await s.from('game_rooms')
        .select('*')
        .eq('room_code',code.trim().toUpperCase())
        .eq('status','waiting')
        .single();

      if(error)throw error;

      const {data:existing}=await s.from('game_players')
        .select('*')
        .eq('room_id',room.id)
        .eq('user_id',id)
        .maybeSingle();

      if(!existing){
        const {count}=await s.from('game_players')
          .select('*',{count:'exact',head:true})
          .eq('room_id',room.id);

        if((count||0)>=room.max_players)
          throw new Error('Room is full');

        await s.from('game_players').insert({
          room_id:room.id,
          user_id:id,
          player_number:(count||0)+1
        });
      }

      await N.nx4.openOnlineRoom(room.id);
    }catch(e){
      console.error(e);
      alert(e.message||'Unable to join room');
    }
  };

  N.nx4.startOnlineRoom=async function(){
    const s=sb(),room=N.nx4.room;
    if(!s||!room||room.host_id!==uid())return;

    const players=N.nx4.players||[];
    if(players.length<2)return;

    const {error}=await s.from('game_rooms')
      .update({
        status:'playing',
        started_at:new Date().toISOString()
      })
      .eq('id',room.id);

    if(error)console.error(error);
    else await N.nx4.startOnlineLudo(room.id);
  };

  /*
    REALTIME LUDO STATE
  */

  N.nx4.startOnlineLudo=async function(roomId){
    const s=sb();
    if(!s)return;

    const colors=['red','green','yellow','blue'];

    const {data:players}=await s.from('game_players')
      .select('*')
      .eq('room_id',roomId)
      .order('player_number');

    const patch={};

    for(let i=0;i<(players||[]).length;i++){
      await s.from('game_players')
        .update({
          player_color:colors[i],
          is_ready:true,
          is_connected:true,
          last_seen:new Date().toISOString()
        })
        .eq('room_id',roomId)
        .eq('user_id',players[i].user_id);
    }

    const state={
      pieces:{
        red:[-1,-1,-1,-1],
        green:[-1,-1,-1,-1],
        yellow:[-1,-1,-1,-1],
        blue:[-1,-1,-1,-1]
      },
      currentTurn:0,
      dice:0,
      winner:null,
      lastMove:null,
      version:1
    };

    await s.from('game_rooms')
      .update({
        game_state:state,
        current_turn:players[0]?.user_id||null,
        winner_id:null,
        updated_at:new Date().toISOString()
      })
      .eq('id',roomId);

    N.nx4.subscribeGame(roomId);
  };

  N.nx4.subscribeGame=function(roomId){
    const s=sb();
    if(!s)return;

    N.nx4.matchChannel?.unsubscribe?.();

    N.nx4.matchChannel=s.channel('nx4-match-'+roomId)
      .on('postgres_changes',{
        event:'UPDATE',
        schema:'public',
        table:'game_rooms',
        filter:`id=eq.${roomId}`
      },payload=>{
        N.nx4.room=payload.new;

        if(payload.new.status==='playing')
          N.nx4.renderRealtimeLudo(payload.new);
      })
      .on('postgres_changes',{
        event:'UPDATE',
        schema:'public',
        table:'game_players',
        filter:`room_id=eq.${roomId}`
      },()=>N.nx4.refreshRoom())
      .subscribe();
  };

  N.nx4.renderRealtimeLudo=function(room){
    const state=room.game_state;
    if(!state)return;

    const players=N.nx4.players||[];
    const mePlayer=players.find(p=>p.user_id===uid());

    mount(`
      <div class="nx3-wrap">
        <div class="nx3-title">Ludo</div>
        <div class="nx3-sub">
          ${state.winner?'Match finished':'Live match · '+(state.currentTurn===uid()?'Your turn':'Waiting for opponent')}
        </div>

        <div class="nx3-ludo-wrap">
          <div class="nx3-board-shell">
            <div class="nx3-board" id="nx4-live-board">
              <div class="nx3-home"></div>
              <div class="nx3-home green"></div>
              <div class="nx3-home yellow"></div>
              <div class="nx3-home blue"></div>
              <div class="nx3-track" id="nx4-vtrack"></div>
              <div class="nx3-track-h" id="nx4-htrack"></div>
              <div class="nx3-center"></div>
            </div>
          </div>

          <div class="nx3-side">
            <div class="nx3-turn">
              ${state.winner
                ? '🏆 Match Complete'
                : state.currentTurn===uid()
                  ? 'Your Turn'
                  : 'Opponent Turn'}
            </div>

            <div class="nx3-dice">${state.dice||'•'}</div>

            <button class="nx3-btn primary" style="width:100%;margin-top:4px"
              onclick="N.nx4.rollOnlineDice()"
              ${state.currentTurn!==uid()||state.dice?'disabled':''}>
              Roll Dice
            </button>

            <div style="margin-top:15px;font-weight:800">Players</div>
            ${players.map(p=>`
              <div class="nx3-player ${p.user_id===uid()?'you':''}">
                <span class="nx3-online"></span>
                <span style="flex:1">
                  ${esc(p.user_id===uid()?'You':p.profiles?.display_name||p.profiles?.username||'Player')}
                </span>
                <b>${esc(p.player_color||'')}</b>
              </div>
            `).join('')}

            <div class="nx3-voice">
              <b>Voice controls</b>
              ${players.map(p=>`
                <div class="nx3-voice-row">
                  <span>${esc(p.user_id===uid()?'You':p.profiles?.display_name||'Player')}</span>
                  <button class="nx3-mini"
                    onclick="N.nx4.togglePlayerHear('${p.user_id}',this)">
                    🔊
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `);

    const vt=document.getElementById('nx4-vtrack');
    const ht=document.getElementById('nx4-htrack');

    if(vt)vt.innerHTML=Array.from({length:45},()=>'<div class="nx3-cell"></div>').join('');
    if(ht)ht.innerHTML=Array.from({length:45},()=>'<div class="nx3-cell"></div>').join('');

    N.nx4.renderOnlinePieces(room);
  };

  N.nx4.renderOnlinePieces=function(room){
    const board=document.getElementById('nx4-live-board');
    if(!board)return;

    const state=room.game_state;
    const starts={red:0,green:13,yellow:26,blue:39};

    Object.entries(state.pieces||{}).forEach(([color,pieces])=>{
      pieces.forEach((step,index)=>{
        if(step<0)return;

        const p=document.createElement('button');
        p.className='nx3-piece '+color;

        if(step>=57){
          p.style.left='50%';
          p.style.top='50%';
        }else{
          const path=N.nx3.ludoPath;
          const pi=(starts[color]+step)%52;
          const cell=path[pi];
          p.style.left=((cell[1]+.5)/15*100)+'%';
          p.style.top=((cell[0]+.5)/15*100)+'%';
        }

        p.onclick=()=>N.nx4.selectOnlinePiece(color,index);
        board.appendChild(p);
      });
    });
  };

  N.nx4.rollOnlineDice=async function(){
    const s=sb(),room=N.nx4.room;
    if(!s||!room)return;

    const state=room.game_state||{};
    if(room.current_turn!==uid())return;
    if(state.dice)return;

    const dice=1+Math.floor(Math.random()*6);
    state.dice=dice;
    state.version=(state.version||0)+1;

    await s.from('game_rooms')
      .update({
        game_state:state,
        updated_at:new Date().toISOString()
      })
      .eq('id',room.id)
      .eq('current_turn',uid());
  };

  N.nx4.selectOnlinePiece=async function(color,index){
    const s=sb(),room=N.nx4.room;
    if(!s||!room)return;

    const state=room.game_state||{};
    if(room.current_turn!==uid())return;

    const player=N.nx4.players?.find(p=>p.user_id===uid());
    if(!player||player.player_color!==color)return;

    const dice=state.dice;
    if(!dice)return;

    const old=state.pieces[color][index];

    if(old<0&&dice!==6)return;
    if(old>=0&&old+dice>57)return;

    const next=old<0?0:old+dice;
    state.pieces[color][index]=next;

    N.nx4.applyOnlineCapture(state,color,index);

    const won=state.pieces[color].every(x=>x>=57);

    state.dice=0;
    state.lastMove={
      user_id:uid(),
      color,
      index,
      from:old,
      to:next,
      at:Date.now()
    };

    if(won){
      state.winner=uid();

      await s.from('game_rooms').update({
        game_state:state,
        winner_id:uid(),
        status:'finished',
        finished_at:new Date().toISOString(),
        updated_at:new Date().toISOString()
      }).eq('id',room.id);

      return;
    }

    if(dice!==6){
      const players=N.nx4.players||[];
      const pos=players.findIndex(p=>p.user_id===uid());
      const nextPlayer=players[(pos+1)%players.length];
      room.current_turn=nextPlayer.user_id;
    }

    state.version=(state.version||0)+1;

    await s.from('game_rooms').update({
      game_state:state,
      current_turn:room.current_turn,
      updated_at:new Date().toISOString()
    }).eq('id',room.id);
  };

  N.nx4.applyOnlineCapture=function(state,color,index){
    const starts={red:0,green:13,yellow:26,blue:39};
    const safe=new Set([0,8,13,21,26,34,39,47]);

    const step=state.pieces[color][index];
    if(step<0||step>=52)return;

    const landing=(starts[color]+step)%52;
    if(safe.has(landing))return;

    Object.entries(state.pieces).forEach(([other,pieces])=>{
      if(other===color)return;

      pieces.forEach((s,i)=>{
        if(s<0||s>=52)return;

        const otherLanding=(starts[other]+s)%52;

        if(otherLanding===landing){
          state.pieces[other][i]=-1;
        }
      });
    });
  };

  /*
    MATCHMAKING
  */

  N.nx4.autoMatch=async function(){
    const s=sb(),id=uid();
    if(!s||!id)return;

    try{
      const {data:rooms}=await s.from('game_rooms')
        .select('*')
        .eq('game_type','ludo')
        .eq('status','waiting')
        .neq('host_id',id)
        .order('created_at',{ascending:true})
        .limit(10);

      for(const room of rooms||[]){
        const {count}=await s.from('game_players')
          .select('*',{count:'exact',head:true})
          .eq('room_id',room.id);

        if((count||0)<room.max_players){
          await N.nx4.joinRoom(room.room_code);
          return;
        }
      }

      await N.nx4.createRoom('ludo',2);
    }catch(e){
      console.error(e);
    }
  };

  /*
    FRIEND / USERNAME PRIORITY
  */

  N.nx4.priorityConnect=async function(type,targetUsername=null){
    if(targetUsername){
      await N.nx3.userAction(targetUsername,'chat');
      return;
    }

    if(type==='random'){
      await N.nx3.randomConnect('chat');
    }
  };

  /*
    GAME INVITES
  */

  N.nx4.sendInvite=async function(targetUserId,roomId){
    const s=sb(),id=uid();
    if(!s||!id)return;

    await s.from('notifications').insert({
      user_id:targetUserId,
      type:'game_invite',
      title:'Ludo invitation',
      body:'You have been invited to join a Ludo match.',
      data:{
        room_id:roomId,
        game_type:'ludo',
        from:id
      }
    });
  };

  N.nx4.inviteRoomPlayers=async function(){
    const room=N.nx4.room;
    if(!room)return;

    const el=document.createElement('div');
    el.className='nx3-modal';

    el.innerHTML=`
      <div class="nx3-modal-card">
        <button class="nx3-close" onclick="this.closest('.nx3-modal').remove()">×</button>
        <h2>Invite players</h2>
        <p style="color:#8f98a8">Send the room to friends or share the code.</p>

        <div class="nx3-card" style="margin-top:12px">
          <b>${esc(room.room_code)}</b>
          <button class="nx3-btn ghost" style="display:block"
            onclick="navigator.clipboard?.writeText('${esc(room.room_code)}')">
            Copy Room Code
          </button>
        </div>

        <input id="nx4-invite-user" class="nx3-input" placeholder="@username">
        <button class="nx3-btn primary" onclick="N.nx4.inviteByUsername()">
          Send Invite
        </button>
      </div>
    `;

    document.body.appendChild(el);
  };

  N.nx4.inviteByUsername=async function(){
    const username=document.getElementById('nx4-invite-user')?.value.trim();
    if(!username)return;

    try{
      const s=sb();
      const {data:user}=await s.from('profiles')
        .select('id')
        .eq('username',username.replace(/^@/,''))
        .single();

      if(!user)throw new Error('User not found');

      await N.nx4.sendInvite(user.id,N.nx4.room.id);
      document.querySelector('.nx3-modal')?.remove();
    }catch(e){
      console.error(e);
    }
  };

  /*
    GLOBAL CALL PRIORITY
  */

  N.nx4.startGlobalCallListener=function(){
    const s=sb(),id=uid();
    if(!s||!id)return;

    N.nx4.callChannel?.unsubscribe?.();

    N.nx4.callChannel=s.channel('nx4-global-call-'+id)
      .on('postgres_changes',{
        event:'INSERT',
        schema:'public',
        table:'calls',
        filter:`receiver_id=eq.${id}`
      },payload=>{
        if(payload.new.status==='ringing')
          N.nx4.showIncomingCall(payload.new);
      })
      .subscribe();
  };

  N.nx4.showIncomingCall=function(call){
    document.getElementById('nx4-incoming-call')?.remove();

    const box=document.createElement('div');
    box.id='nx4-incoming-call';
    box.style.cssText=`
      position:fixed;
      top:16px;
      left:50%;
      transform:translateX(-50%);
      z-index:100000;
      width:min(420px,calc(100% - 24px));
      background:#10151d;
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      padding:16px;
      box-shadow:0 25px 80px #000;
      backdrop-filter:blur(20px)
    `;

    box.innerHTML=`
      <div style="font-weight:900;font-size:17px">Incoming ${call.call_type==='video'?'video':'voice'} call</div>
      <div style="color:#8f98a8;font-size:13px;margin-top:4px">
        Someone is calling you
      </div>

      <div style="display:flex;gap:8px;margin-top:13px">
        <button class="nx3-btn green" style="flex:1;margin:0"
          onclick="N.nx4.acceptCall('${call.id}')">
          Answer
        </button>
        <button class="nx3-btn danger" style="flex:1;margin:0"
          onclick="N.nx4.rejectCall('${call.id}')">
          Decline
        </button>
      </div>
    `;

    document.body.appendChild(box);
  };

  N.nx4.acceptCall=async function(callId){
    const s=sb();
    if(!s)return;

    await s.from('calls')
      .update({
        status:'accepted',
        started_at:new Date().toISOString()
      })
      .eq('id',callId);

    document.getElementById('nx4-incoming-call')?.remove();

    if(typeof N.acceptCall==='function')
      N.acceptCall(callId);
  };

  N.nx4.rejectCall=async function(callId){
    const s=sb();
    if(!s)return;

    await s.from('calls')
      .update({status:'declined'})
      .eq('id',callId);

    document.getElementById('nx4-incoming-call')?.remove();
  };

  /*
    VOICE AUDIENCE CONTROLS
  */

  N.nx4.togglePlayerHear=function(playerId,button){
    const muted=button.classList.toggle('nx3-muted');
    button.textContent=muted?'🔇':'🔊';

    N.nx4.voicePermissions=N.nx4.voicePermissions||{};
    N.nx4.voicePermissions[playerId]=!muted;
  };

  N.nx4.setOutgoingAudience=async function(roomId,allowedUserIds){
    const s=sb(),id=uid();
    if(!s||!id)return;

    try{
      await s.from('game_voice_permissions')
        .delete()
        .eq('room_id',roomId)
        .eq('speaker_id',id);

      if(!allowedUserIds?.length)return;

      await s.from('game_voice_permissions').insert(
        allowedUserIds.map(receiver_id=>({
          room_id:roomId,
          speaker_id:id,
          receiver_id,
          can_hear:true
        }))
      );
    }catch(e){
      console.error(e);
    }
  };

  /*
    ADAPTIVE COMPUTER
    Higher levels evaluate:
    - getting a token out
    - finishing
    - captures
    - safe positions
    - blocking
    - token concentration
    - danger
    - progress
    - randomization at lower levels
  */

  N.nx4.robotScoreMove=function(state,color,index,dice,level){
    const pieces=state.pieces;
    const old=pieces[color][index];
    const next=old<0?0:old+dice;

    if(old<0&&dice!==6)return -Infinity;
    if(old>=0&&next>57)return -Infinity;

    let score=0;

    score+=next*1.2;

    if(old<0)score+=level>=2?30:12;
    if(next>=57)score+=180;
    else if(next>=52)score+=45;

    const starts={red:0,green:13,yellow:26,blue:39};
    const safe=new Set([0,8,13,21,26,34,39,47]);

    if(next<52){
      const landing=(starts[color]+next)%52;

      if(safe.has(landing))
        score+=level>=3?28:8;

      Object.entries(pieces).forEach(([other,arr])=>{
        if(other===color)return;

        arr.forEach(os=>{
          if(os<0||os>=52)return;

          const p=(starts[other]+os)%52;

          if(p===landing&&!safe.has(landing))
            score+=level>=2?85:20;

          const distance=(p-landing+52)%52;

          if(level>=4&&distance>0&&distance<=6)
            score-=30/distance;
        });
      });

      if(level>=5){
        const same=pieces[color].filter((s,i)=>i!==index&&s>=0&&s<52);
        same.forEach(s=>{
          const a=(starts[color]+s)%52;
          if(Math.abs(a-landing)<=1)score+=18;
        });
      }

      if(level>=6){
        score+=Math.random()*6;
      }
    }

    return score;
  };

  /*
    START SERVICES WITHOUT TOUCHING HOME
  */

  N.nx4.startServices=function(){
    try{
      if(uid()){
        N.nx4.startGlobalCallListener();
      }
    }catch(e){
      console.error(e);
    }
  };

  N.nx4.startServices();

  /*
    OPTIONAL CLEAN ENTRY BUTTONS.
    These are only added if the existing navigation has matching elements.
  */

  function wire(id,fn){
    const el=document.getElementById(id);
    if(el)el.onclick=fn;
  }

  wire('chatBtn',N.nx3.openChat);
  wire('messagesBtn',N.nx3.openChat);
  wire('connectBtn',N.nx3.openConnect);
  wire('gamesBtn',N.nx3.openGames);

  /*
    Keep the existing Home page intact.
    Only expose the new sections when explicitly opened.
  */

  window.NEXORA_OPEN_CHAT=()=>N.nx3.openChat();
  window.NEXORA_OPEN_CONNECT=()=>N.nx3.openConnect();
  window.NEXORA_OPEN_GAMES=()=>N.nx3.openGames();

})();
</script>
