 try{if(!cid){const{data,error}=await sb.rpc("nexora_get_or_create_dm",{target_username:un});if(error)throw error;cid=data}}catch(_){return toast("Chat nahi khul payi")}
 stopChat();if(S.room)closeRoom(true);S.chat={cid,oid,un,name,seen:new Set()};S.page="chat";
 $("main").innerHTML=`<section class="pg chat"><div class="ch"><button class="ib" onclick="go('recent')" aria-label="Back">${I.back}</button><div class="av">${esc(ini(name))}</div><div style="flex:1;min-width:0"><b>${esc(name)}</b><div class="pw" style="text-align:left">@${esc(un)}</div></div><button class="ib" style="color:#8ff0bd" onclick="voiceBtn('${oid}','${esc(name).replace(/'/g,"")}')" aria-label="Voice call">${I.phone}</button><button class="ib" style="color:#c9a8ff" onclick="inviteGame('${oid}','${esc(name).replace(/'/g,"")}')" aria-label="Invite to game">${I.game}</button></div>
 <div id="cb" class="cb"></div><div class="cp"><button class="ib" style="height:50px;width:46px" onclick="emoBar()" aria-label="Emoji">😊</button><input id="ci" placeholder="Write a message" autocomplete="off" maxlength="2000" enterkeyhint="send"><button class="snd" onclick="sendMsg()" aria-label="Send">${I.send}</button></div></section>`;
 $("ci").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMsg()}});
 await fetchNew(true);if(S.chat?.cid!==cid)return;
 S.cch=sb.channel("chat-"+cid).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+cid},p=>{if(p.new.sender_id!==S.user.id)addMsg(p.new)}).subscribe()}
async function fetchNew(first){const c=S.chat;if(!c)return;const{data}=await sb.from("messages").select("*").eq("conversation_id",c.cid).order("created_at",{ascending:true}).limit(300);
 if(S.chat!==c)return;(data||[]).forEach(m=>{if(first||m.sender_id!==S.user.id)addMsg(m,first)})}
function addBubble(m,meta){const b=$("cb");if(!b)return null;const mine=m.sender_id===S.user.id;b.insertAdjacentHTML("beforeend",`<div class="m ${mine?"me":"th"}">${esc(m.message)}<small>${meta}</small></div>`);b.scrollTop=b.scrollHeight;return b.lastElementChild}
function addMsg(m,quiet){const c=S.chat;if(!c||c.seen.has(m.id))return;c.seen.add(m.id);const mine=m.sender_id===S.user.id;addBubble(m,tm(m.created_at)+(mine?" ✓✓":""));if(!mine&&!quiet)sfx("recv")}
function sendMsg(){const i=$("ci"),text=i.value.trim().slice(0,2000);if(!text||!S.chat)return;i.value="";sfx("send");
 const cid=S.chat.cid,el=addBubble({sender_id:S.user.id,message:text},"🕓 Sending…");
 const go_=async()=>{try{const{data,error}=await Promise.race([sb.from("messages").insert({conversation_id:cid,sender_id:S.user.id,message:text,message_type:"text"}).select().single(),sleep(15000).then(()=>({error:{message:"timeout"}}))]);if(error)throw error;S.chat?.seen.add(data.id);el.classList.remove("fail");el.querySelector("small").textContent=tm(data.created_at)+" ✓✓"}
  catch(_){el.classList.add("fail");const s=el.querySelector("small");s.innerHTML="⚠ Not sent · <u>Retry</u>";s.querySelector("u").onclick=()=>{s.textContent="🕓 Sending…";go_()}}};go_()}

 sb.from("notifications").update({is_read:true}).eq("user_id",S.user.id).eq("is_read",false).then(()=>$("bdot").classList.add("h"),()=>{})};

/* matchmaking (presence pairing) for chat / call / ttt */
let RM=null;const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().padStart(6,"0").slice(0,6)};
function stopRM(){if(!RM)return;clearTimeout(RM.to);clearTimeout(RM.wt);try{sb.removeChannel(RM.ch)}catch(_){}RM=null}
const TTL={chat:"Random chat",call:"Random call",ttt:"Tic-Tac-Toe"};
async function matchmake(kind){stopRM();if(S.room)closeRoom(true);
 if(kind==="call"){if(C)return toast("Pehle current call khatam karo");try{(await mic()).getTracks().forEach(t=>t.stop())}catch(e){return toast(e.message)}}
 const R=RM={kind,done:false};openModal(`<h3>${TTL[kind]}</h3><p class="sub">Looking for someone who is searching too…</p><div id="rmN" style="text-align:center;font-weight:900;font-size:18px;margin:18px 0">Searching…</div><button class="btn red wide" onclick="closeModal()">Cancel</button>`,()=>{if(RM===R)stopRM()});
 const ch=R.ch=sb.channel("nx-mm-"+kind,{config:{presence:{key:S.user.id}}}),me={id:S.user.id,name:myName(),un:S.me?.username||"",t:Date.now()};
 ch.on("presence",{event:"sync"},()=>{if(RM!==R||R.done)return;const seen={};Object.values(ch.presenceState()).flat().forEach(x=>{if(x?.id)seen[x.id]=x});
  const l=Object.values(seen).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1)),i=l.findIndex(x=>x.id===me.id);if(i<0)return;const j=i%2?i-1:i+1;if(j>=l.length)return;
  R.done=true;const o=l[j];sfx("match");vib([60,40,60]);$("rmN")&&($("rmN").textContent="Match found!");
  setTimeout(()=>{if(RM!==R)return;const host=i<j;
   if(kind==="chat"){stopRM();closeModal();openChat("",o.id,o.un,o.name)}
   else if(kind==="call"){if(host){stopRM();closeModal();startCall(o.id,o.name,true)}else R.wt=setTimeout(()=>{if(RM===R){stopRM();closeModal();toast("Match connect nahi hua. Dobara try karo")}},20000)}
   else if(kind==="ludo"){const code=hash("L"+[me.id,o.id].sort().join(""));stopRM();closeModal();host?hostLudo(code,o):openLR(code,false,o)}
   else{const code=hash([me.id,o.id].sort().join(""));stopRM();closeModal();host?hostTTT(code,o):openRoom(code,false,o)}},700)});
 await new Promise(r=>{ch.subscribe(s=>{if(s==="SUBSCRIBED")r()});setTimeout(r,6000)});try{await ch.track(me)}catch(_){}
 R.to=setTimeout(()=>{if(RM===R&&!R.done){stopRM();openModal(`<h3>Koi nahi mila 😕</h3><p class="sub">Abhi koi aur search nahi kar raha.</p>${kind==="ttt"?`<button class="btn pri wide" style="margin-bottom:10px" onclick="startG('bot')">🤖 Robot ke saath khelo</button>`:""}<button class="btn wide" style="margin-bottom:10px" onclick="closeModal();matchmake('${kind}')">🔄 Dobara dhoondho</button><button class="btn wide" onclick="closeModal()">Band karo</button>`)}},60000)}
const strangerGone=()=>openModal(`<h3>Stranger disconnected</h3><p class="sub">Call khatam ho gayi.</p><button class="btn pri wide" style="margin-bottom:10px" onclick="closeModal();matchmake('call')">🔄 Find another</button><button class="btn wide" onclick="closeModal()">Band karo</button>`);

/* ---------- games ---------- */
function renderGames(){const g=(i,n,d,a,soon)=>`<button class="card qc" style="${soon?"opacity:.6":""}" onclick="${a}"><span class="i">${i}</span><span><b>${n}</b><small>${d}</small></span></button>`;
 page(`<h2>Games</h2><p class="sub">Play while you talk. Voice call game ke upar mini bar me chalta rehta hai.</p>
 <div class="card" style="padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:14px"><b style="flex:1">⚡ Quick match · Tic-Tac-Toe</b><button class="btn pri" style="min-height:42px" onclick="matchmake('ttt')">Find player</button></div>
 <div class="grid">${g("❌","Tic-Tac-Toe","Live · 5×5, four wins","tttMenu()")}${g("🎲","Ludo","Live · 2-4 players","ludoMenu()")}${g("🃏","UNO","Next update","toast('UNO agle update me aa raha hai')",1)}${g("⚫","Carrom","Coming soon","toast('Carrom coming soon')",1)}${g("♞","Chess","Coming soon","toast('Chess coming soon')",1)}</div>`)}
function tttMenu(){const s=t=>`<div class="pw" style="text-align:left;margin:14px 0 6px 4px">${t}</div>`;
 openModal(`<h3>❌ Tic-Tac-Toe</h3><p class="sub">5×5 board. Line up four to win.</p>${s("🌐 Random online")}<button class="btn pri wide" onclick="closeModal();matchmake('ttt')">Find player</button>
 ${s("👥 Friend ke saath (Connect → Game, ya room code)")}<button class="btn wide" onclick="hostTTT()">Room banao</button><div style="display:flex;gap:8px;margin-top:8px"><input id="rc2" style="margin:0;flex:1;text-transform:uppercase" maxlength="6" placeholder="Room code"><button class="btn" onclick="joinTTT($('rc2').value.trim().toUpperCase())">Join</button></div>
 ${s("🤖 Robot / 📱 ek phone")}<div class="grid"><button class="btn" onclick="startG('bot')">Robot</button><button class="btn" onclick="startG('local')">2 players</button></div>`)}
function lineWin(b,L=4,N=5){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=b[r*N+c];if(!v)continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;for(;k<L;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=N||x<0||x>=N||b[y*N+x]!==v)break}if(k===L)return{v,cells:Array.from({length:L},(_,i)=>(r+dr*i)*N+c+dc*i)}}}return null}
function startG(mode){closeModal();minCall(true);S.page="ttt";S.g={mode,b:Array(25).fill(""),t:"X",over:false,last:-1,msg:mode==="bot"?"Aapki baari (X)":"X ki baari"};draw()}
function draw(){const g=S.g;if(!g||S.page!=="ttt")return;const on=g.mode==="online",w=lineWin(g.b);
 const foot=on?(g.over?`<div class="grid" style="max-width:420px;margin:18px auto 0"><button class="btn pri" ${S.room?.left?"disabled":""} onclick="rematch()">${g.rem?"⏳ Waiting…":"🔁 Rematch"}</button><button class="btn" onclick="leaveG();matchmake('ttt')">⚡ New match</button></div>`:""):`<button class="btn pri wide" style="margin:18px auto 0;display:block;max-width:420px" onclick="startG('${g.mode}')">Restart</button>`;
 $("main").innerHTML=`<section class="pg"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn" onclick="leaveG()">‹ Games</button><span style="flex:1"></span>${on?`<button class="ib" onclick="emoPop()" aria-label="Reactions">😀</button>`:""}${on&&S.room?.oppId?`<button class="ib" style="color:#8ff0bd" onclick="voiceBtn('${S.room.oppId}','${esc(S.room.oppName).replace(/'/g,"")}')" aria-label="Voice">${I.mic}</button>`:""}</div><h2>Tic-Tac-Toe</h2><p class="sub">${esc(g.msg)}</p>
 <div class="bd">${g.b.map((v,i)=>`<button class="cell ${v}${i===g.last?" n":""}${w?.cells.includes(i)?" w":""}" onclick="tap(${i})" aria-label="Cell ${i+1}">${v}</button>`).join("")}</div>${foot}</section>`}
function leaveG(){closeRoom(true);S.g=null;go("games")}
function place(i){const g=S.g;g.b[i]=g.t;g.last=i;sfx("move");const w=lineWin(g.b);
 if(w){g.over=true;g.msg=g.mode==="bot"?(w.v==="X"?"Aap jeet gaye! 🏆":"Robot jeet gaya 🤖"):w.v+" jeet gaya! 🏆";sfx(g.mode==="bot"&&w.v==="O"?"lose":"win");vib([60,40,60])}
 else if(g.b.every(Boolean)){g.over=true;g.msg="Draw"}else{g.t=g.t==="X"?"O":"X";g.msg=g.mode==="bot"?(g.t==="X"?"Aapki baari (X)":"Robot soch raha hai…"):g.t+" ki baari"}draw()}
let tapT=0;function tap(i){const g=S.g;if(!g||g.over||g.b[i])return;
 if(g.mode==="online"){const R=S.room,G=R?.G;if(!G||G.over||R.left||G.t!==g.me||Date.now()-tapT<400)return;tapT=Date.now();vib(10);sfx("move");R.host?hostMove(R,i,G.seq,g.me):R.tx({t:"mv",i,s:G.seq});return}
 if(g.mode==="bot"&&g.t!=="X")return;place(i);if(g.mode==="bot"&&!g.over)setTimeout(bot,650)}
function score(b,i,sym){const r=Math.floor(i/5),c=i%5,opp=sym==="X"?"O":"X";let s=0;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]])for(let k=0;k<4;k++){let own=0,bad=false;for(let j=0;j<4;j++){const y=r+dr*(j-k),x=c+dc*(j-k);if(y<0||y>4||x<0||x>4){bad=true;break}const v=b[y*5+x];if(v===opp){bad=true;break}if(v===sym)own++}if(!bad)s+=[1,3,9,40][own]}return s}
function bot(){const g=S.g;if(!g||g.over||g.mode!=="bot"||g.t!=="O")return;const b=g.b,emp=b.map((v,i)=>v?-1:i).filter(i=>i>=0),wins=(s,i)=>{b[i]=s;const w=lineWin(b)?.v===s;b[i]="";return w};
 let p=emp.find(i=>wins("O",i));if(p===undefined)p=emp.find(i=>wins("X",i));if(p===undefined){let best=-1;emp.forEach(i=>{const s=score(b,i,"O")*1.1+score(b,i,"X")+Math.random()*.8-(Math.abs(i%5-2)+Math.abs(Math.floor(i/5)-2))*.3;if(s>best){best=s;p=i}})}place(p)}
/* online room: host decides, every move = full snapshot, auto resync */
const fresh=(rd,hm)=>({b:Array(25).fill(""),t:"X",seq:0,rd,hm,over:false,win:null,last:-1});
function closeRoom(notify){const R=S.room;if(!R)return;S.room=null;clearInterval(R.hb);if(notify&&R.started&&!R.left)R.tx({t:"bye"});try{sb.removeChannel(R.ch)}catch(_){}}
async function openRoom(code,host,opp){closeRoom(true);const ch=sb.channel("ttt-"+code);
 const R=S.room={code,host,ch,oppId:opp?.id||null,oppName:opp?.name||"Dost",started:false,seen:Date.now(),rem:{},G:null};
 R.tx=m=>ch.send({type:"broadcast",event:"g",payload:{...m,from:S.user.id}}).catch(()=>{});ch.on("broadcast",{event:"g"},({payload:m})=>roomMsg(R,m));
 await new Promise(r=>{ch.subscribe(s=>{if(s==="SUBSCRIBED")r()});setTimeout(r,6000)});if(S.room!==R)return;
 if(!host){let n=0;const iv=setInterval(()=>{if(S.room!==R||R.started||++n>15)return clearInterval(iv);R.tx({t:"join",name:myName()})},1200);R.tx({t:"join",name:myName()})}
 R.hb=setInterval(()=>tick(R),3000)}
async function hostTTT(code,opp){code=code||Math.random().toString(36).slice(2,8).toUpperCase();closeModal();await openRoom(code,true,opp);
 openModal(`<h3>Room ready ❌</h3><p class="sub">Dost ka wait ho raha hai…</p><div class="card" style="padding:18px;text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;margin-bottom:14px">${code}</div><button class="btn red wide" onclick="closeModal();closeRoom(true)">Cancel</button>`)}
function joinTTT(code){if(!code||code.length<4)return toast("Room code daalo.");closeModal();openRoom(code,false);openModal(`<h3>Join ho raha hai…</h3><p class="sub">Host ke start karne ka wait</p><button class="btn red wide" onclick="closeModal();closeRoom(true)">Cancel</button>`)}
function roomMsg(R,m){if(S.room!==R||m.from===S.user.id)return;if(R.started&&m.from!==R.oppId)return;R.seen=Date.now();R.slow=false;
 if(m.t==="join"&&R.host){if(!R.started){R.started=true;R.oppId=m.from;R.oppName=m.name||"Dost";closeModal();minCall(true);R.tx({t:"start",name:myName()});round(R,1,"X")}else R.tx({t:"start",name:myName()})}
 else if(m.t==="start"&&!R.host&&!R.started){R.started=true;R.oppId=m.from;R.oppName=m.name||"Dost";closeModal();minCall(true);S.page="ttt";R.G=fresh(1,"X");view(R)}
 else if(m.t==="mv"&&R.host)hostMove(R,m.i,m.s,R.G?.hm==="X"?"O":"X");
 else if(m.t==="snap"&&!R.host)snap(R,m.g);
 else if(m.t==="need"&&R.host&&R.G)R.tx({t:"snap",g:R.G});
 else if(m.t==="emo")floatEmo(m.e,1)
 else if(m.t==="rem"){R.rem.o=1;remCheck(R)}
 else if(m.t==="bye"){R.left=1;toast("Dost ne game chhod diya");view(R)}}
function round(R,rd,hm){R.G=fresh(rd,hm);R.rem={};R.tx({t:"snap",g:R.G});S.page="ttt";view(R)}
function hostMove(R,i,s,mark){const G=R.G;if(!G||G.over||s!==G.seq||G.t!==mark||!(i>=0&&i<25)||G.b[i])return;G.b[i]=mark;G.last=i;G.seq++;const w=lineWin(G.b);
 if(w){G.over=true;G.win=w.v}else if(G.b.every(Boolean)){G.over=true;G.win="draw"}else G.t=mark==="X"?"O":"X";R.tx({t:"snap",g:G});view(R)}
function snap(R,g){const o=R.G;if(o&&(g.rd<o.rd||(g.rd===o.rd&&g.seq<o.seq)))return;R.G=g;if(o&&g.rd>o.rd)R.rem={};view(R)}
function view(R){const G=R.G;if(!G||S.room!==R)return;const me=R.host?G.hm:(G.hm==="X"?"O":"X");
 let msg=R.left?"Dost chala gaya":G.over?(G.win==="draw"?"Draw":G.win===me?"Aap jeet gaye! 🏆":R.oppName+" jeet gaya"):G.t===me?`Aapki baari (${me})`:`${R.oppName} ki baari`;if(R.slow&&!G.over)msg+=" · reconnecting…";
 const key=G.rd+"_"+G.seq;if(R.vk!==key){if(R.vk&&G.seq>0)sfx("move");if(G.over&&!R.left){if(G.win===me)incWin("ttt");sfx(G.win===me?"win":G.win==="draw"?"tap":"lose");vib(G.win===me?[60,40,60]:30)}R.vk=key}
 S.g={mode:"online",b:G.b.slice(),t:G.t,over:G.over||!!R.left,me,msg,last:G.last,rem:R.rem.me};if(S.page==="ttt")draw()}
function rematch(){const R=S.room;if(!R)return;R.rem.me=1;R.tx({t:"rem"});remCheck(R);view(R)}
function remCheck(R){if(!(R.rem.me&&R.rem.o))return;R.rem={};if(R.host)round(R,R.G.rd+1,R.G.hm==="X"?"O":"X")}

 l.dice=null;l.busy=false;l.seq++;
 if(pl.tokens.every(x=>x===FIN)){l.winner=pl.name;l.msg=pl.name+" jeet gaya! 🏆";confetti();const mine=L.mode==="online"?pl===L.players[L.me]:L.mode==="robot"?l.players.indexOf(pl)===0:true;if(mine)incWin("ludo");sfx(mine?"win":"lose");updL();winUI(pl.name);return}
 updL();(d===6||cut||p===FIN)?again(pl):endT()}
function winUI(n){const c=$("ldCard");if(!c||c.querySelector(".wo"))return;const on=L.mode==="online";c.insertAdjacentHTML("beforeend",`<div class="wo"><div>🏆<br>${esc(n)} won!<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;font-size:15px;min-width:220px">${on?`<button class="btn pri" onclick="leaveL();matchmake('ludo')">⚡ Find new match</button>`:`<button class="btn pri" onclick="startLudo(L.mode,null,null,L.n)">🔁 Phir khelo</button>`}<button class="btn" onclick="leaveL()">Games</button></div></div></div>`)}
function botT(){const l=L;if(l&&l.mode==="robot"&&l.turn>0&&!l.winner)setTimeout(()=>{if(L===l&&!l.winner&&l.turn>0)animRoll(rnd6())},850)}
function again(pl){L.dice=null;L.msg=pl.name+" ko dobara chance";updL();botT()}
function endT(){const l=L;l.sixes=0;l.dice=null;let k=0;do{l.turn=(l.turn+1)%l.players.length}while(l.players[l.turn].gone&&++k<8);l.msg=cur().name+" ki baari";updL();botT()}
function leaveL(){closeLR(true);L=null;go("games")}
/* online room */
const lsend=m=>LR?.started&&LR.tx(m);
function closeLR(notify){const R=LR;if(!R)return;LR=null;clearInterval(R.hb);if(notify&&R.started)R.tx({t:"bye"});try{sb.removeChannel(R.ch)}catch(_){}}
async function openLR(code,host,opp){closeLR(true);const ch=sb.channel("ludo-"+code),R=LR={code,host,ch,oppId:opp?.id||null,oppName:opp?.name||"Dost",started:false,seen:Date.now()};
 R.tx=m=>ch.send({type:"broadcast",event:"g",payload:{...m,from:S.user.id}}).catch(()=>{});ch.on("broadcast",{event:"g"},({payload:m})=>lMsg(R,m));
 await new Promise(r=>{ch.subscribe(s=>{if(s==="SUBSCRIBED")r()});setTimeout(r,6000)});if(LR!==R)return;
 if(!host){let n=0;const iv=setInterval(()=>{if(LR!==R||R.started||++n>15)return clearInterval(iv);R.tx({t:"join",name:myName()})},1200);R.tx({t:"join",name:myName()})}R.hb=setInterval(()=>lTick(R),3000)}
async function hostLudo(code,opp){code=code||Math.random().toString(36).slice(2,8).toUpperCase();closeModal();await openLR(code,true,opp);
 openModal(`<h3>Room ready 🎲</h3><p class="sub">Dost ka wait ho raha hai…</p><div class="card" style="padding:18px;text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;margin-bottom:14px">${code}</div><button class="btn red wide" onclick="closeModal();closeLR(true)">Cancel</button>`)}
function joinLudo(code){if(!code||code.length<4)return toast("Room code daalo.");closeModal();openLR(code,false);openModal(`<h3>Join ho raha hai…</h3><p class="sub">Host ke start karne ka wait</p><button class="btn red wide" onclick="closeModal();closeLR(true)">Cancel</button>`)}
function lMsg(R,m){if(LR!==R||m.from===S.user.id)return;if(R.started&&m.from!==R.oppId)return;R.seen=Date.now();
 if(m.t==="join"&&R.host){if(!R.started){R.started=true;R.oppId=m.from;R.oppName=m.name||"Dost";closeModal();R.tx({t:"start",name:myName()});startLudo("online",[myName(),R.oppName],0)}else R.tx({t:"start",name:myName()})}
 else if(m.t==="start"&&!R.host&&!R.started){R.started=true;R.oppId=m.from;R.oppName=m.name||"Dost";closeModal();startLudo("online",[R.oppName,myName()],1)}
 else if(m.t==="emo")floatEmo(m.e,1)
 else if(!L||L.mode!=="online")return;
 else if(m.t==="roll"){if(L.turn!==L.me&&!L.rolling&&!L.dice&&!L.busy)animRoll(m.d)}
 else if(m.t==="mv"){if(L.turn!==L.me)(async()=>{while(L&&L.rolling)await sleep(50);if(L&&L.dice&&!L.busy)commit(cur(),m.i)})()}
 else if(m.t==="snap"&&!L.busy&&!L.rolling&&!L.dice&&m.s.seq>L.seq){L.players.forEach((p,i)=>p.tokens=m.s.t[i].slice());L.turn=m.s.turn;L.sixes=m.s.sx;L.seq=m.s.seq;L.spr.forEach(r=>r.forEach(s=>s.slow=false));updL()}
 else if(m.t==="bye"&&!L.winner){toast("Dost ne game chhod diya");L.winner=L.players[L.me].name;L.msg="Dost chala gaya";updL();winUI(L.winner)}}
function lTick(R){if(LR!==R||!R.started)return;R.tx({t:"hb"});if(R.ch.state!=="joined"){if(L)L.msg="Reconnecting game…",updL();R.dc=1;return}
 if(R.dc){R.dc=0;toast("Game wapas judd gaya ✓")}if(Date.now()-R.seen>60000&&L&&!L.winner){toast("Dost wapas nahi aaya");lMsg(R,{t:"bye",from:R.oppId})}
 if(R.host&&L&&!L.busy&&!L.rolling&&!L.dice&&!L.winner)R.tx({t:"snap",s:{seq:L.seq,turn:L.turn,sx:L.sixes,t:L.players.map(p=>p.tokens.slice())}})}

/* ---------- boot ---------- */
setTimeout(()=>{$("splash").classList.add("out");setTimeout(()=>$("splash").remove(),800)},2600);
(async()=>{try{const{data}=await sb.auth.getSession();if(data?.session?.user)return enter(data.session.user)}catch(_){}$("auth").classList.remove("h")})();
setInterval(()=>{if(S.user)setOnline(true)},60000);
addEventListener("unhandledrejection",e=>console.warn(e.reason));
</script></body></html>
