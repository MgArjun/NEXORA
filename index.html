<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZNEXORA">
<title>ZNEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   ZNEXORA CORE DESIGN SYSTEM
========================================================= */
:root{
  --bg:#05070d;
  --surface:#101728;
  --surface2:#151d31;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --text:#f2f5ff;
  --muted:#a9b3c7;
  --muted2:#6f7a90;
  --blue:#4f7cff;
  --violet:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
  --gold:#ffd43b;
  --primary:linear-gradient(135deg,#4f7cff,#8b5cf6);
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-xl:28px;
  --r-full:999px;
  --shadow:0 18px 40px -22px rgba(0,0,0,.9);
  --ease:cubic-bezier(.22,1,.36,1);
  --nav-h:64px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100dvh;
  background:
    radial-gradient(90% 55% at 8% -8%,rgba(79,124,255,.12),transparent 60%),
    radial-gradient(80% 50% at 100% 105%,rgba(139,92,246,.10),transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

button,input,textarea{font-family:inherit}
button{border:0;cursor:pointer}

/* =========================================================
   SHORT PREMIUM SPLASH
========================================================= */
#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:
    radial-gradient(80% 60% at 50% 35%,rgba(255,212,59,.10),transparent 65%),
    var(--bg);
  transition:opacity .32s var(--ease),transform .32s var(--ease);
}

#splash.out{
  opacity:0;
  transform:scale(1.04);
  pointer-events:none;
}

.splash-inner{
  display:grid;
  justify-items:center;
  gap:16px;
  animation:splashIn .42s var(--ease) both;
}

@keyframes splashIn{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:none}
}

.mg-logo{
  width:min(52vw,190px);
  height:auto;
  overflow:visible;
  filter:drop-shadow(0 0 18px rgba(255,212,59,.28));
}

.mg-logo path{
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1;
  stroke-dashoffset:1;
  animation:draw .75s var(--ease) forwards;
}

.mg-logo .m{
  stroke:url(#gold);
  stroke-width:11;
  animation-delay:.08s;
}

.mg-logo .g{
  stroke:url(#gold);
  stroke-width:11;
  animation-delay:.22s;
}

.mg-logo .shadow{
  stroke:rgba(154,168,255,.55);
  stroke-width:2;
  animation-delay:.34s;
}

@keyframes draw{
  to{stroke-dashoffset:0}
}

.splash-word{
  display:flex;
  gap:.14em;
  margin-top:6px;
}

.splash-word i{
  font-style:normal;
  font-size:clamp(20px,6vw,29px);
  font-weight:700;
  letter-spacing:.4em;
  color:#e9edff;
  opacity:0;
  transform:translateY(12px);
  animation:wordIn .38s var(--ease) forwards;
}

.splash-word i:first-child{
  color:var(--gold);
  font-weight:500;
}

.splash-word i:nth-child(1){animation-delay:.72s}
.splash-word i:nth-child(2){animation-delay:.78s}
.splash-word i:nth-child(3){animation-delay:.84s}
.splash-word i:nth-child(4){animation-delay:.90s}
.splash-word i:nth-child(5){animation-delay:.96s}
.splash-word i:nth-child(6){animation-delay:1.02s}
.splash-word i:nth-child(7){animation-delay:1.08s}

@keyframes wordIn{
  to{opacity:1;transform:none}
}

.splash-credit{
  color:var(--muted2);
  font-size:12px;
  font-weight:700;
  opacity:0;
  animation:fadeIn .3s var(--ease) 1.15s forwards;
}

.splash-bar{
  width:118px;
  height:3px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(255,255,255,.12);
  opacity:0;
  animation:fadeIn .25s var(--ease) .35s forwards;
}

.splash-bar i{
  display:block;
  height:100%;
  width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#ffe36e,#f5b700);
  animation:load 1.25s var(--ease) forwards;
}

@keyframes load{to{width:100%}}

@keyframes fadeIn{to{opacity:1}}

/* =========================================================
   AUTH
========================================================= */
#auth{
  display:none;
  min-height:100dvh;
  place-items:center;
  padding:24px;
}

#auth.on{display:grid}

.auth-box{
  width:min(400px,100%);
  padding:26px;
  border-radius:var(--r-xl);
  background:rgba(17,23,40,.96);
  border:1px solid var(--line2);
  box-shadow:var(--shadow);
  animation:rise .32s var(--ease) both;
}

@keyframes rise{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}

.auth-box h1{
  margin:0;
  font-size:27px;
  font-weight:900;
  letter-spacing:-.7px;
}

.auth-box>p{
  margin:8px 0 20px;
  color:var(--muted);
  font-size:14px;
}

.field{margin-bottom:12px}

input{
  width:100%;
  min-height:48px;
  padding:13px 16px;
  border-radius:var(--r-md);
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--text);
  font-size:15px;
  transition:.2s;
}

input:focus{
  outline:none;
  border-color:rgba(79,124,255,.75);
  box-shadow:0 0 0 4px rgba(79,124,255,.16);
}

.btn{
  min-height:48px;
  padding:0 18px;
  border-radius:var(--r-full);
  background:var(--surface2);
  border:1px solid var(--line);
  color:var(--text);
  font-size:14px;
  font-weight:800;
  transition:.16s var(--ease);
}

.btn:active{transform:scale(.96)}

.btn.pri{
  background:var(--primary);
  border-color:transparent;
  color:#fff;
  box-shadow:0 16px 34px -18px rgba(79,124,255,.9);
}

.btn.wide{width:100%}

.btn.red{
  background:rgba(239,68,68,.14);
  border-color:rgba(239,68,68,.35);
  color:#ff8f8f;
}

.auth-msg{
  min-height:18px;
  margin:10px 0 14px;
  font-size:13px;
  color:var(--muted);
}

.switch{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.switch button{
  background:none;
  color:#8fb0ff;
  font-weight:800;
}

/* =========================================================
   APP SHELL
========================================================= */
#shell{
  display:none;
  min-height:100dvh;
  flex-direction:column;
}

#shell.on{display:flex}

#main{
  flex:1;
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:16px 16px calc(var(--nav-h) + var(--safe-bottom) + 24px);
}

.page{animation:pageIn .24s var(--ease) both}

@keyframes pageIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

/* =========================================================
   BOTTOM NAV
========================================================= */
#nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  height:calc(var(--nav-h) + var(--safe-bottom));
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 10px var(--safe-bottom);
  background:rgba(8,12,22,.9);
  backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid var(--line);
}

#nav button{
  min-width:62px;
  height:var(--nav-h);
  display:grid;
  place-items:center;
  gap:3px;
  background:none;
  color:var(--muted2);
  font-size:10.5px;
  font-weight:800;
  transition:.2s var(--ease);
}

#nav button span{font-size:18px}

#nav button.on{color:#fff}

#nav button.on span{
  filter:drop-shadow(0 0 10px rgba(79,124,255,.9));
}

/* =========================================================
   HOME
========================================================= */
.hero{
  position:relative;
  overflow:hidden;
  padding:22px 20px;
  margin-bottom:18px;
  border-radius:var(--r-xl);
  background:
    radial-gradient(120% 100% at 0% 0%,rgba(79,124,255,.22),transparent 60%),
    radial-gradient(100% 100% at 100% 100%,rgba(139,92,246,.18),transparent 60%),
    rgba(255,255,255,.05);
  border:1px solid var(--line2);
  box-shadow:var(--shadow);
}

.hero small{
  color:var(--muted);
  font-weight:700;
}

.hero h2{
  margin:5px 0 0;
  font-size:27px;
  font-weight:900;
  letter-spacing:-.7px;
}

.hero p{
  margin:9px 0 0;
  color:var(--muted2);
  font-size:13.5px;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:16px;
  padding:8px 14px;
  border-radius:var(--r-full);
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.3);
  color:#8ff0b6;
  font-size:12.5px;
  font-weight:800;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px rgba(34,197,94,.16);
  animation:pulse 1.8s infinite;
}

@keyframes pulse{50%{opacity:.45}}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.tile{
  display:grid;
  align-content:start;
  gap:10px;
  padding:18px;
  min-height:130px;
  border-radius:var(--r-lg);
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--text);
  text-align:left;
  transition:.18s var(--ease);
}

.tile:active{transform:scale(.97)}

.tile b{font-size:15.5px}
.tile small{color:var(--muted2);font-size:12.5px}

.sec{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:22px 2px 12px;
}

.sec b{font-size:16px}

.empty{
  padding:26px 18px;
  border-radius:var(--r-lg);
  border:1px dashed var(--line);
  color:var(--muted2);
  text-align:center;
  font-size:14px;
}

/* =========================================================
   TOAST
========================================================= */
#toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--nav-h) + var(--safe-bottom) + 18px);
  transform:translateX(-50%);
  z-index:9000;
  display:none;
  padding:12px 18px;
  border-radius:var(--r-full);
  background:rgba(18,24,42,.96);
  border:1px solid var(--line2);
  font-size:13.5px;
  font-weight:700;
  box-shadow:var(--shadow);
}

#toast.show{
  display:block;
  animation:toastIn .22s var(--ease);
}

@keyframes toastIn{
  from{opacity:0;transform:translate(-50%,14px)}
  to{opacity:1;transform:translate(-50%,0)}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<!-- ================= SHORT FINAL SPLASH ================= -->
<div id="splash">
  <div class="splash-inner">
    <svg class="mg-logo" viewBox="0 0 246 136" aria-hidden="true">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff3a6"/>
          <stop offset=".5" stop-color="#ffd43b"/>
          <stop offset="1" stop-color="#f2a900"/>
        </linearGradient>
      </defs>

      <path class="shadow" pathLength="1" d="M20 112V22L62 78L104 22V112"/>
      <path class="shadow" pathLength="1" d="M210 38A45 45 0 1 0 221 67H182"/>

      <path class="m" pathLength="1" d="M20 112V22L62 78L104 22V112"/>
      <path class="g" pathLength="1" d="M210 38A45 45 0 1 0 221 67H182"/>
    </svg>

    <div class="splash-word">
      <i>Z</i><i>N</i><i>E</i><i>X</i><i>O</i><i>R</i><i>A</i>
    </div>

    <div class="splash-credit">Powered by Suraj Kumar</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<!-- ================= AUTH ================= -->
<section id="auth">
  <div class="auth-box">
    <div id="loginBox">
      <h1>Welcome back</h1>
      <p>Log in to continue to ZNEXORA.</p>

      <div class="field"><input id="liEmail" type="email" placeholder="Email"></div>
      <div class="field"><input id="liPass" type="password" placeholder="Password"></div>

      <div class="auth-msg" id="authMsg"></div>

      <button class="btn pri wide" id="loginBtn">Log in</button>
      <button class="btn wide" id="guestBtn" style="margin-top:10px">Continue as guest</button>

      <div class="switch">
        New here? <button id="toSignup">Create account</button>
      </div>
    </div>

    <div id="signupBox" style="display:none">
      <h1>Create account</h1>
      <p>Join ZNEXORA and start connecting.</p>

      <div class="field"><input id="suName" placeholder="Display name"></div>
      <div class="field"><input id="suEmail" type="email" placeholder="Email"></div>
      <div class="field"><input id="suPass" type="password" placeholder="Password"></div>

      <div class="auth-msg" id="authMsg2"></div>

      <button class="btn pri wide" id="signupBtn">Create account</button>

      <div class="switch">
        Already have an account? <button id="toLogin">Log in</button>
      </div>
    </div>
  </div>
</section>

<!-- ================= APP SHELL ================= -->
<section id="shell">
  <main id="main"></main>

  <nav id="nav">
    <button data-page="home" class="on"><span>🏠</span>Home</button>
    <button data-page="chats"><span>💬</span>Chats</button>
    <button data-page="connect"><span>🔗</span>Connect</button>
    <button data-page="games"><span>🎮</span>Games</button>
    <button data-page="settings"><span>⚙️</span>Settings</button>
  </nav>
</section>

<div id="toast"></div>

<script>
/* =========================================================
   ZNEXORA CLEAN REBUILD — MODULE A
   Foundation: Supabase + Auth + Shell + Home
========================================================= */

const SUPABASE_URL='https://ktwluvpmzisonmootdqc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_zvKhZR56X0-3Ii1rn9AdFArtBalgVm';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{
  auth:{persistSession:true,autoRefreshToken:true}
});

const S={user:null,me:null,page:'home'};
const D=document;
const $=id=>D.getElementById(id);

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* ---------- TOAST ---------- */
let toastTimer;

function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ---------- SPLASH EXIT ---------- */
function closeSplash(){
  const sp=$('splash');
  if(!sp)return;
  sp.classList.add('out');
  setTimeout(()=>sp.remove(),360);
}

/* ---------- AUTH SCREENS ---------- */
function showAuth(){
  closeSplash();
  $('auth').classList.add('on');
}

function showShell(){
  closeSplash();
  $('auth').classList.remove('on');
  $('shell').classList.add('on');
}

function authMsg(id,msg,ok){
  const el=$(id);
  el.textContent=msg;
  el.style.color=ok?'#7ee2a8':'#ff8f8f';
}

$('toSignup').onclick=()=>{
  $('loginBox').style.display='none';
  $('signupBox').style.display='block';
};

$('toLogin').onclick=()=>{
  $('signupBox').style.display='none';
  $('loginBox').style.display='block';
};

/* ---------- PROFILE ---------- */
async function ensureProfile(user){
  const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(data)return data;

  const name=user.user_metadata?.displayname||user.email?.split('@')[0]||'Guest';
  let username=(user.email||'guest').split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);

  if(username.length<3){
    username='user'+user.id.replace(/-/g,'').slice(0,5);
  }

  const {data:created}=await sb.from('profiles').insert({
    id:user.id,
    username,
    displayname:name,
    isguest:!!user.is_anonymous,
    online:true,
    lastseen:new Date().toISOString()
  }).select().maybeSingle();

  return created;
}

/* ---------- ENTER APP ---------- */
async function enter(user){
  S.user=user;
  S.me=await ensureProfile(user);

  if(!S.me){
    authMsg('authMsg','Profile load nahi hua. Supabase table check karo.');
    return;
  }

  showShell();
  go('home');
}

/* ---------- LOGIN ---------- */
$('loginBtn').onclick=async()=>{
  const email=$('liEmail').value.trim();
  const password=$('liPass').value;

  if(!email||!password)return authMsg('authMsg','Enter email and password.');

  authMsg('authMsg','Signing in…');
  const {data,error}=await sb.auth.signInWithPassword({email,password});

  if(error)return authMsg('authMsg',error.message);
  await enter(data.user);
};

/* ---------- GUEST ---------- */
$('guestBtn').onclick=async()=>{
  authMsg('authMsg','Opening guest mode…');
  const {data,error}=await sb.auth.signInAnonymously();

  if(error)return authMsg('authMsg',error.message);
  await enter(data.user);
};

/* ---------- SIGNUP ---------- */
$('signupBtn').onclick=async()=>{
  const name=$('suName').value.trim();
  const email=$('suEmail').value.trim();
  const password=$('suPass').value;

  if(!name||!email||!password)return authMsg('authMsg2','Fill every field.');
  if(password.length<6)return authMsg('authMsg2','Password needs 6+ characters.');

  authMsg('authMsg2','Creating account…');
  const {data,error}=await sb.auth.signUp({
    email,
    password,
    options:{data:{displayname:name}}
  });

  if(error)return authMsg('authMsg2',error.message);

  if(data.session){
    await enter(data.user);
  }else{
    authMsg('authMsg2','Account created. Confirm email, then log in.',true);
    $('signupBox').style.display='none';
    $('loginBox').style.display='block';
  }
};

/* ---------- NAVIGATION ---------- */
const PAGES={
  home:renderHome,
  chats:renderChats,
  connect:renderConnect,
  games:renderGames,
  settings:renderSettings
};

function go(page){
  if(!S.user)return;
  S.page=page;

  D.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('on',b.dataset.page===page);
  });

  $('main').innerHTML=`<section class="page">${PAGES[page]?.()||''}</section>`;
}

D.querySelectorAll('#nav button').forEach(b=>{
  b.onclick=()=>go(b.dataset.page);
});

/* ---------- PAGES ---------- */
function renderHome(){
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';

  return `
    <div class="hero">
      <small>${esc(greet)},</small>
      <h2>${esc(S.me?.displayname||'Friend')}</h2>
      <p>Play more, worry less.</p>
      <div class="live"><span class="dot"></span> Online</div>
    </div>

    <div class="grid">
      <button class="tile" onclick="go('chats')"><b>💬 Chats</b><small>Your conversations</small></button>
      <button class="tile" onclick="go('connect')"><b>🔗 Connect</b><small>Friends and random</small></button>
      <button class="tile" onclick="go('games')"><b>🎮 Games</b><small>Ludo, UNO, Chess</small></button>
      <button class="tile" onclick="go('settings')"><b>⚙️ Settings</b><small>Profile and privacy</small></button>
    </div>

    <div class="sec"><b>Recent chats</b></div>
    <div class="empty">No chats yet. Open Connect to find people.</div>
  `;
}

function renderChats(){
  return `<h2>Chats</h2><div class="empty" style="margin-top:16px">Chat module Module C mein aayega.</div>`;
}

function renderConnect(){
  return `<h2>Connect</h2><div class="empty" style="margin-top:16px">Friends module Module B mein aayega.</div>`;
}

function renderGames(){
  return `<h2>Games</h2><div class="empty" style="margin-top:16px">Games module Module E mein aayega.</div>`;
}

function renderSettings(){
  return `<h2>Settings</h2><div class="empty" style="margin-top:16px">Settings module Module H mein aayega.</div>`;
}

/* ---------- BOOT ---------- */
(async()=>{
  const {data}=await sb.auth.getSession();

  setTimeout(async()=>{
    if(data.session?.user){
      await enter(data.session.user);
    }else{
      showAuth();
    }
  },1500);
})();
</script>
</body>
</html>
<!-- ================= ZNEXORA MODULE B — CONNECT + FRIENDS ================= -->
<style>
/* Connect hero */
.zc-hero{
  padding:22px 20px;
  margin-bottom:18px;
  border-radius:var(--r-xl);
  background:
    radial-gradient(120% 100% at 0% 0%,rgba(139,92,246,.20),transparent 60%),
    radial-gradient(100% 100% at 100% 100%,rgba(79,124,255,.16),transparent 60%),
    rgba(255,255,255,.05);

<script>
/* =========================================================
   MODULE B — CONNECT + FRIENDS + NOTIFICATIONS
========================================================= */

let FRIENDS=[];
let NOTIFICATIONS=[];

/* ---------- USER ROW ---------- */
function userRow(user,add=false){
  const online=user.online;
  const status=online
    ?'<span class="zc-online"><span class="zc-dot"></span>Online</span>'
    :'<span class="zc-offline"><span class="zc-dot"></span>Offline</span>';

  return `
    <div class="zc-user">
      <div class="zc-av">${esc(initial(user.displayname||user.username))}</div>
      <div class="zc-info">
        <b>${esc(user.displayname||user.username||'User')}</b>
        <small>@${esc(user.username||'user')} · ${status}</small>
      </div>
      <div class="zc-actions">
        ${add?`<button class="zc-icon" onclick="addFriend('${esc(user.id)}')">＋</button>`:''}
        <button class="zc-icon" onclick="chatWith('${esc(user.id)}')">💬</button>
      </div>
    </div>
  `;
}

function initial(name){
  return String(name||'U').trim().charAt(0).toUpperCase();
}

/* ---------- SEARCH ---------- */
async function findUser(){
  const input=$('zcSearch');
  const result=$('zcResults');
  const query=input.value.trim().toLowerCase();

  if(!result)return;
  if(query.length<2)return toast('Type at least 2 characters.');

  result.innerHTML='<div class="empty">Searching…</div>';

  let users=[];

  /* UID search: MG1001 / NX-1001 / 1001 */
  const uidMatch=query.match(/(?:mg|nx-?)?(\d{3,})$/i);

  if(uidMatch){
    const uid=uidMatch[1];
    const {data}=await sb.from('profiles')
      .select('*')
      .in('uid',[`MG${uid}`,`NX-${uid}`,`NX-MG${uid}`])
      .neq('id',S.user.id)
      .limit(10);

    users=data||[];
  }

  if(!users.length){
    const {data}=await sb.from('profiles')
      .select('*')
      .ilike('username',`%${query}%`)
      .neq('id',S.user.id)
      .limit(10);

    users=data||[];
  }

  result.innerHTML=users.length
    ?users.map(u=>userRow(u,true)).join('')
    :'<div class="empty">No user found.</div>';
}

/* ---------- FRIENDS ---------- */
async function addFriend(id){
  if(id===S.user.id)return toast('That is you.');

  const {error}=await sb.from('friendships').insert({
    requesterid:S.user.id,
    addresseeid:id,
    status:'pending'
  });

  if(error){
    return toast(
      error.code==='23505'
        ?'Request already sent.'
        :'Could not send request.'
    );
  }

  await sb.from('notifications').insert({
    userid:id,
    type:'friendrequest',
    title:'New friend request',
    body:`${S.me.displayname} wants to be your friend.`,
    data:{from:S.user.id}
  });

  toast('Friend request sent.');
}

async function loadFriends(){
  const box=$('zcFriends');
  if(!box)return;

  box.innerHTML='<div class="empty">Loading friends…</div>';

  const {data:links}=await sb.from('friendships')
    .select('requesterid,addresseeid')
    .eq('status','accepted')
    .or(`requesterid.eq.${S.user.id},addresseeid.eq.${S.user.id}`);

  const ids=(links||[]).map(x=>
    x.requesterid===S.user.id?x.addresseeid:x.requesterid
  );

  if(!ids.length){
    FRIENDS=[];
    box.innerHTML='<div class="empty">No friends yet. Search a username above.</div>';
    return;
  }

  const {data:users}=await sb.from('profiles')
    .select('*')
    .in('id',ids);

  FRIENDS=(users||[]).sort((a,b)=>{
    if(a.online!==b.online)return b.online?1:-1;
    return (a.displayname||'').localeCompare(b.displayname||'');
  });

  box.innerHTML=FRIENDS.length
    ?FRIENDS.map(u=>userRow(u)).join('')
    :'<div class="empty">No friends yet.</div>';
}

async function acceptFriend(id){
  const {error}=await sb.from('friendships')
    .update({status:'accepted'})
    .eq('requesterid',id)
    .eq('addresseeid',S.user.id);

  if(error)return toast('Could not accept request.');

  toast('You are now friends.');
  await loadNotifications();
  await loadFriends();
}

/* ---------- NOTIFICATIONS ---------- */
async function loadNotifications(){
  const {data}=await sb.from('notifications')
    .select('*')
    .eq('userid',S.user.id)
    .order('createdat',{ascending:false})
    .limit(40);

  NOTIFICATIONS=data||[];
  updateNotificationDot();
}

function updateNotificationDot(){
  const dot=$('navDot');
  if(dot)dot.style.display=NOTIFICATIONS.some(n=>!n.isread)?'block':'none';
}

function openNotifications(){
  const list=NOTIFICATIONS.length
    ?NOTIFICATIONS.map(n=>`
      <div class="zc-note">
        <b>${esc(n.title)}</b>
        <p>${esc(n.body)}</p>
        ${n.type==='friendrequest'&&n.data?.from
          ?`<button class="btn pri wide" style="margin-top:12px" onclick="acceptFriend('${esc(n.data.from)}')">Accept</button>`
          :''
        }
      </div>
    `).join('')
    :'<div class="empty">You are all caught up.</div>';

  openModal(`
    <h3>Notifications</h3>
    <p class="sub">Friend requests and updates.</p>
    <div style="margin-top:16px">${list}</div>
    <button class="btn wide" style="margin-top:16px" onclick="closeModal()">Close</button>
  `);

  sb.from('notifications')
    .update({isread:true})
    .eq('userid',S.user.id)
    .eq('isread',false)
    .then(()=>{
      NOTIFICATIONS.forEach(n=>n.isread=true);
      updateNotificationDot();
    });
}

/* ---------- MODAL ---------- */
function openModal(html){
  let ov=$('modalOverlay');

  if(!ov){
    ov=document.createElement('div');
    ov.id='modalOverlay';
    ov.style.cssText=`
      position:fixed;inset:0;z-index:8000;
      display:grid;place-items:center;padding:18px;
      background:rgba(3,5,12,.7);
      backdrop-filter:blur(8px);
    `;
    ov.onclick=e=>{
      if(e.target===ov)closeModal();
    };
    document.body.appendChild(ov);
  }

  ov.innerHTML=`
    <div style="
      width:min(430px,100%);
      max-height:86dvh;overflow:auto;
      padding:24px;border-radius:var(--r-xl);
      background:rgba(17,23,40,.97);
      border:1px solid var(--line2);
      box-shadow:var(--shadow);
      animation:rise .24s var(--ease) both;
    ">${html}</div>
  `;
}

function closeModal(){
  $('modalOverlay')?.remove();
}

/* ---------- CHAT PLACEHOLDER ---------- */
function chatWith(id){
  toast('Chat Module C mein aayega.');
}

/* ---------- CONNECT PAGE ---------- */
function renderConnect(){
  setTimeout(()=>{
    loadFriends();
    loadNotifications();
  },0);

  return `
    <div class="zc-hero">
      <h2>Connect</h2>
      <p>Find friends by username or UID, or meet someone new.</p>
    </div>

    <div class="zc-search">
      <input id="zcSearch" placeholder="Username or UID" autocapitalize="off">
      <button class="btn pri" onclick="findUser()">Search</button>
    </div>

    <div id="zcResults"></div>

    <div class="zc-random">
      <button onclick="toast('Random chat Module D mein aayega.')">
        <span class="zc-emoji">💬</span>
        <b>Random chat</b>
        <small>Match with someone searching</small>
      </button>

      <button onclick="toast('Random call Module D mein aayega.')">
        <span class="zc-emoji">📞</span>
        <b>Random call</b>
        <small>Talk to someone now</small>
      </button>
    </div>

    <div class="sec"><b>Friends</b></div>
    <div id="zcFriends"><div class="empty">Loading friends…</div></div>
  `;
}

/* ---------- HEADER NOTIFICATION BELL ---------- */
function addNotificationBell(){
  const nav=$('nav');
  if(!nav||$('navBell'))return;

  const bell=document.createElement('button');
  bell.id='navBell';
  bell.onclick=openNotifications;
  bell.innerHTML=`
    <span style="position:relative">
      🔔
      <i id="navDot" style="
        position:absolute;top:-4px;right:-6px;
        width:9px;height:9px;border-radius:50%;
        background:var(--red);display:none;
      "></i>
    </span>
    Alerts
  `;

  nav.appendChild(bell);
}

addNotificationBell();
</script>
<!-- ================= END MODULE B ================= -->

<script>
/* =========================================================
   MODULE C — CHATS + REALTIME + MEDIA
========================================================= */

let CHATS=[];
let ACTIVE_CHAT=null;
let CHAT_CHANNEL=null;

/* ---------- CHAT ID ---------- */
function chatId(uid){
  return [S.user.id,uid].sort().join('_');
}

/* ---------- CHATS PAGE ---------- */
function renderChats(){
  setTimeout(loadChats,0);

  return `
    <div class="zt-head">
      <h2>Chats</h2>
    </div>

    <div class="zt-search">
      <input id="chatSearch" placeholder="Search chats" oninput="filterChats(this.value)">
    </div>

    <div id="chatList"><div class="empty">Loading chats…</div></div>
  `;
}

async function loadChats(){
  const box=$('chatList');
  if(!box)return;

  const {data:messages}=await sb.from('messages')
    .select('*')
    .or(`senderid.eq.${S.user.id},receiverid.eq.${S.user.id}`)
    .order('createdat',{ascending:false})
    .limit(200);

  const seen=new Set();
  CHATS=[];

  for(const m of messages||[]){
    const other=m.senderid===S.user.id?m.receiverid:m.senderid;
    if(seen.has(other))continue;
    seen.add(other);

    const {data:user}=await sb.from('profiles')
      .select('*')
      .eq('id',other)
      .maybeSingle();

    CHATS.push({
      user:user||{id:other,displayname:'User',username:'user'},
      last:m.content||'Media',
      time:m.createdat
    });
  }

  paintChats();
}

function paintChats(){
  const box=$('chatList');
  if(!box)return;

  box.innerHTML=CHATS.length
    ?CHATS.map(c=>`
      <div class="zt-item" onclick="openChat('${esc(c.user.id)}')">
        <div class="zc-av">${esc(initial(c.user.displayname||c.user.username))}</div>
        <div class="zt-info">
          <b>${esc(c.user.displayname||c.user.username)}</b>
          <small>${esc(c.last)}</small>
        </div>
      </div>
    `).join('')
    :'<div class="empty">No chats yet. Open Connect to find people.</div>';
}

function filterChats(q){
  q=q.trim().toLowerCase();

  document.querySelectorAll('#chatList .zt-item').forEach((row,i)=>{
    const chat=CHATS[i];
    if(!chat)return;

    const name=(chat.user.displayname||'').toLowerCase();
    const last=(chat.last||'').toLowerCase();

    row.style.display=(!q||name.includes(q)||last.includes(q))?'flex':'none';
  });
}

/* ---------- OPEN CHAT ---------- */
async function openChat(uid){
  const {data:user}=await sb.from('profiles')
    .select('*')
    .eq('id',uid)
    .maybeSingle();

  ACTIVE_CHAT={
    uid,
    user:user||{id:uid,displayname:'User',username:'user'},
    cid:chatId(uid)
  };

  let chat=$('chatScreen');

  if(!chat){
    chat=document.createElement('div');
    chat.id='chatScreen';
    chat.className='zt-chat';
    document.body.appendChild(chat);
  }

  chat.innerHTML=`
    <div class="zt-chat-head">
      <button class="zc-icon" onclick="closeChat()">←</button>
      <b>${esc(ACTIVE_CHAT.user.displayname||ACTIVE_CHAT.user.username)}</b>
      <button class="zc-icon" onclick="pickMedia()">📎</button>
    </div>

    <div class="zt-chat-body" id="chatBody"></div>

    <div class="zt-input">
      <button class="zt-attach" onclick="pickMedia()">📎</button>
      <textarea id="chatInput" placeholder="Message" rows="1"></textarea>
      <button class="zt-send" onclick="sendMessage()">➤</button>
    </div>
  `;

  chat.classList.add('on');

  const input=$('chatInput');
  input.onkeydown=e=>{
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  };

  input.oninput=()=>{
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,120)+'px';
  };

  await loadMessages();
  subscribeChat();
}

function closeChat(){
  $('chatScreen')?.classList.remove('on');

  if(CHAT_CHANNEL){
    sb.removeChannel(CHAT_CHANNEL);
    CHAT_CHANNEL=null;
  }

  ACTIVE_CHAT=null;
  loadChats();
}

/* ---------- MESSAGES ---------- */
async function loadMessages(){
  const box=$('chatBody');
  if(!box||!ACTIVE_CHAT)return;

  box.innerHTML='<div class="empty">Loading messages…</div>';

  const {data}=await sb.from('messages')
    .select('*')
    .eq('conversationid',ACTIVE_CHAT.cid)
    .order('createdat',{ascending:true})
    .limit(300);

  box.innerHTML='';

  (data||[]).forEach(addMessage);
  box.scrollTop=box.scrollHeight;
}

function addMessage(m){
  const box=$('chatBody');
  if(!box)return;

  const mine=m.senderid===S.user.id;
  const time=new Date(m.createdat).toLocaleTimeString([],{
    hour:'2-digit',minute:'2-digit'
  });

  let inner=esc(m.content||'');

  if(m.mediatype==='image'){
    inner=`<img src="${esc(m.mediaurl)}">`;
  }else if(m.mediatype==='video'){
    inner=`<video src="${esc(m.mediaurl)}" controls></video>`;
  }else if(m.mediatype==='file'){
    inner=`📄 ${esc(m.medianame||'File')}`;
  }

  const div=document.createElement('div');
  div.className=`zt-msg ${mine?'me':'them'}`;
  div.innerHTML=`${inner}<span class="zt-time">${time}</span>`;

  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

/* ---------- SEND TEXT ---------- */
async function sendMessage(){
  const input=$('chatInput');
  const text=input.value.trim();

  if(!text||!ACTIVE_CHAT)return;

  input.value='';
  input.style.height='auto';

  const message={
    conversationid:ACTIVE_CHAT.cid,
    senderid:S.user.id,
    receiverid:ACTIVE_CHAT.uid,
    content:text,
    createdat:new Date().toISOString()
  };

  addMessage(message);

  await sb.from('messages').insert(message);
  CHAT_CHANNEL?.send({
    type:'broadcast',
    event:'message',
    payload:message
  });
}

/* ---------- REALTIME ---------- */
function subscribeChat(){
  if(CHAT_CHANNEL)sb.removeChannel(CHAT_CHANNEL);

  CHAT_CHANNEL=sb.channel(`chat-${ACTIVE_CHAT.cid}`);

  CHAT_CHANNEL.on('broadcast',{event:'message'},({payload})=>{
    if(payload.senderid===S.user.id)return;
    addMessage(payload);
  });

  CHAT_CHANNEL.subscribe();
}

/* ---------- MEDIA PICKER ---------- */
function pickMedia(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*,video/*,.pdf,.txt,.mp3,.wav';

  input.onchange=async()=>{
    const file=input.files[0];
    if(!file)return;
    await sendMedia(file);
  };

  input.click();
}

/* ---------- SEND MEDIA ---------- */
async function sendMedia(file){
  if(!ACTIVE_CHAT)return toast('Open a chat first.');

  const isImage=file.type.startsWith('image/');
  const isVideo=file.type.startsWith('video/');
  const isOneTime=confirm('Send as one-time media? OK = Yes, Cancel = Normal');

  toast('Uploading…');

  const path=`${ACTIVE_CHAT.cid}/${Date.now()}_${file.name}`;
  const {error}=await sb.storage.from('MB').upload(path,file);

  if(error)return toast('Upload failed: '+error.message);

  const {data:urlData}=await sb.storage.from('MB').getPublicUrl(path);

  const message={
    conversationid:ACTIVE_CHAT.cid,
    senderid:S.user.id,
    receiverid:ACTIVE_CHAT.uid,
    content:isOneTime?'One-time media':file.name,
    mediatype:isImage?'image':isVideo?'video':'file',
    mediaurl:urlData.publicUrl,
    medianame:file.name,
    mediapath:path,
    onetime:isOneTime,
    createdat:new Date().toISOString()
  };

  addMessage(message);

  await sb.from('messages').insert(message);
  CHAT_CHANNEL?.send({
    type:'broadcast',
    event:'message',
    payload:message
  });

  toast('Media sent.');
}
</script>

<script>
/* =========================================================
   MODULE D — VOICE + VIDEO CALLS
========================================================= */

let CALL=null;
let CALL_CHANNEL=null;
let LOCAL_STREAM=null;
let SCREEN_STREAM=null;

/* ---------- MEDIA ---------- */
async function getMic(){
  return await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },
    video:false
  });
}

async function getCamera(){
  return await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:{
      facingMode:'user',
      width:{ideal:1280},
      height:{ideal:720},
      frameRate:{ideal:30}
    }
  });
}

/* ---------- CALL UI ---------- */
function buildCallUI(){
  let call=$('callScreen');
  if(call)return call;

  call=document.createElement('div');
  call.id='callScreen';
  call.className='zcl-screen';

  call.innerHTML=`
    <div class="zcl-head">
      <div class="zcl-user">
        <div class="zcl-av" id="callAvatar">U</div>
        <div class="zcl-name">
          <b id="callName">User</b>
          <small id="callStatus">Connecting…</small>
        </div>
      </div>
      <div style="color:var(--muted);font-size:13px;font-weight:800" id="callTimer">00:00</div>
    </div>

    <div class="zcl-video" id="callVideoArea">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="zcl-local">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
    </div>

    <div class="zcl-controls">
      <button class="zcl-btn" id="muteBtn">🎤</button>
      <button class="zcl-btn" id="cameraBtn">📷</button>
      <button class="zcl-btn" id="screenBtn">🖥</button>
      <button class="zcl-btn end" id="endBtn">📞</button>
    </div>
  `;

  document.body.appendChild(call);

  $('muteBtn').onclick=toggleMute;
  $('cameraBtn').onclick=toggleCamera;
  $('screenBtn').onclick=toggleScreen;
  $('endBtn').onclick=()=>endCall();

  return call;
}

function paintCall(){
  if(!CALL)return;

  const call=buildCallUI();
  call.classList.add('on');

  $('callAvatar').textContent=initial(CALL.name);
  $('callName').textContent=CALL.name;

  $('callStatus').textContent=
    CALL.status==='ringing'?'Ringing…'
    :CALL.status==='calling'?'Calling…'
    :CALL.status==='connecting'?'Connecting…'
    :CALL.status==='reconnecting'?'Reconnecting…'
    :'Connected';

  $('muteBtn').classList.toggle('on',CALL.muted);
  $('cameraBtn').classList.toggle('on',CALL.video);
}

/* ---------- CALL TIMER ---------- */
setInterval(()=>{
  if(!CALL||CALL.status!=='connected')return;

  const sec=Math.floor((Date.now()-CALL.startedAt)/1000);
  const mm=String(Math.floor(sec/60)).padStart(2,'0');
  const ss=String(sec%60).padStart(2,'0');

  const timer=$('callTimer');
  if(timer)timer.textContent=`${mm}:${ss}`;
},500);

/* ---------- START CALL ---------- */
async function startCall(uid,name,video=false){
  if(CALL)return toast('You are already on a call.');

  try{
    LOCAL_STREAM=video?await getCamera():await getMic();
  }catch(e){
    return toast('Microphone/camera permission denied.');
  }

  CALL={
    uid,
    name:name||'User',
    video,
    status:'calling',
    muted:false,
    startedAt:Date.now(),
    pc:new RTCPeerConnection({
      iceServers:[
        {urls:'stun:stun.l.google.com:19302'}
      ]
    })
  };

  LOCAL_STREAM.getTracks().forEach(track=>{
    CALL.pc.addTrack(track,LOCAL_STREAM);
  });

  CALL.pc.ontrack=e=>{
    const remote=$('remoteVideo');
    if(remote)remote.srcObject=e.streams[0];
  };

  CALL.pc.onicecandidate=e=>{
    if(e.candidate){
      CALL_CHANNEL?.send({
        type:'broadcast',
        event:'ice',
        payload:{
          from:S.user.id,
          to:uid,
          candidate:e.candidate
        }
      });
    }
  };

  buildCallUI();
  paintCall();

  const localVideo=$('localVideo');
  if(localVideo)localVideo.srcObject=LOCAL_STREAM;

  if(!video){
    const area=$('callVideoArea');
    if(area)area.style.display='none';
  }

  subscribeCallChannel();

  const offer=await CALL.pc.createOffer();
  await CALL.pc.setLocalDescription(offer);

  CALL_CHANNEL?.send({
    type:'broadcast',
    event:'offer',
    payload:{
      from:S.user.id,
      to:uid,
      name:S.me.displayname,
      video,
      sdp:offer
    }
  });

  setTimeout(()=>{
    if(CALL&&CALL.status==='calling'){
      toast('No answer.');
      endCall();
    }
  },40000);
}

/* ---------- INCOMING CALL ---------- */
function showIncoming(payload){
  let box=$('incomingCall');

  if(!box){
    box=document.createElement('div');
    box.id='incomingCall';
    box.className='zcl-incoming';
    document.body.appendChild(box);
  }

  box.innerHTML=`
    <div class="zcl-incoming-box">
      <div class="zcl-av" style="margin:0 auto">${initial(payload.name)}</div>
      <h3>${esc(payload.name)}</h3>
      <p>Incoming ${payload.video?'video':'voice'} call</p>

      <div class="zcl-incoming-actions">
        <button class="btn red" onclick="declineCall()">Decline</button>
        <button class="btn pri" onclick="acceptCall()">Accept</button>
      </div>
    </div>
  `;

  box.classList.add('on');
  window.INCOMING=payload;
}

async function acceptCall(){
  const payload=window.INCOMING;
  if(!payload)return;

  $('incomingCall')?.classList.remove('on');

  try{
    LOCAL_STREAM=payload.video?await getCamera():await getMic();
  }catch(e){
    return toast('Microphone/camera permission denied.');
  }

  CALL={
    uid:payload.from,
    name:payload.name,
    video:payload.video,
    status:'connecting',
    muted:false,
    startedAt:Date.now(),
    pc:new RTCPeerConnection({
      iceServers:[
        {urls:'stun:stun.l.google.com:19302'}
      ]
    })
  };

  LOCAL_STREAM.getTracks().forEach(track=>{
    CALL.pc.addTrack(track,LOCAL_STREAM);
  });

  CALL.pc.ontrack=e=>{
    const remote=$('remoteVideo');
    if(remote)remote.srcObject=e.streams[0];
  };

  CALL.pc.onicecandidate=e=>{
    if(e.candidate){
      CALL_CHANNEL?.send({
        type:'broadcast',
        event:'ice',
        payload:{
          from:S.user.id,
          to:payload.from,
          candidate:e.candidate
        }
      });
    }
  };

  buildCallUI();
  paintCall();

  const localVideo=$('localVideo');
  if(localVideo)localVideo.srcObject=LOCAL_STREAM;

  if(!payload.video){
    const area=$('callVideoArea');
    if(area)area.style.display='none';
  }

  subscribeCallChannel();

  await CALL.pc.setRemoteDescription(payload.sdp);
  const answer=await CALL.pc.createAnswer();
  await CALL.pc.setLocalDescription(answer);

  CALL_CHANNEL?.send({
    type:'broadcast',
    event:'answer',
    payload:{
      from:S.user.id,
      to:payload.from,
      sdp:answer
    }
  });
}

function declineCall(){
  const payload=window.INCOMING;
  if(payload){
    CALL_CHANNEL?.send({
      type:'broadcast',
      event:'decline',
      payload:{
        from:S.user.id,
        to:payload.from
      }
    });
  }

  window.INCOMING=null;
  $('incomingCall')?.classList.remove('on');
}

/* ---------- CALL CHANNEL ---------- */
function subscribeCallChannel(){
  if(CALL_CHANNEL)return;

  CALL_CHANNEL=sb.channel('znexora-calls');

  CALL_CHANNEL.on('broadcast',{event:'offer'},({payload})=>{
    if(payload.to!==S.user.id)return;
    if(CALL)return declineCall();
    showIncoming(payload);
  });

  CALL_CHANNEL.on('broadcast',{event:'answer'},({payload})=>{
    if(!CALL||payload.to!==S.user.id)return;

    CALL.pc.setRemoteDescription(payload.sdp);
    CALL.status='connecting';
    paintCall();
  });

  CALL_CHANNEL.on('broadcast',{event:'ice'},({payload})=>{
    if(!CALL||payload.to!==S.user.id)return;
    CALL.pc.addIceCandidate(payload.candidate);
  });

  CALL_CHANNEL.on('broadcast',{event:'decline'},({payload})=>{
    if(!CALL||payload.to!==S.user.id)return;
    toast('Call declined.');
    endCall();
  });

  CALL_CHANNEL.on('broadcast',{event:'end'},({payload})=>{
    if(!CALL||payload.to!==S.user.id)return;
    toast('Call ended.');
    endCall(true);
  });

  CALL_CHANNEL.subscribe();
}

/* ---------- CONTROLS ---------- */
function toggleMute(){
  if(!CALL)return;

  CALL.muted=!CALL.muted;

  LOCAL_STREAM.getAudioTracks().forEach(track=>{
    track.enabled=!CALL.muted;
  });

  paintCall();
}

function toggleCamera(){
  if(!CALL||!CALL.video)return;

  const videoTrack=LOCAL_STREAM.getVideoTracks()[0];
  if(!videoTrack)return;

  videoTrack.enabled=!videoTrack.enabled;
  toast(videoTrack.enabled?'Camera on':'Camera off');
}

async function toggleScreen(){
  if(!CALL)return;

  if(SCREEN_STREAM){
    SCREEN_STREAM.getTracks().forEach(t=>t.stop());
    SCREEN_STREAM=null;
    toast('Screen share stopped.');
    return;
  }

  try{
    SCREEN_STREAM=await navigator.mediaDevices.getDisplayMedia({
      video:true,
      audio:true
    });

    const sender=CALL.pc.getSenders().find(s=>s.track?.kind==='video');
    if(sender)await sender.replaceTrack(SCREEN_STREAM.getVideoTracks()[0]);

    toast('Screen sharing with audio.');
  }catch(e){
    toast('Screen share cancelled.');
  }
}

/* ---------- END CALL ---------- */
function endCall(remoteEnded=false){
  if(!CALL)return;

  if(!remoteEnded){
    CALL_CHANNEL?.send({
      type:'broadcast',
      event:'end',
      payload:{
        from:S.user.id,
        to:CALL.uid
      }
    });
  }

  LOCAL_STREAM?.getTracks().forEach(t=>t.stop());
  SCREEN_STREAM?.getTracks().forEach(t=>t.stop());

  CALL.pc?.close();
  CALL=null;
  LOCAL_STREAM=null;
  SCREEN_STREAM=null;

  $('callScreen')?.classList.remove('on');
}

/* ---------- CALL BUTTONS ---------- */
function voiceCall(uid,name){
  startCall(uid,name,false);
}

function videoCall(uid,name){
  startCall(uid,name,true);
}
</script>

<script>

      </div>

      <h2>Tic-Tac-Toe</h2>
      <p class="sub">${esc(TTT.msg)}</p>

      <div class="zt3-wrap" style="margin-top:16px">
        <div class="zt3-board">
          ${TTT.board.map((cell,i)=>`
            <button class="zt3-cell ${cell.toLowerCase()} ${TTT.winCells.includes(i)?'win':''}"
              onclick="tapTTT(${i})">${cell}</button>
          `).join('')}
        </div>
      </div>

      ${TTT.over?`
        <button class="btn pri wide" style="margin-top:18px" onclick="restartTTT()">
          Play again
        </button>
      `:''}
    </section>
  `;
}

/* ---------- TAP ---------- */
function tapTTT(i){
  if(!TTT||TTT.over||TTT.board[i])return;

  if(TTT.mode==='bot'&&TTT.turn!=='X')return;

  placeTTT(i,TTT.turn);

  if(TTT.mode==='bot'&&!TTT.over){
    setTimeout(botMove,550);
  }
}

function placeTTT(i,mark){
  TTT.board[i]=mark;
  TTT.turn=mark==='X'?'O':'X';

  checkTTTWin();

  if(TTT.mode==='online'&&TTT_CHANNEL){
    TTT_CHANNEL.send({
      type:'broadcast',
      event:'move',
      payload:{i,mark}
    });
  }

  renderTTT();
}

/* ---------- WIN CHECK ---------- */
function checkTTTWin(){
  const b=TTT.board;
  const lines=[];

  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
        const cells=[];
        let ok=true;

        for(let k=0;k<4;k++){
          const y=r+dr*k;
          const x=c+dc*k;

          if(y<0||y>4||x<0||x>4||!b[y*5+x]||b[y*5+x]!==b[r*5+c]){
            ok=false;
            break;
          }

          cells.push(y*5+x);
        }

        if(ok)lines.push({mark:b[r*5+c],cells});
      }
    }
  }

  const win=lines[0];

  if(win){
    TTT.over=true;
    TTT.winner=win.mark;
    TTT.winCells=win.cells;
    TTT.msg=win.mark==='X'?'X won!':'O won!';
    return;
  }

  if(TTT.board.every(Boolean)){
    TTT.over=true;
    TTT.msg='Draw!';
    return;
  }

  TTT.msg=`${TTT.turn} turn`;
}

/* ---------- BOT ---------- */
function botMove(){
  if(!TTT||TTT.over)return;

  const empty=TTT.board
    .map((v,i)=>v?null:i)
    .filter(i=>i!==null);

  if(!empty.length)return;

  /* Win if possible */
  for(const i of empty){
    const copy=[...TTT.board];
    copy[i]='O';

    if(isWinning(copy,'O')){
      placeTTT(i,'O');
      return;
    }
  }

  /* Block player */
  for(const i of empty){
    const copy=[...TTT.board];
    copy[i]='X';

    if(isWinning(copy,'X')){
      placeTTT(i,'O');
      return;
    }
  }

  /* Random move */
  const move=empty[Math.floor(Math.random()*empty.length)];
  placeTTT(move,'O');
}

function isWinning(board,mark){
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
        let count=0;

        for(let k=0;k<4;k++){
          const y=r+dr*k;
          const x=c+dc*k;

          if(y<0||y>4||x<0||x>4)break;
          if(board[y*5+x]===mark)count++;
        }

        if(count===4)return true;
      }
    }
  }

  return false;
}

/* ---------- RESTART ---------- */
function restartTTT(){
  if(TTT.mode==='online'){
    TTT_CHANNEL?.send({
      type:'broadcast',
      event:'restart'
    });
  }

  startTTT(TTT.mode);
}

function leaveTTT(){
  if(TTT_CHANNEL){
    sb.removeChannel(TTT_CHANNEL);
    TTT_CHANNEL=null;
  }

  TTT=null;
  go('games');
}

/* ---------- ONLINE ROOM ---------- */
function hostTTT(){
  const code=Math.random().toString(36).slice(2,8).toUpperCase();

  openModal(`
    <h3>Room ready</h3>
    <p class="sub">Share this code with your friend.</p>

    <div style="
      padding:18px;margin:16px 0;
      border-radius:var(--r-lg);
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      text-align:center;
      font-size:30px;
      font-weight:900;
      letter-spacing:5px;
    ">${esc(code)}</div>

    <button class="btn pri wide" onclick="closeModal();startTTTRoom('${esc(code)}',true)">
      Start
    </button>

    <button class="btn wide" style="margin-top:10px" onclick="closeModal()">Cancel</button>
  `);
}

function joinTTT(){
  const code=$('tttCode').value.trim().toUpperCase();

  if(!code)return toast('Enter room code.');

  closeModal();
  startTTTRoom(code,false);
}

function startTTTRoom(code,host){
  TTT=newTTT('online');
  TTT.code=code;
  TTT.host=host;
  TTT.msg=host?'Waiting for friend…':'Joining room…';

  renderTTT();

  TTT_CHANNEL=sb.channel(`ttt-${code}`);

  TTT_CHANNEL.on('broadcast',{event:'move'},({payload})=>{
    if(!TTT||TTT.over)return;
    placeTTT(payload.i,payload.mark);
  });

  TTT_CHANNEL.on('broadcast',{event:'restart'},()=>{
    TTT=newTTT('online');
    TTT.code=code;
    TTT.host=host;
    renderTTT();
  });

  TTT_CHANNEL.subscribe();

  if(host){
    TTT.msg='Waiting for friend…';
    renderTTT();
  }else{
    TTT.msg='Connected. X starts.';
    renderTTT();
  }
}

<script>
/* =========================================================
   MODULE F — LUDO + UNO
========================================================= */

/* ================= LUDO ================= */
let LUDO=null;
let LUDO_CHANNEL=null;

const LUDO_PATH=[
  [6,1],[6,2],[6,3],[6,4],[6,5],
  [5,6],[4,6],[3,6],[2,6],[1,6],
  [0,6],[0,7],[0,8],
  [1,8],[2,8],[3,8],[4,8],[5,8],
  [6,9],[6,10],[6,11],[6,12],[6,13],
  [6,14],[7,14],[8,14],
  [8,13],[8,12],[8,11],[8,10],[8,9],
  [9,8],[10,8],[11,8],[12,8],[13,8],
  [14,8],[14,7],[14,6],
  [13,6],[12,6],[11,6],[10,6],[9,6],
  [8,5],[8,4],[8,3],[8,2],[8,1],
  [8,0],[7,0],[6,0]
];

function startLudo(mode){
  LUDO={
    mode,
    players:[
      {name:'Red',color:'red',pos:-1},
      {name:'Green',color:'green',pos:-1}
    ],
    turn:0,
    dice:null,
    winner:null,
    msg:'Red turn'
  };

  renderLudo();

  if(mode==='online'){
    const code=prompt('Enter room code:');
    if(!code)return go('games');

    LUDO.code=code.toUpperCase();
    LUDO_CHANNEL=sb.channel(`ludo-${LUDO.code}`);

    LUDO_CHANNEL.on('broadcast',{event:'move'},({payload})=>{
      if(!LUDO)return;
      LUDO.players[payload.p].pos=payload.pos;
      LUDO.turn=payload.turn;
      LUDO.msg=`${LUDO.players[payload.turn].name} turn`;
      renderLudo();
    });

    LUDO_CHANNEL.subscribe();
  }
}

function renderLudo(){
  $('main').innerHTML=`
    <section class="page">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="btn" onclick="go('games')">Games</button>
        <span style="flex:1"></span>
        ${LUDO.mode==='online'?`<button class="btn" onclick="leaveLudo()">Leave</button>`:''}
      </div>

      <h2>Ludo</h2>
      <p class="sub">${esc(LUDO.msg)}</p>

      <div class="zf-game" style="margin-top:16px">
        <div class="zf-status">
          <div class="zf-msg">${esc(LUDO.msg)}</div>
          <button class="zf-dice" onclick="rollLudo()">🎲</button>
        </div>

        <div class="zf-ludo">
          ${Array.from({length:225}).map((_,i)=>{
            const r=Math.floor(i/15);
            const c=i%15;

            let cls='zf-cell';
            if(r<6&&c<6)cls+=' red';
            if(r<6&&c>8)cls+=' green';
            if(r>8&&c<6)cls+=' yellow';
            if(r>8&&c>8)cls+=' blue';

            let tokens='';

            LUDO.players.forEach((p,pi)=>{
              if(p.pos>=0&&p.pos<52){
                const [pr,pc]=LUDO_PATH[p.pos];
                if(pr===r&&pc===c){
                  tokens+=`<div class="zf-token ${p.color}">${pi+1}</div>`;
                }
              }
            });

            return `<div class="${cls}">${tokens}</div>`;
          }).join('')}
        </div>
      </div>
    </section>
  `;
}

function rollLudo(){
  if(!LUDO||LUDO.winner||LUDO.dice)return;

  const dice=Math.floor(Math.random()*6)+1;
  LUDO.dice=dice;

  const player=LUDO.players[LUDO.turn];
  const newPos=Math.min(player.pos+dice,56);

  player.pos=newPos;
  LUDO.msg=`${player.name} rolled ${dice}`;

  if(newPos===56){
    LUDO.winner=player.name;
    LUDO.msg=`${player.name} won!`;
  }else{
    LUDO.turn=1-LUDO.turn;
    LUDO.msg+=` · ${LUDO.players[LUDO.turn].name} turn`;
  }

  if(LUDO.mode==='online'&&LUDO_CHANNEL){
    LUDO_CHANNEL.send({
      type:'broadcast',
      event:'move',
      payload:{
        p:LUDO.turn,
        pos:player.pos,
        turn:LUDO.turn
      }
    });
  }

  setTimeout(()=>{
    LUDO.dice=null;
    renderLudo();
  },600);
}

function leaveLudo(){
  if(LUDO_CHANNEL){
    sb.removeChannel(LUDO_CHANNEL);
    LUDO_CHANNEL=null;
  }

  LUDO=null;
  go('games');
}

/* ================= UNO ================= */
let UNO=null;
let UNO_CHANNEL=null;

function startUno(mode){
  const deck=makeUnoDeck();

  UNO={
    mode,
    deck,
    pile:[],
    hands:[[],[]],
    turn:0,
    color:null,
    winner:null,
    msg:'Player 1 turn'
  };

  for(let i=0;i<7;i++){
    UNO.hands[0].push(UNO.deck.pop());
    UNO.hands[1].push(UNO.deck.pop());
  }

  UNO.pile.push(UNO.deck.pop());
  UNO.color=UNO.pile[0].color;

  renderUno();

  if(mode==='online'){
    const code=prompt('Enter room code:');
    if(!code)return go('games');

    UNO.code=code.toUpperCase();
    UNO_CHANNEL=sb.channel(`uno-${UNO.code}`);

    UNO_CHANNEL.on('broadcast',{event:'state'},({payload})=>{
      if(!UNO)return;
      UNO=Object.assign(UNO,payload);
      renderUno();
    });

    UNO_CHANNEL.subscribe();
  }
}

function makeUnoDeck(){
  const colors=['red','green','blue','yellow'];
  const deck=[];

  colors.forEach(color=>{
    for(let i=0;i<10;i++)deck.push({color,value:String(i)});
    ['Skip','Reverse','Draw2'].forEach(v=>{
      deck.push({color,value:v});
      deck.push({color,value:v});
    });
  });

  for(let i=0;i<4;i++){
    deck.push({color:'wild',value:'Wild'});
    deck.push({color:'wild',value:'Draw4'});
  }

  return deck.sort(()=>Math.random()-.5);
}

function renderUno(){
  const top=UNO.pile[UNO.pile.length-1];

  $('main').innerHTML=`
    <section class="page">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="btn" onclick="go('games')">Games</button>
        <span style="flex:1"></span>
        ${UNO.mode==='online'?`<button class="btn" onclick="leaveUno()">Leave</button>`:''}
      </div>

      <h2>UNO</h2>
      <p class="sub">${esc(UNO.msg)}</p>

      <div class="zf-game" style="margin-top:16px">
        <div class="zf-uno">
          <div class="zf-card ${top.color}">
            ${top.value==='Wild'?'★':top.value}
          </div>

          <div class="zf-hand">
            ${UNO.hands[0].map((card,i)=>{
              const ok=canPlayUno(card);
              return `
                <div class="zf-card ${card.color} ${ok?'ok':''}"
                  onclick="playUno(${i})">
                  ${card.value==='Wild'?'★':card.value}
                </div>
              `;
            }).join('')}
          </div>

          <button class="btn" onclick="drawUno()">Draw card</button>
        </div>
      </div>
    </section>
  `;
}

function canPlayUno(card){
  const top=UNO.pile[UNO.pile.length-1];
  return card.color==='wild'||card.color===top.color||card.value===top.value;
}

function playUno(i){
  const card=UNO.hands[0][i];

  if(!canPlayUno(card))return toast('This card cannot be played.');

  UNO.hands[0].splice(i,1);
  UNO.pile.push(card);

  if(card.color==='wild'){
    const color=prompt('Choose color: red, green, blue, yellow');
    UNO.color=(color||'red').toLowerCase();
  }else{
    UNO.color=card.color;
  }

  if(!UNO.hands[0].length){
    UNO.winner='Player 1';
    UNO.msg='Player 1 won!';
    renderUno();
    return;
  }

  UNO.turn=1;
  UNO.msg='Player 2 turn';

  syncUno();
  renderUno();
}

function drawUno(){
  if(!UNO.deck.length)UNO.deck=makeUnoDeck();

  UNO.hands[0].push(UNO.deck.pop());
  UNO.turn=1;
  UNO.msg='Player 2 turn';

  syncUno();
  renderUno();
}

function syncUno(){
  if(UNO.mode!=='online'||!UNO_CHANNEL)return;

  UNO_CHANNEL.send({
    type:'broadcast',
    event:'state',
    payload:{
      deck:UNO.deck,
      pile:UNO.pile,
      hands:UNO.hands,
      turn:UNO.turn,
      color:UNO.color,
      winner:UNO.winner,
      msg:UNO.msg
    }
  });
}

function leaveUno(){
  if(UNO_CHANNEL){
    sb.removeChannel(UNO_CHANNEL);
    UNO_CHANNEL=null;
  }

  UNO=null;
  go('games');
}
</script>

<script>
/* =========================================================
   MODULE G — CARROM + CHESS
========================================================= */

/* ================= CARROM ================= */
let CARROM=null;

function startCarrom(){
  CARROM={
    coins:[
      {x:.5,y:.5,type:'queen'},
      {x:.42,y:.42,type:'black'},
      {x:.58,y:.42,type:'white'},
      {x:.42,y:.58,type:'white'},
      {x:.58,y:.58,type:'black'}
    ],
    striker:{x:.5,y:.88,vx:0,vy:0},
    angle:0,
    power:0,
    score:{white:0,black:0},
    msg:'Pull back and release'
  };

  renderCarrom();
}

function renderCarrom(){
  $('main').innerHTML=`
    <section class="page">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="btn" onclick="go('games')">Games</button>
      </div>

      <h2>Carrom</h2>
      <p class="sub">${esc(CARROM.msg)}</p>

      <div class="zg2-carrom" style="margin-top:16px">
        <canvas id="carromCanvas" width="500" height="500"></canvas>

        <input class="zg2-slider" type="range" min="0" max="100"
          value="${CARROM.power}"
          oninput="CARROM.power=this.value;drawCarrom()">
      </div>

      <button class="btn pri wide" style="margin-top:16px" onclick="shootCarrom()">
        Shoot
      </button>
    </section>
  `;

  drawCarrom();
}

function drawCarrom(){
  const canvas=$('carromCanvas');
  if(!canvas)return;

  const g=canvas.getContext('2d');
  const W=canvas.width;

  g.clearRect(0,0,W,W);

  /* Board */
  g.fillStyle='#f1d9a0';
  g.fillRect(0,0,W,W);

  /* Center circle */
  g.strokeStyle='#a9622f';
  g.lineWidth=4;
  g.beginPath();
  g.arc(W/2,W/2,70,0,Math.PI*2);
  g.stroke();

  /* Coins */
  CARROM.coins.forEach(coin=>{
    g.beginPath();
    g.arc(coin.x*W,coin.y*W,14,0,Math.PI*2);
    g.fillStyle=
      coin.type==='queen'?'#e11d48'
      :coin.type==='black'?'#111827'
      :'#fff';
    g.fill();
    g.strokeStyle='rgba(0,0,0,.4)';
    g.stroke();
  });

  /* Striker */
  g.beginPath();
  g.arc(CARROM.striker.x*W,CARROM.striker.y*W,18,0,Math.PI*2);
  g.fillStyle='#fff';
  g.fill();
  g.strokeStyle='#333';
  g.stroke();

  /* Aim line */
  if(CARROM.power>0){
    g.beginPath();
    g.moveTo(CARROM.striker.x*W,CARROM.striker.y*W);
    g.lineTo(
      CARROM.striker.x*W+Math.cos(CARROM.angle)*CARROM.power*2,
      CARROM.striker.y*W+Math.sin(CARROM.angle)*CARROM.power*2
    );
    g.strokeStyle='rgba(255,255,255,.8)';
    g.lineWidth=3;
    g.stroke();
  }
}

function shootCarrom(){
  if(CARROM.power<5){
    CARROM.msg='Increase power.';
    renderCarrom();
    return;
  }

  const speed=CARROM.power/12;

  CARROM.striker.vx=Math.cos(CARROM.angle)*speed;
  CARROM.striker.vy=Math.sin(CARROM.angle)*speed;

  CARROM.msg='Shot!';
  moveCarrom();
}

function moveCarrom(){
  const canvas=$('carromCanvas');
  const W=canvas.width;

  const s=CARROM.striker;

  s.x+=s.vx/100;
  s.y+=s.vy/100;

  s.vx*=.97;
  s.vy*=.97;

  if(s.x<.05||s.x>.95)s.vx*=-.7;
  if(s.y<.05||s.y>.95)s.vy*=-.7;

  CARROM.coins.forEach((coin,i)=>{
    const dx=coin.x-s.x;
    const dy=coin.y-s.y;
    const dist=Math.hypot(dx,dy);

    if(dist<.055){
      coin.x+=dx/dist*.08;
      coin.y+=dy/dist*.08;
    }
  });

  drawCarrom();

  if(Math.hypot(s.vx,s.vy)>.01){
    requestAnimationFrame(moveCarrom);
  }else{
    CARROM.msg='Pull back and release';
    renderCarrom();
  }
}

/* ================= CHESS ================= */
let CHESS=null;

function startChess(mode){
  CHESS={
    mode,
    board:initialChessBoard(),
    turn:'w',
    selected:null,
    legal:[],
    winner:null,
    msg:'White turn'
  };

  renderChess();

  if(mode==='bot'){
    setTimeout(botChess,600);
  }
}

function initialChessBoard(){
  const empty=Array(64).fill(null);

  const back=['r','n','b','q','k','b','n','r'];

  back.forEach((p,i)=>{
    empty[i]={type:p,color:'b'};
    empty[56+i]={type:p.toUpperCase(),color:'w'};
  });

  for(let i=0;i<8;i++){
    empty[8+i]={type:'p',color:'b'};
    empty[48+i]={type:'P',color:'w'};
  }

  return empty;
}

function renderChess(){
  $('main').innerHTML=`
    <section class="page">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="btn" onclick="go('games')">Games</button>
      </div>

      <h2>Chess</h2>
      <p class="sub">${esc(CHESS.msg)}</p>

      <div class="zg2-chess" style="margin-top:16px">
        ${CHESS.board.map((piece,i)=>{
          const row=Math.floor(i/8);
          const col=i%8;
          const light=(row+col)%2===0;

          const selected=CHESS.selected===i?'sel':'';
          const movable=CHESS.legal.includes(i)?'move':'';

          return `
            <div class="zg2-square ${light?'light':'dark'} ${selected} ${movable}"
              onclick="tapChess(${i})">
              ${piece?chessSymbol(piece):''}
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}

function chessSymbol(p){
  const map={
    P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',
    p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'
  };

  return map[p.type]||'';
}

function tapChess(i){
  if(!CHESS||CHESS.winner)return;

  const piece=CHESS.board[i];

  if(CHESS.selected!==null&&CHESS.legal.includes(i)){
    moveChess(CHESS.selected,i);
    return;
  }

  if(!piece)return;

  const isWhite=piece.color==='w';

  if(CHESS.turn==='w'&&!isWhite)return;
  if(CHESS.turn==='b'&&isWhite)return;

  CHESS.selected=i;
  CHESS.legal=legalChessMoves(i);
  renderChess();
}

function moveChess(from,to){
  CHESS.board[to]=CHESS.board[from];
  CHESS.board[from]=null;
  CHESS.selected=null;
  CHESS.legal=[];

  CHESS.turn=CHESS.turn==='w'?'b':'w';
  CHESS.msg=CHESS.turn==='w'?'White turn':'Black turn';

  renderChess();

  if(CHESS.mode==='bot'&&CHESS.turn==='b'){
    setTimeout(botChess,600);
  }
}

function legalChessMoves(i){
  const piece=CHESS.board[i];
  if(!piece)return [];

  const moves=[];
  const row=Math.floor(i/8);
  const col=i%8;

  const push=(r,c)=>{
    if(r<0||r>7||c<0||c>7)return;
    const target=CHESS.board[r*8+c];
    if(!target||target.color!==piece.color)moves.push(r*8+c);
  };

  const type=piece.type.toLowerCase();

  if(type==='p'){
    const dir=piece.color==='w'?-1:1;
    push(row+dir,col);
  }

  if(type==='n'){
    [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]
      .forEach(([r,c])=>push(row+r,col+c));
  }

  if(type==='k'){
    for(let r=-1;r<=1;r++){
      for(let c=-1;c<=1;c++){
        if(r||c)push(row+r,col+c);
      }
    }
  }

  if(type==='r'||type==='q'){
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
      let r=row+dr,c=col+dc;
      while(r>=0&&r<8&&c>=0&&c<8){
        push(r,c);
        if(CHESS.board[r*8+c])break;
        r+=dr;c+=dc;
      }
    });
  }

  if(type==='b'||type==='q'){
    [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([dr,dc])=>{
      let r=row+dr,c=col+dc;
      while(r>=0&&r<8&&c>=0&&c<8){
        push(r,c);
        if(CHESS.board[r*8+c])break;
        r+=dr;c+=dc;
      }
    });
  }

  return moves;
}

function botChess(){
  if(!CHESS||CHESS.winner||CHESS.turn!=='b')return;

  const pieces=[];

  CHESS.board.forEach((p,i)=>{
    if(p&&p.color==='b')pieces.push(i);
  });

  const all=[];

  pieces.forEach(i=>{
    legalChessMoves(i).forEach(m=>all.push({from:i,to:m}));
  });

  if(!all.length){
    CHESS.winner='White';
    CHESS.msg='White won!';
    renderChess();
    return;
  }

  const move=all[Math.floor(Math.random()*all.length)];
  moveChess(move.from,move.to);
}
</script>

<script>
/* =========================================================
   MODULE H — MUSIC + WATCH TOGETHER + STATUS
========================================================= */

/* ================= MUSIC ================= */
let MUSIC={
  queue:[],
  current:null,
  playing:false,
  audio:new Audio()
};

function renderMusic(){
  return `
    <div class="zh-music-hero">
      <h2>Music</h2>
      <p>Add a song link and enjoy together.</p>
    </div>

    <div class="field">
      <input id="musicLink" placeholder="Paste direct audio or YouTube link">
    </div>

    <button class="btn pri wide" onclick="addSong()">Add song</button>

    <div class="zh-player" style="margin-top:18px">
      <b id="nowPlaying">Nothing playing</b>

      <div class="zh-controls">
        <button class="zh-btn" onclick="prevSong()">⏮</button>
        <button class="zh-btn main" onclick="toggleMusic()">▶</button>
        <button class="zh-btn" onclick="nextSong()">⏭</button>
        <button class="zh-btn" onclick="shuffleMusic()">🔀</button>
      </div>
    </div>

    <div class="sec"><b>Queue</b></div>
    <div id="musicQueue"><div class="empty">No songs yet.</div></div>
  `;
}

function addSong(){
  const input=$('musicLink');
  const url=input.value.trim();

  if(!url)return toast('Paste a song link.');

  MUSIC.queue.push({
    id:Date.now(),
    url,
    title:url.split('/').pop()||'Song'
  });

  input.value='';
  paintMusicQueue();
  toast('Song added.');
}

function paintMusicQueue(){
  const box=$('musicQueue');
  if(!box)return;

  box.innerHTML=MUSIC.queue.length
    ?MUSIC.queue.map(song=>`
      <div class="zh-song ${MUSIC.current?.id===song.id?'playing':''}"
        onclick="playSong('${esc(song.id)}')">
        <div class="zc-av">🎵</div>
        <div class="zt-info">
          <b>${esc(song.title)}</b>
          <small>Tap to play</small>
        </div>
      </div>
    `).join('')
    :'<div class="empty">No songs yet.</div>';
}

function playSong(id){
  const song=MUSIC.queue.find(s=>String(s.id)===String(id));
  if(!song)return;

  MUSIC.current=song;
  MUSIC.audio.src=song.url;
  MUSIC.audio.play();
  MUSIC.playing=true;

  $('nowPlaying').textContent=song.title;
  paintMusicQueue();
}

function toggleMusic(){
  if(!MUSIC.current)return toast('Add and select a song first.');

  if(MUSIC.playing){
    MUSIC.audio.pause();
    MUSIC.playing=false;
  }else{
    MUSIC.audio.play();
    MUSIC.playing=true;
  }
}

function nextSong(){
  if(!MUSIC.queue.length)return;

  const index=MUSIC.queue.findIndex(s=>s.id===MUSIC.current?.id);
  const next=MUSIC.queue[(index+1)%MUSIC.queue.length];

  playSong(next.id);
}

function prevSong(){
  if(!MUSIC.queue.length)return;

  const index=MUSIC.queue.findIndex(s=>s.id===MUSIC.current?.id);
  const prev=MUSIC.queue[(index-1+MUSIC.queue.length)%MUSIC.queue.length];

  playSong(prev.id);
}

function shuffleMusic(){
  MUSIC.queue.sort(()=>Math.random()-.5);
  paintMusicQueue();
  toast('Shuffled.');
}

/* ================= WATCH TOGETHER ================= */
let WATCH=null;
let WATCH_CHANNEL=null;

function startWatch(){
  const url=prompt('Paste YouTube or direct video link:');
  if(!url)return;

  WATCH={
    url,
    host:true,
    playing:false,
    time:0
  };

  renderWatch();

  const code=prompt('Enter room code to sync:');
  if(!code)return;

  WATCH.code=code.toUpperCase();
  WATCH_CHANNEL=sb.channel(`watch-${WATCH.code}`);

  WATCH_CHANNEL.on('broadcast',{event:'sync'},({payload})=>{
    WATCH.playing=payload.playing;
    WATCH.time=payload.time;

    const video=$('watchVideo');
    if(video){
      video.currentTime=payload.time;
      payload.playing?video.play():video.pause();
    }
  });

  WATCH_CHANNEL.subscribe();
}

function renderWatch(){
  $('main').innerHTML=`
    <section class="page">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="btn" onclick="go('games')">Back</button>
      </div>

      <p class="sub">Watch the same video in sync.</p>

      <div class="zh-watch" style="margin-top:16px">
        <div class="zh-video">
          <video id="watchVideo" controls src="${esc(WATCH.url)}"></video>
        </div>

        <button class="btn pri wide" style="margin-top:14px" onclick="syncWatch()">
          Sync with friend
        </button>
      </div>
    </section>
  `;

  const video=$('watchVideo');

  video.onplay=()=>syncWatch(true);
  video.onpause=()=>syncWatch(false);
}

function syncWatch(state){
  if(!WATCH||!WATCH_CHANNEL)return;

  const video=$('watchVideo');

  WATCH.playing=state??!video.paused;
  WATCH.time=video.currentTime;

  WATCH_CHANNEL.send({
    type:'broadcast',
    event:'sync',
    payload:{
      playing:WATCH.playing,
      time:WATCH.time
    }
  });
}

/* ================= STATUS ================= */
let STATUS=[];

function renderStatus(){
  return `
    <h2>Status</h2>
    <p class="sub">Share photo or video status.</p>

    <button class="btn pri wide" style="margin-top:16px" onclick="createStatus()">
      Create status
    </button>

    <div id="statusList"><div class="empty">No status yet.</div></div>
  `;
}

function createStatus(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*,video/*';

  input.onchange=async()=>{
    const file=input.files[0];
    if(!file)return;

    toast('Uploading status…');

    const path=`status/${S.user.id}/${Date.now()}_${file.name}`;
    const {error}=await sb.storage.from('BK').upload(path,file);

    if(error)return toast('Status upload failed.');

    const {data:urlData}=await sb.storage.from('BK').getPublicUrl(path);

    const status={
      id:Date.now(),
      userid:S.user.id,
      url:urlData.publicUrl,
      type:file.type.startsWith('video')?'video':'image',
      createdat:new Date().toISOString()
    };

    STATUS.unshift(status);
    paintStatus();
    toast('Status posted.');
  };

  input.click();
}

function paintStatus(){
  const box=$('statusList');
  if(!box)return;

  box.innerHTML=STATUS.length
    ?STATUS.map(s=>`
      <div class="zt-item" onclick="viewStatus('${esc(s.id)}')">
        <div class="zc-av zh-status-ring">${initial(S.me.displayname)}</div>
        <div class="zt-info">
          <b>${esc(S.me.displayname)}</b>
          <small>${s.type==='video'?'Video status':'Photo status'}</small>
        </div>
      </div>
    `).join('')
    :'<div class="empty">No status yet.</div>';
}

function viewStatus(id){
  const status=STATUS.find(s=>String(s.id)===String(id));
  if(!status)return;

  let viewer=$('statusViewer');

  if(!viewer){
    viewer=document.createElement('div');
    viewer.id='statusViewer';
    viewer.className='zh-status-viewer';
    document.body.appendChild(viewer);
  }

  viewer.innerHTML=`
    <div class="zh-status-bars"><div class="zh-status-bar"><i></i></div></div>

    <div class="zh-status-media">
      ${status.type==='video'
        ?`<video src="${esc(status.url)}" controls autoplay></video>`
        :`<img src="${esc(status.url)}">`
      }
    </div>

    <button class="btn wide" style="margin:16px" onclick="closeStatus()">
      Close
    </button>
  `;

  viewer.classList.add('on');
}

function closeStatus(){
  $('statusViewer')?.classList.remove('on');
}

/* ---------- SAVE PROFILE ---------- */
async function saveProfile(){
  const name=$('setName').value.trim();
  const username=$('setUsername').value.trim().toLowerCase();

  if(name.length<2)return toast('Name needs 2+ letters.');
  if(!/^[a-z0-9]{3,20}$/.test(username))return toast('Invalid username.');

  const {data,error}=await sb.from('profiles')
    .update({displayname:name,username})
    .eq('id',S.user.id)
    .select()
    .maybeSingle();

  if(error)return toast('Could not save profile.');

  S.me=data;
  toast('Profile updated.');
  go('settings');
}

/* ---------- LOGOUT ---------- */
async function logout(){
  await sb.from('profiles')
    .update({online:false,lastseen:new Date().toISOString()})
    .eq('id',S.user.id);

  await sb.auth.signOut();

  S.user=null;
  S.me=null;

  location.reload();
}

/* ---------- ADMIN PANEL ---------- */
function openAdmin(){
  sb.from('profiles')
    .select('*')
    .order('lastseen',{ascending:false})
    .limit(100)
    .then(({data})=>{
      const users=data||[];

      openModal(`
        <h3>Admin panel</h3>
        <p class="sub">${users.length} users</p>

        <div style="margin-top:16px">
          ${users.map(u=>`
            <div class="zi-admin-user">
              <div class="zc-av">${esc(initial(u.displayname||u.username))}</div>
              <div class="zi-info">
                <b>${esc(u.displayname||u.username)}</b>
                <small>@${esc(u.username)} · ${u.online?'Online':'Offline'}</small>
              </div>
              <button class="btn red" onclick="blockUser('${esc(u.id)}')">
                Block
              </button>
            </div>
          `).join('')}
        </div>

        <button class="btn wide" style="margin-top:16px" onclick="closeModal()">
          Close
        </button>
      `);
    });
}

async function blockUser(id){
  const {error}=await sb.from('appban').upsert({
    userid:id,
    name:'User'
  });

  if(error)return toast('Could not block user.');
  toast('User blocked.');
}

/* ---------- ADMIN MEDIA LIBRARY ---------- */
function addLibraryItem(){
  const title=$('libTitle').value.trim();
  const url=$('libUrl').value.trim();

  if(!url)return toast('Paste a direct media link.');

  LIBRARY.unshift({
    id:Date.now(),
    title:title||'Media',
    url,
    type:/\.(mp3|wav|m4a|ogg)(\?|$)/i.test(url)?'audio':'video'
  });

  localStorage.setItem('znLibrary',JSON.stringify(LIBRARY));

  $('libTitle').value='';
  $('libUrl').value='';

  renderLibrary();
  toast('Media added.');
}

function renderLibrary(){
  const box=$('libraryList');
  if(!box)return;

  box.innerHTML=LIBRARY.length
    ?LIBRARY.map(item=>`
      <div class="zi-media">
        <div class="zi-media-icon">${item.type==='audio'?'🎵':'🎬'}</div>
        <div class="zi-info">
          <b>${esc(item.title)}</b>
          <small>${item.type==='audio'?'Audio':'Video'}</small>
        </div>
        <button class="zc-icon" onclick="playLibraryItem('${esc(item.id)}')">▶</button>
        <button class="zc-icon" onclick="downloadLibraryItem('${esc(item.id)}')">⬇</button>
      </div>
    `).join('')
    :'<div class="empty">No media added yet.</div>';
}

function playLibraryItem(id){
  const item=LIBRARY.find(x=>String(x.id)===String(id));
  if(!item)return;

  openModal(`
    <h3>${esc(item.title)}</h3>
    <div style="margin:16px 0">
      ${item.type==='audio'
        ?`<audio controls autoplay style="width:100%"><source src="${esc(item.url)}"></audio>`
        :`<video controls autoplay style="width:100%;border-radius:18px"><source src="${esc(item.url)}"></video>`
      }
    </div>
    <button class="btn pri wide" onclick="downloadLibraryItem('${esc(item.id)}')">Download</button>
    <button class="btn wide" style="margin-top:10px" onclick="closeModal()">Close</button>
  `);
}

function downloadLibraryItem(id){
  if(!isAdmin())return toast('Download is admin only.');

  const item=LIBRARY.find(x=>String(x.id)===String(id));
  if(!item)return;

  const a=document.createElement('a');
  a.href=item.url;
  a.download=item.title||'media';
  a.click();

  toast('Download started.');
}

    document.querySelectorAll('img:not([loading])').forEach(img=>{
      img.loading='lazy';
      img.decoding='async';
    });

  observer.observe(document.body,{
    childList:true,
    subtree:true
  });

  window.addEventListener('error',e=>{
    console.warn('[ZNEXORA]',e.message);
  });

  window.addEventListener('unhandledrejection',e=>{
    console.warn('[ZNEXORA]',e.reason);
  });
})();

<script>

const ZN_PAGE_ROUTES={
  games:()=>startGamesHub(),
  carrom:()=>startCarrom(),
  chess:()=>startChess('local'),
  music:()=>{ $('main').innerHTML=`<section class="page">${renderMusic()}</section>`; paintMusicQueue(); },

  settings:()=>{ $('main').innerHTML=`<section class="page">${renderSettings()}</section>`; renderLibrary(); }
};

/* Wrap original go() without breaking old pages */
const _znGo=window.go;
window.go=function(page){
  if(ZN_PAGE_ROUTES[page]){
    setActiveNav?.(page);
    ZN_PAGE_ROUTES[page]();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  _znGo?.(page);
};

/* Home quick actions */
setTimeout(()=>{
  document.querySelectorAll('[data-go]').forEach(el=>{
    if(!el.dataset.znBound){
      el.dataset.znBound='1';
      el.addEventListener('click',()=>go(el.dataset.go));
    }
  });
},300);
</script>

<style>
/* Heavy animations off — instant clean UI */
*,
*::before,
*::after{
  animation:none !important;
  transition:none !important;
}

/* Old stacked-card swipe animation off */
#nxStk2,
#nxStk3{
  display:none !important;
}
</style>

<script>
/* Safe navigation: agar naya go() fail ho to purana chalao */
(function(){
  const oldGo = window.go;

  window.go = function(page){
    try{
      if(typeof oldGo === 'function'){
        return oldGo.call(this, page);
      }
    }catch(e){
      console.warn('[ZNEXORA] go failed:', page, e);
    }

    /* Fallback: basic pages */
    const map={
      home:'renderHome',
      recent:'renderRecent',
      connect:'renderConnect',
      games:'renderGames',
      settings:'renderSettings'
    };

    const fn=window[map[page]];
    if(typeof fn==='function'){
      try{
        document.querySelector('main').innerHTML =
          `<section class="pg">${fn()}</section>`;
      }catch(e){
        console.warn('[ZNEXORA] page render failed:', page, e);
      }
    }
  };

  /* Nav buttons ko dobara bind karo */
  document.querySelectorAll('nav button').forEach(b=>{
    if(b.dataset.znFixed)return;
    b.dataset.znFixed='1';

    b.addEventListener('click',()=>{
      const p=b.dataset.p;
      if(p) go(p);
    });
  });

  /* Error dikhane ke liye */
  window.addEventListener('error',e=>{
    console.error('[ZNEXORA ERROR]',e.message);
  });
})();
</script>
