<script>
/* ============ PART B: LUDO v2 (canvas, 2-4 players) ============ */
CanvasRenderingContext2D.prototype.roundRect||(CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)});
const SEATS={2:["red","yellow"],3:["red","green","yellow"],4:["red","green","yellow","blue"]};
const OFF=[[0,0],[-.22,-.18],[.22,-.18],[-.22,.2],[.22,.2]];
let CV=null,CTX=null,BG=null,RAF=0,DPR=1,LB=[];
const shade=(hex,t)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);return`rgb(${Math.round(r+(f-r)*a)},${Math.round(g+(f-g)*a)},${Math.round(b+(f-b)*a)})`};
const xyAt=(pl,i,p)=>{const c=LUDO_COLORS[pl.color];return p<0?BASE2[pl.color][i]:p<=50?TRACK2[(c.start+p)%52]:p<FINISH?c.homeCells[p-51]:FIN[pl.color]};
const isBot=()=>LUDO.mode==="robot"&&LUDO.turn>0;

/* ---------- static board ---------- */
function paintBoard(W){
  BG=document.createElement("canvas");BG.width=BG.height=Math.round(W*DPR);
  const g=BG.getContext("2d");g.scale(DPR,DPR);const S=W/15;
  g.fillStyle="#f4ecd8";g.fillRect(0,0,W,W);
  for(const[k,[r,c]]of Object.entries(YARD)){
    const col=LUDO_COLORS[k].color,x=c*S,y=r*S;
    let gr=g.createLinearGradient(x,y,x+6*S,y+6*S);gr.addColorStop(0,shade(col,.28));gr.addColorStop(1,shade(col,-.25));
    g.fillStyle=gr;g.fillRect(x,y,6*S,6*S);
    g.save();g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=S*.5;g.shadowOffsetY=S*.12;g.fillStyle="#fbf6ea";g.beginPath();g.roundRect(x+S,y+S,4*S,4*S,S*.7);g.fill();g.restore();
    BASE2[k].forEach(([wr,wc])=>{const cx=(wc+.5)*S,cy=(wr+.5)*S,rg=g.createRadialGradient(cx,cy-S*.1,S*.05,cx,cy,S*.5);
      rg.addColorStop(0,"rgba(0,0,0,.06)");rg.addColorStop(1,"rgba(0,0,0,.38)");g.fillStyle=rg;g.beginPath();g.arc(cx,cy,S*.5,0,7);g.fill();
      g.strokeStyle=shade(col,.15);g.lineWidth=S*.07;g.stroke()});
  }
  const tile=(r,c,a,b)=>{const x=c*S+.5,y=r*S+.5,w=S-1,gr=g.createLinearGradient(x,y,x,y+w);gr.addColorStop(0,a);gr.addColorStop(1,b);
    g.fillStyle=gr;g.fillRect(x,y,w,w);g.strokeStyle="rgba(70,45,20,.28)";g.lineWidth=1;g.strokeRect(x,y,w,w);g.fillStyle="rgba(255,255,255,.55)";g.fillRect(x,y,w,1.5)};
  const star=(cx,cy,R,f)=>{g.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,d=k%2?R*.45:R;g.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}g.closePath();g.fillStyle=f;g.fill()};
  const startOf={};Object.entries(LUDO_COLORS).forEach(([k,v])=>startOf[v.start]=k);
  TRACK2.forEach(([r,c],i)=>{const k=startOf[i];
    if(k){const col=LUDO_COLORS[k].color;tile(r,c,shade(col,.25),shade(col,-.12))}else tile(r,c,"#fffdf6","#ebe0c8");
    if(SAFE.has(i))star((c+.5)*S,(r+.5)*S,S*.3,k?"rgba(255,255,255,.9)":"#d9a21b")});
  Object.values(LUDO_COLORS).forEach(v=>v.homeCells.forEach(([r,c])=>tile(r,c,shade(v.color,.25),shade(v.color,-.12))));
  const P=(a,b,col)=>{const gr=g.createLinearGradient(6*S,6*S,9*S,9*S);gr.addColorStop(0,shade(col,.3));gr.addColorStop(1,shade(col,-.2));g.fillStyle=gr;g.beginPath();g.moveTo(a[0]*S,a[1]*S);g.lineTo(b[0]*S,b[1]*S);g.lineTo(7.5*S,7.5*S);g.closePath();g.fill();g.strokeStyle="rgba(0,0,0,.25)";g.lineWidth=1;g.stroke()};
  P([6,6],[6,9],LUDO_COLORS.green.color);P([9,6],[9,9],LUDO_COLORS.blue.color);P([6,6],[6,9],LUDO_COLORS.green.color);
  P([6,9],[9,9],LUDO_COLORS.yellow.color);P([6,6],[6,9],LUDO_COLORS.green.color);P([6,6],[9,6],LUDO_COLORS.red.color);
  const hub=g.createRadialGradient(7.4*S,7.4*S,S*.05,7.5*S,7.5*S,S*.5);hub.addColorStop(0,"#fff");hub.addColorStop(.6,"#e9dcc0");hub.addColorStop(1,"#b89a5a");
  g.fillStyle=hub;g.beginPath();g.arc(7.5*S,7.5*S,S*.42,0,7);g.fill();g.strokeStyle="#d8a94a";g.lineWidth=S*.08;g.stroke();
  const v=g.createRadialGradient(W/2,W/2,W*.35,W/2,W/2,W*.72);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(60,30,0,.3)");g.fillStyle=v;g.fillRect(0,0,W,W);
  const gl=g.createLinearGradient(0,0,W,W);gl.addColorStop(0,"rgba(255,255,255,.25)");gl.addColorStop(.45,"rgba(255,255,255,0)");g.fillStyle=gl;g.fillRect(0,0,W,W);
}
/* ---------- pawn ---------- */
function pawn(g,x,y,z,col,S,sc){
  const r=S*.3*sc;
  g.fillStyle=`rgba(0,0,0,${Math.max(.12,.36-z*.4)})`;g.beginPath();g.ellipse(x,y+r*.55,r*(1.1-z*.5),r*.42,0,0,7);g.fill();
  y-=z*S;const bh=r*2.1,b=y+r*.4;
  const gr=g.createLinearGradient(x-r,0,x+r,0);gr.addColorStop(0,shade(col,-.45));gr.addColorStop(.35,col);gr.addColorStop(.5,shade(col,.45));gr.addColorStop(.7,col);gr.addColorStop(1,shade(col,-.5));
  g.fillStyle=gr;g.beginPath();g.moveTo(x-r,b);g.quadraticCurveTo(x-r*.5,b-bh*.3,x-r*.3,b-bh*.72);g.lineTo(x+r*.3,b-bh*.72);g.quadraticCurveTo(x+r*.5,b-bh*.3,x+r,b);g.ellipse(x,b,r,r*.36,0,0,Math.PI);g.closePath();g.fill();
  g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=S*.045;g.beginPath();g.ellipse(x,b-bh*.72,r*.3,r*.1,0,0,7);g.stroke();
  const hy=b-bh*.72-r*.42,hr=r*.52,hg=g.createRadialGradient(x-hr*.35,hy-hr*.4,hr*.1,x,hy,hr);
  hg.addColorStop(0,"#fff");hg.addColorStop(.25,shade(col,.5));hg.addColorStop(1,shade(col,-.4));g.fillStyle=hg;g.beginPath();g.arc(x,hy,hr,0,7);g.fill();
}
const puff=(x,y,col)=>{for(let k=0;k<20;k++){const a=Math.random()*6.28,s=.04+Math.random()*.1;LUDO.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.03,g:.008,life:1,r:3+Math.random()*2.5,col,rot:0})}};
const confetti=()=>{const cs=["#ef5368","#3fc984","#ffc93c","#4a9dff","#fff"];for(let k=0;k<110;k++)LUDO.parts.push({x:Math.random()*15,y:-Math.random()*3,vx:(Math.random()-.5)*.05,vy:.03+Math.random()*.06,g:.0015,life:4,col:cs[k%5],sq:1,rot:Math.random()*6})};

/* ---------- render loop ---------- */
function frame(){
  const L=LUDO;if(!L||!CV||!CV.isConnected){RAF=0;return}
  const W=CV.clientWidth,S=W/15,g=CTX,t=performance.now()/1000,pl=cur();
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,W);
  if(L.shake>0){g.translate((Math.random()-.5)*L.shake*.5,(Math.random()-.5)*L.shake*.5);L.shake--}
  g.drawImage(BG,0,0,W,W);
  if(!L.winner){const[r,c]=YARD[pl.color],cc=LUDO_COLORS[pl.color].color;g.save();g.strokeStyle=cc;g.globalAlpha=.5+.4*Math.sin(t*4);g.lineWidth=S*.16;g.shadowColor=cc;g.shadowBlur=S;g.strokeRect(c*S+S*.08,r*S+S*.08,6*S-S*.16,6*S-S*.16);g.restore()}
  const can=!L.busy&&!L.rolling&&!!L.dice&&isHuman();
  const groups={};L.players.forEach((p,pi)=>p.tokens.forEach((q,i)=>{const xy=xyAt(p,i,q),k=xy.join("_");(groups[k]=groups[k]||[]).push([pi,i,xy])}));
  const list=[];
  Object.values(groups).forEach(gr=>gr.forEach(([pi,i,xy],n)=>{
    const o=gr.length>1?OFF[Math.min(n+1,4)]:OFF[0],sc=gr.length>1?.8:1,s=L.spr[pi][i],tx=xy[1]+.5+o[0],ty=xy[0]+.5+o[1];
    s.x+=(tx-s.x)*(s.slow?.14:.34);s.y+=(ty-s.y)*(s.slow?.14:.34);
    if(s.slow&&Math.abs(tx-s.x)+Math.abs(ty-s.y)<.05)s.slow=false;
    if(s.vz||s.z){s.z+=s.vz;s.vz-=.036;if(s.z<=0){s.z=0;s.vz=0}}
    list.push({pi,i,s,sc,mov:can&&L.turn===pi&&canMove(L.players[pi].tokens[i],L.dice)})}));
  list.forEach(a=>{if(!a.mov)return;const q=xyAt(pl,a.i,pl.tokens[a.i]===-1?0:pl.tokens[a.i]+L.dice),col=LUDO_COLORS[pl.color].color;
    g.save();g.setLineDash([4,3]);g.strokeStyle=col;g.fillStyle=col+"44";g.lineWidth=2;g.globalAlpha=.6+.4*Math.sin(t*6);g.beginPath();g.arc((q[1]+.5)*S,(q[0]+.5)*S,S*.34,0,7);g.fill();g.stroke();g.restore()});
  list.sort((a,b)=>a.s.y-b.s.y).forEach(a=>{
    const col=LUDO_COLORS[L.players[a.pi].color].color,x=a.s.x*S,y=a.s.y*S;
    if(a.mov){g.save();g.strokeStyle="#fff";g.shadowColor=col;g.shadowBlur=12;g.globalAlpha=.65+.35*Math.sin(t*7);g.lineWidth=2.5;g.beginPath();g.ellipse(x,y+S*.2,S*.38,S*.15,0,0,7);g.stroke();g.restore()}
    pawn(g,x,y,a.s.z+(a.mov&&!a.s.z?.05+.07*Math.abs(Math.sin(t*6)):0),col,S,a.sc)});
  L.parts=L.parts.filter(q=>(q.life-=.02)>0);
  L.parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.rot+=.2;g.globalAlpha=Math.min(1,q.life*1.5);g.fillStyle=q.col;
    if(q.sq){g.save();g.translate(q.x*S,q.y*S);g.rotate(q.rot);g.fillRect(-3,-5,6,10);g.restore()}else{g.beginPath();g.arc(q.x*S,q.y*S,q.r,0,7);g.fill()}});
  g.globalAlpha=1;RAF=requestAnimationFrame(frame);
}
function setupCanvas(){
  CV=$("ludoCv");CTX=CV.getContext("2d");
  const fit=()=>{if(!CV.isConnected)return;DPR=Math.min(devicePixelRatio||1,2.5);const W=CV.clientWidth;CV.width=CV.height=Math.round(W*DPR);paintBoard(W)};
  fit();new ResizeObserver(fit).observe(CV);
  CV.addEventListener("pointerdown",e=>{
    const L=LUDO;if(!L||L.winner||L.busy||L.rolling||!L.dice||!isHuman())return;
    const r=CV.getBoundingClientRect(),S=r.width/15,x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S,pl=cur();let best=null,bd=.8;
    pl.tokens.forEach((p,i)=>{if(!canMove(p,L.dice))return;const s=L.spr[L.turn][i],d=Math.hypot(s.x-x,s.y-.3-y);if(d<bd){bd=d;best=i}});
    if(best!==null)selectLudoToken(pl.color,best)});
  if(!RAF)RAF=requestAnimationFrame(frame);
}

/* ---------- game setup / UI ---------- */
function openLudoMenu(){
  openModal(`<div class="modal-title">Ludo</div><div class="modal-sub">Dost ke saath online khelo</div>
   <button class="btn primary-btn" style="width:100%;margin-bottom:10px" onclick="hostLudo()">🌐 Online room (2-4 log)</button>
   <div style="display:flex;gap:8px;margin-bottom:12px"><input id="roomCode" class="pf-input" style="margin:0;flex:1;min-width:0;text-transform:uppercase" maxlength="6" placeholder="Room code" autocapitalize="characters"><button class="btn" onclick="joinLudo($('roomCode').value.trim().toUpperCase())">Join</button></div>
   <div style="color:var(--muted);font-size:12px;margin:0 0 6px 4px">Robot ke saath</div>
   <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">${[1,2,3].map(n=>`<button class="btn" onclick="startLudo('robot',null,null,${n+1})">🤖 ×${n}</button>`).join("")}</div>
   <button class="btn" style="width:100%" onclick="startLudo('local')">👥 Ek phone par 2 players</button>`);
}
function startLudo(mode="robot",names,me=null,n){
  closeModal();const cnt=names?names.length:(mode==="robot"?(n||2):2);
  const nm=names||(mode==="robot"?["You","Robot","Robot 2","Robot 3"].slice(0,cnt):["Player 1","Player 2"]);
  LUDO={mode,me,n:cnt,players:SEATS[cnt].map((c,i)=>({name:nm[i],color:c,tokens:[-1,-1,-1,-1]})),turn:0,dice:null,rolling:false,busy:false,winner:null,sixes:0,message:"Game shuru!",cubeN:0,parts:[],shake:0};
  LUDO.spr=LUDO.players.map(p=>p.tokens.map((_,i)=>{const xy=xyAt(p,i,-1);return{x:xy[1]+.5,y:xy[0]+.5,z:0,vz:0}}));
  NEXORA.page="games";renderLudo();
}
function renderLudo(){
  const L=LUDO;
  $("main").innerHTML=`<section class="page" style="padding-bottom:20px"><div class="ludo-wrap">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><button class="btn" onclick="leaveLudo()">‹ Games</button>
    ${L.mode==="online"?`<div class="btn" style="display:grid;place-items:center">🌐 ${LROOM?.code||""}</div>`:`<button class="btn" onclick="startLudo(LUDO.mode,null,null,LUDO.n)">↻ Restart</button>`}</div>
   <div id="turnBanner"><i></i><span></span></div>
   <div class="ludo-frame" style="position:relative"><canvas id="ludoCv"></canvas>
    <div class="ludo-bar"><div style="min-width:0"><div id="lMsg" style="font-weight:850"></div><div id="lHint" style="color:var(--muted);font-size:12px;margin-top:3px"></div></div>
     <button id="ludoDice" class="cubewrap" onclick="rollLudoDice()"><div class="cube" id="cube">${[1,2,3,4,5,6].map(n=>`<div class="face f${n}">${pipsHtml(n)}</div>`).join("")}</div></button></div>
    <div class="pcards">${L.players.map((p,i)=>`<div class="pcard" id="pc-${i}" style="--gc:${LUDO_COLORS[p.color].color}"><em></em><div style="min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name)}${L.me===i?" (You)":""}</div><div id="pcs-${i}"></div></div></div>`).join("")}</div>
   </div></div></section>`;
  setupCanvas();updateLudo();
}
let lastKey=null;
function updateLudo(){
  const L=LUDO;if(!L||!$("turnBanner"))return;
  const pl=cur(),tb=$("turnBanner"),key=L.winner?"w":L.turn;
  tb.style.setProperty("--tb",LUDO_COLORS[pl.color].color);
  tb.querySelector("span").textContent=L.winner?"🏆 "+L.winner+" jeet gaya!":(L.mode!=="local"&&isHuman()?"Aapki baari":pl.name+" ki baari");
  if(key!==lastKey){lastKey=key;tb.classList.remove("swap");void tb.offsetWidth;tb.classList.add("swap")}
  L.players.forEach((p,i)=>{$("pc-"+i).classList.toggle("on",i===L.turn&&!L.winner);const n=p.tokens.filter(x=>x===FINISH).length;$("pcs-"+i).innerHTML=`<div class="hdots">${[0,1,2,3].map(k=>`<s class="${k<n?"on":""}"></s>`).join("")}</div>`});
  const rd=!L.rolling&&!L.busy&&!L.dice&&!L.winner&&isHuman(),d=$("ludoDice");
  d.classList.toggle("ready",rd);d.classList.toggle("off",!rd&&!L.rolling);
  $("lMsg").textContent=L.message;
  $("lHint").textContent=L.winner?"Game khatam":L.rolling?"Rolling…":!isHuman()?pl.name+" ki baari…":L.dice?"Chamakti gotti chuno":"Dice par tap karo";
}

/* ---------- rules / turns ---------- */
function rollLudoDice(){
  if(!LUDO||LUDO.winner||LUDO.rolling||LUDO.busy||LUDO.dice||!isHuman())return;
  const d=rnd6();lsend({t:"roll",d});animateRoll(d);
}
async function animateRoll(d){
  const L=LUDO;L.rolling=true;L.dice=null;updateLudo();spinCube(d);sfx(180,.8,"triangle",.04);navigator.vibrate?.(25);
  await sleep(950);if(LUDO!==L)return;
  L.rolling=false;L.dice=d;const pl=cur();
  L.sixes=d===6?L.sixes+1:0;L.message=`${pl.name} ne ${d} roll kiya`;sfx(d===6?760:420,.12);
  if(L.sixes>=3){L.sixes=0;L.dice=null;L.message=pl.name+": teen 6, turn gaya";updateLudo();await sleep(900);return endTurn()}
  const mv=getMovable();updateLudo();
  if(!mv.length){await sleep(800);L.dice=null;return d===6?again(pl):endTurn()}
  if(isBot()){await sleep(650);return commit(pl,robotPick(pl,mv,d))}
  if(isHuman()&&mv.length===1){await sleep(450);playMove(mv[0])}
}
function robotPick(pl,mv,d){
  const foes=LUDO.players.filter(p=>p!==pl);let best=mv[0],bs=-1;
  mv.forEach(i=>{const p=pl.tokens[i],n=p===-1?0:p+d;let s=n;
    if(p===-1)s+=60;if(n===FINISH)s+=90;
    if(n<=50){const a=(LUDO_COLORS[pl.color].start+n)%52;
      if(SAFE.has(a))s+=25;else if(foes.some(f=>f.tokens.some(q=>q>=0&&q<=50&&(LUDO_COLORS[f.color].start+q)%52===a)))s+=120}
    if(s>bs){bs=s;best=i}});
  return best;
}
function selectLudoToken(color,i){
  const L=LUDO;if(!L||L.winner||L.busy||L.rolling||!L.dice||!isHuman())return;
  const pl=cur();if(pl.color!==color||!canMove(pl.tokens[i],L.dice))return;playMove(i);
}
function playMove(i){lsend({t:"mv",i});return commit(cur(),i)}
async function commit(pl,i){
  const L=LUDO;L.busy=true;const d=L.dice,old=pl.tokens[i],s=L.spr[L.players.indexOf(pl)][i];
  const hop=()=>{s.vz=.18;sfx(300+Math.random()*80,.05,"square",.03)};
  if(old===-1){pl.tokens[i]=0;hop();await sleep(300)}
  else for(let p=old+1;p<=old+d;p++){pl.tokens[i]=p;hop();await sleep(190);if(LUDO!==L)return}
  let cut=false;const p=pl.tokens[i];
  if(p>=0&&p<=50){const a=(LUDO_COLORS[pl.color].start+p)%52;
    if(!SAFE.has(a))L.players.forEach((o,oi)=>{if(o===pl)return;o.tokens=o.tokens.map((q,qi)=>{
      if(q>=0&&q<=50&&(LUDO_COLORS[o.color].start+q)%52===a){cut=true;const t=L.spr[oi][qi];puff(t.x,t.y,LUDO_COLORS[o.color].color);t.slow=true;t.vz=.3;return -1}return q})})}
  if(cut){toast("Gotti kat gayi! 💥");sfx(120,.4,"sawtooth",.07);L.shake=14;await sleep(480)}
  L.dice=null;L.busy=false;
  if(pl.tokens.every(x=>x===FINISH)){
    L.winner=pl.name;L.message=pl.name+" jeet gaya! 🏆";confetti();[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.3),k*140));updateLudo();
    $("ludoCv")?.parentElement.insertAdjacentHTML("beforeend",`<div class="confetti" style="border-radius:26px"><div>🏆<br>${escapeHtml(pl.name)} won!<br><button class="btn primary-btn" style="margin-top:16px" onclick="leaveLudo()">Games</button></div></div>`);return;
  }
  updateLudo();(d===6||cut||p===FINISH)?again(pl):endTurn();
}
function botTurn(){const L=LUDO;if(L&&L.mode==="robot"&&L.turn>0&&!L.winner)setTimeout(()=>{if(LUDO===L&&!L.winner&&L.turn>0)animateRoll(rnd6())},850)}
function again(pl){LUDO.dice=null;LUDO.message=pl.name+" ko dobara chance";updateLudo();botTurn()}
function endTurn(){const L=LUDO;L.sixes=0;L.dice=null;let k=0;do{L.turn=(L.turn+1)%L.players.length}while(L.players[L.turn].gone&&++k<8);L.message=cur().name+" ki baari";updateLudo();botTurn()}

/* ---------- online lobby ---------- */
function lsend(m){LROOM?.send({type:"broadcast",event:"g",payload:{...m,from:NEXORA.user.id}})}
async function openRoom(code,host){
  closeRoom();LB=host?[{id:NEXORA.user.id,name:myName()}]:[];
  const ch=sb.channel("ludo-"+code);LROOM=ch;ch.code=code;ch.host=host;
  ch.on("broadcast",{event:"g"},({payload:m})=>onLudoMsg(m));
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
}
function beginOnline(){if(LB.length<2)return;lsend({t:"start",list:LB});startLudo("online",LB.map(x=>x.name),0)}
function showLobby(){
  const code=LROOM?.code||"",n=Math.max(2,LB.length);
  openModal(`<div class="modal-title">Ludo room 🎲</div><div class="modal-sub">2 se 4 log · code dost ko bhejo</div>
   <div class="card" style="padding:16px;text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;margin-bottom:12px">${code}</div>
   ${LB.map((p,i)=>`<div class="pr"><div class="avatar" style="background:${LUDO_COLORS[SEATS[n][i]||"red"].color}">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}${i===0?" (Host)":""}</div></div>`).join("")}
   <div class="modal-actions" style="margin-top:14px"><button class="btn danger" onclick="closeRoom();closeModal()">Cancel</button><button class="btn primary-btn" ${LB.length<2?'disabled style="opacity:.5"':""} onclick="beginOnline()">Start (${LB.length})</button></div>`);
}
function showWaiting(){
  openModal(`<div class="modal-title">Lobby 🎲</div><div class="modal-sub">Host game shuru karega…</div>${LB.map(p=>`<div class="pr"><div class="avatar">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join("")}<button class="btn danger" style="width:100%;margin-top:14px" onclick="closeRoom();closeModal()">Leave</button>`);
}
async function hostLudo(code){code=code||Math.random().toString(36).slice(2,8).toUpperCase();await openRoom(code,true);showLobby()}
async function joinLudo(code){
  if(!code||code.length<4)return toast("Room code daalo.","error");
  await openRoom(code,false);showWaiting();
  let n=0;const iv=setInterval(()=>{if(LUDO?.mode==="online"||++n>12||!LROOM)return clearInterval(iv);lsend({t:"join",name:myName()})},1500);
  lsend({t:"join",name:myName()});
}
function onLudoMsg(m){
  if(m.from===NEXORA.user.id)return;
  const host=LROOM?.host;
  if(m.t==="join"&&host){
    if(LUDO?.mode==="online"){lsend({t:"start",list:LB});return}
    if(!LB.some(x=>x.id===m.from)&&LB.length<4)LB.push({id:m.from,name:m.name});
    lsend({t:"lobby",list:LB});
    if(typeof PENDING!=="undefined"&&PENDING&&PENDING.code===LROOM.code&&LB.length===2)return beginOnline();
    return showLobby();
  }
  if(m.t==="lobby"&&!host&&!LUDO){LB=m.list;return showWaiting()}
  if(m.t==="start"&&!host&&!LUDO){LB=m.list;const me=LB.findIndex(x=>x.id===NEXORA.user.id);if(me>=0)startLudo("online",LB.map(x=>x.name),me);return}
  if(m.t==="leave"&&!LUDO&&host){LB=LB.filter(x=>x.id!==m.from);return showLobby()}
  if(!LUDO||LUDO.mode!=="online")return;
  const seat=LB.findIndex(x=>x.id===m.from);if(seat<0)return;
  if(m.t==="roll"&&seat===LUDO.turn&&!LUDO.rolling&&!LUDO.dice&&!LUDO.busy)animateRoll(m.d);
  if(m.t==="mv"&&seat===LUDO.turn)(async()=>{while(LUDO&&LUDO.rolling)await sleep(50);if(LUDO&&LUDO.dice&&!LUDO.busy)commit(cur(),m.i)})();
  if(m.t==="leave"){
    const L=LUDO;L.players[seat].gone=true;toast(L.players[seat].name+" ne game chhod diya");
    const alive=L.players.filter(p=>!p.gone);
    if(alive.length<2&&!L.winner){L.winner=alive[0]?.name||"—";L.message="Baaki sab chale gaye";updateLudo()}
    else if(L.turn===seat&&!L.busy&&!L.rolling)endTurn();
  }
}
</script>

<script>
/* ============ PART C: UNO ============ */
const UCOL={r:"#e5384f",y:"#f3b92b",g:"#2fb36a",b:"#2f7fe0"},UN={r:"Red",y:"Yellow",g:"Green",b:"Blue"};
let UG=null,UI=null,UCH=null,UB=[],UHOST=false,UVER=0,UAUTO=null;
GN.uno="🃏 UNO";

/* ---------- engine (host par chalta hai) ---------- */
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function uDeck(){let id=0;const d=[];
  for(const c of"rygb"){d.push({id:id++,c,v:"0"});for(let n=1;n<=9;n++)d.push({id:id++,c,v:""+n},{id:id++,c,v:""+n});["s","r","d"].forEach(v=>d.push({id:id++,c,v},{id:id++,c,v}))}
  for(let k=0;k<4;k++)d.push({id:id++,c:"w",v:"w"},{id:id++,c:"w",v:"f"});return shuf(d)}
const uTop=()=>UG.disc[UG.disc.length-1];
function uDraw(){if(!UG.deck.length&&UG.disc.length>1){const t=UG.disc.pop();UG.deck=shuf(UG.disc.splice(0));UG.disc=[t]}return UG.deck.pop()||null}
function uOk(c,hand){if(c.c==="w")return c.v==="w"||!hand.some(x=>x.c===UG.color);return c.c===UG.color||c.v===uTop().v}
const uNext=(f,k=1)=>{const n=UG.seats.length;return((f+UG.dir*k)%n+n)%n};
function uStart(seats){
  const deck=uDeck();seats.forEach(s=>{s.hand=[];s.said=false;for(let i=0;i<7;i++)s.hand.push(deck.pop())});
  let c=deck.pop();while(c.v==="f"){deck.unshift(c);c=deck.pop()}
  UG={seats,deck,disc:[c],color:c.c==="w"?"rygb"[Math.floor(Math.random()*4)]:c.c,dir:1,turn:0,drew:false,drewId:null,winner:null,catch:null,msg:"Game shuru! 🃏"};
  const n=seats.length;
  if(c.v==="s")UG.turn=1%n;
  else if(c.v==="r"){UG.dir=-1;UG.turn=n===2?1:n-1}
  else if(c.v==="d"){for(let i=0;i<2;i++){const x=uDraw();if(x)seats[0].hand.push(x)}UG.turn=1%n}
}
function uPlay(seat,idx,color){
  if(!UG||UG.winner||UG.turn!==seat)return false;
  const me=UG.seats[seat],card=me.hand[idx];if(!card||!uOk(card,me.hand))return false;
  if(UG.drew&&card.id!==UG.drewId)return false;
  me.hand.splice(idx,1);UG.disc.push(card);UG.color=card.c==="w"?(color||"r"):card.c;UG.catch=null;UG.drew=false;UG.drewId=null;
  const nm=card.c==="w"?(card.v==="f"?"Wild +4":"Wild")+" → "+UN[UG.color]:UN[card.c]+" "+({s:"Skip",r:"Reverse",d:"+2"}[card.v]||card.v);
  UG.msg=`${me.name} ne ${nm} khela`;
  if(!me.hand.length){UG.winner=me.name;return uSync()}
  const n=UG.seats.length;let step=1;
  if(card.v==="s")step=2;
  else if(card.v==="r"){UG.dir*=-1;step=n===2?2:1}
  else if(card.v==="d"||card.v==="f"){const v=uNext(seat),k=card.v==="d"?2:4;for(let i=0;i<k;i++){const x=uDraw();if(x)UG.seats[v].hand.push(x)}UG.seats[v].said=false;step=2;UG.msg+=` · ${UG.seats[v].name} +${k}`}
  if(me.hand.length===1&&!me.said)UG.catch={seat,until:Date.now()+4500};
  if(me.hand.length>1)me.said=false;
  UG.turn=uNext(seat,step);return uSync();
}
function uDrawAct(seat){
  if(!UG||UG.winner||UG.turn!==seat||UG.drew)return;
  const me=UG.seats[seat],c=uDraw();UG.catch=null;
  if(!c){UG.msg=me.name+": deck khaali, pass";UG.turn=uNext(seat);return uSync()}
  me.hand.push(c);me.said=false;UG.msg=me.name+" ne card uthaya";
  if(uOk(c,me.hand)){UG.drew=true;UG.drewId=c.id}else{UG.drew=false;UG.drewId=null;UG.turn=uNext(seat);UG.msg+=" · pass"}
  uSync();
}
function uPass(seat){if(UG&&!UG.winner&&UG.turn===seat&&UG.drew){UG.drew=false;UG.drewId=null;UG.msg=UG.seats[seat].name+" ne pass kiya";UG.turn=uNext(seat);uSync()}}
function uSay(seat){const s=UG?.seats[seat];if(!s||UG.winner)return;s.said=true;if(UG.catch&&UG.catch.seat===seat)UG.catch=null;UG.msg=s.name+": UNO! 🔔";uSync()}
function uCatch(by){
  if(!UG||!UG.catch||UG.catch.seat===by||Date.now()>UG.catch.until+800)return;
  const t=UG.seats[UG.catch.seat];for(let i=0;i<2;i++){const x=uDraw();if(x)t.hand.push(x)}
  UG.msg=`${UG.seats[by].name} ne pakad liya! ${t.name} +2 😈`;UG.catch=null;uSync();
}
function uBot(){
  if(!UG||UG.winner)return;const g=UG,s=g.seats[g.turn];if(!s.bot)return;
  setTimeout(()=>{if(UG!==g||g.winner||g.seats[g.turn]!==s)return;
    const seat=g.turn,hand=s.hand,ok=hand.map((c,i)=>[c,i]).filter(([c])=>(!g.drew||c.id===g.drewId)&&uOk(c,hand));
    if(!ok.length)return g.drew?uPass(seat):uDrawAct(seat);
    const cnt={r:0,y:0,g:0,b:0};hand.forEach(c=>{if(c.c!=="w")cnt[c.c]++});
    const nxt=g.seats[uNext(seat)].hand.length;
    ok.sort((a,b)=>sc(b[0])-sc(a[0]));function sc(c){return(c.c==="w"?-5:0)+(["s","r","d"].includes(c.v)?(nxt<=2?6:2):0)+(cnt[c.c]||0)}
    const[c,i]=ok[0],rest=hand.filter(x=>x!==c),col=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][1]?Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]:"rygb"[Math.floor(Math.random()*4)];
    if(hand.length===2&&Math.random()<.9)s.said=true;
    uPlay(seat,i,col);
  },1100+Math.random()*600);
}
function uPub(){return{seats:UG.seats.map(s=>({id:s.id,name:s.name,n:s.hand.length,said:s.said})),top:uTop(),color:UG.color,dir:UG.dir,turn:UG.turn,deck:UG.deck.length,msg:UG.msg,winner:UG.winner,catchSeat:UG.catch?UG.catch.seat:-1,drew:UG.drew,drewId:UG.drewId,ver:++UVER}}
function uSync(){
  const p=uPub();UI.pub=p;UI.hand=UG.seats[UI.me].hand.slice();
  if(UCH){UCH.tx({t:"S",pub:p});UG.seats.forEach((s,i)=>{if(i!==UI.me&&!s.bot)UCH.tx({t:"H",to:s.id,hand:s.hand})})}
  uRender();uBot();
}

/* ---------- UI ---------- */
const ucard=(c,cls="",ex="")=>{const sy={s:"⊘",r:"⇄",d:"+2",w:"★",f:"+4"}[c.v]||c.v;
  return `<div class="uc ${c.c==="w"?"uw":""} ${cls}" style="--cc:${c.c==="w"?"#1b1b25":UCOL[c.c]}" ${ex}><i>${sy}</i><b>${sy}</b><i class="br">${sy}</i></div>`};
const uback=()=>`<div class="uc ub"><b>UNO</b></div>`;
function uRender(){
  if(!UI||NEXORA.page!=="games")return;
  const P=UI.pub,main=$("main");
  if(!P){main.innerHTML=`<section class="page u-page"><div class="chat-empty" style="margin:auto;color:#cfe8dc">🃏<br>Cards bant rahe hain…</div></section>`;return}
  const old=$("uHand")?.scrollLeft||0,me=UI.me,n=P.seats.length,my=P.turn===me&&!P.winner;
  let land=false;if(UI.lastTop!==P.top.id){if(UI.lastTop!==undefined){sfx(P.top.c==="w"?700:420,.1,"square",.04);navigator.vibrate?.(12)}land=true;UI.lastTop=P.top.id}
  if(P.winner&&!UI.won){UI.won=1;[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.3),k*140))}
  if(P.catchSeat>=0&&UI.cv!==P.ver){UI.cv=P.ver;setTimeout(()=>{if(UI&&UI.pub&&UI.pub.ver===UI.cv){UI.pub.catchSeat=-1;uRender()}},4600)}
  const okc=c=>my&&(!P.drew||c.id===P.drewId)&&(c.c==="w"?(c.v==="w"||!UI.hand.some(x=>x.c===P.color)):(c.c===P.color||c.v===P.top.v));
  const opps=[];for(let k=1;k<n;k++)opps.push((me+k)%n);
  const canUno=UI.hand.length>0&&UI.hand.length<=2&&!P.seats[me].said&&!P.winner,showCatch=P.catchSeat>=0&&P.catchSeat!==me;
  main.innerHTML=`<section class="page u-page">
   <div class="u-top"><button class="btn" onclick="leaveUno()">‹ Games</button><div class="u-msg">${escapeHtml(P.msg||"")}</div>${UCH?`<div class="btn" style="display:grid;place-items:center">🌐 ${UCH.code}</div>`:""}</div>
   <div class="u-opps">${opps.map(i=>{const s=P.seats[i];return `<div class="u-op ${P.turn===i&&!P.winner?"on":""}"><div class="avatar" style="width:38px;height:38px">${escapeHtml(initials(s.name))}</div><div style="font-size:12px;font-weight:800;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(s.name)}</div><div class="u-fan">${Array.from({length:Math.min(s.n,8)},()=>"<s></s>").join("")}</div><div class="u-n ${s.n===1?"red":""}">${s.n===1?"UNO!":s.n+" cards"}</div></div>`}).join("")}</div>
   <div class="u-mid"><button class="u-deck" onclick="uAct('draw')" ${my&&!P.drew?"":"disabled"}>${uback()}<small>${P.deck} bache</small></button>
    <div class="u-disc" style="--rc:${UCOL[P.color]}">${ucard(P.top,land?"land":"")}</div><div class="u-dir" style="animation-direction:${P.dir>0?"normal":"reverse"}">⟳</div></div>
   <div class="u-turn" style="color:${UCOL[P.color]}">${P.winner?"":(my?"Aapki baari":escapeHtml(P.seats[P.turn].name)+" ki baari")+" · "+UN[P.color]}</div>
   <div class="u-act">${canUno?`<button class="uno-btn" onclick="uAct('say')">UNO!</button>`:""}${my&&P.drew?`<button class="btn" onclick="uAct('pass')">Pass ➜</button>`:""}${showCatch?`<button class="btn danger" onclick="uAct('catch')">Pakdo! 🫵 ${escapeHtml(P.seats[P.catchSeat].name)}</button>`:""}</div>
   <div id="uHand" class="u-hand ${my?"mine":""}">${UI.hand.map((c,i)=>ucard(c,okc(c)?"ok":(my?"no":""),`onclick="uTap(${i})"`)).join("")}</div>
   ${P.winner?`<div class="confetti" style="z-index:20"><div>🏆<br>${escapeHtml(P.winner)} jeet gaya!<br><button class="btn primary-btn" style="margin-top:16px" onclick="leaveUno()">Games</button></div></div>`:""}
  </section>`;
  $("uHand").scrollLeft=old;
}
function uTap(i){
  const P=UI?.pub;if(!P||P.turn!==UI.me||P.winner)return;const c=UI.hand[i];
  const ok=(!P.drew||c.id===P.drewId)&&(c.c==="w"?(c.v==="w"||!UI.hand.some(x=>x.c===P.color)):(c.c===P.color||c.v===P.top.v));
  if(!ok){navigator.vibrate?.(30);return toast(c.v==="f"?"Wild +4 tab chalta hai jab current rang ka card na ho":P.drew?"Sirf wahi card khelo jo uthaya":"Ye card nahi chalega")}
  if(c.c!=="w")return uSubmit(i,null);
  openModal(`<div class="modal-title">Rang chuno 🎨</div><div class="modal-sub">Agla rang kaunsa?</div><div class="cpick">${Object.entries(UCOL).map(([k,v])=>`<button style="background:${v}" onclick="closeModal();uSubmit(${i},'${k}')">${UN[k]}</button>`).join("")}</div>`);
}
function uSubmit(i,col){if(UI.host)uPlay(UI.me,i,col);else UCH?.tx({t:"A",a:"play",i,col})}
function uAct(a){
  if(!UI)return;
  if(UI.host){({draw:uDrawAct,pass:uPass,say:uSay,catch:uCatch})[a](UI.me)}else UCH?.tx({t:"A",a});
}

/* ---------- start / rooms ---------- */
function startUno(nb){
  closeModal();closeUnoRoom();
  const names=["Robot","Robot 2","Robot 3"];
  uStart([{id:NEXORA.user.id,name:myName()},...Array.from({length:nb},(_,i)=>({id:"bot"+i,name:names[i],bot:true}))]);
  UI={me:0,host:true,pub:null,hand:[]};NEXORA.page="games";uSync();
}
function openUnoMenu(){
  openModal(`<div class="modal-title">UNO 🃏</div><div class="modal-sub">Dost ke saath online khelo</div>
   <button class="btn primary-btn" style="width:100%;margin-bottom:10px" onclick="hostUno()">🌐 Online room (2-4 log)</button>
   <div style="display:flex;gap:8px;margin-bottom:12px"><input id="unoCode" class="pf-input" style="margin:0;flex:1;min-width:0;text-transform:uppercase" maxlength="6" placeholder="Room code" autocapitalize="characters"><button class="btn" onclick="joinUno($('unoCode').value.trim().toUpperCase())">Join</button></div>
   <div style="color:var(--muted);font-size:12px;margin:0 0 6px 4px">Robot ke saath</div>
   <div class="grid" style="grid-template-columns:repeat(3,1fr)">${[1,2,3].map(n=>`<button class="btn" onclick="startUno(${n})">🤖 ×${n}</button>`).join("")}</div>`);
}
async function openUnoRoom(code,host){
  closeUnoRoom();UHOST=host;UB=host?[{id:NEXORA.user.id,name:myName()}]:[];UG=null;UI=null;
  const ch=sb.channel("uno-"+code);UCH=ch;ch.code=code;
  ch.tx=m=>ch.send({type:"broadcast",event:"u",payload:{...m,from:NEXORA.user.id}});
  ch.on("broadcast",{event:"u"},({payload:m})=>onUnoMsg(m));
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
}
function closeUnoRoom(){if(UCH){try{sb.removeChannel(UCH)}catch(_){}UCH=null}}
function showUnoLobby(){
  openModal(`<div class="modal-title">UNO room 🃏</div><div class="modal-sub">2 se 4 log · code dost ko bhejo</div>
   <div class="card" style="padding:16px;text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;margin-bottom:12px">${UCH?.code||""}</div>
   ${UB.map((p,i)=>`<div class="pr"><div class="avatar">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}${i===0?" (Host)":""}</div></div>`).join("")}
   <div class="modal-actions" style="margin-top:14px"><button class="btn danger" onclick="closeUnoRoom();closeModal()">Cancel</button><button class="btn primary-btn" ${UB.length<2?'disabled style="opacity:.5"':""} onclick="beginUno()">Start (${UB.length})</button></div>`);
}
function showUnoWait(){openModal(`<div class="modal-title">UNO lobby 🃏</div><div class="modal-sub">Host game shuru karega…</div>${UB.map(p=>`<div class="pr"><div class="avatar">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join("")}<button class="btn danger" style="width:100%;margin-top:14px" onclick="closeUnoRoom();closeModal()">Leave</button>`)}
async function hostUno(code){code=code||Math.random().toString(36).slice(2,8).toUpperCase();await openUnoRoom(code,true);showUnoLobby()}
async function joinUno(code){
  if(!code||code.length<4)return toast("Room code daalo.","error");
  await openUnoRoom(code,false);showUnoWait();
  let k=0;const iv=setInterval(()=>{if(UI||++k>12||!UCH)return clearInterval(iv);UCH.tx({t:"join",name:myName()})},1500);
  UCH.tx({t:"join",name:myName()});
}
function beginUno(){
  if(UB.length<2||!UCH)return;
  UCH.tx({t:"start",list:UB});
  uStart(UB.map(p=>({id:p.id,name:p.name})));
  closeModal();UI={me:0,host:true,pub:null,hand:[]};NEXORA.page="games";uSync();
}
function onUnoMsg(m){
  if(m.from===NEXORA.user.id)return;
  if(UHOST){
    if(m.t==="join"){
      if(UG)return;
      if(!UB.some(x=>x.id===m.from)&&UB.length<4)UB.push({id:m.from,name:m.name});
      UCH.tx({t:"lobby",list:UB});
      if(UAUTO&&UAUTO===UCH.code&&UB.length===2)return beginUno();
      return showUnoLobby();
    }
    if(!UG){if(m.t==="leave"){UB=UB.filter(x=>x.id!==m.from);showUnoLobby()}return}
    const s=UG.seats.findIndex(x=>x.id===m.from);if(s<0)return;
    if(m.t==="A")({play:()=>uPlay(s,m.i,m.col),draw:()=>uDrawAct(s),pass:()=>uPass(s),say:()=>uSay(s),catch:()=>uCatch(s)})[m.a]?.();
    if(m.t==="leave"){const x=UG.seats[s];x.bot=true;x.name+=" (bot)";UG.msg=x.name+" chala gaya, ab bot khelega";uSync()}
  }else{
    if(m.t==="lobby"&&!UI){UB=m.list;showUnoWait()}
    if(m.t==="start"&&!UI){UB=m.list;const me=UB.findIndex(x=>x.id===NEXORA.user.id);if(me>=0){closeModal();UI={me,host:false,pub:null,hand:[]};NEXORA.page="games";uRender()}}
    if(m.t==="S"&&UI){if(UI.pub&&m.pub.ver<UI.pub.ver)return;UI.pub=m.pub;uRender()}
    if(m.t==="H"&&UI&&m.to===NEXORA.user.id){UI.hand=m.hand;uRender()}
    if(m.t==="end"){toast("Host ne game band kar diya");UI=null;closeUnoRoom();setPage("games")}
  }
}
function leaveUno(){
  if(UCH)UCH.tx({t:UHOST?"end":"leave"});
  closeUnoRoom();UG=null;UI=null;UAUTO=null;setPage("games");
}
const _spC=setPage;setPage=function(p){
  if(UI&&NEXORA.page==="games"){if(UCH)UCH.tx({t:UHOST?"end":"leave"});closeUnoRoom();UG=null;UI=null;UAUTO=null}
  return _spC(p);
};

/* ---------- game request flow (chat/call arc se) ---------- */
const _rgC=requestGame;
requestGame=async function(uid,name,game){
  if(game!=="uno")return _rgC(uid,name,game);
  if(uid===NEXORA.user.id)return;
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  try{
    await openUnoRoom(code,true);UAUTO=code;PENDING={code,game:"uno",uid,name};
    await sendSignal({type:"game-req",to:uid,game:"uno",code,fromName:myName()});
    openModal(`<div class="modal-title">Request bhej di 🎮</div><div class="modal-sub">${escapeHtml(name)} ke accept karne ka wait…</div><div class="card" style="padding:18px;text-align:center;font-weight:850;margin-bottom:14px">🃏 UNO</div><button class="btn danger" style="width:100%" onclick="cancelGame()">Cancel</button>`);
    setTimeout(()=>{if(PENDING?.code===code)cancelGame(true)},45000);
  }catch(e){toast(e.message||"Request nahi gayi","error")}
};
const _cgC=cancelGame;cancelGame=function(t){if(PENDING?.game==="uno"){closeUnoRoom();UAUTO=null}_cgC(t)};
const _agC=acceptGame;
acceptGame=function(){
  if(INREQ?.game==="uno"){const r=INREQ;INREQ=null;closeModal();sendSignal({type:"game-accept",to:r.from,code:r.code}).catch(()=>{});joinUno(r.code);return}
  _agC();
};
const _hsC=handleSignal;
handleSignal=async function(p){
  if(p&&p.type==="game-declined"&&PENDING?.game==="uno"&&PENDING.code===p.code){closeUnoRoom();UAUTO=null}
  return _hsC(p);
};

/* ---------- games page ---------- */
function renderGames(){
  const q=(i,n,d,a)=>`<button class="card quick-card" onclick="${a}"><div class="quick-icon">${i}</div><div><div class="quick-name">${n}</div><div class="quick-desc">${d}</div></div></button>`;
  $("main").innerHTML=`<section class="page"><h1 class="section-title">Games</h1><div class="section-sub">Dost ke saath khelo.</div>
   <div class="grid grid2">${q("🎲","Ludo","Online 2-4 ya robot","openLudoMenu()")}${q("🃏","UNO","Online 2-4 ya robot","openUnoMenu()")}${q("❌","Tic-Tac-Toe","5×5 · 4 in a row","openTicTacToe()")}</div>
   <div class="card" style="padding:16px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5">💡 Chat ya call me upar ki pattee neeche kheencho (ya 🎮 dabao), dost ko game ki request bhejo. Accept karte hi dono game me pahunch jaoge.</div></section>`;
}
</script>

<script>
/* ============ PART E: back navigation + classic call screen ============ */
(function(){
  /* ---- call screen layout ---- */
  const ov=$("callOverlay"),card=ov.querySelector(".call-card");
  const av=$("callAvatar"),nm=$("callName"),st=$("callState"),tm=$("callTimer");
  const top=document.createElement("div");top.className="cTop";
  top.innerHTML=`<button id="callMin" class="icon-btn" title="Chhota karo">⌄</button><span>NEXORA · VOICE</span><span style="width:42px"></span>`;
  const mid=document.createElement("div");mid.className="cMid";
  const aw=document.createElement("div");aw.className="avw";aw.innerHTML="<i></i><i></i><i></i>";aw.appendChild(av);
  const eq=document.createElement("div");eq.className="eq";eq.innerHTML="<i></i>".repeat(5);
  mid.append(aw,nm,st,tm,eq);card.prepend(mid);card.prepend(top);

  let CALLMIN=false;
  const syncMini=()=>ov.classList.toggle("mini",CALLMIN);
  const _cu=callUI;callUI=function(a,d,m,e){_cu(a,d,m,e);if(a)CALLMIN=false;syncMini()};
  $("callMin").onclick=()=>{CALLMIN=true;syncMini()};
  av.onclick=()=>{if(CALLMIN){CALLMIN=false;syncMini()}};
  const mm=()=>{if(NEXORA.call.state==="connected"||NEXORA.call.state==="calling"){CALLMIN=true;syncMini()}};
  ["openChat","startLudo","startUno","startTTT","openTicTacToe"].forEach(n=>{
    const f=window[n];if(typeof f!=="function")return;
    window[n]=function(...a){mm();return f.apply(this,a)};
  });

  /* ---- tones + state classes ---- */
  let ps="idle",rb=null;const beep=()=>{sfx(440,.4,"sine",.04);setTimeout(()=>sfx(480,.4,"sine",.04),60)};
  setInterval(()=>{
    const c=NEXORA.call,s=c.state;
    ov.classList.toggle("connected",s==="connected");ov.classList.toggle("muted",!!c.muted);
    st.classList.toggle("dots",s==="calling"||s==="connecting"||s==="ringing");
    if(s===ps)return;
    if(s==="calling"&&!rb){beep();rb=setInterval(beep,3200)}
    if(s!=="calling"&&rb){clearInterval(rb);rb=null}
    if(s==="connected"){sfx(660,.12);setTimeout(()=>sfx(880,.2),130);navigator.vibrate?.(60)}
    if(s==="idle"&&ps!=="idle"){sfx(320,.18);setTimeout(()=>sfx(220,.3),180);CALLMIN=false;syncMini()}
    ps=s;
  },300);

  /* ---- back button + phone back gesture ---- */
  const main=$("main"),NAV={tab:"home"};
  const _sp=setPage;setPage=function(p){NAV.tab=p;return _sp(p)};
  const br=document.querySelector(".brand"),wrap=document.createElement("div");
  wrap.style.cssText="display:flex;align-items:center;gap:10px";
  br.parentNode.insertBefore(wrap,br);
  const bk=document.createElement("button");bk.id="topBack";bk.className="icon-btn hidden";bk.textContent="‹";
  wrap.append(bk,br);
  const isSub=()=>!!main.querySelector(".chat-page,.ludo-wrap,.u-page,.cell");
  function goBack(){
    if(!$("modalOverlay").classList.contains("hidden"))return closeModal();
    if(main.querySelector(".ludo-wrap"))return leaveLudo();
    if(main.querySelector(".u-page"))return leaveUno();

    for(let j=0;j<4;j++){const rr=r+dr*(j-k),cc=c+dc*(j-k);if(rr<0||rr>4||cc<0||cc>4){bad=true;break}const v=b[rr*5+cc];if(v===opp){bad=true;break}if(v===sym)own++}
    if(!bad)s+=[1,3,9,40][own]||0;
  }
  return s;
}
function tttBot(){
  if(!TTT||TTT.over||!TTT.bot||TTT.t!=="O")return;
  const b=TTT.b,emp=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
  const win=(sym,i)=>{b[i]=sym;const w=lineWin(b,5,5,4)===sym;b[i]="";return w};
  let pick=emp.find(i=>win("O",i));
  if(pick===undefined)pick=emp.find(i=>win("X",i));
  if(pick===undefined){let best=-1;emp.forEach(i=>{const s=ttScore(b,i,"O")*1.1+ttScore(b,i,"X")+Math.random()*.8-(Math.abs(i%5-2)+Math.abs(Math.floor(i/5)-2))*.3;if(s>best){best=s;pick=i}})}
  applyTTT(pick);botMsg();
}
function botMsg(){
  if(!TTT||!TTT.bot)return;const w=lineWin(TTT.b,5,5,4);
  TTT.msg=w?(w==="X"?"Aap jeet gaye! 🏆":"Robot jeet gaya 🤖"):TTT.b.every(Boolean)?"Draw":TTT.t==="X"?"Aapki baari (X)":"Robot soch raha hai…";
  renderTTT();
}
tttMove=function(i){
  if(!TTT||TTT.over||TTT.b[i])return;
  if(TTT.online&&TTT.t!==TTT.mine)return;
  if(TTT.bot&&TTT.t!=="X")return;
  applyTTT(i);
  if(TTT.online)TCH?.tx({t:"mv",i});
  if(TTT.bot){botMsg();if(!TTT.over)setTimeout(tttBot,700)}
};
function tttRestart(){if(TTT?.online){toast("Online game me restart dost ke saath naya room banao");return}TTT?.bot?startTTTBot():startTTTLocal()}
const _rtF=renderTTT;renderTTT=function(){_rtF();document.querySelector("#main .card>.btn.primary-btn")?.setAttribute("onclick","tttRestart()")};

/* ---------- Games page: Quick Match ---------- */
renderGames=function(){
  const row=(g,ns)=>`<div class="card" style="padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="font-weight:850;flex:1">${GM[g].t}</div>${ns.map(n=>`<button class="btn primary-btn" style="min-height:42px;min-width:46px;padding:0 14px" onclick="findMatch('${g}',${n})">${n}</button>`).join("")}</div>`;
  const q=(i,n,d,a)=>`<button class="card quick-card" onclick="${a}"><div class="quick-icon">${i}</div><div><div class="quick-name">${n}</div><div class="quick-desc">${d}</div></div></button>`;
  $("main").innerHTML=`<section class="page"><h1 class="section-title">Games</h1><div class="section-sub">Random logon ke saath ya dost ke saath.</div>
   <div style="font-weight:850;margin:0 0 10px 2px">⚡ Quick Match <span style="color:var(--muted);font-weight:500;font-size:12px">· kitne log chahiye? dabao</span></div>
   ${row("ludo",[2,3,4])}${row("uno",[2,3,4])}${row("ttt",[2])}
   <div style="font-weight:850;margin:20px 0 10px 2px">Aur options</div>
   <div class="grid grid2">${q("🎲","Ludo","Dost · Robot · Room","openLudoMenu()")}${q("🃏","UNO","Dost · Robot · Room","openUnoMenu()")}${q("❌","Tic-Tac-Toe","Dost · Robot · Room","openTicTacToe()")}</div></section>`;
};
if(NEXORA.page==="games"&&NEXORA.user)renderGames();

.mini #callRetry{display:none}
#callRetry{background:linear-gradient(145deg,#38d98b,#1a9e5f)!important;border-color:transparent!important}
</style>

<script>
/* ============ COMM PART 1: reliable calls ============ */
/* TURN zaroori hai (Wi-Fi<->cellular). metered.ca par free account banao aur neeche daalo, ya apna TURN daalo. */
const ICE_CONFIG={metered:{app:"",key:""},turn:[]};
let ICE_CACHE=null,ICE_AT=0,ICE_TURN=false;
async function getIce(){
  if(ICE_CACHE&&Date.now()-ICE_AT<36e5)return ICE_CACHE;
  const s=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun.cloudflare.com:3478"]},...ICE_CONFIG.turn];
  const m=ICE_CONFIG.metered;
  if(m.app&&m.key){try{const r=await fetch(`https://${m.app}.metered.live/api/v1/turn/credentials?apiKey=${m.key}`);if(r.ok)s.push(...await r.json())}catch(e){console.warn("TURN fetch failed",e)}}
  ICE_TURN=s.some(x=>JSON.stringify(x.urls).includes("turn"));
  if(!ICE_TURN)console.warn("[NEXORA] TURN server set nahi hai: cellular/strict Wi-Fi par call fail ho sakti hai.");
  ICE_CACHE=s;ICE_AT=Date.now();return s;
}
const sig=m=>sendSignal(m).catch(()=>{});
const ENDED=new Map(),isEnded=id=>{const t=ENDED.get(id);return!!t&&Date.now()-t<12e4};
const markEnded=id=>{if(id){ENDED.set(id,Date.now());if(ENDED.size>40)ENDED.delete(ENDED.keys().next().value)}};
const NET_TXT={ok:"Connected",unstable:"Connection unstable",reconnecting:"Reconnecting…",lost:"Connection lost"};
const waitJoined=async ms=>{const t=Date.now();while(Date.now()-t<ms){if(NEXORA.channel?.state==="joined")return true;await sleep(150)}return false};

/* signaling: ack ke saath retry */
sendSignal=async function(p){
  for(let i=0;i<3;i++){
    if(NEXORA.channel?.state!=="joined"){if(!NEXORA.channel||["errored","closed"].includes(NEXORA.channel.state))await startRealtime();await waitJoined(3500)}
    if(NEXORA.channel?.state==="joined"){
      const r=await NEXORA.channel.send({type:"broadcast",event:"signal",payload:{...p,from:NEXORA.user.id}});
      if(r==="ok")return;
    }
    await sleep(400*(i+1));
  }
  throw new Error("signal failed");
};

/* microphone: saaf messages */
getMic=async function(){
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Is browser me microphone support nahi hai. Chrome ya Safari use karo.");
  if(!isSecureContext)throw new Error("Voice ke liye HTTPS chahiye.");
  try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
  catch(e){const n=e.name;throw new Error(n==="NotAllowedError"||n==="SecurityError"?"Microphone access zaroori hai. Browser me 🔒 ➜ Permissions ➜ Microphone ➜ Allow karo.":n==="NotFoundError"?"Microphone nahi mila.":n==="NotReadableError"?"Microphone kisi aur app me use ho raha hai.":"Microphone shuru nahi hua.")}
};
let WL=null;async function wake(on){try{if(on&&!WL&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");if(!on&&WL){await WL.release();WL=null}}catch(_){}}

/* retry button */
$("callGame").insertAdjacentHTML("afterend",`<button id="callRetry" class="btn hidden" title="Retry">⟳</button>`);
$("callRetry").onclick=()=>retryCall();$("callAccept").onclick=()=>acceptCall();

/* ---- state text ---- */
function setNet(c,s){c.net=s;paintCall()}
function paintCall(){
  const c=CC();if(c.state==="idle")return;
  let t,col="";
  if(c.state==="calling")t=c.ringing?"Ringing…":"Calling…";
  else if(c.state==="ringing")t=(c.members?.length?"Group call · ":"")+"Incoming voice call";
  else if(c.state==="connecting")t=c.fail?"Couldn't connect":"Connecting…";
  else{t=NET_TXT[c.net||"ok"];if(c.net==="unstable"||c.net==="reconnecting")col="#ffc857";if(c.net==="lost")col="#ff8797"}
  const st=$("callState");if(st.textContent!==t)st.textContent=t;st.style.color=col;
  $("callRetry").classList.toggle("hidden",!(c.fail||c.net==="lost"));
}
setInterval(paintCall,400);

/* ---- peer ---- */
async function mkPeer(uid,name,init){
  const c=CC();if(c.peers[uid])return c.peers[uid];
  const cfg={iceServers:await getIce(),iceCandidatePoolSize:2};
  if(CC()!==c)throw new Error("call changed");if(c.peers[uid])return c.peers[uid];
  const pc=new RTCPeerConnection(cfg);
  const P={pc,name,init,muted:false,state:"connecting",audio:null,queue:[...(c.pre?.[uid]||[])],out:[],ready:!init,tmr:null,lost:null,rt:null};
  c.peers[uid]=P;if(c.pre)delete c.pre[uid];
  c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
  pc.onicecandidate=e=>{if(!e.candidate)return;const m={type:"call-ice",to:uid,callId:c.id,candidate:e.candidate};P.ready?sig(m):P.out.push(m)};
  pc.ontrack=e=>{if(!P.audio){const a=document.createElement("audio");a.autoplay=true;a.playsInline=true;document.body.appendChild(a);P.audio=a}P.audio.srcObject=e.streams[0];P.audio.play().catch(()=>{});applyAudio()};
  pc.oniceconnectionstatechange=()=>onNet(c,uid);pc.onconnectionstatechange=()=>onNet(c,uid);
  return P;
}
function clearP(P){clearTimeout(P.tmr);clearTimeout(P.lost);clearInterval(P.rt);P.tmr=P.lost=P.rt=null}
function onNet(c,uid){
  const P=c.peers[uid];if(!P||CC()!==c)return;
  const ice=P.pc.iceConnectionState,cs=P.pc.connectionState;console.debug("[call]",uid,ice,cs);
  if(ice==="connected"||ice==="completed"||cs==="connected"){
    clearP(P);P.state="connected";clearTimeout(c.dead);
    if(c.state!=="connected"){c.state="connected";c.fail=false;[c.ctmo,c.ctmo2,c.otmo].forEach(clearTimeout);callUI(0,0,1,1);startCallTimer();wake(true)}
    if(c.net&&c.net!=="ok")toast("Connection wapas aa gaya ✓");
    setNet(c,"ok");refreshCall();return;
  }
  if(ice==="disconnected"){P.state="unstable";if(c.state==="connected")setNet(c,"unstable");clearTimeout(P.tmr);P.tmr=setTimeout(()=>recover(c,uid),3000);return}
  if(ice==="failed"||cs==="failed")recover(c,uid);
}
function recover(c,uid){
  const P=c.peers[uid];if(!P||CC()!==c)return;
  const s=P.pc.iceConnectionState;if(s==="connected"||s==="completed")return;
  if(c.state==="connected")setNet(c,"reconnecting");
  const kick=()=>{if(CC()!==c||!c.peers[uid]||navigator.onLine===false)return;P.init?restartIce(c,uid):sig({type:"call-nudge",to:uid,callId:c.id})};
  kick();clearInterval(P.rt);
  P.rt=setInterval(()=>{const x=P.pc.iceConnectionState;if(x==="connected"||x==="completed")return clearInterval(P.rt);kick()},6000);
  if(!P.lost)P.lost=setTimeout(()=>{P.lost=null;if(CC()!==c||!c.peers[uid])return;const x=P.pc.iceConnectionState;if(x!=="connected"&&x!=="completed")netLost(c)},c.state==="connected"?25000:20000);
}
function netLost(c){
  if(c.state==="connected")c.net="lost";else c.fail=true;
  paintCall();clearTimeout(c.dead);c.dead=setTimeout(()=>{if(CC()===c&&(c.net==="lost"||c.fail)){toast("Connection nahi mil paya. Call khatam.","error");endCall("ended")}},90000);
}
function retryCall(){
  const c=CC();if(c.state==="idle")return;c.fail=false;if(c.net==="lost")c.net="reconnecting";paintCall();clearTimeout(c.dead);
  Object.keys(c.peers).forEach(u=>{const P=c.peers[u];clearP(P);recover(c,u)});
}
async function restartIce(c,uid){
  const P=c.peers[uid];if(!P||P.restarting||P.pc.signalingState!=="stable")return;
  P.restarting=true;
  try{P.pc.restartIce?.();await P.pc.setLocalDescription(await P.pc.createOffer({iceRestart:true}));
    await sendSignal({type:"call-reoffer",to:uid,callId:c.id,offer:P.pc.localDescription})}
  catch(e){console.warn("ice restart",e)}finally{P.restarting=false}
}
async function onReoffer(p){
  const c=CC(),P=c.peers[p.from];if(!P||p.callId!==c.id)return;
  try{await P.pc.setRemoteDescription(new RTCSessionDescription(p.offer));await P.pc.setLocalDescription(await P.pc.createAnswer());
    await sendSignal({type:"call-answer",to:p.from,callId:c.id,answer:P.pc.localDescription});if(c.state==="connected")setNet(c,"reconnecting")}
  catch(e){console.warn("reoffer",e)}
}
function armConnect(c){
  clearTimeout(c.ctmo);clearTimeout(c.ctmo2);
  c.ctmo=setTimeout(()=>{if(CC()===c&&c.state!=="connected"){c.fail=true;paintCall();Object.keys(c.peers).forEach(u=>recover(c,u))}},25000);
  c.ctmo2=setTimeout(()=>{if(CC()===c&&c.state!=="connected"){toast("Call connect nahi ho payi. Dono taraf internet check karo.","error");endCall("missed")}},75000);
}

/* ---- outgoing ---- */
async function dial(uid,name){
  const c=CC(),P=await mkPeer(uid,name,true);
  await P.pc.setLocalDescription(await P.pc.createOffer());
  const msg={type:"call-offer",to:uid,callId:c.id,fromName:myName(),random:!!c.random,members:Object.keys(c.peers).filter(k=>k!==uid).map(k=>({id:k,name:c.peers[k].name})),offer:P.pc.localDescription};
  await sendSignal(msg);P.ready=true;P.out.splice(0).forEach(sig);
  if(c.state==="calling"){let n=0;clearInterval(c.resend);c.resend=setInterval(()=>{if(CC()!==c||c.ringing||c.state!=="calling"||++n>10){clearInterval(c.resend);c.resend=null;return}sig(msg)},2500)}
}
async function dbStart(tid){
  try{const{data:pr}=await sb.from("profiles").select("username").eq("id",tid).maybeSingle();if(!pr?.username)return null;
    const{data,error}=await sb.rpc("nexora_start_call",{target_username:pr.username,call_kind:"voice"});return!error&&data?.call_id?data.call_id:null}catch(_){return null}
}
startCallByUser=async function(tid,tname,opts={}){
  if(!NEXORA.user)return toast("Please log in first.","error");
  if(tid===NEXORA.user.id)return;
  if(CC().state!=="idle")return inviteToCall(tid,tname||"User");
  let stream;try{stream=await getMic()}catch(e){return toast(e.message,"error")}
  if(CC().state!=="idle"){stream.getTracks().forEach(t=>t.stop());return}
  const c=NEXORA.call={...IDLE2(),id:crypto.randomUUID(),mode:"outgoing",state:"calling",stream,targetId:tid,targetName:tname||"User",random:!!opts.random};
  $("callAvatar").textContent=initials(tname);$("callName").textContent=tname||"User";callShow();callUI(0,0,0,1);paintCall();
  const dbId=await Promise.race([dbStart(tid),sleep(2200).then(()=>null)]);
  if(CC()!==c)return;if(dbId)c.id=dbId;
  try{await dial(tid,tname||"User")}catch(e){console.error(e);toast("Call shuru nahi ho payi. Internet check karo.","error");return endCall("cancelled",true)}
  c.otmo=setTimeout(()=>{if(CC()===c&&c.state==="calling"){toast("Koi jawab nahi");endCall("missed")}},35000);
};

/* ---- incoming ---- */
async function onOffer(p){
  const c=CC(),me=NEXORA.user.id;
  if(isEnded(p.callId))return;
  if(p.callId===c.id&&c.state!=="idle"){
    if(c.state==="ringing"){sig({type:"call-ringing",to:p.from,callId:c.id});return}
    if(c.peers[p.from])return;
    try{const P=await mkPeer(p.from,p.fromName||"User",false);await setRemote(P,p.offer);await P.pc.setLocalDescription(await P.pc.createAnswer());
      await sendSignal({type:"call-answer",to:p.from,callId:c.id,answer:P.pc.localDescription});refreshCall()}catch(e){console.warn(e)}
    return;
  }
  if(c.state!=="idle"){
    if(c.state==="calling"&&c.targetId===p.from&&me>p.from){markEnded(c.id);await cleanupCall()}  /* glare: chhoti id jeetti hai */
    else{sig({type:"call-busy",to:p.from,callId:p.callId});return}
  }
  NEXORA.call={...IDLE2(),id:p.callId,mode:"incoming",state:"ringing",targetId:p.from,targetName:p.fromName||"Incoming call",pendingOffer:p.offer,members:p.members||[],random:!!p.random};
  const n=CC();sig({type:"call-ringing",to:p.from,callId:n.id});
  if(p.random&&RST){cancelRandom(false);closeModal();return acceptCall()}
  callShow();$("callAvatar").textContent=initials(n.targetName);$("callName").textContent=n.targetName;callUI(1,1,0,0);startRing();paintCall();
  n.otmo=setTimeout(async()=>{if(CC()===n&&n.state==="ringing"){sig({type:"call-missed",to:n.targetId,callId:n.id});await endCall("missed",true)}},35000);
}
acceptCall=async function(){
  const c=CC();if(c.mode!=="incoming"||c.state!=="ringing")return;
  stopRing();clearTimeout(c.otmo);
  let stream;try{stream=await getMic()}catch(e){toast(e.message,"error");sig({type:"call-declined",to:c.targetId,callId:c.id});return endCall("cancelled",true)}
  if(CC()!==c){stream.getTracks().forEach(t=>t.stop());return}
  c.stream=stream;c.state="connecting";callUI(0,0,1,1);paintCall();armConnect(c);
  try{
    const P=await mkPeer(c.targetId,c.targetName,false);
    await setRemote(P,c.pendingOffer);await P.pc.setLocalDescription(await P.pc.createAnswer());
    await sendSignal({type:"call-answer",to:c.targetId,callId:c.id,answer:P.pc.localDescription});
    for(const m of c.members)await dial(m.id,m.name);
    sb.from("calls").update({status:"accepted",started_at:new Date().toISOString()}).eq("id",c.id).then(()=>{},()=>{});
  }catch(e){console.error(e);toast("Call connect nahi ho payi","error");await endCall("cancelled")}
};
function onGone(p){
  const c=CC();if(p.callId!==c.id)return;
  const P=c.peers[p.from],rnd=c.random;
  if(P){const n=P.name;dropPeer(p.from);
    toast(p.type==="call-busy"?n+" abhi busy hai":p.type==="call-declined"?n+" ne call cut kar di":n+" call se chala gaya");
    if(rnd&&!Object.keys(CC().peers||{}).length)setTimeout(strangerGone,350)}
  else if(c.state==="ringing"&&p.from===c.targetId){cleanupCall();toast("Missed call")}
}
const _hsG=handleSignal;
handleSignal=async function(p){
  if(!p||p.from===NEXORA.user?.id)return;
  const t=p.type;if(!t||!t.startsWith("call-"))return _hsG(p);
  const c=CC();if(isEnded(p.callId))return;
  if(t==="call-offer")return onOffer(p);
  if(t==="call-ringing"){if(p.callId===c.id){c.ringing=true;clearInterval(c.resend);c.resend=null;paintCall()}return}
  if(t==="call-answer"){const P=c.peers[p.from];if(P&&p.callId===c.id){try{await setRemote(P,p.answer);if(c.state==="calling"){c.state="connecting";clearTimeout(c.otmo);armConnect(c)}}catch(e){console.warn("answer",e)}}return}
  if(t==="call-ice"){
    if(p.callId!==c.id||!p.candidate)return;const P=c.peers[p.from];
    if(!P){(c.pre=c.pre||{});(c.pre[p.from]=c.pre[p.from]||[]).push(p.candidate);return}
    if(P.pc.remoteDescription)P.pc.addIceCandidate(p.candidate).catch(()=>{});else P.queue.push(p.candidate);return;
  }
  if(t==="call-reoffer")return onReoffer(p);
  if(t==="call-nudge"){const P=c.peers[p.from];if(P&&P.init&&p.callId===c.id)restartIce(c,p.from);return}
  return onGone(p);
};

/* ---- cleanup ---- */
const _ecG=endCall;endCall=async function(s,sil){markEnded(CC().id);return _ecG(s,sil)};
const _clG=cleanupCall;cleanupCall=async function(){
  const c=CC();markEnded(c.id);[c.otmo,c.ctmo,c.ctmo2,c.dead].forEach(clearTimeout);clearInterval(c.resend);
  Object.values(c.peers||{}).forEach(clearP);wake(false);$("callRetry")?.classList.add("hidden");$("callState").style.color="";
  return _clG();
};
const _dpG=dropPeer;dropPeer=function(u){const P=CC().peers[u];if(P)clearP(P);return _dpG(u)};

/* ---- network events ---- */
addEventListener("online",()=>{const c=CC();if(NEXORA.user&&NEXORA.channel?.state!=="joined")startRealtime();if(c.state==="idle")return;Object.keys(c.peers).forEach(u=>{if(c.peers[u].pc.iceConnectionState!=="connected")recover(c,u)})});
addEventListener("offline",()=>{const c=CC();if(c.state==="connected")setNet(c,"reconnecting")});
navigator.connection?.addEventListener?.("change",()=>{const c=CC();if(c.state!=="connected")return;setTimeout(()=>Object.keys(c.peers).forEach(u=>{const P=c.peers[u];if(P)P.init?restartIce(c,u):sig({type:"call-nudge",to:u,callId:c.id})}),900)});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;if(NEXORA.user&&NEXORA.channel?.state!=="joined")startRealtime();
  const c=CC();if(c.state==="idle")return;Object.keys(c.peers).forEach(u=>{const s=c.peers[u].pc.iceConnectionState;if(s!=="connected"&&s!=="completed")recover(c,u)});
});
addEventListener("pagehide",()=>{const c=CC();if(c.state==="idle")return;Object.keys(c.peers).forEach(u=>{try{NEXORA.channel?.send({type:"broadcast",event:"signal",payload:{type:"call-ended",to:u,callId:c.id,from:NEXORA.user.id}})}catch(_){}})});

/* ---- realtime watchdog + indicator ---- */
let RTJ=0,CONN="ok";
setInterval(()=>{
  if(!NEXORA.user)return;const ch=NEXORA.channel,s=ch?.state,on=navigator.onLine;
  if(s==="joined")RTJ=0;else if(s==="joining"&&!RTJ)RTJ=Date.now();
  if(on&&(!ch||s==="errored"||s==="closed"||(s==="joining"&&RTJ&&Date.now()-RTJ>12000))){RTJ=0;startRealtime().catch(()=>{})}
  const st=!on?"off":s==="joined"?"ok":"rec",bn=$("offline");if(!bn||st===CONN)return;const was=CONN;CONN=st;
  if(st==="off"){bn.textContent="📡 Internet nahi hai";bn.style.background="#ff4d63";bn.classList.add("show")}
  else if(st==="rec"){bn.textContent="🔄 Reconnecting…";bn.style.background="#e0a000";bn.classList.add("show")}
  else if(was!=="ok"){bn.textContent="✓ Back online";bn.style.background="#1fae6a";bn.classList.add("show");setTimeout(()=>{if(CONN==="ok")bn.classList.remove("show")},2200)}
},2000);

/* ============ RANDOM VOICE CALL ============ */
let RCH=null,RST=null;
function cancelRandom(close){
  const c=RCH;RCH=null;if(RST){clearTimeout(RST.to);clearTimeout(RST.wt)}RST=null;
  if(c)try{sb.removeChannel(c)}catch(_){}if(close)closeModal();
}
const _cmG=closeModal;closeModal=function(){if(RST&&!RST.starting)cancelRandom(false);_cmG()};
function randomUI(txt){
  if(!$("rcTxt"))openModal(`<div class="modal-title">📞 Random Call</div><div class="modal-sub">Kisi anjaan se baat karo</div>
   <div style="display:grid;place-items:center;margin:20px 0 8px"><div class="avw" style="width:130px;height:130px;margin:0"><i></i><i></i><i></i><div class="avatar" style="width:70px;height:70px;font-size:28px;position:relative;z-index:1">🎧</div></div></div>
   <div id="rcTxt" style="font-weight:900;font-size:17px;text-align:center;margin-bottom:18px"></div><button class="btn danger" style="width:100%" onclick="cancelRandom(true)">Cancel</button>`);
  $("rcTxt").textContent=txt;
}
function randomEnd(title,sub){
  openModal(`<div class="modal-title">${title}</div><div class="modal-sub">${sub}</div>
   <button class="btn primary-btn" style="width:100%;margin-bottom:10px" onclick="closeModal();findRandomCall()">🔄 Find another</button><button class="btn" style="width:100%" onclick="closeModal()">Band karo</button>`);
}
const strangerGone=()=>randomEnd("Stranger disconnected","Call khatam ho gayi");
async function findRandomCall(){
  if(!NEXORA.user)return toast("Pehle login karo","error");
  if(CC().state!=="idle")return toast("Pehle current call khatam karo");
  cancelRandom(false);
  try{(await getMic()).getTracks().forEach(t=>t.stop())}catch(e){return toast(e.message,"error")}
  const S=RST={starting:false,matched:false};randomUI("Kisi se jod rahe hain…");
  const ch=sb.channel("mm-rcall",{config:{presence:{key:NEXORA.user.id}}});RCH=ch;
  const me={id:NEXORA.user.id,name:myName(),t:Date.now()};
  ch.on("presence",{event:"sync"},()=>{
    if(RST!==S||RCH!==ch||S.matched)return;
    const seen={};Object.values(ch.presenceState()).flat().forEach(x=>{if(x?.id&&!seen[x.id])seen[x.id]=x});
    const list=Object.values(seen).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1)),i=list.findIndex(x=>x.id===me.id);
    if(i<0)return;const j=i%2===0?i+1:i-1;if(j<0||j>=list.length)return;
    S.matched=true;const o=list[j];randomUI("Match mil gaya! Connecting…");sfx(660,.15);
    setTimeout(()=>{try{sb.removeChannel(ch)}catch(_){}},6000);
    if(i<j)setTimeout(()=>{if(RST!==S)return;S.starting=true;closeModal();RST=null;startCallByUser(o.id,o.name,{random:true})},700);
    else S.wt=setTimeout(()=>{if(RST===S&&CC().state==="idle"){cancelRandom(false);randomEnd("Match nahi ho paya","Dobara try karo")}},20000);
  });
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
  try{await ch.track(me)}catch(_){}
  if(RST===S&&RCH===ch)S.to=setTimeout(()=>{if(RST===S&&!S.matched){cancelRandom(false);randomEnd("Abhi koi online nahi 😕","Thodi der baad dobara try karo")}},60000);
}
randomCall=()=>findRandomCall();
</script>

<script>
/* ============ COMM PART 2: game voice + game sync + rematch ============ */
const GST={},NOW=()=>Date.now();
function gchip(txt,tone,act){let e=$("gchip");if(!txt){e?.remove();return}
  if(!e){document.body.insertAdjacentHTML("beforeend",'<div id="gchip"></div>');e=$("gchip");e.onclick=()=>{const a=e.dataset.act;if(a&&window[a])window[a]()}}
  e.textContent=txt;e.dataset.act=act||"";e.style.background=tone==="ok"?"#1fae6a":"#b88400"}

/* ---- kaun sa game online chal raha hai ---- */
function gameCtx(){
  const me=NEXORA.user?.id;if(!me)return null;
  if(LUDO?.mode==="online"&&LROOM)return{kind:"ludo",code:LROOM.code,others:LB.filter(x=>x.id!==me)};
  if(TT?.started&&TCH&&TT.oppId)return{kind:"ttt",code:TT.code,others:[{id:TT.oppId,name:"Dost"}]};
  if(UI&&UCH&&UB.length)return{kind:"uno",code:UCH.code,others:UB.filter(x=>x.id!==me)};
  return null;
}
const gameActive=()=>gameCtx()?.kind||null;
function gameOnScreen(k){const m=$("main");return k==="ludo"?!!m.querySelector(".ludo-wrap"):k==="ttt"?!!m.querySelector(".cell"):!!m.querySelector(".u-page")}
function gameBack(){const k=gameActive();NEXORA.page="games";if(k==="ludo")renderLudo();else if(k==="ttt")renderTTT();else if(k==="uno")uRender()}

/* ============ GAME VOICE (alag session, mesh 1-to-1) ============ */
let GV=null;
$("notificationBtn").insertAdjacentHTML("beforebegin",'<button id="gvBtn" class="icon-btn hidden" title="Voice">🎙<i></i></button>');
$("gvBtn").onclick=()=>gvPanel($("gvPanel")?false:true);
const gvSig=(to,t,x={})=>GV?sendSignal({type:t,to,sid:GV.sid,...x}).catch(()=>{}):Promise.resolve();
const gvSid=c=>`gv:${c.kind}:${c.code}`;
function gvStat(){if(!GV)return"off";const a=Object.values(GV.peers);if(!a.length)return"wait";if(a.some(p=>p.state==="bad"))return"bad";return a.every(p=>p.state==="ok")?"ok":"wait"}
function gvPaint(){
  const b=$("gvBtn");if(!b)return;const ctx=gameCtx(),st=gvStat();
  b.classList.toggle("hidden",!ctx&&!GV);b.className=b.className.replace(/ s-\w+/g,"")+(GV?" s-"+st:"");
  if(GV&&st==="ok")GV.was=true;if($("gvPanel"))gvPanel();
}
function gvPanel(open){
  let p=$("gvPanel");if(open===false){p?.remove();return}
  if(!p){if(open!==true)return;document.body.insertAdjacentHTML("beforeend",'<div id="gvPanel"></div>');p=$("gvPanel")}
  if(!GV){const inCall=CC().state!=="idle";
    p.innerHTML=`<div style="font-weight:850">🎙 Voice chat</div><div style="color:var(--muted);font-size:13px;margin-top:4px">${inCall?"Aap call me ho. Wahi call voice ka kaam karegi.":"Is game ke players ke saath baat karo"}</div>${inCall?"":'<div class="gvr"><button class="btn primary-btn" style="font-size:15px" onclick="gvJoin()">Voice shuru karo</button></div>'}`;return}
  const st=gvStat(),txt={ok:"Voice connected",wait:GV.was?"Reconnecting voice…":"Connecting voice…",bad:"Voice unavailable"}[st],col={ok:"#2fe08b",wait:"#ffc857",bad:"#ff5468"}[st];
  p.innerHTML=`<div style="display:flex;align-items:center;gap:8px;font-weight:850"><span style="width:9px;height:9px;border-radius:50%;background:${col}"></span>${txt}</div>
   <div class="gvr"><button class="btn ${GV.muted?"off":""}" onclick="gvMic()">${GV.muted?"🔇":"🎙"}</button><button class="btn ${GV.spk?"":"off"}" onclick="gvSpk()">${GV.spk?"🔊":"🔈"}</button>${st==="bad"?'<button class="btn" onclick="gvRetry()">⟳</button>':""}<button class="btn off" onclick="gvLeave(true);gvPanel(false)">☎</button></div>`;
}
async function gvJoin(){
  const ctx=gameCtx();if(!ctx||GV)return;
  if(CC().state!=="idle")return toast("Pehle current call khatam karo");
  let stream;try{stream=await getMic()}catch(e){gvPaint();return toast(e.message,"error")}
  const c2=gameCtx();if(!c2||GV){stream.getTracks().forEach(t=>t.stop());return}
  const G=GV={sid:gvSid(c2),ctx:c2,peers:{},pre:{},stream,muted:false,spk:true,was:false};let n=0;
  const ann=()=>{if(GV!==G)return;const need=G.ctx.others.filter(o=>G.peers[o.id]?.state!=="ok");need.forEach(o=>gvSig(o.id,"gv-join",{}));if(need.length&&++n<10)G.ann=setTimeout(ann,3000)};
  ann();gvPaint();
}
async function gvPeer(uid,init){
  const G=GV;if(!G)return null;if(G.peers[uid])return G.peers[uid];
  const pc=new RTCPeerConnection({iceServers:await getIce(),iceCandidatePoolSize:2});
  if(GV!==G){pc.close();return null}if(G.peers[uid]){pc.close();return G.peers[uid]}
  const P={pc,init,state:"wait",queue:[...(G.pre[uid]||[])],audio:null,stream:null};G.peers[uid]=P;delete G.pre[uid];
  G.stream.getTracks().forEach(t=>pc.addTrack(t,G.stream));
  pc.onicecandidate=e=>{if(e.candidate)gvSig(uid,"gv-ice",{candidate:e.candidate})};
  pc.ontrack=e=>{if(!P.audio){const a=document.createElement("audio");a.autoplay=true;a.playsInline=true;a.muted=!G.spk;document.body.appendChild(a);P.audio=a}P.audio.srcObject=e.streams[0];P.audio.play().catch(()=>{});P.stream=e.streams[0]};
  const chk=()=>{if(GV!==G)return;const s=pc.iceConnectionState;
    if(s==="connected"||s==="completed"){clearTimeout(P.t1);clearTimeout(P.lost);P.lost=null;clearInterval(P.rt);P.state="ok"}
    else if(s==="disconnected"){P.state="wait";clearTimeout(P.t1);P.t1=setTimeout(()=>gvRecover(uid),3000)}
    else if(s==="failed")gvRecover(uid);
    gvPaint()};
  pc.oniceconnectionstatechange=chk;pc.onconnectionstatechange=chk;
  return P;
}
function gvRecover(uid){
  const G=GV,P=G?.peers[uid];if(!P)return;if(P.state!=="bad")P.state="wait";gvPaint();
  const kick=()=>{if(GV!==G||navigator.onLine===false)return;P.init?gvRestart(uid):gvSig(uid,"gv-nudge")};
  kick();clearInterval(P.rt);P.rt=setInterval(()=>{if(GV!==G||P.state==="ok")return clearInterval(P.rt);kick()},6000);
  if(!P.lost)P.lost=setTimeout(()=>{P.lost=null;if(GV===G&&P.state!=="ok"){P.state="bad";gvPaint()}},25000);
}
async function gvRestart(uid){
  const P=GV?.peers[uid];if(!P||P.rs||P.pc.signalingState!=="stable")return;P.rs=true;
  try{P.pc.restartIce?.();await P.pc.setLocalDescription(await P.pc.createOffer({iceRestart:true}));await gvSig(uid,"gv-offer",{offer:P.pc.localDescription})}catch(e){console.warn(e)}finally{P.rs=false}
}
async function gvOnSig(p){
  const G=GV;if(!G||p.sid!==G.sid)return;const u=p.from,me=NEXORA.user.id,t=p.type;
  if(t==="gv-join"||t==="gv-here"){
    if(t==="gv-join")gvSig(u,"gv-here");
    if(me<u&&!G.peers[u]){const P=await gvPeer(u,true);if(!P||GV!==G)return;await P.pc.setLocalDescription(await P.pc.createOffer());gvSig(u,"gv-offer",{offer:P.pc.localDescription})}return}
  if(t==="gv-offer"){const P=await gvPeer(u,false);if(!P||GV!==G)return;
    try{await P.pc.setRemoteDescription(new RTCSessionDescription(p.offer));while(P.queue.length)P.pc.addIceCandidate(P.queue.shift()).catch(()=>{});await P.pc.setLocalDescription(await P.pc.createAnswer());gvSig(u,"gv-answer",{answer:P.pc.localDescription})}catch(e){console.warn(e)}return}
  if(t==="gv-answer"){const P=G.peers[u];if(P)try{await P.pc.setRemoteDescription(new RTCSessionDescription(p.answer));while(P.queue.length)P.pc.addIceCandidate(P.queue.shift()).catch(()=>{})}catch(e){console.warn(e)}return}
  if(t==="gv-ice"){if(!p.candidate)return;const P=G.peers[u];if(!P)(G.pre[u]=G.pre[u]||[]).push(p.candidate);else if(P.pc.remoteDescription)P.pc.addIceCandidate(p.candidate).catch(()=>{});else P.queue.push(p.candidate);return}
  if(t==="gv-nudge"){const P=G.peers[u];if(P?.init)gvRestart(u);return}
  if(t==="gv-leave")gvDrop(u);
}
function gvDrop(u){const P=GV?.peers[u];if(!P)return;clearTimeout(P.t1);clearTimeout(P.lost);clearInterval(P.rt);try{P.pc.close()}catch(_){}if(P.audio){try{P.audio.srcObject=null}catch(_){}P.audio.remove()}delete GV.peers[u];gvPaint()}
function gvLeave(notify){
  const G=GV;if(!G)return;GV=null;clearTimeout(G.ann);
  G.ctx.others.forEach(o=>{if(notify)sendSignal({type:"gv-leave",to:o.id,sid:G.sid}).catch(()=>{});const P=G.peers[o.id];if(P){clearTimeout(P.t1);clearTimeout(P.lost);clearInterval(P.rt);try{P.pc.close()}catch(_){}if(P.audio){try{P.audio.srcObject=null}catch(_){}P.audio.remove()}}});
  try{G.stream.getTracks().forEach(t=>t.stop())}catch(_){}gvPaint();
}
function gvMic(){if(!GV)return;GV.muted=!GV.muted;GV.stream.getAudioTracks().forEach(t=>t.enabled=!GV.muted);navigator.vibrate?.(15);gvPaint()}
function gvSpk(){if(!GV)return;GV.spk=!GV.spk;Object.values(GV.peers).forEach(P=>{if(P.audio)P.audio.muted=!GV.spk});gvPaint()}
function gvRetry(){
  if(!GV)return;const G=GV;
  if(!Object.keys(G.peers).length){gvLeave(false);return gvJoin()}
  Object.keys(G.peers).forEach(u=>{const P=G.peers[u];clearInterval(P.rt);clearTimeout(P.lost);P.lost=null;P.state="wait";gvRecover(u)});
  G.ctx.others.forEach(o=>{if(G.peers[o.id]?.state!=="ok")gvSig(o.id,"gv-join")});
}
const _hsV=handleSignal;
handleSignal=async function(p){if(p?.type?.startsWith("gv-")){if(p.from!==NEXORA.user?.id)gvOnSig(p);return}return _hsV(p)};
addEventListener("online",()=>{if(GV)gvRetry()});
setInterval(()=>{ /* bolne wala indicator */
  const b=$("gvBtn");if(!b)return;let sp=false;
  if(GV&&GV.spk)for(const P of Object.values(GV.peers)){if(P.state!=="ok"||!P.stream)continue;
    try{if(!P.an){const ac=window.__gvac=window.__gvac||new(window.AudioContext||webkitAudioContext)(),a=ac.createAnalyser();a.fftSize=256;ac.createMediaStreamSource(P.stream).connect(a);P.an=a;P.buf=new Uint8Array(a.frequencyBinCount)}
      P.an.getByteFrequencyData(P.buf);let m=0;for(const v of P.buf)m+=v;if(m/P.buf.length>14)sp=true}catch(_){}}
  b.classList.toggle("speak",sp);
},200);

/* ============ LUDO: sync + reconnect + rematch ============ */
const snapOf=L=>({seq:L.seq||0,turn:L.turn,sixes:L.sixes,t:L.players.map(p=>p.tokens.slice()),gone:L.players.map(p=>!!p.gone),win:L.winner||null});
function sendSnap(){const L=LUDO;if(L?.mode==="online")lsend({t:"snap",s:snapOf(L)})}
function applySnap(s,force){
  const L=LUDO;if(!L||L.mode!=="online"||!s||L.busy||L.rolling)return;
  if(!force&&(s.seq<=(L.seq||0)||L.dice))return;
  L.players.forEach((p,i)=>{p.tokens=s.t[i].slice();p.gone=s.gone[i]});
  L.turn=s.turn;L.sixes=s.sixes;L.seq=s.seq;L.dice=null;L.spr.forEach(r=>r.forEach(sp=>sp.slow=false));
  if(s.win&&!L.winner)L.winner=s.win;L.message=cur().name+" ki baari";updateLudo();
}
const _cmL=commit;commit=async function(pl,i){await _cmL(pl,i);if(LUDO)LUDO.seq=(LUDO.seq||0)+1};
let LREM={};
function ludoRemCheck(){
  const L=LUDO;if(!L||L.mode!=="online")return;
  if(LB.every((p,i)=>L.players[i]?.gone||LREM[p.id])){const me=L.me;LREM={};startLudo("online",LB.map(x=>x.name),me)}
}
const _olG=onLudoMsg;
onLudoMsg=function(m){
  if(m.from===NEXORA.user.id)return;
  if(LUDO?.mode==="online"){(LUDO.seen=LUDO.seen||{})[m.from]=NOW()}
  if(m.t==="hb")return;
  if(m.t==="need"){if(LUDO?.me===0)sendSnap();return}
  if(m.t==="snap")return applySnap(m.s,!m.s.auto&&LUDO?.dcSync);
  if(m.t==="rem"){LREM[m.from]=true;ludoRemCheck();return}
  return _olG(m);
};
setInterval(()=>{
  const L=LUDO;let txt=null;
  if(L?.mode==="online"&&LROOM){
    lsend({t:"hb"});const now=NOW();L.seen=L.seen||{};
    if(LROOM.state!=="joined"){txt="Reconnecting game…";L.dc=true}
    else{
      if(L.dc){L.dc=false;L.dcSync=true;lsend({t:"need"});setTimeout(()=>{if(LUDO)LUDO.dcSync=false},4000);toast("Game wapas judd gaya ✓")}
      LB.forEach((p,i)=>{if(p.id===NEXORA.user.id||L.players[i]?.gone||L.winner)return;const s=L.seen[p.id]||(L.seen[p.id]=now),d=now-s;
        if(d>60000)onLudoMsg({t:"leave",from:p.id});else if(d>12000)txt=L.players[i].name+" reconnecting…"});
      if(L.me===0&&!L.busy&&!L.rolling&&!L.dice&&!L.winner&&now-(L.lastSnap||0)>10000){L.lastSnap=now;const s=snapOf(L);s.auto=1;lsend({t:"snap",s})}
    }
  }
  GST.ludo=txt;
},3000);

/* ============ UNO: heartbeat + rematch ============ */
function unoRem(id){
  if(!UG||!UHOST)return;UG.rem=UG.rem||{};UG.rem[id]=true;
  if(UG.seats.every(s=>s.bot||UG.rem[s.id])){const seats=UG.seats.map(s=>({id:s.id,name:s.name,bot:s.bot}));uStart(seats);UI.won=0;UI.lastTop=undefined;uSync()}
}
const _ouG=onUnoMsg;
onUnoMsg=function(m){
  if(m.from===NEXORA.user.id)return;
  if(UHOST&&UG){(UG.seen=UG.seen||{})[m.from]=NOW()}else if(UI)UI.seen=NOW();
  if(m.t==="S"&&UI&&m.pub&&!m.pub.winner)UI.won=0;
  if(m.t==="hb")return;
  if(UHOST&&UG&&m.t==="A"&&m.a==="rem"){unoRem(m.from);return}
  if(UHOST&&UG&&m.t==="A"&&m.a==="need"){uSync();return}
  return _ouG(m);
};
let UDC=false;
setInterval(()=>{
  let txt=null;
  if(UI&&UCH){
    UCH.tx({t:"hb"});const now=NOW();
    if(UCH.state!=="joined"){txt="Reconnecting game…";UDC=true}
    else{
      if(UDC){UDC=false;if(!UHOST)UCH.tx({t:"A",a:"need"});toast("Game wapas judd gaya ✓")}
      if(UHOST&&UG&&!UG.winner){UG.seats.forEach((s,i)=>{if(s.id===NEXORA.user.id||s.bot)return;const d=now-((UG.seen||{})[s.id]||(UG.seen=UG.seen||{},UG.seen[s.id]=now));
        if(d>60000)onUnoMsg({t:"leave",from:s.id});else if(d>12000)txt=s.name+" reconnecting…"})}
      else if(!UHOST&&UI.seen&&now-UI.seen>60000){toast("Host wapas nahi aaya");leaveUno();return}
      else if(!UHOST&&UI.seen&&now-UI.seen>15000)txt="Host reconnecting…";
    }
  }
  GST.uno=txt;
},3000);

/* ============ TIC-TAC-TOE ONLINE (host authoritative) ============ */
let TT=null;
const tttFresh=()=>({b:Array(25).fill(""),t:"X",seq:0,over:false,win:null});
closeTTT=function(){if(TT)clearInterval(TT.hb);if(TCH){try{sb.removeChannel(TCH)}catch(_){}TCH=null}TT=null;GST.ttt=null};
openTTTRoom=async function(code,host){
  closeTTT();const ch=sb.channel("ttt-"+code);TCH=ch;
  const T=TT={code,host,started:false,seen:NOW(),rem:{},hostMark:"X",G:null,me:null,oppId:null};
  ch.tx=T.tx=m=>ch.send({type:"broadcast",event:"g",payload:{...m,from:NEXORA.user.id}}).catch(()=>{});
  ch.on("broadcast",{event:"g"},({payload:m})=>tttMsg(m));
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
  if(TT!==T)return;
  if(!host){let n=0;const iv=setInterval(()=>{if(TT!==T||T.started||++n>12)return clearInterval(iv);T.tx({t:"join"})},1200);T.tx({t:"join"})}
  T.hb=setInterval(()=>tttTick(T),3000);
};
function tttMsg(m){
  const T=TT;if(!T||m.from===NEXORA.user.id)return;
  if(T.started&&m.from!==T.oppId)return;
  T.seen=NOW();
  switch(m.t){
    case"join":if(T.host){if(!T.started){T.started=true;T.oppId=m.from;T.me="X";closeModal();T.tx({t:"start",hm:"X"});tttNew(T,true)}else T.tx({t:"start",hm:T.hostMark})}break;

<script>

document.head.insertAdjacentHTML("beforeend",'<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">');

/* ============ CHAT: sending / waiting / not sent / retry ============ */
const OUT=new Map();let SEEN=new Set(),NOCID=false,RESTORED=false,RATE=[];
const dayKey=d=>new Date(d).toDateString();
const dayLbl=d=>{const x=new Date(d);return x.toDateString()===new Date().toDateString()?"Aaj":x.toDateString()===new Date(Date.now()-864e5).toDateString()?"Kal":x.toLocaleDateString([],{day:"numeric",month:"short"})};
const nearBottom=b=>b.scrollHeight-b.scrollTop-b.clientHeight<120;
function metaOf(m,st){
  if(st==="sending")return"🕓 Sending…";
  if(st==="wait")return"⏳ Waiting for connection";
  if(st==="fail")return`⚠ Not sent · <u onclick="retryMsg('${m.cid}')">Retry</u>`;
  const t=new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});return t+(m.sender_id===NEXORA.user.id?" ✓✓":"");

function bubble(m,st){
  const mine=m.sender_id===NEXORA.user.id;
  return`<div class="msg ${mine?"mine":"theirs"}" ${m.cid?`id="m-${m.cid}"`:""}><div class="bubble ${st==="fail"?"fail":""}">${escapeHtml(m.message)}<span class="mt">${metaOf(m,st)}</span></div></div>`;
}
messageHtml=m=>bubble(m);
function appendWithDay(b,m,st){
  const k=dayKey(m.created_at);let h="";
  if(b.dataset.day!==k){h=`<div class="dsep">${dayLbl(m.created_at)}</div>`;b.dataset.day=k}

const persistOut=()=>{try{const a=[...OUT.values()].map(o=>({cid:o.cid,conv:o.conv,text:o.text,at:o.m.created_at}));localStorage.setItem("nx_out_"+NEXORA.user.id,JSON.stringify(a))}catch(_){}};

  try{JSON.parse(localStorage.getItem("nx_out_"+NEXORA.user.id)||"[]").forEach(o=>{if(!OUT.has(o.cid))OUT.set(o.cid,{cid:o.cid,conv:o.conv,text:o.text,state:"wait",tries:0,m:{cid:o.cid,sender_id:NEXORA.user.id,message:o.text,created_at:o.at}})})}catch(_){}
}
function setSt(o,st){
  o.state=st;const el=$("m-"+o.cid);if(!el)return;
  el.querySelector(".mt").innerHTML=metaOf(o.m,st);el.querySelector(".bubble").classList.toggle("fail",st==="fail");
}
async function flush(cid){
  const o=OUT.get(cid);if(!o||o.busy)return;
  if(!navigator.onLine){setSt(o,"wait");return}
  o.busy=true;setSt(o,"sending");
  try{
    const row={conversation_id:o.conv,sender_id:NEXORA.user.id,message:o.text,message_type:"text"};if(!NOCID)row.client_id=cid;
    const r=await Promise.race([sb.from("messages").insert(row).select().single(),sleep(15000).then(()=>({error:{message:"timeout"}}))]);
    let{data,error}=r;
    if(error&&/client_id/i.test(error.message||"")&&!NOCID){NOCID=true;o.busy=false;return flush(cid)}
    if(error&&error.code==="23505")error=null;           /* pehle hi save ho chuka tha */
    if(error)throw error;
    if(data?.id)SEEN.add(data.id);
    o.m={...o.m,id:data?.id,created_at:data?.created_at||o.m.created_at};
    const el=$("m-"+cid);if(el)el.querySelector(".mt").innerHTML=metaOf(o.m);el?.querySelector(".bubble").classList.remove("fail");
    OUT.delete(cid);persistOut();
  }catch(e){o.tries++;console.warn("send",e);setSt(o,navigator.onLine?"fail":"wait")}

}
const flushAll=()=>OUT.forEach(o=>{if(o.state!=="sending")flush(o.cid)});
const retryMsg=cid=>{const o=OUT.get(cid);if(o){o.tries=0;flush(cid)}};
sendChatMessage=async function(){
  if(!ACTIVE_CHAT)return;const inp=$("chatInput"),text=inp.value.trim().slice(0,2000);if(!text)return;

  inp.value="";const s=$("sendBtn");if(s){s.classList.remove("fire");void s.offsetWidth;s.classList.add("fire")}
