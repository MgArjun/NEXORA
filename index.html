<script>
/* ============ PART B: LUDO v2 (canvas, 2-4 players) ============ */
CanvasRenderingContext2D.prototype.roundRect||(CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)});
const SEATS={2:["red","yellow"],3:["red","green","yellow"],4:["red","green","yellow","blue"]};
const OFF=[[0,0],[-.22,-.18],[.22,-.18],[-.22,.2],[.22,.2]];
let CV=null,CTX=null,BG=null,RAF=0,DPR=1,LB=[];
const shade=(hex,t)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=t<0?0:255,a=Math.abs(t);return`rgb(${Math.round(r+(f-r)*a)},${Math.round(g+(f-g)*a)},${Math.round(b+(f-b)*a)})`};
const xyAt=(pl,i,p)=>{const c=LUDO_COLORS[pl.color];return p<0?BASE2[pl.color][i]:p<=50?TRACK2[(c.start+p)%52]:p<FINISH?c.homeCells[p-51]:FIN[pl.color]};
const isBot=()=>LUDO.mode==="robot"&&LUDO.turn>0;

/* ---------- static board ---------- */
function paintBoard(W){
  BG=document.createElement("canvas");BG.width=BG.height=Math.round(W*DPR);
  const g=BG.getContext("2d");g.scale(DPR,DPR);const S=W/15;
  g.fillStyle="#f4ecd8";g.fillRect(0,0,W,W);
  for(const[k,[r,c]]of Object.entries(YARD)){
    const col=LUDO_COLORS[k].color,x=c*S,y=r*S;
    let gr=g.createLinearGradient(x,y,x+6*S,y+6*S);gr.addColorStop(0,shade(col,.28));gr.addColorStop(1,shade(col,-.25));
    g.fillStyle=gr;g.fillRect(x,y,6*S,6*S);
    g.save();g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=S*.5;g.shadowOffsetY=S*.12;g.fillStyle="#fbf6ea";g.beginPath();g.roundRect(x+S,y+S,4*S,4*S,S*.7);g.fill();g.restore();
    BASE2[k].forEach(([wr,wc])=>{const cx=(wc+.5)*S,cy=(wr+.5)*S,rg=g.createRadialGradient(cx,cy-S*.1,S*.05,cx,cy,S*.5);
      rg.addColorStop(0,"rgba(0,0,0,.06)");rg.addColorStop(1,"rgba(0,0,0,.38)");g.fillStyle=rg;g.beginPath();g.arc(cx,cy,S*.5,0,7);g.fill();
      g.strokeStyle=shade(col,.15);g.lineWidth=S*.07;g.stroke()});
  }
  const tile=(r,c,a,b)=>{const x=c*S+.5,y=r*S+.5,w=S-1,gr=g.createLinearGradient(x,y,x,y+w);gr.addColorStop(0,a);gr.addColorStop(1,b);
    g.fillStyle=gr;g.fillRect(x,y,w,w);g.strokeStyle="rgba(70,45,20,.28)";g.lineWidth=1;g.strokeRect(x,y,w,w);g.fillStyle="rgba(255,255,255,.55)";g.fillRect(x,y,w,1.5)};
  const star=(cx,cy,R,f)=>{g.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,d=k%2?R*.45:R;g.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}g.closePath();g.fillStyle=f;g.fill()};
  const startOf={};Object.entries(LUDO_COLORS).forEach(([k,v])=>startOf[v.start]=k);
  TRACK2.forEach(([r,c],i)=>{const k=startOf[i];
    if(k){const col=LUDO_COLORS[k].color;tile(r,c,shade(col,.25),shade(col,-.12))}else tile(r,c,"#fffdf6","#ebe0c8");
    if(SAFE.has(i))star((c+.5)*S,(r+.5)*S,S*.3,k?"rgba(255,255,255,.9)":"#d9a21b")});
  Object.values(LUDO_COLORS).forEach(v=>v.homeCells.forEach(([r,c])=>tile(r,c,shade(v.color,.25),shade(v.color,-.12))));
  const P=(a,b,col)=>{const gr=g.createLinearGradient(6*S,6*S,9*S,9*S);gr.addColorStop(0,shade(col,.3));gr.addColorStop(1,shade(col,-.2));g.fillStyle=gr;g.beginPath();g.moveTo(a[0]*S,a[1]*S);g.lineTo(b[0]*S,b[1]*S);g.lineTo(7.5*S,7.5*S);g.closePath();g.fill();g.strokeStyle="rgba(0,0,0,.25)";g.lineWidth=1;g.stroke()};
  P([6,6],[6,9],LUDO_COLORS.green.color);P([9,6],[9,9],LUDO_COLORS.blue.color);P([6,6],[6,9],LUDO_COLORS.green.color);
  P([6,9],[9,9],LUDO_COLORS.yellow.color);P([6,6],[6,9],LUDO_COLORS.green.color);P([6,6],[9,6],LUDO_COLORS.red.color);
  const hub=g.createRadialGradient(7.4*S,7.4*S,S*.05,7.5*S,7.5*S,S*.5);hub.addColorStop(0,"#fff");hub.addColorStop(.6,"#e9dcc0");hub.addColorStop(1,"#b89a5a");
  g.fillStyle=hub;g.beginPath();g.arc(7.5*S,7.5*S,S*.42,0,7);g.fill();g.strokeStyle="#d8a94a";g.lineWidth=S*.08;g.stroke();
  const v=g.createRadialGradient(W/2,W/2,W*.35,W/2,W/2,W*.72);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(60,30,0,.3)");g.fillStyle=v;g.fillRect(0,0,W,W);
  const gl=g.createLinearGradient(0,0,W,W);gl.addColorStop(0,"rgba(255,255,255,.25)");gl.addColorStop(.45,"rgba(255,255,255,0)");g.fillStyle=gl;g.fillRect(0,0,W,W);
}
/* ---------- pawn ---------- */
function pawn(g,x,y,z,col,S,sc){
  const r=S*.3*sc;
  g.fillStyle=`rgba(0,0,0,${Math.max(.12,.36-z*.4)})`;g.beginPath();g.ellipse(x,y+r*.55,r*(1.1-z*.5),r*.42,0,0,7);g.fill();
  y-=z*S;const bh=r*2.1,b=y+r*.4;
  const gr=g.createLinearGradient(x-r,0,x+r,0);gr.addColorStop(0,shade(col,-.45));gr.addColorStop(.35,col);gr.addColorStop(.5,shade(col,.45));gr.addColorStop(.7,col);gr.addColorStop(1,shade(col,-.5));
  g.fillStyle=gr;g.beginPath();g.moveTo(x-r,b);g.quadraticCurveTo(x-r*.5,b-bh*.3,x-r*.3,b-bh*.72);g.lineTo(x+r*.3,b-bh*.72);g.quadraticCurveTo(x+r*.5,b-bh*.3,x+r,b);g.ellipse(x,b,r,r*.36,0,0,Math.PI);g.closePath();g.fill();
  g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=S*.045;g.beginPath();g.ellipse(x,b-bh*.72,r*.3,r*.1,0,0,7);g.stroke();
  const hy=b-bh*.72-r*.42,hr=r*.52,hg=g.createRadialGradient(x-hr*.35,hy-hr*.4,hr*.1,x,hy,hr);
  hg.addColorStop(0,"#fff");hg.addColorStop(.25,shade(col,.5));hg.addColorStop(1,shade(col,-.4));g.fillStyle=hg;g.beginPath();g.arc(x,hy,hr,0,7);g.fill();
}
const puff=(x,y,col)=>{for(let k=0;k<20;k++){const a=Math.random()*6.28,s=.04+Math.random()*.1;LUDO.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.03,g:.008,life:1,r:3+Math.random()*2.5,col,rot:0})}};
const confetti=()=>{const cs=["#ef5368","#3fc984","#ffc93c","#4a9dff","#fff"];for(let k=0;k<110;k++)LUDO.parts.push({x:Math.random()*15,y:-Math.random()*3,vx:(Math.random()-.5)*.05,vy:.03+Math.random()*.06,g:.0015,life:4,col:cs[k%5],sq:1,rot:Math.random()*6})};

/* ---------- render loop ---------- */
function frame(){
  const L=LUDO;if(!L||!CV||!CV.isConnected){RAF=0;return}
  const W=CV.clientWidth,S=W/15,g=CTX,t=performance.now()/1000,pl=cur();
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,W);
  if(L.shake>0){g.translate((Math.random()-.5)*L.shake*.5,(Math.random()-.5)*L.shake*.5);L.shake--}
  g.drawImage(BG,0,0,W,W);
  if(!L.winner){const[r,c]=YARD[pl.color],cc=LUDO_COLORS[pl.color].color;g.save();g.strokeStyle=cc;g.globalAlpha=.5+.4*Math.sin(t*4);g.lineWidth=S*.16;g.shadowColor=cc;g.shadowBlur=S;g.strokeRect(c*S+S*.08,r*S+S*.08,6*S-S*.16,6*S-S*.16);g.restore()}
  const can=!L.busy&&!L.rolling&&!!L.dice&&isHuman();
  const groups={};L.players.forEach((p,pi)=>p.tokens.forEach((q,i)=>{const xy=xyAt(p,i,q),k=xy.join("_");(groups[k]=groups[k]||[]).push([pi,i,xy])}));
  const list=[];
  Object.values(groups).forEach(gr=>gr.forEach(([pi,i,xy],n)=>{
    const o=gr.length>1?OFF[Math.min(n+1,4)]:OFF[0],sc=gr.length>1?.8:1,s=L.spr[pi][i],tx=xy[1]+.5+o[0],ty=xy[0]+.5+o[1];
    s.x+=(tx-s.x)*(s.slow?.14:.34);s.y+=(ty-s.y)*(s.slow?.14:.34);
    if(s.slow&&Math.abs(tx-s.x)+Math.abs(ty-s.y)<.05)s.slow=false;
    if(s.vz||s.z){s.z+=s.vz;s.vz-=.036;if(s.z<=0){s.z=0;s.vz=0}}
    list.push({pi,i,s,sc,mov:can&&L.turn===pi&&canMove(L.players[pi].tokens[i],L.dice)})}));
  list.forEach(a=>{if(!a.mov)return;const q=xyAt(pl,a.i,pl.tokens[a.i]===-1?0:pl.tokens[a.i]+L.dice),col=LUDO_COLORS[pl.color].color;
    g.save();g.setLineDash([4,3]);g.strokeStyle=col;g.fillStyle=col+"44";g.lineWidth=2;g.globalAlpha=.6+.4*Math.sin(t*6);g.beginPath();g.arc((q[1]+.5)*S,(q[0]+.5)*S,S*.34,0,7);g.fill();g.stroke();g.restore()});
  list.sort((a,b)=>a.s.y-b.s.y).forEach(a=>{
    const col=LUDO_COLORS[L.players[a.pi].color].color,x=a.s.x*S,y=a.s.y*S;
    if(a.mov){g.save();g.strokeStyle="#fff";g.shadowColor=col;g.shadowBlur=12;g.globalAlpha=.65+.35*Math.sin(t*7);g.lineWidth=2.5;g.beginPath();g.ellipse(x,y+S*.2,S*.38,S*.15,0,0,7);g.stroke();g.restore()}
    pawn(g,x,y,a.s.z+(a.mov&&!a.s.z?.05+.07*Math.abs(Math.sin(t*6)):0),col,S,a.sc)});
  L.parts=L.parts.filter(q=>(q.life-=.02)>0);
  L.parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.rot+=.2;g.globalAlpha=Math.min(1,q.life*1.5);g.fillStyle=q.col;
    if(q.sq){g.save();g.translate(q.x*S,q.y*S);g.rotate(q.rot);g.fillRect(-3,-5,6,10);g.restore()}else{g.beginPath();g.arc(q.x*S,q.y*S,q.r,0,7);g.fill()}});
  g.globalAlpha=1;RAF=requestAnimationFrame(frame);
}
function setupCanvas(){
  CV=$("ludoCv");CTX=CV.getContext("2d");
  const fit=()=>{if(!CV.isConnected)return;DPR=Math.min(devicePixelRatio||1,2.5);const W=CV.clientWidth;CV.width=CV.height=Math.round(W*DPR);paintBoard(W)};
  fit();new ResizeObserver(fit).observe(CV);
  CV.addEventListener("pointerdown",e=>{
    const L=LUDO;if(!L||L.winner||L.busy||L.rolling||!L.dice||!isHuman())return;
    const r=CV.getBoundingClientRect(),S=r.width/15,x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S,pl=cur();let best=null,bd=.8;
    pl.tokens.forEach((p,i)=>{if(!canMove(p,L.dice))return;const s=L.spr[L.turn][i],d=Math.hypot(s.x-x,s.y-.3-y);if(d<bd){bd=d;best=i}});
    if(best!==null)selectLudoToken(pl.color,best)});
  if(!RAF)RAF=requestAnimationFrame(frame);
}

/* ---------- game setup / UI ---------- */
function openLudoMenu(){
  openModal(`<div class="modal-title">Ludo</div><div class="modal-sub">Dost ke saath online khelo</div>
   <button class="btn primary-btn" style="width:100%;margin-bottom:10px" onclick="hostLudo()">🌐 Online room (2-4 log)</button>
   <div style="display:flex;gap:8px;margin-bottom:12px"><input id="roomCode" class="pf-input" style="margin:0;flex:1;min-width:0;text-transform:uppercase" maxlength="6" placeholder="Room code" autocapitalize="characters"><button class="btn" onclick="joinLudo($('roomCode').value.trim().toUpperCase())">Join</button></div>
   <div style="color:var(--muted);font-size:12px;margin:0 0 6px 4px">Robot ke saath</div>
   <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">${[1,2,3].map(n=>`<button class="btn" onclick="startLudo('robot',null,null,${n+1})">🤖 ×${n}</button>`).join("")}</div>
   <button class="btn" style="width:100%" onclick="startLudo('local')">👥 Ek phone par 2 players</button>`);
}
function startLudo(mode="robot",names,me=null,n){
  closeModal();const cnt=names?names.length:(mode==="robot"?(n||2):2);
  const nm=names||(mode==="robot"?["You","Robot","Robot 2","Robot 3"].slice(0,cnt):["Player 1","Player 2"]);
  LUDO={mode,me,n:cnt,players:SEATS[cnt].map((c,i)=>({name:nm[i],color:c,tokens:[-1,-1,-1,-1]})),turn:0,dice:null,rolling:false,busy:false,winner:null,sixes:0,message:"Game shuru!",cubeN:0,parts:[],shake:0};
  LUDO.spr=LUDO.players.map(p=>p.tokens.map((_,i)=>{const xy=xyAt(p,i,-1);return{x:xy[1]+.5,y:xy[0]+.5,z:0,vz:0}}));
  NEXORA.page="games";renderLudo();
}
function renderLudo(){
  const L=LUDO;
  $("main").innerHTML=`<section class="page" style="padding-bottom:20px"><div class="ludo-wrap">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><button class="btn" onclick="leaveLudo()">‹ Games</button>
    ${L.mode==="online"?`<div class="btn" style="display:grid;place-items:center">🌐 ${LROOM?.code||""}</div>`:`<button class="btn" onclick="startLudo(LUDO.mode,null,null,LUDO.n)">↻ Restart</button>`}</div>
   <div id="turnBanner"><i></i><span></span></div>
   <div class="ludo-frame" style="position:relative"><canvas id="ludoCv"></canvas>
    <div class="ludo-bar"><div style="min-width:0"><div id="lMsg" style="font-weight:850"></div><div id="lHint" style="color:var(--muted);font-size:12px;margin-top:3px"></div></div>
     <button id="ludoDice" class="cubewrap" onclick="rollLudoDice()"><div class="cube" id="cube">${[1,2,3,4,5,6].map(n=>`<div class="face f${n}">${pipsHtml(n)}</div>`).join("")}</div></button></div>
    <div class="pcards">${L.players.map((p,i)=>`<div class="pcard" id="pc-${i}" style="--gc:${LUDO_COLORS[p.color].color}"><em></em><div style="min-width:0"><div style="font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name)}${L.me===i?" (You)":""}</div><div id="pcs-${i}"></div></div></div>`).join("")}</div>
   </div></div></section>`;
  setupCanvas();updateLudo();
}
let lastKey=null;
function updateLudo(){
  const L=LUDO;if(!L||!$("turnBanner"))return;
  const pl=cur(),tb=$("turnBanner"),key=L.winner?"w":L.turn;
  tb.style.setProperty("--tb",LUDO_COLORS[pl.color].color);
  tb.querySelector("span").textContent=L.winner?"🏆 "+L.winner+" jeet gaya!":(L.mode!=="local"&&isHuman()?"Aapki baari":pl.name+" ki baari");
  if(key!==lastKey){lastKey=key;tb.classList.remove("swap");void tb.offsetWidth;tb.classList.add("swap")}
  L.players.forEach((p,i)=>{$("pc-"+i).classList.toggle("on",i===L.turn&&!L.winner);const n=p.tokens.filter(x=>x===FINISH).length;$("pcs-"+i).innerHTML=`<div class="hdots">${[0,1,2,3].map(k=>`<s class="${k<n?"on":""}"></s>`).join("")}</div>`});
  const rd=!L.rolling&&!L.busy&&!L.dice&&!L.winner&&isHuman(),d=$("ludoDice");
  d.classList.toggle("ready",rd);d.classList.toggle("off",!rd&&!L.rolling);
  $("lMsg").textContent=L.message;
  $("lHint").textContent=L.winner?"Game khatam":L.rolling?"Rolling…":!isHuman()?pl.name+" ki baari…":L.dice?"Chamakti gotti chuno":"Dice par tap karo";
}

/* ---------- rules / turns ---------- */
function rollLudoDice(){
  if(!LUDO||LUDO.winner||LUDO.rolling||LUDO.busy||LUDO.dice||!isHuman())return;
  const d=rnd6();lsend({t:"roll",d});animateRoll(d);
}
async function animateRoll(d){
  const L=LUDO;L.rolling=true;L.dice=null;updateLudo();spinCube(d);sfx(180,.8,"triangle",.04);navigator.vibrate?.(25);
  await sleep(950);if(LUDO!==L)return;
  L.rolling=false;L.dice=d;const pl=cur();
  L.sixes=d===6?L.sixes+1:0;L.message=`${pl.name} ne ${d} roll kiya`;sfx(d===6?760:420,.12);
  if(L.sixes>=3){L.sixes=0;L.dice=null;L.message=pl.name+": teen 6, turn gaya";updateLudo();await sleep(900);return endTurn()}
  const mv=getMovable();updateLudo();
  if(!mv.length){await sleep(800);L.dice=null;return d===6?again(pl):endTurn()}
  if(isBot()){await sleep(650);return commit(pl,robotPick(pl,mv,d))}
  if(isHuman()&&mv.length===1){await sleep(450);playMove(mv[0])}
}
function robotPick(pl,mv,d){
  const foes=LUDO.players.filter(p=>p!==pl);let best=mv[0],bs=-1;
  mv.forEach(i=>{const p=pl.tokens[i],n=p===-1?0:p+d;let s=n;
    if(p===-1)s+=60;if(n===FINISH)s+=90;
    if(n<=50){const a=(LUDO_COLORS[pl.color].start+n)%52;
      if(SAFE.has(a))s+=25;else if(foes.some(f=>f.tokens.some(q=>q>=0&&q<=50&&(LUDO_COLORS[f.color].start+q)%52===a)))s+=120}
    if(s>bs){bs=s;best=i}});
  return best;
}
function selectLudoToken(color,i){
  const L=LUDO;if(!L||L.winner||L.busy||L.rolling||!L.dice||!isHuman())return;
  const pl=cur();if(pl.color!==color||!canMove(pl.tokens[i],L.dice))return;playMove(i);
}
function playMove(i){lsend({t:"mv",i});return commit(cur(),i)}
async function commit(pl,i){
  const L=LUDO;L.busy=true;const d=L.dice,old=pl.tokens[i],s=L.spr[L.players.indexOf(pl)][i];
  const hop=()=>{s.vz=.18;sfx(300+Math.random()*80,.05,"square",.03)};
  if(old===-1){pl.tokens[i]=0;hop();await sleep(300)}
  else for(let p=old+1;p<=old+d;p++){pl.tokens[i]=p;hop();await sleep(190);if(LUDO!==L)return}
  let cut=false;const p=pl.tokens[i];
  if(p>=0&&p<=50){const a=(LUDO_COLORS[pl.color].start+p)%52;
    if(!SAFE.has(a))L.players.forEach((o,oi)=>{if(o===pl)return;o.tokens=o.tokens.map((q,qi)=>{
      if(q>=0&&q<=50&&(LUDO_COLORS[o.color].start+q)%52===a){cut=true;const t=L.spr[oi][qi];puff(t.x,t.y,LUDO_COLORS[o.color].color);t.slow=true;t.vz=.3;return -1}return q})})}
  if(cut){toast("Gotti kat gayi! 💥");sfx(120,.4,"sawtooth",.07);L.shake=14;await sleep(480)}
  L.dice=null;L.busy=false;
  if(pl.tokens.every(x=>x===FINISH)){
    L.winner=pl.name;L.message=pl.name+" jeet gaya! 🏆";confetti();[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.3),k*140));updateLudo();
    $("ludoCv")?.parentElement.insertAdjacentHTML("beforeend",`<div class="confetti" style="border-radius:26px"><div>🏆<br>${escapeHtml(pl.name)} won!<br><button class="btn primary-btn" style="margin-top:16px" onclick="leaveLudo()">Games</button></div></div>`);return;
  }
  updateLudo();(d===6||cut||p===FINISH)?again(pl):endTurn();
}
function botTurn(){const L=LUDO;if(L&&L.mode==="robot"&&L.turn>0&&!L.winner)setTimeout(()=>{if(LUDO===L&&!L.winner&&L.turn>0)animateRoll(rnd6())},850)}
function again(pl){LUDO.dice=null;LUDO.message=pl.name+" ko dobara chance";updateLudo();botTurn()}
function endTurn(){const L=LUDO;L.sixes=0;L.dice=null;let k=0;do{L.turn=(L.turn+1)%L.players.length}while(L.players[L.turn].gone&&++k<8);L.message=cur().name+" ki baari";updateLudo();botTurn()}

/* ---------- online lobby ---------- */
function lsend(m){LROOM?.send({type:"broadcast",event:"g",payload:{...m,from:NEXORA.user.id}})}
async function openRoom(code,host){
  closeRoom();LB=host?[{id:NEXORA.user.id,name:myName()}]:[];
  const ch=sb.channel("ludo-"+code);LROOM=ch;ch.code=code;ch.host=host;
  ch.on("broadcast",{event:"g"},({payload:m})=>onLudoMsg(m));
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
}
function beginOnline(){if(LB.length<2)return;lsend({t:"start",list:LB});startLudo("online",LB.map(x=>x.name),0)}
function showLobby(){
  const code=LROOM?.code||"",n=Math.max(2,LB.length);
  openModal(`<div class="modal-title">Ludo room 🎲</div><div class="modal-sub">2 se 4 log · code dost ko bhejo</div>
   <div class="card" style="padding:16px;text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;margin-bottom:12px">${code}</div>
   ${LB.map((p,i)=>`<div class="pr"><div class="avatar" style="background:${LUDO_COLORS[SEATS[n][i]||"red"].color}">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}${i===0?" (Host)":""}</div></div>`).join("")}
   <div class="modal-actions" style="margin-top:14px"><button class="btn danger" onclick="closeRoom();closeModal()">Cancel</button><button class="btn primary-btn" ${LB.length<2?'disabled style="opacity:.5"':""} onclick="beginOnline()">Start (${LB.length})</button></div>`);
}
function showWaiting(){
  openModal(`<div class="modal-title">Lobby 🎲</div><div class="modal-sub">Host game shuru karega…</div>${LB.map(p=>`<div class="pr"><div class="avatar">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join("")}<button class="btn danger" style="width:100%;margin-top:14px" onclick="closeRoom();closeModal()">Leave</button>`);
}
async function hostLudo(code){code=code||Math.random().toString(36).slice(2,8).toUpperCase();await openRoom(code,true);showLobby()}
async function joinLudo(code){
  if(!code||code.length<4)return toast("Room code daalo.","error");
  await openRoom(code,false);showWaiting();
  let n=0;const iv=setInterval(()=>{if(LUDO?.mode==="online"||++n>12||!LROOM)return clearInterval(iv);lsend({t:"join",name:myName()})},1500);
  lsend({t:"join",name:myName()});
}
function onLudoMsg(m){
  if(m.from===NEXORA.user.id)return;
  const host=LROOM?.host;
  if(m.t==="join"&&host){
    if(LUDO?.mode==="online"){lsend({t:"start",list:LB});return}
    if(!LB.some(x=>x.id===m.from)&&LB.length<4)LB.push({id:m.from,name:m.name});
    lsend({t:"lobby",list:LB});
    if(typeof PENDING!=="undefined"&&PENDING&&PENDING.code===LROOM.code&&LB.length===2)return beginOnline();
    return showLobby();
  }
  if(m.t==="lobby"&&!host&&!LUDO){LB=m.list;return showWaiting()}
  if(m.t==="start"&&!host&&!LUDO){LB=m.list;const me=LB.findIndex(x=>x.id===NEXORA.user.id);if(me>=0)startLudo("online",LB.map(x=>x.name),me);return}
  if(m.t==="leave"&&!LUDO&&host){LB=LB.filter(x=>x.id!==m.from);return showLobby()}
  if(!LUDO||LUDO.mode!=="online")return;
  const seat=LB.findIndex(x=>x.id===m.from);if(seat<0)return;
  if(m.t==="roll"&&seat===LUDO.turn&&!LUDO.rolling&&!LUDO.dice&&!LUDO.busy)animateRoll(m.d);
  if(m.t==="mv"&&seat===LUDO.turn)(async()=>{while(LUDO&&LUDO.rolling)await sleep(50);if(LUDO&&LUDO.dice&&!LUDO.busy)commit(cur(),m.i)})();
  if(m.t==="leave"){
    const L=LUDO;L.players[seat].gone=true;toast(L.players[seat].name+" ne game chhod diya");
    const alive=L.players.filter(p=>!p.gone);
    if(alive.length<2&&!L.winner){L.winner=alive[0]?.name||"—";L.message="Baaki sab chale gaye";updateLudo()}
    else if(L.turn===seat&&!L.busy&&!L.rolling)endTurn();
  }
}
</script>

<script>
/* ============ PART C: UNO ============ */
const UCOL={r:"#e5384f",y:"#f3b92b",g:"#2fb36a",b:"#2f7fe0"},UN={r:"Red",y:"Yellow",g:"Green",b:"Blue"};
let UG=null,UI=null,UCH=null,UB=[],UHOST=false,UVER=0,UAUTO=null;
GN.uno="🃏 UNO";

/* ---------- engine (host par chalta hai) ---------- */
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function uDeck(){let id=0;const d=[];
  for(const c of"rygb"){d.push({id:id++,c,v:"0"});for(let n=1;n<=9;n++)d.push({id:id++,c,v:""+n},{id:id++,c,v:""+n});["s","r","d"].forEach(v=>d.push({id:id++,c,v},{id:id++,c,v}))}
  for(let k=0;k<4;k++)d.push({id:id++,c:"w",v:"w"},{id:id++,c:"w",v:"f"});return shuf(d)}
const uTop=()=>UG.disc[UG.disc.length-1];
function uDraw(){if(!UG.deck.length&&UG.disc.length>1){const t=UG.disc.pop();UG.deck=shuf(UG.disc.splice(0));UG.disc=[t]}return UG.deck.pop()||null}
function uOk(c,hand){if(c.c==="w")return c.v==="w"||!hand.some(x=>x.c===UG.color);return c.c===UG.color||c.v===uTop().v}
const uNext=(f,k=1)=>{const n=UG.seats.length;return((f+UG.dir*k)%n+n)%n};
function uStart(seats){
  const deck=uDeck();seats.forEach(s=>{s.hand=[];s.said=false;for(let i=0;i<7;i++)s.hand.push(deck.pop())});
  let c=deck.pop();while(c.v==="f"){deck.unshift(c);c=deck.pop()}
  UG={seats,deck,disc:[c],color:c.c==="w"?"rygb"[Math.floor(Math.random()*4)]:c.c,dir:1,turn:0,drew:false,drewId:null,winner:null,catch:null,msg:"Game shuru! 🃏"};
  const n=seats.length;
  if(c.v==="s")UG.turn=1%n;
  else if(c.v==="r"){UG.dir=-1;UG.turn=n===2?1:n-1}
  else if(c.v==="d"){for(let i=0;i<2;i++){const x=uDraw();if(x)seats[0].hand.push(x)}UG.turn=1%n}
}
function uPlay(seat,idx,color){
  if(!UG||UG.winner||UG.turn!==seat)return false;
  const me=UG.seats[seat],card=me.hand[idx];if(!card||!uOk(card,me.hand))return false;
  if(UG.drew&&card.id!==UG.drewId)return false;
  me.hand.splice(idx,1);UG.disc.push(card);UG.color=card.c==="w"?(color||"r"):card.c;UG.catch=null;UG.drew=false;UG.drewId=null;
  const nm=card.c==="w"?(card.v==="f"?"Wild +4":"Wild")+" → "+UN[UG.color]:UN[card.c]+" "+({s:"Skip",r:"Reverse",d:"+2"}[card.v]||card.v);
  UG.msg=`${me.name} ne ${nm} khela`;
  if(!me.hand.length){UG.winner=me.name;return uSync()}
  const n=UG.seats.length;let step=1;
  if(card.v==="s")step=2;
  else if(card.v==="r"){UG.dir*=-1;step=n===2?2:1}
  else if(card.v==="d"||card.v==="f"){const v=uNext(seat),k=card.v==="d"?2:4;for(let i=0;i<k;i++){const x=uDraw();if(x)UG.seats[v].hand.push(x)}UG.seats[v].said=false;step=2;UG.msg+=` · ${UG.seats[v].name} +${k}`}
  if(me.hand.length===1&&!me.said)UG.catch={seat,until:Date.now()+4500};
  if(me.hand.length>1)me.said=false;
  UG.turn=uNext(seat,step);return uSync();
}
function uDrawAct(seat){
  if(!UG||UG.winner||UG.turn!==seat||UG.drew)return;
  const me=UG.seats[seat],c=uDraw();UG.catch=null;
  if(!c){UG.msg=me.name+": deck khaali, pass";UG.turn=uNext(seat);return uSync()}
  me.hand.push(c);me.said=false;UG.msg=me.name+" ne card uthaya";
  if(uOk(c,me.hand)){UG.drew=true;UG.drewId=c.id}else{UG.drew=false;UG.drewId=null;UG.turn=uNext(seat);UG.msg+=" · pass"}
  uSync();
}
function uPass(seat){if(UG&&!UG.winner&&UG.turn===seat&&UG.drew){UG.drew=false;UG.drewId=null;UG.msg=UG.seats[seat].name+" ne pass kiya";UG.turn=uNext(seat);uSync()}}
function uSay(seat){const s=UG?.seats[seat];if(!s||UG.winner)return;s.said=true;if(UG.catch&&UG.catch.seat===seat)UG.catch=null;UG.msg=s.name+": UNO! 🔔";uSync()}
function uCatch(by){
  if(!UG||!UG.catch||UG.catch.seat===by||Date.now()>UG.catch.until+800)return;
  const t=UG.seats[UG.catch.seat];for(let i=0;i<2;i++){const x=uDraw();if(x)t.hand.push(x)}
  UG.msg=`${UG.seats[by].name} ne pakad liya! ${t.name} +2 😈`;UG.catch=null;uSync();
}
function uBot(){
  if(!UG||UG.winner)return;const g=UG,s=g.seats[g.turn];if(!s.bot)return;
  setTimeout(()=>{if(UG!==g||g.winner||g.seats[g.turn]!==s)return;
    const seat=g.turn,hand=s.hand,ok=hand.map((c,i)=>[c,i]).filter(([c])=>(!g.drew||c.id===g.drewId)&&uOk(c,hand));
    if(!ok.length)return g.drew?uPass(seat):uDrawAct(seat);
    const cnt={r:0,y:0,g:0,b:0};hand.forEach(c=>{if(c.c!=="w")cnt[c.c]++});
    const nxt=g.seats[uNext(seat)].hand.length;
    ok.sort((a,b)=>sc(b[0])-sc(a[0]));function sc(c){return(c.c==="w"?-5:0)+(["s","r","d"].includes(c.v)?(nxt<=2?6:2):0)+(cnt[c.c]||0)}
    const[c,i]=ok[0],rest=hand.filter(x=>x!==c),col=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][1]?Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]:"rygb"[Math.floor(Math.random()*4)];
    if(hand.length===2&&Math.random()<.9)s.said=true;
    uPlay(seat,i,col);
  },1100+Math.random()*600);
}
function uPub(){return{seats:UG.seats.map(s=>({id:s.id,name:s.name,n:s.hand.length,said:s.said})),top:uTop(),color:UG.color,dir:UG.dir,turn:UG.turn,deck:UG.deck.length,msg:UG.msg,winner:UG.winner,catchSeat:UG.catch?UG.catch.seat:-1,drew:UG.drew,drewId:UG.drewId,ver:++UVER}}
function uSync(){
  const p=uPub();UI.pub=p;UI.hand=UG.seats[UI.me].hand.slice();
  if(UCH){UCH.tx({t:"S",pub:p});UG.seats.forEach((s,i)=>{if(i!==UI.me&&!s.bot)UCH.tx({t:"H",to:s.id,hand:s.hand})})}
  uRender();uBot();
}

/* ---------- UI ---------- */
const ucard=(c,cls="",ex="")=>{const sy={s:"⊘",r:"⇄",d:"+2",w:"★",f:"+4"}[c.v]||c.v;
  return `<div class="uc ${c.c==="w"?"uw":""} ${cls}" style="--cc:${c.c==="w"?"#1b1b25":UCOL[c.c]}" ${ex}><i>${sy}</i><b>${sy}</b><i class="br">${sy}</i></div>`};
const uback=()=>`<div class="uc ub"><b>UNO</b></div>`;
function uRender(){
  if(!UI||NEXORA.page!=="games")return;
  const P=UI.pub,main=$("main");
  if(!P){main.innerHTML=`<section class="page u-page"><div class="chat-empty" style="margin:auto;color:#cfe8dc">🃏<br>Cards bant rahe hain…</div></section>`;return}
  const old=$("uHand")?.scrollLeft||0,me=UI.me,n=P.seats.length,my=P.turn===me&&!P.winner;
  let land=false;if(UI.lastTop!==P.top.id){if(UI.lastTop!==undefined){sfx(P.top.c==="w"?700:420,.1,"square",.04);navigator.vibrate?.(12)}land=true;UI.lastTop=P.top.id}
  if(P.winner&&!UI.won){UI.won=1;[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.3),k*140))}
  if(P.catchSeat>=0&&UI.cv!==P.ver){UI.cv=P.ver;setTimeout(()=>{if(UI&&UI.pub&&UI.pub.ver===UI.cv){UI.pub.catchSeat=-1;uRender()}},4600)}
  const okc=c=>my&&(!P.drew||c.id===P.drewId)&&(c.c==="w"?(c.v==="w"||!UI.hand.some(x=>x.c===P.color)):(c.c===P.color||c.v===P.top.v));
  const opps=[];for(let k=1;k<n;k++)opps.push((me+k)%n);
  const canUno=UI.hand.length>0&&UI.hand.length<=2&&!P.seats[me].said&&!P.winner,showCatch=P.catchSeat>=0&&P.catchSeat!==me;
  main.innerHTML=`<section class="page u-page">
   <div class="u-top"><button class="btn" onclick="leaveUno()">‹ Games</button><div class="u-msg">${escapeHtml(P.msg||"")}</div>${UCH?`<div class="btn" style="display:grid;place-items:center">🌐 ${UCH.code}</div>`:""}</div>
   <div class="u-opps">${opps.map(i=>{const s=P.seats[i];return `<div class="u-op ${P.turn===i&&!P.winner?"on":""}"><div class="avatar" style="width:38px;height:38px">${escapeHtml(initials(s.name))}</div><div style="font-size:12px;font-weight:800;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(s.name)}</div><div class="u-fan">${Array.from({length:Math.min(s.n,8)},()=>"<s></s>").join("")}</div><div class="u-n ${s.n===1?"red":""}">${s.n===1?"UNO!":s.n+" cards"}</div></div>`}).join("")}</div>
   <div class="u-mid"><button class="u-deck" onclick="uAct('draw')" ${my&&!P.drew?"":"disabled"}>${uback()}<small>${P.deck} bache</small></button>
    <div class="u-disc" style="--rc:${UCOL[P.color]}">${ucard(P.top,land?"land":"")}</div><div class="u-dir" style="animation-direction:${P.dir>0?"normal":"reverse"}">⟳</div></div>
   <div class="u-turn" style="color:${UCOL[P.color]}">${P.winner?"":(my?"Aapki baari":escapeHtml(P.seats[P.turn].name)+" ki baari")+" · "+UN[P.color]}</div>
   <div class="u-act">${canUno?`<button class="uno-btn" onclick="uAct('say')">UNO!</button>`:""}${my&&P.drew?`<button class="btn" onclick="uAct('pass')">Pass ➜</button>`:""}${showCatch?`<button class="btn danger" onclick="uAct('catch')">Pakdo! 🫵 ${escapeHtml(P.seats[P.catchSeat].name)}</button>`:""}</div>
   <div id="uHand" class="u-hand ${my?"mine":""}">${UI.hand.map((c,i)=>ucard(c,okc(c)?"ok":(my?"no":""),`onclick="uTap(${i})"`)).join("")}</div>
   ${P.winner?`<div class="confetti" style="z-index:20"><div>🏆<br>${escapeHtml(P.winner)} jeet gaya!<br><button class="btn primary-btn" style="margin-top:16px" onclick="leaveUno()">Games</button></div></div>`:""}
  </section>`;
  $("uHand").scrollLeft=old;
}
function uTap(i){
  const P=UI?.pub;if(!P||P.turn!==UI.me||P.winner)return;const c=UI.hand[i];
  const ok=(!P.drew||c.id===P.drewId)&&(c.c==="w"?(c.v==="w"||!UI.hand.some(x=>x.c===P.color)):(c.c===P.color||c.v===P.top.v));
  if(!ok){navigator.vibrate?.(30);return toast(c.v==="f"?"Wild +4 tab chalta hai jab current rang ka card na ho":P.drew?"Sirf wahi card khelo jo uthaya":"Ye card nahi chalega")}
  if(c.c!=="w")return uSubmit(i,null);
  openModal(`<div class="modal-title">Rang chuno 🎨</div><div class="modal-sub">Agla rang kaunsa?</div><div class="cpick">${Object.entries(UCOL).map(([k,v])=>`<button style="background:${v}" onclick="closeModal();uSubmit(${i},'${k}')">${UN[k]}</button>`).join("")}</div>`);
}
function uSubmit(i,col){if(UI.host)uPlay(UI.me,i,col);else UCH?.tx({t:"A",a:"play",i,col})}
function uAct(a){
  if(!UI)return;
  if(UI.host){({draw:uDrawAct,pass:uPass,say:uSay,catch:uCatch})[a](UI.me)}else UCH?.tx({t:"A",a});
}

/* ---------- start / rooms ---------- */
function startUno(nb){
  closeModal();closeUnoRoom();
  const names=["Robot","Robot 2","Robot 3"];
  uStart([{id:NEXORA.user.id,name:myName()},...Array.from({length:nb},(_,i)=>({id:"bot"+i,name:names[i],bot:true}))]);
  UI={me:0,host:true,pub:null,hand:[]};NEXORA.page="games";uSync();
}
function openUnoMenu(){
  openModal(`<div class="modal-title">UNO 🃏</div><div class="modal-sub">Dost ke saath online khelo</div>
   <button class="btn primary-btn" style="width:100%;margin-bottom:10px" onclick="hostUno()">🌐 Online room (2-4 log)</button>
   <div style="display:flex;gap:8px;margin-bottom:12px"><input id="unoCode" class="pf-input" style="margin:0;flex:1;min-width:0;text-transform:uppercase" maxlength="6" placeholder="Room code" autocapitalize="characters"><button class="btn" onclick="joinUno($('unoCode').value.trim().toUpperCase())">Join</button></div>
   <div style="color:var(--muted);font-size:12px;margin:0 0 6px 4px">Robot ke saath</div>
   <div class="grid" style="grid-template-columns:repeat(3,1fr)">${[1,2,3].map(n=>`<button class="btn" onclick="startUno(${n})">🤖 ×${n}</button>`).join("")}</div>`);
}
async function openUnoRoom(code,host){
  closeUnoRoom();UHOST=host;UB=host?[{id:NEXORA.user.id,name:myName()}]:[];UG=null;UI=null;
  const ch=sb.channel("uno-"+code);UCH=ch;ch.code=code;
  ch.tx=m=>ch.send({type:"broadcast",event:"u",payload:{...m,from:NEXORA.user.id}});
  ch.on("broadcast",{event:"u"},({payload:m})=>onUnoMsg(m));
  await new Promise(r=>ch.subscribe(s=>{if(s==="SUBSCRIBED")r()}));
}
function closeUnoRoom(){if(UCH){try{sb.removeChannel(UCH)}catch(_){}UCH=null}}
function showUnoLobby(){
  openModal(`<div class="modal-title">UNO room 🃏</div><div class="modal-sub">2 se 4 log · code dost ko bhejo</div>
   <div class="card" style="padding:16px;text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;margin-bottom:12px">${UCH?.code||""}</div>
   ${UB.map((p,i)=>`<div class="pr"><div class="avatar">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}${i===0?" (Host)":""}</div></div>`).join("")}
   <div class="modal-actions" style="margin-top:14px"><button class="btn danger" onclick="closeUnoRoom();closeModal()">Cancel</button><button class="btn primary-btn" ${UB.length<2?'disabled style="opacity:.5"':""} onclick="beginUno()">Start (${UB.length})</button></div>`);
}
function showUnoWait(){openModal(`<div class="modal-title">UNO lobby 🃏</div><div class="modal-sub">Host game shuru karega…</div>${UB.map(p=>`<div class="pr"><div class="avatar">${escapeHtml(initials(p.name))}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join("")}<button class="btn danger" style="width:100%;margin-top:14px" onclick="closeUnoRoom();closeModal()">Leave</button>`)}
async function hostUno(code){code=code||Math.random().toString(36).slice(2,8).toUpperCase();await openUnoRoom(code,true);showUnoLobby()}
async function joinUno(code){
  if(!code||code.length<4)return toast("Room code daalo.","error");
  await openUnoRoom(code,false);showUnoWait();
  let k=0;const iv=setInterval(()=>{if(UI||++k>12||!UCH)return clearInterval(iv);UCH.tx({t:"join",name:myName()})},1500);
  UCH.tx({t:"join",name:myName()});
}
function beginUno(){
  if(UB.length<2||!UCH)return;
  UCH.tx({t:"start",list:UB});
  uStart(UB.map(p=>({id:p.id,name:p.name})));
  closeModal();UI={me:0,host:true,pub:null,hand:[]};NEXORA.page="games";uSync();
}
function onUnoMsg(m){
  if(m.from===NEXORA.user.id)return;
  if(UHOST){
    if(m.t==="join"){
      if(UG)return;
      if(!UB.some(x=>x.id===m.from)&&UB.length<4)UB.push({id:m.from,name:m.name});
      UCH.tx({t:"lobby",list:UB});
      if(UAUTO&&UAUTO===UCH.code&&UB.length===2)return beginUno();
      return showUnoLobby();
    }
    if(!UG){if(m.t==="leave"){UB=UB.filter(x=>x.id!==m.from);showUnoLobby()}return}
    const s=UG.seats.findIndex(x=>x.id===m.from);if(s<0)return;
    if(m.t==="A")({play:()=>uPlay(s,m.i,m.col),draw:()=>uDrawAct(s),pass:()=>uPass(s),say:()=>uSay(s),catch:()=>uCatch(s)})[m.a]?.();
    if(m.t==="leave"){const x=UG.seats[s];x.bot=true;x.name+=" (bot)";UG.msg=x.name+" chala gaya, ab bot khelega";uSync()}
  }else{
    if(m.t==="lobby"&&!UI){UB=m.list;showUnoWait()}
    if(m.t==="start"&&!UI){UB=m.list;const me=UB.findIndex(x=>x.id===NEXORA.user.id);if(me>=0){closeModal();UI={me,host:false,pub:null,hand:[]};NEXORA.page="games";uRender()}}
    if(m.t==="S"&&UI){if(UI.pub&&m.pub.ver<UI.pub.ver)return;UI.pub=m.pub;uRender()}
    if(m.t==="H"&&UI&&m.to===NEXORA.user.id){UI.hand=m.hand;uRender()}
    if(m.t==="end"){toast("Host ne game band kar diya");UI=null;closeUnoRoom();setPage("games")}
  }
}
function leaveUno(){
  if(UCH)UCH.tx({t:UHOST?"end":"leave"});
  closeUnoRoom();UG=null;UI=null;UAUTO=null;setPage("games");
}
const _spC=setPage;setPage=function(p){
  if(UI&&NEXORA.page==="games"){if(UCH)UCH.tx({t:UHOST?"end":"leave"});closeUnoRoom();UG=null;UI=null;UAUTO=null}
  return _spC(p);
};

/* ---------- game request flow (chat/call arc se) ---------- */
const _rgC=requestGame;
requestGame=async function(uid,name,game){
  if(game!=="uno")return _rgC(uid,name,game);
  if(uid===NEXORA.user.id)return;
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  try{
    await openUnoRoom(code,true);UAUTO=code;PENDING={code,game:"uno",uid,name};
    await sendSignal({type:"game-req",to:uid,game:"uno",code,fromName:myName()});
    openModal(`<div class="modal-title">Request bhej di 🎮</div><div class="modal-sub">${escapeHtml(name)} ke accept karne ka wait…</div><div class="card" style="padding:18px;text-align:center;font-weight:850;margin-bottom:14px">🃏 UNO</div><button class="btn danger" style="width:100%" onclick="cancelGame()">Cancel</button>`);
    setTimeout(()=>{if(PENDING?.code===code)cancelGame(true)},45000);
  }catch(e){toast(e.message||"Request nahi gayi","error")}
};
const _cgC=cancelGame;cancelGame=function(t){if(PENDING?.game==="uno"){closeUnoRoom();UAUTO=null}_cgC(t)};
const _agC=acceptGame;
acceptGame=function(){
  if(INREQ?.game==="uno"){const r=INREQ;INREQ=null;closeModal();sendSignal({type:"game-accept",to:r.from,code:r.code}).catch(()=>{});joinUno(r.code);return}
  _agC();
};
const _hsC=handleSignal;
handleSignal=async function(p){
  if(p&&p.type==="game-declined"&&PENDING?.game==="uno"&&PENDING.code===p.code){closeUnoRoom();UAUTO=null}
  return _hsC(p);
};

/* ---------- games page ---------- */
function renderGames(){
  const q=(i,n,d,a)=>`<button class="card quick-card" onclick="${a}"><div class="quick-icon">${i}</div><div><div class="quick-name">${n}</div><div class="quick-desc">${d}</div></div></button>`;
  $("main").innerHTML=`<section class="page"><h1 class="section-title">Games</h1><div class="section-sub">Dost ke saath khelo.</div>
   <div class="grid grid2">${q("🎲","Ludo","Online 2-4 ya robot","openLudoMenu()")}${q("🃏","UNO","Online 2-4 ya robot","openUnoMenu()")}${q("❌","Tic-Tac-Toe","5×5 · 4 in a row","openTicTacToe()")}</div>
   <div class="card" style="padding:16px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.5">💡 Chat ya call me upar ki pattee neeche kheencho (ya 🎮 dabao), dost ko game ki request bhejo. Accept karte hi dono game me pahunch jaoge.</div></section>`;
}
</script>
