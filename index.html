/* =========================================================
   CALL SYSTEM
   ========================================================= */

async function startCallByUsername(username){
  const result=await safe(async()=>{
    return await db.rpc("nexora_start_call",{
      target_username:username,
      call_kind:"voice"
    });
  });

  if(!result)return;

  const call=result.data;

  const {data:receiver}=await db.from("profiles")
    .select("*")
    .eq("username",username)
    .maybeSingle();

  state.call={
    id:call.call_id,
    direction:"outgoing",
    remoteId:receiver?.id,
    remoteProfile:receiver,
    status:"ringing"
  };

  showCallUI("outgoing");
  await prepareSignalChannel();
  startRingtone(false);

  /* caller waits for accepted state */
  await waitForCallAccepted();
}

async function waitForCallAccepted(){
  if(!state.call)return;

  const channel=db.channel("nexora-call-state-"+state.call.id);

  channel.on("postgres_changes",{
    event:"UPDATE",
    schema:"public",
    table:"calls",
    filter:`id=eq.${state.call.id}`
  },async payload=>{
    const c=payload.new;

    if(c.status==="accepted"){
      stopRingtone();
      state.call.status="accepted";
      showCallUI("active");

      if(state.call.direction==="outgoing"){
        await createOffer();
      }
    }

    if(["declined","cancelled","missed","ended"].includes(c.status)){
      cleanupCall();
    }
  }).subscribe();

  state.callStateChannel=channel;
}

async function prepareSignalChannel(){
  if(!state.user||!state.call)return;

  if(state.signalChannel){
    await db.removeChannel(state.signalChannel);
  }

  const channel=db.channel("nexora-signal-"+state.user.id,{
    config:{
      broadcast:{ack:true}
    }
  });

  channel
    .on("broadcast",{event:"call-offer"},async({payload})=>{
      if(!state.call||payload.callId!==state.call.id)return;

      await ensurePeer();

      const desc=new RTCSessionDescription(payload.offer);
      await state.peer.setRemoteDescription(desc);

      const answer=await state.peer.createAnswer();
      await state.peer.setLocalDescription(answer);

      await channel.send({
        type:"broadcast",
        event:"call-answer",
        payload:{
          callId:state.call.id,
          answer:{
            type:answer.type,
            sdp:answer.sdp
          },
          to:state.call.remoteId
        }
      });
    })

    .on("broadcast",{event:"call-answer"},async({payload})=>{
      if(!state.call||payload.callId!==state.call.id)return;
      if(!state.peer)return;

      await state.peer.setRemoteDescription(
        new RTCSessionDescription(payload.answer)
      );
    })

    .on("broadcast",{event:"call-ice"},async({payload})=>{
      if(!state.call||payload.callId!==state.call.id)return;
      if(!state.peer)return;

      try{
        await state.peer.addIceCandidate(
          new RTCIceCandidate(payload.candidate)
        );
      }catch(e){
        console.warn("ICE",e);
      }
    })

    .subscribe();

  state.signalChannel=channel;
}

async function ensurePeer(){
  if(state.peer)return state.peer;

  state.peer=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });

  state.peer.onicecandidate=async e=>{
    if(!e.candidate||!state.signalChannel||!state.call)return;

    await state.signalChannel.send({
      type:"broadcast",
      event:"call-ice",
      payload:{
        callId:state.call.id,
        candidate:e.candidate,
        to:state.call.remoteId
      }
    });
  };

  state.peer.ontrack=e=>{
    if(!state.remoteAudio){
      state.remoteAudio=document.createElement("audio");
      state.remoteAudio.autoplay=true;
      state.remoteAudio.playsInline=true;
      document.body.appendChild(state.remoteAudio);
    }

    state.remoteStream=e.streams[0];
    state.remoteAudio.srcObject=state.remoteStream;
    state.remoteAudio.volume=state.speaker?1:1;

    state.remoteAudio.play().catch(()=>{});
  };

  state.peer.onconnectionstatechange=()=>{
    const status=state.peer?.connectionState;

    if(status==="connected"){
      if(state.call?.status==="accepted"){
        startCallTimer();
        $("callState").textContent="Connected";
      }
    }

    if(["failed","disconnected","closed"].includes(status)){
      if(state.call?.status==="accepted"){
        $("callState").textContent="Connection lost";
      }
    }
  };

  return state.peer;
}

async function prepareMicrophone(){
  if(state.localStream)return state.localStream;

  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error("Microphone is not available. Use HTTPS.");
  }

  state.localStream=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true,
      channelCount:1
    },
    video:false
  });

  return state.localStream;
}

async function createOffer(){
  if(!state.call)return;

  try{
    const stream=await prepareMicrophone();
    await ensurePeer();

    stream.getTracks().forEach(track=>{
      if(!state.peer.getSenders().some(s=>s.track===track)){
        state.peer.addTrack(track,stream);
      }
    });

    const offer=await state.peer.createOffer({
      offerToReceiveAudio:true
    });

    await state.peer.setLocalDescription(offer);

    await state.signalChannel.send({
      type:"broadcast",
      event:"call-offer",
      payload:{
        callId:state.call.id,
        offer:{
          type:offer.type,
          sdp:offer.sdp
        },
        to:state.call.remoteId
      }
    });
  }catch(e){
    console.error(e);
    toast("Microphone permission is required");
    await endCall("cancelled");
  }
}

async function handleIncomingCallChange(payload){
  const c=payload.new;

  if(payload.event==="INSERT"&&c.status==="ringing"){
    if(c.receiver_id!==state.user.id)return;

    /* avoid showing a second call */
    if(state.call)return;

    const {data:caller}=await db.from("profiles")
      .select("*")
      .eq("id",c.caller_id)
      .maybeSingle();

    state.call={
      id:c.id,
      direction:"incoming",
      remoteId:c.caller_id,
      remoteProfile:caller,
      status:"ringing"
    };

    showCallUI("incoming");
    startRingtone(true);
    await prepareSignalChannel();
  }

  if(state.call?.id===c.id){
    if(c.status==="accepted"){
      stopRingtone();
      state.call.status="accepted";

      if(state.call.direction==="incoming"){
        await prepareMicrophone();
        await ensurePeer();
        showCallUI("active");
      }
    }

    if(["declined","cancelled","missed","ended"].includes(c.status)){
      cleanupCall();
    }
  }
}

function handleOutgoingCallChange(payload){
  const c=payload.new;

  if(!state.call||state.call.id!==c.id)return;

  if(c.status==="accepted"){
    stopRingtone();
    state.call.status="accepted";
    showCallUI("active");
  }

  if(["declined","cancelled","missed","ended"].includes(c.status)){
    cleanupCall();
  }
}

async function acceptIncoming(){
  if(!state.call)return;

  stopRingtone();

  state.call.status="accepted";

  const {error}=await db.from("calls").update({
    status:"accepted",
    started_at:new Date().toISOString()
  }).eq("id",state.call.id);

  if(error){
    toast(error.message);
    cleanupCall();
    return;
  }

  try{
    await prepareMicrophone();
    await ensurePeer();
    showCallUI("active");
  }catch(e){
    toast("Microphone permission denied");
    await endCall("ended");
  }
}

async function declineIncoming(){
  if(!state.call)return;

  stopRingtone();

  await db.from("calls").update({
    status:"declined",
    ended_at:new Date().toISOString()
  }).eq("id",state.call.id);

  cleanupCall();
}

async function endCall(status="ended"){
  const call=state.call;
  if(!call)return;

  stopRingtone();

  if(call.id){
    await db.from("calls").update({
      status,
      ended_at:new Date().toISOString()
    }).eq("id",call.id);
  }

  cleanupCall();
}

async function toggleMute(){
  if(!state.localStream)return;

  state.callMuted=!state.callMuted;

  state.localStream.getAudioTracks().forEach(t=>{
    t.enabled=!state.callMuted;
  });

  $("muteCall")?.classList.toggle("active",state.callMuted);
}

function toggleSpeaker(){
  state.speaker=!state.speaker;

  if(state.remoteAudio){
    state.remoteAudio.volume=state.speaker?1:1;
    state.remoteAudio.setAttribute("data-speaker",state.speaker?"on":"off");
  }

  $("speakerCall")?.classList.toggle("active",state.speaker);
}

function showCallUI(mode){
  const call=state.call;
  if(!call)return;

  const profile=call.remoteProfile;

  $("callName").textContent=profile?.display_name||profile?.username||"NEXORA";

  if(profile?.avatar_url){
    $("callAvatar").innerHTML=`<img src="${esc(profile.avatar_url)}">`;
  }else{
    $("callAvatar").textContent=initials(profile?.display_name||profile?.username);
  }

  $("callOverlay").classList.add("show");

  $("incomingActions").classList.toggle("hidden",mode!=="incoming");
  $("activeCallControls").classList.toggle("hidden",mode!=="active");

  if(mode==="incoming"){
    $("callState").textContent="Incoming voice call";
    $("callTimer").textContent="";
  }

  if(mode==="outgoing"){
    $("callState").textContent="Calling…";
    $("callTimer").textContent="Ringing";
  }

  if(mode==="active"){
    $("callState").textContent="Connecting…";
    startCallTimer();
  }
}

function startCallTimer(){
  if(state.callTimer)return;

  if(!state.callStartedAt){
    state.callStartedAt=Date.now();
  }

  state.callTimer=setInterval(()=>{
    if(!state.callStartedAt)return;
    $("callTimer").textContent=formatDuration(
      (Date.now()-state.callStartedAt)/1000
    );
  },1000);
}

function startRingtone(incoming){
  stopRingtone();

  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)return;

    const ctx=new AudioContext();
    state.ringtone=ctx;

    const playTone=()=>{
      if(!state.ringtone)return;

      const osc=ctx.createOscillator();
      const gain=ctx.createGain();

      osc.type="sine";
      osc.frequency.value=incoming?660:520;
      gain.gain.value=.035;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime+.35);
    };

    playTone();
    state.ringtoneTimer=setInterval(playTone,1200);
  }catch(e){
    console.warn("ringtone unavailable",e);
  }
}

function stopRingtone(){
  clearInterval(state.ringtoneTimer);
  state.ringtoneTimer=null;

  try{
    state.ringtone?.close();
  }catch(e){}

  state.ringtone=null;
}

function cleanupCall(){
  stopRingtone();

  clearInterval(state.callTimer);
  state.callTimer=null;

  if(state.localStream){
    state.localStream.getTracks().forEach(t=>t.stop());
    state.localStream=null;
  }

  if(state.peer){
    state.peer.ontrack=null;
    state.peer.onicecandidate=null;
    state.peer.close();
    state.peer=null;
  }

  if(state.remoteAudio){
    state.remoteAudio.srcObject=null;
    state.remoteAudio.remove();
    state.remoteAudio=null;
  }

  if(state.callStateChannel){
    db.removeChannel(state.callStateChannel);
    state.callStateChannel=null;
  }

  if(state.signalChannel){
    db.removeChannel(state.signalChannel);
    state.signalChannel=null;
  }

  state.call=null;
  state.callStartedAt=null;
  state.callMuted=false;
  state.speaker=false;

  $("callOverlay")?.classList.remove("show");
}

/* =========================================================
   RANDOM CONNECTION
   ========================================================= */

async function randomConnect(type){
  toast("Searching for someone…");

  const channel=db.channel(
    "nexora-random-"+type,
    {config:{presence:{key:state.user.id}}}
  );

  await channel.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      await channel.track({
        id:state.user.id,
        username:state.profile.username,
        display_name:state.profile.display_name,
        type
      });

      setTimeout(async()=>{
        const presence=channel.presenceState();
        const users=[];

        Object.values(presence).forEach(arr=>{
          arr.forEach(x=>{
            if(x.id!==state.user.id&&x.type===type)users.push(x);
          });
        });

        if(!users.length){
          toast("Still waiting…");
          return;
        }

        const target=users.sort((a,b)=>
          String(a.id).localeCompare(String(b.id))
        )[0];

        if(state.user.id>target.id)return;

        if(type==="chat"){
          const {data:p}=await db.from("profiles")
            .select("*")
            .eq("id",target.id)
            .maybeSingle();

          const {data:conversationId}=await db.rpc(
            "nexora_get_or_create_dm",
            {target_username:p.username}
          );

          db.removeChannel(channel);

          openChat({
            conversation_id:conversationId,
            other_id:p.id,
            other_username:p.username,
            other_display_name:p.display_name,
            other_online:true
          });
        }
      },1800);
    }
  });

  setTimeout(()=>{
    db.removeChannel(channel);
  },30000);
}

/* =========================================================
   TIC TAC TOE
   ========================================================= */

function startTic(mode){
  state.game={
    type:"tic",
    mode,
    board:Array(9).fill(""),
    turn:"X",
    over:false
  };

  renderGamePage("Tic-Tac-Toe",`
    <div id="ticBoard" style="
      display:grid;
      grid-template-columns:repeat(3,1fr);
      width:min(90vw,420px);
      margin:25px auto;
      gap:8px
    "></div>

    <div id="ticStatus" style="text-align:center;color:var(--muted)"></div>

    <button class="action secondary" style="margin-top:18px" onclick="startTic('${mode}')">
      Restart
    </button>
  `);

  renderTic();
}

function renderTic(){
  const b=$("ticBoard");
  if(!b)return;

  b.innerHTML=state.game.board.map((v,i)=>`
    <button onclick="ticMove(${i})" style="
      aspect-ratio:1;
      border-radius:18px;
      background:var(--panel);
      color:white;
      border:1px solid var(--border);
      font-size:clamp(40px,12vw,75px);
      font-weight:800
    ">${v}</button>
  `).join("");

  $("ticStatus").textContent=state.game.over
    ?"Game over"
    :`${state.game.turn}'s turn`;
}

function ticMove(i){
  const g=state.game;
  if(!g||g.over||g.board[i])return;

  g.board[i]=g.turn;

  const result=ticResult(g.board);

  if(result){
    g.over=true;
    renderTic();
    toast(result==="draw"?"Draw":result+" wins");
    return;
  }

  g.turn=g.turn==="X"?"O":"X";
  renderTic();

  if(g.mode==="robot"&&g.turn==="O"){
    setTimeout(ticRobot,300);
  }
}

function ticResult(b){
  const wins=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  for(const w of wins){
    if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])
      return b[w[0]];
  }

  return b.every(Boolean)?"draw":null;
}

function ticRobot(){
  const g=state.game;
  if(!g||g.over)return;

  const available=g.board.map((v,i)=>v?null:i).filter(x=>x!==null);
  if(!available.length)return;

  /* win */
  for(const i of available){
    const copy=[...g.board];
    copy[i]="O";
    if(ticResult(copy)==="O"){
      g.board[i]="O";
      g.turn="X";
      renderTic();
      return;
    }
  }

  /* block */
  for(const i of available){
    const copy=[...g.board];
    copy[i]="X";
    if(ticResult(copy)==="X"){
      g.board[i]="O";
      g.turn="X";
      renderTic();
      return;
    }
  }

  const preferred=[4,0,2,6,8,1,3,5,7];
  const i=preferred.find(x=>available.includes(x));

  g.board[i]="O";
  g.turn="X";
  renderTic();
}

function startConnect4(mode){

  renderGamePage("Four in a Row",`

    </button>
  `);

}

function renderConnect4(){
  const b=$("c4Board");
  if(!b)return;

  b.innerHTML=state.game.board.map((v,i)=>`
    <button onclick="c4Move(${i%7})" style="
      aspect-ratio:1;
      border-radius:50%;
      background:${v==="R"?"#ff5369":v==="Y"?"#ffd34d":"#10131a"};
      border:0;
      box-shadow:inset 0 2px 6px rgba(0,0,0,.35)
    "></button>
  `).join("");

  $("c4Status").textContent=state.game.over
    ?"Game over"
    :`${state.game.turn==="R"?"Red":"Yellow"}'s turn`;
}

function c4Move(col){
  const g=state.game;
  if(!g||g.over)return;

  let row=-1;

  for(let r=5;r>=0;r--){
    const i=r*7+col;
    if(!g.board[i]){
      row=r;
      break;
    }
  }

  if(row<0)return;

  g.board[row*7+col]=g.turn;

  if(c4Win(g.board,row,col,g.turn)){
    g.over=true;
    renderConnect4();
    toast(g.turn==="R"?"Red wins":"Yellow wins");
    return;
  }

  if(g.board.every(Boolean)){
    g.over=true;
    renderConnect4();
    toast("Draw");
    return;
  }

  g.turn=g.turn==="R"?"Y":"R";
  renderConnect4();

  if(g.mode==="robot"&&g.turn==="Y"){
    setTimeout(c4Robot,300);
  }
}

function c4Win(b,r,c,p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];

  for(const [dr,dc] of dirs){
    let n=1;

    for(const sign of [-1,1]){
      let rr=r+dr*sign;
      let cc=c+dc*sign;

      while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr*7+cc]===p){
        n++;
        rr+=dr*sign;
        cc+=dc*sign;
      }
    }

    if(n>=4)return true;
  }

  return false;
}

function c4Robot(){
  const g=state.game;
  if(!g||g.over)return;

  const cols=[3,2,4,1,5,0,6];
  const possible=cols.filter(c=>g.board[c]===null||g.board[c+7]===null||
    g.board[c+14]===null||g.board[c+21]===null||
    g.board[c+28]===null||g.board[c+35]===null);

  if(!possible.length)return;

  const col=possible[Math.floor(Math.random()*possible.length)];
  c4Move(col);
}

/* =========================================================
   LUDO
   ========================================================= */

const LUDO_PATH=[
  [6,1],[6,2],[6,3],[6,4],[6,5],
  [5,6],[4,6],[3,6],[2,6],[1,6],
  [0,6],[0,7],[0,8],
  [1,8],[2,8],[3,8],[4,8],[5,8],
  [6,9],[6,10],[6,11],[6,12],[6,13],
  [7,13],[8,13],
  [8,12],[8,11],[8,10],[8,9],
  [9,8],[10,8],[11,8],[12,8],[13,8],
  [14,8],[14,7],[14,6],
  [13,6],[12,6],[11,6],[10,6],[9,6],
  [8,5],[8,4],[8,3],[8,2],[8,1],
  [8,0],[7,0],[6,0]
];

const COLORS=["red","green","yellow","blue"];

function startLudo(mode){
  state.ludo={
    mode,
    turn:0,
    dice:0,
    winner:null,
    players:[
      {name:state.profile?.display_name||"You",color:"red",tokens:[-1,-1,-1,-1]},
      {name:"Robot",color:"green",tokens:[-1,-1,-1,-1]}
    ]
  };

  renderGamePage("Ludo",`
    <div class="gamebar">
      <div>
        <strong id="ludoTurn">Your turn</strong>
        <div class="small">Classic Ludo</div>
      </div>
      <button class="action secondary" style="width:auto" onclick="rollLudo()">Roll</button>
    </div>

    <div class="dice" id="ludoDice">–</div>

    <div class="boardwrap">
      <div id="ludoBoard" class="ludo"></div>
    </div>

    <div style="margin-top:20px" class="small">
      Roll 6 to bring a token out. Reach home with all four tokens.
    </div>
  `);

  renderLudo();
}

function ludoCellClass(r,c){
  if(r<6&&c<6)return "red";
  if(r<6&&c>8)return "green";
  if(r>8&&c<6)return "blue";
  if(r>8&&c>8)return "yellow";

  const track=LUDO_PATH.some(([x,y])=>x===r&&y===c);

  if(track){
    const safe=[
      "6,1","1,8","8,13","13,6","8,1","6,12","12,8","1,6"
    ];
    return "track "+(safe.includes(`${r},${c}`)?"safe":"");
  }

  if(r>=6&&r<=8&&c>=6&&c<=8)return "ludo-center";

  return "track";
}

function renderLudo(){
  const b=$("ludoBoard");
  if(!b||!state.ludo)return;

  let html="";

  for(let r=0;r<15;r++){
    for(let c=0;c<15;c++){
      const cls=ludoCellClass(r,c);

      let tokenHTML="";

      for(let p=0;p<state.ludo.players.length;p++){
        const player=state.ludo.players[p];

        for(let t=0;t<4;t++){
          const pos=player.tokens[t];

          if(pos>=0&&pos<LUDO_PATH.length){
            const [rr,cc]=LUDO_PATH[pos];

            if(rr===r&&cc===c){
              tokenHTML+=`
                <div class="token ${player.color}" title="${esc(player.name)}"></div>
              `;
            }
          }
        }
      }

      html+=`
        <div class="lcell ${cls}">
          ${tokenHTML}
        </div>
      `;
    }
  }

  b.innerHTML=html;

  const player=state.ludo.players[state.ludo.turn];

  $("ludoTurn").textContent=
    state.ludo.winner
      ? `${state.ludo.winner.name} wins`
      : `${player.name}'s turn`;

  $("ludoDice").textContent=state.ludo.dice||"–";
}

function rollLudo(){
  const g=state.ludo;
  if(!g||g.winner||g.dice)return;

  const p=g.players[g.turn];

  if(g.mode==="robot"&&g.turn===1)return;

  g.dice=Math.floor(Math.random()*6)+1;

  const moves=p.tokens
    .map((x,i)=>ludoCanMove(p,x,g.dice)?i:null)
    .filter(x=>x!==null);

  renderLudo();

  if(!moves.length){
    setTimeout(()=>{
      const extra=g.dice===6;
      g.dice=0;

      if(!extra)g.turn=(g.turn+1)%g.players.length;

      renderLudo();

      if(g.mode==="robot"&&g.turn===1){
        setTimeout(robotLudo,500);
      }
    },600);

    return;
  }

  const chosen=moves[Math.floor(Math.random()*moves.length)];
  setTimeout(()=>moveLudo(chosen),350);
}

function ludoCanMove(player,pos,dice){
  if(pos===-1)return dice===6;
  if(pos>=52)return false;
  return pos+dice<=57;
}

function moveLudo(tokenIndex){
  const g=state.ludo;
  const p=g.players[g.turn];

  if(!g.dice||!p)return;

  const old=p.tokens[tokenIndex];

  if(!ludoCanMove(p,old,g.dice))return;

  let target=old;

  if(old===-1){
    target=0;
  }else{
    target+=g.dice;
  }

  p.tokens[tokenIndex]=target;

  if(target<52){
    for(let i=0;i<g.players.length;i++){
      if(i===g.turn)continue;

      for(let t=0;t<4;t++){
        if(g.players[i].tokens[t]===target){
          g.players[i].tokens[t]=-1;
        }
      }
    }
  }

  const won=p.tokens.every(x=>x>=57);

  g.dice=0;

  if(won){
    g.winner=p;
    renderLudo();
    return;
  }

  const extra=
    old>=0&&target<52&&
    g.dice===6;

  if(!extra){
    g.turn=(g.turn+1)%g.players.length;
  }

  renderLudo();

  if(g.mode==="robot"&&g.turn===1){
    setTimeout(robotLudo,500);
  }
}

function robotLudo(){
  const g=state.ludo;
  if(!g||g.winner||g.turn!==1||g.dice)return;

  const p=g.players[1];

  const moves=p.tokens
    .map((x,i)=>ludoCanMove(p,x,g.dice)?i:null)
    .filter(x=>x!==null);

  if(!moves.length){
    const d=g.dice;
    g.dice=0;
    if(d!==6)g.turn=0;
    renderLudo();
    return;
  }

  let best=moves[0];

  moves.forEach(i=>{
    const x=p.tokens[i];
    if(x>=0&&x+g.dice>p.tokens[best])best=i;
    if(x===-1&&g.dice===6)best=i;
  });

  setTimeout(()=>moveLudo(best),300);
}
