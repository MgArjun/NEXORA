<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<meta name="author" content="Suraj Kumar">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070a10;--card:#0f1623;--line:rgba(255,255,255,.09);--tx:#f4f6fb;--mu:#8b97ab;--a:#7c8cff;--b:#b07cff;--g:#3fd68f;--r:#ff6377;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer}
.hide{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column}
.grad{background:linear-gradient(135deg,#fff,#8e9cff,#c18cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pw{font-size:11px;color:var(--mu);letter-spacing:.4px}.pw b{color:#aab3ff}

/* splash: 3D cube */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:26px;background:radial-gradient(circle at 50% 40%,#1a2140,#070a10 70%);transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
.scene{width:96px;height:96px;perspective:500px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 3.2s var(--ease) both}
.cube i{position:absolute;inset:0;border-radius:18px;border:2px solid rgba(160,172,255,.7);background:linear-gradient(135deg,rgba(124,140,255,.5),rgba(176,124,255,.35));box-shadow:inset 0 0 22px rgba(255,255,255,.2)}
.cube i:nth-child(1){transform:translateZ(48px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(48px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(48px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(48px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(48px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(48px)}
@keyframes spin{from{transform:rotateX(-80deg) rotateY(-200deg) scale(.3);opacity:0}to{transform:rotateX(-25deg) rotateY(335deg) scale(1);opacity:1}}
#splash h1{margin:0;font-size:44px;letter-spacing:-2px;font-weight:900;animation:rise 1s .5s var(--ease) both}
#splash .pw{animation:rise 1s .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}

#splash,#auth{position:relative;overflow:hidden}#splash{position:fixed}
#splash::before,#splash::after,#auth::before,#auth::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.42;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
#splash::before,#auth::before{background:#6b7cff;top:-90px;left:-90px}
#splash::after,#auth::after{background:#b36bff;bottom:-100px;right:-90px;animation-delay:-6s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
.scene{position:relative;margin-bottom:14px}
.scene::before,.scene::after{content:"";position:absolute;inset:-34px;border-radius:50%;border:2px solid rgba(140,155,255,.55);opacity:0;animation:rip 2.4s ease-out infinite}
.scene::after{animation-delay:1.2s}
@keyframes rip{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
#splash .tg{color:var(--mu);font-size:13px;letter-spacing:6px;margin-top:-14px;animation:rise 1s .9s var(--ease) both}
.ld{width:130px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;animation:rise 1s 1.1s var(--ease) both}
.ld::after{content:"";display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--b));animation:ldm 1.3s ease-in-out infinite}
@keyframes ldm{from{transform:translateX(-100%)}to{transform:translateX(330%)}}
.acard{position:relative;z-index:1}
/* auth */
#auth{flex:1;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,rgba(124,140,255,.16),transparent 40%),radial-gradient(circle at 85% 85%,rgba(176,124,255,.14),transparent 40%)}
.acard{width:min(420px,100%);padding:30px;border-radius:28px;border:1px solid var(--line);background:rgba(15,22,35,.9);box-shadow:0 24px 70px rgba(0,0,0,.45);animation:pop .6s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}}
.acard h1{margin:0;font-size:30px;letter-spacing:-1px}
.acard p{color:var(--mu);margin:6px 0 22px}
input{width:100%;height:52px;padding:0 16px;margin-bottom:12px;border-radius:15px;border:1px solid var(--line);background:#0a101b;outline:none}
input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(124,140,255,.14)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;background:#182234;border:1px solid var(--line);font-weight:700;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.5}
.pri{background:linear-gradient(135deg,#7889ff,#9a78ff);border-color:transparent;box-shadow:0 10px 26px rgba(124,140,255,.3)}
.red{color:#ff8797;background:rgba(255,99,119,.12)}
.wide{width:100%}
#amsg{min-height:20px;font-size:13px;text-align:center;margin:10px 0 0;color:var(--mu)}
.sw{text-align:center;margin-top:14px;font-size:14px;color:var(--mu)}.sw button{color:#a8b0ff;font-weight:700;font-size:14px}

/* shell */
#shell{flex:1;min-height:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 12px;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);background:rgba(7,10,16,.85);backdrop-filter:blur(18px)}
.top .mid{text-align:center;line-height:1.1}.top .mid b{font-size:19px;font-weight:900;letter-spacing:-.5px}
.ib{width:42px;height:42px;border-radius:13px;background:#111a28;border:1px solid var(--line);position:relative}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--r);box-shadow:0 0 10px var(--r)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:linear-gradient(135deg,#697cff,#a26cff);flex:none}
main{flex:1;min-height:0;position:relative}
.pg{height:100%;overflow:auto;padding:20px 18px 28px;animation:fade .4s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.nav{flex:none;height:68px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(8,11,17,.95);backdrop-filter:blur(18px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box}
.nav button{display:grid;place-content:center;justify-items:center;gap:3px;color:#778398;font-size:11px;position:relative}
.nav span{font-size:21px;transition:transform .3s var(--ease)}
.nav .on{color:#a8b0ff}.nav .on span{transform:translateY(-2px) scale(1.18)}
.nav .on::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--a),var(--b))}
h2{font-size:27px;margin:2px 0 6px;letter-spacing:-.8px}.sub{color:var(--mu);margin:0 0 18px}
.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#141c2b,#0d131e)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qc{padding:18px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s var(--ease)}
.qc:active{transform:scale(.96)}.qc .i{font-size:28px}.qc b{display:block}.qc small{color:var(--mu)}
.live{display:inline-flex;gap:8px;align-items:center;color:#7ce3ae;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.row{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:10px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:36px;height:36px;border-radius:11px;background:#141d2d;border:1px solid var(--line);font-size:15px}
.empty{padding:30px;text-align:center;color:var(--mu)}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px}
.md{width:min(480px,100%);max-height:88dvh;overflow:auto;background:#101722;border:1px solid var(--line);border-radius:26px;padding:22px;animation:pop .3s var(--ease) both}
.md h3{margin:0 0 4px;font-size:21px}
#toast{position:fixed;left:50%;bottom:96px;z-index:9000;transform:translate(-50%,14px);padding:12px 16px;border-radius:14px;background:#121925;border:1px solid var(--line);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* chat */
.chat{padding:0!important;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(12,17,25,.8)}
.cb{flex:1;min-height:0;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:5px}
.m{max-width:80%;padding:9px 13px 6px;border-radius:19px;line-height:1.4;word-break:break-word;animation:mi .3s var(--ease) both}
@keyframes mi{from{opacity:0;transform:translateY(12px) scale(.94)}}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#6f82ff,#9a74f0);border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:6px}
.m small{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:2px}
.cp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cp input{margin:0;border-radius:26px;flex:1}
.snd{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7889ff,#a077ff);flex:none}

/* tic-tac-toe */
.bd{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:420px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:13px;background:#162033;border:1px solid var(--line);font-size:clamp(24px,8vw,42px);font-weight:900;transition:transform .15s var(--ease)}
.cell:active{transform:scale(.9)}
.cell.n{animation:cp .35s var(--ease)}@keyframes cp{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.cell.w{background:linear-gradient(135deg,#2b3c78,#5a3a96);box-shadow:0 0 22px rgba(124,140,255,.6);animation:wn .8s ease-in-out infinite alternate}
@keyframes wn{to{transform:scale(1.07)}}
.X{color:#9aa7ff}.O{color:#ff8999}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><h1 class="grad">NEXORA</h1><div class="tg">CHAT · CALL · PLAY</div><div class="ld"></div><div class="pw">Powered by <b>Suraj Kumar</b></div></div>

<div id="app">
  <section id="auth" class="hide">
    <div class="acard">
      <h1 class="grad">NEXORA</h1>
      <p>Chat with people online and play games while you talk.</p>
      <div id="fLogin">
        <input id="em" type="email" placeholder="Email" autocomplete="email">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
        <button id="bLogin" class="btn pri wide">Log in</button>
        <div style="height:10px"></div>
        <button id="bGuest" class="btn wide">Continue as guest</button>
      </div>
      <div id="fSign" class="hide">
        <input id="sn" placeholder="Display name" maxlength="30">
        <input id="se" type="email" placeholder="Email" autocomplete="email">
        <input id="sp" type="password" placeholder="Password (6+ characters)" autocomplete="new-password">
        <button id="bSign" class="btn pri wide">Create account</button>
      </div>
      <div id="amsg"></div>
      <div class="sw"><span id="swT">New here?</span> <button id="swB">Create account</button></div>
      <div class="pw" style="text-align:center;margin-top:18px">Powered by <b>Suraj Kumar</b></div>
    </div>
  </section>

  <section id="shell" class="hide">
    <header class="top">
      <button id="bell" class="ib" aria-label="Notifications">🔔<i id="bdot" class="dot hide"></i></button>
      <div class="mid"><b class="grad">NEXORA</b><div class="pw">Powered by <b>Suraj Kumar</b></div></div>
      <button id="prof" class="av" aria-label="Profile">N</button>
    </header>
    <main id="main"></main>
    <nav class="nav" id="nav">
      <button data-p="home" class="on"><span>⌂</span>Home</button>
      <button data-p="recent"><span>◷</span>Recent</button>
      <button data-p="connect"><span>◎</span>Connect</button>
      <button data-p="games"><span>♟</span>Games</button>
      <button data-p="settings"><span>⚙</span>Settings</button>
    </nav>
  </section>
</div>
<div id="toast"></div>
<div id="ov" class="ov hide"><div id="md" class="md"></div></div>

<script>
const sb=supabase.createClient("https://ktwluvpmzisonmootdqc.supabase.co","sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm",{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const S={user:null,me:null,page:"home",tab:"home",sound:localStorage.nx_snd!=="0",live:1,convs:[],chat:null,ch:null,lch:null};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=n=>(n||"N").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"N";
const jget=(k,d)=>{try{return JSON.parse(localStorage[k])??d}catch(_){return d}};
const myName=()=>S.me?.display_name||S.me?.username||"Player";
const nick=(id,fb)=>jget("nx_nick",{})[id]||fb;
let AC;
function sfx(f=440,d=.08,t="sine",v=.05){if(!S.sound)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(_){}}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2600)}
function openModal(h){$("md").innerHTML=h;$("ov").classList.remove("hide")}
function closeModal(){$("ov").classList.add("hide")}
$("ov").onclick=e=>{if(e.target===$("ov"))closeModal()};
document.addEventListener("pointerdown",e=>{if(e.target.closest(".btn,.qc,.cell,.nav button,.ib"))sfx(520,.04,"triangle",.025)});

/* ---------- auth ---------- */
const amsg=(t,c)=>{$("amsg").textContent=t||"";$("amsg").style.color=c==="e"?"#ff8190":c==="o"?"#65dda1":""};
function authMode(s){$("fLogin").classList.toggle("hide",s);$("fSign").classList.toggle("hide",!s);$("swT").textContent=s?"Already have an account?":"New here?";$("swB").textContent=s?"Log in":"Create account";amsg("")}
$("swB").onclick=()=>authMode($("fSign").classList.contains("hide"));
const busy=b=>["bLogin","bGuest","bSign"].forEach(i=>$(i).disabled=b);
async function ensureProfile(u){
  try{
    const{data}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();if(data)return data;
    const m=u.user_metadata||{},nm=m.display_name||(u.email?u.email.split("@")[0]:"Guest");
    let un=nm.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,12);if(un.length<3)un="user";un+="_"+u.id.replace(/-/g,"").slice(0,5);
    const{data:c}=await sb.from("profiles").insert({id:u.id,username:un,display_name:nm,is_guest:!!u.is_anonymous,online:true,last_seen:new Date().toISOString()}).select("*").maybeSingle();return c;
  }catch(_){return null}
}
async function enter(u){
  S.user=u;$("auth").classList.add("hide");$("shell").classList.remove("hide");
  S.me=await ensureProfile(u);paintAv();go("home");startLive();checkNotes();
  sb.from("profiles").update({online:true,last_seen:new Date().toISOString()}).eq("id",u.id).then(()=>{},()=>{});
}
const paintAv=()=>{$("prof").textContent=ini(myName())};
$("bLogin").onclick=async()=>{
  const email=$("em").value.trim(),password=$("pw").value;if(!email||!password)return amsg("Enter your email and password.","e");
  busy(1);amsg("Signing in…");try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await enter(data.user)}catch(e){amsg(e.message,"e")}busy(0)};
$("bGuest").onclick=async()=>{
  busy(1);amsg("Opening guest mode…");try{const{data,error}=await sb.auth.signInAnonymously();if(error)throw error;amsg("");await enter(data.user)}
  catch(e){amsg(/anonymous/i.test(e.message)?"Guest mode is turned off in Supabase Auth.":e.message,"e")}busy(0)};
$("bSign").onclick=async()=>{
  const name=$("sn").value.trim(),email=$("se").value.trim(),password=$("sp").value;
  if(!name||!email)return amsg("Fill in every field.","e");if(password.length<6)return amsg("Password needs at least 6 characters.","e");
  busy(1);amsg("Creating your account…");
  try{const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)throw error;
    if(data.session)await enter(data.user);else{authMode(false);amsg("Account created. Confirm your email, then log in.","o")}}catch(e){amsg(e.message,"e")}busy(0)};
[["em","bLogin"],["pw","bLogin"],["sp","bSign"]].forEach(([i,b])=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")$(b).click()}));
async function logout(){
  try{await sb.from("profiles").update({online:false,last_seen:new Date().toISOString()}).eq("id",S.user.id)}catch(_){}
  [S.ch,S.lch].forEach(c=>{if(c)sb.removeChannel(c)});S.ch=S.lch=null;await sb.auth.signOut();
  S.user=S.me=null;$("shell").classList.add("hide");$("auth").classList.remove("hide");authMode(false)}

/* ---------- live count ---------- */
function startLive(){
  if(S.lch)sb.removeChannel(S.lch);
  const ch=S.lch=sb.channel("nx-live",{config:{presence:{key:S.user.id}}});
  ch.on("presence",{event:"sync"},()=>{S.live=Math.max(1,Object.keys(ch.presenceState()).length);const e=$("liveN");if(e)e.textContent=S.live+(S.live===1?" person":" people")+" online"});
  ch.subscribe(async s=>{if(s==="SUBSCRIBED")try{await ch.track({at:Date.now()})}catch(_){}});
}

/* ---------- navigation ---------- */
const PG={home:renderHome,recent:renderRecent,connect:renderConnect,games:renderGames,settings:renderSettings};
function go(p){
  if(S.ch){sb.removeChannel(S.ch);S.ch=null}S.chat=null;S.ttt=null;
  S.page=S.tab=p;[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.p===p));PG[p]()}
$("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.p)};
const page=h=>$("main").innerHTML=`<section class="pg">${h}</section>`;

/* ---------- home ---------- */
function renderHome(){
  const q=(i,n,d,p)=>`<button class="card qc" onclick="go('${p}')"><span class="i">${i}</span><span><b>${n}</b><small>${d}</small></span></button>`;
  page(`<div class="card" style="padding:22px;margin-bottom:14px">
    <div class="live"><i></i><span id="liveN">${S.live} ${S.live===1?"person":"people"} online</span></div>
    <h2 style="margin-top:12px">Welcome, ${esc(myName())}</h2>
    <p class="sub" style="margin:0">Stay happy. Stay healthy. Stay connected with the people who matter.</p></div>
    <div class="grid">${q("◷","Recent","Your chats and requests","recent")}${q("◎","Connect","Find people to talk to","connect")}${q("♟","Games","Play while you chat","games")}${q("⚙","Settings","Profile and sound","settings")}</div>
    <div class="pw" style="text-align:center;padding:22px 0 4px">Powered by <b>Suraj Kumar</b></div>`);
}

/* ---------- recent ---------- */
async function renderRecent(){
  page(`<h2>Recent</h2><p class="sub">One thread for each person.</p><div id="rc"><div class="card empty">Loading…</div></div>`);
  let rows=[];try{const{data,error}=await sb.rpc("nexora_my_conversations");if(error)throw error;rows=data||[]}catch(_){}
  if(S.page!=="recent")return;
  const hid=jget("nx_hide",[]);S.convs=rows.filter(c=>!hid.includes(c.conversation_id));
  $("rc").innerHTML=S.convs.length?S.convs.map((c,i)=>{const nm=nick(c.other_id,c.other_display_name||c.other_username);
    return`<div class="card row"><button class="av" onclick="openIdx(${i})">${esc(ini(nm))}</button><button class="t" onclick="openIdx(${i})"><b>${esc(nm)}</b><small>${esc(c.last_message||"Say hello")}</small></button>
    <button class="mini" aria-label="Rename" onclick="renameIdx(${i})">✎</button><button class="mini" aria-label="Hide chat" onclick="hideIdx(${i})">🗑</button></div>`}).join(""):
    `<div class="card empty">No chats yet. Open Connect to find someone.</div>`;
}
const openIdx=i=>{const c=S.convs[i];openChat(c.conversation_id,c.other_id,c.other_username,nick(c.other_id,c.other_display_name||c.other_username))};
function renameIdx(i){const c=S.convs[i];openModal(`<h3>Nickname</h3><p class="sub">Only you can see this name.</p><input id="nk" maxlength="30" value="${esc(nick(c.other_id,""))}" placeholder="${esc(c.other_display_name||c.other_username)}"><div class="grid"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveNick('${esc(c.other_id)}')">Save</button></div>`)}
function saveNick(id){const m=jget("nx_nick",{}),v=$("nk").value.trim();v?m[id]=v:delete m[id];localStorage.nx_nick=JSON.stringify(m);closeModal();renderRecent()}
function hideIdx(i){const c=S.convs[i];openModal(`<h3>Remove this chat?</h3><p class="sub">It disappears from Recent on this device. Messages stay saved.</p><div class="grid"><button class="btn" onclick="closeModal()">Keep</button><button class="btn red" onclick="doHide('${esc(c.conversation_id)}')">Remove</button></div>`)}
function doHide(id){const h=jget("nx_hide",[]);h.push(id);localStorage.nx_hide=JSON.stringify(h);closeModal();renderRecent()}

/* ---------- chat ---------- */
async function openChat(cid,otherId,un,name){
  try{if(!cid){const{data,error}=await sb.rpc("nexora_get_or_create_dm",{target_username:un});if(error)throw error;cid=data}}catch(e){return toast("Could not open this chat.")}
  S.chat={cid,otherId,un,name,seen:new Set()};S.page="chat";
  $("main").innerHTML=`<section class="pg chat"><div class="ch"><button class="ib" onclick="go('recent')" aria-label="Back">‹</button><div class="av">${esc(ini(name))}</div><div style="flex:1;min-width:0"><b>${esc(name)}</b><div class="pw">@${esc(un)}</div></div></div>
   <div id="cb" class="cb"></div><div class="cp"><input id="ci" placeholder="Write a message" autocomplete="off" maxlength="2000" enterkeyhint="send"><button class="snd" onclick="sendMsg()" aria-label="Send">➤</button></div></section>`;
  $("ci").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMsg()}});
  const{data}=await sb.from("messages").select("*").eq("conversation_id",cid).order("created_at",{ascending:true}).limit(300);
  if(S.chat?.cid!==cid)return;(data||[]).forEach(addMsg);
  if(S.ch)sb.removeChannel(S.ch);
  S.ch=sb.channel("chat-"+cid).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+cid},p=>addMsg(p.new)).subscribe();
}
function addMsg(m){
  const b=$("cb");if(!b||!S.chat||S.chat.seen.has(m.id))return;S.chat.seen.add(m.id);
  const mine=m.sender_id===S.user.id,t=new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  b.insertAdjacentHTML("beforeend",`<div class="m ${mine?"me":"th"}">${esc(m.message)}<small>${t}</small></div>`);b.scrollTop=b.scrollHeight;if(!mine)sfx(700,.08);
}
async function sendMsg(){
  const i=$("ci"),text=i.value.trim();if(!text||!S.chat)return;i.value="";sfx(600,.06);
  const{data,error}=await sb.from("messages").insert({conversation_id:S.chat.cid,sender_id:S.user.id,message:text,message_type:"text"}).select().single();
  if(error){i.value=text;return toast("Message not sent. Check your connection and try again.")}addMsg(data);
}

/* ---------- connect ---------- */
function renderConnect(){
  page(`<h2>Connect</h2><p class="sub">Find someone and start talking.</p>
   <div class="card" style="padding:16px;margin-bottom:14px"><b>Find by username</b><div style="display:flex;gap:8px;margin-top:10px"><input id="us" style="margin:0;flex:1" placeholder="@username" autocapitalize="off" autocomplete="off"><button class="btn pri" onclick="findUser()">Search</button></div></div>
   <div id="sr"></div>
   <button class="card qc wide" style="width:100%;min-height:auto;flex-direction:row;align-items:center;gap:14px" onclick="findOnline()"><span class="i">🎲</span><span><b>Find online people</b><small>Chat with someone available now</small></span></button>`);
  $("us").addEventListener("keydown",e=>{if(e.key==="Enter")findUser()});
}
const person=(p,extra)=>`<div class="card" style="padding:16px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:12px"><div class="av">${esc(ini(p.display_name||p.username))}</div><div style="flex:1;min-width:0"><b>${esc(p.display_name||p.username)}</b><div class="pw">@${esc(p.username)} · ${p.online?"Online":"Offline"}</div></div></div>${extra}</div>`;
async function findUser(){
  const u=$("us").value.trim().replace(/^@/,"");if(u.length<3)return toast("Type at least 3 letters.");
  const{data}=await sb.from("profiles").select("id,username,display_name,online").ilike("username",u).limit(1).maybeSingle();
  $("sr").innerHTML=data?person(data,`<div class="grid" style="margin-top:14px"><button class="btn pri" onclick="openChat('','${esc(data.id)}','${esc(data.username)}','${esc(data.display_name||data.username)}')">Text</button><button class="btn" onclick="addFriend('${esc(data.id)}')">Add friend</button></div>`):`<div class="card empty" style="margin-bottom:12px">No user with that username.</div>`;
}
async function addFriend(id){
  if(id===S.user.id)return toast("That is you.");
  const{error}=await sb.from("friendships").insert({requester_id:S.user.id,addressee_id:id,status:"pending"});
  if(error)return toast(/duplicate|unique/i.test(error.message)?"Request already sent.":"Could not send the request.");
  sb.from("notifications").insert({user_id:id,type:"friend_request",title:"New friend request",body:myName()+" wants to be your friend",data:{from:S.user.id}}).then(()=>{},()=>{});toast("Friend request sent.");
}
async function findOnline(){
  $("sr").innerHTML=`<div class="card empty" style="margin-bottom:12px">Looking for people…</div>`;
  const{data}=await sb.from("profiles").select("id,username,display_name,online").eq("online",true).neq("id",S.user.id).limit(20);
  if(!data?.length)return $("sr").innerHTML=`<div class="card empty" style="margin-bottom:12px">Nobody is online right now. Try again soon.</div>`;
  const p=data[Math.floor(Math.random()*data.length)];
  $("sr").innerHTML=person(p,`<button class="btn pri wide" style="margin-top:14px" onclick="openChat('','${esc(p.id)}','${esc(p.username)}','${esc(p.display_name||p.username)}')">Start chat</button>`);
}

/* ---------- notifications ---------- */
async function checkNotes(){try{const{data}=await sb.from("notifications").select("id").eq("user_id",S.user.id).eq("is_read",false).limit(1);$("bdot").classList.toggle("hide",!data?.length)}catch(_){}}
$("bell").onclick=async()=>{
  const{data}=await sb.from("notifications").select("*").eq("user_id",S.user.id).order("created_at",{ascending:false}).limit(40);const l=data||[];
  openModal(`<h3>Notifications</h3><p class="sub">Friend requests and invites.</p>${l.length?l.map(n=>`<div class="card" style="padding:14px;margin-bottom:10px"><b>${esc(n.title)}</b><div class="pw" style="margin-top:4px">${esc(n.body||"")}</div>${n.type==="friend_request"&&n.data?.from?`<button class="btn pri" style="margin-top:10px;min-height:40px" onclick="acceptFr('${esc(n.data.from)}')">Accept</button>`:""}</div>`).join(""):`<div class="empty">You are all caught up.</div>`}<button class="btn wide" onclick="closeModal()">Close</button>`);
  sb.from("notifications").update({is_read:true}).eq("user_id",S.user.id).eq("is_read",false).then(()=>$("bdot").classList.add("hide"),()=>{});
};
async function acceptFr(id){const{error}=await sb.from("friendships").update({status:"accepted"}).eq("requester_id",id).eq("addressee_id",S.user.id);closeModal();toast(error?"Could not accept the request.":"You are now friends.")}

/* ---------- games ---------- */
function renderGames(){
  const g=(i,n,d,a,soon)=>`<button class="card qc" style="${soon?"opacity:.55":""}" onclick="${a}"><span class="i">${i}</span><span><b>${n}</b><small>${d}</small></span></button>`;
  page(`<h2>Games</h2><p class="sub">Pick a game.</p><div class="grid">
   ${g("❌","Tic-Tac-Toe","5×5, four in a row wins","tttMenu()")}${g("🎲","Ludo","Coming soon","toast('Ludo is coming in the next update.')",1)}
   ${g("🃏","UNO","Coming soon","toast('UNO is coming in the next update.')",1)}${g("⚫","Carrom","Coming soon","toast('Carrom is coming soon.')",1)}
   ${g("♞","Chess","Coming soon","toast('Chess is coming soon.')",1)}</div>`);
}
function tttMenu(){openModal(`<h3>Tic-Tac-Toe</h3><p class="sub">5×5 board. Line up four to win.</p>
  <button class="btn pri wide" style="margin-bottom:10px" onclick="tttStart('bot')">Play against a robot</button>
  <button class="btn wide" style="margin-bottom:10px" onclick="tttStart('local')">Two players, one phone</button>
  <button class="btn wide" onclick="closeModal()">Close</button>`)}
function lineWin(b,L=4,N=5){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=b[r*N+c];if(!v)continue;
    for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;for(;k<L;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=N||x<0||x>=N||b[y*N+x]!==v)break}
      if(k===L)return{v,cells:Array.from({length:L},(_,i)=>(r+dr*i)*N+c+dc*i)}}}
  return null}
function tttStart(mode){closeModal();S.page="ttt";S.ttt={b:Array(25).fill(""),t:"X",mode,over:false,win:null,last:-1,msg:mode==="bot"?"Your turn (X)":"X goes first"};tttDraw()}
function tttDraw(){
  const T=S.ttt;$("main").innerHTML=`<section class="pg"><button class="btn" onclick="go('games')" style="margin-bottom:14px">‹ Games</button><h2>Tic-Tac-Toe</h2><p class="sub">${esc(T.msg)}</p>
   <div class="bd">${T.b.map((v,i)=>`<button class="cell ${v}${i===T.last?" n":""}${T.win?.cells.includes(i)?" w":""}" onclick="tttTap(${i})" aria-label="Cell ${i+1}">${v}</button>`).join("")}</div>
   <button class="btn pri wide" style="margin:18px auto 0;display:block;max-width:420px" onclick="tttStart('${T.mode}')">Restart</button></section>`;
}
function tttPlace(i){
  const T=S.ttt;T.b[i]=T.t;T.last=i;sfx(T.t==="X"?520:420,.08,"triangle",.06);
  const w=lineWin(T.b);
  if(w){T.over=true;T.win=w;T.msg=T.mode==="bot"?(w.v==="X"?"You won! 🏆":"The robot won"):w.v+" wins! 🏆";[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.25),k*130));navigator.vibrate?.([60,40,60])}
  else if(T.b.every(Boolean)){T.over=true;T.msg="It's a draw"}
  else{T.t=T.t==="X"?"O":"X";T.msg=T.mode==="bot"?(T.t==="X"?"Your turn (X)":"Robot is thinking…"):T.t+"'s turn"}
  tttDraw();
}
function tttTap(i){const T=S.ttt;if(!T||T.over||T.b[i]||(T.mode==="bot"&&T.t!=="X"))return;tttPlace(i);if(T.mode==="bot"&&!T.over)setTimeout(tttBot,650)}
function tttScore(b,i,sym){
  const r=Math.floor(i/5),c=i%5,opp=sym==="X"?"O":"X";let s=0;
  for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]])for(let k=0;k<4;k++){let own=0,bad=false;
    for(let j=0;j<4;j++){const y=r+dr*(j-k),x=c+dc*(j-k);if(y<0||y>4||x<0||x>4){bad=true;break}const v=b[y*5+x];if(v===opp){bad=true;break}if(v===sym)own++}
    if(!bad)s+=[1,3,9,40][own]}
  return s}
function tttBot(){
  const T=S.ttt;if(!T||T.over||T.t!=="O")return;const b=T.b,emp=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
  const wins=(s,i)=>{b[i]=s;const w=lineWin(b)?.v===s;b[i]="";return w};
  let p=emp.find(i=>wins("O",i));if(p===undefined)p=emp.find(i=>wins("X",i));
  if(p===undefined){let best=-1;emp.forEach(i=>{const s=tttScore(b,i,"O")*1.1+tttScore(b,i,"X")+Math.random()*.8-(Math.abs(i%5-2)+Math.abs(Math.floor(i/5)-2))*.3;if(s>best){best=s;p=i}})}
  tttPlace(p);
}

/* ---------- settings + profile ---------- */
function renderSettings(){
  const p=S.me||{};
  page(`<h2>Settings</h2><p class="sub">${S.user?.is_anonymous?"Guest account":esc(S.user?.email||"")}</p>
   <div class="card" style="padding:18px;margin-bottom:14px"><b>Profile</b>
    <input id="pn" style="margin-top:12px" maxlength="30" placeholder="Display name" value="${esc(p.display_name||"")}">
    <input id="pu" maxlength="20" placeholder="Username" autocapitalize="off" value="${esc(p.username||"")}">
    <div id="pm" class="pw" style="min-height:18px;margin:-4px 0 10px 4px">3–20 characters: a–z, 0–9, _</div>
    <button class="btn pri wide" onclick="saveProfile()">Save changes</button></div>
   <div class="card row"><div class="t"><b>Sound and vibration</b><small>Game and chat effects</small></div><button id="sbt" class="btn" style="min-width:64px" onclick="toggleSound()">${S.sound?"On":"Off"}</button></div>
   <button class="btn red wide" onclick="logout()">Log out</button>
   <div class="pw" style="text-align:center;padding:22px 0 4px">Powered by <b>Suraj Kumar</b></div>`);
}
function toggleSound(){S.sound=!S.sound;localStorage.nx_snd=S.sound?"1":"0";$("sbt").textContent=S.sound?"On":"Off";sfx(600,.1)}
async function saveProfile(){
  const m=$("pm"),name=$("pn").value.trim(),un=$("pu").value.trim().toLowerCase(),bad=t=>{m.style.color="#ff8190";m.textContent=t};
  if(name.length<2)return bad("Name needs at least 2 letters.");if(!/^[a-z0-9_]{3,20}$/.test(un))return bad("Username can use a–z, 0–9 and _ (3–20).");
  m.style.color="";m.textContent="Saving…";
  const{data:t}=await sb.from("profiles").select("id").ilike("username",un).neq("id",S.user.id).limit(1);if(t?.length)return bad("That username is taken.");
  const{data,error}=await sb.from("profiles").update({display_name:name,username:un}).eq("id",S.user.id).select("*").maybeSingle();
  if(error)return bad(/duplicate|unique/i.test(error.message)?"That username is taken.":"Could not save. Try again.");
  S.me=data||{...S.me,display_name:name,username:un};paintAv();m.style.color="#65dda1";m.textContent="Saved";toast("Profile updated.");
}
$("prof").onclick=()=>go("settings");

/* ---------- boot ---------- */
setTimeout(()=>{$("splash").classList.add("out");setTimeout(()=>$("splash").remove(),800)},3300);
(async()=>{
  try{const{data}=await sb.auth.getSession();if(data?.session?.user)return enter(data.session.user)}catch(_){}
  $("auth").classList.remove("hide");
})();
setInterval(()=>{if(S.user)sb.from("profiles").update({online:true,last_seen:new Date().toISOString()}).eq("id",S.user.id).then(()=>{},()=>{})},60000);
</script>
