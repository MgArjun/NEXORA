  OUT.set(cid,{cid,conv:ACTIVE_CHAT.conversationId,text,m,state:"sending",tries:0});persistOut();

};

  OUT.forEach((o,k)=>{if(rows.some(r=>r.client_id===k)){OUT.delete(k)}});
  let h="",last="";rows.forEach(m=>{const k=dayKey(m.created_at);if(k!==last){h+=`<div class="dsep">${dayLbl(m.created_at)}</div>`;last=k}h+=bubble(m)});
  b.innerHTML=h||`<div id="chatEmpty" class="chat-empty">👋<br>Pehla message bhejo</div>`;b.dataset.day=last;SEEN=new Set(rows.map(m=>m.id));
  OUT.forEach(o=>{if(o.conv===conv)appendWithDay(b,o.m,o.state==="fail"?"fail":o.state==="wait"?"wait":"sending")});

const _rcP=renderChat;

/* ---------- TIC-TAC-TOE AUTHORITATIVE (Part 1) ---------- */
let TT = null;

const tttFresh = () => ({
  b: Array(25).fill(""),
  t: "X",

function closeTTT() {
  if (TT?.hb) clearInterval(TT.hb);
  if (TCH) { try { sb.removeChannel(TCH); } catch(_){} TCH = null; }
  TT = null;
  if (typeof GST !== "undefined") GST.ttt = null;

async function openTTTRoom(code, host) {
  closeTTT();
  const ch = sb.channel("ttt-" + code);
  TCH = ch;
  const T = TT = {
    code, host, started: false, seen: Date.now(), rem: {},
    hostMark: "X", me: null, oppId: null, G: null, left: false, dc: false, tap: 0, hb: null
  };
  ch.tx = T.tx = m => { if (TCH) TCH.send({ type: "broadcast", event: "g", payload: { ...m, from: NEXORA.user.id } }).catch(()=>{}); };
  ch.on("broadcast", { event: "g" }, ({ payload: m }) => tttMsg(m));
  await new Promise(r => ch.subscribe(s => { if (s === "SUBSCRIBED") r(); }));
  if (TT !== T) return;
  if (!host) {
    let n = 0;
    const iv = setInterval(() => {
      if (TT !== T || T.started || ++n > 12) return clearInterval(iv);
      T.tx({ t: "join" });
    }, 1200);
    T.tx({ t: "join" });
  }
  T.hb = setInterval(() => tttTick(T), 3000);
}

function tttMsg(m) {
  const T = TT;
  if (!T || m.from === NEXORA.user.id) return;
  if (T.started && m.from !== T.oppId) return;
  T.seen = Date.now();
  switch (m.t) {
    case "join":
      if (T.host && !T.started) {
        T.started = true; T.oppId = m.from; T.me = "X"; T.hostMark = "X";
        closeModal(); T.tx({ t: "start", hm: "X" }); tttNew(T, true);
      } else if (T.host && T.started) {
        T.tx({ t: "start", hm: T.hostMark });
        if (T.G) T.tx({ t: "snap", g: T.G });
      }
      break;
    case "start":
      if (!T.host && !T.started) {
        T.started = true; T.oppId = m.from; T.hostMark = m.hm || "X";
        T.me = T.hostMark === "X" ? "O" : "X";
        closeModal(); NEXORA.page = "games";
        TTT = { b: Array(25).fill(""), t: "X", over: false, online: true, mine: T.me, msg: "Game shuru ho raha hai…" };
        renderTTT();
      }
      break;
    case "mv": if (T.host) tttHostMove(T, m.i, m.s, T.me === "X" ? "O" : "X"); break;
    case "snap": tttView(T, m.g); break;
    case "need": if (T.host && T.G) T.tx({ t: "snap", g: T.G }); break;
    case "rem": T.rem.opp = true; tttRemCheck(T); break;
    case "leave": T.left = true; toast("Dost ne game chhod diya"); tttView(T, T.G || tttFresh()); break;
  }
}

function tttNew(T, first) {
  T.G = tttFresh(); T.rem = {}; T.left = false;
  T.tx({ t: "snap", g: T.G });
  if (first) NEXORA.page = "games";
  tttView(T, T.G, first);
}

function tttHostMove(T, i, s, mark) {
  const G = T.G;
  if (!G || G.over || s !== G.seq || G.t !== mark || i < 0 || i > 24 || G.b[i]) return;
  G.b[i] = mark;
  const w = lineWin(G.b, 5, 5, 4);
  G.seq++;
  if (w) { G.over = true; G.win = w; }
  else if (G.b.every(Boolean)) { G.over = true; G.win = "draw"; }
  else G.t = mark === "X" ? "O" : "X";
  T.tx({ t: "snap", g: G });
  tttView(T, G);
}

function tttView(T, g, force) {
  if (!T || !g) return;
  if (!T.host && T.G && g.seq < T.G.seq) return;
  if (!T.host) T.G = g;
  const me = T.me; if (!me) return;
  let msg = T.left ? "Dost chala gaya" :
            g.over ? (g.win === "draw" ? "Draw" : (g.win === me ? "Aap jeet gaye! 🏆" : "Dost jeet gaya")) :
            (g.t === me ? `Aapki baari (${me})` : "Dost ki baari");
  TTT = { b: g.b.slice(), t: g.t, over: g.over || !!T.left, online: true, mine: me, msg };
  if (g.over && T.vs !== g.seq) {
    T.vs = g.seq;
    sfx(g.win === me ? 880 : 260, 0.4);
    navigator.vibrate?.(g.win === me ? [60,40,60] : 30);
  }
  if (force || (typeof gameOnScreen === "function" && gameOnScreen("ttt"))) renderTTT();
}

function tttRem() {
  const T = TT; if (!T) return;
  T.rem.me = true; T.tx({ t: "rem" }); tttRemCheck(T);
  if (typeof gameOnScreen === "function" && gameOnScreen("ttt")) renderTTT();
}

function tttRemCheck(T) {
  if (!(T.rem.me && T.rem.opp)) return;
  T.rem = {};
  T.hostMark = T.hostMark === "X" ? "O" : "X";
  T.me = T.me === "X" ? "O" : "X";
  if (T.host) tttNew(T); else T.G = null;
}

function tttNewMatch() {
  TT?.tx({ t: "leave" }); closeTTT(); TTT = null; setPage("games"); findMatch("ttt", 2);
}

function tttTick(T) {
  if (TT !== T || !T.started) return;
  let txt = null;
  T.tx({ t: "hb" });
  if (TCH?.state !== "joined") { txt = "Reconnecting game…"; T.dc = true; }
  else {
    if (T.dc) { T.dc = false; T.tx({ t: "need" }); toast("Game wapas judd gaya ✓"); }
    const d = Date.now() - T.seen;
    if (!T.left) {
      if (d > 60000) { T.left = true; toast("Dost wapas nahi aaya"); tttView(T, T.G || tttFresh()); }
      else if (d > 12000) txt = "Opponent reconnecting…";
    }
  }
  if (typeof GST !== "undefined") GST.ttt = txt;
}

const _oldTttMove = typeof tttMove === "function" ? tttMove : null;
tttMove = function(i) {
  const T = TT;
  if (T && TTT?.online) {
    const g = T.G;
    if (!T.started || !g || g.over || T.left || g.t !== T.me || g.b[i] || Date.now() - (T.tap || 0) < 450) return;
    T.tap = Date.now();
    navigator.vibrate?.(10); sfx(520, 0.07);
    if (T.host) tttHostMove(T, i, g.seq, T.me);
    else T.tx({ t: "mv", i, s: g.seq });
    return;
  }
  if (_oldTttMove) return _oldTttMove(i);
};

const _oldRenderTTT = typeof renderTTT === "function" ? renderTTT : null;
renderTTT = function() {
  try { if (_oldRenderTTT) _oldRenderTTT(); } catch(e) { console.error(e); toast("Game reload ho raha hai"); return setPage("games"); }
  const T = TT;
  if (!T || !TTT?.online || !TTT.over) return;
  const b = document.querySelector("#main .card > .btn.primary-btn");

  b.outerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
    <button class="btn primary-btn" ${T.left ? "disabled" : ""} onclick="tttRem()">${T.rem.me ? "⏳ Waiting…" : "🔁 Rematch"}</button>
    <button class="btn" onclick="tttNewMatch()">⚡ New Match</button></div>`;
};

const snapOf = L => ({
  seq: L.seq || 0, turn: L.turn, sixes: L.sixes,
  t: L.players.map(p => p.tokens.slice()),
  gone: L.players.map(p => !!p.gone), win: L.winner || null, dice: L.dice
});

function applySnap(s, force = false) {
  const L = LUDO;
  if (!L || L.mode !== "online" || !s || L.busy || L.rolling) return;
  if (!force && (s.seq <= (L.seq || 0))) return;
  L.players.forEach((p, i) => { p.tokens = s.t[i].slice(); p.gone = !!s.gone[i]; });
  L.turn = s.turn; L.sixes = s.sixes; L.seq = s.seq; L.dice = s.dice || null; L.winner = s.win || null;
  L.message = L.winner ? L.winner + " jeet gaya! 🏆" : cur().name + " ki baari";
  updateLudo();
}

const _oldRoll = typeof rollLudoDice === "function" ? rollLudoDice : null;
rollLudoDice = function() {
  if (!LUDO || LUDO.winner || LUDO.rolling || LUDO.busy || LUDO.dice) return;
  if (LUDO.mode === "online" && LUDO.me !== 0) return;
  if (!isHuman()) return;
  const d = rnd6();
  if (LUDO.mode === "online") lsend({ t: "roll", d, seq: (LUDO.seq || 0) + 1 });
  animateRoll(d);
};

const _oldCommit = typeof commit === "function" ? commit : null;
commit = async function(pl, i) {
  if (_oldCommit) await _oldCommit(pl, i);
  if (LUDO) {
    LUDO.seq = (LUDO.seq || 0) + 1;
    if (LUDO.mode === "online" && LUDO.me === 0) setTimeout(() => {
      if (LUDO?.mode === "online" && LUDO.me === 0) lsend({ t: "snap", s: snapOf(LUDO) });
    }, 50);
  }
};

const _oldOnLudo = typeof onLudoMsg === "function" ? onLudoMsg : null;
onLudoMsg = function(m) {
  if (m.from === NEXORA.user.id) return;
  if (LUDO?.mode === "online") (LUDO.seen = LUDO.seen || {})[m.from] = Date.now();
  if (m.t === "hb") return;
  if (m.t === "need") { if (LUDO?.me === 0) lsend({ t: "snap", s: snapOf(LUDO) }); return; }
  if (m.t === "snap") { applySnap(m.s, !!m.s?.force); return; }
  if (m.t === "rem") { LREM[m.from] = true; if (typeof ludoRemCheck === "function") ludoRemCheck(); return; }
  if (m.t === "roll" && LUDO?.mode === "online" && LUDO.me !== 0) {
    if (!LUDO.rolling && !LUDO.dice) animateRoll(m.d); return;
  }
  if (m.t === "move" && LUDO?.mode === "online" && LUDO.me !== 0) {
    if (LUDO.dice && !LUDO.busy) commit(cur(), m.i); return;
  }
  if (_oldOnLudo) return _oldOnLudo(m);
};

function applySnap(s, force = false) {
  const L = LUDO;
  if (!L || L.mode !== "online" || !s) return;
  if (L.busy || L.rolling) return;
  if (!force && s.seq <= (L.seq || 0)) return;

  L.players.forEach((p, i) => {
    if (s.t[i]) p.tokens = s.t[i].slice();

  });
  L.turn = s.turn;
  L.sixes = s.sixes || 0;
  L.seq = s.seq;
