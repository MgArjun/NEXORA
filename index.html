/* =========================================================
   REFRESH LOBBY
========================================================= */

N.p3RefreshLobby = async function(){

  if(!N.part3.lobbyRoomId)
    return;


  const result =
    await N.db
      .from("game_players")
      .select(`
        user_id,
        player_number,
        profiles(
          id,
          username,
          display_name,
          online
        )
      `)
      .eq(
        "room_id",
        N.part3.lobbyRoomId
      )
      .order(
        "player_number",
        {ascending:true}
      );


  if(result.error){

    console.warn(
      result.error.message
    );

    return;

  }


  const players =
    result.data || [];


  N.part3.lobbyPlayers =
    players;


  const count =
    document.getElementById(
      "nx3LobbyCount"
    );


  const room =
    N.activeRoom;


  if(count && room){

    count.textContent =
      `${players.length}/${room.max_players}`;

  }


  const box =
    document.getElementById(
      "nx3LobbyPlayers"
    );


  if(!box)
    return;


  box.innerHTML =
    players.map(
      player => {

        const p =
          player.profiles || {};


        const host =
          player.user_id ===
          N.activeRoom.host_id;


        return `

          <div class="nx3-player">

            <div
              class="nx3-player-avatar ${
                player.player_number === 1
                ? "host-avatar"
                : ""
              }">

              ${N.p3Initial(
                p.display_name
              )}

            </div>


            <div class="nx3-player-main">

              <div class="nx3-player-name">

                ${N.p3Escape(
                  p.display_name ||
                  p.username ||
                  "Player"
                )}

              </div>


              <div class="nx3-player-user">

                @${N.p3Escape(
                  p.username || ""
                )}

              </div>

            </div>


            <div class="nx3-player-right">

              ${
                host
                ? `<span class="nx3-host">
                    HOST
                  </span>`
                : ""
              }


              ${
                p.online
                ? `<span class="nx3-live-dot"></span>`
                : `<span class="nx3-offline">
                    Offline
                  </span>`
              }

            </div>

          </div>

        `;

      }
    ).join("");


  const start =
    document.getElementById(
      "nx3StartButton"
    );


  if(!start)
    return;


  const isHost =
    N.activeRoom.host_id ===
    N.user.id;


  const enough =
    players.length >= 2;


  const roomWaiting =
    N.activeRoom.status ===
    "waiting";


  start.disabled =
    !isHost ||
    !enough ||
    !roomWaiting;


  start.textContent =
    !isHost
    ? "Waiting for host"
    : !enough
      ? "Waiting for players"
      : "Start match";


  const status =
    document.getElementById(
      "nx3LobbyStatus"
    );


  if(status){

    status.textContent =
      enough
      ? "Ready to start"
      : "Waiting for players";

  }

};


/* =========================================================
   LOBBY REALTIME
========================================================= */

N.p3SubscribeLobby = function(){

  if(N.part3.lobbyChannel){

    N.db.removeChannel(
      N.part3.lobbyChannel
    );

  }


  if(!N.part3.lobbyRoomId)
    return;


  const roomId =
    N.part3.lobbyRoomId;


  N.part3.lobbyChannel =
    N.db
      .channel(
        "nexora-premium-lobby-" +
        roomId
      )


      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"game_players",
          filter:
            `room_id=eq.${roomId}`
        },
        ()=>{

          N.p3RefreshLobby();

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"game_rooms",
          filter:
            `id=eq.${roomId}`
        },
        payload=>{

          N.activeRoom =
            {
              ...N.activeRoom,
              ...payload.new
            };


          if(
            payload.new.status ===
            "playing"
          ){

            N.p3StopLobbyChannel();

            N.closeModal();

            if(
              typeof N.startLudoMatch ===
              "function"
            ){

              N.startLudoMatch();

            }

          }else{

            N.p3RefreshLobby();

          }

        }
      )


      .subscribe();

};


/* =========================================================
   START MATCH
========================================================= */

N.p3StartMatch = async function(){

  if(!N.activeRoom)
    return;


  if(
    N.activeRoom.host_id !==
    N.user.id
  ){

    N.toast(
      "Only the host can start"
    );

    return;

  }


  const players =
    await N.db
      .from("game_players")
      .select(
        "user_id,player_number"
      )
      .eq(
        "room_id",
        N.activeRoom.id
      )
      .order(
        "player_number"
      );


  if(players.error){

    N.toast(
      players.error.message
    );

    return;

  }


  if(
    !players.data ||
    players.data.length < 2
  ){

    N.toast(
      "Invite at least one player"
    );

    return;

  }


  const result =
    await N.db
      .from("game_rooms")
      .update({

        status:"playing",

        started_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        N.activeRoom.id
      )
      .eq(
        "status",
        "waiting"
      );


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  N.activeRoom.status =
    "playing";


  N.p3StopLobbyChannel();

  N.closeModal();


  if(
    typeof N.startLudoMatch ===
    "function"
  ){

    N.startLudoMatch();

  }else if(
    typeof N.launchGame ===
    "function"
  ){

    N.launchGame(
      N.activeRoom.game_type
    );

  }

};

/* =========================================================
   JOIN BY CODE
========================================================= */

N.p3JoinByCode = async function(){

  const input =
    document.getElementById(
      "nx3JoinCode"
    );


  if(!input)
    return;


  const code =
    input.value
      .trim()
      .toUpperCase();


  if(!code){

    N.toast(
      "Enter a room code"
    );

    return;

  }


  const roomResult =
    await N.db
      .from("game_rooms")
      .select("*")
      .eq(
        "room_code",
        code
      )
      .maybeSingle();


  if(roomResult.error){

    N.toast(
      roomResult.error.message
    );

    return;

  }


  const room =
    roomResult.data;


  if(!room){

    N.toast(
      "Room not found"
    );

    return;

  }


  if(
    room.status !== "waiting"
  ){

    N.toast(
      "This room is not waiting"
    );

    return;

  }


  const existing =
    await N.db
      .from("game_players")
      .select("user_id")
      .eq(
        "room_id",
        room.id
      )
      .eq(
        "user_id",
        N.user.id
      )
      .maybeSingle();


  if(
    existing.data
  ){

    N.activeRoom =
      room;

    N.closeModal();

    N.p3OpenLobby(room);

    return;

  }


  const players =
    await N.db
      .from("game_players")
      .select(
        "player_number"
      )
      .eq(
        "room_id",
        room.id
      )
      .order(
        "player_number",
        {ascending:false}
      )
      .limit(1);


  const last =
    players.data?.[0]?.player_number || 0;


  if(
    last >= room.max_players
  ){

    N.toast(
      "Room is full"
    );

    return;

  }


  const join =
    await N.db
      .from("game_players")
      .insert({

        room_id:room.id,

        user_id:N.user.id,

        player_number:last + 1

      });


  if(join.error){

    N.toast(
      join.error.message
    );

    return;

  }


  N.activeRoom =
    room;


  N.closeModal();

  N.p3OpenLobby(room);

};

/* =========================================================
   OVERRIDE GAMES PAGE
========================================================= */

const oldGo =
  N.go;


if(
  typeof oldGo === "function" &&
  !N.__NX3_GO_WRAPPED__
){

  N.__NX3_GO_WRAPPED__ = true;


  N.go = function(page){

    if(
      page === "games" ||
      page === "play"
    ){

      N.p3RenderGames();

      return;

    }


    return oldGo.apply(
      N,
      arguments
    );

  };

}


/* =========================================================
   COMPATIBILITY OVERRIDE
========================================================= */

N.openGameMenu =
function(game){

  N.openFriendPicker(
    game
  );

};


/* =========================================================
   EXPOSE JOIN
========================================================= */

N.joinRoom =
N.p3JoinByCode;


/* =========================================================
   START EXISTING ROOM
========================================================= */

if(
  N.activeRoom &&
  N.activeRoom.status === "waiting"
){

  setTimeout(
    ()=>{
      N.p3OpenLobby(
        N.activeRoom
      );
    },
    100
  );

}


/* =========================================================
   CLEANUP OLD ROOM UI CHANNEL
========================================================= */

if(
  typeof N.subscribeRoom ===
  "function"
){

  const oldSubscribeRoom =
    N.subscribeRoom;


  if(!N.__NX3_ROOM_WRAPPED__){

    N.__NX3_ROOM_WRAPPED__ = true;

    N.subscribeRoom =
      function(){

        if(
          N.part3.lobbyRoomId
        ){

          N.p3SubscribeLobby();

          return;

        }

        return oldSubscribeRoom.apply(
          N,
          arguments
        );

      };

  }

}


/* =========================================================
   DEFAULT GAMES PAGE
========================================================= */

if(
  N.currentPage === "games"
){

  N.p3RenderGames();

}
