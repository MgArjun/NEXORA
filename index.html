async function matchmake(kind){stopRM();if(S.room)closeRoom(true);
 if(kind==="call"){if(C)return toast("End your current call first");try{(await mic()).getTracks().forEach(t=>t.stop())}catch(e){return toast(e.message)}}

 ch.on("presence",{event:"sync"},()=>{if(RM!==R||R.done)return;const seen={};Object.values(ch.presenceState()).flat().forEach(x=>{if(x?.id)seen[x.id]=x});
  const l=Object.values(seen).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1)),i=l.findIndex(x=>x.id===me.id);if(i<0)return;const j=i%2?i-1:i+1;if(j>=l.length)return;

  setTimeout(()=>{if(RM!==R)return;const host=i<j;

   else if(kind==="call"){if(host){stopRM();closeModal();startCall(o.id,o.name,true)}else R.wt=setTimeout(()=>{if(RM===R){stopRM();closeModal();toast("The match did not connect. Try again")}},20000)}

 await new Promise(r=>{ch.subscribe(s=>{if(s==="SUBSCRIBED")r()});setTimeout(r,6000)});try{await ch.track(me)}catch(_){}

function lineWin(b,L=4,N=5){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=b[r*N+c];if(!v)continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;for(;k<L;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=N||x<0||x>=N||b[y*N+x]!==v)break}if(k===L)return{v,cells:Array.from({length:L},(_,i)=>(r+dr*i)*N+c+dc*i)}}}return null}

 <div class="bd">${g.b.map((v,i)=>`<button class="cell ${v}${i===g.last?" n":""}${w?.cells.includes(i)?" w":""}" onclick="tap(${i})" aria-label="Cell ${i+1}">${v}</button>`).join("")}</div>${foot}</section>`}

function place(i){const g=S.g;g.b[i]=g.t;g.last=i;sfx("move");const w=lineWin(g.b);
 if(w){g.over=true;g.msg=g.mode==="bot"?(w.v==="X"?"You won! 🏆":"Robot won 🤖"):w.v+" won! 🏆";sfx(g.mode==="bot"&&w.v==="O"?"lose":"win");vib([60,40,60])}
 else if(g.b.every(Boolean)){g.over=true;g.msg="Draw"}else{g.t=g.t==="X"?"O":"X";g.msg=g.mode==="bot"?(g.t==="X"?"Your turn (X)":"Robot is thinking…"):g.t+"'s turn"}draw()}
let tapT=0;function tap(i){const g=S.g;if(!g||g.over||g.b[i])return;
 if(g.mode==="online"){const R=S.room,G=R?.G;if(!G||G.over||R.left||G.t!==g.me||Date.now()-tapT<400)return;tapT=Date.now();vib(10);sfx("move");R.host?hostMove(R,i,G.seq,g.me):R.tx({t:"mv",i,s:G.seq});return}
 if(g.mode==="bot"&&g.t!=="X")return;place(i);if(g.mode==="bot"&&!g.over)setTimeout(bot,650)}
function score(b,i,sym){const r=Math.floor(i/5),c=i%5,opp=sym==="X"?"O":"X";let s=0;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]])for(let k=0;k<4;k++){let own=0,bad=false;for(let j=0;j<4;j++){const y=r+dr*(j-k),x=c+dc*(j-k);if(y<0||y>4||x<0||x>4){bad=true;break}const v=b[y*5+x];if(v===opp){bad=true;break}if(v===sym)own++}if(!bad)s+=[1,3,9,40][own]}return s}
function bot(){const g=S.g;if(!g||g.over||g.mode!=="bot"||g.t!=="O")return;const b=g.b,emp=b.map((v,i)=>v?-1:i).filter(i=>i>=0),wins=(s,i)=>{b[i]=s;const w=lineWin(b)?.v===s;b[i]="";return w};
 let p=emp.find(i=>wins("O",i));if(p===undefined)p=emp.find(i=>wins("X",i));if(p===undefined){let best=-1;emp.forEach(i=>{const s=score(b,i,"O")*1.1+score(b,i,"X")+Math.random()*.8-(Math.abs(i%5-2)+Math.abs(Math.floor(i/5)-2))*.3;if(s>best){best=s;p=i}})}place(p)}

  lp.type="lowpass";lp.frequency.value=2200;dly.delayTime.value=.17;fb.gain.value=.28;wet.gain.value=.22;
  m.connect(lp);lp.connect(AC.destination);lp.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(AC.destination)}
 const s=AC.currentTime+dl,dd=Math.max(d,.22)*1.6,pk=Math.min(.2,v*1.3);

<script>

(()=>{const sp=document.getElementById("splash");if(!sp)return;const MIN=5400;let t=0;

(()=>{
const D=document,N=25,W=[];
for(let r=0;r<5;r++)for(let c=0;c<5;c++)for(const[a,b]of[[0,1],[1,0],[1,1],[1,-1]]){const e=[];for(let k=0;k<4;k++){const y=r+a*k,x=c+b*k;if(y<0||y>4||x<0||x>4)break;e.push(y*5+x)}if(e.length===4)W.push(e)}
const WC=Array.from({length:N},(_,i)=>W.filter(w=>w.includes(i)));
const SC=[0,1,7,45,1e5];
function ev(b,me){let s=0;for(const w of W){let a=0,o=0;for(let k=0;k<4;k++){const v=b[w[k]];if(v){if(v===me)a++;else o++}}if(a&&!o)s+=SC[a];else if(o&&!a)s-=SC[o]}return s}
function cs(b,i,me){const op=me==="X"?"O":"X";let s=0;for(const w of WC[i]){let a=0,o=0;for(const j of w){const v=b[j];if(v===me)a++;else if(v===op)o++}if(!o)s+=SC[a+1];if(!a)s+=SC[o+1]*.9}return s-(Math.abs(i%5-2)+Math.abs((i/5|0)-2))*.5}
function cand(b,me){if(!b.some(Boolean))return[12];const out=[];for(let i=0;i<N;i++){if(b[i])continue;const r=i/5|0,c=i%5;let near=false;for(let y=Math.max(0,r-2);y<=Math.min(4,r+2)&&!near;y++)for(let x=Math.max(0,c-2);x<=Math.min(4,c+2);x++)if(b[y*5+x]){near=true;break}if(near)out.push(i)}
 return out.map(i=>[cs(b,i,me),i]).sort((p,q)=>q[0]-p[0]).map(p=>p[1])}
let T0=0,TL=0,nodes=0;
function nm(b,d,a,be,pl){if((++nodes&255)===0&&performance.now()-T0>TL)throw 0;
 const s=ev(b,pl);if(s>=9e4)return s+d;if(s<=-9e4)return s-d;if(!d)return s;
 const op=pl==="X"?"O":"X",mv=cand(b,pl);if(!mv.length)return 0;let best=-1e9;
 for(const i of mv){b[i]=pl;const v=-nm(b,d-1,-be,-a,op);b[i]="";if(v>best)best=v;if(v>a)a=v;if(a>=be)break}return best}
const DEP=[1,1,2,2,2,3,3,3,4,4,4,5,5,5,6,6,7,7,8,9];
function pick(b,me,lv){const op=me==="X"?"O":"X",c=Math.max(1,Math.min(20,lv)),mist=Math.max(0,.5-(c-1)*.03),mv=cand(b,me);
 const wins=p=>mv.filter(i=>{b[i]=p;const w=ev(b,p)>=9e4;b[i]="";return w});
 let w=wins(me);if(w.length&&(c>=2||Math.random()<.6))return w[0];
 w=wins(op);if(w.length&&Math.random()>mist*.6)return w[0];
 if(Math.random()<mist){const k=c<=2?8:c<=5?5:3;return mv[Math.floor(Math.random()*Math.min(k,mv.length))]}
 T0=performance.now();TL=250+c*45;let best=mv[0],order=mv.slice();
 for(let d=1;d<=DEP[c-1];d++){const bb=b.slice();let bm=null,bv=-1e9,al=-1e9;nodes=0;
  try{for(const i of order){bb[i]=me;const v=-nm(bb,d-1,-1e9,-al,op)+Math.random()*1.5;bb[i]="";if(v>bv){bv=v;bm=i}if(v>al)al=v}}catch(e){break}
  best=bm;order=[bm,...order.filter(x=>x!==bm)];if(bv>=9e4)break}
 return best}
const prog=()=>LS(K("nx_tl"),{max:1});
const _sg=startG;
startG=function(mode){if(mode==="bot"){const g=S.g;if(S.page==="ttt"&&g&&g.mode==="bot"&&g.lv)return nxGo(g.kind,g.lv);return nxMenu()}return _sg.apply(this,arguments)};

 openModal('<h3>Tic-Tac-Toe vs Robot</h3><p class="sub">5x5 board, four in a row. You play X.</p><div class="lbl">Quick play</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="btn" onclick="nxGo(\'q\',3)">Easy</button><button class="btn" onclick="nxGo(\'q\',9)">Medium</button><button class="btn pri" onclick="nxGo(\'q\',15)">Hard</button></div><div class="lbl">Levels</div><div class="nxlv">'+g+'</div><div class="pw" style="text-align:left">Win a level to unlock the next. The robot gets smarter every level.</div><button class="btn wide" style="margin-top:12px" onclick="closeModal()">Close</button>')};
bot=function(){const g=S.g;if(!g||g.over||g.mode!=="bot"||g.t!=="O")return;const p=pick(g.b.slice(),"O",g.lv||9);if(p!=null&&!g.b[p])place(p)};

})();
