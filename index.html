<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --bg:#07080d;
  --panel:#10121a;
  --panel2:#151824;
  --panel3:#1b1f2c;
  --line:rgba(255,255,255,.08);
  --text:#f6f7fb;
  --muted:#9299aa;
  --purple:#7657ff;
  --purple2:#9d87ff;
  --green:#35d58a;
  --red:#ff5571;
  --yellow:#ffc857;
  --shadow:0 24px 70px rgba(0,0,0,.42);
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 0%,rgba(118,87,255,.15),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(53,213,138,.06),transparent 25%),
    var(--bg);
}

.shell{
  width:min(1180px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:90px;
}

.topbar{
  height:72px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(20px);
  background:rgba(7,8,13,.78);
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--purple2);
}

.top-user{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7657ff,#34256e);
  font-weight:800;
}

.content{
  padding:22px 18px;
}

.hero{
  padding:28px 4px 22px;
}

.hero h1{
  margin:0;
  font-size:clamp(30px,7vw,48px);
  letter-spacing:-2px;
  line-height:1;
}

.hero p{
  margin:12px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
}

.card h2,.card h3{
  margin:0 0 7px;
}

.card p{
  color:var(--muted);
  margin:0;
  line-height:1.55;
}

.primary{
  background:linear-gradient(135deg,#7657ff,#6040ef);
  color:white;
  border-radius:14px;
  padding:13px 16px;
  font-weight:800;
}

.secondary{
  background:var(--panel3);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 15px;
  font-weight:700;
}

.danger{
  background:rgba(255,85,113,.12);
  color:#ff8ca0;
  border:1px solid rgba(255,85,113,.2);
  border-radius:14px;
  padding:12px 15px;
}

.full{
  width:100%;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:15px;
}

.bottomnav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(560px,calc(100% - 24px));
  height:66px;
  padding:7px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  background:rgba(16,18,26,.9);
  border:1px solid var(--line);
  border-radius:22px;
  backdrop-filter:blur(22px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.navbtn{
  background:transparent;
  color:var(--muted);
  border-radius:16px;
  font-size:12px;
  font-weight:700;
}

.navbtn.active{
  color:white;
  background:rgba(118,87,255,.16);
}

.navicon{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.searchbox{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.searchbox input,
.form input{
  width:100%;
  background:var(--panel2);
  color:white;
  border:1px solid var(--line);
  outline:none;
  border-radius:14px;
  padding:14px;
}

.searchbox input:focus,
.form input:focus{
  border-color:rgba(118,87,255,.7);
}

.userrow{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.userrow:last-child{
  border-bottom:0;
}

.userinfo{
  flex:1;
  min-width:0;
}

.username{
  font-weight:800;
}

.online{
  color:var(--green);
  font-size:12px;
  margin-top:3px;
}

.offline{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.chat-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.chat-head .userinfo{
  flex:1;
}

.messages{
  min-height:55vh;
  max-height:62vh;
  overflow:auto;
  padding:8px 2px;
}

.bubble{
  max-width:78%;
  padding:11px 14px;
  border-radius:17px;
  margin:7px 0;
  line-height:1.4;
  word-break:break-word;
}

.mine{
  margin-left:auto;
  background:linear-gradient(135deg,#7657ff,#6244eb);
  border-bottom-right-radius:5px;
}

.theirs{
  background:var(--panel2);
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}

.composer{
  display:flex;
  gap:8px;
  padding-top:10px;
}

.composer input{
  flex:1;
  background:var(--panel2);
  color:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  outline:none;
}

.gamegrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.gamecard{
  min-height:200px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.gameemoji{
  font-size:42px;
  margin-bottom:12px;
}

.coming{
  opacity:.65;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  background:rgba(118,87,255,.14);
  color:#b6a7ff;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal{
  width:min(520px,100%);
  max-height:92vh;
  overflow:auto;
  background:#10121a;
  border:1px solid var(--line);
  border-radius:26px;
  padding:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.modal h2{
  margin-top:0;
}

.close{
  float:right;
  background:var(--panel3);
  color:white;
  width:36px;
  height:36px;
  border-radius:50%;
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.authbox{
  width:min(460px,100%);
  background:rgba(16,18,26,.9);
  border:1px solid var(--line);
  border-radius:30px;
  padding:30px;
  box-shadow:var(--shadow);
}

.authbrand{
  font-size:42px;
  font-weight:950;
  letter-spacing:-3px;
  margin-bottom:10px;
}

.authbrand span{
  color:var(--purple2);
}

.authsub{
  color:var(--muted);
  line-height:1.5;
  margin-bottom:26px;
}

.form{
  display:grid;
  gap:10px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:12px;
  margin:18px 0;
}

.divider:before,.divider:after{
  content:"";
  height:1px;
  background:var(--line);
  flex:1;
}

.profilebig{
  width:82px;
  height:82px;
  font-size:30px;
  margin-bottom:15px;
}

.profilemeta{
  display:grid;
  gap:9px;
  margin-top:18px;
}

.meta{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.callbox{
  text-align:center;
  padding:25px 10px;
}

.callavatar{
  width:100px;
  height:100px;
  margin:10px auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7657ff,#34256e);
  font-size:35px;
  font-weight:900;
  box-shadow:0 0 0 12px rgba(118,87,255,.08);
}

.callstatus{
  color:var(--muted);
  margin:7px 0 25px;
}

.callbuttons{
  display:flex;
  justify-content:center;
  gap:12px;
}

.callcircle{
  width:58px;
  height:58px;
  border-radius:50%;
  color:white;
  background:var(--panel3);
}

.callcircle.end{
  background:#c9334d;
}

.gameboard-wrap{
  overflow:auto;
}

.ttt{
  width:min(440px,100%);
  margin:18px auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.ttt button{
  aspect-ratio:1;
  border-radius:12px;
  background:var(--panel2);
  color:white;
  border:1px solid var(--line);
  font-size:clamp(22px,7vw,38px);
  font-weight:900;
}

.ttt button.x{
  color:#a18cff;
}

.ttt button.o{
  color:#35d58a;
}

.game-status{
  text-align:center;
  font-weight:800;
  margin:10px 0;
}

.ludo{
  width:min(430px,100%);
  aspect-ratio:1;
  margin:15px auto;
  padding:10px;
  border-radius:22px;
  background:
    linear-gradient(90deg,#d95c65 0 25%,#f3f3f3 25% 75%,#6bb77d 75%),
    #eee;
  display:grid;
  place-items:center;
  position:relative;
}

.ludo-inner{
  width:100%;
  height:100%;
  background:
    linear-gradient(#fff 0 0) center/32% 32% no-repeat,
    repeating-linear-gradient(0deg,#ddd 0 1px,transparent 1px 8.33%),
    repeating-linear-gradient(90deg,#ddd 0 1px,transparent 1px 8.33%),
    #fafafa;
  border-radius:15px;
  position:relative;
  overflow:hidden;
}

.ludo-center{
  position:absolute;
  inset:34% 34%;
  display:grid;
  place-items:center;
  background:conic-gradient(#7657ff 0 25%,#35d58a 25% 50%,#ffcb57 50% 75%,#ff637a 75%);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}

.token{
  position:absolute;
  width:27px;
  height:27px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.85);
  box-shadow:0 4px 10px rgba(0,0,0,.3);
  transition:.25s;
}

.token.red{background:#ef5366;}
.token.blue{background:#7657ff;}
.token.green{background:#35d58a;}
.token.yellow{background:#ffc857;}

.dice{
  width:65px;
  height:65px;
  display:grid;
  place-items:center;
  background:white;
  color:#111;
  border-radius:15px;
  font-size:30px;
  font-weight:900;
  margin:auto;
}

.footer{
  text-align:center;
  color:#656b7b;
  font-size:11px;
  margin:30px 0;
}

.hidden{
  display:none!important;
}

@media(max-width:650px){
  .grid,.gamegrid{
    grid-template-columns:1fr;
  }
  .content{
    padding:18px 14px;
  }
  .card{
    border-radius:19px;
  }
  .topbar{
    padding:0 14px;
  }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
/* =========================================================
   NEXORA CONFIG
========================================================= */

const SUPABASE_URL =
  "https://ktwluvpmzisonmootdqc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/*
  STUN = basic WebRTC connectivity.
  TURN can be added later here for difficult mobile networks.
*/
const RTC_CONFIG = {
  iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"}

    /*
    TURN example:

    {
      urls:"turn:YOUR-TURN-SERVER:3478",
      username:"YOUR-USERNAME",
      credential:"YOUR-CREDENTIAL"
    }
    */
  ]
};

/* =========================================================
   STATE
========================================================= */

let state = {
  user:null,
  profile:null,
  page:"home",

  searchResults:[],
  conversations:[],
  selectedUser:null,
  conversation:null,
  messages:[],

  callId:null,
  callType:"voice",
  callRole:null,
  callChannel:null,
  pc:null,
  localStream:null,
  remoteStream:null,
  pendingCandidates:[],
  callReady:false,
  callMuted:false,

  ttt:{
    board:Array(25).fill(""),
    turn:"X",
    mode:"robot",
    active:false,
    result:""
  },

  ludo:{
    active:false,
    turn:"you",
    you:0,
    robot:0,
    lastDice:0,
    winner:""
  }
};

const $ = s => document.querySelector(s);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  return (name || "N")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function toast(message){
  const old = document.querySelector(".toast");
  if(old) old.remove();

  const t = document.createElement("div");
  t.className="toast";
  t.textContent=message;

  Object.assign(t.style,{
    position:"fixed",
    left:"50%",
    bottom:"95px",
    transform:"translateX(-50%)",
    zIndex:999,
    background:"#1b1f2c",
    color:"#fff",
    padding:"12px 17px",
    borderRadius:"14px",
    border:"1px solid rgba(255,255,255,.1)",
    boxShadow:"0 20px 50px rgba(0,0,0,.5)",
    fontWeight:"700",
    maxWidth:"90%",
    textAlign:"center"
  });

  document.body.appendChild(t);

  setTimeout(()=>t.remove(),2600);
}

/* =========================================================
   AUTH
========================================================= */

function renderAuth(){
  $("#app").innerHTML=`
    <div class="auth">
      <div class="authbox">
        <div class="authbrand">NEX<span>ORA</span></div>

        <div class="authsub">
          Connect with people, chat in realtime,
          make voice calls and play together.
        </div>

        <button class="primary full" onclick="guestLogin()">
          Continue as Guest
        </button>

        <div class="divider">OR</div>

        <button class="secondary full" onclick="showEmailAuth('login')">
          Login
        </button>

        <button
          class="secondary full"
          style="margin-top:9px"
          onclick="showEmailAuth('signup')">
          Create account
        </button>

        <div class="footer">
          Powered by Suraj Kumar
        </div>
      </div>
    </div>
  `;
}

function showEmailAuth(mode){
  $("#app").innerHTML=`
    <div class="auth">
      <div class="authbox">

        <button
          class="close"
          onclick="renderAuth()">
          ×
        </button>

        <div class="authbrand" style="font-size:31px">
          ${mode==="login"?"Welcome back":"Create account"}
        </div>

        <div class="authsub">
          ${mode==="login"
            ?"Login to continue to NEXORA."
            :"Create your permanent NEXORA account."}
        </div>

        <div class="form">
          <input id="email" type="email" placeholder="Email address">
          <input id="password" type="password" placeholder="Password">

          <button class="primary" onclick="emailAuth('${mode}')">
            ${mode==="login"?"Login":"Create account"}
          </button>
        </div>

        <button
          class="secondary full"
          style="margin-top:10px"
          onclick="renderAuth()">
          Back
        </button>
      </div>
    </div>
  `;
}

async function guestLogin(){
  try{
    const {data,error}=await db.auth.signInAnonymously();

    if(error) throw error;

    state.user=data.user;

    await finishLogin();

  }catch(e){
    toast("Guest login failed: "+e.message);
  }
}

async function emailAuth(mode){
  const email=$("#email").value.trim();
  const password=$("#password").value;

  if(!email || !password){
    toast("Enter email and password.");
    return;
  }

  try{
    let result;

    if(mode==="login"){
      result=await db.auth.signInWithPassword({
        email,
        password
      });
    }else{
      result=await db.auth.signUp({
        email,
        password,
        options:{
          data:{
            display_name:email.split("@")[0],
            is_guest:false
          }
        }
      });
    }

    if(result.error) throw result.error;

    if(!result.data.session){
      toast("Check your email to confirm your account.");
      return;
    }

    state.user=result.data.user;
    await finishLogin();

  }catch(e){
    toast(e.message);
  }
}

/* =========================================================
   PROFILE
========================================================= */

async function finishLogin(){
  await ensureProfile();

  if(!state.profile) return;

  if(
    !state.profile.username ||
    state.profile.username.startsWith("NX_")
  ){
    showUsernameSetup();
    return;
  }

  await bootApp();
}

async function ensureProfile(){
  const {data,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error){
    toast(error.message);
    return;
  }

  state.profile=data;

  if(!data){
    toast("Profile is still being created. Try again.");
  }
}

function showUsernameSetup(){
  $("#app").innerHTML=`
    <div class="auth">
      <div class="authbox">
        <div class="authbrand" style="font-size:32px">
          Your NEXORA ID
        </div>

        <div class="authsub">
          Choose the username people can use to find,
          message and call you.
        </div>

        <div class="form">
          <input
            id="newusername"
            maxlength="24"
            placeholder="e.g. suraj123">

          <input
            id="newdisplay"
            maxlength="40"
            placeholder="Display name">

          <button class="primary" onclick="saveUsername()">
            Continue
          </button>
        </div>

        <p style="font-size:12px;color:#777f90;margin-top:14px">
          3–24 characters · letters, numbers and underscore
        </p>
      </div>
    </div>
  `;
}

async function saveUsername(){
  const username=$("#newusername").value.trim().toLowerCase();
  const display=$("#newdisplay").value.trim();

  if(!/^[a-z0-9_]{3,24}$/.test(username)){
    toast("Invalid username.");
    return;
  }

  try{
    const {data,error}=await db.rpc(
      "nexora_set_username",
      {
        new_username:username,
        new_display_name:display || null
      }
    );

    if(error) throw error;

    state.profile=data;
    await bootApp();

  }catch(e){
    toast(e.message);
  }
}

/* =========================================================
   APP SHELL
========================================================= */

async function bootApp(){
  state.page="home";
  await setOnline(true);
  await loadConversations();
  render();
  subscribeRealtime();
}

function render(){
  const p=state.page;

  let body="";

  if(p==="home") body=renderHome();
  if(p==="search") body=renderSearch();
  if(p==="chats") body=renderChats();
  if(p==="games") body=renderGames();
  if(p==="profile") body=renderProfile();
  if(p==="chat") body=renderChat();

  $("#app").innerHTML=`
    <div class="app">
      <div class="shell">

        <header class="topbar">
          <div class="brand">NEX<span>ORA</span></div>

          <div class="top-user">
            <div>
              <div style="font-size:12px;font-weight:800">
                ${esc(state.profile?.display_name)}
              </div>
              <div style="font-size:10px;color:#35d58a">
                ● online
              </div>
            </div>

            <div class="avatar">
              ${initials(state.profile?.display_name)}
            </div>
          </div>
        </header>

        <main class="content">
          ${body}
        </main>

        ${state.page!=="chat"?`
        <nav class="bottomnav">
          <button class="navbtn ${p==="home"?"active":""}"
            onclick="go('home')">
            <span class="navicon">⌂</span>Home
          </button>

          <button class="navbtn ${p==="search"?"active":""}"
            onclick="go('search')">
            <span class="navicon">⌕</span>People
          </button>

          <button class="navbtn ${p==="games"?"active":""}"
            onclick="go('games')">
            <span class="navicon">◈</span>Games
          </button>

          <button class="navbtn ${p==="profile"?"active":""}"
            onclick="go('profile')">
            <span class="navicon">●</span>Profile
          </button>
        </nav>
        `:""}

        <div class="footer">

   5x5 TIC TAC TOE
========================================================= */

function openTTT(){
  state.ttt={
    board:Array(25).fill(""),
    turn:"X",

  };

  showOverlay(`

      </p>

        Your turn · X
      </div>

        ${tttBoardHTML()}
      </div>

      <div class="actions">
        <button class="secondary" onclick="resetTTT()">
          Restart
        </button>

        <button class="secondary" onclick="closeOverlay()">
          Exit
        </button>
      </div>

    </div>
  `);
}

function tttBoardHTML(){
  return state.ttt.board.map((v,i)=>`
    <button
      class="${v.toLowerCase()}"
      onclick="tttMove(${i})"
      ${v||state.ttt.result?"disabled":""}>
      ${v}
    </button>
  `).join("");
}

function tttMove(index){
  if(
    state.ttt.board[index] ||
    state.ttt.result ||
    state.ttt.turn!=="X"
  ) return;

  state.ttt.board[index]="X";

  if(checkTTT("X")){
    state.ttt.result="You win 🎉";
    updateTTT();
    return;
  }

  if(state.ttt.board.every(Boolean)){
    state.ttt.result="Draw";
    updateTTT();
    return;
  }

  state.ttt.turn="O";
  updateTTT();

  setTimeout(robotTTT,420);
}

function robotTTT(){
  if(state.ttt.result) return;

  const empty=state.ttt.board
    .map((v,i)=>v?null:i)
    .filter(i=>i!==null);

  if(!empty.length) return;

  /*
    Robot first tries winning,
    then blocks the player,
    then takes center,
    then chooses strategically.
  */

  let move=findWinningMove("O");

  if(move===-1)
    move=findWinningMove("X");

  if(move===-1 && !state.ttt.board[12])
    move=12;

  if(move===-1)
    move=empty[Math.floor(Math.random()*empty.length)];

  state.ttt.board[move]="O";

  if(checkTTT("O")){
    state.ttt.result="Robot wins";
  }else if(state.ttt.board.every(Boolean)){
    state.ttt.result="Draw";
  }else{
    state.ttt.turn="X";
  }

  updateTTT();
}

function findWinningMove(player){
  for(let i=0;i<25;i++){
    if(state.ttt.board[i]) continue;

    state.ttt.board[i]=player;

    const won=checkTTT(player);

    state.ttt.board[i]="";

    if(won) return i;
  }

  return -1;
}

function checkTTT(player){
  const b=state.ttt.board;

  const dirs=[
    [0,1],
    [1,0],
    [1,1],
    [1,-1]
  ];

  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){

      if(b[r*5+c]!==player) continue;

      for(const [dr,dc] of dirs){
        let count=1;

        for(let k=1;k<4;k++){
          const nr=r+dr*k;
          const nc=c+dc*k;

          if(
            nr>=0&&nr<5&&
            nc>=0&&nc<5&&
            b[nr*5+nc]===player
          ){
            count++;
          }else{
            break;
          }
        }

        if(count>=4) return true;
      }
    }
  }

  return false;
}

function updateTTT(){
  const board=$("#tttboard");
  const status=$("#tttstatus");

  if(board) board.innerHTML=tttBoardHTML();

  if(status){
    status.textContent=
      state.ttt.result ||
      (state.ttt.turn==="X"
        ?"Your turn · X"
        :"Robot thinking · O");
  }
}

function resetTTT(){
  state.ttt={
    board:Array(25).fill(""),
    turn:"X",
    mode:"robot",
    active:true,
    result:""
  };

  updateTTT();
}

function rollLudo(){
  if(
    !state.ludo.active ||
    state.ludo.turn!=="you" ||
    state.ludo.winner
  ) return;

  const dice=Math.floor(Math.random()*6)+1;

  state.ludo.lastDice=dice;
  state.ludo.you+=dice;

  if(state.ludo.you>=30){
    state.ludo.you=30;
    state.ludo.winner="You win 🎉";
  }

  updateLudo();

  if(state.ludo.winner) return;

  state.ludo.turn="robot";
  updateLudo();

  setTimeout(robotLudo,800);
}

function robotLudo(){
  if(state.ludo.winner) return;

  const dice=Math.floor(Math.random()*6)+1;

  state.ludo.lastDice=dice;
  state.ludo.robot+=dice;

  if(state.ludo.robot>=30){
    state.ludo.robot=30;
    state.ludo.winner="Robot wins";
  }

  if(!state.ludo.winner){
    state.ludo.turn="you";
  }

  updateLudo();
}

function updateLudo(){
  const dice=$("#dice");
  const status=$("#ludostatus");
  const ys=$("#youScore");
  const rs=$("#robotScore");
  const btn=$("#rollBtn");

  if(dice) dice.textContent=state.ludo.lastDice||"?";
  if(ys) ys.textContent=state.ludo.you;
  if(rs) rs.textContent=state.ludo.robot;

  if(status){
    status.textContent=
      state.ludo.winner ||
      (state.ludo.turn==="you"
        ?"Your turn"
        :"Robot is playing…");
  }

  if(btn){
    btn.disabled=
      state.ludo.turn!=="you" ||
      !!state.ludo.winner;
  }

  const yt=$("#youToken");
  const rt=$("#robotToken");

  if(yt){
    const progress=Math.min(state.ludo.you,30)/30;
    yt.style.left=(8+progress*72)+"%";
    yt.style.top=(8+progress*72)+"%";
  }

  if(rt){
    const progress=Math.min(state.ludo.robot,30)/30;
    rt.style.right=(8+progress*72)+"%";
    rt.style.bottom=(8+progress*72)+"%";
  }
}

function resetLudo(){
  state.ludo={
    active:true,
    turn:"you",
    you:0,
    robot:0,
    lastDice:0,
    winner:""
  };

  updateLudo();
}

/* =========================================================

========================================================= */

async function callUser(username){
  try{
    const {data,error}=await db.rpc(
      "nexora_start_call",
      {
        target_username:username,
        call_kind:"voice"
      }
    );

    if(error) throw error;

    state.callId=data.call_id;
    state.callRole="caller";
    state.callType="voice";

    showCallOverlay({
      name:username,
      outgoing:true
    });

    await prepareCallChannel();
    await ensurePeer();

    /*
      Wait a moment so both sides can subscribe.
    */
    setTimeout(async()=>{
      await createOffer();
    },500);

  }catch(e){
    toast("Could not start call: "+e.message);
  }
}

async function prepareCallChannel(){
  if(!state.callId) return;

  if(state.callChannel){
    try{
      await db.removeChannel(state.callChannel);
    }catch{}
  }

  const channelName="nexora-call-"+state.callId;

  state.callChannel=db.channel(channelName,{
    config:{
      broadcast:{
        self:false
      }
    }
  });

  state.callChannel
    .on(
      "broadcast",
      {event:"signal"},
      async({payload})=>{
        await handleSignal(payload);
      }
    );

  state.callChannel
    .on(
      "broadcast",
      {event:"ready"},
      async()=>{
        state.callReady=true;

        if(state.callRole==="caller"){
          await createOffer();
        }
      }
    );

  await state.callChannel.subscribe();

  await state.callChannel.send({
    type:"broadcast",
    event:"ready",
    payload:{
      userId:state.user.id
    }
  });

  state.callReady=true;
}

async function ensurePeer(){
  if(state.pc) return state.pc;

  state.pc=new RTCPeerConnection(RTC_CONFIG);

  state.remoteStream=new MediaStream();

  state.pc.onicecandidate=async event=>{
    if(!event.candidate) return;

    await sendSignal({
      type:"ice",
      candidate:event.candidate
    });
  };

  state.pc.ontrack=event=>{
    event.streams[0]?.getTracks().forEach(track=>{
      state.remoteStream.addTrack(track);
    });

    let audio=document.getElementById("remoteAudio");

    if(!audio){
      audio=document.createElement("audio");
      audio.id="remoteAudio";
      audio.autoplay=true;
      audio.playsInline=true;
      audio.style.display="none";
      document.body.appendChild(audio);
    }

    audio.srcObject=state.remoteStream;

    audio.play().catch(()=>{});
  };

  state.pc.onconnectionstatechange=()=>{
    const s=state.pc?.connectionState;

    const status=$("#callStatus");

    if(status){
      if(s==="connected")
        status.textContent="Connected";
      else if(s==="connecting")
        status.textContent="Connecting…";
      else if(s==="disconnected")
        status.textContent="Reconnecting…";
      else if(s==="failed")
        status.textContent="Connection failed";
    }
  };

  return state.pc;
}

async function getMicrophone(){
  if(state.localStream) return state.localStream;

  state.localStream=
    await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },
      video:false
    });

  state.localStream.getTracks().forEach(track=>{
    state.pc.addTrack(track,state.localStream);
  });

  return state.localStream;
}

async function createOffer(){
  if(!state.pc || !state.callChannel) return;

  await getMicrophone();

  const offer=await state.pc.createOffer({
    offerToReceiveAudio:true
  });

  await state.pc.setLocalDescription(offer);

  await sendSignal({
    type:"offer",
    description:offer
  });
}

async function createAnswer(){
  await getMicrophone();

  const answer=await state.pc.createAnswer();

  await state.pc.setLocalDescription(answer);

  await sendSignal({
    type:"answer",
    description:answer
  });
}

async function sendSignal(payload){
  if(!state.callChannel) return;

  await state.callChannel.send({
    type:"broadcast",
    event:"signal",
    payload:{
      ...payload,
      sender:state.user.id
    }
  });
}

async function handleSignal(payload){
  if(!payload || payload.sender===state.user.id)
    return;

  await ensurePeer();

  if(payload.type==="offer"){

    await state.pc.setRemoteDescription(
      new RTCSessionDescription(payload.description)
    );

    for(const candidate of state.pendingCandidates){
      await state.pc.addIceCandidate(candidate);
    }

    state.pendingCandidates=[];

    await createAnswer();
  }

  if(payload.type==="answer"){

    await state.pc.setRemoteDescription(
      new RTCSessionDescription(payload.description)
    );

    for(const candidate of state.pendingCandidates){
      await state.pc.addIceCandidate(candidate);
    }

    state.pendingCandidates=[];
  }

  if(payload.type==="ice"){

    const candidate=new RTCIceCandidate(
      payload.candidate
    );

    if(state.pc.remoteDescription){
      try{
        await state.pc.addIceCandidate(candidate);
      }catch(e){
        console.log("ICE error",e);
      }
    }else{
      state.pendingCandidates.push(candidate);
    }
  }

  if(payload.type==="hangup"){
    await cleanupCall();
    closeOverlay();
    toast("Call ended.");
  }

  if(payload.type==="mute"){
    /*
      Remote mute indication can be handled
      visually if desired.
    */
  }
}

function showCallOverlay({
  name,
  outgoing=false,
  incoming=false
}){
  closeOverlay();

  const buttons=outgoing
    ?`
      <button
        class="callcircle end"
        onclick="endCall()">
        ☎
      </button>
    `
    :incoming
    ?`
      <button
        class="callcircle"
        onclick="acceptCall()">
        ✓
      </button>

      <button
        class="callcircle end"
        onclick="declineCall()">
        ✕
      </button>
    `
    :`
      <button
        class="callcircle"
        onclick="toggleMute()"
        id="muteButton">
        🎙
      </button>

      <button
        class="callcircle end"
        onclick="endCall()">
        ☎
      </button>
    `;

  const overlay=document.createElement("div");

  overlay.className="overlay";
  overlay.id="callOverlay";

  overlay.innerHTML=`
    <div class="modal">
      <div class="callbox">

        <div class="callavatar">
          ${initials(name)}
        </div>

        <h2>${esc(name)}</h2>

        <div
          class="callstatus"
          id="callStatus">
          ${incoming
            ?"Incoming voice call"
            :outgoing
            ?"Calling…"
            :"Connecting…"}
        </div>

        <div class="callbuttons">
          ${buttons}
        </div>

      </div>
    </div>
  `;

  document.body.appendChild(overlay);
}

async function incomingCall(call){
  state.callId=call.id;
  state.callType=call.call_type;
  state.callRole="receiver";

  let name="NEXORA User";

  const {data}=await db
    .from("profiles")
    .select("username,display_name")
    .eq("id",call.caller_id)
    .maybeSingle();

  if(data){
    name=data.display_name;
    state.selectedUser=data;
  }

  showCallOverlay({
    name,
    incoming:true
  });
}

async function acceptCall(){
  try{
    const {error}=await db
      .from("calls")
      .update({
        status:"accepted",
        started_at:new Date().toISOString()
      })
      .eq("id",state.callId);

    if(error) throw error;

    await prepareCallChannel();
    await ensurePeer();
    await getMicrophone();

    const status=$("#callStatus");

    if(status)
      status.textContent="Connecting…";

  }catch(e){
    toast(e.message);
  }
}

async function declineCall(){
  try{
    await db
      .from("calls")
      .update({
        status:"declined",
        ended_at:new Date().toISOString()
      })
      .eq("id",state.callId);
  }catch{}

  await cleanupCall();
  closeOverlay();
}

async function endCall(){
  try{
    if(state.callChannel){
      await state.callChannel.send({
        type:"broadcast",
        event:"signal",
        payload:{
          type:"hangup",
          sender:state.user.id
        }
      });
    }

    if(state.callId){
      await db
        .from("calls")
        .update({
          status:"ended",
          ended_at:new Date().toISOString()
        })
        .eq("id",state.callId);
    }
  }catch{}

  await cleanupCall();
  closeOverlay();
}

async function cleanupCall(){
  if(state.localStream){
    state.localStream.getTracks().forEach(t=>t.stop());
  }

  if(state.pc){
    try{
      state.pc.close();
    }catch{}
  }

  if(state.callChannel){
    try{
      await db.removeChannel(state.callChannel);
    }catch{}
  }

  const audio=$("#remoteAudio");

  if(audio){
    audio.srcObject=null;
    audio.remove();
  }

  state.callId=null;
  state.callRole=null;
  state.callChannel=null;
  state.pc=null;
  state.localStream=null;
  state.remoteStream=null;
  state.pendingCandidates=[];
  state.callReady=false;
  state.callMuted=false;
}

function toggleMute(){
  if(!state.localStream) return;

  state.callMuted=!state.callMuted;

  state.localStream
    .getAudioTracks()
    .forEach(track=>{
      track.enabled=!state.callMuted;
    });

  const btn=$("#muteButton");

  if(btn){
    btn.textContent=
      state.callMuted
      ?"🔇"
      :"🎙";
  }
}

/* =========================================================
   REALTIME
========================================================= */

let realtimeStarted=false;

function subscribeRealtime(){
  if(realtimeStarted) return;

  realtimeStarted=true;

  /*
    Messages
  */
  db.channel("nexora-global-messages")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      async payload=>{
        if(
          state.page==="chat" &&
          payload.new.conversation_id===state.conversation
        ){
          await loadMessages();
          render();
        }

        if(
          payload.new.sender_id!==state.user.id
        ){
          await loadConversations();
        }
      }
    )
    .subscribe();

  /*
    Incoming calls
  */
  db.channel("nexora-global-calls")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"calls"
      },
      async payload=>{
        const c=payload.new;

        if(
          c.receiver_id===state.user.id &&
          c.status==="ringing"
        ){
          incomingCall(c);
        }
      }
    )
    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"calls"
      },
      async payload=>{
        const c=payload.new;

        if(
          state.callId===c.id &&
          c.status==="declined"
        ){
          await cleanupCall();
          closeOverlay();
          toast("Call declined.");
        }

        if(
          state.callId===c.id &&
          c.status==="ended"
        ){
          await cleanupCall();
          closeOverlay();
          toast("Call ended.");
        }
      }
    )
    .subscribe();

  /*
    Presence/profile updates
  */
  db.channel("nexora-presence")
    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"profiles"
      },
      async()=>{
        if(state.page==="search"){
          searchUsers();
        }
      }
    )
    .subscribe();
}

/* =========================================================
   OVERLAYS
========================================================= */

function showOverlay(html){
  closeOverlay();

  const o=document.createElement("div");
  o.className="overlay";
  o.id="genericOverlay";
  o.innerHTML=html;

  document.body.appendChild(o);
}

function closeOverlay(){
  document.querySelectorAll(
    "#genericOverlay,#callOverlay,#userOverlay"
  ).forEach(x=>x.remove());
}

/* =========================================================
   AUTH SESSION
========================================================= */

async function boot(){
  const {
    data:{session}
  }=await db.auth.getSession();

  if(session?.user){
    state.user=session.user;

    await ensureProfile();

    if(state.profile){
      if(
        state.profile.username &&
        !state.profile.username.startsWith("NX_")
      ){
        await bootApp();
      }else{
        showUsernameSetup();
      }
    }else{
      renderAuth();
    }
  }else{
    renderAuth();
  }

  db.auth.onAuthStateChange(async(event,session)=>{
    if(
      session?.user &&
      !state.user
    ){
      state.user=session.user;

      setTimeout(async()=>{
        await ensureProfile();

        if(state.profile){
          if(
            state.profile.username &&
            !state.profile.username.startsWith("NX_")
          ){
            await bootApp();
          }else{
            showUsernameSetup();
          }
        }
      },300);
    }
  });
}

/* =========================================================
   GLOBAL CLEANUP
========================================================= */

window.addEventListener("beforeunload",()=>{
  if(state.user){
    /*
      Don't await here; browser may terminate immediately.
    */
    db
      .from("profiles")
      .update({
        online:false,
        last_seen:new Date().toISOString()
      })
      .eq("id",state.user.id);
  }
});

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!state.user) return;

    if(document.visibilityState==="visible"){
      setOnline(true);
    }else{
      setOnline(false);
    }
  }
);

/* =========================================================
   START
========================================================= */

boot();

</script>
