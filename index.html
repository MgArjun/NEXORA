<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10"><meta name="color-scheme" content="dark">
<meta name="author" content="Suraj Kumar">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#070a10;--card:#0f1623;--line:rgba(255,255,255,.09);--tx:#f4f6fb;--mu:#8b97ab;--a:#7c8cff;--b:#b07cff;--g:#3fd68f;--r:#ff6377;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer}
.hide{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column}
.grad{background:linear-gradient(135deg,#fff,#8e9cff,#c18cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pw{font-size:11px;color:var(--mu);letter-spacing:.4px}.pw b{color:#aab3ff}

/* splash: 3D cube */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:26px;background:radial-gradient(circle at 50% 40%,#1a2140,#070a10 70%);transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
.scene{width:96px;height:96px;perspective:500px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 3.2s var(--ease) both}
.cube i{position:absolute;inset:0;border-radius:18px;border:2px solid rgba(160,172,255,.7);background:linear-gradient(135deg,rgba(124,140,255,.5),rgba(176,124,255,.35));box-shadow:inset 0 0 22px rgba(255,255,255,.2)}
.cube i:nth-child(1){transform:translateZ(48px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(48px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(48px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(48px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(48px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(48px)}
@keyframes spin{from{transform:rotateX(-80deg) rotateY(-200deg) scale(.3);opacity:0}to{transform:rotateX(-25deg) rotateY(335deg) scale(1);opacity:1}}
#splash h1{margin:0;font-size:44px;letter-spacing:-2px;font-weight:900;animation:rise 1s .5s var(--ease) both}
#splash .pw{animation:rise 1s .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}}

#splash,#auth{position:relative;overflow:hidden}#splash{position:fixed}
#splash::before,#splash::after,#auth::before,#auth::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.42;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
#splash::before,#auth::before{background:#6b7cff;top:-90px;left:-90px}
#splash::after,#auth::after{background:#b36bff;bottom:-100px;right:-90px;animation-delay:-6s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
.scene{position:relative;margin-bottom:14px}
.scene::before,.scene::after{content:"";position:absolute;inset:-34px;border-radius:50%;border:2px solid rgba(140,155,255,.55);opacity:0;animation:rip 2.4s ease-out infinite}
.scene::after{animation-delay:1.2s}
@keyframes rip{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
#splash .tg{color:var(--mu);font-size:13px;letter-spacing:6px;margin-top:-14px;animation:rise 1s .9s var(--ease) both}
.ld{width:130px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;animation:rise 1s 1.1s var(--ease) both}
.ld::after{content:"";display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--b));animation:ldm 1.3s ease-in-out infinite}
@keyframes ldm{from{transform:translateX(-100%)}to{transform:translateX(330%)}}
.acard{position:relative;z-index:1}
/* auth */
#auth{flex:1;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,rgba(124,140,255,.16),transparent 40%),radial-gradient(circle at 85% 85%,rgba(176,124,255,.14),transparent 40%)}
.acard{width:min(420px,100%);padding:30px;border-radius:28px;border:1px solid var(--line);background:rgba(15,22,35,.9);box-shadow:0 24px 70px rgba(0,0,0,.45);animation:pop .6s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}}
.acard h1{margin:0;font-size:30px;letter-spacing:-1px}
.acard p{color:var(--mu);margin:6px 0 22px}
input{width:100%;height:52px;padding:0 16px;margin-bottom:12px;border-radius:15px;border:1px solid var(--line);background:#0a101b;outline:none}
input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(124,140,255,.14)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;background:#182234;border:1px solid var(--line);font-weight:700;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.5}
.pri{background:linear-gradient(135deg,#7889ff,#9a78ff);border-color:transparent;box-shadow:0 10px 26px rgba(124,140,255,.3)}
.red{color:#ff8797;background:rgba(255,99,119,.12)}
.wide{width:100%}
#amsg{min-height:20px;font-size:13px;text-align:center;margin:10px 0 0;color:var(--mu)}
.sw{text-align:center;margin-top:14px;font-size:14px;color:var(--mu)}.sw button{color:#a8b0ff;font-weight:700;font-size:14px}

/* shell */
#shell{flex:1;min-height:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 12px;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);background:rgba(7,10,16,.85);backdrop-filter:blur(18px)}
.top .mid{text-align:center;line-height:1.1}.top .mid b{font-size:19px;font-weight:900;letter-spacing:-.5px}
.ib{width:42px;height:42px;border-radius:13px;background:#111a28;border:1px solid var(--line);position:relative}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--r);box-shadow:0 0 10px var(--r)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:linear-gradient(135deg,#697cff,#a26cff);flex:none}
main{flex:1;min-height:0;position:relative}
.pg{height:100%;overflow:auto;padding:20px 18px 28px;animation:fade .4s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.nav{flex:none;height:68px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(8,11,17,.95);backdrop-filter:blur(18px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box}
.nav button{display:grid;place-content:center;justify-items:center;gap:3px;color:#778398;font-size:11px;position:relative}
.nav span{font-size:21px;transition:transform .3s var(--ease)}
.nav .on{color:#a8b0ff}.nav .on span{transform:translateY(-2px) scale(1.18)}
.nav .on::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--a),var(--b))}
h2{font-size:27px;margin:2px 0 6px;letter-spacing:-.8px}.sub{color:var(--mu);margin:0 0 18px}
.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#141c2b,#0d131e)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qc{padding:18px;min-height:118px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s var(--ease)}
.qc:active{transform:scale(.96)}.qc .i{font-size:28px}.qc b{display:block}.qc small{color:var(--mu)}
.live{display:inline-flex;gap:8px;align-items:center;color:#7ce3ae;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.row{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:10px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}.row .t b{display:block}.row .t small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:36px;height:36px;border-radius:11px;background:#141d2d;border:1px solid var(--line);font-size:15px}
.empty{padding:30px;text-align:center;color:var(--mu)}

/* modal + toast */
.ov{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px}
.md{width:min(480px,100%);max-height:88dvh;overflow:auto;background:#101722;border:1px solid var(--line);border-radius:26px;padding:22px;animation:pop .3s var(--ease) both}
.md h3{margin:0 0 4px;font-size:21px}
#toast{position:fixed;left:50%;bottom:96px;z-index:9000;transform:translate(-50%,14px);padding:12px 16px;border-radius:14px;background:#121925;border:1px solid var(--line);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* chat */
.chat{padding:0!important;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(12,17,25,.8)}
.cb{flex:1;min-height:0;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:5px}
.m{max-width:80%;padding:9px 13px 6px;border-radius:19px;line-height:1.4;word-break:break-word;animation:mi .3s var(--ease) both}
@keyframes mi{from{opacity:0;transform:translateY(12px) scale(.94)}}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#6f82ff,#9a74f0);border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:rgba(255,255,255,.07);border-bottom-left-radius:6px}
.m small{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:2px}
.cp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cp input{margin:0;border-radius:26px;flex:1}
.snd{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7889ff,#a077ff);flex:none}

/* tic-tac-toe */
.bd{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:420px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:13px;background:#162033;border:1px solid var(--line);font-size:clamp(24px,8vw,42px);font-weight:900;transition:transform .15s var(--ease)}
.cell:active{transform:scale(.9)}
.cell.n{animation:cp .35s var(--ease)}@keyframes cp{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.cell.w{background:linear-gradient(135deg,#2b3c78,#5a3a96);box-shadow:0 0 22px rgba(124,140,255,.6);animation:wn .8s ease-in-out infinite alternate}
@keyframes wn{to{transform:scale(1.07)}}
.X{color:#9aa7ff}.O{color:#ff8999}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.rot{transform:rotate(135deg)}
.ib,.mini,.snd{display:grid;place-items:center}.snd{color:#fff}
.mini{color:#aab3ff;transition:transform .15s var(--ease)}.mini.d{color:#ff8797;background:rgba(255,99,119,.1)}.mini:active{transform:scale(.86)}
.ch .ib:nth-of-type(2){color:#8ff0bd}.ch .ib.g{color:#c9a8ff}
.qc .i .ic{width:30px;height:30px;color:#aab3ff}
.tg2{width:50px;height:30px;border-radius:15px;background:#26324a;position:relative;flex:none;transition:.25s}
.tg2 i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.tg2.on{background:linear-gradient(135deg,var(--a),var(--b))}.tg2.on i{transform:translateX(20px)}
#call{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 30px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);background:radial-gradient(circle at 50% 0,#2b3470,transparent 60%),radial-gradient(circle at 85% 100%,#5b2e8a,transparent 55%),#070a14}
.ctop{align-self:stretch;display:flex;justify-content:space-between;align-items:center;color:#8e9cff;font-size:12px;letter-spacing:3px}
.cmid{display:flex;flex-direction:column;align-items:center;text-align:center}
.cav{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:900;background:linear-gradient(135deg,#687cff,#a36eff);box-shadow:0 20px 56px rgba(104,124,255,.6)}
.cav::before,.cav::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(150,165,255,.6);animation:rip 2.4s ease-out infinite}.cav::after{animation-delay:1.2s}
.cnm{font-size:30px;font-weight:900;margin-top:22px}.cst{color:var(--mu);margin-top:6px}
.ctm{font-size:26px;font-variant-numeric:tabular-nums;margin-top:14px;opacity:0}#call.on .ctm{opacity:1}
.eq{display:none;gap:4px;height:30px;align-items:flex-end;margin-top:12px}#call.on .eq{display:flex}
.eq i{width:5px;height:100%;border-radius:3px;background:linear-gradient(#8e9cff,#c18cff);transform-origin:bottom;animation:eqa 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eqa{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.cbs{display:flex;gap:18px;justify-content:center}
.cb2{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff}
.cb2 .ic{width:28px;height:28px}.cb2.r{background:linear-gradient(145deg,#ff5468,#c21f35);border-color:transparent;box-shadow:0 10px 26px rgba(229,56,79,.5)}
.cb2.gn{background:linear-gradient(145deg,#38d98b,#1a9e5f);border-color:transparent;box-shadow:0 10px 26px rgba(40,200,120,.5);animation:shk 1s ease-in-out infinite}
.cb2.on{background:#fff;color:#000}
@keyframes shk{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(0)}}
#call.mn{inset:auto;top:calc(env(safe-area-inset-top,0px) + 74px);left:50%;transform:translateX(-50%);padding:6px 8px;flex-direction:row;gap:10px;border-radius:30px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.6);background:#101a2c;touch-action:none}
#call.mn .cmid{flex-direction:row;gap:8px}#call.mn .cav{width:38px;height:38px;font-size:14px;box-shadow:none}
#call.mn .cav::before,#call.mn .cav::after,#call.mn .cnm,#call.mn .cst,#call.mn .eq,#call.mn .ctop,#call.mn .cb2:not(#cEnd){display:none}
#call.mn .ctm{margin:0;font-size:15px}#call.mn .cb2{width:38px;height:38px}#call.mn .cb2 .ic{width:18px;height:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><h1 class="grad">NEXORA</h1><div class="tg">CHAT · CALL · PLAY</div><div class="ld"></div><div class="pw">Powered by <b>Suraj Kumar</b></div></div>

<div id="app">
  <section id="auth" class="hide">
    <div class="acard">
      <h1 class="grad">NEXORA</h1>
      <p>Chat with people online and play games while you talk.</p>
      <div id="fLogin">
        <input id="em" type="email" placeholder="Email" autocomplete="email">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
        <button id="bLogin" class="btn pri wide">Log in</button>
        <div style="height:10px"></div>
        <button id="bGuest" class="btn wide">Continue as guest</button>
      </div>
      <div id="fSign" class="hide">
        <input id="sn" placeholder="Display name" maxlength="30">
        <input id="se" type="email" placeholder="Email" autocomplete="email">
        <input id="sp" type="password" placeholder="Password (6+ characters)" autocomplete="new-password">
        <button id="bSign" class="btn pri wide">Create account</button>
      </div>
      <div id="amsg"></div>
      <div class="sw"><span id="swT">New here?</span> <button id="swB">Create account</button></div>
      <div class="pw" style="text-align:center;margin-top:18px">Powered by <b>Suraj Kumar</b></div>
    </div>
  </section>

  <section id="shell" class="hide">
    <header class="top">
      <button id="bell" class="ib" aria-label="Notifications">🔔<i id="bdot" class="dot hide"></i></button>
      <div class="mid"><b class="grad">NEXORA</b><div class="pw">Powered by <b>Suraj Kumar</b></div></div>
      <button id="prof" class="av" aria-label="Profile">N</button>
    </header>
    <main id="main"></main>
    <nav class="nav" id="nav">
      <button data-p="home" class="on"><span>⌂</span>Home</button>
      <button data-p="recent"><span>◷</span>Recent</button>
      <button data-p="connect"><span>◎</span>Connect</button>
      <button data-p="games"><span>♟</span>Games</button>
      <button data-p="settings"><span>⚙</span>Settings</button>
    </nav>
  </section>
</div>
<div id="call" class="hide"><div class="ctop"><button id="cMin" class="ib" aria-label="Minimize"></button><span>NEXORA VOICE</span><span style="width:42px"></span></div>
<div class="cmid"><div class="cav" id="cAv">N</div><div class="cnm" id="cNm"></div><div class="cst" id="cSt"></div><div class="ctm" id="cTm">00:00</div><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="cbs"><button id="cMute" class="cb2" aria-label="Mute"></button><button id="cAcc" class="cb2 gn hide" aria-label="Accept"></button><button id="cEnd" class="cb2 r" aria-label="End call"></button></div></div>
<div id="toast"></div>
<div id="ov" class="ov hide"><div id="md" class="md"></div></div>

<script>
const sb=supabase.createClient("https://ktwluvpmzisonmootdqc.supabase.co","sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm",{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const S={user:null,me:null,page:"home",tab:"home",sound:localStorage.nx_snd!=="0",live:1,convs:[],chat:null,ch:null,lch:null};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=n=>(n||"N").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"N";
const jget=(k,d)=>{try{return JSON.parse(localStorage[k])??d}catch(_){return d}};
const myName=()=>S.me?.display_name||S.me?.username||"Player";
const nick=(id,fb)=>jget("nx_nick",{})[id]||fb;
let AC;
function sfx(f=440,d=.08,t="sine",v=.05){if(!S.sound)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(_){}}
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2600)}
function openModal(h){$("md").innerHTML=h;$("ov").classList.remove("hide")}
function closeModal(){$("ov").classList.add("hide")}
$("ov").onclick=e=>{if(e.target===$("ov"))closeModal()};
document.addEventListener("pointerdown",e=>{if(e.target.closest(".btn,.qc,.cell,.nav button,.ib"))sfx(520,.04,"triangle",.025)});

/* ---------- auth ---------- */
const amsg=(t,c)=>{$("amsg").textContent=t||"";$("amsg").style.color=c==="e"?"#ff8190":c==="o"?"#65dda1":""};
function authMode(s){$("fLogin").classList.toggle("hide",s);$("fSign").classList.toggle("hide",!s);$("swT").textContent=s?"Already have an account?":"New here?";$("swB").textContent=s?"Log in":"Create account";amsg("")}
$("swB").onclick=()=>authMode($("fSign").classList.contains("hide"));
const busy=b=>["bLogin","bGuest","bSign"].forEach(i=>$(i).disabled=b);
async function ensureProfile(u){
  try{
    const{data}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();if(data)return data;
    const m=u.user_metadata||{},nm=m.display_name||(u.email?u.email.split("@")[0]:"Guest");
    let un=nm.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,12);if(un.length<3)un="user";un+="_"+u.id.replace(/-/g,"").slice(0,5);
    const{data:c}=await sb.from("profiles").insert({id:u.id,username:un,display_name:nm,is_guest:!!u.is_anonymous,online:true,last_seen:new Date().toISOString()}).select("*").maybeSingle();return c;
  }catch(_){return null}
}
async function enter(u){
  S.user=u;$("auth").classList.add("hide");$("shell").classList.remove("hide");
  S.me=await ensureProfile(u);paintAv();go("home");startLive();startSig();checkNotes();
  setOnline(true);
}

function tttMenu(){openModal(`<h3>Tic-Tac-Toe</h3><p class="sub">5×5 board. Line up four to win.</p>
  <button class="btn pri wide" style="margin-bottom:10px" onclick="tttStart('bot')">Play against a robot</button>
  <button class="btn wide" style="margin-bottom:10px" onclick="tttStart('local')">Two players, one phone</button>
  <button class="btn wide" onclick="closeModal()">Close</button>`)}
function lineWin(b,L=4,N=5){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=b[r*N+c];if(!v)continue;
    for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;for(;k<L;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=N||x<0||x>=N||b[y*N+x]!==v)break}
      if(k===L)return{v,cells:Array.from({length:L},(_,i)=>(r+dr*i)*N+c+dc*i)}}}
  return null}
function tttStart(mode){closeModal();S.page="ttt";S.ttt={b:Array(25).fill(""),t:"X",mode,over:false,win:null,last:-1,msg:mode==="bot"?"Your turn (X)":"X goes first"};tttDraw()}
function tttDraw(){
  const T=S.ttt,on=T.mode==="online";
  $("main").innerHTML=`<section class="pg"><button class="btn" onclick="go('games')" style="margin-bottom:14px">‹ Games</button><h2>Tic-Tac-Toe</h2><p class="sub">${esc(T.msg)}</p>
   <div class="bd">${T.b.map((v,i)=>`<button class="cell ${v}${i===T.last?" n":""}${T.win?.cells.includes(i)?" w":""}" onclick="tttTap(${i})" aria-label="Cell ${i+1}">${v}</button>`).join("")}</div>
   <button class="btn pri wide" style="margin:18px auto 0;display:block;max-width:420px" ${T.left?"disabled":""} onclick="${on?"tttAgain()":`tttStart('${T.mode}')`}">${on&&T.rem.me?"Waiting for your friend…":on?"Play again":"Restart"}</button></section>`;
}
function tttEnd(){[523,659,784,1047].forEach((f,k)=>setTimeout(()=>sfx(f,.25),k*130));navigator.vibrate?.([60,40,60])}
function tttPlace(i){
  const T=S.ttt;T.b[i]=T.t;T.last=i;T.seq=(T.seq||0)+1;sfx(T.t==="X"?520:420,.08,"triangle",.06);
  const w=lineWin(T.b);
  if(w){T.over=true;T.win=w;tttEnd();T.msg=T.mode==="bot"?(w.v==="X"?"You won! 🏆":"The robot won"):w.v+" wins! 🏆"}
  else if(T.b.every(Boolean)){T.over=true;T.msg="It's a draw"}
  else{T.t=T.t==="X"?"O":"X";T.msg=T.mode==="bot"?(T.t==="X"?"Your turn (X)":"Robot is thinking…"):T.t+"'s turn"}
  if(T.mode==="online"){tttMsg();tttSnap()}
  tttDraw();
}
function tttTap(i){const T=S.ttt;if(!T||T.over||T.b[i]||T.left||(T.mode==="bot"&&T.t!=="X")||(T.mode==="online"&&T.t!==T.mine))return;tttPlace(i);if(T.mode==="bot"&&!T.over)setTimeout(tttBot,650)}
/* online: every move sends the full board, so both phones always agree on whose turn it is */
function tttOnline(opp,me){S.page="ttt";S.ttt={b:Array(25).fill(""),t:"X",mode:"online",on:true,opp,mine:me,seq:0,over:false,win:null,last:-1,rem:{},msg:""};tttMsg();tttDraw()}
function tttMsg(){const T=S.ttt;if(!T||T.mode!=="online")return;T.msg=T.left?"Your friend left the game":T.over?(T.win?(T.win.v===T.mine?"You won! 🏆":"Your friend won"):"It's a draw"):(T.t===T.mine?`Your turn (${T.mine})`:"Friend's turn")}
function tttSnap(){const T=S.ttt;sig({type:"tmv",to:T.opp,b:T.b,t:T.t,seq:T.seq,over:T.over,win:T.win,last:T.last})}
function tttSig(p){
  const T=S.ttt;if(!T?.on||p.from!==T.opp)return;
  if(p.type==="tmv"&&p.seq>T.seq){Object.assign(T,{b:p.b,t:p.t,seq:p.seq,over:p.over,win:p.win,last:p.last});sfx(T.t==="X"?420:520,.08,"triangle",.06);if(T.over)tttEnd();tttMsg();tttDraw()}
  else if(p.type==="trem"){T.rem.opp=1;tttRemCheck()}
  else if(p.type==="tbye"){T.left=true;tttMsg();tttDraw()}
}
function tttAgain(){const T=S.ttt;T.rem.me=1;sig({type:"trem",to:T.opp});tttRemCheck();if(S.ttt===T)tttDraw()}
function tttRemCheck(){const T=S.ttt;if(!(T.rem.me&&T.rem.opp))return;tttOnline(T.opp,T.mine==="X"?"O":"X")}
function tttScore(b,i,sym){
  const r=Math.floor(i/5),c=i%5,opp=sym==="X"?"O":"X";let s=0;
  for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]])for(let k=0;k<4;k++){let own=0,bad=false;
    for(let j=0;j<4;j++){const y=r+dr*(j-k),x=c+dc*(j-k);if(y<0||y>4||x<0||x>4){bad=true;break}const v=b[y*5+x];if(v===opp){bad=true;break}if(v===sym)own++}
    if(!bad)s+=[1,3,9,40][own]}
  return s}
function tttBot(){
  const T=S.ttt;if(!T||T.over||T.t!=="O")return;const b=T.b,emp=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
  const wins=(s,i)=>{b[i]=s;const w=lineWin(b)?.v===s;b[i]="";return w};
  let p=emp.find(i=>wins("O",i));if(p===undefined)p=emp.find(i=>wins("X",i));
  if(p===undefined){let best=-1;emp.forEach(i=>{const s=tttScore(b,i,"O")*1.1+tttScore(b,i,"X")+Math.random()*.8-(Math.abs(i%5-2)+Math.abs(Math.floor(i/5)-2))*.3;if(s>best){best=s;p=i}})}
  tttPlace(p);
}

async function saveProfile(){
  const m=$("pm"),name=$("pn").value.trim(),un=$("pu").value.trim().toLowerCase(),bad=t=>{m.style.color="#ff8190";m.textContent=t};
  if(name.length<2)return bad("Name needs at least 2 letters.");if(!/^[a-z0-9_]{3,20}$/.test(un))return bad("Username can use a–z, 0–9 and _ (3–20).");
  m.style.color="";m.textContent="Saving…";
  const{data:t}=await sb.from("profiles").select("id").ilike("username",un).neq("id",S.user.id).limit(1);if(t?.length)return bad("That username is taken.");
  const{data,error}=await sb.from("profiles").update({display_name:name,username:un}).eq("id",S.user.id).select("*").maybeSingle();
  if(error)return bad(/duplicate|unique/i.test(error.message)?"That username is taken.":"Could not save. Try again.");
  S.me=data||{...S.me,display_name:name,username:un};paintAv();m.style.color="#65dda1";m.textContent="Saved";toast("Profile updated.");
}
$("prof").onclick=()=>go("settings");

/* ---------- icons ---------- */
const IC=d=>`<svg class="ic" viewBox="0 0 24 24">${d}</svg>`;
const I={edit:IC('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>'),trash:IC('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>'),
 phone:IC('<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.8 2z"/>'),
 game:IC('<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11" r=".7"/><circle cx="18.5" cy="14" r=".7"/>'),
 mic:IC('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/>'),micoff:IC('<path d="M2 2l20 20"/><path d="M9 9v2a3 3 0 005 2M15 9V5a3 3 0 00-5.1-2"/><path d="M5 11a7 7 0 0011 5M12 18v4"/>'),
 down:IC('<path d="M6 9l6 6 6-6"/>'),send:IC('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'),back:IC('<path d="M15 18l-6-6 6-6"/>'),chat:IC('<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>')};
$("cMin").innerHTML=I.down;$("cMute").innerHTML=I.mic;$("cAcc").innerHTML=I.phone;$("cEnd").innerHTML=I.phone.replace('class="ic"','class="ic rot"');

/* ---------- privacy ---------- */
const PRIV={hide:false,calls:true,invites:true,...jget("nx_priv",{})};
const setOnline=on=>sb.from("profiles").update({online:on&&!PRIV.hide,last_seen:new Date().toISOString()}).eq("id",S.user.id).then(()=>{},()=>{});
function togPriv(k,b){
  if(k==="snd"){S.sound=!S.sound;localStorage.nx_snd=S.sound?"1":"0";b.classList.toggle("on",S.sound);sfx(600,.1);return}
  PRIV[k]=!PRIV[k];localStorage.nx_priv=JSON.stringify(PRIV);b.classList.toggle("on",PRIV[k]);if(k==="hide")setOnline(true);
}

/* ---------- signaling ---------- */
let SIG=null;const ENDED=new Set();
function startSig(){
  if(SIG)sb.removeChannel(SIG);
  SIG=sb.channel("nx-signal",{config:{broadcast:{ack:true}}});
  SIG.on("broadcast",{event:"s"},({payload:p})=>{if(p&&p.to===S.user?.id)onSig(p)});SIG.subscribe();
}
const sig=p=>{try{SIG?.send({type:"broadcast",event:"s",payload:{...p,from:S.user.id}})}catch(_){}};
function onSig(p){
  const t=p.type;
  if(t==="offer")return gotOffer(p);
  if(t==="ginv")return gotInvite(p);
  if(t==="gacc"){if(S.inv&&p.from===S.inv.to){clearTimeout(S.inv.t);S.inv=null;closeModal();tttOnline(p.from,"X")}return}
  if(t==="gdec"){if(S.inv&&p.from===S.inv.to){clearTimeout(S.inv.t);S.inv=null;closeModal();toast("Invite declined.")}return}
  if(t==="gcan"){if(S.pinv?.from===p.from){S.pinv=null;closeModal();toast("Invite cancelled.")}return}
  if(t[0]==="t")return tttSig(p);
  if(!C||p.callId!==C.id)return;
  if(t==="ring"){C.ringing=true;paintCall()}
  else if(t==="answer"){C.st="connecting";paintCall();C.pc.setRemoteDescription(p.sdp).then(flushIce).catch(()=>{toast("Could not connect the call.");endCall()})}
  else if(t==="ice"){C.pc?.remoteDescription?C.pc.addIceCandidate(p.c).catch(()=>{}):C.q.push(p.c)}
  else if(t==="end"||t==="busy"||t==="decl"){toast(t==="busy"?"User is on another call.":t==="decl"?"Call declined.":"Call ended.");endCall(1)}
}

/* ---------- voice calls (work on every page) ---------- */
/* For calls over mobile data add a TURN server below, for example from metered.ca */
const ICE={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun.cloudflare.com:3478"]}]};
let C=null,RING=null;
async function mic(){
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("This browser cannot use the microphone. Open the site in Chrome or Safari over HTTPS.");
  try{return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){throw new Error(e.name==="NotAllowedError"?"Allow the microphone in your browser settings to make calls.":e.name==="NotFoundError"?"No microphone found.":"The microphone could not start.")}
}
function startRing(){stopRing();RING=setInterval(()=>{if(!C)return stopRing();
  if(C.st==="ringing"){sfx(520,.18,"sine",.08);setTimeout(()=>sfx(660,.18,"sine",.08),220);navigator.vibrate?.(200)}
  else if(C.st==="calling"&&C.ringing)sfx(440,.4,"sine",.04)},1800)}
function stopRing(){clearInterval(RING);RING=null}
function mkPc(){
  const pc=new RTCPeerConnection(ICE),c=C;c.pc=pc;
  pc.onicecandidate=e=>{if(e.candidate)sig({type:"ice",to:c.uid,callId:c.id,c:e.candidate})};
  pc.ontrack=e=>{let a=$("rAudio");if(!a){a=document.createElement("audio");a.id="rAudio";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
  pc.oniceconnectionstatechange=()=>{
    if(C!==c)return;const s=pc.iceConnectionState;
    if(s==="connected"||s==="completed"){clearTimeout(c.dead);if(c.st!=="on"){c.st="on";c.t0=Date.now();sfx(660,.12);setTimeout(()=>sfx(880,.2),130);navigator.vibrate?.(60)}else if(c.lost)toast("Connection restored.");c.lost=0;paintCall()}
    else if(s==="disconnected"){c.lost=1;paintCall();clearTimeout(c.dead);c.dead=setTimeout(()=>{if(C===c&&pc.iceConnectionState!=="connected"){toast("The call dropped.");endCall()}},25000)}
    else if(s==="failed"){toast("The call could not connect. Check both connections.");endCall()}
  };
  return pc;
}
async function startCall(uid,name,random){
  if(uid===S.user.id)return;if(C)return toast("You are already in a call.");
  let stream;try{stream=await mic()}catch(e){return toast(e.message)}
  if(C){stream.getTracks().forEach(t=>t.stop());return}
  const id=crypto.randomUUID(),c=C={id,uid,name,out:true,st:"calling",stream,q:[],muted:false};
  $("call").classList.remove("mn");paintCall();startRing();
  const pc=mkPc();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  try{await pc.setLocalDescription(await pc.createOffer())}catch(_){toast("Could not start the call.");return endCall(1)}
  const msg={type:"offer",to:uid,callId:id,fromName:myName(),random:!!random,sdp:pc.localDescription};let n=0;
  sig(msg);c.rs=setInterval(()=>{if(C!==c||c.ringing||c.st!=="calling"||++n>12)return clearInterval(c.rs);sig(msg)},2500);
  c.to=setTimeout(()=>{if(C===c&&c.st==="calling"){toast("No answer.");endCall()}},40000);
}
function gotOffer(p){
  if(ENDED.has(p.callId))return;
  if(C&&C.id===p.callId){sig({type:"ring",to:p.from,callId:C.id});return}
  if(C||!PRIV.calls){sig({type:C?"busy":"decl",to:p.from,callId:p.callId});return}
  const c=C={id:p.callId,uid:p.from,name:p.fromName||"Caller",out:false,st:"ringing",offer:p.sdp,q:[],muted:false};
  sig({type:"ring",to:p.from,callId:c.id});
  if(p.random&&RM?.kind==="call"){stopRandom();closeModal();return acceptCall()}
  $("call").classList.remove("mn");paintCall();startRing();
  c.to=setTimeout(()=>{if(C===c&&c.st==="ringing"){sig({type:"end",to:c.uid,callId:c.id});endCall(1)}},40000);
}
async function acceptCall(){
  const c=C;if(!c||c.st!=="ringing")return;stopRing();clearTimeout(c.to);
  let stream;try{stream=await mic()}catch(e){toast(e.message);sig({type:"decl",to:c.uid,callId:c.id});return endCall(1)}
  if(C!==c){stream.getTracks().forEach(t=>t.stop());return}
  c.stream=stream;c.st="connecting";paintCall();
  const pc=mkPc();stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  try{await pc.setRemoteDescription(c.offer);flushIce();await pc.setLocalDescription(await pc.createAnswer());sig({type:"answer",to:c.uid,callId:c.id,sdp:pc.localDescription})}
  catch(_){toast("Could not connect the call.");endCall()}
}
function flushIce(){const c=C;if(!c?.pc)return;while(c.q.length)c.pc.addIceCandidate(c.q.shift()).catch(()=>{})}
function endCall(silent){
  const c=C;if(!c)return;C=null;ENDED.add(c.id);stopRing();[c.to,c.dead].forEach(clearTimeout);clearInterval(c.rs);
  if(!silent)sig({type:c.st==="ringing"?"decl":"end",to:c.uid,callId:c.id});
  try{c.stream?.getTracks().forEach(t=>t.stop())}catch(_){}try{c.pc?.close()}catch(_){}
  $("rAudio")?.remove();const el=$("call");el.classList.add("hide");el.classList.remove("mn","on");el.style.cssText="";
  $("cMute").classList.remove("on");$("cMute").innerHTML=I.mic;sfx(320,.18);setTimeout(()=>sfx(220,.3),180);
}
function paintCall(){
  const c=C,el=$("call");if(!c)return;el.classList.remove("hide");
  $("cAv").textContent=ini(c.name);$("cNm").textContent=c.name;
  $("cSt").textContent=c.st==="ringing"?"Incoming voice call":c.st==="calling"?(c.ringing?"Ringing…":"Calling…"):c.st==="connecting"?"Connecting…":c.lost?"Reconnecting…":"Connected";
  el.classList.toggle("on",c.st==="on");$("cAcc").classList.toggle("hide",c.st!=="ringing");$("cMute").classList.toggle("hide",c.st==="ringing");
}
$("cAcc").onclick=acceptCall;$("cEnd").onclick=()=>endCall();$("cMin").onclick=()=>$("call").classList.add("mn");
$("cMute").onclick=()=>{const c=C;if(!c?.stream)return;c.muted=!c.muted;c.stream.getAudioTracks().forEach(t=>t.enabled=!c.muted);$("cMute").innerHTML=c.muted?I.micoff:I.mic;$("cMute").classList.toggle("on",c.muted);navigator.vibrate?.(20)};
setInterval(()=>{if(C?.st==="on"){const s=Math.floor((Date.now()-C.t0)/1000);$("cTm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}},500);
(()=>{const el=$("call");let d=null;
  el.addEventListener("pointerdown",e=>{if(!el.classList.contains("mn")||e.target.closest("#cEnd"))return;const r=el.getBoundingClientRect();d={ox:e.clientX-r.left,oy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,m:0};el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!d)return;if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>6)d.m=1;if(!d.m)return;el.style.transform="none";el.style.left=Math.max(4,Math.min(innerWidth-el.offsetWidth-4,e.clientX-d.ox))+"px";el.style.top=Math.max(4,Math.min(innerHeight-el.offsetHeight-4,e.clientY-d.oy))+"px"});
  el.addEventListener("pointerup",()=>{if(d&&!d.m){el.classList.remove("mn");el.style.cssText=""}d=null});
})();
addEventListener("pagehide",()=>{if(C)sig({type:"end",to:C.uid,callId:C.id})});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.user&&SIG&&SIG.state!=="joined")startSig()});

/* ---------- game invites (from the chat header) ---------- */
function inviteMenu(){
  openModal(`<h3>Invite to a game</h3><p class="sub">${esc(S.chat.name)} gets a request to join.</p>
   <button class="btn pri wide" style="margin-bottom:10px" onclick="sendInvite()">❌ Tic-Tac-Toe 5×5</button>
   <button class="btn wide" style="margin-bottom:10px;opacity:.6" onclick="toast('Ludo is coming in the next update.')">🎲 Ludo</button>
   <button class="btn wide" style="margin-bottom:10px;opacity:.6" onclick="toast('UNO is coming in the next update.')">🃏 UNO</button>
   <button class="btn wide" onclick="closeModal()">Close</button>`);
}
function sendInvite(){
  const c=S.chat;if(!c)return;S.inv={to:c.otherId};sig({type:"ginv",to:c.otherId,game:"ttt",fromName:myName()});
  openModal(`<h3>Invite sent</h3><p class="sub">Waiting for ${esc(c.name)} to accept…</p><button class="btn red wide" onclick="cancelInvite()">Cancel</button>`);
  S.inv.t=setTimeout(()=>{if(S.inv){cancelInvite();toast("No reply to your invite.")}},45000);
}
function cancelInvite(){if(S.inv){clearTimeout(S.inv.t);sig({type:"gcan",to:S.inv.to});S.inv=null}closeModal()}
function gotInvite(p){
  if(!PRIV.invites||S.ttt?.on){sig({type:"gdec",to:p.from});return}
  S.pinv=p;sfx(660,.25);navigator.vibrate?.([80,40,80]);
  openModal(`<h3>Tic-Tac-Toe invite</h3><p class="sub">${esc(p.fromName||"A friend")} wants to play with you.</p><div class="grid"><button class="btn" onclick="replyInv(0)">Decline</button><button class="btn pri" onclick="replyInv(1)">Accept</button></div>`);
}
function replyInv(ok){const p=S.pinv;S.pinv=null;closeModal();if(!p)return;sig({type:ok?"gacc":"gdec",to:p.from});if(ok)tttOnline(p.from,"O")}

/* ---------- boot ---------- */
setTimeout(()=>{$("splash").classList.add("out");setTimeout(()=>$("splash").remove(),800)},3300);
(async()=>{
  try{const{data}=await sb.auth.getSession();if(data?.session?.user)return enter(data.session.user)}catch(_){}
  $("auth").classList.remove("hide");
})();
setInterval(()=>{if(S.user)setOnline(true)},60000);
</script>
