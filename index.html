<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXORA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070a12;color:#eef2ff}
body{height:100dvh}
button,input{font:inherit}
button{border:0;cursor:pointer}
#app{height:100dvh;overflow:hidden}
.hidden{display:none!important}
.screen{height:100%;width:100%}
.auth-screen{display:flex;align-items:center;justify-content:center;padding:20px;background:
radial-gradient(circle at 20% 10%,rgba(90,100,255,.18),transparent 35%),
radial-gradient(circle at 90% 90%,rgba(0,220,180,.12),transparent 35%),#070a12}
.auth-card{width:min(430px,100%);padding:30px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:rgba(18,22,36,.86);box-shadow:0 25px 80px rgba(0,0,0,.45);backdrop-filter:blur(20px)}
.logo{font-size:32px;font-weight:900;letter-spacing:.12em}
.muted{color:#8992aa}
.auth-title{margin:8px 0 5px;font-size:24px}
.auth-sub{margin:0 0 24px;color:#8992aa}
.field{margin:10px 0}
.field input{width:100%;height:50px;padding:0 15px;border-radius:15px;border:1px solid #252b40;background:#0d1120;color:#fff;outline:none}
.field input:focus{border-color:#6572ff}
.btn{min-height:48px;padding:0 17px;border-radius:15px;color:#fff;background:#20263a;transition:.18s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.primary{background:linear-gradient(135deg,#6675ff,#4d58e8)}
.btn.green{background:linear-gradient(135deg,#20b994,#118b70)}
.btn.full{width:100%;margin-top:9px}
.auth-switch{display:flex;gap:8px;margin-top:16px}
.auth-switch .btn{flex:1}
.error{min-height:20px;margin-top:12px;color:#ff7d91;font-size:14px}
.success{color:#61e0ba}
.main{height:100%;display:flex;flex-direction:column}
.topbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(8,11,20,.9)}
.brand{font-weight:900;letter-spacing:.12em}
.profile-btn{display:flex;align-items:center;gap:8px;background:#151a2a;color:#fff;padding:7px 11px;border-radius:14px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6876ff,#23c9a3);font-weight:800}
.content{flex:1;min-height:0;overflow:auto;padding:18px 16px 95px}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:72px;display:flex;justify-content:space-around;align-items:center;background:rgba(9,12,22,.94);border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(18px)}
.nav button{background:none;color:#7e879e;padding:8px 13px;border-radius:13px}
.nav button.active{color:#fff;background:#181e31}
.card{padding:18px;border:1px solid rgba(255,255,255,.07);border-radius:22px;background:linear-gradient(145deg,#121728,#0d1120);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game-card{min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border-radius:22px;background:linear-gradient(145deg,#181e31,#0d1120);border:1px solid rgba(255,255,255,.07)}
.game-icon{font-size:36px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:8px}
.item{padding:13px;border-radius:16px;background:#101525;border:1px solid rgba(255,255,255,.05)}
.badge{font-size:11px;padding:4px 7px;border-radius:9px;background:#242b43;color:#aeb7ff}
.toast{position:fixed;z-index:100;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;padding:12px 16px;border-radius:14px;background:#20263a;color:#fff;box-shadow:0 15px 40px #0008;transition:.2s;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:#0009;backdrop-filter:blur(12px)}
.modal{width:min(470px,100%);max-height:90dvh;overflow:auto;padding:22px;border-radius:24px;background:#111729;border:1px solid #2a3148}
.call-overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#202b48,#060811 65%);padding:25px}
.call-box{text-align:center;width:min(420px,100%)}
.call-avatar{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:linear-gradient(135deg,#6978ff,#22c9a4);font-size:35px;font-weight:900}
.call-name{font-size:26px;font-weight:800}
.call-state{margin-top:7px;color:#99a2ba}
.call-actions{display:flex;justify-content:center;gap:13px;margin-top:35px}
.call-actions button{width:58px;height:58px;border-radius:50%;background:#242b40;color:#fff}
.call-actions .danger{background:#e84b61}
.call-actions .accept{background:#1db58c}
.game-board{width:min(520px,100%);margin:auto}
.ludo-board{aspect-ratio:1;background:#eee;border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);gap:1px}
.cell{background:#fafafa;display:grid;place-items:center;font-size:clamp(7px,2vw,14px)}
.red{background:#ef626f}.green{background:#55c98d}.yellow{background:#f3ca4d}.blue{background:#648cff}
.safe{font-size:16px}
.token{width:70%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px #0005}
.xo-board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.xo-cell{aspect-ratio:1;display:grid;place-items:center;border-radius:13px;background:#171d30;font-size:34px;font-weight:900}
.connect-board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#3345a2;padding:9px;border-radius:18px}
.connect-cell{aspect-ratio:1;border-radius:50%;background:#0b1020;display:grid;place-items:center}
.disc{width:78%;aspect-ratio:1;border-radius:50%}
@media(max-width:600px){.auth-card{padding:24px}.grid{grid-template-columns:1fr 1fr}.content{padding:14px 12px 90px}}
</style>
</head>
<body>
<div id="app">
<section id="authScreen" class="screen auth-screen">
  <div class="auth-card">
    <div class="logo">NEXORA</div>
    <h1 id="authTitle" class="auth-title">Welcome back</h1>
    <p id="authSub" class="auth-sub">Connect, chat, call and play.</p>

    <div id="emailFields">
      <div class="field"><input id="authEmail" type="email" autocomplete="email" placeholder="Email"></div>
      <div class="field"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Password"></div>
      <div id="nameField" class="field hidden"><input id="authName" type="text" placeholder="Display name"></div>
      <div id="usernameField" class="field hidden"><input id="authUsername" type="text" placeholder="Username"></div>
    </div>

    <button id="authMainBtn" class="btn primary full">Login</button>
    <button id="guestBtn" class="btn green full">Continue as Guest</button>

    <div class="auth-switch">
      <button id="loginModeBtn" class="btn">Login</button>
      <button id="signupModeBtn" class="btn">New Account</button>
    </div>

    <div id="authError" class="error"></div>
  </div>
</section>

<section id="mainScreen" class="screen main hidden">
  <header class="topbar">
    <div class="brand">NEXORA</div>
    <button id="profileBtn" class="profile-btn">
      <span id="profileAvatar" class="avatar">N</span>
      <span id="profileName">User</span>
    </button>
  </header>

  <main id="content" class="content"></main>

  <nav class="nav">
    <button data-page="home" class="active">⌂<br><small>Home</small></button>
    <button data-page="recent">◷<br><small>Recent</small></button>
    <button data-page="connect">◎<br><small>Connect</small></button>
    <button data-page="games">♟<br><small>Games</small></button>
  </nav>
</section>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>
<div id="callRoot"></div>

<script>
/* NEXORA PART 1/5 — FOUNDATION + AUTH */

const NEXORA_URL="https://ktwluvpmzisonmootdqc.supabase.co";
const NEXORA_KEY="sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm";
const supabaseClient=window.supabase.createClient(NEXORA_URL,NEXORA_KEY);

window.NEXORA=window.NEXORA||{};
NEXORA.sb=supabaseClient;
NEXORA.user=null;
NEXORA.profile=null;
NEXORA.page="home";
NEXORA.channels=[];
NEXORA.call=null;
NEXORA.game=null;
NEXORA.chat=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const initials=v=>String(v||"N").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();

let toastTimer;
function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}
function authError(message){
  $("authError").textContent=message||"Something went wrong.";
}
function clearAuthError(){
  $("authError").textContent="";
}
function showAuth(){
  $("authScreen").classList.remove("hidden");
  $("mainScreen").classList.add("hidden");
}
function showMain(){
  $("authScreen").classList.add("hidden");
  $("mainScreen").classList.remove("hidden");
}
function setAuthMode(mode){
  clearAuthError();
  const signup=mode==="signup";
  $("authTitle").textContent=signup?"Create your account":"Welcome back";
  $("authSub").textContent=signup?"Create your NEXORA account.":"Connect, chat, call and play.";
  $("authMainBtn").textContent=signup?"Create Account":"Login";
  $("nameField").classList.toggle("hidden",!signup);
  $("usernameField").classList.toggle("hidden",!signup);
  $("authMainBtn").dataset.mode=mode;
  $("authEmail").autocomplete=signup?"email":"username";
  $("authPassword").autocomplete=signup?"new-password":"current-password";
}
setAuthMode("login");

$("loginModeBtn").addEventListener("click",()=>setAuthMode("login"));
$("signupModeBtn").addEventListener("click",()=>setAuthMode("signup"));

async function ensureProfile(user,guest=false){
  if(!user)return null;

  const {data:existing}=await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(existing){
    NEXORA.profile=existing;
    return existing;
  }

  const base=user.email?user.email.split("@")[0]:"guest";
  const clean=(base.replace(/[^a-zA-Z0-9_]/g,"").slice(0,15)||"guest");
  const username=`${clean}_${user.id.slice(0,5)}`.toLowerCase().slice(0,24);

  const row={
    id:user.id,
    username,
    display_name:guest?"Guest":(user.user_metadata?.display_name||clean||"User"),
    is_guest:guest,
    online:true,
    last_seen:new Date().toISOString()
  };

  const {data,error}=await supabaseClient.from("profiles").insert(row).select().single();

  if(error){
    const retry=await supabaseClient.from("profiles").upsert(row,{onConflict:"id"}).select().maybeSingle();
    if(retry.error){
      throw retry.error;
    }
    NEXORA.profile=retry.data;
    return retry.data;
  }

  NEXORA.profile=data;
  return data;
}

async function enterApp(user,guest=false){
  try{
    NEXORA.user=user;
    await ensureProfile(user,guest);

    if(NEXORA.profile){
      await supabaseClient.from("profiles")
        .update({online:true,last_seen:new Date().toISOString()})
        .eq("id",user.id);
    }

    showMain();
    await startNexoraRealtime();
    renderPage("home");
  }catch(error){
    console.error(error);
    authError(error?.message||"Could not open NEXORA.");
    await supabaseClient.auth.signOut().catch(()=>{});
    NEXORA.user=null;
    NEXORA.profile=null;
    showAuth();
  }
}

async function loginAccount(){
  clearAuthError();
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;

  if(!email||!password){
    authError("Enter your email and password.");
    return;
  }

  const btn=$("authMainBtn");
  btn.disabled=true;
  btn.textContent="Logging in…";

  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.user)throw new Error("Login did not return a user.");
    await enterApp(data.user,false);
  }catch(error){
    console.error(error);
    authError(error?.message||"Login failed.");
  }finally{
    btn.disabled=false;
    btn.textContent="Login";
  }
}

async function signupAccount(){
  clearAuthError();
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;
  const name=$("authName").value.trim();
  const username=$("authUsername").value.trim().toLowerCase();

  if(!email||!password||!name||!username){
    authError("Fill all fields.");
    return;
  }
  if(password.length<6){
    authError("Password must be at least 6 characters.");
    return;
  }
  if(!/^[a-z0-9_]{3,24}$/.test(username)){
    authError("Username: 3–24 letters, numbers or underscore.");
    return;
  }

  const btn=$("authMainBtn");
  btn.disabled=true;
  btn.textContent="Creating…";

  try{
    const {data,error}=await supabaseClient.auth.signUp({
      email,
      password,
      options:{data:{display_name:name,username}}
    });
    if(error)throw error;

    if(!data.user)throw new Error("Account was not created.");

    if(!data.session){
      authError("Account created. Check your email to confirm it, then login.");
      setAuthMode("login");
      $("authEmail").value=email;
      return;
    }

    NEXORA.user=data.user;

    const {data:profile,error:profileError}=await supabaseClient
      .from("profiles")
      .upsert({
        id:data.user.id,
        username,
        display_name:name,
        is_guest:false,
        online:true,
        last_seen:new Date().toISOString()
      },{onConflict:"id"})
      .select()
      .single();

    if(profileError)throw profileError;

    NEXORA.profile=profile;
    showMain();
    await startNexoraRealtime();
    renderPage("home");
  }catch(error){
    console.error(error);
    authError(error?.message||"Account creation failed.");
  }finally{
    btn.disabled=false;
    btn.textContent="Create Account";
  }
}

async function guestLogin(){
  clearAuthError();

  const btn=$("guestBtn");
  btn.disabled=true;
  btn.textContent="Opening Guest…";

  try{
    const {data,error}=await supabaseClient.auth.signInAnonymously();
    if(error)throw error;
    if(!data.user)throw new Error("Guest session was not created.");
    await enterApp(data.user,true);
  }catch(error){
    console.error(error);

    let msg=error?.message||"Guest login failed.";
    if(/anonymous/i.test(msg)){
      msg="Guest mode is disabled in Supabase. Enable Anonymous Sign-Ins in Authentication → Providers.";
    }

    authError(msg);
  }finally{
    btn.disabled=false;
    btn.textContent="Continue as Guest";
  }
}

$("authMainBtn").addEventListener("click",async()=>{
  if($("authMainBtn").dataset.mode==="signup")await signupAccount();
  else await loginAccount();
});

$("guestBtn").addEventListener("click",guestLogin);

$("authPassword").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("authMainBtn").click();
});
$("authEmail").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("authMainBtn").click();
});

async function bootAuth(){
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();

    if(session?.user){
      await enterApp(session.user,!!session.user.is_anonymous);
    }else{
      showAuth();
    }

    supabaseClient.auth.onAuthStateChange(async(event,session)=>{
      if(event==="SIGNED_OUT"){
        NEXORA.user=null;
        NEXORA.profile=null;
        showAuth();
      }
    });
  }catch(error){
    console.error(error);
    showAuth();
    authError(error?.message||"Could not start NEXORA.");
  }
}

async function startNexoraRealtime(){
  if(NEXORA.started)return;
  NEXORA.started=true;

  const user=NEXORA.user;
  if(!user)return;

  NEXORA.userChannel=supabaseClient.channel(`nexora-user-${user.id}`,{
    config:{broadcast:{ack:true},presence:{key:user.id}}
  });

  NEXORA.userChannel
    .on("broadcast",{event:"signal"},payload=>{
      if(window.nexoraHandleSignal)window.nexoraHandleSignal(payload.payload);
    })
    .on("broadcast",{event:"notification"},payload=>{
      if(payload.payload?.to===user.id){
        toast(payload.payload.title||"New notification");
      }
    })
    .subscribe(async status=>{
      if(status==="SUBSCRIBED"){
        await NEXORA.userChannel.track({
          user_id:user.id,
          online:true,
          at:Date.now()
        }).catch(()=>{});
      }
    });

  NEXORA.channels.push(NEXORA.userChannel);

  supabaseClient
    .channel(`nexora-db-${user.id}`)
    .on("postgres_changes",
      {event:"INSERT",schema:"public",table:"calls",filter:`receiver_id=eq.${user.id}`},
      payload=>{
        if(window.nexoraIncomingCall)window.nexoraIncomingCall(payload.new);
      })
    .on("postgres_changes",
      {event:"UPDATE",schema:"public",table:"calls",filter:`receiver_id=eq.${user.id}`},
      payload=>{
        if(window.nexoraCallDbUpdate)window.nexoraCallDbUpdate(payload.new);
      })
    .on("postgres_changes",
      {event:"UPDATE",schema:"public",table:"calls",filter:`caller_id=eq.${user.id}`},
      payload=>{
        if(window.nexoraCallDbUpdate)window.nexoraCallDbUpdate(payload.new);
      })
    .subscribe();

  NEXORA.dbChannel=supabaseClient.channel(`nexora-db-${user.id}`);
  NEXORA.channels.push(NEXORA.dbChannel);

  try{
    await supabaseClient.from("profiles")
      .update({online:true,last_seen:new Date().toISOString()})
      .eq("id",user.id);
  }catch(_){}
}

function cleanupChannels(){
  for(const ch of NEXORA.channels){
    try{supabaseClient.removeChannel(ch)}catch(_){}
  }
  NEXORA.channels=[];
  NEXORA.started=false;
}

window.addEventListener("beforeunload",()=>{
  if(NEXORA.user){
    supabaseClient.from("profiles")
      .update({online:false,last_seen:new Date().toISOString()})
      .eq("id",NEXORA.user.id);
  }
});

async function logout(){
  try{
    if(NEXORA.user){
      await supabaseClient.from("profiles")
        .update({online:false,last_seen:new Date().toISOString()})
        .eq("id",NEXORA.user.id);
    }
    cleanupChannels();
    await supabaseClient.auth.signOut();
  }catch(error){
    toast(error?.message||"Logout failed.");
  }
}
   <!-- NEXORA PART 2/5 — APP NAVIGATION + HOME + RECENT + CONNECT -->

<script>
function renderPage(page){
  NEXORA.page=page;

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  if(page==="home")renderHome();
  else if(page==="recent")renderRecent();
  else if(page==="connect")renderConnect();
  else if(page==="games")renderGames();
}

document.querySelectorAll(".nav button").forEach(btn=>{
  btn.addEventListener("click",()=>renderPage(btn.dataset.page));
});

function renderHome(){
  const p=NEXORA.profile||{};
  $("profileAvatar").textContent=initials(p.display_name||p.username||"N");
  $("profileName").textContent=p.display_name||p.username||"User";

  $("content").innerHTML=`
    <div class="card">
      <div class="muted">Welcome back</div>
      <h1 style="margin:6px 0 4px">${esc(p.display_name||p.username||"User")}</h1>
      <div class="muted">@${esc(p.username||"user")}</div>
    </div>

    <div class="grid">
      <button class="game-card" onclick="renderPage('recent')">
        <div class="game-icon">◷</div>
        <b>Recent</b>
        <span class="muted">Chats, calls & notifications</span>
      </button>
      <button class="game-card" onclick="renderPage('connect')">
        <div class="game-icon">◎</div>
        <b>Connect</b>
        <span class="muted">Find people</span>
      </button>
      <button class="game-card" onclick="renderPage('games')">
        <div class="game-icon">♟</div>
        <b>Games</b>
        <span class="muted">Play with friends</span>
      </button>
      <button class="game-card" onclick="openProfileModal()">
        <div class="game-icon">◉</div>
        <b>Profile</b>
        <span class="muted">Your account</span>
      </button>
    </div>
  `;
}

async function renderRecent(){
  $("content").innerHTML=`
    <div class="row between">
      <div>
        <h2 style="margin:0">Recent</h2>
        <div class="muted">Chats, calls and notifications</div>
      </div>
      <button class="btn" onclick="renderPage('home')">Back</button>
    </div>
    <div id="recentList" style="margin-top:15px">
      <div class="card muted">Loading…</div>
    </div>
  `;

  const box=$("recentList");
  let html="";

  try{
    const {data:calls}=await supabaseClient
      .from("calls")
      .select("*")
      .or(`caller_id.eq.${NEXORA.user.id},receiver_id.eq.${NEXORA.user.id}`)
      .order("created_at",{ascending:false})
      .limit(30);

    if(calls?.length){
      html+=`<div class="card"><b>Calls</b><div class="list" style="margin-top:10px">`;
      for(const c of calls){
        const outgoing=c.caller_id===NEXORA.user.id;
        let label="Outgoing";
        if(c.status==="missed")label="Missed";
        else if(c.status==="declined")label="Declined";
        else if(c.status==="cancelled")label="Cancelled";
        else if(c.status==="accepted"||c.status==="ended")label="Accepted";
        html+=`
          <div class="item row between">
            <div>
              <b>${outgoing?"📞":"📥"} ${label}</b>
              <div class="muted">${new Date(c.created_at).toLocaleString()}</div>
            </div>
            ${c.status!=="accepted"&&c.status!=="ended"&&c.status!=="cancelled"

   <!-- NEXORA PART 3/5 — REAL WEBRTC VOICE CALLING -->

<script>
let nexoraPeer=null;
let nexoraLocalStream=null;
let nexoraRemoteAudio=null;
let nexoraCallTimer=null;
let nexoraCallSeconds=0;
let nexoraCallTimeout=null;
let nexoraCallId=null;
let nexoraCallRemoteId=null;
let nexoraCallRemoteName="User";
let nexoraCallRole=null;
let nexoraMuted=false;

function callMarkup(state){
  return `
  <div class="call-overlay" id="activeCallOverlay">
    <div class="call-box">
      <div class="call-avatar">${esc(initials(nexoraCallRemoteName))}</div>
      <div class="call-name">${esc(nexoraCallRemoteName)}</div>
      <div id="callState" class="call-state">${esc(state)}</div>
      <div id="callTimer" class="call-state">00:00</div>
      <div class="call-actions">
        <button id="callMuteBtn" onclick="toggleCallMute()">🎙</button>
        <button onclick="toggleCallSpeaker()">🔊</button>
        <button class="danger" onclick="endVoiceCall()">✕</button>
      </div>
    </div>
  </div>`;
}

function showCall(state){
  $("callRoot").innerHTML=callMarkup(state);
}

function removeCallUI(){
  $("callRoot").innerHTML="";
}

function formatCallTime(sec){
  const m=Math.floor(sec/60).toString().padStart(2,"0");
  const s=(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function startCallTimer(){
  clearInterval(nexoraCallTimer);
  nexoraCallSeconds=0;

  nexoraCallTimer=setInterval(()=>{
    nexoraCallSeconds++;
    const timer=$("callTimer");
    if(timer)timer.textContent=formatCallTime(nexoraCallSeconds);
  },1000);
}

function stopCallTimer(){
  clearInterval(nexoraCallTimer);
  nexoraCallTimer=null;
}

async function getCallProfile(userId){
  const {data}=await supabaseClient
    .from("profiles")
    .select("id,username,display_name")
    .eq("id",userId)
    .maybeSingle();
  return data;
}

async function startVoiceCall(username){
  if(NEXORA.call?.active){
    toast("You are already on a call.");
    return;
  }

  try{
    const {data:target,error:targetError}=await supabaseClient
      .from("profiles")
      .select("id,username,display_name")
      .ilike("username",username)
      .limit(1)
      .single();

    if(targetError)throw targetError;
    if(!target||target.id===NEXORA.user.id)throw new Error("Invalid call target.");

    const {data,error}=await supabaseClient.rpc("nexora_start_call",{
      target_username:target.username,
      call_kind:"voice"
    });

    if(error)throw error;

    nexoraCallId=data?.call_id;
    nexoraCallRemoteId=target.id;
    nexoraCallRemoteName=target.display_name||target.username;
    nexoraCallRole="caller";

    NEXORA.call={active:true,connected:false,id:nexoraCallId};

    showCall("Calling…");
    setCallState("Calling…");

    nexoraCallTimeout=setTimeout(async()=>{
      if(NEXORA.call?.active&&!NEXORA.call?.connected){
        await finishCallRow("missed");
        cleanupVoiceCall();
        toast("Call timed out.");
      }
    },30000);

    await createPeerConnection();

    const offer=await nexoraPeer.createOffer();
    await nexoraPeer.setLocalDescription(offer);

    await sendCallSignal({
      type:"call-offer",
      to:nexoraCallRemoteId,
      from:NEXORA.user.id,
      callId:nexoraCallId,
      offer
    });
  }catch(error){
    console.error(error);
    cleanupVoiceCall();
    toast(error?.message||"Could not start call.");
  }
}

function setCallState(text){
  const el=$("callState");
  if(el)el.textContent=text;
}

async function sendCallSignal(payload){
  if(!NEXORA.userChannel){
    throw new Error("Realtime connection is not ready.");
  }

  await NEXORA.userChannel.send({
    type:"broadcast",
    event:"signal",
    payload
  });
}

async function createPeerConnection(){
  if(nexoraPeer)return nexoraPeer;

  nexoraPeer=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });

  nexoraLocalStream=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },
    video:false
  });

  nexoraLocalStream.getTracks().forEach(track=>{
    nexoraPeer.addTrack(track,nexoraLocalStream);
  });

  nexoraPeer.onicecandidate=async event=>{
    if(event.candidate&&nexoraCallRemoteId){
      await sendCallSignal({
        type:"call-ice",
        to:nexoraCallRemoteId,
        from:NEXORA.user.id,
        callId:nexoraCallId,
        candidate:event.candidate
      }).catch(()=>{});
    }
  };

  nexoraPeer.ontrack=event=>{
    if(!nexoraRemoteAudio){
      nexoraRemoteAudio=document.createElement("audio");
      nexoraRemoteAudio.autoplay=true;
      nexoraRemoteAudio.playsInline=true;
      nexoraRemoteAudio.controls=false;
      document.body.appendChild(nexoraRemoteAudio);
    }

    nexoraRemoteAudio.srcObject=event.streams[0];
    nexoraRemoteAudio.play().catch(()=>{});
  };

  nexoraPeer.onconnectionstatechange=async()=>{
    const state=nexoraPeer?.connectionState;

    if(state==="connected"){
      clearTimeout(nexoraCallTimeout);
      NEXORA.call.connected=true;
      setCallState("Connected");
      startCallTimer();

      await supabaseClient.from("calls")
        .update({status:"accepted",started_at:new Date().toISOString()})
        .eq("id",nexoraCallId);
    }

    if(["failed","disconnected","closed"].includes(state)){
      if(NEXORA.call?.active){
        await finishCallRow("ended");
        cleanupVoiceCall();
      }
    }
  };

  return nexoraPeer;
}

window.nexoraHandleSignal=async(payload)=>{
  if(!payload||payload.to!==NEXORA.user.id)return;

  try{
    if(payload.type==="call-offer"){
      await handleIncomingOffer(payload);
    }else if(payload.type==="call-answer"){
      if(payload.callId!==nexoraCallId)return;
      await nexoraPeer.setRemoteDescription(new RTCSessionDescription(payload.answer));
    }else if(payload.type==="call-ice"){
      if(payload.callId!==nexoraCallId)return;
      if(nexoraPeer){
        await nexoraPeer.addIceCandidate(new RTCIceCandidate(payload.candidate));
      }
    }else if(payload.type==="call-cancel"){
      if(payload.callId===nexoraCallId){
        cleanupVoiceCall();
        toast("Call cancelled.");
      }
    }else if(payload.type==="call-end"){
      if(payload.callId===nexoraCallId){
        cleanupVoiceCall();
        toast("Call ended.");
      }
    }
  }catch(error){
    console.error("Call signal error",error);
  }
};

async function handleIncomingOffer(payload){
  if(NEXORA.call?.active){
    await sendCallSignal({
      type:"call-busy",
      to:payload.from,
      from:NEXORA.user.id,
      callId:payload.callId
    }).catch(()=>{});
    return;
  }

  const caller=await getCallProfile(payload.from);

  nexoraCallId=payload.callId;
  nexoraCallRemoteId=payload.from;
  nexoraCallRemoteName=caller?.display_name||caller?.username||"Incoming call";
  nexoraCallRole="receiver";

  NEXORA.call={active:true,connected:false,id:nexoraCallId};

  $("callRoot").innerHTML=`
    <div class="call-overlay">
      <div class="call-box">
        <div class="call-avatar">${esc(initials(nexoraCallRemoteName))}</div>
        <div class="call-name">${esc(nexoraCallRemoteName)}</div>
        <div class="call-state">Incoming voice call</div>
        <div class="call-actions">
          <button class="danger" onclick="declineIncomingCall()">✕</button>
          <button class="accept" onclick='acceptIncomingCall(${JSON.stringify(payload.offer)})'>✓</button>
        </div>
      </div>
    </div>`;

  playCallTone();

  nexoraCallTimeout=setTimeout(async()=>{
    if(NEXORA.call?.active&&!NEXORA.call?.connected){
      stopCallTone();
      await finishCallRow("missed");
      cleanupVoiceCall();
    }
  },30000);
}

let nexoraToneContext=null;
let nexoraToneTimer=null;

function playCallTone(){
  try{
    stopCallTone();
    nexoraToneContext=new (window.AudioContext||window.webkitAudioContext)();

    const beep=()=>{
      if(!nexoraToneContext)return;
      const osc=nexoraToneContext.createOscillator();
      const gain=nexoraToneContext.createGain();
      osc.frequency.value=520;
      gain.gain.value=.045;
      osc.connect(gain);
      gain.connect(nexoraToneContext.destination);
      osc.start();
      osc.stop(nexoraToneContext.currentTime+.25);
    };

    beep();
    nexoraToneTimer=setInterval(beep,1800);
  }catch(_){}
}

function stopCallTone(){
  clearInterval(nexoraToneTimer);
  nexoraToneTimer=null;
  try{
    nexoraToneContext?.close();
  }catch(_){}
  nexoraToneContext=null;
}

async function acceptIncomingCall(offer){
  try{
    stopCallTone();
    clearTimeout(nexoraCallTimeout);

    showCall("Connecting…");
    await createPeerConnection();

    await nexoraPeer.setRemoteDescription(new RTCSessionDescription(offer));

    const answer=await nexoraPeer.createAnswer();
    await nexoraPeer.setLocalDescription(answer);

    await sendCallSignal({
      type:"call-answer",
      to:nexoraCallRemoteId,
      from:NEXORA.user.id,
      callId:nexoraCallId,
      answer
    });
  }catch(error){
    console.error(error);
    toast(error?.message||"Could not accept call.");
    cleanupVoiceCall();
  }
}

async function declineIncomingCall(){
  stopCallTone();

  await finishCallRow("declined");

  await sendCallSignal({
    type:"call-end",
    to:nexoraCallRemoteId,
    from:NEXORA.user.id,
    callId:nexoraCallId
  }).catch(()=>{});

  cleanupVoiceCall();
}

async function endVoiceCall(){
  if(!NEXORA.call?.active)return;

  await sendCallSignal({
    type:"call-end",
    to:nexoraCallRemoteId,
    from:NEXORA.user.id,
    callId:nexoraCallId
  }).catch(()=>{});

  await finishCallRow(NEXORA.call.connected?"ended":"cancelled");
  cleanupVoiceCall();
}

async function finishCallRow(status){
  if(!nexoraCallId)return;

  const update={status};

  if(status==="accepted"){
    update.started_at=new Date().toISOString();
  }

  if(["ended","cancelled","declined","missed"].includes(status)){
    update.ended_at=new Date().toISOString();
  }

  await supabaseClient.from("calls")
    .update(update)
    .eq("id",nexoraCallId)
    .catch(()=>{});
}

function cleanupVoiceCall(){
  stopCallTone();
  clearTimeout(nexoraCallTimeout);
  clearInterval(nexoraCallTimer);

  try{
    nexoraLocalStream?.getTracks().forEach(t=>t.stop());
  }catch(_){}

  try{
    nexoraPeer?.close();
  }catch(_){}

  if(nexoraRemoteAudio){
    try{
      nexoraRemoteAudio.pause();
      nexoraRemoteAudio.srcObject=null;
      nexoraRemoteAudio.remove();
    }catch(_){}
  }

  nexoraPeer=null;
  nexoraLocalStream=null;
  nexoraRemoteAudio=null;
  nexoraCallTimeout=null;
  nexoraCallTimer=null;
  nexoraCallId=null;
  nexoraCallRemoteId=null;
  nexoraCallRemoteName="User";
  nexoraCallRole=null;
  nexoraCallSeconds=0;
  nexoraMuted=false;
  NEXORA.call=null;

  removeCallUI();
}

function toggleCallMute(){
  if(!nexoraLocalStream)return;

  nexoraMuted=!nexoraMuted;

  nexoraLocalStream.getAudioTracks().forEach(track=>{
    track.enabled=!nexoraMuted;
  });

  const btn=$("callMuteBtn");
  if(btn)btn.textContent=nexoraMuted?"🔇":"🎙";
}

function toggleCallSpeaker(){
  if(!nexoraRemoteAudio)return;

  if("setSinkId" in nexoraRemoteAudio){
    nexoraRemoteAudio.setSinkId("").catch(()=>{});
  }

  toast("Speaker control is handled by your device audio output.");
}

window.nexoraIncomingCall=row=>{
  if(!row||row.caller_id===NEXORA.user.id)return;
  if(["ringing"].includes(row.status)){
    if(nexoraCallId===row.id)return;
  }
};

window.nexoraCallDbUpdate=row=>{
  if(!row||row.id!==nexoraCallId)return;

  if(["declined","cancelled","missed"].includes(row.status)){
    cleanupVoiceCall();
  }
};

window.addEventListener("pagehide",()=>{
  if(NEXORA.call?.active){
    endVoiceCall().catch(()=>{});
  }
});

/* ---------- LUDO ---------- */

const ludoColors=["red","green","yellow","blue"];

function startLudo(mode){
  NEXORA.game={type:"ludo",mode,turn:0,finished:false};

  $("content").innerHTML=`
    <div class="row between">
      <div><h2 style="margin:0">Ludo</h2><div id="ludoStatus" class="muted">Your turn</div></div>
      <button class="btn" onclick="renderPage('games')">Back</button>
    </div>

    <div class="card game-board" style="margin-top:14px">
      <div id="ludoBoard" class="ludo-board"></div>
      <div class="row between" style="margin-top:14px">
        <button class="btn primary" onclick="rollLudoDice()">🎲 Roll Dice</button>
        <b id="ludoDice">–</b>
      </div>
    </div>
  `;

  buildLudoBoard();
}

function buildLudoBoard(){
  const board=$("ludoBoard");
  let html="";

  for(let r=0;r<15;r++){
    for(let c=0;c<15;c++){
      let cls="cell";

      if(r<6&&c<6)cls+=" red";
      else if(r<6&&c>8)cls+=" green";
      else if(r>8&&c<6)cls+=" blue";
      else if(r>8&&c>8)cls+=" yellow";

      const track=
        (r===7&&c>=1&&c<=13)||
        (c===7&&r>=1&&r<=13);

      if(track)cls="cell";

      let symbol="";
      if((r===7&&c===2)||(r===2&&c===7)||(r===7&&c===12)||(r===12&&c===7)){
        symbol="★";
        cls+=" safe";
      }

      if(r===7&&c===7)symbol="🏠";

      html+=`<div class="${cls}">${symbol}</div>`;
    }
  }

  board.innerHTML=html;
}

function rollLudoDice(){
  if(NEXORA.game.finished)return;

  const value=Math.floor(Math.random()*6)+1;
  $("ludoDice").textContent=value;

  if(value===6){
    $("ludoStatus").textContent="6! You get another turn.";
  }else{
    $("ludoStatus").textContent="Dice rolled. Choose a movable token.";
  }

  toast(`Dice: ${value}`);
}

/* ---------- TIC TAC TOE 5×5 / FOUR IN A ROW ---------- */

let tttBoard=[];
let tttTurn="X";

function startTTT(mode){
  tttBoard=Array(25).fill("");
  tttTurn="X";
  NEXORA.game={type:"ttt",mode};

  $("content").innerHTML=`
    <div class="row between">
      <div><h2 style="margin:0">Tic-Tac-Toe</h2><div id="tttStatus" class="muted">X's turn</div></div>
      <button class="btn" onclick="renderPage('games')">Back</button>
    </div>
    <div class="card game-board" style="margin-top:14px">
      <div id="tttBoard" class="xo-board"></div>
      <button class="btn full" onclick="startTTT('${esc(mode)}')">Restart</button>
    </div>
  `;

  renderTTT();
}

function renderTTT(){
  $("tttBoard").innerHTML=tttBoard.map((v,i)=>
    `<button class="xo-cell" onclick="tttMove(${i})">${esc(v)}</button>`
  ).join("");
}

function tttMove(i){
  if(tttBoard[i]||checkTTTWin(tttBoard))return;

  tttBoard[i]=tttTurn;

  if(checkTTTWin(tttBoard)){
    $("tttStatus").textContent=`${tttTurn} wins!`;
    toast(`${tttTurn} wins`);
    renderTTT();
    return;
  }

  if(tttBoard.every(Boolean)){
    $("tttStatus").textContent="Draw";
    renderTTT();
    return;
  }

  tttTurn=tttTurn==="X"?"O":"X";
  $("tttStatus").textContent=`${tttTurn}'s turn`;
  renderTTT();

  if(NEXORA.game.mode==="robot"&&tttTurn==="O"){
    setTimeout(tttRobot,350);
  }
}

function checkTTTWin(b){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];

  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      if(!b[r*5+c])continue;

      for(const [dr,dc] of dirs){
        let count=1;

        for(let k=1;k<4;k++){
          const nr=r+dr*k,nc=c+dc*k;
          if(nr<0||nr>=5||nc<0||nc>=5)break;
          if(b[nr*5+nc]!==b[r*5+c])break;
          count++;
        }

        if(count>=4)return true;
      }
    }
  }

  return false;
}

function tttRobot(){
  if(checkTTTWin(tttBoard))return;

  const empty=tttBoard.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(!empty.length)return;

  const i=empty[Math.floor(Math.random()*empty.length)];
  tttMove(i);
}

/* ---------- FOUR IN A ROW ---------- */

let fourBoard=[];
let fourTurn=1;

function startFour(mode){
  fourBoard=Array.from({length:6},()=>Array(7).fill(0));
  fourTurn=1;
  NEXORA.game={type:"four",mode};

  $("content").innerHTML=`
    <div class="row between">
      <div><h2 style="margin:0">Four in a Row</h2><div id="fourStatus" class="muted">Your turn</div></div>
      <button class="btn" onclick="renderPage('games')">Back</button>
    </div>
    <div class="card game-board" style="margin-top:14px">
      <div id="fourBoard" class="connect-board"></div>
      <button class="btn full" onclick="startFour('${esc(mode)}')">Restart</button>
    </div>
  `;

  renderFour();
}

function renderFour(){
  let html="";

  for(let r=0;r<6;r++){
    for(let c=0;c<7;c++){
      const value=fourBoard[r][c];
      html+=`
        <button class="connect-cell" onclick="fourMove(${c})">
          ${value?`<span class="disc" style="background:${value===1?"#e94f68":"#f2cb4d"}"></span>`:""}
        </button>`;
    }
  }

  $("fourBoard").innerHTML=html;
}

function fourMove(col){
  if(checkFourWinner()||fourBoard[0][col])return;

  for(let r=5;r>=0;r--){
    if(!fourBoard[r][col]){
      fourBoard[r][col]=fourTurn;
      break;
    }
  }

  renderFour();

  if(checkFourWinner()){
    $("fourStatus").textContent=`Player ${fourTurn} wins!`;
    toast(`Player ${fourTurn} wins`);
    return;
  }

  if(fourBoard.flat().every(Boolean)){
    $("fourStatus").textContent="Draw";
    return;
  }

  fourTurn=fourTurn===1?2:1;
  $("fourStatus").textContent=`Player ${fourTurn}'s turn`;

  if(NEXORA.game.mode==="robot"&&fourTurn===2){
    setTimeout(fourRobot,350);
  }
}

function checkFourWinner(){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];

  for(let r=0;r<6;r++){
    for(let c=0;c<7;c++){
      const p=fourBoard[r][c];
      if(!p)continue;

      for(const [dr,dc] of dirs){
        let count=1;

        for(let k=1;k<4;k++){
          const nr=r+dr*k,nc=c+dc*k;
          if(nr<0||nr>=6||nc<0||nc>=7)break;
          if(fourBoard[nr][nc]!==p)break;
          count++;
        }

        if(count>=4)return true;
      }
    }
  }

  return false;
}

function fourRobot(){
  const available=[];
  for(let c=0;c<7;c++){
    if(!fourBoard[0][c])available.push(c);
  }
  if(available.length){
    fourMove(available[Math.floor(Math.random()*available.length)]);
  }
}

<script>
async function openChat(username){
  try{
    const {data:conversationId,error}=await supabaseClient.rpc(
      "nexora_get_or_create_dm",
      {target_username:username}
    );

    if(error)throw error;

    NEXORA.chat={
      conversationId,
      username
    };

    $("content").innerHTML=`
      <div class="row between">
        <div>
          <h2 style="margin:0">${esc(username)}</h2>
          <div class="muted">Chat</div>
        </div>
        <button class="btn" onclick="renderPage('connect')">Back</button>
      </div>

      <div id="messagesBox" class="card" style="height:calc(100dvh - 250px);overflow:auto;margin-top:14px">
        Loading…
      </div>

      <div class="row" style="margin-top:10px">
        <input id="messageInput" style="flex:1;height:50px;border-radius:15px;border:1px solid #252b40;background:#0d1120;color:#fff;padding:0 14px" placeholder="Message…">
        <button class="btn primary" onclick="sendMessage()">Send</button>
        <button class="btn" onclick="startVoiceCall('${esc(username)}')">📞</button>
      </div>
    `;

    await loadMessages(conversationId);
    subscribeChat(conversationId);

    $("messageInput").addEventListener("keydown",e=>{
      if(e.key==="Enter")sendMessage();
    });
  }catch(error){
    toast(error?.message||"Could not open chat.");
  }
}

async function loadMessages(conversationId){
  const box=$("messagesBox");
  if(!box)return;

  const {data,error}=await supabaseClient
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:true})
    .limit(200);

  if(error){
    box.innerHTML=`<div class="muted">Could not load messages.</div>`;
    return;
  }

  box.innerHTML=(data||[]).map(messageHtml).join("")||
    `<div class="muted">No messages yet.</div>`;

  box.scrollTop=box.scrollHeight;
}

function messageHtml(m){
  const mine=m.sender_id===NEXORA.user.id;

  return `
    <div style="display:flex;justify-content:${mine?"flex-end":"flex-start"};margin:8px 0">
      <div style="max-width:78%;padding:10px 13px;border-radius:16px;background:${mine?"#4e5cf0":"#1a2032"}">
        <div>${esc(m.message)}</div>
        <div style="font-size:10px;opacity:.55;margin-top:4px">
          ${new Date(m.created_at).toLocaleTimeString([],{
            hour:"2-digit",minute:"2-digit"
          })}
        </div>
      </div>
    </div>`;
}

async function sendMessage(){
  const input=$("messageInput");
  if(!input||!NEXORA.chat)return;

  const message=input.value.trim();
  if(!message)return;

  input.disabled=true;

  try{
    const {error}=await supabaseClient.from("messages").insert({
      conversation_id:NEXORA.chat.conversationId,
      sender_id:NEXORA.user.id,
      message,
      message_type:"text"
    });

    if(error)throw error;
    input.value="";
  }catch(error){
    toast(error?.message||"Message failed.");
  }finally{
    input.disabled=false;
    input.focus();
  }
}

let nexoraChatChannel=null;

function subscribeChat(conversationId){
  if(nexoraChatChannel){
    try{supabaseClient.removeChannel(nexoraChatChannel)}catch(_){}
  }

  nexoraChatChannel=supabaseClient
    .channel(`chat-${conversationId}`)
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"messages",
      filter:`conversation_id=eq.${conversationId}`
    },payload=>{
      const box=$("messagesBox");
      if(!box)return;

      const empty=box.querySelector(".muted");
      if(empty&&empty.textContent==="No messages yet.")empty.remove();

      box.insertAdjacentHTML("beforeend",messageHtml(payload.new));
      box.scrollTop=box.scrollHeight;
    })
    .subscribe();
}

async function deleteMessageForMe(id){
  toast("Delete for me is not available without a per-user message-delete table.");
}

async function deleteMessageForEveryone(id){
  try{
    const {error}=await supabaseClient
      .from("messages")
      .delete()
      .eq("id",id)
      .eq("sender_id",NEXORA.user.id);

    if(error)throw error;
  }catch(error){
    toast(error?.message||"Could not delete message.");
  }
}

async function updateOnlineStatus(){
  if(!NEXORA.user)return;

  await supabaseClient.from("profiles")
    .update({
      online:true,
      last_seen:new Date().toISOString()
    })
    .eq("id",NEXORA.user.id)
    .catch(()=>{});
}

setInterval(updateOnlineStatus,60000);

$("profileBtn").addEventListener("click",openProfileModal);

window.addEventListener("focus",()=>{
  if(NEXORA.user)updateOnlineStatus();
});

window.addEventListener("online",()=>{
  if(NEXORA.user)updateOnlineStatus();
});

window.addEventListener("error",event=>{
  console.error(event.error||event.message);
});

window.addEventListener("unhandledrejection",event=>{
  console.error(event.reason);
});
