const net=(t,c)=>{const e=$("net");if(!t)return e.classList.remove("show");e.textContent=t;e.style.background=c;e.classList.add("show")};
let NS="ok";setInterval(()=>{if(!S.user)return;const on=navigator.onLine,ok=SIG?.state==="joined";
 if(on&&!ok&&!sigP)ensureSig();const st=!on?"off":ok?"ok":"rec";if(st===NS)return;const was=NS;NS=st;
 if(st==="off")net("📡 No internet connection","#ff4d63");else if(st==="rec")net("🔄 Reconnecting…","#e0a000");else if(was!=="ok"){net("✓ Back online","#1fae6a");setTimeout(()=>NS==="ok"&&net(),2000)}},2000);

function onSig(p){const t=p.type;
 if(t==="offer")return onOffer(p);

 if(t==="gacc"){if(S.pend?.code===p.code)toast("Accepted, starting the game…");return}
 if(t==="gdec"){if(S.pend?.code===p.code){S.pend=null;closeRoom(false);closeModal();toast("Your friend declined the game")}return}
 if(t==="gcan"){if(S.inreq?.code===p.code){S.inreq=null;closeModal();toast("The request was cancelled")}return}
 if(t==="ice"){if(!C||p.id!==C.id){(PRE[p.id]=PRE[p.id]||[]).push(p.c);return}C.pc?.remoteDescription?C.pc.addIceCandidate(p.c).catch(()=>{}):C.q.push(p.c);return}
 if(!C||p.id!==C.id)return;
 if(t==="ring"){C.ringing=true;clearInterval(C.rs2);paintCall()}
 else if(t==="answer"){if(C.st==="calling"){C.st="connecting";clearTimeout(C.to);C.ct=setTimeout(()=>{if(C&&C.st!=="on"){toast("The call could not connect");endCall()}},45000)}paintCall();C.pc.setRemoteDescription(p.sdp).then(()=>flush(C)).catch(()=>{})}
 else if(t==="reoffer")onReoffer(p);
 else if(t==="nudge"){if(C.init)restartIce(C)}
 else if(t==="end"||t==="busy"||t==="decl"){const r=C.random;toast(t==="busy"?"User is busy right now":t==="decl"?"Call declined":"Call ended");endCall(1);if(r)strangerGone()}}

 catch(e){throw new Error(e.name==="NotAllowedError"?"Allow the microphone in your browser settings.":e.name==="NotFoundError"?"No microphone found.":e.name==="NotReadableError"?"The microphone is in use by another app.":"The microphone could not start.")}}

const flush=c=>{while(c.q.length)c.pc.addIceCandidate(c.q.shift()).catch(()=>{})};
const okIce=c=>["connected","completed"].includes(c.pc.iceConnectionState);
function recover(c){if(C!==c||c.rec)return;c.net="reconnecting";paintCall();kick(c);
 c.rec=setInterval(()=>{if(C!==c||okIce(c)){clearInterval(c.rec);c.rec=0;return}kick(c)},5000);
 c.dead=setTimeout(()=>{if(C===c&&!okIce(c)){toast("The call dropped");endCall()}},45000)}

 if(uid===S.user.id)return;if(C)return toast("You are already on a call");

 if(C){stream.getTracks().forEach(t=>t.stop());return}
 const c=C={id:crypto.randomUUID(),uid,name,init:1,st:"calling",stream,q:[],random};paintCall();startRing();
 try{await mkPc(c);await c.pc.setLocalDescription(await c.pc.createOffer())}catch(_){toast("The call could not start");return endCall(1)}
 const m={type:"offer",to:uid,id:c.id,name:myName(),random:!!random,sdp:c.pc.localDescription};

 let n=0;c.rs2=setInterval(()=>{if(C!==c||c.ringing||c.st!=="calling"||++n>10)return clearInterval(c.rs2);sig(m)},2500);

 c.stream=stream;c.st="connecting";paintCall();c.ct=setTimeout(()=>{if(C===c&&c.st!=="on"){toast("The call could not connect");endCall()}},45000);
 try{await mkPc(c);await c.pc.setRemoteDescription(c.sdp);flush(c);await c.pc.setLocalDescription(await c.pc.createAnswer());await sig({type:"answer",to:c.uid,id:c.id,sdp:c.pc.localDescription})}catch(_){toast("The call could not connect");endCall()}}

 $("main").innerHTML=`<section class="pg chat"><div class="ch"><button class="ib" onclick="go('recent')">${I.back}</button><div class="av">${esc(ini(n))}</div><div style="flex:1;min-width:0"><b>${esc(n)}</b><div class="pw" style="text-align:left">@${esc(un)}</div></div><button class="ib" onclick="editNick('${uid}')">✎</button><button class="ib" style="color:#8ff0bd" onclick="callWith('${uid}')">${I.phone}</button><button class="ib" onclick="gameWith('${uid}')">${I.game}</button></div><div class="cb" id="cb"></div><div class="cp"><input id="ci" placeholder="Message" autocomplete="off"><button class="snd" onclick="sendMsg()">${I.send}</button></div></section>`;
 const ch=S.cch=sb.channel("chat-"+cid);
 ch.on("broadcast",{event:"m"},({payload:p})=>{if(S.chat!==c||p.from===S.user.id)return;addMsg({id:p.id,sender_id:p.from,content:p.text,created_at:p.at},false,true);ch.send({type:"broadcast",event:"a",payload:{id:p.id}}).catch(()=>{})})
  .on("broadcast",{event:"a"},({payload:p})=>{const e=document.querySelector(`[data-id="${p.id}"] .tk`);if(e){e.textContent="✓✓";e.style.color="#7fd3ff"}}).subscribe();
 $("ci").addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()});fetchNew(true)}
function addMsg(m,first,live){const b=$("cb");if(!b||!S.chat)return;const txt=m.content??m.body??m.text??"",mine=m.sender_id===S.user.id,t=new Date(m.created_at||Date.now()).getTime();
 if(m.id&&b.querySelector(`[data-id="${m.id}"]`))return;
 if(!live)for(const e of b.children)if(e.dataset.s===m.sender_id&&e.dataset.x===txt&&Math.abs(e.dataset.t-t)<30000)return;
 const d=document.createElement("div");d.className="m "+(mine?"me":"th");d.dataset.id=m.id||"";d.dataset.s=m.sender_id;d.dataset.x=txt;d.dataset.t=t;
 d.innerHTML=`${esc(txt)}<small>${tm(t)}${mine?` <span class="tk">✓</span>`:""}</small>`;b.appendChild(d);b.scrollTop=b.scrollHeight;
 if(!first&&!mine){sfx("recv");vib(15);rec(S.chat.uid,S.chat.un,S.chat.name,txt)}}
async function sendMsg(){const i=$("ci"),c=S.chat;if(!c||!i)return;const text=i.value.trim();if(!text)return;i.value="";const id=crypto.randomUUID(),at=new Date().toISOString();
 addMsg({id,sender_id:S.user.id,content:text,created_at:at},true,true);sfx("send");rec(c.uid,c.un,c.name,text);
 S.cch?.send({type:"broadcast",event:"m",payload:{id,from:S.user.id,text,at}}).catch(()=>{});
 try{await sb.from("messages").insert({conversation_id:c.cid,sender_id:S.user.id,content:text})}catch(_){}}

/* voice call: WebRTC connection */
async function iceServers(){if(ICE_C&&Date.now()-ICE_T<3e5)return ICE_C;let l=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];
 try{const m=CFG.metered;if(m.app&&m.key){const r=await fetch(`https://${m.app}.metered.live/api/v1/turn/credentials?apiKey=${m.key}`);l=l.concat(await r.json())}else l=l.concat(CFG.turn)}catch(_){l=l.concat(CFG.turn)}
 if(CFG.own)l=l.concat(CFG.own);ICE_C=l;ICE_T=Date.now();return l}
async function mkPc(c){const pc=c.pc=new RTCPeerConnection({iceServers:await iceServers(),iceCandidatePoolSize:4});
 c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
 pc.onicecandidate=e=>{if(e.candidate)sig({type:"ice",to:c.uid,id:c.id,c:e.candidate})};
 pc.ontrack=e=>{let a=$("ra");if(!a){a=document.createElement("audio");a.id="ra";a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
 pc.oniceconnectionstatechange=()=>{if(C!==c)return;const s=pc.iceConnectionState;
  if(s==="connected"||s==="completed"){if(c.st!=="on"){c.st="on";c.t0=Date.now();clearTimeout(c.ct);sfx("up");wake(true)}c.net=null;clearInterval(c.rec);c.rec=0;clearTimeout(c.dead);paintCall()}
  else if(s==="disconnected"||s==="failed")recover(c)}}

/* Ludo board + pawn + HUD + 3D dice */
function paintBoard(W){BGc=document.createElement("canvas");BGc.width=BGc.height=Math.round(W*DPR);const g=BGc.getContext("2d"),s=W/15;g.scale(DPR,DPR);
 const wd=g.createLinearGradient(0,0,W,W);wd.addColorStop(0,"#8a5a34");wd.addColorStop(.5,"#6e4526");wd.addColorStop(1,"#85562f");g.fillStyle=wd;g.fillRect(0,0,W,W);
 for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${.03+Math.random()*.04})`;g.fillRect(0,Math.random()*W,W,1+Math.random()*2)}
 const rr=(x,y,w,h,r,f)=>{g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=f;g.fill()};
 Object.entries(YD).forEach(([k,[r,c]])=>{const col=LC[k].c;rr(c*s+2,r*s+2,6*s-4,6*s-4,s*.5,shade(col,-.25));rr(c*s+s*.5,r*s+s*.5,5*s,5*s,s*.4,shade(col,.1));
  BS[k].forEach(([y,x])=>{g.fillStyle="rgba(0,0,0,.35)";g.beginPath();g.arc(x*s,y*s+2,s*.42,0,7);g.fill();g.fillStyle=shade(col,.55);g.beginPath();g.arc(x*s,y*s,s*.4,0,7);g.fill()})});
 const cell=(r,c,f)=>{rr(c*s+1,r*s+1,s-2,s-2,s*.16,f);g.fillStyle="rgba(255,255,255,.25)";g.fillRect(c*s+3,r*s+2,s-6,2)};
 TRK.forEach(([r,c])=>cell(r,c,"#f6efe0"));
 Object.keys(LC).forEach(k=>{LC[k].h.forEach(([r,c])=>cell(r,c,LC[k].c));const[r,c]=TRK[LC[k].s];cell(r,c,LC[k].c)});
 g.fillStyle="rgba(60,40,20,.7)";g.font=`${s*.55}px sans-serif`;g.textAlign="center";g.textBaseline="middle";SAFE.forEach(i=>{const[r,c]=TRK[i];g.fillText("★",(c+.5)*s,(r+.55)*s)});
 const m=7.5*s,tri=(a,b,c2,d,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(a*s,b*s);g.lineTo(c2*s,d*s);g.lineTo(m,m);g.fill()};
 tri(6,6,6,9,LC.red.c);tri(6,6,9,6,LC.green.c);tri(9,6,9,9,LC.yellow.c);tri(6,9,9,9,LC.blue.c)}
function pawn(g,x,y,z,col,s,sc){const r=s*.3*sc,cy=y-z*s-r*.2;g.save();g.fillStyle="rgba(0,0,0,.35)";g.beginPath();g.ellipse(x,y+s*.22,r*(1-z*.3),r*.4,0,0,7);g.fill();
 const gr=g.createRadialGradient(x-r*.3,cy-r*.5,r*.1,x,cy,r*1.2);gr.addColorStop(0,shade(col,.55));gr.addColorStop(.5,col);gr.addColorStop(1,shade(col,-.45));g.fillStyle=gr;
 g.beginPath();g.moveTo(x-r,cy+r*.9);g.quadraticCurveTo(x-r*.9,cy-r*.2,x,cy-r*.2);g.quadraticCurveTo(x+r*.9,cy-r*.2,x+r,cy+r*.9);g.closePath();g.fill();g.beginPath();g.arc(x,cy-r*.55,r*.58,0,7);g.fill();g.restore()}
const ROT={1:"rotateX(0)",2:"rotateY(-90deg)",3:"rotateX(-90deg)",4:"rotateX(90deg)",5:"rotateY(90deg)",6:"rotateY(180deg)"},PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dice3d(){const d=$("ldDice");if(!d)return;d.className="dice d3";
 if(!d.querySelector(".c")){const T=["translateZ(26px)","rotateY(90deg) translateZ(26px)","rotateX(90deg) translateZ(26px)","rotateX(-90deg) translateZ(26px)","rotateY(-90deg) translateZ(26px)","rotateY(180deg) translateZ(26px)"];
  d.innerHTML=`<div class="c">${T.map((t,i)=>`<i class="f" style="transform:${t}">${Array.from({length:9},(_,k)=>`<s${PIP[i+1].includes(k)?' class="p"':""}></s>`).join("")}</i>`).join("")}</div>`}
 const c=d.firstChild;if(L.rolling){c.style.transform="";c.classList.add("tm")}else{c.classList.remove("tm");c.style.transform=ROT[L.dice||L.last||1]}
 d.style.opacity=isH()&&!L.dice&&!L.rolling&&!L.winner?1:.65}
function updL(){if(!L||!$("ldBan"))return;const pl=cur(),ban=$("ldBan");ban.style.setProperty("--tb",LC[pl.color].c);ban.lastElementChild.textContent=L.winner?L.msg:pl.name+"'s turn";
 $("ldM").textContent=L.msg;$("ldH").textContent=isH()&&!L.winner?(L.dice?"Tap a glowing token":"Tap the dice to roll"):"";
 $("ldP").innerHTML=L.players.map((p,i)=>`<div class="lp ${i===L.turn?"on":""}" style="--gc:${LC[p.color].c}"><em></em><div><b>${esc(p.name)}</b><div class="pw" style="text-align:left">${p.tokens.filter(x=>x===FIN).length}/4 home</div></div></div>`).join("");dice3d()}

/* UNO (vs robots; +2/+4 stack; UNO is announced automatically) */
let U=null;const UC=["#ef5368","#3fc984","#ffc93c","#4a9dff","#2b3350"];
function unoMenu(){openModal(`<h3>🃏 UNO</h3><p class="sub">Play against robots.</p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[1,2,3].map(n=>`<button class="btn" onclick="startUno(${n})">🤖 ×${n}</button>`).join("")}</div><p class="pw" style="margin-top:14px">Online UNO is coming in the next update.</p>`)}
function hostUno(){toast("Online UNO is coming next")}function uOpen(){hostUno()}
function mkDeck(){const d=[];for(let c=0;c<4;c++){for(let v=0;v<=9;v++)for(let k=0;k<(v?2:1);k++)d.push({c,v:""+v});["S","R","+2"].forEach(v=>{d.push({c,v});d.push({c,v})})}for(let k=0;k<4;k++){d.push({c:4,v:"W"});d.push({c:4,v:"+4"})}for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function startUno(n){closeModal();minCall(true);S.page="uno";const N=n+1;U={n:N,h:Array.from({length:N},()=>[]),dk:mkDeck(),pl:[],t:0,d:1,col:0,pen:0,pt:null,drew:false,busy:false,over:null,fly:0,msg:"Your turn",names:["You","Robot","Robot 2","Robot 3"]};
 for(let k=0;k<7;k++)U.h.forEach(h=>h.push(U.dk.pop()));let c;do{c=U.dk.pop();if(!/^\d$/.test(c.v))U.dk.unshift(c)}while(!/^\d$/.test(c.v));U.pl.push(c);U.col=c.c;drawU()}
const topU=()=>U.pl[U.pl.length-1],okc=c=>U.pen?c.v===U.pt:(c.c===4||c.c===U.col||c.v===topU().v),nx=(f=1)=>(U.t+U.d*f+U.n*4)%U.n;
function dr(p,k){const h=U.h[p];while(k--){if(!U.dk.length){const t=U.pl.pop();U.dk=U.pl.splice(0).sort(()=>Math.random()-.5);U.pl.push(t);if(!U.dk.length)return}h.push(U.dk.pop())}}
function settle(){const p=U.t;if(U.pen&&!U.h[p].some(okc)){dr(p,U.pen);toast(U.names[p]+" draws "+U.pen);U.pen=0;U.pt=null;U.t=nx(1)}U.drew=false;U.msg=U.t===0?"Your turn":U.names[U.t]+"'s turn"}
function bestCol(h){const n=[0,0,0,0];h.forEach(c=>c.c<4&&n[c.c]++);return n.indexOf(Math.max(...n))}
function pickCol(i){openModal(`<h3>Pick a colour</h3><div class="grid" style="margin-top:12px">${UC.slice(0,4).map((c,k)=>`<button class="btn" style="height:64px;background:${c}" onclick="closeModal();playU(0,${i},${k})"></button>`).join("")}</div>`)}
function playU(p,i,col){if(!U||U.busy||U.over||U.t!==p)return;const h=U.h[p],c=h[i];if(!c||!okc(c))return;
 if(c.c===4&&col===undefined){if(p===0)return pickCol(i);col=bestCol(h)}
 h.splice(i,1);U.pl.push(c);U.col=c.c<4?c.c:col;U.drew=false;U.fly=1;sfx("move");let sk=1;
 if(c.v==="S")sk=2;else if(c.v==="R"){U.d*=-1;if(U.n===2)sk=2}else if(c.v==="+2"||c.v==="+4"){U.pen+=+c.v;U.pt=c.v}
 if(!h.length){U.over=U.names[p];U.msg=U.names[p]+" won! 🏆";if(p===0){incWin("uno");sfx("win");for(let k=0;k<8;k++)setTimeout(()=>floatEmo("🎉"),k*150)}else sfx("lose");return drawU()}
 if(h.length===1){toast("UNO! "+U.names[p]);tone(880,.2)}
 U.t=nx(sk);settle();drawU();nextU()}
function takeU(){if(!U||U.over||U.t!==0||U.busy)return;
 if(U.pen){dr(0,U.pen);U.pen=0;U.pt=null;U.t=nx(1)}else if(U.drew){U.t=nx(1)}else{dr(0,1);const c=U.h[0][U.h[0].length-1];if(okc(c)){U.drew=true;U.msg="Play it, or tap the deck to pass";sfx("tap");return drawU()}U.t=nx(1)}
 settle();drawU();nextU()}
function nextU(){const u=U;if(!u||u.over||u.t===0)return;u.busy=true;setTimeout(()=>{if(U!==u||u.over)return;u.busy=false;const p=u.t,h=u.h[p],ix=[];h.forEach((c,i)=>okc(c)&&ix.push(i));
 if(ix.length){ix.sort((a,b)=>(h[a].c===4)-(h[b].c===4));return playU(p,ix[0])}
 dr(p,1);if(okc(h[h.length-1]))return playU(p,h.length-1);u.t=nx(1);settle();drawU();nextU()},1000)}
function drawU(){if(!U||S.page!=="uno")return;const t=topU(),cd=(c,cls,oc)=>`<button class="uc ${cls}" style="--c:${UC[c.c]}" ${oc||""}><b>${c.v==="S"?"⦸":c.v==="R"?"⇄":c.v==="W"?"★":c.v}</b></button>`,fly=U.fly?" fly":"";U.fly=0;
 $("main").innerHTML=`<section class="pg"><div style="max-width:560px;margin:auto"><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" onclick="go('games')">‹ Games</button><span style="flex:1"></span><button class="btn" onclick="startUno(U.n-1)">↻ Restart</button></div>
 <div id="ldBan" style="--tb:${UC[U.col]}"><i></i><span>${esc(U.msg)}</span></div><div class="card" style="padding:14px;position:relative">
 <div class="grid" style="grid-template-columns:repeat(${U.n-1},1fr)">${U.h.slice(1).map((h,i)=>`<div class="lp ${U.t===i+1?"on":""}" style="--gc:#8e9cff"><em></em><div><b>${U.names[i+1]}</b><div class="pw" style="text-align:left">${h.length} cards</div></div></div>`).join("")}</div>
 <div style="display:flex;justify-content:center;gap:22px;align-items:center;margin:22px 0 10px"><button class="uc back" onclick="takeU()"><b>UNO</b></button>${cd(t,"pile"+fly)}</div>
 <div class="uh">${U.h[0].map((c,i)=>cd(c,U.t===0&&!U.busy&&!U.over&&okc(c)?"ok":"",`onclick="playU(0,${i})"`)).join("")}</div>
 ${U.over?`<div class="wo"><div>🏆<br>${esc(U.over)} won!<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;font-size:15px;min-width:220px"><button class="btn pri" onclick="startUno(U.n-1)">🔁 Play again</button><button class="btn" onclick="go('games')">Games</button></div></div></div>`:""}</div></div></section>`}
