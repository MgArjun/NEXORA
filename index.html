    if (!box) return;

    box.innerHTML = "";

    messages.forEach(
      message => {
        appendMessage(
          message,
          false
        );
      }
    );

    box.scrollTop =
      box.scrollHeight;
  }

  function appendMessage(
    message,
    scroll = true
  ) {
    const box =
      el(
        "nx-chat-messages"
      );

    if (!box) return;

    const mine =
      message.sender_id ===
      NEXORA.user.id;

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "nx-message-row" +
      (mine
        ? " mine"
        : "");

    let content = "";

    if (
      message.message_type ===
      "image"
    ) {
      let url =
        message.message;

      try {
        const parsed =
          JSON.parse(
            message.message
          );

        url =
          parsed.url ||
          parsed.path ||
          url;
      } catch (_) {}

      content = `
        <img
          class="nx-message-image"
          src="${safeText(url)}"
          alt=""
        />
      `;
    } else if (
      message.message_type ===
      "system"
    ) {
      content = `
        <span style="
          opacity:.55
        ">
          ${safeText(
            message.message
          )}
        </span>
      `;
    } else {
      content =
        safeText(
          message.message
        );
    }

    row.innerHTML = `
      <div class="nx-bubble">
        ${content}

        <div class="nx-message-time">
          ${formatMessageTime(
            message.created_at
          )}

          ${
            mine
              ? `
                <button
                  data-delete-message="${
                    safeText(
                      message.id
                    )
                  }"
                  style="
                    margin-left:7px;
                    border:0;
                    background:none;
                    color:rgba(255,255,255,.45);
                    cursor:pointer;
                    font-size:9px;
                  "
                  type="button"
                >
                  Delete
                </button>
              `
              : ""
          }
        </div>
      </div>
    `;

    box.appendChild(
      row
    );

    const deleteBtn =
      row.querySelector(
        "[data-delete-message]"
      );

    if (deleteBtn) {
      deleteBtn.onclick =
        () =>
          deleteMessage(
            message.id
          );
    }

    if (scroll) {
      box.scrollTop =
        box.scrollHeight;
    }
  }

  function formatMessageTime(
    value
  ) {
    if (!value) return "";

    try {
      return new Date(
        value
      ).toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );
    } catch (_) {
      return "";
    }
  }

  async function sendMessage() {
    if (
      !APP.currentConversation
    ) {
      return;
    }

    const input =
      el(
        "nx-chat-input"
      );

    const message =
      input?.value?.trim();

    if (!message) return;

    input.value = "";

    try {
      const { data, error } =
        await NEXORA.supabase
          .from("messages")
          .insert({
            conversation_id:
              APP.currentConversation.id,
            sender_id:
              NEXORA.user.id,
            message,
            message_type:
              "text"
          })
          .select()
          .single();

      if (error) throw error;

      appendMessage(
        data,
        true
      );
    } catch (error) {
      console.error(error);

      appToast(
        "Message could not be sent."
      );
    }
  }

  async function subscribeConversation(
    conversationId
  ) {
    if (
      APP.currentChatChannel
    ) {
      try {
        await NEXORA.supabase
          .removeChannel(
            APP.currentChatChannel
          );
      } catch (_) {}
    }

    APP.currentChatChannel =
      NEXORA.supabase
        .channel(
          "nexora-chat-" +
          conversationId +
          "-" +
          NEXORA.user.id
        )
        .on(
          "postgres_changes",
          {
            event:"INSERT",
            schema:"public",
            table:"messages",
            filter:
              "conversation_id=eq." +
              conversationId
          },
          payload => {
            if (
              payload.new
                ?.sender_id !==
              NEXORA.user.id
            ) {
              appendMessage(
                payload.new,
                true
              );
            }
          }
        )
        .on(
          "postgres_changes",
          {
            event:"DELETE",
            schema:"public",
            table:"messages",
            filter:
              "conversation_id=eq." +
              conversationId
          },
          payload => {
            const item =
              document.querySelector(
                `[data-delete-message="${payload.old?.id}"]`
              );

            item
              ?.closest(
                ".nx-message-row"
              )
              ?.remove();
          }
        )
        .subscribe();
  }

  async function deleteMessage(
    messageId
  ) {
    if (!messageId) return;

    try {
      const { error } =
        await NEXORA.supabase
          .from("messages")
          .delete()
          .eq(
            "id",
            messageId
          )
          .eq(
            "sender_id",
            NEXORA.user.id
          );

      if (error) throw error;
    } catch (error) {
      console.error(error);

      appToast(
        "Message could not be deleted."
      );
    }
  }

  async function uploadChatImage() {
    const input =
      el(
        "nx-photo-input"
      );

    const file =
      input?.files?.[0];

    if (!file) return;

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {
      appToast(
        "Please choose an image."
      );
      return;
    }

    try {
      const bucket =
        "chat-media";

      const path =
        `${NEXORA.user.id}/` +
        `${Date.now()}-` +
        `${Math.random()
          .toString(36)
          .slice(2)}-` +
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

      const { error } =
        await NEXORA.supabase
          .storage
          .from(bucket)
          .upload(
            path,
            file,
            {
              cacheControl:
                "3600",
              upsert:false
            }
          );

      if (error) throw error;

      const {
        data: publicData
      } =
        NEXORA.supabase
          .storage
          .from(bucket)
          .getPublicUrl(
            path
          );

      const url =
        publicData?.publicUrl;

      if (!url) {
        throw new Error(
          "Image URL unavailable."
        );
      }

      const { data, error:msgError } =
        await NEXORA.supabase
          .from("messages")
          .insert({
            conversation_id:
              APP.currentConversation.id,
            sender_id:
              NEXORA.user.id,
            message:
              JSON.stringify({
                url,
                path
              }),
            message_type:
              "image"
          })
          .select()
          .single();

      if (msgError) {
        try {
          await NEXORA.supabase
            .storage
            .from(bucket)
            .remove([
              path
            ]);
        } catch (_) {}

        throw msgError;
      }

      appendMessage(
        data,
        true
      );

      input.value = "";
    } catch (error) {
      console.error(error);

      appToast(
        "Image upload failed. Make sure the chat-media storage bucket exists."
      );
    }
  }

  /*
   * Local robot mode.
   * It intentionally uses the same game engine
   * for the board, while the robot move is local.
   */
  function startLocalRobotGame(
    type
  ) {
    if (
      type ===
      "tic_tac_toe"
    ) {
      startLocalTicRobot();
      return;
    }

    if (
      type ===
      "four_in_row"
    ) {
      startLocalFourRobot();
      return;
    }

    startLocalLudoRobot();
  }

  function startLocalTicRobot() {
    let state =
      initialTicState();

    state.phase =
      "playing";

    const root =
      renderGameShell();

    root.innerHTML = `
      <header class="nx-game-header">
        <button
          class="nx-game-back"
          id="nx-local-back"
          type="button"
        >
          ←
        </button>

        <div class="nx-game-title">
          Tic-Tac-Toe · Robot
        </div>
      </header>

      <main class="nx-game-body">
        <div class="nx-game-layout">
          <div class="nx-board-card">
            <div
              id="nx-local-status"
              class="nx-game-status"
            >
              Your turn
            </div>

            <div
              id="nx-local-board"
              class="nx-tic-board"
            ></div>

            <div class="nx-game-controls">
              <button
                id="nx-local-reset"
                class="nx-game-btn primary"
                type="button"
              >
                Restart
              </button>
            </div>
          </div>
        </div>
      </main>
    `;

    function draw() {
      const board =
        el(
          "nx-local-board"
        );

      const status =
        el(
          "nx-local-status"
        );

      if (!board) return;

      board.innerHTML =
        state.board
          .map(
            (value,index) => `
              <button
                class="nx-tic-cell"
                data-local-tic="${index}"
                type="button"
              >
                ${safeText(value)}
              </button>
            `
          )
          .join("");

      const winner =
        getLocalTicWinner(
          state.board
        );

      if (winner) {
        status.textContent =
          winner === "X"
            ? "You win"
            : "Robot wins";
      } else if (
        state.board.every(Boolean)
      ) {
        status.textContent =
          "Draw";
      } else {
        status.textContent =
          state.currentPlayer ===
          1
            ? "Your turn"
            : "Robot's turn";
      }

      board
        .querySelectorAll(
          "[data-local-tic]"
        )
        .forEach(btn => {
          btn.onclick = () => {
            if (
              state.currentPlayer !==
              1 ||
              state.board[
                Number(
                  btn.dataset
                    .localTic
                )
              ]
            ) {
              return;
            }

            const index =
              Number(
                btn.dataset
                  .localTic
              );

            state.board[
              index
            ] = "X";

            state.currentPlayer =
              2;

            draw();

            if (
              getLocalTicWinner(
                state.board
              ) ||
              state.board.every(
                Boolean
              )
            ) {
              return;
            }

            setTimeout(
              robotMove,
              350
            );
          };
        });
    }

    function robotMove() {
      if (
        state.currentPlayer !==
        2
      ) {
        return;
      }

      const available =
        state.board
          .map(
            (v,i) =>
              v
                ? -1
                : i
          )
          .filter(
            i => i !== -1
          );

      if (!available.length) {
        return;
      }

      const move =
        chooseTicRobotMove(
          state.board
        );

      state.board[
        move
      ] = "O";

      state.currentPlayer =
        1;

      draw();
    }

    el(
      "nx-local-back"
    ).onclick = () =>
      closeGameUI();

    el(
      "nx-local-reset"
    ).onclick = () => {
      state =
        initialTicState();

      draw();
    };

    draw();
  }

  function getLocalTicWinner(
    board
  ) {
    return getTicWinner(
      board
    );
  }

  function chooseTicRobotMove(
    board
  ) {
    const empty =
      board
        .map(
          (v,i) =>
            v
              ? -1
              : i
        )
        .filter(
          i => i >= 0
        );

    for (
      const index of
      empty
    ) {
      const copy =
        [...board];

      copy[index] = "O";

      if (
        getTicWinner(
          copy
        ) === "O"
      ) {
        return index;
      }
    }

    for (
      const index of
      empty
    ) {
      const copy =
        [...board];

      copy[index] = "X";

      if (
        getTicWinner(
          copy
        ) === "X"
      ) {
        return index;
      }
    }

    if (
      empty.includes(12)
    ) {
      return 12;
    }

    return empty[
      Math.floor(
        Math.random() *
        empty.length
      )
    ];
  }

  function startLocalFourRobot() {
    let state =
      initialFourState();

    const root =
      renderGameShell();

    root.innerHTML = `
      <header class="nx-game-header">
        <button
          class="nx-game-back"
          id="nx-local-back"
          type="button"
        >
          ←
        </button>

        <div class="nx-game-title">
          Four in a Row · Robot
        </div>
      </header>

      <main class="nx-game-body">
        <div class="nx-game-layout">
          <div class="nx-board-card">

            <div
              id="nx-four-local-status"
              class="nx-game-status"
            >
              Your turn
            </div>

            <div
              id="nx-four-local-board"
              class="nx-four-board"
            ></div>

            <div class="nx-game-controls">
              <button
                id="nx-four-local-reset"
                class="nx-game-btn primary"
                type="button"
              >
                Restart
              </button>
            </div>

          </div>
        </div>
      </main>
    `;

    function draw() {
      const board =
        el(
          "nx-four-local-board"
        );

      const status =
        el(
          "nx-four-local-status"
        );

      board.innerHTML =
        state.board
          .map(
            (value,index) => `
              <button
                class="nx-four-cell ${
                  value
                    ? value.toLowerCase()
                    : ""
                }"
                data-four-local="${
                  index % 7
                }"
                type="button"
              ></button>
            `
          )
          .join("");

      const winner =
        getFourWinner(
          state.board
        );

      if (winner) {
        status.textContent =
          winner === "X"
            ? "You win"
            : "Robot wins";
        return;
      }

      if (
        state.board.every(Boolean)
      ) {
        status.textContent =
          "Draw";
        return;
      }

      status.textContent =
        state.currentPlayer === 1
          ? "Your turn"
          : "Robot's turn";

      if (
        state.currentPlayer ===
        1
      ) {
        board
          .querySelectorAll(
            "[data-four-local]"
          )
          .forEach(btn => {
            btn.onclick = () => {
              localFourMove(
                Number(
                  btn.dataset
                    .fourLocal
                )
              );
            };
          });
      }
    }

    function localFourMove(
      column
    ) {
      const row =
        dropLocalFour(
          state.board,
          column,
          "X"
        );

      if (row < 0) return;

      state.currentPlayer =
        2;

      draw();

      if (
        getFourWinner(
          state.board
        )
      ) {
        return;
      }

      setTimeout(
        robotMove,
        350
      );
    }

    function robotMove() {
      const available =
        [];

      for (
        let c = 0;
        c < 7;
        c++
      ) {
        const copy =
          [...state.board];

        const row =
          dropLocalFour(
            copy,
            c,
            "O"
          );

        if (row >= 0) {
          if (
            getFourWinner(
              copy
            ) === "O"
          ) {
            available.push({
              c,
              priority:100
            });
          }
        }
      }

      let column;

      if (available.length) {
        column =
          available[0].c;
      } else {
        const legal =
          [];

        for (
          let c=0;
          c<7;
          c++
        ) {
          if (
            state.board[c] === ""
          ) {
            legal.push(c);
          }
        }

        column =
          legal[
            Math.floor(
              Math.random() *
              legal.length
            )
          ];
      }

      dropLocalFour(
        state.board,
        column,
        "O"
      );

      state.currentPlayer =
        1;

      draw();
    }

    el(
      "nx-local-back"
    ).onclick = () =>
      closeGameUI();

    el(
      "nx-four-local-reset"
    ).onclick = () => {
      state =
        initialFourState();

      draw();
    };

    draw();
  }

  function dropLocalFour(
    board,
    column,
    value
  ) {
    for (
      let row=5;
      row>=0;
      row--
    ) {
      const index =
        row * 7 +
        column;

      if (!board[index]) {
        board[index] =
          value;

        return row;
      }
    }

    return -1;
  }

  function startLocalLudoRobot() {
    /*
     * Local Ludo mode uses a full playable
     * classic ruleset and a simple legal robot.
     */

    const players = [
      {
        user_id:
          NEXORA.user.id,
        player_number:1,
        player_color:"red",
        profile:
          NEXORA.profile
      },
      {
        user_id:
          "robot",
        player_number:2,
        player_color:"green",
        profile:{
          display_name:
            "Robot"
        }
      }
    ];

    let state =
      initialLudoState(
        players
      );

    GAME.active = true;
    GAME.roomId =
      "local-ludo-" +
      Date.now();

    GAME.type =
      "ludo";

    GAME.players =
      players;

    GAME.playerNumber =
      1;

    GAME.color =
      "red";

    GAME.state =
      state;

    renderCurrentGame();

    const oldUpdate =
      window.__nexoraLocalLudoUpdate;

    window.__nexoraLocalLudoUpdate =
      true;

    const roll =
      g(
        "nx-ludo-roll"
      );

    if (roll) {
      roll.onclick =
        () => {
          localLudoRoll();
        };
    }

    document
      .querySelectorAll(
        "[data-ludo-index]"
      )
      .forEach(btn => {
        btn.onclick = () => {
          localLudoMove(
            Number(
              btn.dataset
                .ludoIndex
            )
          );
        };
      });

    function localLudoRoll() {
      if (
        state.currentPlayer !==
        1 ||
        state.dice !== null
      ) {
        return;
      }

      state.dice =
        Math.floor(
          Math.random() * 6
        ) + 1;

      state.lastRoll =
        state.dice;

      GAME.state =
        state;

      renderCurrentGame();

      document
        .querySelectorAll(
          "[data-ludo-index]"
        )
        .forEach(btn => {
          btn.onclick = () =>
            localLudoMove(
              Number(
                btn.dataset
                  .ludoIndex
              )
            );
        });

      if (
        getLudoMovableTokens()
          .length === 0
      ) {
        const dice =
          state.dice;

        state.dice = null;

        if (
          dice !== 6
        ) {
          state.currentPlayer =
            2;
        }

        GAME.state =
          state;

        renderCurrentGame();

        if (
          state.currentPlayer ===
          2
        ) {
          setTimeout(
            robotTurn,
            400
          );
        }

        return;
      }

      showLudoMovableTokens();
    }

    function localLudoMove(
      index
    ) {
      if (
        state.currentPlayer !==
        1 ||
        state.dice === null
      ) {
        return;
      }

      const color =
        "red";

      const old =
        state.tokens.red[
          index
        ];

      const dice =
        state.dice;

      if (
        !ludoCanMove(
          color,
          old,
          dice
        )
      ) {
        return;
      }

      let next =
        old === -1
          ? 0
          : old + dice;

      state.tokens.red =
        [...state.tokens.red];

      state.tokens.red[
        index
      ] = next;

      state =
        captureLudoOpponents(
          state,
          "red",
          next
        );

      const win =
        state.tokens.red.every(
          p => p >= 57
        );

      const extra =
        dice === 6;

      state.dice = null;

      if (win) {
        state.winner = 1;
        state.phase =
          "finished";
      } else if (!extra) {
        state.currentPlayer =
          2;
      }

      GAME.state =
        state;

      renderCurrentGame();

      if (
        state.currentPlayer ===
        2 &&
        state.phase ===
        "playing"
      ) {
        setTimeout(
          robotTurn,
          450
        );
      }
    }

    function robotTurn() {
      if (
        state.phase !==
        "playing"
      ) {
        return;
      }

      state.dice =
        Math.floor(
          Math.random() * 6
        ) + 1;

      const movable =
        state.tokens.green
          .map(
            (p,i) =>
              ludoCanMove(
                "green",
                p,
                state.dice
              )
                ? i
                : -1
          )
          .filter(
            i => i >= 0
          );

      if (
        movable.length
      ) {
        const token =
          movable[
            Math.floor(
              Math.random() *
              movable.length
            )
          ];

        const old =
          state.tokens.green[
            token
          ];

        const next =
          old === -1
            ? 0
            : old +
              state.dice;

        state.tokens.green =
          [...state.tokens.green];

        state.tokens.green[
          token
        ] = next;

        state =
          captureLudoOpponents(
            state,
            "green",
            next
          );

        if (
          state.tokens.green.every(
            p => p >= 57
          )
        ) {
          state.winner = 2;
          state.phase =
            "finished";
        }
      }

      const six =
        state.dice === 6;

      state.dice = null;

      if (
        state.phase ===
        "playing" &&
        !six
      ) {
        state.currentPlayer =
          1;
      }

      GAME.state =
        state;

      renderCurrentGame();

      if (
        state.currentPlayer ===
        2 &&
        state.phase ===
        "playing"
      ) {
        setTimeout(
          robotTurn,
          450
        );
      }
    }

    if (
      oldUpdate
    ) {
      /* intentionally retained */
    }
  }

  async function startRandomCommunication(
    type
  ) {
    if (
      !NEXORA.user ||
      !NEXORA.supabase
    ) {
      appToast(
        "Please sign in first."
      );
      return;
    }

    appToast(
      "Looking for available people…"
    );

    const channel =
      NEXORA.supabase.channel(
        "nexora-random-" +
        type,
        {
          config:{
            presence:{
              key:
                NEXORA.user.id
            },
            broadcast:{
              ack:true
            }
          }
        }
      );

    let found = false;

    channel.on(
      "broadcast",
      {
        event:
          "random-connect"
      },
      async ({
        payload
      }) => {
        if (
          payload?.to !==
          NEXORA.user.id
        ) {
          return;
        }

        found = true;

        await NEXORA.supabase
          .removeChannel(
            channel
          );

        const profile =
          await getUserProfile(
            payload.from
          );

        if (!profile) {
          appToast(
            "Match ended."
          );
          return;
        }

        if (
          type ===
          "chat"
        ) {
          await openConversationByUserId(
            profile.id
          );
        } else {
          if (
            window.NEXORA_START_CALL
          ) {
            await window.NEXORA_START_CALL(
              profile.id,
              profile.username,
              profile.display_name
            );
          }
        }
      }
    );

    channel.on(
      "presence",
      {
        event:
          "sync"
      },
      async () => {
        if (found) return;

        const state =
          channel.presenceState();

        const users =
          Object.values(
            state
          )
          .flat()
          .filter(
            user =>
              user.user_id !==
              NEXORA.user.id
          );

        if (!users.length) {
          return;
        }

        const opponent =
          users[0];

        found = true;

        await channel.send({
          type:
            "broadcast",
          event:
            "random-connect",
          payload:{
            from:
              NEXORA.user.id,
            to:
              opponent.user_id
          }
        });

        await NEXORA.supabase
          .removeChannel(
            channel
          );

        const profile =
          await getUserProfile(
            opponent.user_id
          );

        if (!profile) {
          return;
        }

        if (
          type ===
          "chat"
        ) {
          await openConversationByUserId(
            profile.id
          );
        } else {
          if (
            window.NEXORA_START_CALL
          ) {
            await window.NEXORA_START_CALL(
              profile.id,
              profile.username,
              profile.display_name
            );
          }
        }
      }
    );

    channel.subscribe(
      async status => {
        if (
          status ===
          "SUBSCRIBED"
        ) {
          await channel.track({
            user_id:
              NEXORA.user.id,
            created_at:
              Date.now()
          });
        }
      }
    );

    setTimeout(
      async () => {
        if (found) return;

        found = true;

        try {
          await NEXORA.supabase
            .removeChannel(
              channel
            );
        } catch (_) {}

        appToast(
          "No players available."
        );
      },
      20000
    );
  }

  async function loadNotifications() {
    if (!NEXORA.user) return;

    try {
      const { data } =
        await NEXORA.supabase
          .from(
            "notifications"
          )
          .select(
            "*"
          )
          .eq(
            "user_id",
            NEXORA.user.id
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          )
          .limit(50);

      APP.notifications =
        data || [];

      APP.unreadRecent =
        APP.notifications.filter(
          n => !n.is_read
        ).length;

      const dot =
        el(
          "nx-recent-dot"
        );

      if (dot) {
        dot.hidden =
          APP.unreadRecent === 0;
      }
    } catch (error) {
      console.error(error);
    }
  }

  async function markNotificationRead(
    id
  ) {
    try {
      await NEXORA.supabase
        .from(
          "notifications"
        )
        .update({
          is_read:true
        })
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          NEXORA.user.id
        );

      await loadNotifications();

      renderView();
    } catch (_) {}
  }

  async function loadCallHistory() {
    if (!NEXORA.user) return;

    try {
      const { data } =
        await NEXORA.supabase
          .from("calls")
          .select("*")
          .or(
            `caller_id.eq.${NEXORA.user.id},receiver_id.eq.${NEXORA.user.id}`
          )
          .order(
            "created_at",
            {
              ascending:false
            }
          )
          .limit(50);

      APP.calls = [];

      for (
        const call of
        data || []
      ) {
        const otherId =
          call.caller_id ===
          NEXORA.user.id
            ? call.receiver_id
            : call.caller_id;

        const profile =
          await getUserProfile(
            otherId
          );

        APP.calls.push({
          ...call,
          profile
        });
      }
    } catch (error) {
      console.error(error);
    }
  }

  function subscribeAppRealtime() {
    if (
      !NEXORA.supabase ||
      !NEXORA.user
    ) {
      return;
    }

    if (
      NEXORA.finalRealtimeChannel
    ) {
      try {
        NEXORA.supabase
          .removeChannel(
            NEXORA.finalRealtimeChannel
          );
      } catch (_) {}
    }

    NEXORA.finalRealtimeChannel =
      NEXORA.supabase
        .channel(
          "nexora-app-" +
          NEXORA.user.id
        )
        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"notifications",
            filter:
              "user_id=eq." +
              NEXORA.user.id
          },
          async () => {
            await loadNotifications();

            if (
              APP.currentView ===
              "recent"
            ) {
              renderView();
            }
          }
        )
        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"calls",
            filter:
              "receiver_id=eq." +
              NEXORA.user.id
          },
          async () => {
            await loadCallHistory();

            if (
              APP.currentView ===
              "recent"
            ) {
              renderView();
            }
          }
        )
        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"calls",
            filter:
              "caller_id=eq." +
              NEXORA.user.id
          },
          async () => {
            await loadCallHistory();

            if (
              APP.currentView ===
              "recent"
            ) {
              renderView();
            }
          }
        )
        .subscribe();
  }

  function openProfileModal() {
    const profile =
      NEXORA.profile ||
      {};

    const modal =
      document.createElement(
        "div"
      );

    modal.className =
      "nx-modal";

    modal.innerHTML = `
      <div class="nx-modal-card">

        <div class="nx-modal-title">
          Profile
        </div>

        <div class="nx-modal-sub">
          Your NEXORA identity
        </div>

        <div style="
          display:flex;
          align-items:center;
          gap:12px;
          margin-top:18px;
        ">
          <div class="nx-list-avatar"
               style="width:58px;height:58px">
            ${avatarHTML(
              profile,
              "nx-avatar-img"
            )}
          </div>

          <div>
            <strong>
              ${safeText(
                profile.display_name ||
                profile.username ||
                "User"
              )}
            </strong>

            <div style="
              margin-top:3px;
              color:rgba(255,255,255,.42);
              font-size:11px;
            ">
              @${safeText(
                profile.username ||
                ""
              )}
            </div>
          </div>
        </div>

        <div style="
          margin-top:18px;
          display:flex;
          gap:8px;
        ">
          <button
            id="nx-profile-close"
            class="nx-btn"
            style="flex:1"
            type="button"
          >
            Close
          </button>

          <button
            id="nx-profile-signout"
            class="nx-btn danger"
            style="flex:1"
            type="button"
          >
            Sign Out
          </button>
        </div>

      </div>
    `;

    document.body.appendChild(
      modal
    );

    el(
      "nx-profile-close"
    ).onclick = () =>
      modal.remove();

    el(
      "nx-profile-signout"
    ).onclick = async () => {
      try {
        await NEXORA.supabase.auth.signOut();
      } catch (_) {}

      modal.remove();
    };
  }

  async function updateTopProfile() {
    const button =
      el(
        "nx-profile-button"
      );

    if (!button) return;

    const profile =
      NEXORA.profile ||
      {};

    if (
      profile.avatar_url
    ) {
      button.innerHTML = `
        <img
          src="${safeText(
            profile.avatar_url
          )}"
          alt=""
        />
      `;
    } else {
      button.textContent =
        initials(
          profile.display_name ||
          profile.username
        );
    }
  }

  async function initialiseFinalApp() {
    injectFinalStyle();

    if (
      !NEXORA.user
    ) {
      return;
    }

    ensureFinalShell();

    await Promise.all([
      loadConversations(),
      loadFriendsData(),
      loadNotifications(),
      loadCallHistory()
    ]);

    updateTopProfile();

    subscribeAppRealtime();

    renderView();

    /*
     * Keep app data fresh without
     * continuously writing to DB.
     */
    setInterval(
      async () => {
        if (!NEXORA.user) return;

        await Promise.all([
          loadNotifications(),
          loadCallHistory()
        ]);

        if (
          APP.currentView ===
            "recent" &&
          !APP.currentConversation
        ) {
          renderView();
        }
      },
      15000
    );
  }

  /*
   * Hook into the authentication state
   * already created in Part 2.
   */
  let bootAttempts = 0;

  const finalBoot =
    setInterval(
      async () => {
        bootAttempts++;

        if (
          NEXORA.user &&
          NEXORA.supabase
        ) {
          clearInterval(
            finalBoot
          );

          await initialiseFinalApp();
        }

        if (
          bootAttempts >
          120
        ) {
          clearInterval(
            finalBoot
          );
        }
      },
      500
    );

  /*
   * Global keyboard behaviour.
   */
  document.addEventListener(
    "keydown",
    event => {
      if (
        event.key === "Escape"
      ) {
        const modal =
          document.querySelector(
            ".nx-modal"
          );

        if (modal) {
          modal.remove();
        }
      }
    }
  );

  /*
   * If another part of the app changes
   * the profile, refresh the top-right avatar.
   */
  window.NEXORA_REFRESH_UI =
    async function () {
      await loadConversations();
      await loadFriendsData();
      await loadNotifications();
      await loadCallHistory();
      await updateTopProfile();

      if (
        !APP.currentConversation
      ) {
        renderView();
      }
    };

  /*
   * Expose navigation for other modules.
   */
  window.NEXORA_NAVIGATE =
    function(view) {
      navigateView(
        view
      );
    };

})();
</script>
