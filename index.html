<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>NEXORA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#08090c;
  --panel:#101217;
  --panel2:#151820;
  --border:rgba(255,255,255,.09);
  --text:#f5f7fa;
  --muted:#8f96a3;
  --accent:#7c5cff;
  --accent2:#9a84ff;
  --danger:#ff4d67;
  --success:#35d07f;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#app{min-height:100vh}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.topbar{
  position:sticky;top:0;z-index:30;height:68px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--border);
  background:rgba(8,9,12,.86);backdrop-filter:blur(20px)
}
.brand{font-size:21px;font-weight:800;letter-spacing:.12em}
.iconbtn{
  width:42px;height:42px;border-radius:14px;background:var(--panel2);
  color:var(--text);border:1px solid var(--border)
}
.avatar{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#7057ff,#c17aff);font-weight:800;
  overflow:hidden;flex:none
}
.avatar img{width:100%;height:100%;object-fit:cover}
.page{width:min(1100px,100%);margin:auto;padding:24px 18px 110px}
.hero{padding:28px 0 12px}
.hero h1{font-size:clamp(30px,7vw,52px);margin:0 0 8px;letter-spacing:-.04em}
.hero p{color:var(--muted);margin:0}
.live{
  display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  padding:9px 13px;border:1px solid var(--border);border-radius:999px;
  background:var(--panel)
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:linear-gradient(145deg,var(--panel),#0d0f14);
  border:1px solid var(--border);border-radius:22px;padding:20px;
  box-shadow:var(--shadow)
}
.card h3{margin:0 0 7px}
.card p{color:var(--muted);margin:0;font-size:14px}
.action{
  width:100%;padding:13px 16px;border-radius:14px;background:var(--accent);
  color:white;font-weight:700
}
.secondary{background:var(--panel2);border:1px solid var(--border)}
.danger{background:var(--danger)}
.success{background:var(--success);color:#06120b}
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;justify-content:center;gap:4px;padding:10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:rgba(8,9,12,.9);backdrop-filter:blur(22px);
  border-top:1px solid var(--border)
}
.nav button{
  position:relative;background:transparent;color:var(--muted);
  padding:10px 14px;border-radius:14px;min-width:70px
}
.nav button.active{background:var(--panel2);color:white}
.badge{
  position:absolute;top:3px;right:8px;min-width:16px;height:16px;
  padding:0 4px;border-radius:9px;background:var(--danger);
  color:#fff;font-size:10px;display:grid;place-items:center
}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--panel);border:1px solid var(--border);border-radius:18px
}
.rowmain{min-width:0;flex:1}
.rowmain strong{display:block}
.rowmain span{display:block;color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:var(--success)}
.sectiontitle{margin:25px 0 12px;font-size:17px}
.search{
  display:flex;gap:9px;margin:16px 0
}
.search input,.field{
  width:100%;background:var(--panel);border:1px solid var(--border);
  color:white;padding:14px 15px;border-radius:14px;outline:none
}
.search input:focus,.field:focus{border-color:var(--accent)}
.empty{
  padding:38px 18px;text-align:center;color:var(--muted);
  border:1px dashed var(--border);border-radius:18px
}
.back{display:flex;align-items:center;gap:8px;margin-bottom:18px;color:var(--muted);background:none}
.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;
  justify-content:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(10px)
}
.modal.show{display:flex}
.modalbox{
  width:min(480px,100%);max-height:90vh;overflow:auto;
  background:#101217;border:1px solid var(--border);border-radius:26px;
  padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.6)
}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modalhead h2{margin:0}
.close{background:var(--panel2);color:white;width:38px;height:38px;border-radius:12px}
.toast{
  position:fixed;left:50%;bottom:88px;z-index:300;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#191c24;border:1px solid var(--border);padding:12px 17px;
  border-radius:14px;transition:.25s;max-width:90%
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chat{
  display:flex;flex-direction:column;height:calc(100vh - 68px)
}
.chathead{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border)
}
.messages{
  flex:1;overflow:auto;padding:18px 14px;display:flex;
  flex-direction:column;gap:8px
}
.bubble{
  max-width:min(78%,520px);padding:10px 13px;border-radius:17px;
  background:var(--panel2);align-self:flex-start
}
.bubble.mine{align-self:flex-end;background:var(--accent)}
.bubble small{display:block;opacity:.6;font-size:10px;margin-top:4px}
.chatinput{
  display:flex;gap:8px;padding:10px 12px;
  border-top:1px solid var(--border);background:rgba(8,9,12,.95)
}
.chatinput input{flex:1}
.circle{
  width:44px;height:44px;border-radius:14px;background:var(--panel2);
  color:white;border:1px solid var(--border)
}
.call-overlay{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#252039 0,#090a0e 65%);
  padding:20px
}
.call-overlay.show{display:flex}
.callbox{text-align:center;width:min(420px,100%)}
.callavatar{
  width:110px;height:110px;border-radius:50%;margin:0 auto 22px;
  background:linear-gradient(135deg,#6c51ff,#bb75ff);
  display:grid;place-items:center;font-size:38px;font-weight:800;
  box-shadow:0 0 0 12px rgba(124,92,255,.08),0 20px 70px rgba(0,0,0,.5);
  overflow:hidden
}
.callavatar img{width:100%;height:100%;object-fit:cover}
.callname{font-size:27px;font-weight:800}
.callstate{color:var(--muted);margin-top:8px}
.calltimer{font-size:20px;margin-top:12px;font-variant-numeric:tabular-nums}
.callcontrols{display:flex;justify-content:center;gap:14px;margin-top:45px}
.callcontrol{
  width:58px;height:58px;border-radius:50%;background:#20232c;
  color:white;border:1px solid var(--border);font-size:20px
}
.callcontrol.active{background:white;color:#111}
.callcontrol.end{background:var(--danger);transform:rotate(135deg)}
.incoming-actions{display:flex;justify-content:center;gap:30px;margin-top:40px}
.incoming-actions button{width:64px;height:64px;border-radius:50%;color:white;font-size:23px}
.accept{background:var(--success);color:#07150d!important}
.decline{background:var(--danger)}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.game-card{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}
.game-icon{font-size:34px}
.boardwrap{display:flex;justify-content:center;margin-top:20px}
.ludo{
  width:min(92vw,520px);aspect-ratio:1;
  display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);
  background:#f4f4f4;border:4px solid #24262c;border-radius:8px;overflow:hidden
}
.lcell{border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;position:relative}
.red{background:#ff596b}.green{background:#48d99a}.yellow{background:#ffd84d}.blue{background:#5b8cff}
.track{background:#fff}
.safe:after{content:"★";font-size:10px;color:#444}
.token{
  width:70%;height:70%;border-radius:50%;border:2px solid rgba(0,0,0,.35);
  box-shadow:0 2px 4px rgba(0,0,0,.3)
}
.ludo-center{background:conic-gradient(#ff596b 0 25%,#ffd84d 25% 50%,#48d99a 50% 75%,#5b8cff 75% 100%)}
.dice{
  width:65px;height:65px;border-radius:15px;background:#fff;color:#111;
  display:grid;place-items:center;font-size:30px;font-weight:900;
  margin:15px auto;border:3px solid #ddd
}
.gamebar{display:flex;align-items:center;justify-content:space-between;margin-top:15px}
.profilebox{text-align:center;padding:20px}
.auth{
  min-height:100vh;display:grid;place-items:center;padding:20px
}
.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:25px}
.authbox h1{margin-top:0}
.form{display:flex;flex-direction:column;gap:11px}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<div id="callOverlay" class="call-overlay">
  <div class="callbox">
    <div id="callAvatar" class="callavatar">N</div>
    <div id="callName" class="callname">NEXORA</div>
    <div id="callState" class="callstate">Calling…</div>
    <div id="callTimer" class="calltimer">00:00</div>

    <div id="incomingActions" class="incoming-actions hidden">
      <button class="decline" id="declineIncoming">✕</button>
      <button class="accept" id="acceptIncoming">✓</button>
    </div>

    <div id="activeCallControls" class="callcontrols hidden">
      <button class="callcontrol" id="muteCall">🎙</button>
      <button class="callcontrol" id="speakerCall">🔊</button>
      <button class="callcontrol end" id="endCall">📞</button>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2 id="modalTitle"></h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================================================
   NEXORA
   Single-file frontend
   ========================================================= */

const SUPABASE_URL = "https://ktwluvpmzisonmootdqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  user:null,
  profile:null,
  page:"home",
  chat:null,
  messages:[],
  conversations:[],
  friends:[],
  requests:[],
  notifications:[],
  realtime:[],
  call:null,
  callChannel:null,
  signalChannel:null,
  peer:null,
  localStream:null,
  remoteStream:null,
  remoteAudio:null,
  callTimer:null,
  callStartedAt:null,
  callMuted:false,
  speaker:false,
  ringtone:null,
  ringtoneTimer:null,
  game:null,
  ludo:null
};

const $ = id => document.getElementById(id);

function toast(message){
  $("toast").textContent=message;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>$("toast").classList.remove("show"),2800);
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  const s=(name||"N").trim().split(/\s+/);
  return ((s[0]?.[0]||"N")+(s[1]?.[0]||"")).toUpperCase();
}

function avatarHTML(profile,size="42"){
  if(profile?.avatar_url){
    return `<div class="avatar" style="width:${size}px;height:${size}px"><img src="${esc(profile.avatar_url)}"></div>`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px">${esc(initials(profile?.display_name||profile?.username))}</div>`;
}

function timeAgo(date){
  if(!date)return "";
  const sec=Math.floor((Date.now()-new Date(date).getTime())/1000);
  if(sec<60)return "now";
  if(sec<3600)return Math.floor(sec/60)+"m";
  if(sec<86400)return Math.floor(sec/3600)+"h";
  return Math.floor(sec/86400)+"d";
}

function formatTime(date){
  if(!date)return "";
  return new Date(date).toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
}

function formatDuration(seconds){
  seconds=Math.max(0,Math.floor(seconds||0));
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;
  return h
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

async function safe(fn){
  try{
    return await fn();
  }catch(e){
    console.error(e);
    toast(e?.message||"Something went wrong");
    return null;
  }
}

/* =========================================================
   AUTH
   ========================================================= */

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(session?.user){
    await loadUser(session.user);
  }else{
    renderAuth();
  }

  db.auth.onAuthStateChange(async(_event,session)=>{
    if(session?.user){
      await loadUser(session.user);
    }else{
      state.user=null;
      state.profile=null;
      cleanupCall();
      renderAuth();
    }
  });
}

async function loadUser(user){
  state.user=user;

  let {data:profile,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  if(!profile){
    const username="user_"+user.id.replaceAll("-","").slice(0,12);
    const {data:newProfile}=await db
      .from("profiles")
      .insert({
        id:user.id,
        username,
        display_name:user.email?.split("@")[0]||"NEXORA User",
        is_guest:user.is_anonymous||false,
        online:true,
        last_seen:new Date().toISOString()
      })
      .select()
      .single();

    profile=newProfile;
  }

  state.profile=profile;
  await setPresence(true);
  await loadNotifications();
  await subscribeGlobal();
  renderApp();
}

async function setPresence(online){
  if(!state.user)return;
  await db.from("profiles").update({
    online,
    last_seen:new Date().toISOString()
  }).eq("id",state.user.id);
}

window.addEventListener("beforeunload",()=>{
  if(state.user){
    db.from("profiles").update({
      online:false,
      last_seen:new Date().toISOString()
    }).eq("id",state.user.id);
  }
});

function renderAuth(){
  $("app").innerHTML=`
    <div class="auth">
      <div class="authbox">
        <div class="brand">NEXORA</div>
        <h1>Welcome back.</h1>
        <p class="small">Connect, chat and play.</p>

        <div class="form" style="margin-top:22px">
          <input id="email" class="field" type="email" placeholder="Email">
          <input id="password" class="field" type="password" placeholder="Password">
          <button class="action" onclick="signIn()">Sign in</button>
          <button class="action secondary" onclick="signUp()">Create account</button>
          <button class="action secondary" onclick="guestLogin()">Continue as guest</button>
        </div>
      </div>
    </div>
  `;
}

async function signIn(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return toast("Enter email and password");

  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)toast(error.message);
}

async function signUp(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return toast("Enter email and password");

  const {error}=await db.auth.signUp({email,password});
  if(error)toast(error.message);
  else toast("Account created");
}

async function guestLogin(){
  const {error}=await db.auth.signInAnonymously();
  if(error)toast(error.message);
}

/* =========================================================
   GLOBAL REALTIME
   ========================================================= */

async function subscribeGlobal(){
  state.realtime.forEach(c=>db.removeChannel(c));
  state.realtime=[];

  if(!state.user)return;

  const callsChannel=db.channel("nexora-calls-"+state.user.id);

  callsChannel
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"calls",
      filter:`receiver_id=eq.${state.user.id}`
    },payload=>{
      handleIncomingCallChange(payload);
    })
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"calls",
      filter:`caller_id=eq.${state.user.id}`
    },payload=>{
      handleOutgoingCallChange(payload);
    })
    .subscribe();

  state.realtime.push(callsChannel);

  const notificationChannel=db.channel("nexora-notifications-"+state.user.id);

  notificationChannel
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"notifications",
      filter:`user_id=eq.${state.user.id}`
    },payload=>{
      state.notifications.unshift(payload.new);
      updateNavBadges();
      toast(payload.new.title||"New notification");
    })
    .subscribe();

  state.realtime.push(notificationChannel);

  const presence=db.channel("nexora-presence",{
    config:{presence:{key:state.user.id}}
  });

  presence.on("presence",{
    event:"sync"
  },()=>{
    updateLiveCount(presence);
  });

  await presence.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      await presence.track({
        user_id:state.user.id,
        online:true
      });
      updateLiveCount(presence);
    }
  });

  state.realtime.push(presence);
}

function updateLiveCount(channel){
  const count=Object.keys(channel.presenceState()).length;
  const el=$("liveCount");
  if(el)el.textContent=`${count} people live`;
}

/* =========================================================
   APP SHELL
   ========================================================= */

function renderApp(){
  if(!state.user)return renderAuth();

  $("app").innerHTML=`
    <div id="homeScreen" class="screen"></div>
    <div id="recentScreen" class="screen"></div>
    <div id="connectScreen" class="screen"></div>
    <div id="gamesScreen" class="screen"></div>
    <div id="chatScreen" class="screen"></div>

    <nav class="nav">
      <button id="navHome" onclick="navigate('home')">⌂<br><small>Home</small></button>
      <button id="navRecent" onclick="navigate('recent')">
        ◴<span id="recentBadge" class="badge hidden">0</span><br><small>Recent</small>
      </button>
      <button id="navConnect" onclick="navigate('connect')">＋<br><small>Connect</small></button>
      <button id="navGames" onclick="navigate('games')">◈<br><small>Games</small></button>
    </nav>
  `;

  navigate(state.page||"home");
}

function navigate(page){
  state.page=page;

  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));

  const screen=$(page+"Screen");
  if(screen)screen.classList.add("active");

  const nav=$("nav"+page[0].toUpperCase()+page.slice(1));
  if(nav)nav.classList.add("active");

  if(page==="home")renderHome();
  if(page==="recent")renderRecent();
  if(page==="connect")renderConnect();
  if(page==="games")renderGames();

  updateNavBadges();
}

function updateNavBadges(){
  const unread=state.notifications.filter(x=>!x.is_read).length;
  $("recentBadge")?.classList.toggle("hidden",unread===0);
  if($("recentBadge"))$("recentBadge").textContent=unread>99?"99+":unread;
}

/* =========================================================
   HOME
   ========================================================= */

async function renderHome(){
  const el=$("homeScreen");
  if(!el)return;

  el.innerHTML=`
    <header class="topbar">
      <div class="brand">NEXORA</div>
      <button class="iconbtn" onclick="openProfile()">◉</button>
    </header>

    <main class="page">
      <section class="hero">
        <h1>Welcome, ${esc(state.profile?.display_name||"there")}.</h1>
        <p>Your space to connect, talk and play.</p>
        <div class="live"><span class="dot"></span><span id="liveCount">People live</span></div>
      </section>

      <h3 class="sectiontitle">Quick access</h3>

      <div class="grid">
        <button class="card" onclick="navigate('recent')">
          <h3>Recent</h3><p>Chats, calls & notifications</p>
        </button>
        <button class="card" onclick="navigate('connect')">
          <h3>Connect</h3><p>Find people and friends</p>
        </button>
        <button class="card" onclick="navigate('games')">
          <h3>Games</h3><p>Play with friends or robot</p>
        </button>
      </div>

      <h3 class="sectiontitle">Activity</h3>
      <div id="homeActivity" class="list">
        <div class="empty">Loading activity…</div>
      </div>
    </main>
  `;

  await loadConversations();
  await loadCalls();
  renderHomeActivity();
}

function renderHomeActivity(){
  const el=$("homeActivity");
  if(!el)return;

  const items=[
    ...state.conversations.slice(0,3).map(x=>({
      text:x.last_message||"Start a conversation",
      sub:x.other_display_name||x.other_username
    })),
    ...state.notifications.slice(0,3).map(x=>({
      text:x.title,

/* =========================================================
   CALL SYSTEM
   ========================================================= */

async function startCallByUsername(username){
  const result=await safe(async()=>{
    return await db.rpc("nexora_start_call",{
      target_username:username,
      call_kind:"voice"
    });
  });

  if(!result)return;

  const call=result.data;

  const {data:receiver}=await db.from("profiles")
    .select("*")
    .eq("username",username)
    .maybeSingle();

  state.call={
    id:call.call_id,
    direction:"outgoing",
    remoteId:receiver?.id,
    remoteProfile:receiver,
    status:"ringing"
  };

  showCallUI("outgoing");
  await prepareSignalChannel();
  startRingtone(false);

  /* caller waits for accepted state */
  await waitForCallAccepted();
}

async function waitForCallAccepted(){
  if(!state.call)return;

  const channel=db.channel("nexora-call-state-"+state.call.id);

  channel.on("postgres_changes",{
    event:"UPDATE",
    schema:"public",
    table:"calls",
    filter:`id=eq.${state.call.id}`
  },async payload=>{
    const c=payload.new;

    if(c.status==="accepted"){
      stopRingtone();
      state.call.status="accepted";
      showCallUI("active");

      if(state.call.direction==="outgoing"){
        await createOffer();
      }
    }

    if(["declined","cancelled","missed","ended"].includes(c.status)){
      cleanupCall();
    }
  }).subscribe();

  state.callStateChannel=channel;
}

async function prepareSignalChannel(){
  if(!state.user||!state.call)return;

  if(state.signalChannel){
    await db.removeChannel(state.signalChannel);
  }

  const channel=db.channel("nexora-signal-"+state.user.id,{
    config:{
      broadcast:{ack:true}
    }
  });

  channel
    .on("broadcast",{event:"call-offer"},async({payload})=>{
      if(!state.call||payload.callId!==state.call.id)return;

      await ensurePeer();

      const desc=new RTCSessionDescription(payload.offer);
      await state.peer.setRemoteDescription(desc);

      const answer=await state.peer.createAnswer();
      await state.peer.setLocalDescription(answer);

      await channel.send({
        type:"broadcast",
        event:"call-answer",
        payload:{
          callId:state.call.id,
          answer:{
            type:answer.type,
            sdp:answer.sdp
          },
          to:state.call.remoteId
        }
      });
    })

    .on("broadcast",{event:"call-answer"},async({payload})=>{
      if(!state.call||payload.callId!==state.call.id)return;
      if(!state.peer)return;

      await state.peer.setRemoteDescription(
        new RTCSessionDescription(payload.answer)
      );
    })

    .on("broadcast",{event:"call-ice"},async({payload})=>{
      if(!state.call||payload.callId!==state.call.id)return;
      if(!state.peer)return;

      try{
        await state.peer.addIceCandidate(
          new RTCIceCandidate(payload.candidate)
        );
      }catch(e){
        console.warn("ICE",e);
      }
    })

    .subscribe();

  state.signalChannel=channel;
}

async function ensurePeer(){
  if(state.peer)return state.peer;

  state.peer=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });

  state.peer.onicecandidate=async e=>{
    if(!e.candidate||!state.signalChannel||!state.call)return;

    await state.signalChannel.send({
      type:"broadcast",
      event:"call-ice",
      payload:{
        callId:state.call.id,
        candidate:e.candidate,
        to:state.call.remoteId
      }
    });
  };

  state.peer.ontrack=e=>{
    if(!state.remoteAudio){
      state.remoteAudio=document.createElement("audio");
      state.remoteAudio.autoplay=true;
      state.remoteAudio.playsInline=true;
      document.body.appendChild(state.remoteAudio);
    }

    state.remoteStream=e.streams[0];
    state.remoteAudio.srcObject=state.remoteStream;
    state.remoteAudio.volume=state.speaker?1:1;

    state.remoteAudio.play().catch(()=>{});
  };

  state.peer.onconnectionstatechange=()=>{
    const status=state.peer?.connectionState;

    if(status==="connected"){
      if(state.call?.status==="accepted"){
        startCallTimer();
        $("callState").textContent="Connected";
      }
    }

    if(["failed","disconnected","closed"].includes(status)){
      if(state.call?.status==="accepted"){
        $("callState").textContent="Connection lost";
      }
    }
  };

  return state.peer;
}

async function prepareMicrophone(){
  if(state.localStream)return state.localStream;

  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error("Microphone is not available. Use HTTPS.");
  }

  state.localStream=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true,
      channelCount:1
    },
    video:false
  });

  return state.localStream;
}

async function createOffer(){
  if(!state.call)return;

  try{
    const stream=await prepareMicrophone();
    await ensurePeer();

    stream.getTracks().forEach(track=>{
      if(!state.peer.getSenders().some(s=>s.track===track)){
        state.peer.addTrack(track,stream);
      }
    });

    const offer=await state.peer.createOffer({
      offerToReceiveAudio:true
    });

    await state.peer.setLocalDescription(offer);

    await state.signalChannel.send({
      type:"broadcast",
      event:"call-offer",
      payload:{
        callId:state.call.id,
        offer:{
          type:offer.type,
          sdp:offer.sdp
        },
        to:state.call.remoteId
      }
    });
  }catch(e){
    console.error(e);
    toast("Microphone permission is required");
    await endCall("cancelled");
  }
}

async function handleIncomingCallChange(payload){
  const c=payload.new;

  if(payload.event==="INSERT"&&c.status==="ringing"){
    if(c.receiver_id!==state.user.id)return;

    /* avoid showing a second call */
    if(state.call)return;

    const {data:caller}=await db.from("profiles")
      .select("*")
      .eq("id",c.caller_id)
      .maybeSingle();

    state.call={
      id:c.id,
      direction:"incoming",
      remoteId:c.caller_id,
      remoteProfile:caller,
      status:"ringing"
    };

    showCallUI("incoming");
    startRingtone(true);
    await prepareSignalChannel();
  }

  if(state.call?.id===c.id){
    if(c.status==="accepted"){
      stopRingtone();
      state.call.status="accepted";

      if(state.call.direction==="incoming"){
        await prepareMicrophone();
        await ensurePeer();
        showCallUI("active");
      }
    }

    if(["declined","cancelled","missed","ended"].includes(c.status)){
      cleanupCall();
    }
  }
}

function handleOutgoingCallChange(payload){
  const c=payload.new;

  if(!state.call||state.call.id!==c.id)return;

  if(c.status==="accepted"){
    stopRingtone();
    state.call.status="accepted";
    showCallUI("active");
  }

  if(["declined","cancelled","missed","ended"].includes(c.status)){
    cleanupCall();
  }
}

async function acceptIncoming(){
  if(!state.call)return;

  stopRingtone();

  state.call.status="accepted";

  const {error}=await db.from("calls").update({
    status:"accepted",
    started_at:new Date().toISOString()
  }).eq("id",state.call.id);

  if(error){
    toast(error.message);
    cleanupCall();
    return;
  }

  try{
    await prepareMicrophone();
    await ensurePeer();
    showCallUI("active");
  }catch(e){
    toast("Microphone permission denied");
    await endCall("ended");
  }
}

async function declineIncoming(){
  if(!state.call)return;

  stopRingtone();

  await db.from("calls").update({
    status:"declined",
    ended_at:new Date().toISOString()
  }).eq("id",state.call.id);

  cleanupCall();
}

async function endCall(status="ended"){
  const call=state.call;
  if(!call)return;

  stopRingtone();

  if(call.id){
    await db.from("calls").update({
      status,
      ended_at:new Date().toISOString()
    }).eq("id",call.id);
  }

  cleanupCall();
}

async function toggleMute(){
  if(!state.localStream)return;

  state.callMuted=!state.callMuted;

  state.localStream.getAudioTracks().forEach(t=>{
    t.enabled=!state.callMuted;
  });

  $("muteCall")?.classList.toggle("active",state.callMuted);
}

function toggleSpeaker(){
  state.speaker=!state.speaker;

  if(state.remoteAudio){
    state.remoteAudio.volume=state.speaker?1:1;
    state.remoteAudio.setAttribute("data-speaker",state.speaker?"on":"off");
  }

  $("speakerCall")?.classList.toggle("active",state.speaker);
}

function showCallUI(mode){
  const call=state.call;
  if(!call)return;

  const profile=call.remoteProfile;

  $("callName").textContent=profile?.display_name||profile?.username||"NEXORA";

  if(profile?.avatar_url){
    $("callAvatar").innerHTML=`<img src="${esc(profile.avatar_url)}">`;
  }else{
    $("callAvatar").textContent=initials(profile?.display_name||profile?.username);
  }

  $("callOverlay").classList.add("show");

  $("incomingActions").classList.toggle("hidden",mode!=="incoming");
  $("activeCallControls").classList.toggle("hidden",mode!=="active");

  if(mode==="incoming"){
    $("callState").textContent="Incoming voice call";
    $("callTimer").textContent="";
  }

  if(mode==="outgoing"){
    $("callState").textContent="Calling…";
    $("callTimer").textContent="Ringing";
  }

  if(mode==="active"){
    $("callState").textContent="Connecting…";
    startCallTimer();
  }
}

function startCallTimer(){
  if(state.callTimer)return;

  if(!state.callStartedAt){
    state.callStartedAt=Date.now();
  }

  state.callTimer=setInterval(()=>{
    if(!state.callStartedAt)return;
    $("callTimer").textContent=formatDuration(
      (Date.now()-state.callStartedAt)/1000
    );
  },1000);
}

function startRingtone(incoming){
  stopRingtone();

  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)return;

    const ctx=new AudioContext();
    state.ringtone=ctx;

    const playTone=()=>{
      if(!state.ringtone)return;

      const osc=ctx.createOscillator();
      const gain=ctx.createGain();

      osc.type="sine";
      osc.frequency.value=incoming?660:520;
      gain.gain.value=.035;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime+.35);
    };

    playTone();
    state.ringtoneTimer=setInterval(playTone,1200);
  }catch(e){
    console.warn("ringtone unavailable",e);
  }
}

function stopRingtone(){
  clearInterval(state.ringtoneTimer);
  state.ringtoneTimer=null;

  try{
    state.ringtone?.close();
  }catch(e){}

  state.ringtone=null;
}

function cleanupCall(){
  stopRingtone();

  clearInterval(state.callTimer);
  state.callTimer=null;

  if(state.localStream){
    state.localStream.getTracks().forEach(t=>t.stop());
    state.localStream=null;
  }

  if(state.peer){
    state.peer.ontrack=null;
    state.peer.onicecandidate=null;
    state.peer.close();
    state.peer=null;
  }

  if(state.remoteAudio){
    state.remoteAudio.srcObject=null;
    state.remoteAudio.remove();
    state.remoteAudio=null;
  }

  if(state.callStateChannel){
    db.removeChannel(state.callStateChannel);
    state.callStateChannel=null;
  }

  if(state.signalChannel){
    db.removeChannel(state.signalChannel);
    state.signalChannel=null;
  }

  state.call=null;
  state.callStartedAt=null;
  state.callMuted=false;
  state.speaker=false;

  $("callOverlay")?.classList.remove("show");
}

/* =========================================================
   RANDOM CONNECTION
   ========================================================= */

async function randomConnect(type){
  toast("Searching for someone…");

  const channel=db.channel(
    "nexora-random-"+type,
    {config:{presence:{key:state.user.id}}}
  );

  await channel.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      await channel.track({
        id:state.user.id,
        username:state.profile.username,
        display_name:state.profile.display_name,
        type
      });

      setTimeout(async()=>{
        const presence=channel.presenceState();
        const users=[];

        Object.values(presence).forEach(arr=>{
          arr.forEach(x=>{
            if(x.id!==state.user.id&&x.type===type)users.push(x);
          });
        });

        if(!users.length){
          toast("Still waiting…");
          return;
        }

        const target=users.sort((a,b)=>
          String(a.id).localeCompare(String(b.id))
        )[0];

        if(state.user.id>target.id)return;

        if(type==="chat"){
          const {data:p}=await db.from("profiles")
            .select("*")
            .eq("id",target.id)
            .maybeSingle();

          const {data:conversationId}=await db.rpc(
            "nexora_get_or_create_dm",
            {target_username:p.username}
          );

          db.removeChannel(channel);

          openChat({
            conversation_id:conversationId,
            other_id:p.id,
            other_username:p.username,
            other_display_name:p.display_name,
            other_online:true
          });
        }
      },1800);
    }
  });

  setTimeout(()=>{
    db.removeChannel(channel);
  },30000);
}

/* =========================================================
   TIC TAC TOE
   ========================================================= */

function startTic(mode){
  state.game={
    type:"tic",
    mode,
    board:Array(9).fill(""),
    turn:"X",
    over:false
  };

  renderGamePage("Tic-Tac-Toe",`
    <div id="ticBoard" style="
      display:grid;
      grid-template-columns:repeat(3,1fr);
      width:min(90vw,420px);
      margin:25px auto;
      gap:8px
    "></div>

    <div id="ticStatus" style="text-align:center;color:var(--muted)"></div>

    <button class="action secondary" style="margin-top:18px" onclick="startTic('${mode}')">
      Restart
    </button>
  `);

  renderTic();
}

function renderTic(){
  const b=$("ticBoard");
  if(!b)return;

  b.innerHTML=state.game.board.map((v,i)=>`
    <button onclick="ticMove(${i})" style="
      aspect-ratio:1;
      border-radius:18px;
      background:var(--panel);
      color:white;
      border:1px solid var(--border);
      font-size:clamp(40px,12vw,75px);
      font-weight:800
    ">${v}</button>
  `).join("");

  $("ticStatus").textContent=state.game.over
    ?"Game over"
    :`${state.game.turn}'s turn`;
}

function ticMove(i){
  const g=state.game;
  if(!g||g.over||g.board[i])return;

  g.board[i]=g.turn;

  const result=ticResult(g.board);

  if(result){
    g.over=true;
    renderTic();
    toast(result==="draw"?"Draw":result+" wins");
    return;
  }

  g.turn=g.turn==="X"?"O":"X";
  renderTic();

  if(g.mode==="robot"&&g.turn==="O"){
    setTimeout(ticRobot,300);
  }
}

function ticResult(b){
  const wins=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  for(const w of wins){
    if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])
      return b[w[0]];
  }

  return b.every(Boolean)?"draw":null;
}

function ticRobot(){
  const g=state.game;
  if(!g||g.over)return;

  const available=g.board.map((v,i)=>v?null:i).filter(x=>x!==null);
  if(!available.length)return;

  /* win */
  for(const i of available){
    const copy=[...g.board];
    copy[i]="O";
    if(ticResult(copy)==="O"){
      g.board[i]="O";
      g.turn="X";
      renderTic();
      return;
    }
  }

  /* block */
  for(const i of available){
    const copy=[...g.board];
    copy[i]="X";
    if(ticResult(copy)==="X"){
      g.board[i]="O";
      g.turn="X";
      renderTic();
      return;
    }
  }

  const preferred=[4,0,2,6,8,1,3,5,7];
  const i=preferred.find(x=>available.includes(x));

  g.board[i]="O";
  g.turn="X";
  renderTic();
}

function startConnect4(mode){
  state.game={
    type:"connect4",
    mode,
    board:Array.from({length:42},()=>null),
    turn:"R",
    over:false
  };

  renderGamePage("Four in a Row",`
    <div id="c4Board" style="
      display:grid;
      grid-template-columns:repeat(7,1fr);
      width:min(96vw,560px);
      margin:20px auto;

      border-radius:18px
    "></div>

    <button class="action secondary" style="margin-top:18px" onclick="startConnect4('${mode}')">
      Restart
    </button>
  `);

  renderConnect4();
}

function renderConnect4(){
  const b=$("c4Board");
  if(!b)return;

  b.innerHTML=state.game.board.map((v,i)=>`
    <button onclick="c4Move(${i%7})" style="
      aspect-ratio:1;
      border-radius:50%;
      background:${v==="R"?"#ff5369":v==="Y"?"#ffd34d":"#10131a"};
      border:0;
      box-shadow:inset 0 2px 6px rgba(0,0,0,.35)
    "></button>
  `).join("");

  $("c4Status").textContent=state.game.over
    ?"Game over"
    :`${state.game.turn==="R"?"Red":"Yellow"}'s turn`;
}

function c4Move(col){
  const g=state.game;
  if(!g||g.over)return;

  let row=-1;

  for(let r=5;r>=0;r--){
    const i=r*7+col;
    if(!g.board[i]){
      row=r;
      break;
    }
  }

  if(row<0)return;

  g.board[row*7+col]=g.turn;

  if(c4Win(g.board,row,col,g.turn)){
    g.over=true;
    renderConnect4();
    toast(g.turn==="R"?"Red wins":"Yellow wins");
    return;
  }

  if(g.board.every(Boolean)){
    g.over=true;
    renderConnect4();
    toast("Draw");
    return;
  }

  g.turn=g.turn==="R"?"Y":"R";
  renderConnect4();

  if(g.mode==="robot"&&g.turn==="Y"){
    setTimeout(c4Robot,300);
  }
}

function c4Win(b,r,c,p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];

  for(const [dr,dc] of dirs){
    let n=1;

    for(const sign of [-1,1]){
      let rr=r+dr*sign;
      let cc=c+dc*sign;

      while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr*7+cc]===p){
        n++;
        rr+=dr*sign;
        cc+=dc*sign;
      }
    }

    if(n>=4)return true;
  }

  return false;
}

function c4Robot(){
  const g=state.game;
  if(!g||g.over)return;

  const cols=[3,2,4,1,5,0,6];
  const possible=cols.filter(c=>g.board[c]===null||g.board[c+7]===null||
    g.board[c+14]===null||g.board[c+21]===null||
    g.board[c+28]===null||g.board[c+35]===null);

  if(!possible.length)return;

  const col=possible[Math.floor(Math.random()*possible.length)];
  c4Move(col);
}

/* =========================================================
   LUDO
   ========================================================= */

const LUDO_PATH=[
  [6,1],[6,2],[6,3],[6,4],[6,5],
  [5,6],[4,6],[3,6],[2,6],[1,6],
  [0,6],[0,7],[0,8],
  [1,8],[2,8],[3,8],[4,8],[5,8],
  [6,9],[6,10],[6,11],[6,12],[6,13],
  [7,13],[8,13],
  [8,12],[8,11],[8,10],[8,9],
  [9,8],[10,8],[11,8],[12,8],[13,8],
  [14,8],[14,7],[14,6],
  [13,6],[12,6],[11,6],[10,6],[9,6],
  [8,5],[8,4],[8,3],[8,2],[8,1],
  [8,0],[7,0],[6,0]
];

const COLORS=["red","green","yellow","blue"];

function startLudo(mode){
  state.ludo={
    mode,
    turn:0,
    dice:0,
    winner:null,
    players:[
      {name:state.profile?.display_name||"You",color:"red",tokens:[-1,-1,-1,-1]},
      {name:"Robot",color:"green",tokens:[-1,-1,-1,-1]}
    ]
  };

  renderGamePage("Ludo",`
    <div class="gamebar">
      <div>
        <strong id="ludoTurn">Your turn</strong>
        <div class="small">Classic Ludo</div>
      </div>
      <button class="action secondary" style="width:auto" onclick="rollLudo()">Roll</button>
    </div>

    <div class="dice" id="ludoDice">–</div>

    <div class="boardwrap">
      <div id="ludoBoard" class="ludo"></div>
    </div>

    <div style="margin-top:20px" class="small">
      Roll 6 to bring a token out. Reach home with all four tokens.
    </div>
  `);

  renderLudo();
}

function ludoCellClass(r,c){
  if(r<6&&c<6)return "red";
  if(r<6&&c>8)return "green";
  if(r>8&&c<6)return "blue";
  if(r>8&&c>8)return "yellow";

  const track=LUDO_PATH.some(([x,y])=>x===r&&y===c);

  if(track){
    const safe=[
      "6,1","1,8","8,13","13,6","8,1","6,12","12,8","1,6"
    ];
    return "track "+(safe.includes(`${r},${c}`)?"safe":"");
  }

  if(r>=6&&r<=8&&c>=6&&c<=8)return "ludo-center";

  return "track";
}

function renderLudo(){
  const b=$("ludoBoard");
  if(!b||!state.ludo)return;

  let html="";

  for(let r=0;r<15;r++){
    for(let c=0;c<15;c++){
      const cls=ludoCellClass(r,c);

      let tokenHTML="";

      for(let p=0;p<state.ludo.players.length;p++){
        const player=state.ludo.players[p];

        for(let t=0;t<4;t++){
          const pos=player.tokens[t];

          if(pos>=0&&pos<LUDO_PATH.length){
            const [rr,cc]=LUDO_PATH[pos];

            if(rr===r&&cc===c){
              tokenHTML+=`
                <div class="token ${player.color}" title="${esc(player.name)}"></div>
              `;
            }
          }
        }
      }

      html+=`
        <div class="lcell ${cls}">
          ${tokenHTML}
        </div>
      `;
    }
  }

  b.innerHTML=html;

  const player=state.ludo.players[state.ludo.turn];

  $("ludoTurn").textContent=
    state.ludo.winner
      ? `${state.ludo.winner.name} wins`
      : `${player.name}'s turn`;

  $("ludoDice").textContent=state.ludo.dice||"–";
}

function rollLudo(){
  const g=state.ludo;
  if(!g||g.winner||g.dice)return;

  const p=g.players[g.turn];

  if(g.mode==="robot"&&g.turn===1)return;

  g.dice=Math.floor(Math.random()*6)+1;

  const moves=p.tokens
    .map((x,i)=>ludoCanMove(p,x,g.dice)?i:null)
    .filter(x=>x!==null);

  renderLudo();

  if(!moves.length){
    setTimeout(()=>{
      const extra=g.dice===6;
      g.dice=0;

      if(!extra)g.turn=(g.turn+1)%g.players.length;

      renderLudo();

      if(g.mode==="robot"&&g.turn===1){
        setTimeout(robotLudo,500);
      }
    },600);

    return;
  }

  const chosen=moves[Math.floor(Math.random()*moves.length)];
  setTimeout(()=>moveLudo(chosen),350);
}

function ludoCanMove(player,pos,dice){
  if(pos===-1)return dice===6;
  if(pos>=52)return false;
  return pos+dice<=57;
}

function moveLudo(tokenIndex){
  const g=state.ludo;
  const p=g.players[g.turn];

  if(!g.dice||!p)return;

  const old=p.tokens[tokenIndex];

  if(!ludoCanMove(p,old,g.dice))return;

  let target=old;

  if(old===-1){
    target=0;
  }else{
    target+=g.dice;
  }

  p.tokens[tokenIndex]=target;

  if(target<52){
    for(let i=0;i<g.players.length;i++){
      if(i===g.turn)continue;

      for(let t=0;t<4;t++){
        if(g.players[i].tokens[t]===target){
          g.players[i].tokens[t]=-1;
        }
      }
    }
  }

  const won=p.tokens.every(x=>x>=57);

  g.dice=0;

  if(won){
    g.winner=p;
    renderLudo();
    return;
  }

  const extra=
    old>=0&&target<52&&
    g.dice===6;

  if(!extra){
    g.turn=(g.turn+1)%g.players.length;
  }

  renderLudo();

  if(g.mode==="robot"&&g.turn===1){
    setTimeout(robotLudo,500);
  }
}

function robotLudo(){
  const g=state.ludo;
  if(!g||g.winner||g.turn!==1||g.dice)return;

  const p=g.players[1];

  const moves=p.tokens
    .map((x,i)=>ludoCanMove(p,x,g.dice)?i:null)
    .filter(x=>x!==null);

  if(!moves.length){
    const d=g.dice;
    g.dice=0;
    if(d!==6)g.turn=0;
    renderLudo();
    return;
  }

  let best=moves[0];

  moves.forEach(i=>{
    const x=p.tokens[i];
    if(x>=0&&x+g.dice>p.tokens[best])best=i;
    if(x===-1&&g.dice===6)best=i;
  });

  setTimeout(()=>moveLudo(best),300);
}

  --muted:#8f96a3;
  --accent:#7c5cff;
  --accent2:#9a84ff;
  --danger:#ff4d67;
  --success:#35d07f;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#app{min-height:100vh}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.topbar{
  position:sticky;top:0;z-index:30;height:68px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--border);
  background:rgba(8,9,12,.86);backdrop-filter:blur(20px)
}
.brand{font-size:21px;font-weight:800;letter-spacing:.12em}
.iconbtn{
  width:42px;height:42px;border-radius:14px;background:var(--panel2);
  color:var(--text);border:1px solid var(--border)
}
.avatar{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#7057ff,#c17aff);font-weight:800;
  overflow:hidden;flex:none
}
.avatar img{width:100%;height:100%;object-fit:cover}
.page{width:min(1100px,100%);margin:auto;padding:24px 18px 110px}
.hero{padding:28px 0 12px}
.hero h1{font-size:clamp(30px,7vw,52px);margin:0 0 8px;letter-spacing:-.04em}
.hero p{color:var(--muted);margin:0}
.live{
  display:inline-flex;align-items:center;gap:8px;margin-top:18px;
  padding:9px 13px;border:1px solid var(--border);border-radius:999px;
  background:var(--panel)
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:linear-gradient(145deg,var(--panel),#0d0f14);
  border:1px solid var(--border);border-radius:22px;padding:20px;
  box-shadow:var(--shadow)
}
.card h3{margin:0 0 7px}
.card p{color:var(--muted);margin:0;font-size:14px}
.action{
  width:100%;padding:13px 16px;border-radius:14px;background:var(--accent);
  color:white;font-weight:700
}
.secondary{background:var(--panel2);border:1px solid var(--border)}
.danger{background:var(--danger)}
.success{background:var(--success);color:#06120b}
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;justify-content:center;gap:4px;padding:10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:rgba(8,9,12,.9);backdrop-filter:blur(22px);
  border-top:1px solid var(--border)
}
.nav button{
  position:relative;background:transparent;color:var(--muted);
  padding:10px 14px;border-radius:14px;min-width:70px
}
.nav button.active{background:var(--panel2);color:white}
.badge{
  position:absolute;top:3px;right:8px;min-width:16px;height:16px;
  padding:0 4px;border-radius:9px;background:var(--danger);
  color:#fff;font-size:10px;display:grid;place-items:center
}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--panel);border:1px solid var(--border);border-radius:18px
}
.rowmain{min-width:0;flex:1}
.rowmain strong{display:block}
.rowmain span{display:block;color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:var(--success)}
.sectiontitle{margin:25px 0 12px;font-size:17px}
.search{
  display:flex;gap:9px;margin:16px 0
}
.search input,.field{
  width:100%;background:var(--panel);border:1px solid var(--border);
  color:white;padding:14px 15px;border-radius:14px;outline:none
}
.search input:focus,.field:focus{border-color:var(--accent)}
.empty{
  padding:38px 18px;text-align:center;color:var(--muted);
  border:1px dashed var(--border);border-radius:18px
}
.back{display:flex;align-items:center;gap:8px;margin-bottom:18px;color:var(--muted);background:none}
.modal{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;
  justify-content:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(10px)
}
.modal.show{display:flex}
.modalbox{
  width:min(480px,100%);max-height:90vh;overflow:auto;
  background:#101217;border:1px solid var(--border);border-radius:26px;
  padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.6)
}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modalhead h2{margin:0}
.close{background:var(--panel2);color:white;width:38px;height:38px;border-radius:12px}
.toast{
  position:fixed;left:50%;bottom:88px;z-index:300;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#191c24;border:1px solid var(--border);padding:12px 17px;
  border-radius:14px;transition:.25s;max-width:90%
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chat{
  display:flex;flex-direction:column;height:calc(100vh - 68px)
}
.chathead{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--border)
}
.messages{
  flex:1;overflow:auto;padding:18px 14px;display:flex;
  flex-direction:column;gap:8px
}
.bubble{
  max-width:min(78%,520px);padding:10px 13px;border-radius:17px;
  background:var(--panel2);align-self:flex-start
}
.bubble.mine{align-self:flex-end;background:var(--accent)}
.bubble small{display:block;opacity:.6;font-size:10px;margin-top:4px}
.chatinput{
  display:flex;gap:8px;padding:10px 12px;
  border-top:1px solid var(--border);background:rgba(8,9,12,.95)
}
.chatinput input{flex:1}
.circle{
  width:44px;height:44px;border-radius:14px;background:var(--panel2);
  color:white;border:1px solid var(--border)
}
.call-overlay{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#252039 0,#090a0e 65%);
  padding:20px
}
.call-overlay.show{display:flex}
.callbox{text-align:center;width:min(420px,100%)}
.callavatar{
  width:110px;height:110px;border-radius:50%;margin:0 auto 22px;
  background:linear-gradient(135deg,#6c51ff,#bb75ff);
  display:grid;place-items:center;font-size:38px;font-weight:800;
  box-shadow:0 0 0 12px rgba(124,92,255,.08),0 20px 70px rgba(0,0,0,.5);
  overflow:hidden
}
.callavatar img{width:100%;height:100%;object-fit:cover}
.callname{font-size:27px;font-weight:800}
.callstate{color:var(--muted);margin-top:8px}
.calltimer{font-size:20px;margin-top:12px;font-variant-numeric:tabular-nums}
.callcontrols{display:flex;justify-content:center;gap:14px;margin-top:45px}
.callcontrol{
  width:58px;height:58px;border-radius:50%;background:#20232c;
  color:white;border:1px solid var(--border);font-size:20px
}
.callcontrol.active{background:white;color:#111}
.callcontrol.end{background:var(--danger);transform:rotate(135deg)}
.incoming-actions{display:flex;justify-content:center;gap:30px;margin-top:40px}
.incoming-actions button{width:64px;height:64px;border-radius:50%;color:white;font-size:23px}
.accept{background:var(--success);color:#07150d!important}
.decline{background:var(--danger)}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.game-card{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}
.game-icon{font-size:34px}
.boardwrap{display:flex;justify-content:center;margin-top:20px}
.ludo{
  width:min(92vw,520px);aspect-ratio:1;
  display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);
  background:#f4f4f4;border:4px solid #24262c;border-radius:8px;overflow:hidden
}
.lcell{border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;position:relative}
.red{background:#ff596b}.green{background:#48d99a}.yellow{background:#ffd84d}.blue{background:#5b8cff}
.track{background:#fff}
.safe:after{content:"★";font-size:10px;color:#444}
.token{
  width:70%;height:70%;border-radius:50%;border:2px solid rgba(0,0,0,.35);
  box-shadow:0 2px 4px rgba(0,0,0,.3)
}
.ludo-center{background:conic-gradient(#ff596b 0 25%,#ffd84d 25% 50%,#48d99a 50% 75%,#5b8cff 75% 100%)}
.dice{
  width:65px;height:65px;border-radius:15px;background:#fff;color:#111;
  display:grid;place-items:center;font-size:30px;font-weight:900;
  margin:15px auto;border:3px solid #ddd
}
.gamebar{display:flex;align-items:center;justify-content:space-between;margin-top:15px}
.profilebox{text-align:center;padding:20px}
.auth{
  min-height:100vh;display:grid;place-items:center;padding:20px
}
.authbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:25px}
.authbox h1{margin-top:0}
.form{display:flex;flex-direction:column;gap:11px}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<div id="callOverlay" class="call-overlay">
  <div class="callbox">
    <div id="callAvatar" class="callavatar">N</div>
    <div id="callName" class="callname">NEXORA</div>
    <div id="callState" class="callstate">Calling…</div>
    <div id="callTimer" class="calltimer">00:00</div>

    <div id="incomingActions" class="incoming-actions hidden">
      <button class="decline" id="declineIncoming">✕</button>
      <button class="accept" id="acceptIncoming">✓</button>
    </div>

    <div id="activeCallControls" class="callcontrols hidden">
      <button class="callcontrol" id="muteCall">🎙</button>
      <button class="callcontrol" id="speakerCall">🔊</button>
      <button class="callcontrol end" id="endCall">📞</button>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2 id="modalTitle"></h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================================================
   NEXORA
   Single-file frontend
   ========================================================= */

const SUPABASE_URL = "https://ktwluvpmzisonmootdqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  user:null,
  profile:null,
  page:"home",
  chat:null,
  messages:[],
  conversations:[],
  friends:[],
  requests:[],
  notifications:[],
  realtime:[],
  call:null,
  callChannel:null,
  signalChannel:null,
  peer:null,
  localStream:null,
  remoteStream:null,
  remoteAudio:null,
  callTimer:null,
  callStartedAt:null,
  callMuted:false,
  speaker:false,
  ringtone:null,
  ringtoneTimer:null,
  game:null,
  ludo:null
};

const $ = id => document.getElementById(id);

function toast(message){
  $("toast").textContent=message;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>$("toast").classList.remove("show"),2800);
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  const s=(name||"N").trim().split(/\s+/);
  return ((s[0]?.[0]||"N")+(s[1]?.[0]||"")).toUpperCase();
}

function avatarHTML(profile,size="42"){
  if(profile?.avatar_url){
    return `<div class="avatar" style="width:${size}px;height:${size}px"><img src="${esc(profile.avatar_url)}"></div>`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px">${esc(initials(profile?.display_name||profile?.username))}</div>`;
}

function timeAgo(date){
  if(!date)return "";
  const sec=Math.floor((Date.now()-new Date(date).getTime())/1000);
  if(sec<60)return "now";
  if(sec<3600)return Math.floor(sec/60)+"m";
  if(sec<86400)return Math.floor(sec/3600)+"h";
  return Math.floor(sec/86400)+"d";
}

function formatTime(date){
  if(!date)return "";
  return new Date(date).toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
}

function formatDuration(seconds){
  seconds=Math.max(0,Math.floor(seconds||0));
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;
  return h
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

async function safe(fn){
  try{
    return await fn();
  }catch(e){
    console.error(e);
    toast(e?.message||"Something went wrong");
    return null;
  }
}

/* =========================================================
   AUTH
   ========================================================= */

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(session?.user){
    await loadUser(session.user);
  }else{
    renderAuth();
  }

  db.auth.onAuthStateChange(async(_event,session)=>{
    if(session?.user){
      await loadUser(session.user);
    }else{
      state.user=null;
      state.profile=null;
      cleanupCall();
      renderAuth();
    }
  });
}

async function loadUser(user){
  state.user=user;

  let {data:profile,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  if(!profile){
    const username="user_"+user.id.replaceAll("-","").slice(0,12);
    const {data:newProfile}=await db
      .from("profiles")
      .insert({
        id:user.id,
        username,
        display_name:user.email?.split("@")[0]||"NEXORA User",
        is_guest:user.is_anonymous||false,
        online:true,
        last_seen:new Date().toISOString()
      })
      .select()
      .single();

    profile=newProfile;
  }

  state.profile=profile;
  await setPresence(true);
  await loadNotifications();
  await subscribeGlobal();
  renderApp();
}

async function setPresence(online){
  if(!state.user)return;
  await db.from("profiles").update({
    online,
    last_seen:new Date().toISOString()
  }).eq("id",state.user.id);
}

window.addEventListener("beforeunload",()=>{
  if(state.user){
    db.from("profiles").update({
      online:false,
      last_seen:new Date().toISOString()
    }).eq("id",state.user.id);
  }
});

function renderAuth(){
  $("app").innerHTML=`
    <div class="auth">
      <div class="authbox">
        <div class="brand">NEXORA</div>
        <h1>Welcome back.</h1>
        <p class="small">Connect, chat and play.</p>

        <div class="form" style="margin-top:22px">
          <input id="email" class="field" type="email" placeholder="Email">
          <input id="password" class="field" type="password" placeholder="Password">
          <button class="action" onclick="signIn()">Sign in</button>
          <button class="action secondary" onclick="signUp()">Create account</button>
          <button class="action secondary" onclick="guestLogin()">Continue as guest</button>
        </div>
      </div>
    </div>
  `;
}

async function signIn(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return toast("Enter email and password");

  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)toast(error.message);
}

async function signUp(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return toast("Enter email and password");

  const {error}=await db.auth.signUp({email,password});
  if(error)toast(error.message);
  else toast("Account created");
}

async function guestLogin(){
  const {error}=await db.auth.signInAnonymously();
  if(error)toast(error.message);
}

/* =========================================================
   GLOBAL REALTIME
   ========================================================= */

async function subscribeGlobal(){
  state.realtime.forEach(c=>db.removeChannel(c));
  state.realtime=[];

  if(!state.user)return;

  const callsChannel=db.channel("nexora-calls-"+state.user.id);

  callsChannel
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"calls",
      filter:`receiver_id=eq.${state.user.id}`
    },payload=>{
      handleIncomingCallChange(payload);
    })
    .on("postgres_changes",{
      event:"*",
      schema:"public",
      table:"calls",
      filter:`caller_id=eq.${state.user.id}`
    },payload=>{
      handleOutgoingCallChange(payload);
    })
    .subscribe();

  state.realtime.push(callsChannel);

  const notificationChannel=db.channel("nexora-notifications-"+state.user.id);

  notificationChannel
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"notifications",
      filter:`user_id=eq.${state.user.id}`
    },payload=>{
      state.notifications.unshift(payload.new);
      updateNavBadges();
      toast(payload.new.title||"New notification");
    })
    .subscribe();

  state.realtime.push(notificationChannel);

  const presence=db.channel("nexora-presence",{
    config:{presence:{key:state.user.id}}
  });

  presence.on("presence",{
    event:"sync"
  },()=>{
    updateLiveCount(presence);
  });

  await presence.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      await presence.track({
        user_id:state.user.id,
        online:true
      });
      updateLiveCount(presence);
    }
  });

  state.realtime.push(presence);
}

function updateLiveCount(channel){
  const count=Object.keys(channel.presenceState()).length;
  const el=$("liveCount");
  if(el)el.textContent=`${count} people live`;
}

/* =========================================================
   APP SHELL
   ========================================================= */

function renderApp(){
  if(!state.user)return renderAuth();

  $("app").innerHTML=`
    <div id="homeScreen" class="screen"></div>
    <div id="recentScreen" class="screen"></div>
    <div id="connectScreen" class="screen"></div>
    <div id="gamesScreen" class="screen"></div>
    <div id="chatScreen" class="screen"></div>

    <nav class="nav">
      <button id="navHome" onclick="navigate('home')">⌂<br><small>Home</small></button>
      <button id="navRecent" onclick="navigate('recent')">
        ◴<span id="recentBadge" class="badge hidden">0</span><br><small>Recent</small>
      </button>
      <button id="navConnect" onclick="navigate('connect')">＋<br><small>Connect</small></button>
      <button id="navGames" onclick="navigate('games')">◈<br><small>Games</small></button>
    </nav>
  `;

  navigate(state.page||"home");
}

function navigate(page){
  state.page=page;

  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));

  const screen=$(page+"Screen");
  if(screen)screen.classList.add("active");

  const nav=$("nav"+page[0].toUpperCase()+page.slice(1));
  if(nav)nav.classList.add("active");

  if(page==="home")renderHome();
  if(page==="recent")renderRecent();
  if(page==="connect")renderConnect();
  if(page==="games")renderGames();

  updateNavBadges();
}

function updateNavBadges(){
  const unread=state.notifications.filter(x=>!x.is_read).length;
  $("recentBadge")?.classList.toggle("hidden",unread===0);
  if($("recentBadge"))$("recentBadge").textContent=unread>99?"99+":unread;
}

/* =========================================================
   HOME
   ========================================================= */

async function renderHome(){
  const el=$("homeScreen");
  if(!el)return;

  el.innerHTML=`
    <header class="topbar">
      <div class="brand">NEXORA</div>
      <button class="iconbtn" onclick="openProfile()">◉</button>
    </header>

    <main class="page">
      <section class="hero">
        <h1>Welcome, ${esc(state.profile?.display_name||"there")}.</h1>
        <p>Your space to connect, talk and play.</p>
        <div class="live"><span class="dot"></span><span id="liveCount">People live</span></div>
      </section>

      <h3 class="sectiontitle">Quick access</h3>

      <div class="grid">
        <button class="card" onclick="navigate('recent')">
          <h3>Recent</h3><p>Chats, calls & notifications</p>
        </button>
        <button class="card" onclick="navigate('connect')">
          <h3>Connect</h3><p>Find people and friends</p>
        </button>
        <button class="card" onclick="navigate('games')">
          <h3>Games</h3><p>Play with friends or robot</p>
        </button>
      </div>

      <h3 class="sectiontitle">Activity</h3>
      <div id="homeActivity" class="list">
        <div class="empty">Loading activity…</div>
      </div>
    </main>
  `;

  await loadConversations();
  await loadCalls();
  renderHomeActivity();
}

function renderHomeActivity(){
  const el=$("homeActivity");
  if(!el)return;

  const items=[
    ...state.conversations.slice(0,3).map(x=>({
      text:x.last_message||"Start a conversation",
      sub:x.other_display_name||x.other_username
    })),
    ...state.notifications.slice(0,3).map(x=>({
      text:x.title,
      sub:x.body||""
    }))
  ].slice(0,5);

  el.innerHTML=items.length
    ? items.map(x=>`
      <div class="row">
        <div class="rowmain">
          <strong>${esc(x.text)}</strong>
          <span>${esc(x.sub)}</span>
        </div>
      </div>
    `).join("")
    : `<div class="empty">Nothing here yet.</div>`;
}

/* =========================================================

    user_id:targetId,

    title:"New friend request",

async function loadMessages(){
  if(!state.chat)return;

  const {data,error}=await db.from("messages")
    .select("*")
    .eq("conversation_id",state.chat.conversation_id)
    .order("created_at",{ascending:true});

  if(error){
    toast(error.message);
    return;
  }

  state.messages=data||[];
  renderMessages();
}

function renderMessages(){
  const el=$("messageList");
  if(!el)return;

  el.innerHTML=state.messages.map(m=>`
    <div class="bubble ${m.sender_id===state.user.id?"mine":""}">
      ${esc(m.message)}
      <small>${formatTime(m.created_at)}</small>
    </div>
  `).join("");

  el.scrollTop=el.scrollHeight;
}

function subscribeChat(){
  if(!state.chat)return;

  const channel=db.channel("nexora-chat-"+state.chat.conversation_id);

  channel.on("postgres_changes",{
    event:"INSERT",
    schema:"public",
    table:"messages",
    filter:`conversation_id=eq.${state.chat.conversation_id}`
  },payload=>{
    if(!state.messages.some(x=>x.id===payload.new.id)){
      state.messages.push(payload.new);
      renderMessages();
    }
  }).subscribe();

  state.realtime.push(channel);
}

  input.value="";

  const {error}=await db.from("messages").insert({
    conversation_id:state.chat.conversation_id,
    sender_id:state.user.id,
    message:text,
    message_type:"text"
  });

    toast(error.message);
    input.value=text;
  }
