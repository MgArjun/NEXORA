<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEXORA</title>
<style>
:root{
--bg:#07090e;
--bg2:#0b0e15;
--surface:#10141d;
--surface2:#151a24;
--surface3:#1b2130;
--surface4:#222938;
--border:rgba(255,255,255,.075);
--border2:rgba(255,255,255,.12);
--text:#f7f8fc;
--muted:#929aaa;
--muted2:#697183;
--accent:#7d8cff;
--accent2:#a76cff;
--green:#45d89a;
--red:#ff5d6c;
--yellow:#f4c95d;
--blue:#5f92ff;
--shadow:0 18px 55px rgba(0,0,0,.38);
--radius:20px;
}
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
width:100%;
height:100%;
margin:0;
padding:0;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
overscroll-behavior:none;
}
button,input,textarea{
font:inherit;
}
button{
border:0;
outline:0;
cursor:pointer;
}
input,textarea{
outline:0;
}
#app{
width:100%;
height:100dvh;
min-height:100dvh;
overflow:hidden;
position:relative;
background:
radial-gradient(circle at 10% -10%,rgba(125,140,255,.12),transparent 32%),
radial-gradient(circle at 110% 110%,rgba(167,108,255,.10),transparent 34%),
var(--bg);
}
.hidden{
display:none!important;
}
.no-select{
user-select:none;
}
.screen{
width:100%;
height:100dvh;
overflow:hidden;
}
.auth-screen{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:auto;
}
.auth-card{
width:min(430px,100%);
padding:28px;
border:1px solid var(--border);
border-radius:28px;
background:
linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018)),
var(--surface);
box-shadow:var(--shadow);
}
.logo{
font-size:20px;
font-weight:900;
letter-spacing:.16em;
}
.logo span{
color:var(--accent);
}
.auth-card h1{
font-size:32px;
line-height:1.05;
letter-spacing:-.045em;
margin:28px 0 9px;
}
.auth-card>p{
color:var(--muted);
font-size:14px;
margin:0 0 23px;
line-height:1.55;
}
.auth-tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:4px;
padding:4px;
border-radius:15px;
background:#080b10;
border:1px solid var(--border);
margin-bottom:17px;
}
.auth-tab{
height:40px;
border-radius:11px;
background:transparent;
color:var(--muted);
}
.auth-tab.active{
background:var(--surface3);
color:var(--text);
}
.field{
margin-bottom:12px;
}
.field label{
display:block;
font-size:11px;
color:var(--muted);
margin:0 0 6px 3px;
}
.input{
width:100%;
height:48px;
padding:0 14px;
border:1px solid var(--border);
border-radius:14px;
background:rgba(255,255,255,.045);
color:var(--text);
transition:border-color .2s,background .2s;
}
.input::placeholder{
color:var(--muted2);
}
.input:focus{
border-color:rgba(125,140,255,.6);
background:rgba(125,140,255,.045);
}
.textarea{
width:100%;
min-height:80px;
padding:12px 14px;
border:1px solid var(--border);
border-radius:14px;
background:rgba(255,255,255,.045);
color:var(--text);
resize:none;
}
.btn{
height:44px;
padding:0 16px;
border-radius:13px;
background:var(--surface3);
border:1px solid var(--border);
color:var(--text);
transition:transform .18s,opacity .18s,background .18s;
}
.btn:active{
transform:scale(.97);
}
.btn:disabled{
opacity:.5;
cursor:not-allowed;
}
.btn.primary{
background:linear-gradient(135deg,var(--accent),var(--accent2));
border-color:transparent;
box-shadow:0 8px 25px rgba(125,140,255,.18);
}
.btn.success{
background:rgba(69,216,154,.12);
border-color:rgba(69,216,154,.2);
color:#aaf1d0;
}
.btn.danger{
background:rgba(255,93,108,.12);
border-color:rgba(255,93,108,.2);
color:#ffadb5;
}
.btn.ghost{
background:transparent;
}
.btn.full{
width:100%;
}
.btn.small{
height:36px;
padding:0 11px;
font-size:12px;
border-radius:11px;
}
.auth-actions{
display:grid;
gap:8px;
margin-top:10px;
}
.app-shell{
height:100dvh;
width:100%;
display:flex;
flex-direction:column;
overflow:hidden;
}
.topbar{
height:68px;
min-height:68px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 17px;
background:rgba(7,9,14,.78);
border-bottom:1px solid var(--border);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
z-index:30;
}
.topbar-left{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}
.topbar-title{
font-weight:800;
font-size:17px;
letter-spacing:.02em;
white-space:nowrap;
}
.topbar-title span{
color:var(--accent);
}
.topbar-actions{
display:flex;
align-items:center;
gap:8px;
}
.icon-btn{
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:13px;
background:var(--surface2);
border:1px solid var(--border);
color:var(--text);
font-size:19px;
}
.profile-button{
width:41px;
height:41px;
padding:0;
border-radius:50%;
overflow:hidden;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#fff;
font-weight:800;
}
.profile-button img{
width:100%;
height:100%;
object-fit:cover;
}
.main{
flex:1;
min-height:0;
overflow:hidden;
position:relative;
}
.page{
height:100%;
overflow-y:auto;
overflow-x:hidden;
padding:20px 17px 32px;
scrollbar-width:none;
}
.page::-webkit-scrollbar{
display:none;
}
.bottom-nav{
height:76px;
min-height:76px;
display:grid;
grid-template-columns:repeat(4,1fr);
background:rgba(7,9,14,.92);
border-top:1px solid var(--border);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
z-index:30;
padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
position:relative;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
background:transparent;
color:var(--muted2);
font-size:10px;
}
.nav-item.active{
color:var(--text);
}
.nav-icon{
font-size:21px;
line-height:1;
}
.nav-label{
font-weight:600;
}
.nav-dot{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
background:var(--red);
top:13px;
right:29%;
box-shadow:0 0 12px rgba(255,93,108,.7);
}
.hero{
padding:12px 2px 20px;
}
.hero h1{
margin:0;
font-size:34px;
line-height:1.02;
letter-spacing:-.055em;
}
.hero p{
margin:9px 0 0;
color:var(--muted);
font-size:14px;
line-height:1.5;
}
.live-pill{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:17px;
height:34px;
padding:0 12px;
border-radius:999px;
background:rgba(69,216,154,.08);
border:1px solid rgba(69,216,154,.18);
color:#baf5d8;
font-size:11px;
}
.live-dot{
width:7px;
height:7px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 10px rgba(69,216,154,.8);
}
.grid{
display:grid;
gap:12px;
}
.quick-grid{
grid-template-columns:repeat(3,minmax(0,1fr));
}
.card{
background:
linear-gradient(145deg,rgba(255,255,255,.052),rgba(255,255,255,.014)),
var(--surface);
border:1px solid var(--border);
border-radius:var(--radius);
box-shadow:0 10px 35px rgba(0,0,0,.15);
}
.quick-card{
min-height:112px;
padding:16px;
display:flex;
flex-direction:column;
justify-content:space-between;
text-align:left;
color:var(--text);
}
.quick-icon{
font-size:27px;
}
.quick-card small{
font-size:11px;
color:var(--muted);
}
.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin:27px 2px 11px;
}
.section-title h2{
margin:0;
font-size:15px;
letter-spacing:-.01em;
}
.section-title span{
font-size:11px;
color:var(--muted2);
}
.list{
display:flex;
flex-direction:column;
gap:9px;
}
.activity{
padding:14px;
display:flex;
align-items:center;
gap:11px;
}
.activity-main{
flex:1;
min-width:0;
}
.activity-main strong{
display:block;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.activity-main small{
display:block;
font-size:11px;
color:var(--muted);
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.avatar{
width:44px;
height:44px;
min-width:44px;
border-radius:50%;
display:grid;
place-items:center;
overflow:hidden;
background:linear-gradient(135deg,#6678ff,#a269ff);
color:#fff;
font-size:13px;
font-weight:850;
}
.avatar img{
width:100%;
height:100%;
object-fit:cover;
}
.avatar.large{
width:68px;
height:68px;
font-size:20px;
}
.status-dot{
width:8px;
height:8px;
min-width:8px;
border-radius:50%;
background:var(--muted2);
}
.status-dot.online{
background:var(--green);
box-shadow:0 0 10px rgba(69,216,154,.7);
}
.empty{
padding:32px 20px;
text-align:center;
color:var(--muted);
font-size:13px;
}
.search-box{
padding:13px;
}
.search-row{
display:flex;
gap:8px;
}
.search-row .input{
flex:1;
}
.person{
padding:13px;
display:flex;
align-items:center;
gap:11px;
}
.person-info{
flex:1;
min-width:0;
}
.person-info strong{
display:block;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.person-info small{
display:block;
font-size:11px;
color:var(--muted);
margin-top:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.person-actions{
display:flex;
gap:6px;
}
.game-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}
.game-card{
min-height:175px;
padding:18px;
text-align:left;
color:var(--text);
background:
radial-gradient(circle at 90% 0%,rgba(125,140,255,.12),transparent 42%),
linear-gradient(145deg,rgba(255,255,255,.052),rgba(255,255,255,.014)),
var(--surface);
border:1px solid var(--border);
border-radius:22px;
box-shadow:0 12px 40px rgba(0,0,0,.18);
}
.game-icon{
font-size:37px;
line-height:1;
}
.game-card h3{
margin:19px 0 5px;
font-size:16px;
}
.game-card p{
margin:0;
font-size:11px;
line-height:1.45;
color:var(--muted);
}
.game-card.coming{
opacity:.55;
}
.footer{
text-align:center;
font-size:10px;
color:var(--muted2);
padding:28px 0 10px;
}
.modal-root{
position:fixed;
inset:0;
z-index:100;
pointer-events:none;
}
.modal{
position:absolute;
inset:0;
display:none;
align-items:flex-end;
justify-content:center;
padding:12px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
pointer-events:auto;
}
.modal.show{
display:flex;
}
.sheet{
width:min(680px,100%);
max-height:92dvh;
overflow:auto;
padding:20px;
border-radius:27px;
background:#0d1118;
border:1px solid var(--border2);
box-shadow:0 35px 100px rgba(0,0,0,.6);
}
.sheet-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:17px;
}
.sheet-head h2{
margin:0;
font-size:20px;
letter-spacing:-.03em;
}
.sheet-head p{
margin:5px 0 0;
font-size:12px;
color:var(--muted);
}
.sheet-close{
width:36px;
height:36px;
border-radius:11px;
background:var(--surface2);
color:var(--muted);
border:1px solid var(--border);
}
.sheet-actions{
display:flex;
gap:8px;
margin-top:17px;
}
.toast-wrap{
position:fixed;
left:50%;
bottom:92px;
transform:translateX(-50%);
width:min(420px,calc(100% - 28px));
z-index:400;
display:flex;
flex-direction:column;
gap:8px;
pointer-events:none;
}
.toast{
padding:13px 15px;
border-radius:15px;
background:#171c26;
border:1px solid var(--border2);
box-shadow:var(--shadow);
font-size:12px;
line-height:1.4;
animation:toast-in .2s ease-out;
}
@keyframes toast-in{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}
.call-overlay{
position:fixed;
inset:0;
z-index:300;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at 50% 20%,rgba(125,140,255,.22),transparent 38%),
rgba(4,6,10,.96);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
}
.call-overlay.show{
display:flex;
}
.call-box{
width:min(430px,100%);
text-align:center;
}
.call-avatar{
width:118px;
height:118px;
margin:0 auto 23px;
border-radius:50%;
display:grid;
place-items:center;
overflow:hidden;
background:linear-gradient(135deg,var(--accent),var(--accent2));
font-size:36px;
font-weight:900;
box-shadow:0 0 70px rgba(125,140,255,.3);
}
.call-avatar img{
width:100%;
height:100%;
object-fit:cover;
}
.call-box h2{
margin:0;
font-size:28px;
letter-spacing:-.04em;
}
.call-state{
margin-top:8px;
color:var(--muted);
font-size:13px;
}
.call-timer{
margin-top:10px;
height:24px;
font-size:16px;
font-variant-numeric:tabular-nums;
}
.call-actions{
display:flex;
justify-content:center;
gap:15px;
margin-top:38px;
}
.call-action{
width:62px;
height:62px;
border-radius:50%;
background:var(--surface3);
border:1px solid var(--border2);
color:#fff;
font-size:22px;
display:grid;
place-items:center;
}
.call-action.accept{
background:var(--green);
}
.call-action.end{
background:var(--red);
}
.call-action.active{
background:var(--accent);
}
.chat-page{
height:100%;
display:flex;
flex-direction:column;
overflow:hidden;
}
.chat-header{
height:67px;
min-height:67px;
display:flex;
align-items:center;
gap:9px;
padding:9px 12px;
border-bottom:1px solid var(--border);
background:rgba(7,9,14,.7);
}
.chat-back{
width:38px;
height:38px;
border-radius:11px;
background:transparent;
color:var(--text);
font-size:21px;
}
.chat-head-info{
flex:1;
min-width:0;
}
.chat-head-info strong{
display:block;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.chat-head-info small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:3px;
}
.chat-head-actions{
display:flex;
gap:5px;
}
.chat-messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:14px 12px;
scrollbar-width:none;
}
.chat-messages::-webkit-scrollbar{
display:none;
}
.message-row{
display:flex;
margin:6px 0;
}
.message-row.mine{
justify-content:flex-end;
}
.message-bubble{
max-width:min(78%,520px);
padding:9px 11px;
border-radius:17px;
background:var(--surface2);
border:1px solid var(--border);
font-size:13px;
line-height:1.42;
word-break:break-word;
}
.message-row.mine .message-bubble{
background:linear-gradient(135deg,#5d6de0,#7c57bf);
border-color:transparent;
}
.message-bubble img{
display:block;
max-width:100%;
max-height:330px;
border-radius:11px;
object-fit:contain;
}
.message-time{
display:block;
font-size:9px;
opacity:.48;
margin-top:4px;
text-align:right;
}
.message-menu{
display:flex;
gap:5px;
margin-top:4px;
}
.chat-composer{
display:flex;
align-items:center;
gap:7px;
padding:8px;
border-top:1px solid var(--border);
background:rgba(7,9,14,.88);
}
.chat-input{
flex:1;
min-width:0;
height:43px;
}
.chat-send{
width:43px;
height:43px;
border-radius:13px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:white;
}
.game-mode-grid{
display:grid;
grid-template-columns:1fr;
gap:10px;
}
.mode-card{
padding:17px;
display:flex;
align-items:center;
gap:13px;
color:var(--text);
text-align:left;
}
.mode-card-icon{
width:45px;
height:45px;
border-radius:14px;
display:grid;
place-items:center;
background:var(--surface3);
font-size:21px;
}
.mode-card-main{
flex:1;
}
.mode-card-main strong{
display:block;
font-size:14px;
}
.mode-card-main small{
display:block;
margin-top:4px;
color:var(--muted);
font-size:11px;
}
.game-screen{
height:100%;
display:flex;
flex-direction:column;
overflow:hidden;
}
.game-header{
height:60px;
min-height:60px;
display:flex;
align-items:center;
gap:9px;
padding:8px 12px;
border-bottom:1px solid var(--border);
}
.game-header-info{
flex:1;
min-width:0;
}
.game-header-info strong{
display:block;
font-size:14px;
}
.game-header-info small{
display:block;
color:var(--muted);
font-size:10px;
margin-top:3px;
}
.game-area{
flex:1;
min-height:0;
position:relative;
overflow:hidden;
}
.game-scroll{
width:100%;
height:100%;
overflow:auto;
display:flex;
align-items:center;
justify-content:center;
padding:14px;
scrollbar-width:none;
}
.game-scroll::-webkit-scrollbar{
display:none;
}
.game-controls{
min-height:62px;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
padding:8px;
border-top:1px solid var(--border);
background:rgba(7,9,14,.82);
}
.game-status{
position:absolute;
left:50%;
top:12px;
transform:translateX(-50%);
z-index:4;
padding:8px 13px;
border-radius:999px;
background:rgba(10,13,19,.86);
border:1px solid var(--border);
font-size:11px;
white-space:nowrap;
backdrop-filter:blur(12px);
}
.game-chat-panel{
position:absolute;
left:10px;
right:10px;
bottom:10px;
height:min(62%,430px);
z-index:20;
display:flex;
flex-direction:column;
overflow:hidden;
background:#0c1017;
border:1px solid var(--border2);
border-radius:21px;
box-shadow:0 25px 80px rgba(0,0,0,.55);
}
.game-chat-header{
height:48px;
min-height:48px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 13px;
border-bottom:1px solid var(--border);
}
.game-chat-list{
flex:1;
min-height:0;
overflow-y:auto;
padding:9px;
}
.game-chat-row{
margin:5px 0;
font-size:12px;
}
.game-chat-row strong{
font-size:10px;
color:var(--accent);
}
.game-chat-row span{
color:var(--text);
}
.game-chat-form{
display:flex;
gap:7px;
padding:8px;
border-top:1px solid var(--border);
}
.game-chat-form .input{
flex:1;
}
.lobby-card{
padding:18px;
}
.player-list{
display:flex;
flex-direction:column;
gap:8px;
margin-top:13px;
}
.player-slot{

/* =========================================================
   DOM HELPERS
   ========================================================= */

const $=id=>document.getElementById(id);

function qs(selector,parent=document){
  return parent.querySelector(selector);
}

function qsa(selector,parent=document){
  return [...parent.querySelectorAll(selector)];
}

function safeText(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  const value=String(name||"User").trim();

  if(!value){
    return "U";
  }

  const pieces=value.split(/\s+/);

  return (
    (pieces[0]?.[0]||"U")+
    (pieces[1]?.[0]||"")
  ).toUpperCase().slice(0,2);
}

function avatarMarkup(profile,className="avatar"){
  const name=profile?.display_name||profile?.username||"User";

  if(profile?.avatar_url){
    return `
      <div class="${className}">
        <img src="${safeText(profile.avatar_url)}" alt="">
      </div>
    `;
  }

  return `
    <div class="${className}">
      ${safeText(initials(name))}
    </div>
  `;
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function nowISO(){
  return new Date().toISOString();
}

function timeLabel(date){
  if(!date){
    return "";
  }

  const value=new Date(date);

  if(Number.isNaN(value.getTime())){
    return "";
  }

  return value.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function dateLabel(date){
  if(!date){
    return "";
  }

  const value=new Date(date);

  if(Number.isNaN(value.getTime())){
    return "";
  }

  return value.toLocaleDateString([],{
    day:"numeric",
    month:"short"
  });
}

function relativeTime(date){
  if(!date){
    return "";
  }

  const difference=Date.now()-new Date(date).getTime();

  if(difference<0){
    return "now";
  }

  const seconds=Math.floor(difference/1000);

  if(seconds<60){
    return "now";
  }

  const minutes=Math.floor(seconds/60);

  if(minutes<60){
    return `${minutes}m`;
  }

  const hours=Math.floor(minutes/60);

  if(hours<24){
    return `${hours}h`;
  }

  const days=Math.floor(hours/24);

  if(days<7){
    return `${days}d`;
  }

  return dateLabel(date);
}

function durationText(seconds){
  const total=Math.max(0,Math.floor(Number(seconds)||0));

  const hours=Math.floor(total/3600);
  const minutes=Math.floor((total%3600)/60);
  const secs=total%60;

  if(hours>0){
    return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
  }

  return `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}

function toast(message){
  const wrap=$("toastWrap");

  if(!wrap){
    return;
  }

  const element=document.createElement("div");

  element.className="toast";
  element.textContent=message;

  wrap.appendChild(element);

  setTimeout(()=>{
    element.style.opacity="0";
    element.style.transform="translateY(5px)";

    setTimeout(()=>{
      element.remove();
    },180);
  },3400);
}

function setButtonLoading(button,loading,text="Please wait…"){
  if(!button){
    return;
  }

  if(loading){
    if(!button.dataset.originalText){
      button.dataset.originalText=button.innerHTML;
    }

    button.disabled=true;
    button.innerHTML=text;
  }else{
    button.disabled=false;

    if(button.dataset.originalText){
      button.innerHTML=button.dataset.originalText;
      delete button.dataset.originalText;
    }
  }
}

/* =========================================================
   MODALS
   ========================================================= */

function closeModal(){

function modalHeader(title,subtitle=""){

  `;
}

/* =========================================================
   AUTH UI
   ========================================================= */

function setAuthMode(mode){
  NEXORA.authMode=mode;

  const loginTab=$("loginTab");
  const signupTab=$("signupTab");
  const signupFields=$("signupFields");
  const title=$("authTitle");
  const subtitle=$("authSubtitle");
  const submit=$("authSubmit");

  if(mode==="login"){
    loginTab?.classList.add("active");
    signupTab?.classList.remove("active");
    signupFields?.classList.add("hidden");

    if(title){
      title.textContent="Welcome back.";
    }

    if(subtitle){
      subtitle.textContent="Connect, chat, call and play in one place.";
    }

    if(submit){
      submit.textContent="Login";
    }

    return;
  }

  signupTab?.classList.add("active");
  loginTab?.classList.remove("active");
  signupFields?.classList.remove("hidden");

  if(title){
    title.textContent="Create your account.";
  }

  if(subtitle){
    subtitle.textContent="Choose your identity and join NEXORA.";
  }

  if(submit){
    submit.textContent="Create account";
  }
}

async function loginUser(){
  const email=$("authEmail")?.value.trim();
  const password=$("authPassword")?.value;

  if(!email||!password){
    toast("Enter your email and password.");
    return;
  }

  const button=$("authSubmit");

  setButtonLoading(button,true);

  try{
    const result=await client.auth.signInWithPassword({
      email,
      password
    });

    if(result.error){
      throw result.error;
    }

    toast("Welcome back.");
  }catch(error){
    toast(error?.message||"Login failed.");
  }finally{
    setButtonLoading(button,false);
  }
}

async function signupUser(){
  const email=$("authEmail")?.value.trim();
  const password=$("authPassword")?.value;

  const username=$("authUsername")?.value.trim().toLowerCase();
  const displayName=$("authDisplayName")?.value.trim();

  if(!email||!password||!username){
    toast("Fill all required fields.");
    return;
  }

  if(!/^[a-z0-9_]{3,24}$/.test(username)){
    toast("Username must be 3–24 characters.");
    return;
  }

  if(password.length<6){
    toast("Password must be at least 6 characters.");
    return;
  }

  const button=$("authSubmit");

  setButtonLoading(button,true);

  try{
    const result=await client.auth.signUp({
      email,
      password,
      options:{
        data:{
          username,
          display_name:displayName||username
        }
      }
    });

    if(result.error){
      throw result.error;
    }

    if(result.data?.session){
      await ensureProfile(
        username,
        displayName||username
      );

      toast("Account created.");
    }else{
      toast("Check your email to confirm your account.");
    }
  }catch(error){
    toast(error?.message||"Could not create account.");
  }finally{
    setButtonLoading(button,false);
  }
}

async function guestLogin(){
  const button=$("guestButton");

  setButtonLoading(button,true);

  try{
    const result=await client.auth.signInAnonymously();

    if(result.error){
      throw result.error;
    }
  }catch(error){
    toast(
      error?.message||
      "Guest mode is currently unavailable."
    );
  }finally{
    setButtonLoading(button,false);
  }
}

/* =========================================================
   PROFILE
   ========================================================= */

async function ensureProfile(
  preferredUsername=null,
  preferredDisplayName=null
){
  if(!NEXORA.user){
    return null;
  }

  const user=NEXORA.user;

  const existing=await client
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(existing.error){
    throw existing.error;
  }

  let profile=existing.data;

  if(!profile){
    let username=
      preferredUsername||
      user.user_metadata?.username||
      `user_${user.id.slice(0,8)}`;

    let displayName=
      preferredDisplayName||
      user.user_metadata?.display_name||
      username;

    username=String(username)
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"")
      .slice(0,24);

    if(username.length<3){
      username=`user_${user.id.slice(0,8)}`;
    }

    const created=await client
      .from("profiles")
      .insert({
        id:user.id,
        username,
        display_name:displayName,
        is_guest:user.is_anonymous===true,
        online:true,
        last_seen:nowISO()
      })
      .select("*")
      .single();

    if(created.error){
      throw created.error;
    }

    profile=created.data;
  }else{
    const updated=await client
      .from("profiles")
      .update({
        online:true,
        last_seen:nowISO()
      })
      .eq("id",user.id)
      .select("*")
      .single();

    if(!updated.error&&updated.data){
      profile=updated.data;
    }
  }

  NEXORA.profile=profile;

  updateProfileButton();

  return profile;
}

function updateProfileButton(){
  const button=$("profileButton");

  if(!button||!NEXORA.profile){
    return;
  }

  if(NEXORA.profile.avatar_url){
    button.innerHTML=
      `<img src="${safeText(NEXORA.profile.avatar_url)}" alt="">`;
  }else{
    button.textContent=
      initials(
        NEXORA.profile.display_name||
        NEXORA.profile.username
      );
  }
}

async function setOnline(value){
  if(!NEXORA.user){
    return;
  }

  try{
    await client
      .from("profiles")
      .update({
        online:value,
        last_seen:nowISO()
      })
      .eq("id",NEXORA.user.id);
  }catch{}
}

/* =========================================================
   SESSION BOOT
   ========================================================= */

async function bootSession(){
  try{
    const result=await client.auth.getSession();

    if(result.error){
      throw result.error;
    }

    await handleSession(result.data.session);
  }catch(error){
    console.error(error);
    showAuth();
  }
}

async function handleSession(session){
  NEXORA.session=session;
  NEXORA.user=session?.user||null;

  if(!session?.user){
    await shutdownRealtime();
    showAuth();
    return;
  }

  try{
    await ensureProfile();
    showApplication();
    await startRealtime();
    await renderPage();
  }catch(error){
    console.error(error);
    toast(error?.message||"Could not start NEXORA.");
  }
}

function showAuth(){
  $("authScreen")?.classList.remove("hidden");
  $("appShell")?.classList.add("hidden");
}

function showApplication(){
  $("authScreen")?.classList.add("hidden");
  $("appShell")?.classList.remove("hidden");
}

/* =========================================================
   NAVIGATION
   ========================================================= */

function setPage(page){
  if(!page){
    return;
  }

  if(NEXORA.page!==page){
    NEXORA.previousPage=NEXORA.page;
  }

  NEXORA.page=page;

  qsa(".nav-item").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.page===page
    );
  });

  renderPage();
}

function back(){
  if(NEXORA.page==="chat"){
    setPage(NEXORA.previousPage||"recent");
    return;
  }

  if(NEXORA.page==="game"){
    leaveCurrentGame(false);
    setPage("games");
    return;
  }

  if(NEXORA.page==="connect-result"){
    setPage("connect");
    return;
  }

  setPage("home");
}

async function renderPage(){
  const main=$("main");

  if(!main){
    return;
  }

  if(NEXORA.page==="home"){
    await renderHome();
    return;
  }

  if(NEXORA.page==="recent"){
    await renderRecent();
    return;
  }

  if(NEXORA.page==="connect"){
    await renderConnect();
    return;
  }

  if(NEXORA.page==="connect-result"){
    await renderConnect();
    return;
  }

  if(NEXORA.page==="games"){
    await renderGames();
    return;
  }

  if(NEXORA.page==="chat"){
    await renderChat();
    return;
  }

  if(NEXORA.page==="game"){
    await renderGameScreen();
    return;
  }

  await renderHome();
}

/* =========================================================
   REALTIME — GLOBAL PRESENCE
   ========================================================= */

async function startRealtime(){
  if(!NEXORA.user){
    return;
  }

  await shutdownRealtime();

  await startPresence();

  startUserSignalChannel();

  startNotificationChannel();

  startCallChannel();

  startDatabaseChannel();

  await updateLiveCount();
}

async function startPresence(){
  const channel=client.channel(
    "nexora-live-users",
    {
      config:{
        presence:{
          key:NEXORA.user.id
        }
      }
    }
  );

  NEXORA.channels.presence=channel;

  channel
    .on(
      "presence",
      {event:"sync"},
      ()=>{
        updateLiveCount();
      }
    )
    .on(
      "presence",
      {event:"join"},
      ()=>{
        updateLiveCount();
      }
    )
    .on(
      "presence",
      {event:"leave"},
      ()=>{
        updateLiveCount();
      }
    );

  await channel.subscribe(async status=>{
    if(status==="SUBSCRIBED"){
      try{
        await channel.track({
          user_id:NEXORA.user.id,
          username:NEXORA.profile?.username,
          display_name:NEXORA.profile?.display_name,
          online_at:nowISO()
        });
      }catch{}
    }
  });
}

async function updateLiveCount(){
  const channel=NEXORA.channels.presence;

  if(!channel){
    return;
  }

  try{
    const presence=channel.presenceState();

    const count=Object.keys(presence||{}).length;

    NEXORA.liveCount=count;

    qsa("[data-live-count]").forEach(element=>{
      element.textContent=
        `${count} ${count===1?"person":"people"} live`;
    });
  }catch{}
}

/* =========================================================
   USER SIGNAL CHANNEL
   Used for:
   call signalling
   direct ephemeral events
   realtime UI actions
   ========================================================= */

async function startUserSignalChannel(){
  const channel=client.channel(
    `nexora-user-${NEXORA.user.id}`,
    {
      config:{
        broadcast:{
          ack:true
        }
      }
    }
  );

  NEXORA.channels.user=channel;

  channel.on(
    "broadcast",
    {event:"signal"},
    async event=>{
      const payload=event?.payload;

      if(!payload){
        return;
      }

      if(payload.to&&payload.to!==NEXORA.user.id){
        return;
      }

      await handleSignal(payload);
    }
  );

  channel.on(
    "broadcast",
    {event:"notification"},
    event=>{
      handleLiveNotification(event?.payload);
    }
  );

  await channel.subscribe();
}

async function sendUserSignal(to,type,data={}){
  if(!to||!NEXORA.channels.user){
    return false;
  }

  try{
    await NEXORA.channels.user.send({
      type:"broadcast",
      event:"signal",
      payload:{
        to,
        from:NEXORA.user.id,
        type,
        data,
        sent_at:nowISO()
      }
    });

    return true;
  }catch(error){
    console.error(error);
    return false;
  }
}

async function sendUserNotification(to,payload){
  if(!to){
    return;
  }

  const channel=client.channel(
    `nexora-user-${to}`,
    {
      config:{
        broadcast:{
          ack:true
        }
      }
    }
  );

  try{
    await channel.subscribe();

    await channel.send({
      type:"broadcast",
      event:"notification",
      payload:{
        ...payload,
        to
      }
    });
  }catch(error){
    console.error(error);
  }finally{
    try{
      await client.removeChannel(channel);
    }catch{}
  }
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */

async function startNotificationChannel(){
  const channel=client.channel(
    `nexora-notifications-${NEXORA.user.id}`,
    {
      config:{
        broadcast:{
          ack:true
        }
      }
    }
  );

  NEXORA.channels.notifications=channel;

  channel.on(
    "broadcast",
    {event:"notification"},
    event=>{
      handleLiveNotification(event?.payload);
    }
  );

  await channel.subscribe();
}

function handleLiveNotification(payload){
  if(!payload){
    return;
  }

  if(payload.to&&payload.to!==NEXORA.user.id){
    return;
  }

  NEXORA.unreadRecent=true;

  $("recentDot")?.classList.remove("hidden");

  const type=payload.type;

  if(type==="game_invite"){
    showGameInviteNotification(payload);
    return;
  }

  if(type==="friend_request"){
    toast("New friend request.");
    return;
  }

  if(type==="friend_accepted"){
    toast("Friend request accepted.");
    return;
  }

  if(type==="call"){
    if(payload.callId){
      handleIncomingCallSignal({
        callId:payload.callId,
        callerId:payload.from||payload.callerId,
        callerProfile:payload.callerProfile
      });
    }

    return;
  }

  toast(
    payload.title||
    payload.body||
    "New notification."
  );
}

/* =========================================================
   DATABASE REALTIME
   ========================================================= */

async function startDatabaseChannel(){
  const channel=client.channel(
    `nexora-db-${NEXORA.user.id}`,
    {
      config:{
        broadcast:{
          ack:true
        }
      }
    }
  );

  NEXORA.channels.database=channel;

  channel
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"notifications",
        filter:`user_id=eq.${NEXORA.user.id}`
      },
      payload=>{
        const row=payload.new||payload.old;

        if(row?.is_read===false){
          NEXORA.unreadRecent=true;
          $("recentDot")?.classList.remove("hidden");
        }

        if(NEXORA.page==="recent"){
          renderRecent();
        }
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"calls",
        filter:`receiver_id=eq.${NEXORA.user.id}`
      },
      payload=>{
        handleCallDatabaseEvent(payload);
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"calls",
        filter:`caller_id=eq.${NEXORA.user.id}`
      },
      payload=>{
        handleCallDatabaseEvent(payload);
      }
    );

  await channel.subscribe();
}

/* =========================================================
   CALL DATABASE EVENTS
   ========================================================= */

function handleCallDatabaseEvent(payload){
  const row=payload?.new||payload?.old;

  if(!row){
    return;
  }

  if(row.receiver_id===NEXORA.user.id){
    if(
      payload.eventType==="INSERT"||
      row.status==="ringing"
    ){
      if(
        !NEXORA.call.id||
        NEXORA.call.id!==row.id
      ){
        handleIncomingCallSignal({
          callId:row.id,
          callerId:row.caller_id
        });
      }
    }
  }

  if(
    NEXORA.call.id&&
    row.id===NEXORA.call.id
  ){
    handleCallStateChange(row);
  }
}

function handleCallStateChange(row){
  if(!row){
    return;
  }

  if(row.status==="accepted"){
    if(NEXORA.call.status!=="connected"){
      NEXORA.call.status="connected";

      if(!NEXORA.call.acceptedAt){
        NEXORA.call.acceptedAt=
          row.started_at||
          nowISO();
      }

      startCallTimer();

      updateCallOverlay();
    }

    return;
  }

  if(
    row.status==="declined"||
    row.status==="cancelled"||
    row.status==="missed"||
    row.status==="ended"
  ){
    finishCallUI(row.status);
  }
}

/* =========================================================
   SIGNAL DISPATCH
   ========================================================= */

async function handleSignal(payload){
  const type=payload?.type;

  if(!type){
    return;
  }

  if(type==="call-invite"){
    handleIncomingCallSignal(payload.data||payload);
    return;
  }

  if(type==="call-accept"){
    await handleCallAcceptSignal(payload.data||payload);
    return;
  }

  if(type==="call-decline"){
    await handleCallDeclineSignal(payload.data||payload);
    return;
  }

  if(type==="call-cancel"){
    await handleCallCancelSignal(payload.data||payload);
    return;
  }

  if(type==="call-end"){
    await handleCallEndSignal(payload.data||payload);
    return;
  }

  if(type==="webrtc-offer"){
    await handleWebRTCOffer(payload);
    return;
  }

  if(type==="webrtc-answer"){
    await handleWebRTCAnswer(payload);
    return;
  }

  if(type==="webrtc-ice"){
    await handleWebRTCIce(payload);
    return;
  }

  if(type==="game-invite"){
    showGameInviteNotification(
      payload.data||payload
    );
    return;
  }
}

async function shutdownRealtime(){
  const channels=[
    NEXORA.channels.user,
    NEXORA.channels.presence,
    NEXORA.channels.notifications,
    NEXORA.channels.calls,
    NEXORA.channels.database,
    NEXORA.channels.chat,
    NEXORA.channels.game,
    NEXORA.channels.gameVoice
  ];

  for(const channel of channels){
    if(channel){
      try{
        await client.removeChannel(channel);
      }catch{}
    }
  }

  NEXORA.channels={
    user:null,
    presence:null,
    notifications:null,
    calls:null,
    database:null,
    chat:null,
    game:null,
    gameVoice:null
  };
}

async function logout(){
  try{
    await endCall("logout");

    await setOnline(false);

    if(
      NEXORA.channels.presence&&
      NEXORA.user

        await NEXORA.channels.presence.untrack();

    }

    await shutdownRealtime();

    NEXORA.session=null;
    NEXORA.user=null;
    NEXORA.profile=null;
  }catch(error){

async function sendFriendRequest(userId){
  if(!userId||userId===NEXORA.user.id){
    return;
  }

  try{
    const existing=await client
      .from("friendships")
      .select("*")
      .or(
        `and(requester_id.eq.${NEXORA.user.id},addressee_id.eq.${userId}),`+
        `and(requester_id.eq.${userId},addressee_id.eq.${NEXORA.user.id})`
      )
      .maybeSingle();

    if(existing.error){
      throw existing.error;
    }

    if(existing.data){
      if(existing.data.status==="accepted"){
        toast("You are already friends.");
        return;
      }

      if(existing.data.status==="pending"){
        toast("Friend request already exists.");
        return;
      }
    }

    const result=await client
      .from("friendships")
      .insert({
        requester_id:NEXORA.user.id,
        addressee_id:userId,
        status:"pending"
      });

    if(result.error){
      throw result.error;
    }

    await createNotification(
      userId,
      "friend_request",
      "New friend request",
      `${NEXORA.profile.display_name} sent you a friend request.`,
      {
        requester_id:NEXORA.user.id
      }
    );

    toast("Friend request sent.");
  }catch(error){
    toast(error?.message||"Could not send request.");
  }
}

async function acceptFriendRequest(friendshipId,requesterId){
  try{
    const result=await client
      .from("friendships")
      .update({
        status:"accepted",
        updated_at:nowISO()
      })
      .eq("id",friendshipId)
      .eq("addressee_id",NEXORA.user.id);

    if(result.error){
      throw result.error;
    }

    if(requesterId){
      await createNotification(
        requesterId,
        "friend_accepted",
        "Friend request accepted",
        `${NEXORA.profile.display_name} accepted your request.`,
        {}
      );
    }

    toast("Friend added.");
    renderPage();
  }catch(error){
    toast(error?.message||"Could not accept request.");
  }
}

async function rejectFriendRequest(friendshipId){
  try{
    const result=await client
      .from("friendships")
      .update({
        status:"rejected",
        updated_at:nowISO()
      })
      .eq("id",friendshipId)
      .eq("addressee_id",NEXORA.user.id);

    if(result.error){
      throw result.error;
    }

    toast("Request rejected.");
    renderPage();
  }catch(error){
    toast(error?.message||"Could not reject request.");
  }
}

  if(NEXORA.call.localStream){
    NEXORA.call.localStream
      .getTracks()
      .forEach(track=>track.stop());

      NEXORA.call.pc.onconnectionstatechange=null;
      NEXORA.call.pc.close();
    }catch{}
  }

}

async function loadHomeRecentActivity(){
  const box=$("homeRecentActivity");

  if(!box){
    return;
  }

  try{
    const result=await client
      .from("calls")
      .select("*")
      .or(
        `caller_id.eq.${NEXORA.user.id},receiver_id.eq.${NEXORA.user.id}`
      )
      .order("created_at",{ascending:false})
      .limit(5);

    if(result.error){
      throw result.error;
    }

    if(!result.data?.length){
      box.innerHTML=`
        <div class="card empty">
          Nothing here yet. Start a conversation or call.
        </div>
      `;
      return;
    }

    const ids=new Set();

    result.data.forEach(call=>{
      ids.add(
        call.caller_id===NEXORA.user.id
          ?call.receiver_id
          :call.caller_id
      );
    });

    const profileResult=await client
      .from("profiles")
      .select("*")
      .in("id",[...ids]);

    const profiles=new Map(
      (profileResult.data||[]).map(profile=>[
        profile.id,
        profile
      ])
    );

    box.innerHTML=result.data.map(call=>{

      const otherId=
        call.caller_id===NEXORA.user.id
          ?call.receiver_id
          :call.caller_id;

      const other=profiles.get(otherId);

      return `
        <div class="card activity">

          ${avatarMarkup(
            other||{display_name:"User"}
          )}

          <div class="activity-main">
            <strong>
              ${safeText(
                other?.display_name||
                "User"
              )}
            </strong>

            <small>
              ${safeText(
                getCallHistoryLabel(call)
              )}
              ·
              ${safeText(
                relativeTime(call.created_at)
              )}
            </small>
          </div>

          <button
            class="btn small"
            type="button"
            onclick="callbackUser('${safeText(other?.username||"")}')"
          >Call</button>

        </div>
      `;
    }).join("");

  }catch(error){
    console.error(error);

    box.innerHTML=`
      <div class="card empty">
        No recent activity.
      </div>
    `;
  }
}

function getCallHistoryLabel(call){
  const mine=
    call.caller_id===NEXORA.user.id;

  if(
    call.status==="accepted"||
    call.status==="ended"
  ){
    return mine
      ?"✓ Outgoing · Connected"
      :"✓ Incoming · Connected";
  }

  if(call.status==="declined"){
    return "↙ Declined";
  }

  if(call.status==="cancelled"){
    return "✕ Cancelled";
  }

  if(call.status==="missed"){
    return "❌ Missed";
  }

  return mine
    ?"📞 Outgoing"
    :"📥 Incoming";
}

    callEl("nx-call-accept").onclick = acceptIncomingCall;
    callEl("nx-call-decline").onclick = declineIncomingCall;
    callEl("nx-call-cancel").onclick = cancelOutgoingCall;
    callEl("nx-call-end").onclick = endActiveCall;
    callEl("nx-call-mute").onclick = toggleMute;
