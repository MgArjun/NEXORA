<script>
(function(){

  const BTN_ID="gvBtn";
  const POS_KEY="nexora_call_float_position";
  const HIDE_KEY="nexora_call_float_hidden";

  let btn=null;
  let dragging=false;
  let moved=false;
  let startX=0,startY=0;
  let startL=0,startT=0;
  let downTimer=null;

  function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
  }

  function createTools(){
    if(!document.getElementById("nxCallHideBtn")){
      document.body.insertAdjacentHTML("beforeend",`
        <button id="nxCallHideBtn" title="Hide call button">×</button>
        <button id="nxCallRestore" title="Show call button">🎙</button>
        <div id="nxCallDragHint">Drag karke kahin bhi rakho</div>
      `);
    }
  }

  function getSaved(){
    try{
      return JSON.parse(localStorage.getItem(POS_KEY)||"null");
    }catch(_){
      return null;
    }
  }

  function savePos(left,top){
    localStorage.setItem(
      POS_KEY,
      JSON.stringify({
        left:Math.round(left),
        top:Math.round(top)
      })
    );
  }

  function applyPosition(){
    if(!btn)return;

    const saved=getSaved();

    if(saved){
      const maxL=window.innerWidth-btn.offsetWidth-4;
      const maxT=window.innerHeight-btn.offsetHeight-4;

      const l=clamp(saved.left,4,maxL);
      const t=clamp(saved.top,4,maxT);

      btn.style.left=l+"px";
      btn.style.top=t+"px";
      btn.style.right="auto";
      btn.style.bottom="auto";
    }else{
      btn.style.right="18px";
      btn.style.bottom="105px";
      btn.style.left="auto";
      btn.style.top="auto";
    }
  }

  function positionHideButton(){
    const h=document.getElementById("nxCallHideBtn");
    if(!btn||!h)return;

    const r=btn.getBoundingClientRect();

    h.style.left=Math.max(2,r.right-10)+"px";
    h.style.top=Math.max(2,r.top-10)+"px";
  }

  function setHidden(v){
    if(!btn)return;

    localStorage.setItem(HIDE_KEY,v?"1":"0");

    const h=document.getElementById("nxCallHideBtn");
    const restore=document.getElementById("nxCallRestore");

    if(v){
      btn.style.display="none";
      if(h)h.style.display="none";
      if(restore)restore.style.display="flex";
    }else{
      btn.style.display="";
      if(restore)restore.style.display="none";

      setTimeout(()=>{
        applyPosition();
        positionHideButton();
      },30);
    }
  }

  function restoreHiddenState(){
    if(localStorage.getItem(HIDE_KEY)==="1"){
      setHidden(true);
    }else{
      setHidden(false);
    }
  }

  function startDrag(e){

    if(!btn)return;

    /* only primary finger / mouse */
    if(e.pointerType==="mouse" && e.button!==0)return;

    const r=btn.getBoundingClientRect();

    startX=e.clientX;
    startY=e.clientY;
    startL=r.left;
    startT=r.top;

    dragging=true;
    moved=false;

    btn.setPointerCapture?.(e.pointerId);

    clearTimeout(downTimer);

    /* long press = show hide button */
    downTimer=setTimeout(()=>{
      if(!moved){
        positionHideButton();

        const h=document.getElementById("nxCallHideBtn");
        if(h)h.style.display="flex";
      }
    },650);

    e.preventDefault();
  }

  function moveDrag(e){

    if(!dragging||!btn)return;

    const dx=e.clientX-startX;
    const dy=e.clientY-startY;

    if(Math.abs(dx)>6 || Math.abs(dy)>6){
      moved=true;
      clearTimeout(downTimer);
    }

    const maxL=window.innerWidth-btn.offsetWidth-4;
    const maxT=window.innerHeight-btn.offsetHeight-4;

    const l=clamp(startL+dx,4,maxL);
    const t=clamp(startT+dy,4,maxT);

    btn.style.left=l+"px";
    btn.style.top=t+"px";
    btn.style.right="auto";
    btn.style.bottom="auto";

    positionHideButton();

    e.preventDefault();
  }

  function endDrag(e){

    if(!dragging)return;

    clearTimeout(downTimer);
    dragging=false;

    if(btn && moved){
      const r=btn.getBoundingClientRect();
      savePos(r.left,r.top);
    }

    if(btn){
      try{btn.releasePointerCapture?.(e.pointerId)}catch(_){}
    }
  }

  function setup(){

    btn=document.getElementById(BTN_ID);
    if(!btn)return false;

    createTools();

    btn.classList.add("nx-call-float");

    applyPosition();
    restoreHiddenState();

    /* prevent normal click after dragging */
    const oldClick=btn.onclick;

    btn.onclick=function(e){
      if(moved){
        moved=false;
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      if(oldClick)oldClick.call(this,e);
    };

    btn.addEventListener("pointerdown",startDrag,{passive:false});
    btn.addEventListener("pointermove",moveDrag,{passive:false});
    btn.addEventListener("pointerup",endDrag,{passive:false});
    btn.addEventListener("pointercancel",endDrag,{passive:false});

    const hide=document.getElementById("nxCallHideBtn");
    if(hide){
      hide.onclick=function(e){
        e.stopPropagation();
        setHidden(true);
      };
    }

    const restore=document.getElementById("nxCallRestore");
    if(restore){
      restore.onclick=function(){
        setHidden(false);
      };
    }

    window.addEventListener("resize",()=>{
      if(localStorage.getItem(HIDE_KEY)==="1")return;

      setTimeout(()=>{
        applyPosition();
        positionHideButton();
      },50);
    });

    return true;
  }

  /* gvBtn existing code se baad me create hota hai,
     isliye thoda wait */
  let tries=0;

  const wait=setInterval(()=>{
    if(setup() || ++tries>60){
      clearInterval(wait);
    }
  },250);

})();
</script>
