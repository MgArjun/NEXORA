<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>NEXORA</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#07080c;
  --surface:#101219;
  --surface2:#171a23;
  --line:rgba(255,255,255,.08);
  --text:#f7f8fc;
  --muted:#8d95a6;
  --accent:#8067ff;
  --accent2:#5e46df;
  --green:#35d58a;
  --red:#ff5d78;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.hidden{
  display:none!important;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:rgba(7,8,12,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  background:none;
  font-weight:900;
  letter-spacing:.2px;
}

.brandMark{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,#9884ff,#523bd7);
  box-shadow:0 8px 25px rgba(100,70,255,.25);
}

.topActions{
  display:flex;
  gap:7px;
}

.iconBtn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--surface);
  border:1px solid var(--line);
}

/* APP */

#app{
  width:100%;
  min-height:calc(100vh - 66px);
}

.page{
  width:min(920px,100%);
  margin:auto;
  padding:24px 16px 105px;
}

.eyebrow{
  color:#a99dff;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.8px;
}

.hero{
  padding:18px 0 4px;
}

.hero h1{
  margin:8px 0 12px;
  font-size:clamp(38px,10vw,62px);
  line-height:.96;
  letter-spacing:-3px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.section{
  margin-top:25px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}

.title{
  font-size:18px;
  font-weight:900;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
}

.stack{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row{
  display:flex;
  align-items:center;
  gap:9px;
}

.grow{
  flex:1;
}

/* BUTTONS */

.btn{
  min-height:44px;
  padding:0 16px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:850;
  box-shadow:0 8px 25px rgba(96,70,230,.18);
}

.btn.ghost{
  background:var(--surface2);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn.danger{
  background:rgba(255,93,120,.11);
  border:1px solid rgba(255,93,120,.18);
  color:#ff8197;
}

.btn.full{
  width:100%;
}

/* INPUT */

.input{
  width:100%;
  height:46px;
  padding:0 13px;
  border-radius:13px;
  outline:none;
  background:var(--surface);
  color:#fff;
  border:1px solid var(--line);
}

.input:focus{
  border-color:rgba(128,103,255,.7);
}

/* PROFILE */

.profile{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:46px;
  height:46px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#8e78ff,#5037d1);
  font-weight:900;
}

.name{
  font-weight:850;
}

.handle{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

/* GAMES */

.gameGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.gameCard{
  min-height:135px;
  padding:16px;
  text-align:left;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  transition:.18s;
}

.gameCard:hover{
  border-color:rgba(128,103,255,.4);
  transform:translateY(-2px);
}

.gameIcon{
  font-size:28px;
  margin-bottom:16px;
}

.gameTitle{
  font-weight:900;
}

.gameMeta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

/* PEOPLE */

.person{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-radius:16px;
  background:var(--surface2);
  border:1px solid var(--line);
  text-align:left;
}

.mini{
  width:39px;
  height:39px;
  flex:none;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--surface2);
  border:1px solid var(--line);
}

.online{
  color:var(--green);
}

/* NAV */

.bottomNav{
  position:fixed;
  z-index:60;
  left:50%;
  bottom:11px;
  transform:translateX(-50%);
  width:min(94%,540px);
  height:65px;
  padding:6px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(17,19,26,.94);
  backdrop-filter:blur(20px);
  border:1px solid var(--line);
  border-radius:21px;
}

.bottomNav button{
  background:none;
  color:var(--muted);
  border-radius:15px;
  font-size:10px;
  font-weight:800;
}

.bottomNav button b{
  display:block;
  margin-bottom:2px;
  font-size:18px;
}

.bottomNav button.active{
  color:#fff;
  background:rgba(128,103,255,.14);
}

/* MODAL / SHEET */

.modalLayer{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.64);
  backdrop-filter:blur(10px);
}

.sheet{
  width:min(100%,570px);
  max-height:90vh;
  overflow:auto;
  padding:19px;
  background:#11131a;
  border:1px solid var(--line);
  border-radius:27px 27px 0 0;
  box-shadow:0 -25px 80px rgba(0,0,0,.5);
}

@media(min-width:700px){
  .modalLayer{
    align-items:center;
  }

  .sheet{
    border-radius:27px;
  }
}

/* EMPTY */

.empty{
  padding:42px 12px;
  text-align:center;
  color:var(--muted);
}

/* TOAST */

.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:92px;
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  padding:10px 14px;
  background:#1c1f28;
  border:1px solid var(--line);
  border-radius:13px;
  font-size:13px;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* AUTH */

.authPage{
  width:min(520px,100%);
  margin:auto;
  padding:55px 20px;
}

.authPage h1{
  margin:10px 0;
  font-size:clamp(44px,12vw,70px);
  line-height:.92;
  letter-spacing:-4px;
}

.authBox{
  margin-top:25px;
}

/* DESKTOP */

@media(min-width:700px){
  .page{
    padding-left:28px;
    padding-right:28px;
  }

  .gameGrid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">

  <button class="brand" onclick="NX.go('home')">
    <span class="brandMark">N</span>
    NEXORA
  </button>

  <div class="topActions">
    <button class="iconBtn" onclick="NX.openCalls()">☎</button>
    <button class="iconBtn" onclick="NX.openNotifications()">♢</button>
  </div>

</header>

<div id="app"></div>

<nav class="bottomNav">

  <button data-nav="home" onclick="NX.go('home')">
    <b>⌂</b>
    Home
  </button>

  <button data-nav="games" onclick="NX.go('games')">
    <b>♟</b>
    Games
  </button>

  <button data-nav="messages" onclick="NX.go('messages')">
    <b>◌</b>
    Messages
  </button>

  <button data-nav="profile" onclick="NX.go('profile')">
    <b>●</b>
    Profile
  </button>

</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL =
"https://ktwluvpmzisonmootdqc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_zvKhZR56X0-3Ii1rn9AdFA_rtBalgVm";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   NEXORA CORE
========================================================= */

const NX = {

  db,

  user:null,

  profile:null,

  currentScreen:"home",

  realtimeChannel:null,

  modalNode:null,

  toastTimer:null,


  /* ---------- UTIL ---------- */

  escape(value){

    return String(value ?? "")
      .replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char]));

  },


  initial(value){

    const text =
      String(value || "N")
      .trim();

    return text
      ? text.charAt(0).toUpperCase()
      : "N";

  },


  toast(message){

    const node =
      document.getElementById("toast");

    node.textContent =
      message;

    node.classList.add("show");

    clearTimeout(this.toastTimer);

    this.toastTimer =
      setTimeout(
        () => node.classList.remove("show"),
        2400
      );

  },


  closeModal(){

    const root =
      document.getElementById("modalRoot");

    root.innerHTML = "";

  },


  modal(content){

    this.closeModal();

    const root =
      document.getElementById("modalRoot");

    root.innerHTML = `
      <div class="modalLayer"
           onclick="if(event.target===this)NX.closeModal()">

        <div class="sheet">

          ${content}

        </div>

      </div>
    `;

  },


  /* ---------- NAVIGATION ---------- */

  go(screen){

    this.currentScreen =
      screen;

    document
      .querySelectorAll("[data-nav]")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.nav === screen
        );

      });


    if(screen === "home")
      this.renderHome();

    else if(screen === "games")
      this.renderGames();

    else if(screen === "messages")
      this.renderMessages();

    else if(screen === "profile")
      this.renderProfile();

  },


  /* ---------- START ---------- */

  async boot(){

    const result =
      await this.db.auth.getSession();

    if(result.data.session){

      await this.finishLogin(
        result.data.session
      );

    }else{

      this.renderAuth();

    }


    this.db.auth.onAuthStateChange(
      async(event,session)=>{

        if(
          session &&
          !this.user
        ){

          await this.finishLogin(
            session
          );

        }

      }
    );

  },


  /* ---------- AUTH SCREEN ---------- */

  renderAuth(){

    document.getElementById("app").innerHTML = `

      <section class="authPage">

        <div class="eyebrow">
          CONNECT • CHAT • PLAY
        </div>

        <h1>
          Welcome to<br>
          NEXORA.
        </h1>

        <p class="sub">
          Friends, messages and multiplayer games
          in one simple space.
        </p>


        <div class="card authBox">

          <div class="stack">

            <button
              class="btn full"
              onclick="NX.continueGuest()">

              Continue as Guest

            </button>


            <button
              class="btn ghost full"
              onclick="NX.openAccount()">

              Login / Create account

            </button>

          </div>

        </div>

      </section>

    `;

  },


  /* ---------- GUEST ---------- */

  async continueGuest(){

    const result =
      await this.db.auth.signInAnonymously({

        options:{
          data:{
            is_guest:true,
            display_name:"NEXORA Guest"
          }
        }

      });


    if(result.error){

      this.toast(
        result.error.message
      );

      return;

    }


    await this.finishLogin(
      result.data.session
    );

  },


  /* ---------- ACCOUNT ---------- */

  openAccount(){

    this.modal(`

      <div class="sectionHead">

        <div>

          <div class="title">
            Account
          </div>

          <div class="sub">
            Login or create your NEXORA account
          </div>

        </div>

        <button
          class="mini"
          onclick="NX.closeModal()">

          ×

        </button>

      </div>


      <div class="stack">

        <input
          id="accountEmail"
          class="input"
          type="email"
          placeholder="Email">


        <input
          id="accountPassword"
          class="input"
          type="password"
          placeholder="Password">


        <button
          class="btn full"
          onclick="NX.login()">

          Login

        </button>


        <button
          class="btn ghost full"
          onclick="NX.signup()">

          Create account

        </button>

      </div>

    `);

  },


  async login(){

    const email =
      document
        .getElementById("accountEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("accountPassword")
        .value;


    const result =
      await this.db.auth.signInWithPassword({
        email,
        password
      });


    if(result.error){

      this.toast(
        result.error.message
      );

      return;

    }


    this.closeModal();

    await this.finishLogin(
      result.data.session
    );

  },


  async signup(){

    const email =
      document
        .getElementById("accountEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("accountPassword")
        .value;


    if(password.length < 6){

      this.toast(
        "Password must be at least 6 characters"
      );

      return;

    }


    const result =
      await this.db.auth.signUp({
        email,
        password
      });


    if(result.error){

      this.toast(
        result.error.message
      );

      return;

    }


    if(result.data.session){

      this.closeModal();

      await this.finishLogin(
        result.data.session
      );

    }else{

      this.toast(
        "Check your email to confirm your account"
      );

    }

  },


  /* ---------- LOGIN COMPLETE ---------- */

  async finishLogin(session){

    this.user =
      session.user;


    await this.loadProfile();


    this.go("home");


    this.startRealtime();


    if(
      this.profile &&
      (
        !this.profile.username ||
        this.profile.username.startsWith("NX_")
      )
    ){

      this.openUsernameSetup();

    }

  },


  /* ---------- PROFILE ---------- */

  async loadProfile(){

    let result =
      await this.db
        .from("profiles")
        .select("*")
        .eq("id",this.user.id)
        .maybeSingle();


    if(!result.data){

      const isGuest =
        !!this.user.is_anonymous;

      const generated =
        "NX_" +
        this.user.id
          .replaceAll("-","")
          .slice(0,8)
          .toUpperCase();


      const insert =
        await this.db
          .from("profiles")
          .insert({

            id:this.user.id,

            username:generated,

            display_name:
              isGuest
              ? "Guest"
              : "NEXORA User",

            is_guest:isGuest,

            online:true,

            last_seen:
              new Date().toISOString()

          })
          .select()
          .single();


      if(insert.error){

        this.toast(
          insert.error.message
        );

        return;

      }


      result.data =
        insert.data;

    }else{

      await this.db
        .from("profiles")
        .update({

          online:true,

          last_seen:
            new Date().toISOString()

        })
        .eq("id",this.user.id);

    }


    this.profile =
      result.data;

  },


  /* ---------- USERNAME SETUP ---------- */

  openUsernameSetup(){

    this.modal(`

      <div class="eyebrow">
        YOUR NEXORA ID
      </div>

      <h2 style="margin:7px 0">
        Choose your username
      </h2>

      <p class="sub">
        People can use this username to
        message, call and invite you.
      </p>


      <div class="stack" style="margin-top:16px">

        <input
          id="newUsername"
          class="input"
          maxlength="24"
          placeholder="username"
          value="${this.escape(
            this.profile?.username?.startsWith("NX_")
            ? ""
            : this.profile?.username || ""
          )}">


        <input
          id="newDisplayName"
          class="input"
          maxlength="40"
          placeholder="Display name"
          value="${this.escape(
            this.profile?.display_name || ""
          )}">


        <button
          class="btn full"
          onclick="NX.saveUsername()">

          Save

        </button>

      </div>

    `);

  },


  async saveUsername(){

    const username =
      document
        .getElementById("newUsername")
        .value
        .trim()
        .toLowerCase();

    const displayName =
      document
        .getElementById("newDisplayName")
        .value
        .trim();


    if(!/^[a-z0-9_]{3,24}$/.test(username)){

      this.toast(
        "Use 3–24 letters, numbers or underscore"
      );

      return;

    }


    const result =
      await this.db.rpc(
        "nexora_set_username",
        {
          new_username:username,
          new_display_name:
            displayName || null
        }
      );


    if(result.error){

      this.toast(
        result.error.message
      );

      return;

    }


    this.profile =
      result.data;


    this.closeModal();

    this.go(
      this.currentScreen
    );


    this.toast(
      "Username saved"
    );

  },


  /* =========================================================
     HOME
  ========================================================= */

  renderHome(){

    document.getElementById("app").innerHTML = `

      <main class="page">

        <div class="eyebrow">
          CONNECT • CHAT • PLAY
        </div>


        <section class="hero">

          <h1>
            Everything,<br>
            without the clutter.
          </h1>

          <p class="sub">
            Friends first. Games when you want them.
            Extra controls stay inside simple options.
          </p>

        </section>


        <section class="card profile">

          <div class="avatar">
            ${this.initial(
              this.profile?.display_name
            )}
          </div>


          <div class="grow">

            <div class="name">
              ${this.escape(
                this.profile?.display_name ||
                "NEXORA User"
              )}
            </div>

            <div class="handle">
              @${this.escape(
                this.profile?.username ||
                "guest"
              )}
            </div>

          </div>


          <button
            class="btn ghost"
            onclick="NX.openUsernameSetup()">

            Edit

          </button>

        </section>


        <section class="section">

          <div class="sectionHead">

            <div class="title">
              Play
            </div>

            <button
              class="btn ghost"
              onclick="NX.go('games')">

              View all

            </button>

          </div>


          <div class="gameGrid">

            <button
              class="gameCard"
              onclick="NX.openGame('ludo')">

              <div class="gameIcon">
                🎲
              </div>

              <div class="gameTitle">
                Ludo
              </div>

              <div class="gameMeta">
                2–4 players
              </div>

            </button>


            <button
              class="gameCard"
              onclick="NX.openGame('four')">

              <div class="gameIcon">
                ⭕
              </div>

              <div class="gameTitle">
                Four in a Row
              </div>

              <div class="gameMeta">
                5×5
              </div>

            </button>

          </div>

        </section>


        <section class="section">

          <div class="sectionHead">

            <div class="title">
              People
            </div>

            <button
              class="btn ghost"
              onclick="NX.openPeople()">

              Open

            </button>

          </div>


          <div class="card">

            <div class="name">
              Find someone by username
            </div>

            <div class="sub">
              Message, call or invite people
              without filling the screen with controls.
            </div>

          </div>

        </section>

      </main>

    `;

  },


  /* =========================================================
     GAMES
  ========================================================= */

  renderGames(){

    document.getElementById("app").innerHTML = `

      <main class="page">

        <div class="sectionHead">

          <div>

            <div class="title">
              Games
            </div>

            <div class="sub">
              Pick a game. Multiplayer options
              appear only when needed.
            </div>

          </div>

        </div>


        <div class="gameGrid">

          <button
            class="gameCard"
            onclick="NX.openGame('ludo')">

            <div class="gameIcon">
              🎲
            </div>

            <div class="gameTitle">
              Ludo
            </div>

            <div class="gameMeta">
              2–4 players
            </div>

          </button>


          <button
            class="gameCard"
            onclick="NX.openGame('four')">

            <div class="gameIcon">
              ⭕
            </div>

            <div class="gameTitle">
              Four in a Row
            </div>

            <div class="gameMeta">
              5×5
            </div>

          </button>


          <button
            class="gameCard"
            onclick="NX.comingSoon('UNO')">

            <div class="gameIcon">
              🃏
            </div>

            <div class="gameTitle">
              UNO
            </div>

            <div class="gameMeta">
              Coming soon
            </div>

          </button>


          <button
            class="gameCard"
            onclick="NX.comingSoon('More games')">

            <div class="gameIcon">
              ✦
            </div>

            <div class="gameTitle">
              More
            </div>

            <div class="gameMeta">
              Coming soon
            </div>

          </button>

        </div>

      </main>

    `;

  toggleFriend(user,button){

    this.selectedFriends =

    const index =

    if(index >= 0){

      if(

  async createFriendRoom(game){

    if(
      !this.selectedFriends ||
      !this.selectedFriends.length
    ){

      this.toast(
        "Select at least one friend"
      );

      return;

    }


    const maxPlayers =
      game === "ludo"
      ? 4
      : 2;


    const roomCode =
      Math.random()
        .toString(36)
        .slice(2,8)
        .toUpperCase();


    const room =
      await this.db
        .from("game_rooms")
        .insert({

          game_type:game,

          room_code:roomCode,

          host_id:this.user.id,

          status:"waiting",

          max_players:maxPlayers

        })
        .select()
        .single();


    if(room.error){

      this.toast(
        room.error.message
      );

      return;

    }


    const join =
      await this.db
        .from("game_players")
        .insert({

          room_id:room.data.id,

          user_id:this.user.id,

          player_number:1

        });


    if(join.error){

      this.toast(
        join.error.message
      );

      return;

    }


    this.activeRoom =
      room.data;

    this.selectedFriends.forEach(
      (friend,index)=>{

        this.sendGameInvite(
          room.data,
          friend,
          index+2
        );

      }
    );


    this.openRoom(room.data);

  },

        "Invite:",
        result.error.message
      );

    }

  async refreshRoom(){

    if(!this.activeRoom)
      return;


    const result =
      await this.db
        .from("game_players")
        .select(`
          user_id,
          player_number,
          profiles(
            username,
            display_name,
            online
          )
        `)
        .eq(
          "room_id",
          this.activeRoom.id
        )
        .order(
          "player_number"
        );


    if(result.error){

      console.warn(
        result.error.message
      );

      return;

    }


    const players =
      result.data || [];


    const count =
      document.getElementById(
        "roomPlayerCount"
      );


    if(count){

      count.textContent =
        `${players.length} / ${this.activeRoom.max_players}`;

    }


    const list =
      document.getElementById(
        "roomPlayers"
      );


    if(list){

      list.innerHTML =
        players.map(player=>{

          const p =
            player.profiles || {};

          const host =
            player.user_id ===
            this.activeRoom.host_id;


          return `

            <div class="person">

              <div class="avatar">
                ${this.initial(
                  p.display_name
                )}
              </div>


              <div class="grow">

                <div class="name">
                  ${this.escape(
                    p.display_name ||
                    "Player"
                  )}
                </div>

                <div class="handle">
                  @${this.escape(
                    p.username || ""
                  )}
                </div>

              </div>


              <span
                class="${
                  p.online

                }"
                style="font-size:11px">

                ${host
                  ? "HOST"
                  : p.online
                    ? "ONLINE"
                    : "OFFLINE"}

              </span>

            </div>

          `;

        }).join("");

    }


    const start =
      document.getElementById(
        "roomStartButton"
      );


    if(start){

      const isHost =
        this.activeRoom.host_id ===
        this.user.id;


      start.disabled =
        !isHost ||
        players.length < 2 ||
        this.activeRoom.status !== "waiting";


      start.style.opacity =
        start.disabled ? ".45" : "1";


      start.textContent =
        !isHost
        ? "Waiting for host"
        : players.length < 2
          ? "Waiting for players"
          : "Start Match";

    }

  },


  subscribeRoom(){

    if(this.roomChannel){

      this.db.removeChannel(
        this.roomChannel
      );

    }


    const roomId =
      this.activeRoom.id;


    this.roomChannel =
      this.db
        .channel(
          "room-" + roomId
        )


        .on(
          "postgres_changes",
          {
            event:"*",
            schema:"public",
            table:"game_players",
            filter:
              `room_id=eq.${roomId}`
          },
          ()=>this.refreshRoom()
        )


        .on(
          "postgres_changes",
          {
            event:"UPDATE",
            schema:"public",
            table:"game_rooms",
            filter:
              `id=eq.${roomId}`
          },
          payload=>{

            if(
              payload.new.status ===
              "playing"
            ){

              this.closeModal();

              this.toast(
                "Match started"
              );

              this.startLudoMatch();

            }else{

              this.refreshRoom();

            }

          }
        )


        .subscribe();

  },

     Full rules/animation/online sync come in later parts.

  startLudoMatch(){

    this.ludo = {

      turn:0,

      players:2,

      positions:[0,0],

      roll:null,

      finished:false

    };


    this.renderLudo();

  },


  startRobot(game){

    this.closeModal();

    if(game === "ludo"){

      this.ludo = {

        turn:0,

        players:2,

        positions:[0,0],

        roll:null,

        finished:false,

        robot:true

      };

      this.renderLudo();

    }else{

      this.startFourLocal();

    }

  },


  renderLudo(){

    const game =
      this.ludo;


    if(!game)
      return;


    const path =
      Array.from(
        {length:52},
        (_,i)=>{

          const x =
            (i % 13) * 7.45 + 1.5;

          const y =
            Math.floor(i / 13) * 24 + 1.5;


          return `

            <div
              style="
                position:absolute;
                left:${x}%;
                top:${y}%;
                width:6.5%;
                height:21%;
                border:1px solid rgba(255,255,255,.07);
                background:${
                  i%13===0
                  ?"rgba(128,103,255,.20)"
                  :"#151821"
                };
                border-radius:6px;
              "
            ></div>

          `;

        }
      ).join("");


    const tokens =
      game.positions.map(
        (position,index)=>{

          const p =
            Math.min(
              position,
              51
            );


          const x =
            (p % 13) * 7.45 + 4.7;

          const y =
            Math.floor(p / 13) * 24 + 5.5;


          const color =
            index === 0
            ? "#e94b55"
            : "#4d7cff";


          return `

            <div
              style="
                position:absolute;
                left:${x}%;
                top:${y}%;
                width:26px;
                height:26px;
                border-radius:50%;
                background:${color};
                border:2px solid white;
                transform:translate(-50%,-50%);
                box-shadow:0 5px 18px rgba(0,0,0,.5);
              "
            ></div>

          `;

        }
      ).join("");


    document.getElementById("app").innerHTML = `

      <main class="page">

        <div class="sectionHead">

          <div>

            <div class="title">
              Ludo
            </div>

            <div class="sub">
              ${
                game.robot
                ? "You vs Robot"
                : "Online match"
              }
            </div>

          </div>


          <button
            class="btn ghost"
            onclick="NX.go('games')">

            Exit

          </button>

        </div>


        <div class="card">

          <div
            style="
              position:relative;
              width:100%;
              aspect-ratio:1;
              background:#0d0f15;
              border-radius:18px;
              overflow:hidden;
            "
          >

            ${path}

            ${tokens}

          </div>

        </div>


        <div
          class="card"
          style="
            margin-top:12px;
            text-align:center;
          "
        >

          <div class="sub">

            ${
              game.roll
              ? `Rolled ${game.roll}`
              : "Roll the dice"
            }

          </div>


          <button
            class="btn"
            style="margin-top:10px"
            onclick="NX.rollLudo()">

            🎲 Roll Dice

          </button>

        </div>

      </main>

    `;

  },


  rollLudo(){

    const game =
      this.ludo;


    if(
      !game ||
      game.finished
    )
      return;


    game.roll =
      Math.floor(
        Math.random()*6
      ) + 1;


    game.positions[
      game.turn
    ] =
      Math.min(
        51,
        game.positions[
          game.turn
        ] + game.roll
      );


    if(
      game.positions[
        game.turn
      ] >= 51
    ){

      game.finished =
        true;


      this.toast(
        game.turn === 0
        ? "You win!"
        : "Robot wins!"
      );


      this.renderLudo();

      return;

    }


    if(game.roll !== 6){

      game.turn =
        game.turn === 0
        ? 1
        : 0;

    }


    this.renderLudo();


    if(
      game.robot &&
      game.turn === 1 &&
      !game.finished
    ){

      setTimeout(
        ()=>this.rollLudo(),
        700
      );

    }

  },

  startFourLocal(){

    this.closeModal();

    this.four = {

      board:Array(25).fill(""),

  renderFour(){

    const game =
      this.four;


    document.getElementById("app").innerHTML = `

      <main class="page">

        <div class="sectionHead">

          <div>

            <div class="title">
              Four in a Row
            </div>

            <div class="sub">
              5×5 · ${game.turn}'s turn
            </div>

          </div>


          <button
            class="btn ghost"
            onclick="NX.go('games')">

          </button>

        </div>


        <div class="card">

          <div
            style="
              display:grid;
              grid-template-columns:repeat(5,1fr);
              gap:6px;
            "
          >

            ${game.board.map(
              (value,index)=>`

                <button
                  style="
                    aspect-ratio:1;
                    border-radius:13px;
                    background:#171a23;
                    border:1px solid var(--line);
                    font-size:28px;
                    font-weight:900;
                  "
                  onclick="NX.fourMove(${index})">

    `;

  fourMove(index){

    const game =
      this.four;


    if(
      game.over ||
      game.board[index]
    )
      return;


    game.board[index] =
      game.turn;


    const dirs = [

      [1,0],
      [0,1],
      [1,1],
      [1,-1]

    ];


    const won =
      dirs.some(
        ([dx,dy])=>{

          let count = 1;


          for(
            const direction
            of [-1,1]
          ){

            let x =
              index % 5 +
              dx * direction;

            let y =
              Math.floor(index/5) +
              dy * direction;


            while(

              x>=0 &&
              x<5 &&
              y>=0 &&
              y<5 &&
              game.board[
                y*5+x
              ] === game.turn

            ){

              count++;

              x +=
                dx * direction;

              y +=
                dy * direction;

            }

          }


          return count >= 4;

        }
      );


    if(won){

      game.over =
        true;

      this.toast(
        `${game.turn} wins!`
      );

      this.renderFour();

      return;

    }


    if(
      game.board.every(Boolean)
    ){

      game.over =
        true;

      this.toast(
        "Draw"
      );

      this.renderFour();

      return;

    }


    game.turn =
      game.turn === "X"
      ? "O"
      : "X";


    this.renderFour();

  },

          onclick="NX.closeModal()">

          ×

        </button>

      </div>


      <div class="row">

        <input
          id="peopleSearch"
          class="input"
          placeholder="username">


        <button
          class="btn"
          onclick="NX.searchPeople()">

          Search

        </button>

      </div>


      <div
        id="peopleResults"
        class="stack"
        style="margin-top:12px">

        <div class="empty">
          Search for someone.
        </div>

      </div>

    `);

  },


  async searchPeople(){

    const query =
      document
        .getElementById(
          "peopleSearch"
        )
        .value
        .trim();


    if(!query){

      this.toast(
        "Enter a username"
      );

      return;

    }


    const result =
      await this.db
        .from("profiles")
        .select(
          "id,username,display_name,online"
        )
        .ilike(
          "username",
          `%${query}%`
        )
        .neq(
          "id",
          this.user.id
        )
        .limit(15);


    if(result.error){

      this.toast(
        result.error.message
      );

      return;

    }


    const box =
      document.getElementById(
        "peopleResults"
      );


    if(!result.data?.length){

      box.innerHTML = `
        <div class="empty">
          No user found.
        </div>
      `;

      return;

    }


    box.innerHTML =
      result.data.map(user=>`

        <div class="person">

          <div class="avatar">
            ${this.initial(
              user.display_name
            )}
          </div>


          <div class="grow">

            <div class="name">
              ${this.escape(
                user.display_name
              )}
            </div>

            <div class="handle">
              @${this.escape(
                user.username
              )}
              ·
              ${
                user.online
                ? `<span class="online">online</span>`
                : "offline"
              }
            </div>

          </div>


          <button
            class="mini"
            onclick='NX.openChat(${JSON.stringify(user)})'>

            💬

          </button>


          <button
            class="mini"
            onclick='NX.callUser(${JSON.stringify(user)})'>

            ☎

          </button>


          <button
            class="mini"
            onclick='NX.inviteUser(${JSON.stringify(user)})'>

            ＋

          </button>

        </div>

      `).join("");

  },


  /* ---------- BASIC CALL HOOK ---------- */

  async callUser(user){

    if(
      typeof this.startVoiceCall ===
      "function"
    ){

      return this.startVoiceCall(
        user.username
      );

    }


    const result =
      await this.db.rpc(
        "nexora_start_call",
        {
          target_username:user.username,
          call_kind:"voice"
        }
      );


    if(result.error){

      this.toast(
        result.error.message
      );

      return;

    }


    this.toast(
      "Calling " +
      user.display_name
    );

  },


  inviteUser(user){

    this.toast(
      "Open a game to invite " +
      user.display_name
    );

  },


  openChat(user){

    this.toast(
      "Messaging will open in the next module"
    );

  },


  /* =========================================================
     MESSAGES
  ========================================================= */

  async renderMessages(){

    const result =
      await this.db.rpc(
        "nexora_my_conversations"
      );


    if(result.error){

      document.getElementById(
        "app"
      ).innerHTML = `

        <main class="page">

          <div class="title">
            Messages
          </div>

          <div class="empty">
            ${this.escape(
              result.error.message
            )}
          </div>

        </main>

      `;

      return;

    }


    const conversations =
      result.data || [];


    document.getElementById(
      "app"
    ).innerHTML = `

      <main class="page">

        <div class="sectionHead">

          <div>

            <div class="title">
              Messages
            </div>

            <div class="sub">
              Conversations, calls and invites
              will stay together here.
            </div>

          </div>


          <button
            class="btn"
            onclick="NX.openPeople()">

            New

          </button>

        </div>


        ${
          conversations.length

          ? `<div class="stack">

              ${
                conversations.map(
                  conversation=>`

                    <button
                      class="person"
                      onclick="NX.openChat({
                        id:'${conversation.other_id}',
                        username:'${this.escape(conversation.other_username)}',
                        display_name:'${this.escape(conversation.other_display_name)}',
                        online:${!!conversation.other_online}
                      })">

                      <div class="avatar">
                        ${this.initial(
                          conversation.other_display_name
                        )}
                      </div>

                      <div class="grow">

                        <div class="name">
                          ${this.escape(
                            conversation.other_display_name
                          )}
                        </div>

                        <div class="handle">
                          @${this.escape(
                            conversation.other_username
                          )}
                          ·
                          ${
                            conversation.other_online
                            ? "online"
                            : "offline"
                          }
                        </div>

                        <div class="handle">
                          ${this.escape(
                            conversation.last_message ||
                            "No messages yet"
                          )}
                        </div>

                      </div>

                      <span>›</span>

                    </button>

                  `
                ).join("")
              }

            </div>`

          : `<div class="empty">
              No conversations yet.<br>
              <button
                class="btn"
                style="margin-top:12px"
                onclick="NX.openPeople()">

                Find someone

              </button>
            </div>`
        }

      </main>

    `;

  },


  /* =========================================================
     PROFILE
  ========================================================= */

  renderProfile(){

    document.getElementById("app").innerHTML = `

      <main class="page">

        <div class="sectionHead">

          <div>

            <div class="title">
              Profile
            </div>

            <div class="sub">
              Your NEXORA identity
            </div>

          </div>


          <button
            class="btn"
            onclick="NX.openUsernameSetup()">

            Edit

          </button>

        </div>


        <div class="card profile">

          <div class="avatar">
            ${this.initial(
              this.profile?.display_name
            )}
          </div>


          <div class="grow">

            <div class="name">
              ${this.escape(
                this.profile?.display_name ||
                "NEXORA User"
              )}
            </div>

            <div class="handle">
              @${this.escape(
                this.profile?.username ||
                "guest"
              )}
            </div>

          </div>


          <span class="online">
            ● online
          </span>

        </div>


        <section class="section card">

          <div class="title">
            More
          </div>


          <div
            class="stack"
            style="margin-top:12px">

            <button
              class="btn ghost full"
              onclick="NX.openPeople()">

              People & Friends

            </button>


            <button
              class="btn ghost full"
              onclick="NX.toast('Settings will be added later')">

              Settings

            </button>


            <button
              class="btn danger full"
              onclick="NX.signOut()">

              Sign out

            </button>

          </div>

        </section>

      </main>

    `;

  },


  /* =========================================================
     CALLS / NOTIFICATIONS
  ========================================================= */

  openCalls(){

    this.modal(`

      <div class="sectionHead">

        <div>

          <div class="title">
            Calls
          </div>

          <div class="sub">
            Your calls will appear here.
          </div>

        </div>

        <button
          class="mini"
          onclick="NX.closeModal()">

          ×

        </button>

      </div>


      <div class="empty">
        No active calls.
      </div>

    `);

  },


  openNotifications(){

    this.modal(`

      <div class="sectionHead">

        <div>

          <div class="title">
            Notifications
          </div>

          <div class="sub">
            Friend requests and game invites
            will appear here.
          </div>

        </div>

        <button
          class="mini"
          onclick="NX.closeModal()">

          ×

        </button>

      </div>


      <div class="empty">
        Nothing new.
      </div>

    `);

  },


  comingSoon(name){

    this.toast(
      name + " is coming soon"
    );

  },


  /* =========================================================
     REALTIME
  ========================================================= */

  startRealtime(){

    if(this.realtimeChannel)
      return;


    this.realtimeChannel =
      this.db
        .channel(
          "nexora-global-" +
          this.user.id
        )


        .on(
          "postgres_changes",
          {
            event:"INSERT",
            schema:"public",
            table:"messages"
          },
          payload=>{

            if(
              payload.new.sender_id !==
              this.user.id
            ){

              this.toast(
                "New message"
              );

            }

          }
        )


        .on(
          "postgres_changes",
          {
            event:"INSERT",
            schema:"public",
            table:"calls",
            filter:
              `receiver_id=eq.${this.user.id}`
          },
          ()=>{

            this.toast(
              "Incoming call"
            );

          }
        )


        .subscribe();

  },


  /* =========================================================
     SIGN OUT
  ========================================================= */

  async signOut(){

    if(this.user){

      await this.db
        .from("profiles")
        .update({

          online:false,

          last_seen:
            new Date().toISOString()

        })
        .eq(
          "id",
          this.user.id
        );

    }


    await this.db.auth.signOut();

    location.reload();

  }

};


/* Make available to future parts */

window.NX = NX;


/* Start */

NX.boot();

</script>

<script>
(()=>{

if(window.__NEXORA_PART2__) return;
window.__NEXORA_PART2__ = true;

const N = window.NX;
if(!N) return;


/* =========================================================
   PART 2 STATE
========================================================= */

N.chatState = {
  conversationId:null,
  other:null,
  channel:null
};

N.friendState = {
  tab:"friends"
};

N.inviteState = {
  channel:null
};


/* =========================================================
   SAFE HELPERS
========================================================= */

N.ensureUser = function(){

  if(!N.user){

    N.toast("Please login first");
    return false;

  }

  return true;

};


N.getInitial = function(name){

  return String(name || "N")
    .trim()
    .charAt(0)
    .toUpperCase() || "N";

};


/* =========================================================
   MESSAGE LIST
========================================================= */

N.renderMessages = async function(){

  if(!N.ensureUser()) return;


  const result =
    await N.db.rpc(
      "nexora_my_conversations"
    );


  if(result.error){

    document.getElementById("app").innerHTML = `

      <main class="page">

        <div class="sectionHead">

          <div>
            <div class="title">Messages</div>
            <div class="sub">
              Your conversations
            </div>
          </div>

          <button
            class="btn"
            onclick="NX.openPeople()">

            New

          </button>

        </div>

        <div class="card empty">
          ${N.escape(result.error.message)}
        </div>

      </main>

    `;

    return;

  }


  const conversations =
    result.data || [];


  document.getElementById("app").innerHTML = `

    <main class="page">

      <div class="sectionHead">

        <div>

          <div class="title">
            Messages
          </div>

          <div class="sub">
            Chats, calls and game activity
            stay together here.
          </div>

        </div>


        <button
          class="btn"
          onclick="NX.openPeople()">

          New

        </button>

      </div>


      <div class="stack">

        ${
          conversations.length

          ? conversations.map(c=>`

            <button
              class="person"
              onclick='NX.openChatById(
                ${JSON.stringify(c)}
              )'>

              <div class="avatar">
                ${N.getInitial(
                  c.other_display_name
                )}
              </div>


              <div class="grow">

                <div class="name">
                  ${N.escape(
                    c.other_display_name ||
                    c.other_username
                  )}
                </div>


                <div class="handle">

                  @${N.escape(
                    c.other_username
                  )}

                  ·

                  ${
                    c.other_online
                    ? `<span class="online">online</span>`
                    : "offline"
                  }

                </div>


                <div class="handle">

                  ${N.escape(
                    c.last_message ||
                    "Start a conversation"
                  )}

                </div>

              </div>


              <span>
                ›
              </span>

            </button>

          `).join("")

          : `

            <div class="card empty">

              <div style="font-size:30px">
                ◌
              </div>

              <div style="margin-top:10px">
                No conversations yet.
              </div>

              <button
                class="btn"
                style="margin-top:14px"
                onclick="NX.openPeople()">

                Find someone

              </button>

            </div>

          `
        }

      </div>

    </main>

  `;

};


/* =========================================================
   OPEN CHAT
========================================================= */

N.openChatById = async function(conversation){

  if(!N.ensureUser()) return;


  N.chatState.conversationId =
    conversation.conversation_id;

  N.chatState.other = {

    id:conversation.other_id,

    username:
      conversation.other_username,

    display_name:
      conversation.other_display_name,

    online:
      conversation.other_online

  };


  await N.renderChat();

};


N.openChat = async function(user){

  if(!N.ensureUser()) return;


  if(!user || !user.username){

    N.toast("User not found");
    return;

  }


  if(user.id === N.user.id){

    N.toast("You cannot message yourself");
    return;

  }


  const result =
    await N.db.rpc(
      "nexora_get_or_create_dm",
      {
        target_username:user.username
      }
    );


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  N.chatState.conversationId =
    result.data;


  N.chatState.other = user;


  N.closeModal();

  await N.renderChat();

};


/* =========================================================
   CHAT UI
========================================================= */

N.renderChat = async function(){

  const chat =
    N.chatState;


  if(!chat.conversationId){

    N.go("messages");
    return;

  }


  const result =
    await N.db
      .from("messages")
      .select(`
        id,
        sender_id,
        message,
        message_type,
        created_at
      `)
      .eq(
        "conversation_id",
        chat.conversationId
      )
      .order(
        "created_at",
        {ascending:true}
      );


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  const messages =
    result.data || [];


  document.getElementById("app").innerHTML = `

    <main
      class="page"
      style="
        padding-bottom:125px;
      "
    >

      <div class="sectionHead">

        <div class="row">

          <button
            class="mini"
            onclick="NX.go('messages')">

            ‹

          </button>


          <div>

            <div class="title">
              ${N.escape(
                chat.other.display_name ||
                chat.other.username
              )}
            </div>

            <div class="handle">

              @${N.escape(
                chat.other.username
              )}

              ·

              ${
                chat.other.online
                ? `<span class="online">online</span>`
                : "offline"
              }

            </div>

          </div>

        </div>


        <button
          class="iconBtn"
          onclick="NX.callUser(
            ${JSON.stringify(chat.other)}
          )">

          ☎

        </button>

      </div>


      <div
        id="chatMessages"
        class="stack"
        style="margin-top:16px"
      >

        ${
          messages.length

          ? messages.map(
              message=>
                N.renderMessageBubble(
                  message
                )
            ).join("")

          : `

            <div class="empty">

              <div style="font-size:28px">
                ◌
              </div>

              <div style="margin-top:8px">
                Start the conversation.
              </div>

            </div>

          `
        }

      </div>


      <div
        style="
          position:fixed;
          z-index:40;
          left:50%;
          bottom:88px;
          transform:translateX(-50%);
          width:min(94%,720px);
        "
      >

        <div
          class="card"
          style="
            padding:8px;
            display:flex;
            gap:7px;
          "
        >

          <input
            id="chatInput"
            class="input"
            placeholder="Message..."
            maxlength="2000"
            onkeydown="
              if(event.key==='Enter'){
                event.preventDefault();
                NX.sendMessage();
              }
            "
          >


          <button
            class="btn"
            onclick="NX.sendMessage()">

            Send

          </button>

        </div>

      </div>

    </main>

  `;


  N.scrollChatBottom();

  N.subscribeChat();

};


/* =========================================================
   MESSAGE BUBBLE
========================================================= */

N.renderMessageBubble = function(message){

  const mine =
    message.sender_id ===
    N.user.id;


  return `

    <div
      style="
        display:flex;
        justify-content:${
          mine
          ? "flex-end"
          : "flex-start"
        };
      "
    >

      <div
        style="
          max-width:78%;
          padding:11px 13px;
          border-radius:16px;
          background:${
            mine
            ? "linear-gradient(135deg,#8067ff,#5e46df)"
            : "#171a23"
          };
          border:1px solid ${
            mine
            ? "rgba(255,255,255,.08)"
            : "var(--line)"
          };
        "
      >

        <div
          style="
            white-space:pre-wrap;
            word-break:break-word;
            line-height:1.4;
            font-size:14px;
          "
        >

          ${N.escape(
            message.message
          )}

        </div>


        <div
          style="
            margin-top:5px;
            font-size:9px;
            opacity:.55;
            text-align:right;
          "
        >

          ${N.formatTime(
            message.created_at
          )}

        </div>

      </div>

    </div>

  `;

};


N.formatTime = function(date){

  try{

    return new Date(date)
      .toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );

  }catch{

    return "";

  }

};


N.scrollChatBottom = function(){

  setTimeout(()=>{

    const box =
      document.getElementById(
        "chatMessages"
      );

    if(box){

      box.scrollTop =
        box.scrollHeight;

      window.scrollTo(
        0,
        document.body.scrollHeight
      );

    }

  },30);

};


/* =========================================================
   SEND MESSAGE
========================================================= */

N.sendMessage = async function(){

  if(!N.ensureUser()) return;


  const input =
    document.getElementById(
      "chatInput"
    );


  if(!input) return;


  const message =
    input.value.trim();


  if(!message) return;


  if(!N.chatState.conversationId){

    N.toast(
      "Chat is not ready"
    );

    return;

  }


  input.disabled = true;


  const result =
    await N.db
      .from("messages")
      .insert({

        conversation_id:
          N.chatState.conversationId,

        sender_id:
          N.user.id,

        message,

        message_type:"text"

      });


  input.disabled = false;


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  input.value = "";

  await N.renderChat();

};


/* =========================================================
   CHAT REALTIME
========================================================= */

N.subscribeChat = function(){

  if(N.chatState.channel){

    N.db.removeChannel(
      N.chatState.channel
    );

    N.chatState.channel = null;

  }


  const conversationId =
    N.chatState.conversationId;


  if(!conversationId)
    return;


  N.chatState.channel =
    N.db
      .channel(
        "nexora-chat-" +
        conversationId
      )


      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `conversation_id=eq.${conversationId}`
        },
        payload=>{

          if(
            payload.new.sender_id !==
            N.user.id
          ){

            N.renderChat();

          }

        }
      )


      .subscribe();

};


/* =========================================================
   PEOPLE / FRIENDS
========================================================= */

N.openPeople = function(){

  N.modal(`

    <div class="sectionHead">

      <div>

        <div class="title">
          People
        </div>

        <div class="sub">
          Search by NEXORA username.
        </div>

      </div>


      <button
        class="mini"
        onclick="NX.closeModal()">

        ×

      </button>

    </div>


    <div class="row">

      <input
        id="peopleSearch"
        class="input"
        maxlength="24"
        placeholder="Search username"
        onkeydown="
          if(event.key==='Enter'){
            NX.searchPeople();
          }
        "
      >


      <button
        class="btn"
        onclick="NX.searchPeople()">

        Search

      </button>

    </div>


    <div
      id="peopleResults"
      class="stack"
      style="margin-top:12px"
    >

      <div class="empty">
        Search for a user.
      </div>

    </div>


    <div
      class="section"
      style="margin-top:18px"
    >

      <button
        class="btn ghost full"
        onclick="NX.openFriendCenter()">

        Friends & Requests

      </button>

    </div>

  `);

};


N.searchPeople = async function(){

  const input =
    document.getElementById(
      "peopleSearch"
    );


  if(!input) return;


  const query =
    input.value.trim();


  if(!query){

    N.toast("Enter a username");
    return;

  }


  const result =
    await N.db
      .from("profiles")
      .select(
        "id,username,display_name,online,last_seen"
      )
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        N.user.id
      )
      .limit(20);


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  const users =
    result.data || [];


  const box =
    document.getElementById(
      "peopleResults"
    );


  if(!users.length){

    box.innerHTML = `

      <div class="empty">

        No user found.

      </div>

    `;

    return;

  }


  box.innerHTML =
    users.map(
      user =>
        N.renderPersonSearchCard(
          user
        )
    ).join("");

};


N.renderPersonSearchCard = function(user){

  return `

    <div class="person">

      <div class="avatar">

        ${N.getInitial(
          user.display_name
        )}

      </div>


      <div class="grow">

        <div class="name">

          ${N.escape(
            user.display_name ||
            user.username
          )}

        </div>


        <div class="handle">

          @${N.escape(
            user.username
          )}

          ·

          ${
            user.online
            ? `<span class="online">online</span>`
            : "offline"
          }

        </div>

      </div>


      <button
        class="mini"
        title="Message"
        onclick='NX.openChat(
          ${JSON.stringify(user)}
        )'>

        💬

      </button>


      <button
        class="mini"
        title="Call"
        onclick='NX.callUser(
          ${JSON.stringify(user)}

========================================================= */

N.openFriendCenter = async function(){

  if(!N.ensureUser()) return;


  const result =
    await N.db
      .from("friendships")
      .select(`
        id,
        requester_id,
        addressee_id,
        status,
        created_at,
        requester:profiles!friendships_requester_id_fkey(
          id,
          username,
          display_name,
          online
        ),
        addressee:profiles!friendships_addressee_id_fkey(
          id,
          username,
          display_name,
          online
        )
      `)
      .or(
        `requester_id.eq.${N.user.id},addressee_id.eq.${N.user.id}`
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(result.error){

    N.toast(
      result.error.message

  const rows =
    result.data || [];


  const incoming =
    rows.filter(
      row =>

        row.status === "pending"
    );


  const outgoing =
    rows.filter(
      row =>
        row.requester_id ===

        row.status === "pending"

  const friends =
    rows.filter(
      row =>

        <div
          class="stack"
          style="margin-top:10px"
        >

          ${
            friends.length
            ? friends.map(
                row =>
                  N.renderFriendRow(
                    N.getFriendUser(row)

            : `
              <div class="handle">
                No friends yet.

        </div>

      <div class="card">

        <div class="name">

        <div

N.acceptGameInvite = async function(
  inviteId,
  roomId
){

  const invite =
    await N.db
      .from("game_invites")
      .update({
        status:"accepted"
      })
      .eq(
        "id",
        inviteId
      )
      .select()
      .maybeSingle();


  if(invite.error){

    N.toast(
      invite.error.message
    );

    return;

  }


  const existing =
    await N.db
      .from("game_players")
      .select("player_number")
      .eq(
        "room_id",
        roomId
      )
      .order(
        "player_number",
        {ascending:false}
      )
      .limit(1);


  const max =
    existing.data?.[0]?.player_number || 0;


  const join =
    await N.db
      .from("game_players")
      .insert({

        room_id:roomId,

        user_id:N.user.id,

        player_number:max + 1

      });


  if(join.error){

    N.toast(
      join.error.message
    );

    return;

  }


  const room =
    await N.db
      .from("game_rooms")
      .select("*")
      .eq(
        "id",
        roomId
      )
      .single();


  if(room.error){

    N.toast(
      room.error.message
    );

    return;

  }


  N.activeRoom =
    room.data;


  N.closeModal();

  N.openRoom(
    room.data
  );

};

/* =========================================================
   GLOBAL INVITE REALTIME
========================================================= */

N.startInviteRealtime = function(){

  if(!N.user)
    return;


  if(N.inviteState.channel){

    N.db.removeChannel(
      N.inviteState.channel
    );

  }


  N.inviteState.channel =
    N.db
      .channel(
        "nexora-invites-" +
        N.user.id
      )


      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"game_invites",
          filter:
            `to_user_id=eq.${N.user.id}`
        },
        payload=>{

          if(
            payload.new.status ===
            "pending"
          ){

            N.showGameInvite(
              payload.new
            );

          }

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"game_invites",
          filter:
            `to_user_id=eq.${N.user.id}`
        },
        payload=>{

          if(
            payload.new.status ===
            "accepted"
          ){

            N.toast(
              "Game invite accepted"
            );

          }

        }
      )


      .subscribe();

};

/* =========================================================
   BETTER FRIEND ROOM CREATOR
========================================================= */

N.createFriendRoom = async function(game){

  if(
    !N.selectedFriends ||
    !N.selectedFriends.length
  ){

    N.toast(
      "Select at least one friend"
    );

    return;

  }


  if(!N.ensureUser())
    return;


  const maxPlayers =
    game === "ludo"
    ? 4
    : 2;


  const roomCode =
    crypto.randomUUID()
      .replaceAll("-","")
      .slice(0,6)
      .toUpperCase();


  const roomResult =
    await N.db
      .from("game_rooms")
      .insert({

        game_type:game,

        room_code:roomCode,

        host_id:N.user.id,

        status:"waiting",

        max_players:maxPlayers

      })
      .select()
      .single();


  if(roomResult.error){

    N.toast(
      roomResult.error.message
    );

    return;

  }


  const room =
    roomResult.data;


  const hostJoin =
    await N.db
      .from("game_players")
      .insert({

        room_id:room.id,

        user_id:N.user.id,

        player_number:1

      });


  if(hostJoin.error){

    N.toast(
      hostJoin.error.message
    );

    return;

  }


  for(
    let i=0;
    i<N.selectedFriends.length;
    i++
  ){

    const friend =
      N.selectedFriends[i];


    await N.db
      .from("game_invites")
      .insert({

        room_id:room.id,

        from_user_id:N.user.id,

        to_user_id:friend.id,

        game_type:game,

        status:"pending"

      });

  }


  N.activeRoom =
    room;


  N.closeModal();

  await N.openRoom(
    room
  );

};


/* =========================================================
   ROOM JOIN SAFETY
========================================================= */

N.joinRoomByCode = async function(
  code
){

  if(!N.ensureUser())
    return;


  const clean =
    String(code || "")
      .trim()
      .toUpperCase();


  if(!clean){

    N.toast(
      "Enter room code"
    );

    return;

  }


  const result =
    await N.db
      .from("game_rooms")
      .select("*")
      .eq(
        "room_code",
        clean
      )
      .eq(
        "status",
        "waiting"
      )
      .maybeSingle();


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  if(!result.data){

    N.toast(
      "Room not found"
    );

    return;

  }


  const room =
    result.data;


  const players =
    await N.db
      .from("game_players")
      .select(
        "player_number"
      )
      .eq(
        "room_id",
        room.id
      )
      .order(
        "player_number",
        {ascending:false}
      )
      .limit(1);


  const current =
    players.data?.[0]?.player_number || 0;


  if(
    current >= room.max_players
  ){

    N.toast(
      "Room is full"
    );

    return;

  }


  const join =
    await N.db
      .from("game_players")
      .insert({

        room_id:room.id,

        user_id:N.user.id,

        player_number:current+1

      });


  if(join.error){

    N.toast(
      join.error.message
    );

    return;

  }


  N.activeRoom =
    room;


  N.closeModal();

  N.openRoom(room);

};

/* =========================================================

========================================================= */

N.refreshRoom = async function(){

  if(!N.activeRoom)
    return;


  const result =
    await N.db
      .from("game_players")
      .select(`
        user_id,
        player_number,
        profiles(
          username,
          display_name,
          online
        )
      `)
      .eq(
        "room_id",
        N.activeRoom.id
      )
      .order(
        "player_number"
      );


  if(result.error){

    console.warn(
      result.error.message
    );

    return;

  }


  const players =
    result.data || [];


  const count =
    document.getElementById(
      "roomPlayerCount"
    );


  if(count){

    count.textContent =
      `${players.length} / ${N.activeRoom.max_players}`;

  }


  const list =
    document.getElementById(
      "roomPlayers"
    );


  if(list){

    list.innerHTML =
      players.map(
        player=>{

          const p =
            player.profiles || {};


          const isHost =
            player.user_id ===
            N.activeRoom.host_id;


          return `

            <div class="person">

              <div class="avatar">
                ${N.getInitial(
                  p.display_name
                )}
              </div>


              <div class="grow">

                <div class="name">

                  ${N.escape(
                    p.display_name ||
                    "Player"
                  )}

                </div>


                <div class="handle">

                  @${N.escape(
                    p.username || ""
                  )}

                </div>

              </div>


              <span
                style="
                  font-size:10px;
                  font-weight:900;
                "
                class="${
                  p.online
                  ? "online"
                  : ""
                }"
              >

                ${
                  isHost
                  ? "HOST"
                  : p.online
                    ? "ONLINE"
                    : "OFFLINE"
                }

              </span>

            </div>

          `;

        }
      ).join("");

  }


  const start =
    document.getElementById(
      "roomStartButton"
    );


  if(start){

    const isHost =
      N.activeRoom.host_id ===
      N.user.id;


    const enough =
      players.length >= 2;


    const waiting =
      N.activeRoom.status ===
      "waiting";


    start.disabled =
      !isHost ||
      !enough ||
      !waiting;


    start.style.opacity =
      start.disabled
      ? ".5"
      : "1";


    start.textContent =
      !isHost
      ? "Waiting for host"
      : !enough
        ? "Waiting for players"
        : "Start match";

  }

};


/* =========================================================
   ROOM REALTIME
========================================================= */

N.subscribeRoom = function(){

  if(N.roomChannel){

    N.db.removeChannel(
      N.roomChannel
    );

  }


  if(!N.activeRoom)
    return;


  const roomId =
    N.activeRoom.id;


  N.roomChannel =
    N.db
      .channel(
        "nexora-room-" +
        roomId
      )


      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"game_players",
          filter:
            `room_id=eq.${roomId}`
        },
        ()=>{

          N.refreshRoom();

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"game_rooms",
          filter:
            `id=eq.${roomId}`
        },
        payload=>{

          N.activeRoom =
            {
              ...N.activeRoom,
              ...payload.new
            };


          if(
            payload.new.status ===
            "playing"
          ){

            N.closeModal();

            N.startLudoMatch();

          }else{

            N.refreshRoom();

          }

        }
      )


      .subscribe();

};


/* =========================================================
   START MATCH
========================================================= */

N.startRoomMatch = async function(){

  if(!N.activeRoom)
    return;


  if(
    N.activeRoom.host_id !==
    N.user.id
  ){

    N.toast(
      "Only the host can start"
    );

    return;

  }


  const players =
    await N.db
      .from("game_players")
      .select(
        "user_id,player_number"
      )
      .eq(
        "room_id",
        N.activeRoom.id
      )
      .order(
        "player_number"
      );


  if(players.error){

    N.toast(
      players.error.message
    );

    return;

  }


  if(
    !players.data ||
    players.data.length < 2
  ){

    N.toast(
      "Invite at least one player"
    );

    return;

  }


  const result =
    await N.db
      .from("game_rooms")
      .update({

        status:"playing",

        started_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        N.activeRoom.id
      );


  if(result.error){

    N.toast(
      result.error.message
    );

    return;

  }


  N.activeRoom.status =
    "playing";


  N.closeModal();

  N.startLudoMatch();

};

N.shareRoomCode = async function(){

    return;


  const code =
    N.activeRoom.room_code;


  const text =
    `Join my NEXORA ${N.activeRoom.game_type} room: ${code}`;


  try{

    if(
      navigator.share
    ){

      await navigator.share({

      });

    }else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        code
      );

      N.toast(

      );

    }else{

      );

    }

  }catch{

    /* user cancelled share */

  }

/* =========================================================
   GAME INVITE ACCEPT SAFETY
========================================================= */

N.acceptGameInvite = async function(
  inviteId,
  roomId
){

  if(!N.ensureUser())
    return;


  const roomResult =
    await N.db
      .from("game_rooms")
      .select("*")
      .eq(
        "id",
        roomId
      )
      .maybeSingle();


  if(roomResult.error){

    N.toast(
      roomResult.error.message
    );

    return;

  }


  if(!roomResult.data){

    N.toast(
      "Room no longer exists"
    );

    return;

  }


  const room =
    roomResult.data;


  if(
    room.status !== "waiting"
  ){

    N.toast(
      "This match has already started"
    );

    return;

  }


  const already =
    await N.db
      .from("game_players")
      .select("user_id")
      .eq(
        "room_id",
        roomId
      )
      .eq(
        "user_id",
        N.user.id
      )
      .maybeSingle();


  if(
    already.data
  ){

    N.activeRoom =
      room;

    N.closeModal();

    N.openRoom(room);

    return;

  }


  const players =
    await N.db
      .from("game_players")
      .select("player_number")
      .eq(
        "room_id",
        roomId
      )
      .order(
        "player_number",
        {ascending:false}
      )
      .limit(1);


  const last =
    players.data?.[0]?.player_number || 0;


  if(
    last >= room.max_players
  ){

    N.toast(
      "Room is full"
    );

    return;

  }


  const join =
    await N.db
      .from("game_players")
      .insert({

        room_id:roomId,

        user_id:N.user.id,

        player_number:last+1

      });


  if(join.error){

    N.toast(
      join.error.message
    );

    return;

  }


  await N.db
    .from("game_invites")
    .update({
      status:"accepted"
    })
    .eq(
      "id",
      inviteId
    );


  N.activeRoom =
    room;


  N.closeModal();

  N.openRoom(room);

};

    N.toast(
      "Select at least one player"
    );

    return;

  }


  const maxPlayers =
    game === "ludo"
    ? 4
    : 4;


  const code =
    Math.random()
      .toString(36)
      .slice(2,8)
      .toUpperCase();


  const roomResult =
    await N.db
      .from("game_rooms")
      .insert({

        game_type:game,

        room_code:code,

        host_id:N.user.id,

        status:"waiting",

        max_players:maxPlayers

      })
      .select()
      .single();


  if(roomResult.error){

    N.toast(
      roomResult.error.message
    );

    return;

  }


  const room =
    roomResult.data;


  const hostJoin =
    await N.db
      .from("game_players")
      .insert({

        room_id:room.id,

        user_id:N.user.id,

        player_number:1

      });


  if(hostJoin.error){

    N.toast(
      hostJoin.error.message
    );

    return;

  }


  for(
    let i=0;
    i<selected.length;
    i++
  ){

    const friend =
      selected[i];


    await N.db
      .from("game_invites")
      .insert({

        room_id:room.id,

        from_user_id:N.user.id,

        to_user_id:friend.id,

        game_type:game,

        status:"pending"

      });

  }


  N.activeRoom =
    room;


  N.closeModal();


  N.p3OpenLobby(room);

};
