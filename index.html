  let NXF_lastGameId=null;
  let NXF_syncTimer=null;
  let NXF_actionLock=false;
  let NXF_actionStarted=0;

  async function nxfFetchGame(forceRender=true){
    if(!window.NXCORE?.gameId)return null;

    try{
      const{data,error}=await sb
        .from("nexora_game_sessions")
        .select("*")
        .eq("id",NXCORE.gameId)
        .maybeSingle();

      if(error)throw error;

      if(data){
        NXCORE.gameSeq=Math.max(
          Number(NXCORE.gameSeq||0),
          Number(data.state_version||0)
        );

        nxApplyGameRow(data);

        if(forceRender && LUDO?.mode==="online"){
          LUDO.rolling=false;
          LUDO.busy=false;

          if(typeof updateLudo==="function"){
            updateLudo();
          }
        }
      }

      return data||null;

    }catch(e){
      return null;
    }
  }


  /*
    Server state ko continuously verify karta hai.

    Agar kisi player ka realtime event miss ho gaya,
    internet reconnect hua, tab bhi dono players
    server ke same state par aa jayenge.
  */
  function nxfStartWatch(){

    clearInterval(NXF_syncTimer);

    NXF_syncTimer=setInterval(()=>{

      if(
        !NEXORA?.user ||
        !NXCORE?.gameId ||
        !NXCORE?.gameType
      )return;

      if(NXF_lastGameId!==NXCORE.gameId){
        NXF_lastGameId=NXCORE.gameId;
        NXF_actionLock=false;
        NXF_actionStarted=0;
      }

      if(!navigator.onLine)return;

      /*
        Agar action UI me 7 sec se zyada atak gaya,
        client ko permanently locked na rehne do.
      */
      if(
        NXF_actionLock &&
        Date.now()-NXF_actionStarted>7000
      ){
        NXF_actionLock=false;
        NXCORE.actionBusy=false;
      }

      nxfFetchGame(false);

    },2500);
  }

  nxfStartWatch();


  /*
    SINGLE authoritative action.

    Online Ludo me:
    - local random dice nahi
    - local commit nahi
    - local endTurn nahi
    - local capture nahi

    Server result hi final state hai.
  */
  async function nxfAction(action,payload){

    if(!NXCORE?.gameId || !NEXORA?.user)return null;

    if(NXF_actionLock)return null;

    NXF_actionLock=true;
    NXF_actionStarted=Date.now();
    NXCORE.actionBusy=true;

    try{

      const id=crypto.randomUUID();

      const{data,error}=await sb.rpc(
        "nexora_game_action",
        {
          p_game_id:NXCORE.gameId,
          p_action_id:id,
          p_action:action,
          p_payload:payload||{}
        }
      );

      if(error)throw error;

      if(data){
        nxApplyGameRow(data);
      }

      /*
        RPC ke turant baad fresh DB state bhi lo.
        Isse realtime race/freeze avoid hota hai.
      */
      await nxfFetchGame(true);

      return data||null;

    }catch(e){

      toast(
        e.message||"Game action failed.",
        "error"
      );

      return null;

    }finally{

      NXF_actionLock=false;
      NXCORE.actionBusy=false;
      NXF_actionStarted=0;

      if(LUDO?.mode==="online"){
        LUDO.rolling=false;
        LUDO.busy=false;

        if(typeof updateLudo==="function"){
          updateLudo();
        }
      }
    }
  }


  /*
    ONLINE DICE

    Purana rnd6()+animateRoll() online game me
    ab execute nahi hoga.
  */
  window.rollLudoDice=async function(){

    const L=LUDO;

    if(!L)return;

    /*
      Robot/local game purane system se chalega.
    */
    if(L.mode!=="online"){
      if(typeof nxLegacyRollLudoDice==="function"){
        return nxLegacyRollLudoDice();
      }
      return;
    }

    if(
      L.winner ||
      L.rolling ||
      L.busy ||
      L.dice!=null
    )return;

    const current=L.players?.[L.turn];

    if(!current)return;

    /*
      Sirf jiski actual server turn hai wahi dice chala sakta hai.
    */
    if(current.id!==NEXORA.user.id)return;

    await nxfAction("roll",{});
  };

  rollLudoDice=window.rollLudoDice;


  /*
    ONLINE TOKEN MOVE

    Sirf server-confirmed dice ke baad.
  */
  window.playMove=async function(i){

    const L=LUDO;

    if(!L)return;

    if(L.mode!=="online"){
      if(typeof nxLegacyPlayMove==="function"){
        return nxLegacyPlayMove(i);
      }
      return;
    }

    if(
      L.winner ||
      L.rolling ||
      L.busy ||
      L.dice==null
    )return;

    const current=L.players?.[L.turn];

    if(!current)return;

    if(current.id!==NEXORA.user.id)return;

    if(!Number.isInteger(i)||i<0||i>3)return;

    if(
      !canMove(
        current.tokens[i],
        Number(L.dice)
      )
    )return;

    await nxfAction(
      "move",
      {token:i}
    );
  };

  playMove=window.playMove;


  /*
    Token click bhi same authoritative route use karega.
  */
  window.selectLudoToken=function(color,i){

    const L=LUDO;

    if(!L || L.mode!=="online")return;

    if(
      L.winner ||
      L.rolling ||
      L.busy ||
      L.dice==null
    )return;

    const current=L.players?.[L.turn];

    if(!current)return;

    if(current.id!==NEXORA.user.id)return;

    if(current.color!==color)return;

    if(
      canMove(
        current.tokens[i],
        Number(L.dice)
      )
    ){
      window.playMove(i);
    }
  };

  selectLudoToken=window.selectLudoToken;


  /*
    Har server update par stale local animation/lock hata do.
  */
  const nxfOldApplyLudo=window.nxApplyLudoState;

  window.nxApplyLudoState=function(st){

    if(!st)return;

    const before=NXCORE?.gameSeq||0;

    if(typeof nxfOldApplyLudo==="function"){
      nxfOldApplyLudo(st);
    }

    if(LUDO?.mode==="online"){

      LUDO.rolling=false;
      LUDO.busy=false;

      if(Number(st._version||0)>=before){

        LUDO.serverVersion=
          Number(st._version||0);

        if(typeof updateLudo==="function"){
          updateLudo();
        }
      }
    }
  };

  nxApplyLudoState=window.nxApplyLudoState;


  /* =========================================================
     2. REMATCH / RESTART FREEZE FIX
     ========================================================= */

  window.rematch=async function(kind){

    if(kind!=="ludo" && kind!=="ttt"){

      if(typeof nxRematch==="function"){
        return nxRematch(kind);
      }

      return;
    }

    if(!NXCORE?.gameId)return;

    /*
      Dono players rematch request karenge.
      Server active state banate hi fresh state pull hogi.
    */
    const row=await nxfAction(
      "rematch_request",
      {}
    );

    if(!row)return;

    const fresh=await nxfFetchGame(true);

    if(fresh?.status==="active"){

      if(kind==="ludo" && LUDO){

        LUDO.winner=null;
        LUDO.dice=null;
        LUDO.rolling=false;
        LUDO.busy=false;
        LUDO.sixes=0;

        LUDO.message=
          (LUDO.players?.[LUDO.turn]?.name||"Player")
          +" ki baari";

        /*
          Board ko fresh server state ke saath
          turant redraw karo.
        */
        if(typeof renderLudo==="function"){
          renderLudo();
        }
      }

      if(
        kind==="ttt" &&
        typeof renderTTT==="function"
      ){
        renderTTT();
      }
    }
  };

  rematch=window.rematch;


  /*
    Internet reconnect ke baad server state pull.
  */
  addEventListener(
    "online",
    ()=>{
      setTimeout(
        ()=>nxfFetchGame(true),
        400
      );
    }
  );


  /*
    App/background se wapas aane par bhi
    current server state pull.
  */
  document.addEventListener(
    "visibilitychange",
    ()=>{
      if(
        document.visibilityState==="visible" &&
        NXCORE?.gameId
      ){
        setTimeout(
          ()=>nxfFetchGame(true),
          250
        );
      }
    }
  );


  /* =========================================================
     3. RECENT
        ONE PERSON = ONE ENTRY

        Same person:
        - Chats
        - Calls
        - Missed calls
        - Incoming calls
        - Outgoing calls

        sab ek hi Recent person ke andar.
     ========================================================= */


  function nxfOtherIdFromCall(c){

    return c.caller_id===NEXORA.user.id
      ? c.receiver_id
      : c.caller_id;
  }


  function nxfCallText(c){

    const incoming=
      c.receiver_id===NEXORA.user.id;

    const map={
      missed:"Missed call",
      accepted:"Call connected",
      declined:"Call declined",
      cancelled:"Call cancelled"
    };

    return(
      incoming?"📥 ":"📞 "
    )+
    (map[c.status]||"Call");
  }


  /*
    Call ko chat thread ke andar WhatsApp-style
    activity item ki tarah dikhayega.
  */
  function nxfCallHtml(c){

    const t=
      new Date(c.created_at)
      .toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    const d=
      (
        c.status==="accepted" &&
        c.started_at &&
        c.ended_at
      )
      ? " · "+duration(
          c.started_at,
          c.ended_at
        )
      : "";

    return `
      <div
        class="msg"
        style="justify-content:center"
      >
        <div
          class="bubble"
          style="
            opacity:.82;
            text-align:center
          "
        >
          ${escapeHtml(
            nxfCallText(c)+d
          )}
          <span class="mt">
            ${t}
          </span>
        </div>
      </div>
    `;
  }


  /*
    Existing chat loader ko replace nahi,
    sirf extend kar rahe hain.

    Ab conversation + same user ke calls
    ek hi thread me load honge.
  */
  const nxfOldLoadChatMessages=
    loadChatMessages;

  window.loadChatMessages=async function(){

    const b=$("chatMessages");

    if(!b || !ACTIVE_CHAT)return;

    try{

      const[
        {data:msgs,error:me},
        {data:calls,error:ce}
      ]=await Promise.all([

        sb
          .from("messages")
          .select("*")
          .eq(
            "conversation_id",
            ACTIVE_CHAT.conversationId
          )
          .order(
            "created_at",
            {ascending:true}
          )
          .limit(300),

        sb
          .from("calls")
          .select("*")
          .or(
            `caller_id.eq.${NEXORA.user.id},receiver_id.eq.${NEXORA.user.id}`
          )
          .order(
            "created_at",
            {ascending:true}
          )
          .limit(300)
      ]);

      if(me)throw me;
      if(ce)throw ce;

      /*
        Sirf current person ke calls.
      */
      const relevantCalls=
        (calls||[]).filter(
          c=>
            nxfOtherIdFromCall(c)===
            ACTIVE_CHAT.otherId
        );


      /*
        Messages + calls ko ek timeline me merge.
      */
      const all=[

        ...(msgs||[]).map(
          x=>({
            kind:"message",
            at:x.created_at,
            row:x
          })
        ),

        ...(relevantCalls||[]).map(
          x=>({
            kind:"call",
            at:x.created_at,
            row:x
          })
        )

      ].sort(
        (a,b)=>
          new Date(a.at)-
          new Date(b.at)
      );


      b.innerHTML=
        all.length

        ? all.map(
            x=>
              x.kind==="message"
              ? messageHtml(x.row)
              : nxfCallHtml(x.row)
          ).join("")

        : `
          <div
            id="chatEmpty"
            class="chat-empty"
          >
            👋<br>
            Pehla message bhejo
          </div>
        `;

      b.scrollTop=b.scrollHeight;

    }catch(e){

      /*
        Agar call query kisi reason se fail ho,
        normal chat phir bhi chale.
      */
      if(
        typeof nxfOldLoadChatMessages===
        "function"
      ){
        return nxfOldLoadChatMessages();
      }
    }
  };

  loadChatMessages=
    window.loadChatMessages;


  /* =========================================================
     4. RECENT CONSOLIDATION
        Same person ko kabhi multiple rows nahi.
     ========================================================= */

  const nxfOldRenderRecent=
    renderRecent;

  window.renderRecent=async function(){

    try{

      $("main").innerHTML=`
        <section class="page">
          <h1 class="section-title">
            Recent
          </h1>

          <div class="section-sub">
            Your latest activity
          </div>

          <div id="recentContent">
            <div
              class="card"
              style="
                padding:22px;
                color:var(--muted)
              "
            >
              Loading…
            </div>
          </div>
        </section>
      `;


      const hidden=
        typeof nxLoadHidden==="function"
        ? await nxLoadHidden()
        : new Set();


      const[
        calls,
        notes,
        convs
      ]=await Promise.all([
        loadCalls(),
        loadNotifications(),
        loadConversations()
      ]);


      if(NEXORA.page!=="recent")return;


      /*
        Stable USER ID ko key banaya gaya hai.
        Isliye same person ki multiple entries
        nahi banengi.
      */
      const by=new Map();


      function get(
        id,
        name,
        username
      ){

        if(
          !id ||
          id===NEXORA.user.id ||
          hidden.has(id)
        ){
          return null;
        }


        let x=by.get(id);


        if(!x){

          x={
            id,
            name:name||username||"Unknown",
            username:username||"",
            latest:null,
            preview:"",
            unread:0,
            calls:0,
            open:null
          };

          by.set(id,x);
        }


        return x;
      }


      /*
        CHAT activity
      */
      (convs||[]).forEach(c=>{

        const x=get(
          c.other_id,
          c.other_display_name,
          c.other_username
        );

        if(!x)return;

        const at=
          c.last_message_at||
          c.created_at;


        if(
          !x.latest ||
          new Date(at)>
          new Date(x.latest)
        ){

          x.latest=at;

          x.preview=
            c.last_message||
            "Message";
        }


        x.unread=Math.max(
          x.unread,
          Number(
            c.unread_count||
            c.unread||
            0
          )
        );


        x.open=
          `openChat(
            '${escapeAttr(c.conversation_id)}',
            '${escapeAttr(c.other_id)}',
            '${escapeAttr(c.other_username)}',
            '${escapeAttr(c.other_display_name)}'
          )`;
      });


      /*
        Calls se user IDs collect.
      */
      const callIds=[
        ...(new Set(
          (calls||[])
            .map(nxfOtherIdFromCall)
            .filter(Boolean)
        ))
      ].filter(
        id=>id!==NEXORA.user.id
      );


      /*
        User names resolve karo.
      */
      if(callIds.length){

        const{
          data:profiles
        }=await sb
          .from("profiles")
          .select(
            "id,username,display_name"
          )
          .in(
            "id",
            callIds
          );


        (profiles||[]).forEach(p=>{

          const x=get(
            p.id,
            p.display_name,
            p.username
          );

          if(x){

            x.name=
              p.display_name||
              p.username;

            x.username=
              p.username;
          }
        });
      }


      /*
        CALL activity ko same person ke
        existing row me merge karo.
      */
      (calls||[]).forEach(c=>{

        const id=
          nxfOtherIdFromCall(c);

        const x=
          get(id,null,null);

        if(!x)return;


        x.calls++;


        if(
          !x.latest ||
          new Date(c.created_at)>
          new Date(x.latest)
        ){

          x.latest=
            c.created_at;

          x.preview=
            nxfCallText(c);
        }


        /*
          Agar is person ki conversation already hai,
          wahi chat open hogi.

          Agar nahi hai, username ke through
          normal DM create/open hoga.
        */
        if(!x.open){

          x.open=
            `openChat(
              '',
              '${escapeAttr(id)}',
              '${escapeAttr(x.username)}',
              '${escapeAttr(x.name)}'
            )`;
        }
      });


      /*
        Safety fallback.
      */
      [...by.values()].forEach(x=>{

        if(!x.open){

          x.open=
            `openChat(
              '',
              '${escapeAttr(x.id)}',
              '${escapeAttr(x.username)}',
              '${escapeAttr(x.name)}'
            )`;
        }
      });


      /*
        Latest activity first.
      */
      const rows=
        [...by.values()]
        .sort(
          (a,b)=>
            new Date(b.latest||0)-
            new Date(a.latest||0)
        );


      $("recentContent").innerHTML=

        rows.length

        ? rows.map(x=>{

            const meta=
              x.calls

              ? `${escapeHtml(
                  x.preview
                )} · ${
                  x.calls
                } call${
                  x.calls===1
                  ?""
                  :"s"
                }`

              : escapeHtml(
                  x.preview||
                  "Recent activity"
                );


            return `
              <div
                class="card row-card"
                style="cursor:pointer"
                onclick="${x.open}"
              >

                <div class="avatar">
                  ${escapeHtml(
                    initials(x.name)
                  )}
                </div>


                <div
                  style="
                    min-width:0;
                    flex:1
                  "
                >

                  <div
                    style="
                      font-weight:800
                    "
                  >
                    ${escapeHtml(x.name)}

                    ${
                      x.unread
                      ? `
                        <span class="cnt">
                          ${x.unread} unread
                        </span>
                      `
                      :""
                    }
                  </div>


                  <div
                    style="
                      color:var(--muted);
                      font-size:13px;
                      white-space:nowrap;
                      overflow:hidden;
                      text-overflow:ellipsis
                    "
                  >
                    ${meta}
                  </div>

                </div>


                <div
                  style="
                    display:flex;
                    align-items:center;
                    gap:6px
                  "
                >

                  <div
                    style="
                      color:var(--muted);
                      font-size:12px
                    "
                  >
                    ${timeAgo(x.latest)}
                  </div>


                  <button
                    class="btn"
                    style="
                      min-height:34px;
                      padding:0 9px
                    "
                    onclick="
                      event.stopPropagation();
                      nxHideRecent(
                        '${escapeAttr(x.id)}'
                      )
                    "
                  >
                    ⋯
                  </button>

                </div>

              </div>
            `;

          }).join("")

        : `
          <div
            class="card"
            style="
              padding:30px;
              text-align:center;
              color:var(--muted)
            "
          >
            Nothing here yet.
          </div>
        `;

    }catch(e){

      /*
        Emergency fallback:
        agar kisi unexpected browser error ki wajah
        se new Recent renderer fail ho, purana
        Recent screen completely dead nahi hoga.
      */
      if(
        typeof nxfOldRenderRecent===
        "function"
      ){
        return nxfOldRenderRecent();
      }
    }
  };


  renderRecent=
    window.renderRecent;

})();
</script>
<script>
/* =========================================================
   NEXORA — RECENT FINAL FIX
   1 USER = 1 SECTION
   CHAT + CALLS TOGETHER
   UNREAD DOT
   ========================================================= */

(function(){

  if(window.__NX_RECENT_FINAL_FIX__) return;
  window.__NX_RECENT_FINAL_FIX__ = true;

  /*
    Local unread-call tracking.

    Missed / declined incoming calls ko unread maana jayega.
    User jab us person ka thread open karega,
    unread dot us person ke liye clear ho jayega.
  */
  function nxUnreadCallKey(userId){
    return "nx_unread_calls_"+NEXORA.user.id+"_"+userId;
  }

  function nxGetUnreadCalls(userId){
    try{
      const v=localStorage.getItem(nxUnreadCallKey(userId));
      return v==="1";
    }catch(_){
      return false;
    }
  }

  function nxSetUnreadCalls(userId,value){
    try{
      if(value)
        localStorage.setItem(nxUnreadCallKey(userId),"1");
      else
        localStorage.removeItem(nxUnreadCallKey(userId));
    }catch(_){}
  }


  /*
    Jab chat/thread open ho:
    us person ka unread call dot clear.
  */
  const nxOldOpenChat=window.openChat;

  window.openChat=async function(
    cid,
    otherId,
    username,
    displayName
  ){

    if(otherId){
      nxSetUnreadCalls(otherId,false);
    }

    const r=nxOldOpenChat?.apply(
      this,
      arguments
    );

    /*
      Chat open hone ke baad Recent refresh.
    */
    setTimeout(()=>{
      if(
        NEXORA?.page==="recent" &&
        typeof renderRecent==="function"
      ){
        renderRecent();
      }
    },300);

    return r;
  };

  openChat=window.openChat;


  /*
    Recent renderer
  */
  window.renderRecent=async function(){

    const main=$("main");

    if(!main)return;

    main.innerHTML=`
      <section class="page">

        <h1 class="section-title">
          Recent
        </h1>

        <div class="section-sub">
          Your latest activity
        </div>

        <div id="recentContent">
          <div
            class="card"
            style="
              padding:22px;
              color:var(--muted)
            "
          >
            Loading…
          </div>
        </div>

      </section>
    `;


    try{

      const hidden=
        typeof nxLoadHidden==="function"
        ? await nxLoadHidden()
        : new Set();


      const [
        calls,
        notes,
        convs
      ]=await Promise.all([

        loadCalls(),

        loadNotifications(),

        loadConversations()

      ]);


      if(NEXORA.page!=="recent")return;


      /*
        ONE USER = ONE OBJECT
      */
      const users=new Map();


      function getUser(
        id,
        name,
        username
      ){

        if(
          !id ||
          id===NEXORA.user.id ||
          hidden.has(id)
        ){
          return null;
        }


        if(!users.has(id)){

          users.set(
            id,
            {
              id:id,

              name:
                name ||
                username ||
                "Unknown",

              username:
                username || "",

              latest:null,

              preview:
                "Recent activity",

              unreadText:0,

              unreadCall:false,

              callCount:0,

              conversationId:null
            }
          );

        }


        const u=users.get(id);


        if(name)
          u.name=name;

        if(username)
          u.username=username;


        return u;
      }


      /*
        -------------------------
        CHAT DATA
        -------------------------
      */
      (convs||[]).forEach(c=>{

        const u=getUser(
          c.other_id,
          c.other_display_name,
          c.other_username
        );

        if(!u)return;


        const at=
          c.last_message_at ||
          c.created_at;


        if(
          !u.latest ||
          new Date(at)>
          new Date(u.latest)
        ){

          u.latest=at;

          u.preview=
            c.last_message ||
            "Message";

        }


        u.unreadText=Math.max(
          u.unreadText,

          Number(
            c.unread_count ||
            c.unread ||
            0
          )
        );


        u.conversationId=
          c.conversation_id;

      });


      /*
        -------------------------
        CALL USER PROFILES
        -------------------------
      */

      const callUserIds=[
        ...new Set(
          (calls||[])
          .map(c=>
            c.caller_id===
            NEXORA.user.id
              ? c.receiver_id
              : c.caller_id
          )
          .filter(Boolean)
          .filter(id=>
            id!==NEXORA.user.id
          )
        )
      ];


      if(callUserIds.length){

        const {data:profiles}=
          await sb
          .from("profiles")
          .select(
            "id,username,display_name"
          )
          .in(
            "id",
            callUserIds
          );


        (profiles||[]).forEach(p=>{

          getUser(
            p.id,
            p.display_name,
            p.username
          );

        });

      }


      /*
        -------------------------
        CALLS
        -------------------------
      */

      (calls||[]).forEach(c=>{

        const otherId=
          c.caller_id===
          NEXORA.user.id
            ? c.receiver_id
            : c.caller_id;


        const u=
          getUser(
            otherId,
            null,
            null
          );


        if(!u)return;


        u.callCount++;


        const incoming=
          c.receiver_id===
          NEXORA.user.id;


        /*
          Incoming missed/declined call
          ko unread maana jayega.
        */
        if(
          incoming &&
          (
            c.status==="missed" ||
            c.status==="declined"
          )
        ){

          /*
            Agar ye latest call hai
            aur thread abhi open nahi hua,
            unread dot show karo.
          */
          nxSetUnreadCalls(
            otherId,
            true
          );

        }


        u.unreadCall=
          nxGetUnreadCalls(
            otherId
          );


        if(
          !u.latest ||
          new Date(c.created_at)>
          new Date(u.latest)
        ){

          u.latest=
            c.created_at;


          if(
            c.status==="missed"
          ){

            u.preview=
              incoming
                ? "📞 Missed call"
                : "📞 Outgoing call";

          }else if(
            c.status==="accepted"
          ){

            u.preview=
              "📞 Call";

          }else if(
            c.status==="declined"
          ){

            u.preview=
              incoming
                ? "📞 Declined call"
                : "📞 Call declined";

          }else{

            u.preview=
              "📞 Call";

          }

        }

      });


      /*
        -------------------------
        SORT
        -------------------------
      */

      const rows=
        [...users.values()]
        .sort(
          (a,b)=>
            new Date(
              b.latest || 0
            ) -
            new Date(
              a.latest || 0
            )
        );


      /*
        -------------------------
        RENDER
        -------------------------
      */

      $("recentContent").innerHTML=

        rows.length

        ? rows.map(u=>{

            const hasUnread=
              u.unreadText>0 ||
              u.unreadCall;


            const unreadDot=
              hasUnread

              ? `
                <span
                  style="
                    display:inline-block;
                    width:9px;
                    height:9px;
                    border-radius:50%;
                    background:#5b8cff;
                    margin-left:7px;
                    vertical-align:middle;
                    box-shadow:0 0 0 3px rgba(91,140,255,.12)
                  "
                ></span>
              `

              : "";


            const unreadCount=
              u.unreadText>0

              ? `
                <span
                  class="cnt"
                  style="
                    margin-left:5px
                  "
                >
                  ${u.unreadText}
                </span>
              `

              : "";


            const meta=
              u.callCount>0

              ? `
                ${escapeHtml(
                  u.preview
                )}
                <span
                  style="
                    opacity:.55
                  "
                >
                  · ${u.callCount}
                  call${u.callCount===1?"":"s"}
                </span>
              `

              : escapeHtml(
                  u.preview ||
                  "Recent activity"
                );


            return `

              <div
                class="card row-card"
                style="
                  cursor:pointer;
                  position:relative
                "
                onclick="
                  openChat(
                    '${escapeAttr(
                      u.conversationId || ""
                    )}',
                    '${escapeAttr(u.id)}',
                    '${escapeAttr(u.username)}',
                    '${escapeAttr(u.name)}'
                  )
                "
              >

                <div class="avatar">
                  ${escapeHtml(
                    initials(u.name)
                  )}
                </div>


                <div
                  style="
                    min-width:0;
                    flex:1
                  "
                >

                  <div
                    style="
                      font-weight:850;
                      display:flex;
                      align-items:center
                    "
                  >

                    <span>
                      ${escapeHtml(
                        u.name
                      )}
                    </span>

                    ${unreadDot}

                    ${unreadCount}

                  </div>


                  <div
                    style="
                      color:var(--muted);
                      font-size:13px;
                      white-space:nowrap;
                      overflow:hidden;
                      text-overflow:ellipsis;
                      margin-top:3px
                    "
                  >
                    ${meta}
                  </div>

                </div>


                <div
                  style="
                    display:flex;
                    align-items:center;
                    gap:7px
                  "
                >

                  <div
                    style="
                      color:var(--muted);
                      font-size:12px;
                    "
                  >
                    ${timeAgo(
                      u.latest
                    )}
                  </div>


                  <button
                    class="btn"
                    style="
                      min-height:34px;
                      padding:0 9px
                    "
                    onclick="
                      event.stopPropagation();

                      nxHideRecent(
                        '${escapeAttr(u.id)}'
                      );
                    "
                  >
                    ⋯
                  </button>

                </div>

              </div>

            `;

          }).join("")

        : `

          <div
            class="card"
            style="
              padding:30px;
              text-align:center;
              color:var(--muted)
            "
          >
            Nothing here yet.
          </div>

        `;


    }catch(e){

      console.error(
        "Recent render error:",
        e
      );

      $("recentContent").innerHTML=`

        <div
          class="card"
          style="
            padding:30px;
            text-align:center;
            color:var(--muted)
          "
        >
          Could not load Recent.
        </div>

      `;

    }

  };


  renderRecent=
    window.renderRecent;


})();
</script>

  `;

<script>
/* =========================================================
   NEXORA FINAL JS CONTROLLER
========================================================= */

(function(){

  "use strict";

  /* =======================================================
     1. QUICK MATCH — OUTSIDE GAMES KO REMOVE KARNA
        Games ke andar wala kabhi hide nahi hoga.
  ======================================================= */

  function nxIsGamesPage(){
    try{
      return window.NEXORA && NEXORA.page === "games";
    }catch(_){
      return false;
    }
  }

  function nxText(el){
    return (el?.textContent || "")
      .replace(/\s+/g," ")
      .trim()
      .toLowerCase();
  }

  function nxIsQuickMatchText(el){

    const t=nxText(el);

    if(!t)return false;

    return (
      t === "quick match" ||
      t.startsWith("quick match ") ||
      t.includes("quick match ·") ||
      t.includes("quick match-") ||
      t.includes("quick match —")
    );
  }

  function nxFindQuickMatchBox(el){

    /*
      Pehle actual card/quick-card dhoondo.
      Isse poora page accidentally hide nahi hoga.
    */

    let p=el;

    for(let i=0;i<7 && p && p!==document.body;i++,p=p.parentElement){

      if(
        p.classList?.contains("quick-card") ||
        p.classList?.contains("card") ||
        p.matches?.('[onclick*="findMatch"]')
      ){
        return p;
      }
    }

    /*
      Agar heading hai aur card nahi hai,
      to uska immediate small container hide karo.
    */

    if(
      el.parentElement &&
      el.parentElement!==document.body &&
      el.parentElement!==document.querySelector("main")
    ){
      return el.parentElement;
    }

    return el;
  }

  function nxHideOutsideQuickMatch(){

    const outside=!nxIsGamesPage();

    /*
      Agar Games page hai to pehle jo hidden kiya tha
      usko restore karo.
    */

    document.querySelectorAll("[data-nx-outside-quickmatch]").forEach(el=>{
      if(!outside){
        el.style.removeProperty("display");
        el.removeAttribute("data-nx-outside-quickmatch");
      }
    });

    if(!outside){

      /*
        Games ke bahar sirf scan karna hai.
      */

      const all=document.querySelectorAll("main *");

      all.forEach(el=>{

        if(el.children.length>0)return;

        if(!nxIsQuickMatchText(el))return;

        const box=nxFindQuickMatchBox(el);

        if(
          !box ||
          box===document.querySelector("main") ||
          box.classList?.contains("page")
        ){
          return;
        }

        box.setAttribute(
          "data-nx-outside-quickmatch",
          "1"
        );

        box.style.setProperty(
          "display",
          "none",
          "important"
        );
      });
    }
  }


  /* =======================================================
     2. ALSO REMOVE ELEMENTS WHICH HAVE FINDMATCH BUTTON
        BUT TEXT DIFFERENT HAI
  ======================================================= */

  function nxHideOutsideFindMatch(){

    if(nxIsGamesPage())return;

    document
      .querySelectorAll(
        'main [onclick*="findMatch"], main button[onclick*="findMatch"]'
      )
      .forEach(btn=>{

        let box=btn;

        for(
          let i=0;
          i<6 &&
          box.parentElement &&
          box.parentElement!==document.body;
          i++
        ){

          const p=box.parentElement;

          if(
            p.classList?.contains("quick-card") ||
            p.classList?.contains("card")
          ){
            box=p;
            break;
          }

          box=p;
        }

        if(
          box &&
          !box.classList?.contains("page")
        ){

          box.setAttribute(
            "data-nx-outside-quickmatch",
            "1"
          );

          box.style.setProperty(
            "display",
            "none",
            "important"
          );
        }
      });
  }


  function nxRemoveOutsideQuickMatch(){

    nxHideOutsideQuickMatch();
    nxHideOutsideFindMatch();
  }


  /* =======================================================
     3. NAVIGATION WRAPPER
  ======================================================= */

  if(typeof window.setPage==="function"){

    const nxOldSetPage=window.setPage;

    window.setPage=function(p){

      const result=nxOldSetPage.apply(this,arguments);

      setTimeout(nxRemoveOutsideQuickMatch,20);
      setTimeout(nxRemoveOutsideQuickMatch,150);
      setTimeout(nxRemoveOutsideQuickMatch,500);
      setTimeout(nxRemoveOutsideQuickMatch,1000);

      return result;
    };
  }


  /* =======================================================
     4. RENDER FUNCTIONS WRAPPER
  ======================================================= */

  ["renderHome","renderRecent","renderConnect"].forEach(fn=>{

    if(typeof window[fn]!=="function")return;

    const old=window[fn];

    window[fn]=function(){

      const result=old.apply(this,arguments);

      setTimeout(nxRemoveOutsideQuickMatch,30);
      setTimeout(nxRemoveOutsideQuickMatch,200);
      setTimeout(nxRemoveOutsideQuickMatch,700);

      return result;
    };

  });


  /* =======================================================
     5. OBSERVER
        Agar old code baad mein Quick Match inject kare,
        tab bhi hide hoga.
  ======================================================= */

  const nxObserver=new MutationObserver(()=>{

    nxRemoveOutsideQuickMatch();

    nxApplyPremiumSymbols();

  });

  nxObserver.observe(document.body,{
    childList:true,
    subtree:true
  });


  /* =======================================================
     6. PREMIUM SYMBOL DETECTION
  ======================================================= */

  const nxEmojiRegex=
    /[\u{1F300}-\u{1FAFF}]|[🎲🃏❌⭕🔔📞♟◷◎⚡🏆🔁🎮🌐🔇🎙]/u;

  function nxApplyPremiumSymbols(){

    /*
      Quick icons ko direct premium class.
    */

    document
      .querySelectorAll(".quick-icon")
      .forEach(el=>{
        el.classList.add("nx-premium-symbol");
      });


    /*
      Ludo / game buttons.
    */

    document
      .querySelectorAll(
        ".ludo-wrap button, .game-card button, .pcard"
      )
      .forEach(el=>{

        const txt=(el.textContent||"").trim();

        if(
          txt.length<=8 &&
          nxEmojiRegex.test(txt)
        ){
          el.classList.add("nx-premium-symbol");
        }

      });


    /*
      Header / navigation icons.
    */

    document
      .querySelectorAll(
        ".icon-btn, .nav-item, .live i"
      )
      .forEach(el=>{

        if(
          nxEmojiRegex.test(
            (el.textContent||"").trim()
          ) ||
          el.classList.contains("live")
        ){
          el.classList.add("nx-premium-symbol");
        }

      });


    /*
      Avatars.
    */

    document
      .querySelectorAll(
        ".avatar, .pf-avatar, .call-avatar"
      )
      .forEach(el=>{
        el.classList.add("nx-premium-symbol");
      });


    /*
      Ludo token.
    */

    document
      .querySelectorAll(".tk b")
      .forEach(el=>{
        el.classList.add("nx-premium-symbol");
      });
  }


  /* =======================================================
     7. EXTRA 3D TILT
        Desktop mouse movement par cards halka tilt.
        Mobile par continuous animation already chalegi.
  ======================================================= */

  function nxAddTilt(){

    if(!window.matchMedia("(hover:hover)").matches)return;

    document
      .querySelectorAll(".quick-card")
      .forEach(card=>{

        if(card.dataset.nxTilt==="1")return;

        card.dataset.nxTilt="1";

        card.addEventListener("pointermove",e=>{

          const r=card.getBoundingClientRect();

          const x=(e.clientX-r.left)/r.width-.5;
          const y=(e.clientY-r.top)/r.height-.5;

          card.style.transform=
            "perspective(900px) " +
            "rotateX("+(-y*7)+"deg) " +
            "rotateY("+(x*9)+"deg) " +
            "translateY(-5px) " +
            "scale(1.015)";
        });

        card.addEventListener("pointerleave",()=>{

          card.style.transform="";

        });

      });
  }


  /* =======================================================
     8. CONTINUOUS REFRESH
        New cards render hone par animation attach hoti rahe.
  ======================================================= */

  function nxFinalRefresh(){

    nxRemoveOutsideQuickMatch();
    nxApplyPremiumSymbols();
    nxAddTilt();

  }


  /* =======================================================
     9. INITIAL + DELAYED
  ======================================================= */

  nxFinalRefresh();

  setTimeout(nxFinalRefresh,100);
  setTimeout(nxFinalRefresh,300);
  setTimeout(nxFinalRefresh,700);
  setTimeout(nxFinalRefresh,1200);
  setTimeout(nxFinalRefresh,2000);


  /* =======================================================
     10. SAFETY WATCHDOG
  ======================================================= */

  setInterval(()=>{

    nxRemoveOutsideQuickMatch();
    nxApplyPremiumSymbols();
    nxAddTilt();

  },1200);


  /* =======================================================
     11. GAMES PAGE — QUICK MATCH IS ALWAYS ALLOWED
  ======================================================= */

  document.addEventListener("visibilitychange",()=>{

    setTimeout(nxFinalRefresh,50);

  });


  /* =======================================================
     12. DEBUG
  ======================================================= */

  window.NEXORA_FINAL_UI_PATCH={
    hideQuickMatch:nxRemoveOutsideQuickMatch,
    premiumSymbols:nxApplyPremiumSymbols,
    tilt:nxAddTilt
  };

})();
</script>

<script id="NX_REAL_3D_GAME_SCRIPT">

(function(){

  "use strict";


  /* =======================================================
     1. FIND + REMOVE ONLY "QUICK MATCH" EXTRA ROW
     ======================================================= */

  function cleanQuickMatch(){

    const main=document.querySelector("main");

    if(!main)return;


    /*
      Games page mein screenshot wala:
      ⚡ Quick Match · ...
      
      Sirf uski line remove hogi.
      Ludo / UNO / Tic-Tac-Toe cards ko touch nahi karega.
    */

    main.querySelectorAll("*").forEach(el=>{

      if(el.children.length>0)return;

      const txt=(el.textContent||"")
        .replace(/\s+/g," ")
        .trim()
        .toLowerCase();

      if(
        txt==="quick match" ||
        txt.startsWith("quick match ·") ||
        txt.startsWith("quick match -") ||
        txt.startsWith("quick match —")
      ){

        let box=el;

        /*
          Small wrapper tak upar jao.
          Card ko kabhi remove nahi karna.
        */

        for(let i=0;i<4;i++){

          const p=box.parentElement;

          if(!p || p===main)break;

          if(
            p.classList.contains("quick-card") ||
            p.matches("button")
          ){
            break;
          }

          box=p;

          /*
            Agar wrapper ke andar bahut saare children hain
            to wahi correct heading container hai.
          */

          if(box.children.length>=1)break;
        }

        if(box){

          box.setAttribute(
            "data-nx-quick-remove",
            "1"
          );

        }

      }

    });

  }


  /* =======================================================
     2. CREATE REAL 3D ICONS
     ======================================================= */

  function make3DIcons(){

    document
      .querySelectorAll(".quick-card")
      .forEach(card=>{

        const old=card.querySelector(".quick-icon");

        if(!old)return;

        if(card.dataset.nx3d==="1")return;

        /*
          Existing icon text
        */

        const value=(old.textContent||"").trim();

        let type="";

        if(value.includes("🎲")){
          type="nx3d-ludo";
        }
        else if(value.includes("🃏")){
          type="nx3d-uno";
        }
        else if(
          value.includes("❌") ||
          value.includes("✕")
        ){
          type="nx3d-ttt";
        }
        else{
          type="nx3d-generic";
        }


        /*
          New 3D structure
        */

        const holder=document.createElement("div");

        holder.className="nx3d-holder";

        const obj=document.createElement("div");

        obj.className=
          "nx3d-object "+
          type;

        obj.textContent=value;

        holder.appendChild(obj);


        /*
          Replace ONLY icon.
          Card/text/buttons untouched.
        */

        old.replaceWith(holder);

        card.dataset.nx3d="1";

      });

  }


  /* =======================================================
     3. ALSO MAKE QUICK-MATCH LIGHTNING 3D IF IT REMAINS
     ======================================================= */

  function premiumLightning(){

    document
      .querySelectorAll("main *")
      .forEach(el=>{

        if(el.children.length>0)return;

        const t=(el.textContent||"").trim();

        if(t==="⚡"){

          el.style.display="inline-block";

          el.style.transformStyle="preserve-3d";

          el.style.animation=
            "nxSymbol3D 2.5s linear infinite";

          el.style.filter=
            "drop-shadow(0 5px 6px rgba(0,0,0,.45)) "+
            "drop-shadow(0 0 14px rgba(255,210,70,.55))";

        }

      });

  }


  /* =======================================================
     4. RUN
     ======================================================= */

  function NX3D_RUN(){

    cleanQuickMatch();

    make3DIcons();

    premiumLightning();

  }


  /* =======================================================
     5. INITIAL
     ======================================================= */

  NX3D_RUN();

  setTimeout(NX3D_RUN,100);
  setTimeout(NX3D_RUN,300);
  setTimeout(NX3D_RUN,700);
  setTimeout(NX3D_RUN,1200);
  setTimeout(NX3D_RUN,2000);


  /* =======================================================
     6. WHEN GAMES PAGE RENDERS AGAIN
     ======================================================= */

  const observer=new MutationObserver(()=>{

    NX3D_RUN();

  });

  observer.observe(document.body,{

    childList:true,
    subtree:true

  });


  /* =======================================================
     7. NAVIGATION KE BAAD
     ======================================================= */

  if(typeof window.setPage==="function"){

    const oldSetPage=window.setPage;

    window.setPage=function(){

      const result=oldSetPage.apply(this,arguments);

      setTimeout(NX3D_RUN,30);
      setTimeout(NX3D_RUN,200);
      setTimeout(NX3D_RUN,600);

      return result;

    };

  }


  /* =======================================================
     8. PUBLIC TEST
     ======================================================= */

  window.NEXORA_3D_GAME={
    refresh:NX3D_RUN,
    cleanQuickMatch:cleanQuickMatch,
    make3DIcons:make3DIcons
  };


})();

</script>

<script>

(function(){

"use strict";


/* =========================================================
   CREATE DICE DOTS
========================================================= */

function diceFace(n){

  const face=document.createElement("div");

  face.className="nx-dice-face";
  face.dataset.n=n;

  const layouts={
    1:[4],
    2:[2,6],
    3:[2,4,6],
    4:[1,3,7,9],
    5:[1,3,5,7,9],
    6:[1,2,3,7,8,9]
  };

  const positions=layouts[n];

  face.style.display="grid";
  face.style.gridTemplateColumns="repeat(3,1fr)";
  face.style.gridTemplateRows="repeat(3,1fr)";
  face.style.padding="8px";

  positions.forEach(pos=>{

    const dot=document.createElement("i");

    dot.className="nx-dot";

    const row=Math.floor((pos-1)/3)+1;
    const col=((pos-1)%3)+1;

    dot.style.gridRow=row;
    dot.style.gridColumn=col;

    face.appendChild(dot);

  });

  return face;
}


/* =========================================================
   REAL DICE
========================================================= */

function createDice(){

  const scene=document.createElement("div");

  scene.className="nx-real3d";

  const diceScene=document.createElement("div");

  diceScene.className="nx-dice-scene";

  const cube=document.createElement("div");

  cube.className="nx-dice-cube";

  const faces=[
    ["front",1],
    ["back",6],
    ["right",3],
    ["left",4],
    ["top",2],
    ["bottom",5]
  ];

  faces.forEach(x=>{

    const f=diceFace(x[1]);

    f.classList.add("nx-dice-"+x[0]);

    cube.appendChild(f);

  });

  diceScene.appendChild(cube);
  scene.appendChild(diceScene);

  return scene;
}


/* =========================================================
   REAL UNO CARD
========================================================= */

function createUno(){

  const scene=document.createElement("div");

  scene.className="nx-real3d";

  const uno=document.createElement("div");

  uno.className="nx-uno-scene";

  const card=document.createElement("div");

  card.className="nx-uno-card";

  const front=document.createElement("div");

  front.className="nx-uno-front";

  const back=document.createElement("div");

  back.className="nx-uno-back";

  card.appendChild(front);
  card.appendChild(back);

  const edgeTop=document.createElement("i");

  edgeTop.className="nx-uno-edge top";

  const edgeSide=document.createElement("i");

  edgeSide.className="nx-uno-edge side";

  card.appendChild(edgeTop);
  card.appendChild(edgeSide);

  uno.appendChild(card);
  scene.appendChild(uno);

  return scene;
}


/* =========================================================
   REAL 3D X
========================================================= */

function createX(){

  const scene=document.createElement("div");

  scene.className="nx-real3d";

  const x=document.createElement("div");

  x.className="nx-x-scene";

  const a=document.createElement("i");

  a.className="nx-x-bar one";

  const b=document.createElement("i");

  b.className="nx-x-bar two";

  x.appendChild(a);
  x.appendChild(b);

  scene.appendChild(x);

  return scene;
}


/* =========================================================
   REPLACE EXISTING EMOJI ICONS
========================================================= */

function buildRealIcons(){

  document.querySelectorAll(".quick-card").forEach(card=>{

    if(card.dataset.nxTrue3d==="1")return;

    const old=card.querySelector(".quick-icon");

    if(!old)return;

    const text=(old.textContent||"").trim();

    let obj=null;

    if(text.includes("🎲")){

      obj=createDice();

    }
    else if(text.includes("🃏")){

      obj=createUno();

    }
    else if(
      text.includes("❌") ||
      text.includes("✕")
    ){

      obj=createX();

    }

    if(!obj)return;

    /*
      ONLY replace icon.
      Card, title, buttons etc untouched.
    */

    old.replaceWith(obj);

    card.dataset.nxTrue3d="1";

  });

}


/* =========================================================
   REMOVE ONLY QUICK MATCH LABEL
========================================================= */

function removeQuickLabel(){

  document.querySelectorAll("main *").forEach(el=>{

    if(el.children.length)return;

    const t=(el.textContent||"")
      .replace(/\s+/g," ")
      .trim()
      .toLowerCase();

    if(
      t==="quick match" ||
      t.startsWith("quick match ·") ||
      t.startsWith("quick match -") ||
      t.startsWith("quick match —")
    ){

      let p=el;

      for(let i=0;i<3;i++){

        if(
          !p.parentElement ||
          p.parentElement.tagName==="MAIN"
        )break;

        p=p.parentElement;

      }

      p.style.setProperty(
        "display",
        "none",
        "important"
      );

    }

  });

}


/* =========================================================
   RUN
========================================================= */

function run(){

  buildRealIcons();

  removeQuickLabel();

}

run();

setTimeout(run,100);
setTimeout(run,400);
setTimeout(run,900);
setTimeout(run,1500);
setTimeout(run,2500);


/* New page/card render hone par */

new MutationObserver(()=>{

  run();

}).observe(document.body,{

  childList:true,
  subtree:true

});


window.NEXORA_TRUE_3D={

  refresh:run

};

})();

</script>

      else if(
        text.includes("❌") ||
        text.includes("✕") ||
        text.toLowerCase().includes("tic-tac-toe")
      ){

        object=createRealX();

      }


      if(!object)return;


      /*
        IMPORTANT:
        Existing old icon OR old 3D object is replaced.
      */

      if(oldIcon){

        oldIcon.replaceWith(object);

      }
      else if(old3d){

        old3d.replaceWith(object);

      }


      card.dataset.nxTrueGeometry="1";

    });

}


/* =========================================================
   RUN
========================================================= */

function NX_TRUE_3D_RUN(){

  hideQuickMatchHeader();

  buildGame3D();

}


/* =========================================================
   INITIAL
========================================================= */

NX_TRUE_3D_RUN();

setTimeout(NX_TRUE_3D_RUN,100);

setTimeout(NX_TRUE_3D_RUN,300);

setTimeout(NX_TRUE_3D_RUN,700);

setTimeout(NX_TRUE_3D_RUN,1200);

setTimeout(NX_TRUE_3D_RUN,2000);


/* =========================================================
   NEW GAME PAGE RENDER
========================================================= */

new MutationObserver(()=>{

  NX_TRUE_3D_RUN();

}).observe(
  document.body,
  {
    childList:true,
    subtree:true
  }
);


/* =========================================================
   NAVIGATION
========================================================= */

if(typeof window.setPage==="function"){

  const oldSetPage=
    window.setPage;

  window.setPage=function(){

    const result=
      oldSetPage.apply(
        this,
        arguments
      );

    setTimeout(
      NX_TRUE_3D_RUN,
      40
    );

    setTimeout(
      NX_TRUE_3D_RUN,
      300
    );

    setTimeout(
      NX_TRUE_3D_RUN,
      800
    );

    return result;

  };

}


/* =========================================================
   MANUAL REFRESH
========================================================= */

window.NEXORA_TRUE_3D_FINAL={

  refresh:NX_TRUE_3D_RUN

};


})();

</script>

<script id="NX_LUDO_MULTI_BOT_SCRIPT">

(function(){

"use strict";


/* =========================================================
   STATE
========================================================= */

let NXLM=null;


/* =========================================================
   CLOSE RANDOM MATCH SEARCH
========================================================= */

function nxCloseMM(){

  if(!NXLM)return;

  try{

    if(NXLM.timer)
      clearTimeout(NXLM.timer);

  }catch(_){}

  try{

    if(NXLM.ch)
      sb.removeChannel(NXLM.ch);

  }catch(_){}

  NXLM=null;

}


/* =========================================================
   GET PLAYERS FROM PRESENCE
========================================================= */

function nxPlayersFromPresence(ch){

  const seen={};

  Object
    .values(ch.presenceState())
    .flat()
    .forEach(p=>{

      if(
        p?.id &&
        !seen[p.id]
      ){

        seen[p.id]=p;

      }

    });

  return Object
    .values(seen)
    .sort(
      (a,b)=>
        a.t-b.t ||
        (a.id<b.id?-1:1)
    );

}


/* =========================================================
   MATCH SEARCH UI
========================================================= */

function nxLudoMMUI(target,list){

  if(!$("nxLudoMM")){

    openModal(`

      <div class="modal-title">
        🎲 Ludo Match
      </div>

      <div class="modal-sub">
        ${target} players ke liye search ho raha hai…
      </div>

      <div
        id="nxLudoMM"
        class="nx-lm-list">
      </div>

      <div
        id="nxLudoMMCount"
        class="nx-lm-count">
      </div>

      <button
        class="btn danger"
        style="width:100%"
        onclick="NX_LUDO_MULTI.cancelSearch()">

        Cancel

      </button>

    `);

  }


  const box=$("nxLudoMM");

  if(!box)return;


  box.innerHTML=list.map(
    (p,i)=>`

      <div class="nx-lm-player">

        <div class="avatar">
          ${escapeHtml(
            initials(
              p.name||"Player"
            )
          )}
        </div>

        <div
          style="
            min-width:0;
            flex:1
          ">

          <b>
            ${escapeHtml(
              p.name||"Player"
            )}
          </b>

          ${
            i===0
            ?
            `
              <small
                style="
                  display:block;
                  color:var(--muted)
                ">
                Match host
              </small>
            `
            :
            ""
          }

        </div>

        <span>✓</span>

      </div>

    `
  ).join("");


  $("nxLudoMMCount").textContent=
    `${list.length}/${target} players`;

}


/* =========================================================
   RANDOM LUDO MATCHMAKING
========================================================= */

async function nxLudoFind(target){

  if(!NEXORA.user)
    return toast(
      "Pehle login karo",
      "error"
    );


  nxCloseMM();


  const ch=sb.channel(
    "nx-ludo-mm-"+target,
    {
      config:{
        presence:{
          key:NEXORA.user.id
        }
      }
    }
  );


  NXLM={
    ch,
    target,
    t:Date.now(),
    timer:null
  };


  /* -------------------------------------------------------
     PRESENCE
  ------------------------------------------------------- */

  ch.on(
    "presence",
    {event:"sync"},
    ()=>{

      if(
        !NXLM ||
        NXLM.ch!==ch
      )return;


      const list=
        nxPlayersFromPresence(ch);


      nxLudoMMUI(
        target,
        list
      );


      /*
        Target number mil gaya.
        Sabse pehle join hua player host hoga.
      */

      if(list.length>=target){

        const selected=
          list.slice(0,target);

        if(
          selected.some(
            p=>
              p.id===
              NEXORA.user.id
          )
        ){

          /*
            Sirf host start karega.
          */

          if(
            list[0]?.id===
            NEXORA.user.id
          ){

            const msg={

              t:"nxmix-start",

              from:
                NEXORA.user.id,

              host:
                NEXORA.user.id,

              players:
                selected,

              botCount:0,

              code:
                "mm"+
                Date.now()
                  .toString(36)

            };


            ch.send({
              type:"broadcast",
              event:"g",
              payload:msg
            });


            nxCloseMM();

            closeModal();

            nxStartMixedGame(
              selected,
              0,
              msg.code,
              msg.host
            );

          }

        }

      }

    }
  );


  /* -------------------------------------------------------
     START MESSAGE
  ------------------------------------------------------- */

  ch.on(
    "broadcast",
    {event:"g"},
    ({payload:m})=>{

      if(
        !m ||
        m.from===
        NEXORA.user.id
      )return;


      if(
        m.t!=="nxmix-start"
      )return;


      const selected=
        m.players||[];


      /*
        Selected player hai
      */

      if(
        selected.some(
          p=>
            p.id===
            NEXORA.user.id
        )
      ){

        nxCloseMM();

        nxStartMixedGame(
          selected,
          m.botCount||0,
          m.code,
          m.host
        );

      }

      /*
        Match mein select nahi hua
      */

      else{

        nxCloseMM();

        closeModal();

        toast(
          "Match full ho gaya — dobara search kar rahe hain…"
        );

        setTimeout(
          ()=>
            nxLudoFind(target),
          700
        );

      }

    }
  );


  /* -------------------------------------------------------
     SUBSCRIBE
  ------------------------------------------------------- */

  await new Promise(
    resolve=>
      ch.subscribe(
        s=>{
          if(
            s==="SUBSCRIBED"
          )
            resolve();
        }
      )
  );


  if(
    !NXLM ||
    NXLM.ch!==ch
  )return;


  await ch.track({

    id:
      NEXORA.user.id,

    name:
      myName(),

    t:
      NXLM.t

  });


  /* -------------------------------------------------------
     12 SECOND FALLBACK
  ------------------------------------------------------- */

  NXLM.timer=setTimeout(()=>{

    if(
      !NXLM ||
      NXLM.ch!==ch
    )return;


    const list=
      nxPlayersFromPresence(ch);


    /*
      At least 2 humans mil gaye.
    */

    if(list.length>=2){

      const host=list[0];


      /*
        Host ko choice milegi.
      */

      if(
        host.id===
        NEXORA.user.id
      ){

        nxShowFillChoice(
          target,
          list
        );

      }

    }

    else{

      nxCloseMM();

      openModal(`

        <div class="modal-title">
          Ludo 🎲
        </div>

        <div class="modal-sub">
          Abhi 2 players nahi mile.
        </div>

        <button
          class="btn primary-btn"
          style="
            width:100%;
            margin-bottom:8px
          "
          onclick="
            NX_LUDO_MULTI.botOnly(${target})
          ">

          🤖 Bots ke saath khelo

        </button>

        <button
          class="btn"
          style="width:100%"
          onclick="
            NX_LUDO_MULTI.find(${target})
          ">

          🔄 Dobara search

        </button>

      `);

    }

  },12000);

}


/* =========================================================
   HUMAN + BOT CHOICE
========================================================= */

function nxShowFillChoice(
  target,
  list
){

  if(!NXLM)return;


  const maxBots=
    Math.max(
      0,
      4-list.length
    );


  const humans=
    list.slice(
      0,
      Math.min(
        target,
        list.length
      )
    );


  const h=
    humans.length;


  openModal(`

    <div class="modal-title">
      🎲 Match mil gaya
    </div>

    <div class="modal-sub">
      ${h} human players mil gaye.
      Ab game kaise start karna hai?
    </div>

    <div class="nx-lm-list">

      ${
        humans.map(
          p=>`

            <div
              class="nx-lm-player">

              <div class="avatar">
                ${escapeHtml(
                  initials(p.name)
                )}
              </div>

              <b>
                ${escapeHtml(
                  p.name
                )}
              </b>

            </div>

          `
        ).join("")
      }

    </div>


    <div class="nx-lm-actions">

      <button
        class="btn primary-btn"
        onclick="
          NX_LUDO_MULTI.startHumans(${h})
        ">

        👥 ${h} Players

      </button>


      ${
        maxBots>0
        ?
        Array.from(
          {length:maxBots},
          (_,i)=>`

            <button
              class="btn nx-lm-bot"
              onclick="
                NX_LUDO_MULTI.startBots(${i+1})
              ">

              🤖 +${i+1}
              Bot${i+1>1?"s":""}

            </button>

          `
        ).join("")
        :
        ""
      }

    </div>


    <div
      style="
        margin-top:8px;
        color:var(--muted);
        font-size:12px;
        text-align:center
      ">

      Total players maximum 4 honge.

    </div>

  `);

}


/* =========================================================
   START HUMAN/BOT MIX
========================================================= */

function nxStartChoice(
  botCount
){

  if(!NXLM)return;


  const list=
    nxPlayersFromPresence(
      NXLM.ch
    );


  const humans=
    list.slice(0,4);


  if(humans.length<2){

    return toast(
      "Kam se kam 2 human players chahiye.",
      "error"
    );

  }


  botCount=Math.max(
    0,
    Math.min(
      4-humans.length,
      Number(botCount)||0
    )
  );


  const host=humans[0];


  const msg={

    t:"nxmix-start",

    from:
      NEXORA.user.id,

    host:
      host.id,

    players:
      humans,

    botCount,

    code:
      "nx"+
      Date.now()
        .toString(36)

  };


  NXLM.ch.send({

    type:"broadcast",

    event:"g",

    payload:msg

  });


  nxCloseMM();

  closeModal();


  nxStartMixedGame(
    humans,
    botCount,
    msg.code,
    host.id
  );

}


/* =========================================================
   CREATE MIXED GAME
========================================================= */

function nxStartMixedGame(
  humans,
  botCount,
  code,
  hostId
){

  if(
    !humans?.some(
      x=>
        x.id===
        NEXORA.user.id
    )
  )return;


  botCount=Math.max(
    0,
    Math.min(
      4-humans.length,
      Number(botCount)||0
    )
  );


  const players=
    humans.map(
      x=>({
        id:x.id,
        name:x.name,
        bot:false
      })
    );


  for(
    let i=0;
    i<botCount;
    i++
  ){

    players.push({

      id:
        "bot-"+(i+1),

      name:
        "Bot "+(i+1),

      bot:true

    });

  }


  const names=
    players.map(
      x=>x.name
    );


  const me=
    players.findIndex(
      x=>
        x.id===
        NEXORA.user.id
    );


  /*
    Existing Ludo renderer.
  */

  startLudo(
    "online",
    names,
    me,
    players.length
  );


  LUDO.nxMixed=true;

  LUDO.nxHostId=
    hostId;

  LUDO.nxCode=
    code;

  LUDO.nxPlayers=
    players;

  LUDO.nxHumanIds=
    humans.map(
      x=>x.id
    );

  LUDO.nxOriginalMe=
    me;

  LUDO.nxBotCount=
    botCount;

  LUDO.nxRematch={};


  LUDO.players.forEach(
    (p,i)=>{

      p.id=
        players[i].id;

      p.bot=
        !!players[i].bot;

      p.gone=false;

    }
  );


  /*
    Mixed match ka realtime room.
  */

  if(!LROOM){

    const ch=
      sb.channel(
        "ludo-mixed-"+code
      );


    LROOM=ch;

    ch.code=code;

    ch.host=
      NEXORA.user.id===
      hostId;


    ch.on(
      "broadcast",
      {event:"g"},
      ({payload:m})=>
        onLudoMsg(m)
    );


    ch.subscribe();

  }


  closeModal();

  renderLudo();


  if(
    NEXORA.user.id===
    hostId
  ){

    nxMixedBotTurn();

  }

}


/* =========================================================
   MIXED GAME MESSAGE LAYER
========================================================= */

const nxOldLudoMsg=
  onLudoMsg;


onLudoMsg=
async function(m){

  if(
    m?.from===
    NEXORA.user?.id
  )return;


  const L=LUDO;


  if(L?.nxMixed){

    /* -----------------------------------------
       REMATCH REQUEST
    ----------------------------------------- */

    if(
      m?.t===
      "nxmix-rematch-request"
    ){

      L.nxRematch=
        L.nxRematch||{};


      L.nxRematch[
        m.from
      ]=true;


      if(
        NEXORA.user.id===
        L.nxHostId
      ){

        const ready=
          L.nxHumanIds.every(
            id=>
              L.nxRematch[id]
          );


        if(ready)
          nxMixedBroadcastRematch();

      }


      nxMixedRematchUI();

      return;

    }


    /* -----------------------------------------
       REMATCH START
    ----------------------------------------- */

    if(
      m?.t===
      "nxmix-rematch-start"
    ){

      const humans=
        L.nxPlayers.filter(
          p=>!p.bot
        );


      nxStartMixedGame(
        humans,
        L.nxBotCount,
        L.nxCode,
        L.nxHostId
      );


      return;

    }


    /* -----------------------------------------
       ROLL
    ----------------------------------------- */

    if(m?.t==="roll"){

      if(
        !L.rolling &&
        !L.dice &&
        !L.winner
      ){

        try{

          await animateRoll(
            m.d
          );

        }catch(_){}

      }

      return;

    }


    /* -----------------------------------------
       MOVE
    ----------------------------------------- */

    if(m?.t==="mv"){

      let tries=0;


      while(
        LUDO===L &&
        !L.dice &&
        tries++<25
      ){

        await sleep(50);

      }


      if(
        LUDO===L &&
        L.dice &&
        !L.busy &&
        !L.winner
      ){

        try{

          await commit(
            cur(),
            m.i
          );

        }catch(_){}

      }


      return;

    }


    /* -----------------------------------------
       SNAPSHOT
    ----------------------------------------- */

    if(
      m?.t===
      "nxmix-snap"
    ){

      nxMixedApplySnapshot(
        m.s
      );

      return;

    }


    /* -----------------------------------------
       LEAVE
    ----------------------------------------- */

    if(
      m?.t===
      "nxmix-leave"
    ){

      const p=
        L.players.find(
          x=>x.id===m.from
        );


      if(p){

        p.gone=true;

        toast(
          p.name+
          " game se chala gaya"
        );

        updateLudo();

      }

      return;

    }

  }


  return nxOldLudoMsg(m);

};


/* =========================================================
   MIXED SNAPSHOT
========================================================= */

function nxMixedSnapshot(){

  const L=LUDO;

  if(!L?.nxMixed)
    return null;


  return {

    turn:
      L.turn,

    dice:
      L.dice,

    sixes:
      L.sixes,

    winner:
      L.winner||null,

    message:
      L.message,

    players:
      L.players.map(
        p=>({

          id:p.id,

          name:p.name,

          bot:
            !!p.bot,

          gone:
            !!p.gone,

          tokens:
            p.tokens.slice()

        })
      )

  };

}


function nxMixedApplySnapshot(s){

  const L=LUDO;

  if(
    !L?.nxMixed ||
    !s
  )return;


  L.players.forEach(
    (p,i)=>{

      const q=
        s.players?.[i];


      if(!q)return;


      p.tokens=
        (
          q.tokens||
          [-1,-1,-1,-1]
        ).slice();


      p.gone=
        !!q.gone;

      p.bot=
        !!q.bot;

    }
  );


  L.turn=
    Number(
      s.turn||0
    );


  L.dice=
    s.dice==null
    ?
    null
    :
    Number(s.dice);


  L.sixes=
    Number(
      s.sixes||0
    );


  L.winner=
    s.winner||null;


  L.message=
    s.message||
    cur().name+
    " ki baari";


  nxEnsureLudoSpr();

  updateLudo();

}


function nxMixedBroadcastSnapshot(){

  const L=LUDO;


  if(
    !L?.nxMixed ||
    NEXORA.user.id!==
      L.nxHostId ||
    !LROOM
  )return;


  lsend({

    t:"nxmix-snap",

    s:
      nxMixedSnapshot()

  });

}


/* =========================================================
   BOT TURN
========================================================= */

const nxOldBotTurn=
  botTurn;


botTurn=function(){

  const L=LUDO;


  if(!L?.nxMixed)
    return nxOldBotTurn();


  if(
    NEXORA.user.id!==
    L.nxHostId ||
    L.winner
  )return;


  const pl=
    L.players[L.turn];


  if(!pl)return;


  /*
    Human turn.
  */

  if(!pl.bot){

    L.me=
      L.nxOriginalMe;

    return;

  }


  if(L.nxBotBusy)
    return;


  L.nxBotBusy=true;

  /*
    Host temporarily becomes
    the bot seat.
  */

  L.me=L.turn;


  setTimeout(
    async()=>{

      if(
        LUDO!==L ||
        L.winner ||
        !L.nxMixed
      ){

        L.nxBotBusy=false;

        return;

      }


      const current=
        L.players[L.turn];


      if(!current?.bot){

        L.nxBotBusy=false;

        L.me=
          L.nxOriginalMe;

        return;

      }


      try{

        /*
          Existing dice animation.
        */

        nxLegacyRollLudoDice();


        let tries=0;


        while(
          LUDO===L &&
          L.rolling &&
          tries++<30
        ){

          await sleep(50);

        }


        await sleep(120);


        if(
          LUDO!==L ||
          L.winner
        ){

          L.nxBotBusy=false;

          return;

        }


        const mv=
          getMovable();


        if(
          L.dice!=null &&
          mv.length
        ){

          await nxLegacyPlayMove(
            robotPick(
              cur(),
              mv,
              L.dice
            )
          );

        }

      }catch(e){

        console.warn(
          "mixed bot",
          e
        );

      }


      L.nxBotBusy=false;

      nxMixedBroadcastSnapshot();

      botTurn();

    },
    650
  );

};


/* =========================================================
   MIXED HUMAN ROLL
========================================================= */

const nxCurrentRoll=
  window.rollLudoDice;


const nxCurrentPlay=
  window.playMove;


window.rollLudoDice=
rollLudoDice=
async function(){

  const L=LUDO;


  if(!L?.nxMixed)
    return nxCurrentRoll();


  if(
    L.winner ||
    L.rolling ||
    L.busy ||
    L.dice
  )return;


  const pl=
    L.players[L.turn];


  if(!pl||pl.bot)
    return;


  if(
    pl.id!==
    NEXORA.user.id
  )return;


  return nxLegacyRollLudoDice();

};


/* =========================================================
   MIXED HUMAN MOVE
========================================================= */

window.playMove=
playMove=
async function(i){

  const L=LUDO;


  if(!L?.nxMixed)
    return nxCurrentPlay(i);


  const pl=
    L.players[L.turn];


  if(
    !pl ||
    pl.bot ||
    pl.id!==
      NEXORA.user.id ||
    L.dice==null ||
    L.busy ||
    L.winner
  )return;


  return nxLegacyPlayMove(i);

};


/* =========================================================

========================================================= */

const nxCommitMixed=
  commit;


commit=
async function(pl,i){

  const L=LUDO;


  const r=
    await nxCommitMixed(
      pl,
      i
    );


  if(
    L?.nxMixed &&
    NEXORA.user.id===
      L.nxHostId
  ){

    nxMixedBroadcastSnapshot();

  }


  return r;

};

}

  position:fixed;
  z-index:99992;
  padding:7px 11px;
  border-radius:10px;
  background:rgba(10,14,23,.94);
  color:#fff;
  font-size:11px;
  font-weight:700;
  pointer-events:none;
  opacity:0;
  transform:translateY(5px);
  transition:.2s;
