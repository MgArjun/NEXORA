.X{color:#9aa7ff}.O{color:#ff8999}

<script>
"use strict";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const ini=s=>String(s||"?").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const tm=s=>new Date(s).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const toast=(s)=>{const e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2400)};
const vib=n=>navigator.vibrate?.(n);
const I={
 back:"‹",send:"➤",phone:"☎",game:"♟",mic:"🎙️",micoff:"🔇",
 close:"×",check:"✓",x:"✕"
};

const CFG={
 supabaseUrl:"https://YOUR-PROJECT.supabase.co",
 supabaseKey:"YOUR-SUPABASE-ANON-KEY",
 turn:[],
 metered:{app:"",key:""}
};

const sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);

const S={
 user:null,me:null,page:"home",live:1,convs:[],chat:null,cch:null,
 room:null,g:null,pend:null,inreq:null
};

const PR={
 calls:true,hide:false,sounds:true
};

let audioCtx=null;
function tone(freq=440,d=.08,type="sine",gain=.035){
 if(!PR.sounds)return;
 try{
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=gain;
  o.connect(g);g.connect(audioCtx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
  o.stop(audioCtx.currentTime+d);
 }catch(_){}
}
function sfx(k){
 const m={
  send:[720,.06,"sine",.025],recv:[520,.08,"sine",.025],
  ring:[660,.18,"sine",.035],up:[880,.12,"sine",.04],
  down:[260,.14,"sine",.035],win:[980,.16,"triangle",.05],
  dice:[210,.1,"square",.025],card:[540,.08,"triangle",.035],
  uno:[1040,.15,"triangle",.05],error:[180,.12,"sawtooth",.025]
 };
 const a=m[k];if(a)tone(...a);
}
document.addEventListener("pointerdown",()=>{try{audioCtx?.resume()}catch(_){}},{once:true});

function myName(){return S.me?.display_name||S.me?.username||S.user?.email?.split("@")[0]||"Guest"}
function nm(x){return x||"User"}

function amsg(s,t="e"){
 const e=$("amsg");e.textContent=s||"";
 e.style.color=t==="o"?"#7ce3ae":"#ff9aa8";
}

function authMode(sign){
 $("fL").classList.toggle("h",sign);
 $("fS").classList.toggle("h",!sign);
 $("swT").textContent=sign?"Already have an account?":"New here?";
 $("swB").textContent=sign?"Log in":"Create account";
 amsg("");
}

$("swB").onclick=()=>authMode($("fS").classList.contains("h"));
const busy=b=>["bL","bG","bS"].forEach(i=>$(i).disabled=b);

async function ensureProfile(u){
 try{
  const{data}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(data)return data;
  const m=u.user_metadata||{},n=m.display_name||(u.email?u.email.split("@")[0]:"Guest");
  let un=n.toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,12);
  if(un.length<3)un="user";
  un+="_"+u.id.replace(/-/g,"").slice(0,5);
  const{data:c}=await sb.from("profiles").insert({
   id:u.id,username:un,display_name:n,is_guest:!!u.is_anonymous,
   online:true,last_seen:new Date().toISOString()
  }).select("*").maybeSingle();
  return c;
 }catch(_){return null}
}

async function enter(u){
 S.user=u;
 $("auth").classList.add("h");
 $("shell").classList.remove("h");
 S.me=await ensureProfile(u);
 paintAv();
 go("home");
 startSig();
 startLive();
 setOnline(true);
 checkNotes();
}

const paintAv=()=>$("prof").textContent=ini(myName());

$("bL").onclick=async()=>{
 const email=$("em").value.trim(),password=$("pw").value;
 if(!email||!password)return amsg("Enter your email and password.","e");
 busy(1);amsg("Signing in…");
 try{
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)throw error;
  await enter(data.user);
 }catch(e){amsg(e.message,"e")}
 busy(0);
};

$("bG").onclick=async()=>{
 busy(1);amsg("Opening guest mode…");
 try{
  const{data,error}=await sb.auth.signInAnonymously();
  if(error)throw error;
  amsg("");await enter(data.user);
 }catch(e){
  amsg(/anonymous/i.test(e.message)?"Guest mode is turned off in Supabase Auth.":e.message,"e")
 }
 busy(0);
};

$("bS").onclick=async()=>{
 const name=$("sn").value.trim(),email=$("se").value.trim(),password=$("sp").value;
 if(!name||!email)return amsg("Fill in every field.","e");
 if(password.length<6)return amsg("Password needs at least 6 characters.","e");
 busy(1);amsg("Creating your account…");
 try{
  const{data,error}=await sb.auth.signUp({
   email,password,options:{data:{display_name:name}}
  });
  if(error)throw error;
  if(data.session)await enter(data.user);
  else{
   authMode(false);
   amsg("Account created. Confirm your email, then log in.","o")
  }
 }catch(e){amsg(e.message,"e")}
 busy(0);
};

[["em","bL"],["pw","bL"],["sp","bS"]].forEach(([i,b])=>
 $(i).addEventListener("keydown",e=>{if(e.key==="Enter")$(b).click()})
);

async function logout(){
 endCall();
 stopRM();
 closeRoom(true);
 try{
  await sb.from("profiles").update({
   online:false,last_seen:new Date().toISOString()
  }).eq("id",S.user.id)
 }catch(_){}
 [SIG,LV,S.cch].forEach(c=>c&&sb.removeChannel(c));
 SIG=LV=null;
 await sb.auth.signOut();
 S.user=S.me=null;
 $("shell").classList.add("h");
 $("auth").classList.remove("h");
 authMode(false);
}

const setOnline=on=>S.user&&sb.from("profiles").update({
 online:on&&!PR.hide,last_seen:new Date().toISOString()
}).eq("id",S.user.id).then(()=>{},()=>{});

let LV=null;
function startLive(){
 if(LV)sb.removeChannel(LV);
 const ch=LV=sb.channel("nx-live",{config:{presence:{key:S.user.id}}});
 ch.on("presence",{event:"sync"},()=>{
  S.live=Math.max(1,Object.keys(ch.presenceState()).length);
  const e=$("liveN");
  if(e)e.textContent=S.live+(S.live===1?" person":" people")+" online"
 });
 ch.subscribe(async s=>{
  if(s==="SUBSCRIBED")
   try{await ch.track({at:Date.now()})}catch(_){}
 })
}

/* ---------- signaling (ack + retry + watchdog) ---------- */
let SIG=null,sigP=null;

async function startSig(){
 if(SIG){try{await sb.removeChannel(SIG)}catch(_){}}
 const ch=SIG=sb.channel("nx-signal",{config:{broadcast:{ack:true}}});
 ch.on("broadcast",{event:"s"},({payload:p})=>{
  if(p&&p.to===S.user?.id)onSig(p)
 });
 await new Promise(r=>{
  ch.subscribe(s=>{if(s==="SUBSCRIBED")r()});
  setTimeout(r,6000)
 })
}

const ensureSig=()=>sigP||(sigP=startSig().finally(()=>sigP=null));

async function sig(p){
 for(let i=0;i<3;i++){
  if(!SIG||SIG.state!=="joined")await ensureSig();
  try{
   const r=await SIG.send({
    type:"broadcast",event:"s",
    payload:{...p,from:S.user.id}
   });
   if(r==="ok")return true
  }catch(_){}
  await sleep(400*(i+1))
 }
 return false
}

const net=(t,c)=>{
 const e=$("net");
 if(!t)return e.classList.remove("show");
 e.textContent=t;
 e.style.background=c;
 e.classList.add("show")
};

let NS="ok";
setInterval(()=>{
 if(!S.user)return;
 const on=navigator.onLine,ok=SIG?.state==="joined";
 if(on&&!ok&&!sigP)ensureSig();
 const st=!on?"off":ok?"ok":"rec";
 if(st===NS)return;
 const was=NS;NS=st;
 if(st==="off")net("📡 Internet nahi hai","#ff4d63");
 else if(st==="rec")net("🔄 Reconnecting…","#e0a000");
 else if(was!=="ok"){
  net("✓ Back online","#1fae6a");
  setTimeout(()=>NS==="ok"&&net(),2000)
 }
},2000);

addEventListener("online",()=>{
 if(S.user){
  ensureSig();
  setOnline(true);
  document.querySelectorAll(".m.fail u").forEach(u=>u.click())
 }
});

const PRE={};

function onSig(p){
 const t=p.type;
 if(t==="offer")return onOffer(p);
 if(t==="greq")return gotReq(p);
 if(t==="gacc"){
  if(S.pend?.code===p.code)toast("Accept ho gaya, game shuru…");
  return
 }
 if(t==="gdec"){
  if(S.pend?.code===p.code){
   S.pend=null;
   closeRoom(false);
   closeModal();
   toast("Dost ne game se mana kiya")
  }
  return
 }
 if(t==="gcan"){
  if(S.inreq?.code===p.code){
   S.inreq=null;
   closeModal();
   toast("Request cancel ho gayi")
  }
  return
 }
 if(t==="ice"){
  if(!C||p.id!==C.id){
   (PRE[p.id]=PRE[p.id]||[]).push(p.c);
   return
  }
  C.pc?.remoteDescription?
   C.pc.addIceCandidate(p.c).catch(()=>{}):
   C.q.push(p.c);
  return
 }
 if(!C||p.id!==C.id)return;
 if(t==="ring"){
  C.ringing=true;
  clearInterval(C.rs2);
  paintCall()
 }
 else if(t==="answer"){
  if(C.st==="calling"){
   C.st="connecting";
   clearTimeout(C.to);
   C.ct=setTimeout(()=>{
    if(C&&C.st!=="on"){
     toast("Call connect nahi ho payi");
     endCall()
    }
   },45000)
  }
  paintCall();
  C.pc.setRemoteDescription(p.sdp).then(()=>flush(C)).catch(()=>{})
 }
 else if(t==="reoffer")onReoffer(p);
 else if(t==="nudge"){
  if(C.init)restartIce(C)
 }
 else if(t==="end"||t==="busy"||t==="decl"){
  const r=C.random;
  toast(t==="busy"?"User abhi busy hai":t==="decl"?"Call decline hui":"Call khatam");
  endCall(1);
  if(r)strangerGone()
 }
}

/* ---------- voice calls (work on every page, auto-reconnect) ---------- */
let C=null,RING=null,WL=null;
const ENDED=new Map(),isEnded=id=>ENDED.has(id)&&Date.now()-ENDED.get(id)<12e4;
let ICE_C=null,ICE_T=0;

async function iceServers(){
 if(ICE_C&&Date.now()-ICE_T<36e5)return ICE_C;
 const s=[
  {urls:[
   "stun:stun.l.google.com:19302",
   "stun:stun1.l.google.com:19302",
   "stun:stun.cloudflare.com:3478"
  ]},
  ...CFG.turn
 ];
 const m=CFG.metered;
 if(m.app&&m.key){
  try{
   const r=await fetch(
    `https://${m.app}.metered.live/api/v1/turn/credentials?apiKey=${m.key}`
   );
   if(r.ok)s.push(...await r.json())
  }catch(_){}
 }
 ICE_T=Date.now();
 return ICE_C=s
}

async function mic(){
 if(!navigator.mediaDevices?.getUserMedia)
  throw new Error("Microphone ke liye Chrome/Safari par HTTPS site kholo.");
 try{
  return await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   },
   video:false
  })
 }catch(e){
  throw new Error(
   e.name==="NotAllowedError"?"Browser settings me Microphone allow karo.":
   e.name==="NotFoundError"?"Microphone nahi mila.":
   e.name==="NotReadableError"?"Microphone kisi aur app me chal raha hai.":
   "Microphone shuru nahi hua."
  )
 }
}

async function wake(on){
 try{
  if(on&&!WL&&navigator.wakeLock)
   WL=await navigator.wakeLock.request("screen");
  if(!on&&WL){
   await WL.release();
   WL=null
  }
 }catch(_){}
}

function startRing(){
 stopRing();
 RING=setInterval(()=>{
  if(!C)return stopRing();
  if(C.st==="ringing"){
   sfx("ring");
   vib(200)
  }else if(C.st==="calling"){
   tone(440,.4,"sine",.04)
  }
 },1800)
}

const stopRing=()=>{clearInterval(RING);RING=null};

async function mkPc(c){
 const pc=new RTCPeerConnection({
  iceServers:await iceServers(),
  iceCandidatePoolSize:2
 });
 c.pc=pc;
 c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));

 pc.onicecandidate=e=>{
  if(e.candidate)
   sig({type:"ice",to:c.uid,id:c.id,c:e.candidate})
 };

 pc.ontrack=e=>{
  let a=$("ra");
  if(!a){
   a=document.createElement("audio");
   a.id="ra";
   a.autoplay=true;
   a.playsInline=true;
   document.body.appendChild(a)
  }
  a.srcObject=e.streams[0];
  a.play().catch(()=>{})
 };

 pc.oniceconnectionstatechange=()=>{
  if(C!==c)return;
  const s=pc.iceConnectionState;

  if(s==="connected"||s==="completed"){
   clearTimeout(c.t1);
   clearTimeout(c.dead);
   clearTimeout(c.ct);

   if(c.st!=="on"){
    c.st="on";
    c.t0=Date.now();
    sfx("up");
    vib(60);
    wake(true)
   }else if(c.net){
    toast("Connection wapas aa gaya ✓")
   }

   c.net=0;
   paintCall()
  }
  else if(s==="disconnected"){
   c.net="unstable";
   paintCall();
   clearTimeout(c.t1);
   c.t1=setTimeout(()=>recover(c),2500)
  }
  else if(s==="failed"){
   c.net="reconnecting";
   paintCall();
   recover(c)
  }
 };

 return pc
}

const flush=c=>{
 while(c.q.length)
  c.pc.addIceCandidate(c.q.shift()).catch(()=>{})
};

const okIce=c=>["connected","completed"].includes(c.pc.iceConnectionState);

function recover(c){
 if(C!==c||c.rec)return;
 c.net="reconnecting";
 paintCall();
 kick(c);

 c.rec=setInterval(()=>{
  if(C!==c||okIce(c)){
   clearInterval(c.rec);
   c.rec=0;
   return
  }
  kick(c)
 },5000);

 c.dead=setTimeout(()=>{
  if(C===c&&!okIce(c)){
   toast("Call drop ho gayi");
   endCall()
  }
 },45000)
}

function kick(c){
 if(C!==c||navigator.onLine===false)return;
 c.init?restartIce(c):sig({
  type:"nudge",
  to:c.uid,
  id:c.id
 })
}

async function restartIce(c){
 const pc=c.pc;
 if(!pc||c.rs||pc.signalingState!=="stable")return;
 c.rs=1;
 try{
  pc.restartIce?.();
  await pc.setLocalDescription(
   await pc.createOffer({iceRestart:true})
  );
  await sig({
   type:"reoffer",
   to:c.uid,
   id:c.id,
   sdp:pc.localDescription
  })
 }catch(_){}
 c.rs=0
}

async function onReoffer(p){
 const c=C;
 try{
  await c.pc.setRemoteDescription(p.sdp);
  flush(c);
  await c.pc.setLocalDescription(await c.pc.createAnswer());
  await sig({
   type:"answer",
   to:c.uid,
   id:c.id,
   sdp:c.pc.localDescription
  })
 }catch(_){}
}

async function startCall(uid,name,random){
 if(uid===S.user.id)return;
 if(C)return toast("Aap pehle se call me ho");

 let stream;
 try{
  stream=await mic()
 }catch(e){
  return toast(e.message)
 }

 if(C){
  stream.getTracks().forEach(t=>t.stop());
  return
 }

 const c=C={
  id:crypto.randomUUID(),
  uid,
  name,
  init:1,
  st:"calling",
  stream,
  q:[],
  random
 };

 paintCall();
 startRing();

 try{
  await mkPc(c);
  await c.pc.setLocalDescription(await c.pc.createOffer())
 }catch(_){
  toast("Call shuru nahi ho payi");
  return endCall(1)
 }

 const m={
  type:"offer",
  to:uid,
  id:c.id,
  name:myName(),
  random:!!random,
  sdp:c.pc.localDescription
 };

 if(!await sig(m)){
  toast("Internet check karo");
  return endCall(1)
 }

 let n=0;
 c.rs2=setInterval(()=>{
  if(C!==c||c.ringing||c.st!=="calling"||++n>10)
   return clearInterval(c.rs2);
  sig(m)
 },2500);

 c.to=setTimeout(()=>{
  if(C===c&&c.st==="calling"){
   toast("Koi jawab nahi");
   endCall()
  }
 },40000)
}

function onOffer(p){
 if(isEnded(p.id))return;

 if(C&&C.id===p.id){
  sig({type:"ring",to:p.from,id:C.id});
  return
 }

 if(C&&C.init&&C.uid===p.from&&C.st==="calling"){
  if(S.user.id<p.from)return;
  endCall(1)
 }

 if(C||!PR.calls){
  sig({
   type:C?"busy":"decl",
   to:p.from,
   id:p.id
  });
  return
 }

 const c=C={
  id:p.id,
  uid:p.from,
  name:p.name||"Caller",
  st:"ringing",
  sdp:p.sdp,
  q:PRE[p.id]||[]
 };

 delete PRE[p.id];

 sig({type:"ring",to:p.from,id:c.id});

 if(p.random&&RM?.kind==="call"){
  stopRM();
  closeModal();
  return accept()
 }

 paintCall();
 startRing();

 c.to=setTimeout(()=>{
  if(C===c&&c.st==="ringing"){
   sig({type:"end",to:c.uid,id:c.id});
   endCall(1)
  }
 },40000)
}

async function accept(){
 const c=C;
 if(!c||c.st!=="ringing")return;

 stopRing();
 clearTimeout(c.to);

 let stream;
 try{
  stream=await mic()
 }catch(e){
  toast(e.message);
  sig({type:"decl",to:c.uid,id:c.id});
  return endCall(1)
 }

 if(C!==c){
  stream.getTracks().forEach(t=>t.stop());
  return
 }

 c.stream=stream;
 c.st="connecting";
 paintCall();

 c.ct=setTimeout(()=>{
  if(C===c&&c.st!=="on"){

async function fetchNew(first){
 const c=S.chat;
 if(!c)return;

 const{data}=await sb.from("messages")
  .select("*")
  .eq("conversation_id",c.cid)
  .order("created_at",{ascending:true})
  .limit(300);

 if(S.chat!==c)return;

 (data||[]).forEach(m=>{
  if(first||m.sender_id!==S.user.id)addMsg(m,first)
 })
}

function addBubble(m,meta){
 const b=$("cb");
 if(!b)return null;

 const mine=m.sender_id===S.user.id;

 b.insertAdjacentHTML(
  "beforeend",
  `<div class="m ${mine?"me":"th"}">
   ${esc(m.message)}
   <small>${meta}</small>
  </div>`
 );

 b.scrollTop=b.scrollHeight;
 return b.lastElementChild
}

function addMsg(m,quiet){
 const c=S.chat;
 if(!c||c.seen.has(m.id))return;

 c.seen.add(m.id);

 const mine=m.sender_id===S.user.id;

 addBubble(
  m,
  tm(m.created_at)+(mine?" ✓✓":"")
 );

 if(!mine&&!quiet)sfx("recv")
}

function sendMsg(){
 const i=$("ci");
 const text=i.value.trim().slice(0,2000);
 if(!text||!S.chat)return;

 i.value="";
 sfx("send");

 const cid=S.chat.cid;
 const el=addBubble(
  {sender_id:S.user.id,message:text},
  "🕓 Sending…"
 );

 const go_=async()=>{
  try{
   const{data,error}=await Promise.race([
    sb.from("messages")
     .insert({
      conversation_id:cid,
      sender_id:S.user.id,
      message:text,
      message_type:"text"
     })
     .select()
     .single(),
    sleep(15000).then(()=>({error:{message:"timeout"}}))
   ]);

   if(error)throw error;

   S.chat?.seen.add(data.id);
   el.classList.remove("fail");
   el.querySelector("small").textContent=
    tm(data.created_at)+" ✓✓";
  }
  catch(_){
   el.classList.add("fail");
   const s=el.querySelector("small");
   s.innerHTML="⚠ Not sent · <u>Retry</u>";
   s.querySelector("u").onclick=()=>{
    s.textContent="🕓 Sending…";
    go_()
   }
  }
 };

 go_()
}

 const path=[

  [5,6],[4,6],[3,6],[2,6],[1,6],
  [0,6],[0,7],[0,8],[1,8],[2,8],

  [4,0],[3,0],[2,0],[1,0],[0,0],
  [0,1],[0,2]
 ];

 return path[idx]||[7,7]
}

async function animateRoll(force){
 if(!LUDO2||LUDO2.winner||LUDO2.rolling||LUDO2.dice!==null)return;
 if(!isMine2())return;

 LUDO2.rolling=true;
 updateLudo();

 const d=force||rnd6();

 for(let i=0;i<8;i++){
  const x=rnd6();
  LUDO2.dice=x;
  updateLudo();
  tone(220+i*20,.05,"square",.025);
  await sleep(70)
 }

 LUDO2.dice=d;
 LUDO2.rolling=false;
 sfx("dice");

 if(LUDO2.mode==="online")
  lsend2({t:"roll",d});

 updateLudo();

 const pl=cur2();
 const mv=pl.tokens
  .map((x,i)=>canMove2(x,d)?i:-1)
  .filter(x=>x>=0);

 if(!mv.length){
  await sleep(500);
  LUDO2.dice=null;
  endTurn();
  return
 }

 if(LUDO2.mode==="robot"&&LUDO2.turn===1){
  await sleep(650);
  return playMove(robotPick(pl,mv,d))
 }

 if(mv.length===1){
  await sleep(450);
  playMove(mv[0])
 }
}

/* ---------- initial navigation binding ---------- */
$("prof").onclick=()=>renderSettings();

window.addEventListener("online",()=>{
 if(S.user){
  setOnline(true);
  ensureSig()
 }
});

window.addEventListener("offline",()=>{
 if(S.user)net("📡 Internet nahi hai","#ff4d63")
});

/* ---------- auth state ---------- */
sb.auth.onAuthStateChange(async(event,session)=>{
 if(event==="SIGNED_IN"&&session?.user&&!S.user){
  await enter(session.user)
 }

 if(event==="SIGNED_OUT"){
  S.user=null;
  S.me=null;
 }
});

/* ---------- notification refresh ---------- */
setInterval(()=>{
 if(S.user)checkNotes()
},30000);

/* ---------- call reconnect after wake ---------- */
document.addEventListener("visibilitychange",()=>{
 if(!document.hidden&&C?.pc){
  if(C.pc.iceConnectionState==="disconnected"||
     C.pc.iceConnectionState==="failed"){
   recover(C)
  }
 }
});

/* ---------- keyboard shortcuts ---------- */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  if(!$("ov").classList.contains("h"))closeModal();
 }
});

/* ---------- prevent accidental browser zoom / gestures ---------- */
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("gesturechange",e=>e.preventDefault());
document.addEventListener("gestureend",e=>e.preventDefault());

/* ---------- final safety boot ---------- */
if(!S.user){
 setTimeout(()=>{
  if(!$("splash")&&!S.user){
   $("auth").classList.remove("h")
  }
 },3000)
}
